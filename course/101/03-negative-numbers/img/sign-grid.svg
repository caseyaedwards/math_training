<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" font-family="sans-serif" font-size="14" role="img" aria-label="Two by two sign table: same signs give plus, different signs give minus">
<title>Two by two sign table: same signs give plus, different signs give minus</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="480" height="270" fill="#fff"/>
<text x="165.0" y="45.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">+</text>
<text x="95.0" y="113.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">+</text>
<text x="255.0" y="45.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">−</text>
<text x="95.0" y="203.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">−</text>
<rect x="120.0" y="60.0" width="90.0" height="90.0" fill="#f3d9cc" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="165.0" y="115.0" text-anchor="middle" font-size="30" fill="#d9480f" font-weight="bold">+</text>
<rect x="210.0" y="60.0" width="90.0" height="90.0" fill="#fff" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="255.0" y="115.0" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">−</text>
<rect x="120.0" y="150.0" width="90.0" height="90.0" fill="#fff" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="165.0" y="205.0" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">−</text>
<rect x="210.0" y="150.0" width="90.0" height="90.0" fill="#f3d9cc" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="255.0" y="205.0" text-anchor="middle" font-size="30" fill="#d9480f" font-weight="bold">+</text>
<text x="325.0" y="110.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">same signs: +</text>
<text x="325.0" y="140.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">different signs: −</text>
<text x="325.0" y="170.0" text-anchor="start" font-size="13" fill="#666" font-weight="normal">for × and ÷ only</text>
</svg>
