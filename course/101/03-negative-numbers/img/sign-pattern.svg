<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 315" width="560" height="315" font-family="sans-serif" font-size="14" role="img" aria-label="Bar chart of -3 times 2, 1, 0, -1, -2 giving -6, -3, 0, 3, 6, rising by 3 each step">
<title>Bar chart of -3 times 2, 1, 0, -1, -2 giving -6, -3, 0, 3, 6, rising by 3 each step</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="315" fill="#fff"/>
<line x1="70.0" y1="150.0" x2="540.0" y2="150.0" stroke="#222" stroke-width="1.5"/>
<text x="60.0" y="155.0" text-anchor="end" font-size="13" fill="#222" font-weight="normal">0</text>
<rect x="90.0" y="150.0" width="70.0" height="90.0" fill="#f3d9cc" stroke="#222" stroke-width="1.2" rx="0"/>
<text x="125.0" y="290.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">−3 × 2</text>
<text x="125.0" y="258.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">−6</text>
<rect x="180.0" y="150.0" width="70.0" height="45.0" fill="#f3d9cc" stroke="#222" stroke-width="1.2" rx="0"/>
<text x="215.0" y="290.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">−3 × 1</text>
<text x="215.0" y="213.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">−3</text>
<line x1="270.0" y1="150.0" x2="340.0" y2="150.0" stroke="#d9480f" stroke-width="4"/>
<text x="305.0" y="290.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">−3 × 0</text>
<text x="305.0" y="140.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">0</text>
<rect x="360.0" y="105.0" width="70.0" height="45.0" fill="#d9480f" stroke="#222" stroke-width="1.2" rx="0"/>
<text x="395.0" y="290.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">−3 × −1</text>
<text x="395.0" y="97.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">3</text>
<rect x="450.0" y="60.0" width="70.0" height="90.0" fill="#d9480f" stroke="#222" stroke-width="1.2" rx="0"/>
<text x="485.0" y="290.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">−3 × −2</text>
<text x="485.0" y="52.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">6</text>
<text x="280.0" y="22.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Each step right adds 3. The staircase keeps climbing past zero.</text>
</svg>
