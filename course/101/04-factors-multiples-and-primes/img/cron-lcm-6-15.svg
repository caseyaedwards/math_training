<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" width="720" height="215" font-family="sans-serif" font-size="14" role="img" aria-label="Timeline of a 6 minute job and a 15 minute job meeting at 0 and 30 minutes">
