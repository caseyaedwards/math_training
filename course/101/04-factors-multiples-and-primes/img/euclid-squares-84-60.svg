<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 631 310" width="631" height="310" font-family="sans-serif" font-size="14" role="img" aria-label="An 84 by 60 rectangle cut into a 60 square, two 24 squares and two 12 squares; the last square side 12 is the gcd">
<title>An 84 by 60 rectangle cut into a 60 square, two 24 squares and two 12 squares; the last square side 12 is the gcd</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="631" height="310" fill="#fff"/>
<rect x="40.0" y="40.0" width="240.0" height="240.0" fill="#fff" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="160.0" y="165.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">60 × 60</text>
<rect x="280.0" y="40.0" width="96.0" height="96.0" fill="#f3d9cc" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="328.0" y="93.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">24</text>
<rect x="280.0" y="136.0" width="96.0" height="96.0" fill="#f3d9cc" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="328.0" y="189.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">24</text>
<rect x="280.0" y="232.0" width="48.0" height="48.0" fill="#d9480f" stroke="#222" stroke-width="1.8" rx="0"/>
<rect x="328.0" y="232.0" width="48.0" height="48.0" fill="#d9480f" stroke="#222" stroke-width="1.8" rx="0"/>
<rect x="40.0" y="40.0" width="336.0" height="240.0" fill="none" stroke="#222" stroke-width="3" rx="0"/>
<text x="208.0" y="28.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">84</text>
<text x="28.0" y="165.0" text-anchor="end" font-size="14" fill="#222" font-weight="normal">60</text>
<text x="401.0" y="58.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">Cut the biggest square you can.</text>
<text x="401.0" y="82.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">Repeat on what is left.</text>
<text x="401.0" y="106.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal"></text>
<text x="401.0" y="130.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">84 − 60 = 24</text>
<text x="401.0" y="154.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">60 − 24 − 24 = 12</text>
<text x="401.0" y="178.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">24 = 12 + 12: no leftover</text>
<text x="401.0" y="202.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal"></text>
<text x="401.0" y="226.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="bold">Last square side: 12 = gcd</text>
</svg>
