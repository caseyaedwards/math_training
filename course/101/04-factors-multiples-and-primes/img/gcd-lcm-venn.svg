<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" font-family="sans-serif" font-size="14" role="img" aria-label="Venn diagram of the prime factors of 84 and 60; the overlap 2, 2, 3 gives gcd 12 and all factors give lcm 420">
<title>Venn diagram of the prime factors of 84 and 60; the overlap 2, 2, 3 gives gcd 12 and all factors give lcm 420</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="290" fill="#fff"/>
<circle cx="190" cy="150" r="115" fill="#f3d9cc" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<circle cx="330" cy="150" r="115" fill="#f3d9cc" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<text x="150.0" y="30.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">84 = 2 × 2 × 3 × 7</text>
<text x="370.0" y="30.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">60 = 2 × 2 × 3 × 5</text>
<text x="130.0" y="158.0" text-anchor="middle" font-size="24" fill="#222" font-weight="bold">7</text>
<text x="390.0" y="158.0" text-anchor="middle" font-size="24" fill="#222" font-weight="bold">5</text>
<text x="260.0" y="140.0" text-anchor="middle" font-size="22" fill="#d9480f" font-weight="bold">2  2</text>
<text x="260.0" y="172.0" text-anchor="middle" font-size="22" fill="#d9480f" font-weight="bold">3</text>
<text x="480.0" y="100.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">gcd = middle only</text>
<text x="480.0" y="124.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">= 2 × 2 × 3 = 12</text>
<text x="480.0" y="148.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal"></text>
<text x="480.0" y="172.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">lcm = everything</text>
<text x="480.0" y="196.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">= 2 × 2 × 3 × 5 × 7</text>
<text x="480.0" y="220.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">= 420</text>
</svg>
