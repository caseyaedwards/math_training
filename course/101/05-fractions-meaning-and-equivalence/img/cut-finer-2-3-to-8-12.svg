<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" font-family="sans-serif" font-size="14" role="img" aria-label="A bar of thirds with 2 shaded; each third cut into 4 gives 8 of 12 shaded, the same length">
<title>A bar of thirds with 2 shaded; each third cut into 4 gives 8 of 12 shaded, the same length</title>
