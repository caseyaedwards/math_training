<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 185" width="540" height="185" font-family="sans-serif" font-size="14" role="img" aria-label="A bar cut into three equal thirds above a bar cut into three unequal pieces, which are not thirds">
<title>A bar cut into three equal thirds above a bar cut into three unequal pieces, which are not thirds</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="540" height="185" fill="#fff"/>
<rect x="150.0" y="30.0" width="120.0" height="40.0" fill="#f3d9cc" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="270.0" y="30.0" width="120.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="390.0" y="30.0" width="120.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="138.0" y="55.0" text-anchor="end" font-size="14" fill="#222" font-weight="bold">thirds</text>
<rect x="150.0" y="100.0" width="200.0" height="40.0" fill="#f3d9cc" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="350.0" y="100.0" width="90.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="440.0" y="100.0" width="70.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="138.0" y="125.0" text-anchor="end" font-size="14" fill="#d9480f" font-weight="bold">not thirds</text>
<text x="270.0" y="171.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Three pieces is not enough. They must be three equal pieces.</text>
</svg>
