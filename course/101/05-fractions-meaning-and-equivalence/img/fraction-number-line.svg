<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 140" width="700" height="140" font-family="sans-serif" font-size="14" role="img" aria-label="Number line from 0 to 2 in quarters with 3/4 and 5/4 marked">
