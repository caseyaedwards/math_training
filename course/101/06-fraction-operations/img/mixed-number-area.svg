<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.0 240.0" width="600.0" height="240.0" font-family="sans-serif" font-size="14" role="img" aria-label="Area model for 2 1/2 times 1 1/3 split into pieces 2, 1/2, 2/3 and 1/6 totaling 3 1/3">
<title>Area model for 2 1/2 times 1 1/3 split into pieces 2, 1/2, 2/3 and 1/6 totaling 3 1/3</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="600.0" height="240.0" fill="#fff"/>
<rect x="70.0" y="50.0" width="240.0" height="120.0" fill="#f3d9cc" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="190.0" y="115.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">2</text>
<rect x="310.0" y="50.0" width="60.0" height="120.0" fill="#fff" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="340.0" y="115.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">1/2</text>
<rect x="70.0" y="170.0" width="240.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="190.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">2/3</text>
<rect x="310.0" y="170.0" width="60.0" height="40.0" fill="#d9480f" stroke="#222" stroke-width="1.8" rx="0"/>
<text x="340.0" y="195.0" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">1/6</text>
<text x="190.0" y="38.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">2</text>
<text x="340.0" y="38.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">1/2</text>
<text x="58.0" y="115.0" text-anchor="end" font-size="14" fill="#222" font-weight="normal">1</text>
<text x="58.0" y="195.0" text-anchor="end" font-size="14" fill="#222" font-weight="normal">1/3</text>
<text x="400.0" y="80.0" text-anchor="start" font-size="14" fill="#222" font-weight="bold">2 1/2 × 1 1/3</text>
<text x="400.0" y="108.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">= 2 + 1/2 + 2/3 + 1/6</text>
<text x="400.0" y="136.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">= 2 + 8/6</text>
<text x="400.0" y="164.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">= 3 1/3</text>
</svg>
