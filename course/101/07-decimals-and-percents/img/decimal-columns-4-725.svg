<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" font-family="sans-serif" font-size="14" role="img" aria-label="Place value columns for 4.725">
<title>Place value columns for 4.725</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="220" fill="#fff"/>
<rect x="40.0" y="56.0" width="120.0" height="70.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="0"/>
<text x="100.0" y="46.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Ones</text>
<text x="100.0" y="106.0" text-anchor="middle" font-size="36" fill="#222" font-weight="bold">4</text>
<text x="100.0" y="152.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">4 × 1</text>
<text x="100.0" y="176.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">= 4</text>
<circle cx="170.0" cy="118.0" r="5" fill="#222" stroke="none" stroke-width="2"/>
<rect x="180.0" y="56.0" width="120.0" height="70.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="0"/>
<text x="240.0" y="46.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Tenths</text>
<text x="240.0" y="106.0" text-anchor="middle" font-size="36" fill="#222" font-weight="bold">7</text>
<text x="240.0" y="152.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">7 × 1/10</text>
<text x="240.0" y="176.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">= 0.7</text>
<rect x="300.0" y="56.0" width="120.0" height="70.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="0"/>
<text x="360.0" y="46.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Hundredths</text>
<text x="360.0" y="106.0" text-anchor="middle" font-size="36" fill="#222" font-weight="bold">2</text>
<text x="360.0" y="152.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">2 × 1/100</text>
<text x="360.0" y="176.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">= 0.02</text>
<rect x="420.0" y="56.0" width="120.0" height="70.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="0"/>
<text x="480.0" y="46.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Thousandths</text>
<text x="480.0" y="106.0" text-anchor="middle" font-size="36" fill="#222" font-weight="bold">5</text>
<text x="480.0" y="152.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">5 × 1/1000</text>
<text x="480.0" y="176.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">= 0.005</text>
<text x="310.0" y="206.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">4.725 = 4 + 0.7 + 0.02 + 0.005. Each step right is worth one tenth as much.</text>
</svg>
