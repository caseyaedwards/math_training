<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="sans-serif" font-size="14" role="img" aria-label="The proportion 6/9 = 14/21 with crossing lines showing 6 times 21 and 9 times 14 both equal 126">
<title>The proportion 6/9 = 14/21 with crossing lines showing 6 times 21 and 9 times 14 both equal 126</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="220" fill="#fff"/>
<text x="150.0" y="90.0" text-anchor="middle" font-size="32" fill="#222" font-weight="bold">6</text>
<text x="150.0" y="170.0" text-anchor="middle" font-size="32" fill="#222" font-weight="bold">9</text>
<text x="300.0" y="90.0" text-anchor="middle" font-size="32" fill="#222" font-weight="bold">14</text>
<text x="300.0" y="170.0" text-anchor="middle" font-size="32" fill="#222" font-weight="bold">21</text>
<line x1="125.0" y1="120.0" x2="175.0" y2="120.0" stroke="#222" stroke-width="2.5"/>
<line x1="270.0" y1="120.0" x2="330.0" y2="120.0" stroke="#222" stroke-width="2.5"/>
<text x="225.0" y="40.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Is 6/9 = 14/21?</text>
<line x1="175.0" y1="80.0" x2="272.0" y2="158.0" stroke="#d9480f" stroke-width="2"/>
<line x1="175.0" y1="158.0" x2="272.0" y2="80.0" stroke="#222" stroke-width="2" stroke-dasharray="5 4"/>
<text x="420.0" y="90.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">6 × 21 = 126</text>
<text x="420.0" y="118.0" text-anchor="start" font-size="14" fill="#222" font-weight="bold">9 × 14 = 126</text>
<text x="420.0" y="146.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">equal products: the</text>
<text x="420.0" y="174.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">ratios are equal</text>
</svg>
