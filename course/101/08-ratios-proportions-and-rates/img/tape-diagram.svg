<text x="405.0" y="45.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">5 boxes = 25 hosts</text>
<text x="405.0" y="70.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">1 box = 5 hosts</text>
<text x="405.0" y="95.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">web = 3 × 5 = 15</text>
<text x="405.0" y="120.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">db = 2 × 5 = 10</text>
