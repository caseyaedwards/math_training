<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 175" width="590" height="175" font-family="sans-serif" font-size="14" role="img" aria-label="Tape diagram splitting 25 hosts in the ratio 3 to 2">
<title>Tape diagram splitting 25 hosts in the ratio 3 to 2</title>
