<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif" font-size="14" role="img" aria-label="Two expression trees: minus applied after 3 squared gives -9; -3 squared in parentheses gives 9">
<title>Two expression trees: minus applied after 3 squared gives -9; -3 squared in parentheses gives 9</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="600" height="300" fill="#fff"/>
<line x1="130.0" y1="80.0" x2="130.0" y2="120.0" stroke="#222" stroke-width="1.5"/>
<line x1="119.4" y1="157.0" x2="90.6" y2="203.0" stroke="#222" stroke-width="1.5"/>
<line x1="140.6" y1="157.0" x2="169.4" y2="203.0" stroke="#222" stroke-width="1.5"/>
<circle cx="130.0" cy="60.0" r="20" fill="#f3d9cc" stroke="#222" stroke-width="2"/>
<text x="130.0" y="65.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">−</text>
<text x="158.0" y="48.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">= −9</text>
<circle cx="130.0" cy="140.0" r="20" fill="#f3d9cc" stroke="#222" stroke-width="2"/>
<text x="130.0" y="145.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">^</text>
<text x="158.0" y="128.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">= 9</text>
<circle cx="80.0" cy="220.0" r="20" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="80.0" y="225.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">3</text>
<circle cx="180.0" cy="220.0" r="20" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="180.0" y="225.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">2</text>
<text x="130.0" y="275.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">−3² = −(3²) = −9</text>
<line x1="430.3" y1="117.5" x2="399.7" y2="172.5" stroke="#222" stroke-width="1.5"/>
<line x1="449.7" y1="117.5" x2="480.3" y2="172.5" stroke="#222" stroke-width="1.5"/>
<circle cx="440.0" cy="100.0" r="20" fill="#f3d9cc" stroke="#222" stroke-width="2"/>
<text x="440.0" y="105.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">^</text>
<text x="468.0" y="88.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">= 9</text>
<circle cx="390.0" cy="190.0" r="20" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="390.0" y="195.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">−3</text>
<circle cx="490.0" cy="190.0" r="20" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="490.0" y="195.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">2</text>
<text x="440.0" y="275.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">(−3)² = 9</text>
</svg>
