<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 245" width="620" height="245" font-family="sans-serif" font-size="14" role="img" aria-label="The expression 5x squared minus 3x plus 7 labeled with coefficient, exponent, term and constant">
<title>The expression 5x squared minus 3x plus 7 labeled with coefficient, exponent, term and constant</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="245" fill="#fff"/>
<text x="140.0" y="110.0" text-anchor="middle" font-size="40" fill="#222" font-weight="bold">5x²</text>
<text x="300.0" y="110.0" text-anchor="middle" font-size="40" fill="#222" font-weight="bold">− 3x</text>
<text x="440.0" y="110.0" text-anchor="middle" font-size="40" fill="#222" font-weight="bold">+ 7</text>
<line x1="118.0" y1="76.0" x2="70.0" y2="46.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="70.0" y="40.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">coefficient 5</text>
<line x1="162.0" y1="66.0" x2="230.0" y2="36.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="230.0" y="30.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">exponent 2</text>
<line x1="300.0" y1="124.0" x2="300.0" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="300.0" y="164.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">term −3x (the sign belongs to it)</text>
<line x1="452.0" y1="80.0" x2="500.0" y2="46.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="500.0" y="40.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">constant 7</text>
<line x1="100.0" y1="200.0" x2="520.0" y2="200.0" stroke="#222" stroke-width="1.5"/>
<line x1="100.0" y1="200.0" x2="100.0" y2="194.0" stroke="#222" stroke-width="1.5"/>
<line x1="520.0" y1="200.0" x2="520.0" y2="194.0" stroke="#222" stroke-width="1.5"/>
<text x="310.0" y="220.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">three terms joined by + and −</text>
</svg>
