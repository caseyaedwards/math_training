<rect x="0" y="0" width="460" height="185" fill="#fff"/>
<rect x="60.0" y="50.0" width="180.0" height="90.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="0"/>
<rect x="240.0" y="50.0" width="60.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<line x1="240.0" y1="80.0" x2="300.0" y2="80.0" stroke="#bbb" stroke-width="1"/>
