<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602 236" width="602" height="236" font-family="sans-serif" font-size="14" role="img" aria-label="Rectangle of height 6 split into widths 2x and 3 with areas 12x and 18, showing 12x + 18 = 6(2x + 3)">
