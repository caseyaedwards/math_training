<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="sans-serif" font-size="14" role="img" aria-label="Pipeline showing x equals 4 going through times 3 then plus 2 to give 14">
<title>Pipeline showing x equals 4 going through times 3 then plus 2 to give 14</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="760" height="170" fill="#fff"/>
<text x="60.0" y="75.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">x = 4</text>
<line x1="100.0" y1="70.0" x2="170.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="172.0" y="40.0" width="120.0" height="60.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="6"/>
<text x="232.0" y="76.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">times 3</text>
<line x1="292.0" y1="70.0" x2="362.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327.0" y="60.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">12</text>
<rect x="364.0" y="40.0" width="120.0" height="60.0" fill="#f3d9cc" stroke="#222" stroke-width="2" rx="6"/>
<text x="424.0" y="76.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">plus 2</text>
<line x1="484.0" y1="70.0" x2="554.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="75.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">14</text>
<text x="380.0" y="140.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">The expression 3x + 2 is a pipeline: input x, multiply by 3, add 2.</text>
</svg>
