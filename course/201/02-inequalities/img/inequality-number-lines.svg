<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="sans-serif" font-size="14">
<title>Two inequalities on number lines</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
<line x1="40" y1="80" x2="600" y2="80" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="600" y1="80" x2="40" y2="80" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="60" y1="74" x2="60" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="60" y="104" text-anchor="middle" fill="#222" font-size="13">−5</text>
<line x1="112" y1="74" x2="112" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="112" y="104" text-anchor="middle" fill="#222" font-size="13">−4</text>
<line x1="164" y1="74" x2="164" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="164" y="104" text-anchor="middle" fill="#222" font-size="13">−3</text>
<line x1="216" y1="74" x2="216" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="216" y="104" text-anchor="middle" fill="#222" font-size="13">−2</text>
<line x1="268" y1="74" x2="268" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="268" y="104" text-anchor="middle" fill="#222" font-size="13">−1</text>
<line x1="320" y1="74" x2="320" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="320" y="104" text-anchor="middle" fill="#222" font-size="13">0</text>
<line x1="372" y1="74" x2="372" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="372" y="104" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="424" y1="74" x2="424" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="424" y="104" text-anchor="middle" fill="#222" font-size="13">2</text>
<line x1="476" y1="74" x2="476" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="476" y="104" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="528" y1="74" x2="528" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="528" y="104" text-anchor="middle" fill="#222" font-size="13">4</text>
<line x1="580" y1="74" x2="580" y2="86" stroke="#222" stroke-width="1.5"/>
<text x="580" y="104" text-anchor="middle" fill="#222" font-size="13">5</text>
<text x="30" y="58" text-anchor="start" fill="#222" font-weight="bold">x &gt; −2</text>
<line x1="223" y1="80" x2="600" y2="80" stroke="#d9480f" stroke-width="5" marker-end="url(#arrA)"/>
<circle cx="216" cy="80" r="7" fill="#ffffff" stroke="#d9480f" stroke-width="3"/>
<text x="216" y="55" text-anchor="middle" fill="#d9480f" font-size="12">open: −2 is not included</text>
<line x1="40" y1="190" x2="600" y2="190" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="600" y1="190" x2="40" y2="190" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="60" y1="184" x2="60" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="60" y="214" text-anchor="middle" fill="#222" font-size="13">−5</text>
<line x1="112" y1="184" x2="112" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="112" y="214" text-anchor="middle" fill="#222" font-size="13">−4</text>
<line x1="164" y1="184" x2="164" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="164" y="214" text-anchor="middle" fill="#222" font-size="13">−3</text>
<line x1="216" y1="184" x2="216" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="216" y="214" text-anchor="middle" fill="#222" font-size="13">−2</text>
<line x1="268" y1="184" x2="268" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="268" y="214" text-anchor="middle" fill="#222" font-size="13">−1</text>
<line x1="320" y1="184" x2="320" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="320" y="214" text-anchor="middle" fill="#222" font-size="13">0</text>
<line x1="372" y1="184" x2="372" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="372" y="214" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="424" y1="184" x2="424" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="424" y="214" text-anchor="middle" fill="#222" font-size="13">2</text>
<line x1="476" y1="184" x2="476" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="476" y="214" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="528" y1="184" x2="528" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="528" y="214" text-anchor="middle" fill="#222" font-size="13">4</text>
<line x1="580" y1="184" x2="580" y2="196" stroke="#222" stroke-width="1.5"/>
<text x="580" y="214" text-anchor="middle" fill="#222" font-size="13">5</text>
<text x="30" y="168" text-anchor="start" fill="#222" font-weight="bold">x ≤ 3</text>
<line x1="476" y1="190" x2="40" y2="190" stroke="#d9480f" stroke-width="5" marker-end="url(#arrA)"/>
<circle cx="476" cy="190" r="7" fill="#d9480f" stroke="#d9480f" stroke-width="3"/>
<text x="476" y="165" text-anchor="middle" fill="#d9480f" font-size="12">closed: 3 is included</text>
</svg>
