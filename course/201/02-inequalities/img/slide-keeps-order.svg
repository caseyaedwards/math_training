<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 265" width="640" height="265" font-family="sans-serif" font-size="14">
<title>Adding 3 to both sides slides both points right and keeps their order</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="640" height="265" fill="#ffffff"/>
<line x1="40" y1="70" x2="600" y2="70" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="600" y1="70" x2="40" y2="70" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="60" y1="64" x2="60" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="60" y="94" text-anchor="middle" fill="#222" font-size="13">−1</text>
<line x1="117.78" y1="64" x2="117.78" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="117.78" y="94" text-anchor="middle" fill="#222" font-size="13">0</text>
<line x1="175.56" y1="64" x2="175.56" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="175.56" y="94" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="233.33" y1="64" x2="233.33" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="233.33" y="94" text-anchor="middle" fill="#222" font-size="13">2</text>
<line x1="291.11" y1="64" x2="291.11" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="291.11" y="94" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="348.89" y1="64" x2="348.89" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="348.89" y="94" text-anchor="middle" fill="#222" font-size="13">4</text>
<line x1="406.67" y1="64" x2="406.67" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="406.67" y="94" text-anchor="middle" fill="#222" font-size="13">5</text>
<line x1="464.44" y1="64" x2="464.44" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="464.44" y="94" text-anchor="middle" fill="#222" font-size="13">6</text>
<line x1="522.22" y1="64" x2="522.22" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="522.22" y="94" text-anchor="middle" fill="#222" font-size="13">7</text>
<line x1="580" y1="64" x2="580" y2="76" stroke="#222" stroke-width="1.5"/>
<text x="580" y="94" text-anchor="middle" fill="#222" font-size="13">8</text>
<circle cx="233.33" cy="70" r="6" fill="#222" stroke="#222" stroke-width="2"/>
<circle cx="348.89" cy="70" r="6" fill="#222" stroke="#222" stroke-width="2"/>
<text x="291.11" y="45" text-anchor="middle" fill="#222" font-weight="bold">2 &lt; 4</text>
<line x1="40" y1="170" x2="600" y2="170" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="600" y1="170" x2="40" y2="170" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="60" y1="164" x2="60" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="60" y="194" text-anchor="middle" fill="#222" font-size="13">−1</text>
<line x1="117.78" y1="164" x2="117.78" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="117.78" y="194" text-anchor="middle" fill="#222" font-size="13">0</text>
<line x1="175.56" y1="164" x2="175.56" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="175.56" y="194" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="233.33" y1="164" x2="233.33" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="233.33" y="194" text-anchor="middle" fill="#222" font-size="13">2</text>
<line x1="291.11" y1="164" x2="291.11" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="291.11" y="194" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="348.89" y1="164" x2="348.89" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="348.89" y="194" text-anchor="middle" fill="#222" font-size="13">4</text>
<line x1="406.67" y1="164" x2="406.67" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="406.67" y="194" text-anchor="middle" fill="#222" font-size="13">5</text>
<line x1="464.44" y1="164" x2="464.44" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="464.44" y="194" text-anchor="middle" fill="#222" font-size="13">6</text>
<line x1="522.22" y1="164" x2="522.22" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="522.22" y="194" text-anchor="middle" fill="#222" font-size="13">7</text>
<line x1="580" y1="164" x2="580" y2="176" stroke="#222" stroke-width="1.5"/>
<text x="580" y="194" text-anchor="middle" fill="#222" font-size="13">8</text>
<circle cx="406.67" cy="170" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<circle cx="522.22" cy="170" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<text x="464.44" y="214" text-anchor="middle" fill="#d9480f" font-weight="bold">5 &lt; 7</text>
<line x1="233.33" y1="80" x2="404.67" y2="160" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
<line x1="348.89" y1="80" x2="520.22" y2="160" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
<text x="320" y="250" text-anchor="middle" fill="#222" font-size="13">plus 3 on both sides: same slide, same order</text>
</svg>
