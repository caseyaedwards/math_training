<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" font-family="sans-serif" font-size="14">
<title>A function machine: input 3, output 7</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="620" height="200" fill="#ffffff"/>
<rect x="220" y="50" width="180" height="100" rx="10" fill="#fbe3d6" stroke="#d9480f" stroke-width="3"/>
<text x="310" y="92" text-anchor="middle" fill="#d9480f" font-size="22" font-weight="bold" font-style="italic">f</text>
<text x="310" y="118" text-anchor="middle" fill="#222">double, then add 1</text>
<line x1="60" y1="100" x2="214" y2="100" stroke="#222" stroke-width="3" marker-end="url(#arr)"/>
<line x1="400" y1="100" x2="554" y2="100" stroke="#222" stroke-width="3" marker-end="url(#arr)"/>
<text x="110" y="85" text-anchor="middle" fill="#222" font-size="15">input x = 3</text>
<text x="480" y="85" text-anchor="middle" fill="#222" font-size="15">output f(3) = 7</text>
<text x="310" y="180" text-anchor="middle" fill="#222" font-size="13">one input in, exactly one output out</text>
</svg>
