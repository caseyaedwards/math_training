<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="sans-serif" font-size="14">
<title>Mapping diagrams: a function and a relation that is not a function</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="680" height="260" fill="#ffffff"/>
<ellipse cx="70" cy="140" rx="48" ry="90" fill="#ffffff" stroke="#222" stroke-width="2"/>
<ellipse cx="260" cy="140" rx="62" ry="90" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="165" y="30" text-anchor="middle" fill="#222" font-weight="bold">function: f(x) = 2x + 1</text>
<text x="70" y="95" text-anchor="middle" fill="#222" font-size="13">1</text>
<text x="70" y="145" text-anchor="middle" fill="#222" font-size="13">2</text>
<text x="70" y="195" text-anchor="middle" fill="#222" font-size="13">3</text>
<text x="260" y="95" text-anchor="middle" fill="#222" font-size="13">3</text>
<text x="260" y="145" text-anchor="middle" fill="#222" font-size="13">5</text>
<text x="260" y="195" text-anchor="middle" fill="#222" font-size="13">7</text>
<line x1="85" y1="90" x2="243" y2="90" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="85" y1="140" x2="243" y2="140" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="85" y1="190" x2="243" y2="190" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="70" y="250" text-anchor="middle" fill="#222" font-size="12">inputs</text>
<text x="260" y="250" text-anchor="middle" fill="#222" font-size="12">outputs</text>
<ellipse cx="410" cy="140" rx="48" ry="90" fill="#ffffff" stroke="#222" stroke-width="2"/>
<ellipse cx="600" cy="140" rx="62" ry="90" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="505" y="30" text-anchor="middle" fill="#d9480f" font-weight="bold">not a function: one name, two IPs</text>
<text x="410" y="120" text-anchor="middle" fill="#222" font-size="13">db</text>
<text x="410" y="170" text-anchor="middle" fill="#222" font-size="13">web</text>
<text x="600" y="95" text-anchor="middle" fill="#222" font-size="13">10.0.0.1</text>
<text x="600" y="145" text-anchor="middle" fill="#222" font-size="13">10.0.0.2</text>
<text x="600" y="195" text-anchor="middle" fill="#222" font-size="13">10.0.0.9</text>
<line x1="428" y1="115" x2="562" y2="90" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<line x1="428" y1="115" x2="562" y2="140" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<line x1="431" y1="165" x2="562" y2="190" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<text x="410" y="250" text-anchor="middle" fill="#222" font-size="12">inputs</text>
<text x="600" y="250" text-anchor="middle" fill="#222" font-size="12">outputs</text>
</svg>
