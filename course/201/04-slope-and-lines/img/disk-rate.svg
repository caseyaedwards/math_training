<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="sans-serif" font-size="14">
<title>Disk usage line with slope 12 GB per day</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="600" height="360" fill="#ffffff"/>
<line x1="90" y1="280" x2="90" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="90" y="298" text-anchor="middle" fill="#222" font-size="12">0</text>
<line x1="166.67" y1="280" x2="166.67" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="166.67" y="298" text-anchor="middle" fill="#222" font-size="12">2</text>
<line x1="243.33" y1="280" x2="243.33" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="243.33" y="298" text-anchor="middle" fill="#222" font-size="12">4</text>
<line x1="320" y1="280" x2="320" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="320" y="298" text-anchor="middle" fill="#222" font-size="12">6</text>
<line x1="396.67" y1="280" x2="396.67" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="396.67" y="298" text-anchor="middle" fill="#222" font-size="12">8</text>
<line x1="473.33" y1="280" x2="473.33" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="473.33" y="298" text-anchor="middle" fill="#222" font-size="12">10</text>
<line x1="550" y1="280" x2="550" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="550" y="298" text-anchor="middle" fill="#222" font-size="12">12</text>
<line x1="90" y1="280" x2="550" y2="280" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="284" text-anchor="end" fill="#222" font-size="12">0</text>
<line x1="90" y1="248.75" x2="550" y2="248.75" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="252.75" text-anchor="end" fill="#222" font-size="12">40</text>
<line x1="90" y1="217.5" x2="550" y2="217.5" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="221.5" text-anchor="end" fill="#222" font-size="12">80</text>
<line x1="90" y1="186.25" x2="550" y2="186.25" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="190.25" text-anchor="end" fill="#222" font-size="12">120</text>
<line x1="90" y1="155" x2="550" y2="155" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="159" text-anchor="end" fill="#222" font-size="12">160</text>
<line x1="90" y1="123.75" x2="550" y2="123.75" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="127.75" text-anchor="end" fill="#222" font-size="12">200</text>
<line x1="90" y1="92.5" x2="550" y2="92.5" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="96.5" text-anchor="end" fill="#222" font-size="12">240</text>
<line x1="90" y1="61.25" x2="550" y2="61.25" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="65.25" text-anchor="end" fill="#222" font-size="12">280</text>
<line x1="90" y1="30" x2="550" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<text x="84" y="34" text-anchor="end" fill="#222" font-size="12">320</text>
<line x1="90" y1="280" x2="562" y2="280" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="90" y1="280" x2="90" y2="18" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="320" y="320" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">day (d)</text>
<text x="42" y="155" text-anchor="middle" fill="#222" font-size="13" font-weight="bold" transform="rotate(-90 42 155)">GB used</text>
<line x1="90" y1="170.62" x2="550" y2="58.12" stroke="#222" stroke-width="3"/>
<line x1="90" y1="170.62" x2="473.33" y2="170.62" stroke="#d9480f" stroke-width="2.5"/>
<line x1="473.33" y1="170.62" x2="473.33" y2="76.88" stroke="#d9480f" stroke-width="2.5"/>
<circle cx="90" cy="170.62" r="5" fill="#222" stroke="#222" stroke-width="1"/>
<text x="100" y="188.62" text-anchor="start" fill="#222" font-size="13" font-weight="bold">b = 140</text>
<circle cx="473.33" cy="76.88" r="5" fill="#222" stroke="#222" stroke-width="1"/>
<text x="463.33" y="66.88" text-anchor="end" fill="#222" font-size="13" font-weight="bold">(10, 260)</text>
<text x="281.67" y="190.62" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">run 10 days</text>
<text x="481.33" y="123.75" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">rise 120 GB</text>
<text x="205" y="45.62" text-anchor="start" fill="#222" font-size="13" font-weight="bold">slope = 120 / 10 = 12 GB per day</text>
</svg>
