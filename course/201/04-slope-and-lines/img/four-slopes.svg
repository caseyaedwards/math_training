<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" font-family="sans-serif" font-size="14">
<title>Four kinds of slope</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="680" height="200" fill="#ffffff"/>
<rect x="15" y="20" width="140" height="140" fill="none" stroke="#999" stroke-width="1"/>
<line x1="15" y1="90" x2="155" y2="90" stroke="#d0d0d0" stroke-width="1"/>
<line x1="85" y1="20" x2="85" y2="160" stroke="#d0d0d0" stroke-width="1"/>
<line x1="30" y1="134" x2="140" y2="46" stroke="#d9480f" stroke-width="3"/>
<text x="85" y="182" text-anchor="middle" fill="#222" font-weight="bold">positive</text>
<rect x="185" y="20" width="140" height="140" fill="none" stroke="#999" stroke-width="1"/>
<line x1="185" y1="90" x2="325" y2="90" stroke="#d0d0d0" stroke-width="1"/>
<line x1="255" y1="20" x2="255" y2="160" stroke="#d0d0d0" stroke-width="1"/>
<line x1="200" y1="46" x2="310" y2="134" stroke="#d9480f" stroke-width="3"/>
<text x="255" y="182" text-anchor="middle" fill="#222" font-weight="bold">negative</text>
<rect x="355" y="20" width="140" height="140" fill="none" stroke="#999" stroke-width="1"/>
<line x1="355" y1="90" x2="495" y2="90" stroke="#d0d0d0" stroke-width="1"/>
<line x1="425" y1="20" x2="425" y2="160" stroke="#d0d0d0" stroke-width="1"/>
<line x1="370" y1="90" x2="480" y2="90" stroke="#d9480f" stroke-width="3"/>
<text x="425" y="182" text-anchor="middle" fill="#222" font-weight="bold">zero</text>
<rect x="525" y="20" width="140" height="140" fill="none" stroke="#999" stroke-width="1"/>
<line x1="525" y1="90" x2="665" y2="90" stroke="#d0d0d0" stroke-width="1"/>
<line x1="595" y1="20" x2="595" y2="160" stroke="#d0d0d0" stroke-width="1"/>
<line x1="595" y1="145" x2="595" y2="35" stroke="#d9480f" stroke-width="3"/>
<text x="595" y="182" text-anchor="middle" fill="#222" font-weight="bold">undefined</text>
<text x="85" y="18" text-anchor="middle" fill="#222" font-size="1"></text>
</svg>
