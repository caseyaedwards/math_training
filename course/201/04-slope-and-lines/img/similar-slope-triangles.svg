<text x="112" y="246" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">run 2</text>
<text x="154" y="214" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">rise 1</text>
<text x="256" y="192" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">run 4</text>
<text x="334" y="142" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">rise 2</text>
<text x="130" y="55.2" text-anchor="start" fill="#222" font-weight="bold">1/2 = 2/4: same slope</text>
