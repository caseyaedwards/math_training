<line x1="400" y1="282" x2="400" y2="30" stroke="#d0d0d0" stroke-width="1"/>
<line x1="40" y1="282" x2="400" y2="282" stroke="#d0d0d0" stroke-width="1"/>
<line x1="40" y1="246" x2="400" y2="246" stroke="#d0d0d0" stroke-width="1"/>
<line x1="40" y1="210" x2="400" y2="210" stroke="#d0d0d0" stroke-width="1"/>
