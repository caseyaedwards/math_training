<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="sans-serif" font-size="14">
<title>Elimination: add the equations and the y terms cancel</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
<text x="180" y="50" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">3x</text>
<text x="270" y="50" text-anchor="middle" fill="#d9480f" font-size="22" font-weight="bold">+ 2y</text>
<text x="370" y="50" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">= 16</text>
<text x="180" y="95" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">5x</text>
<text x="270" y="95" text-anchor="middle" fill="#d9480f" font-size="22" font-weight="bold">− 2y</text>
<text x="370" y="95" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">= 0</text>
<text x="110" y="95" text-anchor="middle" fill="#222" font-size="26" font-weight="bold">+</text>
<line x1="120" y1="112" x2="430" y2="112" stroke="#222" stroke-width="2.5"/>
<text x="180" y="150" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">8x</text>
<text x="270" y="150" text-anchor="middle" fill="#d9480f" font-size="22" font-weight="bold">0</text>
<text x="370" y="150" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">= 16</text>
<line x1="238" y1="50" x2="302" y2="34" stroke="#d9480f" stroke-width="2"/>
<line x1="238" y1="95" x2="302" y2="79" stroke="#d9480f" stroke-width="2"/>
<text x="440" y="75" text-anchor="start" fill="#d9480f" font-size="13">+2y and −2y</text>
<text x="440" y="93" text-anchor="start" fill="#d9480f" font-size="13">cancel</text>
<text x="280" y="200" text-anchor="middle" fill="#222">then x = 2, and 3(2) + 2y = 16 gives y = 5</text>
<text x="280" y="230" text-anchor="middle" fill="#555" font-size="13">adding two true equations gives a true equation</text>
</svg>
