<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="sans-serif" font-size="14">
<title>Halving ladder from 2 cubed down to 2 to the minus 2</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="620" height="330" fill="#ffffff"/>
<text x="80" y="46" text-anchor="end" fill="#222" font-size="16" font-weight="bold">2³</text>
<rect x="100" y="25" width="400" height="30" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="510" y="46" text-anchor="start" fill="#222" font-weight="bold">= 8</text>
<text x="80" y="94" text-anchor="end" fill="#222" font-size="16" font-weight="bold">2²</text>
<rect x="100" y="73" width="200" height="30" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="310" y="94" text-anchor="start" fill="#222" font-weight="bold">= 4</text>
<text x="560" y="69" text-anchor="middle" fill="#555" font-size="13">÷ 2</text>
<text x="80" y="142" text-anchor="end" fill="#222" font-size="16" font-weight="bold">2¹</text>
<rect x="100" y="121" width="100" height="30" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="210" y="142" text-anchor="start" fill="#222" font-weight="bold">= 2</text>
<text x="560" y="117" text-anchor="middle" fill="#555" font-size="13">÷ 2</text>
<text x="80" y="190" text-anchor="end" fill="#d9480f" font-size="16" font-weight="bold">2⁰</text>
<rect x="100" y="169" width="50" height="30" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="160" y="190" text-anchor="start" fill="#d9480f" font-weight="bold">= 1</text>
<text x="560" y="165" text-anchor="middle" fill="#555" font-size="13">÷ 2</text>
<text x="80" y="238" text-anchor="end" fill="#d9480f" font-size="16" font-weight="bold">2⁻¹</text>
<rect x="100" y="217" width="25" height="30" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="135" y="238" text-anchor="start" fill="#d9480f" font-weight="bold">= 1/2</text>
<text x="560" y="213" text-anchor="middle" fill="#555" font-size="13">÷ 2</text>
<text x="80" y="286" text-anchor="end" fill="#d9480f" font-size="16" font-weight="bold">2⁻²</text>
<rect x="100" y="265" width="12.5" height="30" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="122.5" y="286" text-anchor="start" fill="#d9480f" font-weight="bold">= 1/4</text>
<text x="560" y="261" text-anchor="middle" fill="#555" font-size="13">÷ 2</text>
<text x="310" y="318" text-anchor="middle" fill="#222" font-size="13">step down one exponent = divide by 2: 2⁰ = 1 and 2⁻¹ = 1/2</text>
</svg>
