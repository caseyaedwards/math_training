<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" font-family="sans-serif" font-size="14">
<title>(2 squared) cubed is three groups of two 2s, six 2s in all</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="640" height="170" fill="#ffffff"/>
<text x="26" y="65" text-anchor="middle" fill="#222" font-size="30">(</text>
<rect x="36" y="40" width="36" height="36" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="54" y="64" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="76" y="40" width="36" height="36" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="94" y="64" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<text x="118" y="65" text-anchor="middle" fill="#222" font-size="30">)</text>
<text x="77" y="102" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">2²</text>
<text x="134" y="65" text-anchor="middle" fill="#222" font-size="20">×</text>
<text x="146" y="65" text-anchor="middle" fill="#222" font-size="30">(</text>
<rect x="156" y="40" width="36" height="36" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="174" y="64" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="196" y="40" width="36" height="36" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="214" y="64" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<text x="238" y="65" text-anchor="middle" fill="#222" font-size="30">)</text>
<text x="197" y="102" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">2²</text>
<text x="254" y="65" text-anchor="middle" fill="#222" font-size="20">×</text>
<text x="266" y="65" text-anchor="middle" fill="#222" font-size="30">(</text>
<rect x="276" y="40" width="36" height="36" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="294" y="64" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<rect x="316" y="40" width="36" height="36" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="334" y="64" text-anchor="middle" fill="#222" font-weight="bold">2</text>
<text x="358" y="65" text-anchor="middle" fill="#222" font-size="30">)</text>
<text x="317" y="102" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">2²</text>
<text x="400" y="65" text-anchor="start" fill="#222" font-size="22" font-weight="bold">= 2⁶ = 64</text>
<text x="320" y="155" text-anchor="middle" fill="#222" font-size="13">(2²)³: 3 groups of 2 factors = 3 × 2 = 6 factors: multiply the exponents</text>
</svg>
