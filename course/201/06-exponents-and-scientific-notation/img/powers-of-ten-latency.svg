<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" width="700" height="190" font-family="sans-serif" font-size="14">
<title>Latency scale from a nanosecond to over a thousand seconds in powers of ten</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="700" height="190" fill="#ffffff"/>
<line x1="40" y1="90" x2="670" y2="90" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="50" y1="80" x2="50" y2="100" stroke="#222" stroke-width="2"/>
<text x="50" y="120" text-anchor="middle" fill="#222" font-size="13">10⁻⁹</text>
<line x1="100" y1="85" x2="100" y2="95" stroke="#222" stroke-width="1"/>
<text x="100" y="120" text-anchor="middle" fill="#666" font-size="11">10⁻⁸</text>
<line x1="150" y1="85" x2="150" y2="95" stroke="#222" stroke-width="1"/>
<text x="150" y="120" text-anchor="middle" fill="#666" font-size="11">10⁻⁷</text>
<line x1="200" y1="80" x2="200" y2="100" stroke="#222" stroke-width="2"/>
<text x="200" y="120" text-anchor="middle" fill="#222" font-size="13">10⁻⁶</text>
<line x1="250" y1="85" x2="250" y2="95" stroke="#222" stroke-width="1"/>
<text x="250" y="120" text-anchor="middle" fill="#666" font-size="11">10⁻⁵</text>
<line x1="300" y1="85" x2="300" y2="95" stroke="#222" stroke-width="1"/>
<text x="300" y="120" text-anchor="middle" fill="#666" font-size="11">10⁻⁴</text>
<line x1="350" y1="80" x2="350" y2="100" stroke="#222" stroke-width="2"/>
<text x="350" y="120" text-anchor="middle" fill="#222" font-size="13">10⁻³</text>
<line x1="400" y1="85" x2="400" y2="95" stroke="#222" stroke-width="1"/>
<text x="400" y="120" text-anchor="middle" fill="#666" font-size="11">10⁻²</text>
<line x1="450" y1="85" x2="450" y2="95" stroke="#222" stroke-width="1"/>
<text x="450" y="120" text-anchor="middle" fill="#666" font-size="11">10⁻¹</text>
<line x1="500" y1="80" x2="500" y2="100" stroke="#222" stroke-width="2"/>
<text x="500" y="120" text-anchor="middle" fill="#222" font-size="13">10⁰</text>
<line x1="550" y1="85" x2="550" y2="95" stroke="#222" stroke-width="1"/>
<text x="550" y="120" text-anchor="middle" fill="#666" font-size="11">10¹</text>
<line x1="600" y1="85" x2="600" y2="95" stroke="#222" stroke-width="1"/>
<text x="600" y="120" text-anchor="middle" fill="#666" font-size="11">10²</text>
<line x1="650" y1="80" x2="650" y2="100" stroke="#222" stroke-width="2"/>
<text x="650" y="120" text-anchor="middle" fill="#222" font-size="13">10³</text>
<text x="50" y="70" text-anchor="middle" fill="#d9480f" font-weight="bold">1 ns</text>
<text x="200" y="70" text-anchor="middle" fill="#d9480f" font-weight="bold">1 µs</text>
<text x="350" y="70" text-anchor="middle" fill="#d9480f" font-weight="bold">1 ms</text>
<text x="500" y="70" text-anchor="middle" fill="#d9480f" font-weight="bold">1 s</text>
<text x="650" y="70" text-anchor="middle" fill="#d9480f" font-weight="bold">1,000 s</text>
<circle cx="150" cy="90" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<text x="150" y="150" text-anchor="middle" fill="#222" font-size="12">RAM read ~10⁻⁷ s</text>
<circle cx="300" cy="90" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<text x="300" y="150" text-anchor="middle" fill="#222" font-size="12">SSD read ~10⁻⁴ s</text>
<circle cx="450" cy="90" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<text x="450" y="150" text-anchor="middle" fill="#222" font-size="12">WAN round trip ~10⁻¹ s</text>
<text x="350" y="180" text-anchor="middle" fill="#222" font-size="13">each tick is 10 times the one on its left</text>
</svg>
