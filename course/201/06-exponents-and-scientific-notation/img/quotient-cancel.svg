<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="sans-serif" font-size="14">
<title>x to the 5th over x squared: two pairs cancel, leaving x cubed</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="230" fill="#ffffff"/>
<rect x="60" y="30" width="40" height="40" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="80" y="56" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<rect x="106" y="30" width="40" height="40" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="126" y="56" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<rect x="152" y="30" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="172" y="56" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<rect x="198" y="30" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="218" y="56" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<rect x="244" y="30" width="40" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="264" y="56" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<rect x="60" y="120" width="40" height="40" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="80" y="146" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<rect x="106" y="120" width="40" height="40" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="126" y="146" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">x</text>
<line x1="50" y1="95" x2="290" y2="95" stroke="#222" stroke-width="2.5"/>
<line x1="62" y1="164" x2="98" y2="26" stroke="#d9480f" stroke-width="2.5"/>
<line x1="108" y1="164" x2="144" y2="26" stroke="#d9480f" stroke-width="2.5"/>
<text x="320" y="100" text-anchor="start" fill="#222" font-size="24" font-weight="bold">= x³</text>
<text x="280" y="205" text-anchor="middle" fill="#222" font-size="13">each x / x = 1: 5 factors minus 2 factors leaves 3: subtract exponents</text>
</svg>
