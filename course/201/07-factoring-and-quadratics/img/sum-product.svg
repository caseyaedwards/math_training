<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" font-family="sans-serif" font-size="14">
<title>Factor pairs of 12 and their sums; 3 and 4 add to 7</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="520" height="260" fill="#ffffff"/>
<text x="185" y="30" text-anchor="middle" fill="#222" font-weight="bold">multiply to 12</text>
<text x="335" y="30" text-anchor="middle" fill="#222" font-weight="bold">add to</text>
<rect x="110" y="40" width="150" height="40" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<rect x="260" y="40" width="150" height="40" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="185" y="66" text-anchor="middle" fill="#222" font-size="16">1 × 12</text>
<text x="335" y="66" text-anchor="middle" fill="#222" font-size="16">13</text>
<rect x="110" y="80" width="150" height="40" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<rect x="260" y="80" width="150" height="40" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<text x="185" y="106" text-anchor="middle" fill="#222" font-size="16">2 × 6</text>
<text x="335" y="106" text-anchor="middle" fill="#222" font-size="16">8</text>
<rect x="110" y="120" width="150" height="40" fill="#fbe3d6" stroke="#222" stroke-width="1.5"/>
<rect x="260" y="120" width="150" height="40" fill="#fbe3d6" stroke="#222" stroke-width="1.5"/>
<text x="185" y="146" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">3 × 4</text>
<text x="335" y="146" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">7</text>
<text x="260" y="200" text-anchor="middle" fill="#d9480f" font-size="17" font-weight="bold">x² + 7x + 12 = (x + 3)(x + 4)</text>
<text x="260" y="230" text-anchor="middle" fill="#222" font-size="13">find two numbers: product = last term, sum = middle coefficient</text>
</svg>
