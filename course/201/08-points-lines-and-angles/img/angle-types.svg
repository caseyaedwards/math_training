<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" width="700" height="190" font-family="sans-serif" font-size="14">
<title>Acute, right, obtuse and straight angles</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="700" height="190" fill="#ffffff"/>
<line x1="60" y1="130" x2="160" y2="130" stroke="#222" stroke-width="2.5"/>
<line x1="60" y1="130" x2="124.28" y2="53.4" stroke="#222" stroke-width="2.5"/>
<path d="M 84 130 A 24 24 0 0 0 75.43 111.61" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<circle cx="60" cy="130" r="3" fill="#222" stroke="#222" stroke-width="2"/>
<text x="100" y="162" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">acute (less than 90°)</text>
<line x1="230" y1="130" x2="330" y2="130" stroke="#222" stroke-width="2.5"/>
<line x1="230" y1="130" x2="230" y2="30" stroke="#222" stroke-width="2.5"/>
<path d="M 248 130 L 248 112 L 230 112" fill="none" stroke="#d9480f" stroke-width="2"/>
<circle cx="230" cy="130" r="3" fill="#222" stroke="#222" stroke-width="2"/>
<text x="270" y="162" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">right (90°)</text>
<line x1="400" y1="130" x2="500" y2="130" stroke="#222" stroke-width="2.5"/>
<line x1="400" y1="130" x2="329.29" y2="59.29" stroke="#222" stroke-width="2.5"/>
<path d="M 424 130 A 24 24 0 0 0 383.03 113.03" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<circle cx="400" cy="130" r="3" fill="#222" stroke="#222" stroke-width="2"/>
<text x="440" y="162" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">obtuse (more than 90°)</text>
<line x1="570" y1="130" x2="680" y2="130" stroke="#222" stroke-width="2.5"/>
<path d="M 649 130 A 24 24 0 0 0 601 130" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<circle cx="625" cy="130" r="3" fill="#222" stroke="#222" stroke-width="2"/>
<text x="625" y="162" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">straight (180°)</text>
</svg>
