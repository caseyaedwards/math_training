<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" font-family="sans-serif" font-size="14">
<title>Vertical angles: angles 1 and 3 are equal because both pair with angle 2 to make 180</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="460" height="280" fill="#ffffff"/>
<line x1="60" y1="135" x2="400" y2="135" stroke="#222" stroke-width="2.5"/>
<line x1="120.73" y1="232.67" x2="339.27" y2="37.33" stroke="#222" stroke-width="2.5"/>
<path d="M 260 135 A 30 30 0 0 0 252.37 115.01" fill="none" stroke="#d9480f" stroke-width="3"/>
<path d="M 200 135 A 30 30 0 0 0 207.63 154.99" fill="none" stroke="#d9480f" stroke-width="3"/>
<path d="M 247.89 119.01 A 24 24 0 0 0 206 135" fill="none" stroke="#222" stroke-width="2"/>
<text x="282" y="123" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">1</text>
<text x="224" y="101" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">2</text>
<text x="178" y="157" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">3</text>
<text x="230" y="255" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">1 + 2 = 180 and 3 + 2 = 180, therefore 1 = 3</text>
</svg>
