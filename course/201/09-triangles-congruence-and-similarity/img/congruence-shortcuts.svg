<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="sans-serif" font-size="14">
<title>Congruence shortcuts SSS, SAS, ASA, AAS</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="760" height="230" fill="#ffffff"/>
<polygon points="30,150 150,150 70,70" fill="#ffffff" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="30" y1="150" x2="150" y2="150" stroke="#d9480f" stroke-width="4"/>
<line x1="150" y1="150" x2="70" y2="70" stroke="#d9480f" stroke-width="4"/>
<line x1="70" y1="70" x2="30" y2="150" stroke="#d9480f" stroke-width="4"/>
<text x="90" y="180" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">SSS</text>
<polygon points="215,150 335,150 255,70" fill="#ffffff" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="215" y1="150" x2="335" y2="150" stroke="#d9480f" stroke-width="4"/>
<line x1="255" y1="70" x2="215" y2="150" stroke="#d9480f" stroke-width="4"/>
<path d="M 233 150 A 18 18 0 0 0 223.05 133.9" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<text x="275" y="180" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">SAS</text>
<polygon points="400,150 520,150 440,70" fill="#ffffff" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="400" y1="150" x2="520" y2="150" stroke="#d9480f" stroke-width="4"/>
<path d="M 418 150 A 18 18 0 0 0 408.05 133.9" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<path d="M 507.27 137.27 A 18 18 0 0 0 502 150" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<text x="460" y="180" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">ASA</text>
<polygon points="585,150 705,150 625,70" fill="#ffffff" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="705" y1="150" x2="625" y2="70" stroke="#d9480f" stroke-width="4"/>
<path d="M 603 150 A 18 18 0 0 0 593.05 133.9" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<path d="M 692.27 137.27 A 18 18 0 0 0 687 150" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<text x="645" y="180" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">AAS</text>
<text x="380" y="215" text-anchor="middle" fill="#222" font-size="13">orange parts match in both triangles: then the triangles are congruent</text>
</svg>
