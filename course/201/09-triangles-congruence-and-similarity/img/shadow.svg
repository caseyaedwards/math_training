<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14">
<title>Shadow problem: a 2 m pole with a 3 m shadow and a tree with an 18 m shadow</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
<line x1="20" y1="250" x2="620" y2="250" stroke="#222" stroke-width="2"/>
<line x1="40" y1="250" x2="40" y2="222" stroke="#222" stroke-width="5"/>
<polygon points="40,250 82,250 40,222" fill="#fbe3d6" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<text x="34" y="236" text-anchor="end" fill="#222" font-weight="bold">2</text>
<text x="61" y="268" text-anchor="middle" fill="#222" font-weight="bold">3</text>
<line x1="200" y1="250" x2="200" y2="82" stroke="#555" stroke-width="7"/>
<circle cx="200" cy="72" r="22" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
<polygon points="200,250 452,250 200,82" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<text x="188" y="166" text-anchor="end" fill="#d9480f" font-size="16" font-weight="bold">h</text>
<text x="326" y="268" text-anchor="middle" fill="#222" font-weight="bold">18</text>
<text x="470" y="60" text-anchor="middle" fill="#222" font-size="13">sun rays are parallel,</text>
<text x="470" y="78" text-anchor="middle" fill="#222" font-size="13">and the triangles are similar</text>
<text x="470" y="110" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">h / 18 = 2 / 3</text>
<text x="470" y="132" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">h = 12 m</text>
</svg>
