<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="sans-serif" font-size="14">
<title>Similar right triangles 3-4-5 and 6-8-10 with scale factor 2</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
<polygon points="50,260 154,260 50,182" fill="#ffffff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 62 260 L 62 248 L 50 248" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="102" y="282" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<text x="38" y="226" text-anchor="end" fill="#222" font-weight="bold">3</text>
<text x="114" y="215" text-anchor="start" fill="#222" font-weight="bold">5</text>
<polygon points="230,260 438,260 230,104" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 242 260 L 242 248 L 230 248" fill="none" stroke="#d9480f" stroke-width="1.5"/>
<text x="334" y="282" text-anchor="middle" fill="#d9480f" font-weight="bold">8</text>
<text x="218" y="187" text-anchor="end" fill="#d9480f" font-weight="bold">6</text>
<text x="346" y="176" text-anchor="start" fill="#d9480f" font-weight="bold">10</text>
<text x="280" y="305" text-anchor="middle" fill="#222" font-size="13">same angles, every side times 2</text>
</svg>
