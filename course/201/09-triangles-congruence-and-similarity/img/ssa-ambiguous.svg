<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" font-family="sans-serif" font-size="14">
<title>SSA is ambiguous: the same side and angle fit two different triangles</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="270" fill="#ffffff"/>
<line x1="60" y1="200" x2="520" y2="200" stroke="#222" stroke-width="2"/>
<polygon points="60,200 220,70 294.83,200" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="60,200 220,70 145.17,200" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 145.17 200 A 150 150 0 0 0 294.83 200" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="220" y="236" text-anchor="middle" fill="#777" font-size="11">BC can land here or here</text>
<path d="M 86 200 A 26 26 0 0 0 80.18 183.6" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="52" y="220" text-anchor="middle" fill="#222" font-weight="bold">A</text>
<text x="220" y="58" text-anchor="middle" fill="#222" font-weight="bold">B</text>
<text x="145.17" y="220" text-anchor="middle" fill="#222" font-weight="bold">C₁</text>
<text x="294.83" y="220" text-anchor="middle" fill="#d9480f" font-weight="bold">C₂</text>
<text x="280" y="255" text-anchor="middle" fill="#222" font-size="13">same AB, same angle A, same length BC: two triangles</text>
</svg>
