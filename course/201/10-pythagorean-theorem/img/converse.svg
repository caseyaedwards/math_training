<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="740" height="280" font-family="sans-serif" font-size="14">
<title>Converse: compare c squared with a squared plus b squared</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="740" height="280" fill="#ffffff"/>
<polygon points="108,106.86 188,190 60,190" fill="#ffffff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 76 190 A 16 16 0 0 0 68 176.14" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="162" y="142.43" text-anchor="start" fill="#222" font-size="13" font-weight="bold">c ≈ 3.61</text>
<text x="124" y="212" text-anchor="middle" fill="#222" font-size="13">b = 4</text>
<text x="76" y="148.43" text-anchor="end" fill="#222" font-size="13">a = 3</text>
<text x="124" y="245" text-anchor="middle" fill="#222" font-weight="bold">acute (60°)</text>
<text x="124" y="266" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c² &lt; a² + b²</text>
<polygon points="300,94 428,190 300,190" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 312 190 L 312 178 L 300 178" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="378" y="136" text-anchor="start" fill="#222" font-size="13" font-weight="bold">c = 5</text>
<text x="364" y="212" text-anchor="middle" fill="#222" font-size="13">b = 4</text>
<text x="292" y="142" text-anchor="end" fill="#222" font-size="13">a = 3</text>
<text x="364" y="245" text-anchor="middle" fill="#222" font-weight="bold">right (90°)</text>
<text x="364" y="266" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c² = a² + b²</text>
<polygon points="532,106.86 708,190 580,190" fill="#ffffff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M 596 190 A 16 16 0 0 0 572 176.14" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="634" y="142.43" text-anchor="start" fill="#222" font-size="13" font-weight="bold">c ≈ 6.08</text>
<text x="644" y="212" text-anchor="middle" fill="#222" font-size="13">b = 4</text>
<text x="548" y="148.43" text-anchor="end" fill="#222" font-size="13">a = 3</text>
<text x="644" y="245" text-anchor="middle" fill="#222" font-weight="bold">obtuse (120°)</text>
<text x="644" y="266" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c² &gt; a² + b²</text>
</svg>
