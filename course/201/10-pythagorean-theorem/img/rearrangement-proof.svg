<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="sans-serif" font-size="14">
<title>Rearrangement proof of the Pythagorean theorem</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<rect x="40" y="50" width="280" height="280" fill="none" stroke="#222" stroke-width="3"/>
<polygon points="160,50 320,170 200,330 40,210" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<text x="180" y="198" text-anchor="middle" fill="#d9480f" font-size="26" font-weight="bold">c²</text>
<polygon points="40,50 160,50 40,210" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="320,50 320,170 160,50" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="320,330 200,330 320,170" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="40,330 40,210 200,330" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="100" y="40" text-anchor="middle" fill="#222">a</text>
<text x="240" y="40" text-anchor="middle" fill="#222">b</text>
<text x="28" y="135" text-anchor="middle" fill="#222">b</text>
<text x="28" y="275" text-anchor="middle" fill="#222">a</text>
<rect x="400" y="50" width="280" height="280" fill="none" stroke="#222" stroke-width="3"/>
<rect x="400" y="50" width="120" height="120" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5"/>
<rect x="520" y="170" width="160" height="160" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5"/>
<text x="460" y="118" text-anchor="middle" fill="#d9480f" font-size="24" font-weight="bold">a²</text>
<text x="600" y="258" text-anchor="middle" fill="#d9480f" font-size="24" font-weight="bold">b²</text>
<polygon points="520,50 680,50 680,170" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="520,50 520,170 680,170" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="400,170 520,170 400,330" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="520,170 520,330 400,330" fill="#e6e6e6" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="460" y="40" text-anchor="middle" fill="#222">a</text>
<text x="600" y="40" text-anchor="middle" fill="#222">b</text>
<text x="388" y="115" text-anchor="middle" fill="#222">a</text>
<text x="388" y="255" text-anchor="middle" fill="#222">b</text>
<text x="180" y="360" text-anchor="middle" fill="#222" font-weight="bold">4 triangles + c²</text>
<text x="540" y="360" text-anchor="middle" fill="#222" font-weight="bold">4 triangles + a² + b²</text>
<text x="360" y="386" text-anchor="middle" fill="#222" font-size="13">same big square, same 4 triangles: c² = a² + b²</text>
<text x="360" y="182" text-anchor="middle" fill="#222" font-size="30" font-weight="bold">=</text>
</svg>
