<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" font-family="sans-serif" font-size="14">
<title>Parts of a right triangle: legs a and b, hypotenuse c opposite the right angle</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="420" height="260" fill="#ffffff"/>
<polygon points="80,60 300,210 80,210" fill="#fbe3d6" stroke="#d9480f" stroke-width="3" stroke-linejoin="round"/>
<path d="M 96 210 L 96 194 L 80 194" fill="none" stroke="#222" stroke-width="2"/>
<text x="66" y="135" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">a</text>
<text x="190" y="236" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">b</text>
<text x="206" y="127" text-anchor="middle" fill="#d9480f" font-size="18" font-weight="bold">c</text>
<text x="330" y="90" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">c = hypotenuse:</text>
<text x="330" y="108" text-anchor="middle" fill="#222" font-size="13">longest side,</text>
<text x="330" y="126" text-anchor="middle" fill="#222" font-size="13">across from the</text>
<text x="330" y="144" text-anchor="middle" fill="#222" font-size="13">right angle</text>
</svg>
