<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 320" width="470" height="320" font-family="sans-serif" font-size="14">
<title>Parts of a circle: center, radius, diameter, circumference</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="470" height="320" fill="#ffffff"/>
<circle cx="190" cy="160" r="120" fill="none" stroke="#d9480f" stroke-width="3"/>
<line x1="70" y1="160" x2="310" y2="160" stroke="#222" stroke-width="2.5"/>
<line x1="190" y1="160" x2="258.83" y2="61.7" stroke="#222" stroke-width="2.5" stroke-dasharray="7 4"/>
<circle cx="190" cy="160" r="4" fill="#222" stroke="#222" stroke-width="2"/>
<text x="186" y="180" text-anchor="middle" fill="#222" font-weight="bold">O</text>
<text x="190" y="206" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">diameter d = 2r</text>
<text x="236.41" y="110.85" text-anchor="start" fill="#222" font-weight="bold">r</text>
<text x="318" y="65" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">circumference</text>
<text x="318" y="83" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">C = 2πr = πd</text>
</svg>
