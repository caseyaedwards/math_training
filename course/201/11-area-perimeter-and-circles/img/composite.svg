<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" font-family="sans-serif" font-size="14">
<title>Composite shape: a 10 by 4 rectangle with a semicircle of diameter 4 on one end</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="240" fill="#ffffff"/>
<rect x="40" y="50" width="300" height="120" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<path d="M 340 50 A 60 60 0 0 1 340 170" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5"/>
<line x1="340" y1="50" x2="340" y2="170" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="190" y="115" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">40</text>
<text x="364" y="115" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">2π</text>
<text x="190" y="40" text-anchor="middle" fill="#222" font-weight="bold">10</text>
<text x="28" y="115" text-anchor="middle" fill="#222" font-weight="bold">4</text>
<text x="280" y="215" text-anchor="middle" fill="#222" font-weight="bold">area = 40 + ½π(2²) = 40 + 2π ≈ 46.28</text>
</svg>
