<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="sans-serif" font-size="14">
<title>Cut a triangle off a parallelogram and slide it to make a rectangle</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="230" fill="#ffffff"/>
<polygon points="60,170 300,170 380,50 140,50" fill="#ffffff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="60,170 140,170 140,50" fill="#fbe3d6" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<line x1="140" y1="50" x2="140" y2="170" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="300,170 380,170 380,50" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<path d="M 105 140 Q 240 215 335 150" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<text x="180" y="190" text-anchor="middle" fill="#222" font-weight="bold">base b</text>
<text x="148" y="115" text-anchor="start" fill="#d9480f" font-weight="bold">height h</text>
<text x="470" y="105" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">area = b × h</text>
<text x="470" y="128" text-anchor="middle" fill="#222" font-size="13">same as the</text>
<text x="470" y="146" text-anchor="middle" fill="#222" font-size="13">rectangle</text>
</svg>
