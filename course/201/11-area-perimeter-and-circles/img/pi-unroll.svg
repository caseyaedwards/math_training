<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" font-family="sans-serif" font-size="14">
<title>Roll a circle of diameter 1 along a line: it travels pi, about 3.14 diameters</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="680" height="220" fill="#ffffff"/>
<line x1="20" y1="160" x2="660" y2="160" stroke="#222" stroke-width="2"/>
<circle cx="100" cy="100" r="60" fill="none" stroke="#d9480f" stroke-width="3"/>
<line x1="100" y1="40" x2="100" y2="160" stroke="#222" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="106" y="100" text-anchor="start" fill="#222" font-size="13" font-weight="bold">d = 1</text>
<circle cx="100" cy="160" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<line x1="100" y1="178" x2="476.99" y2="178" stroke="#d9480f" stroke-width="4"/>
<line x1="100" y1="170" x2="100" y2="186" stroke="#222" stroke-width="2"/>
<text x="100" y="204" text-anchor="middle" fill="#222" font-size="13">0</text>
<line x1="220" y1="170" x2="220" y2="186" stroke="#222" stroke-width="2"/>
<text x="220" y="204" text-anchor="middle" fill="#222" font-size="13">1</text>
<line x1="340" y1="170" x2="340" y2="186" stroke="#222" stroke-width="2"/>
<text x="340" y="204" text-anchor="middle" fill="#222" font-size="13">2</text>
<line x1="460" y1="170" x2="460" y2="186" stroke="#222" stroke-width="2"/>
<text x="460" y="204" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="476.99" y1="168" x2="476.99" y2="188" stroke="#d9480f" stroke-width="2.5"/>
<text x="484.99" y="204" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">3.14...</text>
<circle cx="476.99" cy="160" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<text x="450" y="50" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">one full turn = π × d</text>
<text x="450" y="72" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">C = πd = 2πr</text>
</svg>
