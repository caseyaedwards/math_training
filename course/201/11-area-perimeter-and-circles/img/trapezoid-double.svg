<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="sans-serif" font-size="14">
<title>Two copies of a trapezoid make a parallelogram with base b1 + b2</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="600" height="230" fill="#ffffff"/>
<polygon points="40,170 240,170 190,70 100,70" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="240,170 330,170 390,70 190,70" fill="#ffffff" stroke="#222" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="140" y="192" text-anchor="middle" fill="#222" font-weight="bold">b₁</text>
<text x="145" y="60" text-anchor="middle" fill="#d9480f" font-weight="bold">b₂</text>
<text x="140" y="210" text-anchor="middle" fill="#222" font-size="1"></text>
<text x="285" y="192" text-anchor="middle" fill="#222" font-weight="bold">b₂</text>
<text x="285" y="60" text-anchor="middle" fill="#222" font-weight="bold">b₁</text>
<line x1="100" y1="170" x2="100" y2="70" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="94" y="120" text-anchor="end" fill="#d9480f" font-weight="bold">h</text>
<text x="500" y="100" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">trapezoid =</text>
<text x="500" y="124" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">½ (b₁ + b₂) h</text>
</svg>
