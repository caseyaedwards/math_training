<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 450" width="460" height="450" font-family="sans-serif" font-size="14">
<title>Net of the 4 by 2 by 3 box unfolded into six rectangles</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="460" height="450" fill="#ffffff"/>
<rect x="120" y="30" width="136" height="68" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="188" y="62" text-anchor="middle" fill="#222" font-size="12">top</text>
<text x="188" y="79" text-anchor="middle" fill="#222" font-weight="bold">8</text>
<rect x="120" y="98" width="136" height="102" fill="#fbe3d6" stroke="#222" stroke-width="2"/>
<text x="188" y="147" text-anchor="middle" fill="#222" font-size="12">front</text>
<text x="188" y="164" text-anchor="middle" fill="#d9480f" font-weight="bold">12</text>
<rect x="120" y="200" width="136" height="68" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="188" y="232" text-anchor="middle" fill="#222" font-size="12">bottom</text>
<text x="188" y="249" text-anchor="middle" fill="#222" font-weight="bold">8</text>
<rect x="120" y="268" width="136" height="102" fill="#fbe3d6" stroke="#222" stroke-width="2"/>
<text x="188" y="317" text-anchor="middle" fill="#222" font-size="12">back</text>
<text x="188" y="334" text-anchor="middle" fill="#d9480f" font-weight="bold">12</text>
<rect x="52" y="98" width="68" height="102" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
<text x="86" y="147" text-anchor="middle" fill="#222" font-size="12">side</text>
<text x="86" y="164" text-anchor="middle" fill="#222" font-weight="bold">6</text>
<rect x="256" y="98" width="68" height="102" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
<text x="290" y="147" text-anchor="middle" fill="#222" font-size="12">side</text>
<text x="290" y="164" text-anchor="middle" fill="#222" font-weight="bold">6</text>
<text x="188" y="400" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">SA = 2(8) + 2(12) + 2(6) = 52 square units</text>
</svg>
