<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 330" width="490" height="330" font-family="sans-serif" font-size="14">
<title>Cylinder net: two circles and a rectangle as wide as the circumference</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="490" height="330" fill="#ffffff"/>
<rect x="60" y="110" width="251.33" height="120" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5"/>
<circle cx="185.66" cy="70" r="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
<circle cx="185.66" cy="270" r="40" fill="#e6e6e6" stroke="#222" stroke-width="2"/>
<line x1="185.66" y1="70" x2="225.66" y2="70" stroke="#222" stroke-width="1.5"/>
<text x="205.66" y="64" text-anchor="middle" fill="#222" font-weight="bold">r</text>
<text x="185.66" y="175" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">width 2πr, height h</text>
<text x="327.33" y="158" text-anchor="start" fill="#222" font-size="13" font-weight="bold">SA = 2πr² + 2πrh</text>
<text x="327.33" y="180" text-anchor="start" fill="#222" font-size="13" font-weight="bold">V = πr²h</text>
</svg>
