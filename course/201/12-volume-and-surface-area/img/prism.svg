<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="sans-serif" font-size="14">
<title>Triangular prism: volume is base area times length</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="260" fill="#ffffff"/>
<line x1="268" y1="135" x2="388" y2="135" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="268" y1="135" x2="308" y2="45" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="60" y1="200" x2="268" y2="135" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4"/>
<polygon points="100,110 308,45 388,135 180,200" fill="#e6e6e6" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="60,200 180,200 100,110" fill="#fbe3d6" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="180" y1="200" x2="388" y2="135" stroke="#222" stroke-width="2"/>
<line x1="100" y1="110" x2="308" y2="45" stroke="#222" stroke-width="2"/>
<line x1="388" y1="135" x2="308" y2="45" stroke="#222" stroke-width="2"/>
<text x="115" y="175" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">base</text>
<text x="294" y="189.5" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">length</text>
<text x="280" y="245" text-anchor="middle" fill="#222" font-weight="bold">V = (area of the triangle) × length</text>
</svg>
