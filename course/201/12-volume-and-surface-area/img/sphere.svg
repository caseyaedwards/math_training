<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" font-family="sans-serif" font-size="14">
<title>Sphere of radius r: volume four thirds pi r cubed, surface four pi r squared</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
<circle cx="150" cy="140" r="100" fill="#fbe3d6" stroke="#d9480f" stroke-width="3"/>
<ellipse cx="150" cy="140" rx="100" ry="28.000000000000004" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="150" y1="140" x2="250" y2="140" stroke="#222" stroke-width="2"/>
<circle cx="150" cy="140" r="4" fill="#222" stroke="#222" stroke-width="2"/>
<text x="200" y="132" text-anchor="middle" fill="#222" font-weight="bold">r</text>
<text x="300" y="110" text-anchor="start" fill="#222" font-size="16" font-weight="bold">V = 4/3 πr³</text>
<text x="300" y="140" text-anchor="start" fill="#d9480f" font-size="16" font-weight="bold">SA = 4πr²</text>
<text x="300" y="175" text-anchor="start" fill="#222" font-size="13">SA = exactly four circles</text>
<text x="300" y="193" text-anchor="start" fill="#222" font-size="13">of the same radius</text>
</svg>
