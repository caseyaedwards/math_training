<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Number line showing the domain [3, 5) union (5, infinity): closed dot at 3, open dot at 5, shaded to the right</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="640" height="140" fill="#ffffff"/>
<line x1="30" y1="70" x2="615" y2="70" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="40" y1="64" x2="40" y2="76" stroke="#222222" stroke-width="1.2"/>
<text x="40" y="98" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">0</text>
