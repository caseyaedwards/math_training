<text x="226.67" y="98" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">3</text>
<line x1="288.89" y1="64" x2="288.89" y2="76" stroke="#222222" stroke-width="1.2"/>
<text x="288.89" y="98" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">4</text>
<line x1="351.11" y1="64" x2="351.11" y2="76" stroke="#222222" stroke-width="1.2"/>
<text x="351.11" y="98" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">5</text>
<line x1="413.33" y1="64" x2="413.33" y2="76" stroke="#222222" stroke-width="1.2"/>
