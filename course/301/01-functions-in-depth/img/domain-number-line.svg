<text x="226.67" y="46" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">3 allowed (√0 = 0)</text>
<text x="351.11" y="46" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">5 banned (divide by 0)</text>
<text x="320" y="128" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Domain of √(x − 3) / (x − 5): closed dot = included, open dot = excluded</text>
