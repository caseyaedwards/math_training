<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Nested number systems: natural numbers inside integers inside rationals inside reals inside complex numbers</title>
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
<rect x="20" y="20" width="660" height="300" rx="10" fill="#fbe3d6" stroke="#d9480f" stroke-width="2"/>
<text x="30" y="40" font-size="14" fill="#d9480f" text-anchor="start" font-weight="bold">Complex  a + bi</text>
<text x="668" y="308" font-size="13" fill="#868e96" text-anchor="end" font-weight="normal">2 + 3i,  i</text>
<rect x="50" y="60" width="420" height="240" rx="10" fill="#fdf0e8" stroke="#222222" stroke-width="2"/>
<text x="60" y="80" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Real</text>
<text x="458" y="288" font-size="13" fill="#868e96" text-anchor="end" font-weight="normal">π,  √2</text>
<rect x="80" y="100" width="290" height="180" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="90" y="120" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Rational</text>
<text x="358" y="268" font-size="13" fill="#868e96" text-anchor="end" font-weight="normal">1/2,  −0.75</text>
<rect x="110" y="140" width="170" height="120" rx="10" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
<text x="120" y="160" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Integer</text>
<text x="268" y="248" font-size="13" fill="#868e96" text-anchor="end" font-weight="normal">−3,  0</text>
<rect x="140" y="180" width="80" height="60" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="150" y="200" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Natural</text>
<text x="180" y="228" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">1, 2, 3</text>
<text x="495" y="120" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">each new system</text>
<text x="495" y="138" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">solves an equation</text>
<text x="495" y="156" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">the old one cannot:</text>
<text x="495" y="186" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal">x + 5 = 2</text>
<text x="495" y="204" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal">2x = 1</text>
<text x="495" y="222" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal">x² = 2</text>
<text x="495" y="240" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">x² = −1</text>
</svg>
