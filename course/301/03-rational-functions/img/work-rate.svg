<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Work rate: worker A does 1/6 of a job per hour, worker B 1/3; together they finish in 2 hours</title>
<rect x="0" y="0" width="700" height="260" fill="#ffffff"/>
<text x="110" y="62" font-size="14" fill="#222222" text-anchor="end" font-weight="bold">A, 1 hour</text>
<rect x="120" y="40" width="480" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="120" y="40" width="80" height="34" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="160" y="62" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/6</text>
<text x="110" y="112" font-size="14" fill="#222222" text-anchor="end" font-weight="bold">B, 1 hour</text>
<rect x="120" y="90" width="480" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="120" y="90" width="160" height="34" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<text x="200" y="112" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/3</text>
<text x="110" y="172" font-size="14" fill="#222222" text-anchor="end" font-weight="bold">both, 1 hour</text>
<rect x="120" y="150" width="480" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="120" y="150" width="80" height="34" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="160" y="172" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/6</text>
<rect x="200" y="150" width="160" height="34" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<text x="280" y="172" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/3</text>
<text x="110" y="222" font-size="14" fill="#222222" text-anchor="end" font-weight="bold">both, 2 hours</text>
<rect x="120" y="200" width="480" height="34" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="120" y="200" width="80" height="34" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="160" y="222" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/6</text>
<rect x="200" y="200" width="160" height="34" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<text x="280" y="222" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/3</text>
<rect x="360" y="200" width="80" height="34" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="400" y="222" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/6</text>
<rect x="440" y="200" width="160" height="34" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<text x="520" y="222" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1/3</text>
<text x="610" y="172" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">= 1/2 job</text>
<text x="610" y="222" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">= 1 job</text>
<text x="360" y="25" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">one whole job</text>
</svg>
