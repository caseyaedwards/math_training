<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Product rule as counting factors: 2^3 times 2^2 is five 2s multiplied, which is 2^5</title>
<rect x="0" y="0" width="700" height="230" fill="#ffffff"/>
<rect x="40" y="50" width="40" height="40" rx="4" fill="#dbe4ee" stroke="#1c4e80" stroke-width="1.6"/>
<text x="60" y="76" font-size="16" fill="#1c4e80" text-anchor="middle" font-weight="bold">2</text>
<rect x="86" y="50" width="40" height="40" rx="4" fill="#dbe4ee" stroke="#1c4e80" stroke-width="1.6"/>
<text x="106" y="76" font-size="16" fill="#1c4e80" text-anchor="middle" font-weight="bold">2</text>
<rect x="132" y="50" width="40" height="40" rx="4" fill="#dbe4ee" stroke="#1c4e80" stroke-width="1.6"/>
<text x="152" y="76" font-size="16" fill="#1c4e80" text-anchor="middle" font-weight="bold">2</text>
<text x="109" y="40" font-size="15" fill="#1c4e80" text-anchor="middle" font-weight="bold">2³</text>
<text x="190" y="76" font-size="22" fill="#222222" text-anchor="middle" font-weight="normal">×</text>
<rect x="215" y="50" width="40" height="40" rx="4" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.6"/>
<text x="235" y="76" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="bold">2</text>
<rect x="261" y="50" width="40" height="40" rx="4" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.6"/>
<text x="281" y="76" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="bold">2</text>
<text x="258" y="40" font-size="15" fill="#d9480f" text-anchor="middle" font-weight="bold">2²</text>
<text x="330" y="76" font-size="22" fill="#222222" text-anchor="middle" font-weight="normal">=</text>
<rect x="355" y="50" width="40" height="40" rx="4" fill="#dbe4ee" stroke="#1c4e80" stroke-width="1.6"/>
<text x="375" y="76" font-size="16" fill="#1c4e80" text-anchor="middle" font-weight="bold">2</text>
<rect x="401" y="50" width="40" height="40" rx="4" fill="#dbe4ee" stroke="#1c4e80" stroke-width="1.6"/>
<text x="421" y="76" font-size="16" fill="#1c4e80" text-anchor="middle" font-weight="bold">2</text>
<rect x="447" y="50" width="40" height="40" rx="4" fill="#dbe4ee" stroke="#1c4e80" stroke-width="1.6"/>
<text x="467" y="76" font-size="16" fill="#1c4e80" text-anchor="middle" font-weight="bold">2</text>
<rect x="493" y="50" width="40" height="40" rx="4" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.6"/>
<text x="513" y="76" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="bold">2</text>
<rect x="539" y="50" width="40" height="40" rx="4" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.6"/>
<text x="559" y="76" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="bold">2</text>
<text x="468" y="40" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">2⁵ = 32</text>
<text x="40" y="135" font-size="14" fill="#222222" text-anchor="start" font-weight="normal">bᵐ · bⁿ = bᵐ⁺ⁿ   (count the factors)</text>
<text x="40" y="161" font-size="14" fill="#222222" text-anchor="start" font-weight="normal">bᵐ / bⁿ = bᵐ⁻ⁿ   (cancel the factors)</text>
<text x="40" y="187" font-size="14" fill="#222222" text-anchor="start" font-weight="normal">(bᵐ)ⁿ = bᵐⁿ   (n copies of m factors)</text>
</svg>
