<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="740" height="230" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Exponential backoff: retry waits of 1, 2, 4, 8 and 16 seconds on a timeline</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="740" height="230" fill="#ffffff"/>
<line x1="40" y1="120" x2="700" y2="120" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<circle cx="40" cy="120" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="40" y="145" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">#1</text>
<rect x="40" y="92" width="20" height="20" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1"/>
<text x="50" y="107" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">1</text>
<circle cx="60" cy="120" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="60" y="145" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">#2</text>
<rect x="60" y="92" width="40" height="20" rx="0" fill="#f3f0ee" stroke="#222222" stroke-width="1"/>
<text x="80" y="107" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">2</text>
<circle cx="100" cy="120" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="100" y="145" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">#3</text>
<rect x="100" y="92" width="80" height="20" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1"/>
<text x="140" y="86" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">wait 4s</text>
<circle cx="180" cy="120" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="180" y="145" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">#4</text>
<rect x="180" y="92" width="160" height="20" rx="0" fill="#f3f0ee" stroke="#222222" stroke-width="1"/>
<text x="260" y="86" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">wait 8s</text>
<circle cx="340" cy="120" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="340" y="145" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">#5</text>
<rect x="340" y="92" width="320" height="20" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1"/>
<text x="500" y="86" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">wait 16s</text>
<circle cx="660" cy="120" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="660" y="145" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">#6</text>
<text x="40" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">0s</text>
<text x="120" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">4s</text>
<text x="200" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">8s</text>
<text x="280" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">12s</text>
<text x="360" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">16s</text>
<text x="440" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">20s</text>
<text x="520" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">24s</text>
<text x="600" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">28s</text>
<text x="660" y="175" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">31s</text>
<text x="370" y="30" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Each wait is double the last. Orange dots are attempts #1 to #6.</text>
<text x="370" y="210" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Total after 5 waits: 1 + 2 + 4 + 8 + 16 = 31 s = 2⁵ − 1. The next wait alone (32 s) beats all of them.</text>
</svg>
