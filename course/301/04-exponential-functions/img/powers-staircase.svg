<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Walking down the powers of 2 by dividing by 2: 8, 4, 2, 1, 1/2, 1/4, 1/8, which explains zero and negative exponents</title>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<rect x="50" y="54" width="56" height="176" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.5"/>
<text x="78" y="46" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">8</text>
<text x="78" y="252" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2^3</text>
<text x="123" y="252" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">÷2</text>
<rect x="140" y="142" width="56" height="88" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.5"/>
<text x="168" y="134" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">4</text>
<text x="168" y="252" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2^2</text>
<text x="213" y="252" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">÷2</text>
<rect x="230" y="186" width="56" height="44" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.5"/>
<text x="258" y="178" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">2</text>
<text x="258" y="252" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2^1</text>
<text x="303" y="252" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">÷2</text>
<rect x="320" y="208" width="56" height="22" rx="0" fill="#ffd8a8" stroke="#d9480f" stroke-width="1.5"/>
<text x="348" y="200" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1</text>
<text x="348" y="252" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">2^0</text>
<text x="393" y="252" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">÷2</text>
<rect x="410" y="219" width="56" height="11" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="438" y="211" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1/2</text>
<text x="438" y="252" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2^(-1)</text>
<text x="483" y="252" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">÷2</text>
<rect x="500" y="224.5" width="56" height="5.5" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="528" y="216.5" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1/4</text>
<text x="528" y="252" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2^(-2)</text>
<text x="573" y="252" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">÷2</text>
<rect x="590" y="227.25" width="56" height="2.75" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="618" y="219.25" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1/8</text>
<text x="618" y="252" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">2^(-3)</text>
<line x1="40" y1="230" x2="670" y2="230" stroke="#222222" stroke-width="1.5"/>
<text x="350" y="30" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">Each step right divides by 2. Keep going past 2¹ and the pattern forces:</text>
<text x="350" y="52" font-size="15" fill="#d9480f" text-anchor="middle" font-weight="bold">2⁰ = 1   and   2⁻ⁿ = 1 / 2ⁿ</text>
<text x="350" y="285" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">No new rule, just the same staircase continued downhill.</text>
</svg>
