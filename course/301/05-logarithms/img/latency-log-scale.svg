<text x="306.67" y="112" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">×10</text>
<text x="380" y="112" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">×10</text>
<text x="453.33" y="112" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">×10</text>
