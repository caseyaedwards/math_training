<line x1="468" y1="115" x2="468" y2="84" stroke="#d9480f" stroke-width="1"/>
<text x="468" y="80" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">same-DC round trip</text>
<circle cx="647.67" cy="120" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<line x1="647.67" y1="115" x2="647.67" y2="64" stroke="#d9480f" stroke-width="1"/>
<text x="647.67" y="60" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">cross-continent round trip</text>
<text x="380" y="200" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">Equal spacing means equal ratios, not equal differences.</text>
<text x="380" y="225" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">Rough orders of magnitude only: real numbers vary by hardware and distance.</text>
