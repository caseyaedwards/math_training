<circle cx="196.67" cy="120" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<line x1="196.67" y1="115" x2="196.67" y2="64" stroke="#d9480f" stroke-width="1"/>
<text x="196.67" y="60" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">RAM access</text>
<circle cx="416.67" cy="120" r="5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<line x1="416.67" y1="115" x2="416.67" y2="44" stroke="#d9480f" stroke-width="1"/>
<text x="416.67" y="40" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">SSD random read</text>
