<text x="563.33" y="156" font-size="12" fill="#222222" text-anchor="start" font-weight="normal"></text>
<line x1="636.67" y1="112" x2="636.67" y2="128" stroke="#222222" stroke-width="1.5"/>
<text x="636.67" y="156" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold"></text>
