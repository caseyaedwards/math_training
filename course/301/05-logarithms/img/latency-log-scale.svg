<text x="343.33" y="156" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold"></text>
<text x="343.33" y="156" font-size="12" fill="#222222" text-anchor="start" font-weight="normal"></text>
<line x1="416.67" y1="112" x2="416.67" y2="128" stroke="#222222" stroke-width="1.5"/>
<text x="416.67" y="156" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold"></text>
<text x="416.67" y="156" font-size="12" fill="#222222" text-anchor="start" font-weight="normal"></text>
<line x1="490" y1="104" x2="490" y2="136" stroke="#222222" stroke-width="1.5"/>
