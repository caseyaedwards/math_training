<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The same five request rates on a linear axis and on a log axis</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<text x="30" y="75" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">linear axis</text>
<line x1="120" y1="70" x2="690" y2="70" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="120" y1="65" x2="120" y2="75" stroke="#222222" stroke-width="1.2"/>
<text x="120" y="92" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">0</text>
<line x1="306.67" y1="65" x2="306.67" y2="75" stroke="#222222" stroke-width="1.2"/>
<text x="306.67" y="92" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">4,000</text>
<line x1="493.33" y1="65" x2="493.33" y2="75" stroke="#222222" stroke-width="1.2"/>
<text x="493.33" y="92" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">8,000</text>
<line x1="680" y1="65" x2="680" y2="75" stroke="#222222" stroke-width="1.2"/>
<text x="680" y="92" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">12,000</text>
<circle cx="120.14" cy="70" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="121.87" cy="70" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="131.67" cy="70" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="204" cy="70" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="204" y="56" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">cdn</text>
<circle cx="680" cy="70" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="680" y="56" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">logs</text>
<text x="116" y="56" font-size="12" fill="#d9480f" text-anchor="start" font-weight="normal">auth, search, api</text>
<text x="30" y="205" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">log axis</text>
<line x1="120" y1="200" x2="690" y2="200" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="120" y1="195" x2="120" y2="205" stroke="#222222" stroke-width="1.2"/>
<text x="120" y="222" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">1</text>
<line x1="257.28" y1="195" x2="257.28" y2="205" stroke="#222222" stroke-width="1.2"/>
<text x="257.28" y="222" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">10</text>
<line x1="394.56" y1="195" x2="394.56" y2="205" stroke="#222222" stroke-width="1.2"/>
<text x="394.56" y="222" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">100</text>
<line x1="531.85" y1="195" x2="531.85" y2="205" stroke="#222222" stroke-width="1.2"/>
<text x="531.85" y="222" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">1,000</text>
<line x1="669.13" y1="195" x2="669.13" y2="205" stroke="#222222" stroke-width="1.2"/>
<text x="669.13" y="222" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">10,000</text>
<circle cx="185.5" cy="200" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="185.5" y="186" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">auth</text>
<circle cx="339.93" cy="200" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="339.93" y="186" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">search</text>
<circle cx="449.2" cy="200" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="449.2" y="186" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">api</text>
<circle cx="566.89" cy="200" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="566.89" y="186" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">cdn</text>
<circle cx="680" cy="200" r="6" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="680" y="186" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">logs</text>
<text x="380" y="285" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Linear: four services pile up near 0. Log: equal steps are equal ratios (×10), so every one is readable.</text>
</svg>
