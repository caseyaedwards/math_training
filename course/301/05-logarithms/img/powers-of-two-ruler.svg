<line x1="617.5" y1="114" x2="617.5" y2="126" stroke="#222222" stroke-width="1.2"/>
<text x="617.5" y="145" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">56</text>
<line x1="658.75" y1="114" x2="658.75" y2="126" stroke="#222222" stroke-width="1.2"/>
