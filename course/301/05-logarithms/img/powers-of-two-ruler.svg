<circle cx="122.5" cy="120" r="5" fill="#1c4e80" stroke="#1c4e80" stroke-width="1.5"/>
<text x="122.5" y="180" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">byte: 256 values</text>
<line x1="122.5" y1="125" x2="122.5" y2="168" stroke="#1c4e80" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="370" cy="120" r="5" fill="#1c4e80" stroke="#1c4e80" stroke-width="1.5"/>
<text x="370" y="180" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">IPv4: ~4.3 billion</text>
<line x1="370" y1="125" x2="370" y2="168" stroke="#1c4e80" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="700" cy="120" r="5" fill="#1c4e80" stroke="#1c4e80" stroke-width="1.5"/>
<text x="700" y="180" font-size="12" fill="#1c4e80" text-anchor="end" font-weight="normal">uint64: ~1.8 × 10¹⁹</text>
<line x1="700" y1="125" x2="700" y2="168" stroke="#1c4e80" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="70" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal">bits →</text>
<text x="380" y="40" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Position on the ruler = log₂ of the size. One step right doubles the size.</text>
<text x="380" y="230" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">2¹⁰ = 1,024 ≈ 10³: every 10 bits is about three more decimal digits.</text>
</svg>
