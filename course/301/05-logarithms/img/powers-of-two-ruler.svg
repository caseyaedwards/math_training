<text x="411.25" y="145" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">36</text>
<line x1="452.5" y1="114" x2="452.5" y2="126" stroke="#222222" stroke-width="1.2"/>
<text x="452.5" y="145" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal">40</text>
<line x1="493.75" y1="114" x2="493.75" y2="126" stroke="#222222" stroke-width="1.2"/>
