<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Slide rule: adding the lengths log 2 and log 3 gives log 6, so 2 times 3 = 6</title><defs><marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c4e80"/></marker></defs>
<rect x="0" y="0" width="760" height="250" fill="#ffffff"/>
<rect x="202.58" y="60" width="403.42" height="40" rx="4" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<line x1="208.58" y1="100" x2="208.58" y2="86" stroke="#222222" stroke-width="1.3"/>
<text x="208.58" y="80" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1</text>
<line x1="377.15" y1="100" x2="377.15" y2="86" stroke="#222222" stroke-width="1.3"/>
<text x="377.15" y="80" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">2</text>
<line x1="475.76" y1="100" x2="475.76" y2="86" stroke="#222222" stroke-width="1.3"/>
<text x="475.76" y="80" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">3</text>
<line x1="545.73" y1="100" x2="545.73" y2="86" stroke="#222222" stroke-width="1.3"/>
<text x="545.73" y="80" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">4</text>
<line x1="600" y1="100" x2="600" y2="86" stroke="#222222" stroke-width="1.3"/>
<text x="600" y="80" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">5</text>
<text x="614" y="85" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal">C (slides)</text>
<rect x="34" y="100" width="572" height="40" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<line x1="40" y1="100" x2="40" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="40" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">1</text>
<line x1="208.58" y1="100" x2="208.58" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="208.58" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">2</text>
<line x1="307.19" y1="100" x2="307.19" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="307.19" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">3</text>
<line x1="377.15" y1="100" x2="377.15" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="377.15" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">4</text>
<line x1="431.42" y1="100" x2="431.42" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="431.42" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">5</text>
<line x1="475.76" y1="100" x2="475.76" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="475.76" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">6</text>
<line x1="513.25" y1="100" x2="513.25" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="513.25" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">7</text>
<line x1="545.73" y1="100" x2="545.73" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="545.73" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">8</text>
<line x1="574.38" y1="100" x2="574.38" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="574.38" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">9</text>
<line x1="600" y1="100" x2="600" y2="114" stroke="#222222" stroke-width="1.3"/>
<text x="600" y="131" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">10</text>
<text x="614" y="125" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal">D (fixed)</text>
<line x1="208.58" y1="50" x2="208.58" y2="150" stroke="#d9480f" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="475.76" y1="50" x2="475.76" y2="150" stroke="#d9480f" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="208.58" y="42" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">C's 1 over D's 2</text>
<text x="475.76" y="42" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal">C's 3 sits over D's 6</text>
<line x1="40" y1="175" x2="208.58" y2="175" stroke="#1c4e80" stroke-width="2" marker-end="url(#arrm)"/>
<text x="124.29" y="195" font-size="13" fill="#1c4e80" text-anchor="middle" font-weight="normal">length log 2</text>
<line x1="208.58" y1="175" x2="475.76" y2="175" stroke="#1c4e80" stroke-width="2" marker-end="url(#arrm)"/>
<text x="342.17" y="195" font-size="13" fill="#1c4e80" text-anchor="middle" font-weight="normal">+ length log 3</text>
<text x="380" y="235" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Lengths are logs. Adding lengths multiplies numbers: log 2 + log 3 = log 6.</text>
</svg>
