<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Angle of elevation example: standing 40 m from a tower, the top is 35 degrees up, so the tower is 40 tan 35 = 28.0 m tall</title>
<rect x="0" y="0" width="600" height="340" fill="#ffffff"/>
<line x1="20" y1="290" x2="580" y2="290" stroke="#222222" stroke-width="1.5"/>
<rect x="374" y="65.94" width="12" height="224.06" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.5"/>
<line x1="60" y1="290" x2="380" y2="65.94" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4"/>
<path d="M 110 290 L 109.99 289.24 L 109.98 288.47 L 109.95 287.71 L 109.91 286.95 L 109.85 286.19 L 109.79 285.42 L 109.71 284.67 L 109.63 283.91 L 109.53 283.15 L 109.42 282.39 L 109.3 281.64 L 109.16 280.89 L 109.02 280.14 L 108.86 279.39 L 108.69 278.65 L 108.51 277.9 L 108.32 277.16 L 108.12 276.43 L 107.91 275.69 L 107.69 274.96 L 107.45 274.24 L 107.2 273.52 L 106.95 272.8 L 106.68 272.08 L 106.4 271.37 L 106.11 270.66 L 105.81 269.96 L 105.5 269.27 L 105.18 268.57 L 104.84 267.89 L 104.5 267.2 L 104.15 266.53 L 103.78 265.85 L 103.41 265.19 L 103.03 264.53 L 102.63 263.88 L 102.23 263.23 L 101.81 262.59 L 101.39 261.95 L 100.96 261.32" fill="none" stroke="#d9480f" stroke-width="1.8" stroke-linejoin="round"/>
<text x="116" y="280" font-size="14" fill="#d9480f" text-anchor="start" font-weight="bold">35°</text>
<circle cx="60" cy="290" r="4" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="60" y="312" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">you</text>
<text x="220" y="312" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">adjacent: 40 m</text>
<text x="394" y="177.97" font-size="14" fill="#222222" text-anchor="start" font-weight="normal">opposite: h = ?</text>
<text x="394" y="197.97" font-size="14" fill="#d9480f" text-anchor="start" font-weight="bold">h = 40 tan 35° ≈ 28.0 m</text>
<text x="300" y="30" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">Opposite and adjacent known or wanted, so use TOA: tan = opp / adj</text>
</svg>
