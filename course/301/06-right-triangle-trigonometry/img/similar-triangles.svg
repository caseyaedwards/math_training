<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Three similar right triangles with the same 35 degree angle: the ratio opposite over hypotenuse is 0.574 in all three</title>
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
<path d="M 120 280 L 218.3 280 L 218.3 211.17 Z" fill="none" stroke="#868e96" stroke-width="2.2" stroke-linejoin="round"/>
<text x="224.3" y="255.59" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal">opp 2.29</text>
<text x="174.06" y="234.14" font-size="13" fill="#868e96" text-anchor="end" font-weight="normal">hyp 4</text>
<path d="M 120 280 L 292.02 280 L 292.02 159.55 Z" fill="none" stroke="#1c4e80" stroke-width="2.2" stroke-linejoin="round"/>
<text x="298.02" y="219.77" font-size="13" fill="#1c4e80" text-anchor="start" font-weight="normal">opp 4.02</text>
<text x="214.61" y="205.75" font-size="13" fill="#1c4e80" text-anchor="end" font-weight="normal">hyp 7</text>
<path d="M 120 280 L 365.75 280 L 365.75 107.93 Z" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round"/>
<text x="371.75" y="193.96" font-size="13" fill="#d9480f" text-anchor="start" font-weight="normal">opp 5.74</text>
<text x="255.16" y="177.36" font-size="13" fill="#d9480f" text-anchor="end" font-weight="normal">hyp 10</text>
<path d="M 160 280 L 160 279.39 L 159.98 278.78 L 159.96 278.17 L 159.93 277.56 L 159.88 276.95 L 159.83 276.34 L 159.77 275.73 L 159.7 275.13 L 159.62 274.52 L 159.53 273.92 L 159.44 273.31 L 159.33 272.71 L 159.21 272.11 L 159.09 271.51 L 158.96 270.92 L 158.81 270.32 L 158.66 269.73 L 158.5 269.14 L 158.33 268.56 L 158.15 267.97 L 157.96 267.39 L 157.76 266.81 L 157.56 266.24 L 157.34 265.67 L 157.12 265.1 L 156.89 264.53 L 156.65 263.97 L 156.4 263.41 L 156.14 262.86 L 155.87 262.31 L 155.6 261.76 L 155.32 261.22 L 155.03 260.68 L 154.73 260.15 L 154.42 259.62 L 154.11 259.1 L 153.78 258.58 L 153.45 258.07 L 153.11 257.56 L 152.77 257.06" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="166" y="272" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">35°</text>
<text x="320" y="30" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Same angle, different sizes: opp / hyp stays the same</text>
<text x="320" y="340" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">2.29/4 = 4.02/7 = 5.74/10 ≈ 0.574 = sin 35°. The ratio depends only on the angle.</text>
</svg>
