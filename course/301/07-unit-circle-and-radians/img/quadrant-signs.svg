<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Signs of sine, cosine and tangent in the four quadrants</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="460" height="420" fill="#ffffff"/>
<line x1="30" y1="210" x2="430" y2="210" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="230" y1="400" x2="230" y2="20" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="330" y="75" font-size="20" fill="#d9480f" text-anchor="middle" font-weight="bold">I</text>
<text x="330" y="103" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">sin +</text>
<text x="330" y="123" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">cos +</text>
<text x="330" y="143" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">tan +</text>
<text x="330" y="171" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">all positive</text>
<text x="130" y="75" font-size="20" fill="#d9480f" text-anchor="middle" font-weight="bold">II</text>
<text x="130" y="103" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">sin +</text>
<text x="130" y="123" font-size="14" fill="#1c4e80" text-anchor="middle" font-weight="normal">cos −</text>
<text x="130" y="143" font-size="14" fill="#1c4e80" text-anchor="middle" font-weight="normal">tan −</text>
<text x="130" y="171" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">only sin</text>
<text x="130" y="265" font-size="20" fill="#d9480f" text-anchor="middle" font-weight="bold">III</text>
<text x="130" y="293" font-size="14" fill="#1c4e80" text-anchor="middle" font-weight="normal">sin −</text>
<text x="130" y="313" font-size="14" fill="#1c4e80" text-anchor="middle" font-weight="normal">cos −</text>
<text x="130" y="333" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">tan +</text>
<text x="130" y="361" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">only tan</text>
<text x="330" y="265" font-size="20" fill="#d9480f" text-anchor="middle" font-weight="bold">IV</text>
<text x="330" y="293" font-size="14" fill="#1c4e80" text-anchor="middle" font-weight="normal">sin −</text>
<text x="330" y="313" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">cos +</text>
<text x="330" y="333" font-size="14" fill="#1c4e80" text-anchor="middle" font-weight="normal">tan −</text>
<text x="330" y="361" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">only cos</text>
<text x="230" y="412" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">cos follows the sign of x, sin the sign of y, tan = sin / cos.</text>
</svg>
