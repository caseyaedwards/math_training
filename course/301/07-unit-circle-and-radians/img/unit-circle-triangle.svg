<text x="218" y="360" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">30°</text>
<text x="289.9" y="392" font-size="14" fill="#d9480f" text-anchor="middle" font-weight="bold">cos 30° = √3/2 ≈ 0.866</text>
<text x="411.81" y="300" font-size="14" fill="#d9480f" text-anchor="end" font-weight="bold">sin 30° = 1/2</text>
<text x="279.9" y="285" font-size="16" fill="#222222" text-anchor="end" font-weight="bold">1</text>
<text x="429.81" y="210" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">(√3/2, 1/2)</text>
<text x="466" y="390" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal">1</text>
<text x="148" y="74" font-size="13" fill="#868e96" text-anchor="end" font-weight="normal">1</text>
<text x="300" y="26" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Hypotenuse 1 means sin = opposite and cos = adjacent</text>
<text x="260" y="468" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">So the point at angle θ on the unit circle is (cos θ, sin θ).</text>
</svg>
