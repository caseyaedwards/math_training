<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="520" height="350" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Triangle ABC with sides a, b, c opposite the matching angles and height h from C</title>
<rect x="0" y="0" width="520" height="350" fill="#ffffff"/>
<path d="M 60 270 L 460 270 L 190 70 Z" fill="none" stroke="#222222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="190" y1="70" x2="190" y2="270" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4"/>
<path d="M 190 256 L 204 256 L 204 270" fill="none" stroke="#d9480f" stroke-width="1.2" stroke-linejoin="round"/>
<text x="198" y="180" font-size="16" fill="#d9480f" text-anchor="start" font-weight="bold">h</text>
<text x="46" y="276" font-size="16" fill="#222222" text-anchor="end" font-weight="bold">A</text>
<text x="472" y="276" font-size="16" fill="#222222" text-anchor="start" font-weight="bold">B</text>
<text x="190" y="58" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">C</text>
<text x="300" y="294" font-size="16" fill="#222222" text-anchor="middle" font-weight="normal" font-style="italic">c</text>
<text x="337" y="164" font-size="16" fill="#222222" text-anchor="start" font-weight="normal" font-style="italic">a</text>
<text x="113" y="164" font-size="16" fill="#222222" text-anchor="end" font-weight="normal" font-style="italic">b</text>
<text x="260" y="318" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Side a faces angle A, side b faces B, side c faces C.</text>
<text x="260" y="336" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Two ways to write the height: h = b sin A and h = a sin B.</text>
<text x="260" y="30" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal">Lowercase side sits across from the uppercase angle</text>
</svg>
