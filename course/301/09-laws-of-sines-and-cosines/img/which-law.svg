<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Which law to use: SAS and SSS use the law of cosines; ASA and AAS use the law of sines; SSA uses the law of sines and gives zero, one or two triangles</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d9480f"/></marker><marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c4e80"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<rect x="280" y="20" width="200" height="50" rx="8" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
<text x="380" y="50" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">What do you know?</text>
<line x1="380" y1="70" x2="95" y2="128" stroke="#222222" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="20" y="130" width="150" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="95" y="155" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">SAS: two sides and</text>
<text x="95" y="173" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">the angle between</text>
<line x1="95" y1="190" x2="95" y2="218" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arra)"/>
<text x="95" y="238" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">law of cosines</text>
<line x1="380" y1="70" x2="285" y2="128" stroke="#222222" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="210" y="130" width="150" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="285" y="155" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">SSS: all three sides</text>
<text x="285" y="173" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">(find an angle)</text>
<line x1="285" y1="190" x2="285" y2="218" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arra)"/>
<text x="285" y="238" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">law of cosines</text>
<line x1="380" y1="70" x2="475" y2="128" stroke="#222222" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="400" y="130" width="150" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="475" y="155" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">ASA or AAS:</text>
<text x="475" y="173" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">two angles, one side</text>
<line x1="475" y1="190" x2="475" y2="218" stroke="#1c4e80" stroke-width="1.4" marker-end="url(#arrm)"/>
<text x="475" y="238" font-size="13" fill="#1c4e80" text-anchor="middle" font-weight="bold">law of sines</text>
<line x1="380" y1="70" x2="665" y2="128" stroke="#222222" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="590" y="130" width="150" height="60" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="665" y="155" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">SSA: two sides, an</text>
<text x="665" y="173" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">angle not between</text>
<line x1="665" y1="190" x2="665" y2="218" stroke="#1c4e80" stroke-width="1.4" marker-end="url(#arrm)"/>
<text x="665" y="238" font-size="13" fill="#1c4e80" text-anchor="middle" font-weight="bold">law of sines</text>
<text x="665" y="256" font-size="12" fill="#1c4e80" text-anchor="middle" font-weight="normal">check for 0, 1 or 2</text>
<text x="380" y="290" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal">Right angle present? Plain SOH CAH TOA is quicker.</text>
</svg>
