<text x="186" y="290" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">n + 1 = 7 wide</text>
<text x="50" y="158" font-size="13" fill="#222222" text-anchor="end" font-weight="normal">n = 6</text>
<text x="332" y="90" font-size="13" fill="#1c4e80" text-anchor="start" font-weight="bold">blue: 1 + 2 + ... + 6</text>
<text x="332" y="112" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">orange: the same,</text>
<text x="332" y="130" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">turned around</text>
<text x="332" y="170" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">together: 6 × 7 = 42</text>
<text x="332" y="192" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">one staircase: 42 / 2 = 21</text>
<text x="280" y="365" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">1 + 2 + ... + n = n(n + 1) / 2. Gauss, age about nine, reportedly found it to dodge busywork.</text>
