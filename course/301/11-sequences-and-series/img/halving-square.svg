<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 430" width="570" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A unit square cut in halves again and again: 1/2 + 1/4 + 1/8 + ... fills the whole square</title>
<rect x="0" y="0" width="570" height="430" fill="#ffffff"/>
<rect x="60" y="40" width="340" height="340" rx="0" fill="#ffffff" stroke="#222222" stroke-width="2.5"/>
<rect x="60" y="40" width="170" height="340" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="145" y="216" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">1/2</text>
<rect x="230" y="40" width="170" height="170" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="315" y="131" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold">1/4</text>
<rect x="230" y="210" width="85" height="170" rx="0" fill="#f3f0ee" stroke="#222222" stroke-width="1.5"/>
<text x="272.5" y="301" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">1/8</text>
<rect x="315" y="210" width="85" height="85" rx="0" fill="#f3f0ee" stroke="#222222" stroke-width="1.5"/>
<text x="357.5" y="258.5" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">1/16</text>
<rect x="315" y="295" width="42.5" height="85" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="336.25" y="343.5" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">1/32</text>
<rect x="357.5" y="295" width="42.5" height="42.5" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<text x="378.75" y="322.25" font-size="10" fill="#222222" text-anchor="middle" font-weight="bold">1/64</text>
<rect x="357.5" y="337.5" width="21.25" height="42.5" rx="0" fill="#f3f0ee" stroke="#222222" stroke-width="1.5"/>
<rect x="378.75" y="337.5" width="21.25" height="21.25" rx="0" fill="#f3f0ee" stroke="#222222" stroke-width="1.5"/>
<rect x="378.75" y="358.75" width="10.62" height="21.25" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<rect x="389.38" y="358.75" width="10.62" height="10.62" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.5"/>
<rect x="389.38" y="369.38" width="10.62" height="10.62" rx="0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<line x1="394.69" y1="374.69" x2="450" y2="300" stroke="#d9480f" stroke-width="1.2"/>
<text x="455" y="296" font-size="13" fill="#d9480f" text-anchor="start" font-weight="normal">what is left</text>
<text x="455" y="312" font-size="13" fill="#d9480f" text-anchor="start" font-weight="normal">shrinks to 0</text>
<text x="260" y="412" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">1/2 + 1/4 + 1/8 + 1/16 + ... = 1</text>
</svg>
