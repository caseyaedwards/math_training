<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Odd numbers build squares: 1 + 3 + 5 + 7 + 9 = 25 = 5 squared, each odd number an L-shaped layer</title>
<rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
<rect x="60" y="240" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="85" y="270" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">1</text>
<rect x="60" y="190" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="110" y="240" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="110" y="190" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<text x="135" y="220" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">3</text>
<rect x="60" y="140" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="110" y="140" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="160" y="240" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="160" y="190" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="160" y="140" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="185" y="170" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">5</text>
<rect x="60" y="90" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="110" y="90" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="160" y="90" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="210" y="240" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="210" y="190" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="210" y="140" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<rect x="210" y="90" width="50" height="50" rx="0" fill="#dbe4ee" stroke="#222222" stroke-width="1.2"/>
<text x="235" y="120" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">7</text>
<rect x="60" y="40" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="110" y="40" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="160" y="40" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="210" y="40" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="260" y="240" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="260" y="190" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="260" y="140" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="260" y="90" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<rect x="260" y="40" width="50" height="50" rx="0" fill="#fbe3d6" stroke="#222222" stroke-width="1.2"/>
<text x="285" y="70" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">9</text>
<text x="330" y="100" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">layer sizes:</text>
<text x="330" y="120" font-size="13" fill="#d9480f" text-anchor="start" font-weight="bold">1, 3, 5, 7, 9</text>
<text x="330" y="160" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">total: 5 × 5</text>
<text x="240" y="330" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal">Σ (2k − 1) for k = 1..n equals n². Each L adds one row and one column.</text>
</svg>
