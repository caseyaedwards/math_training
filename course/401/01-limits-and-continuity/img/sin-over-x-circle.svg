<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>On the unit circle a small arc x and the height sin x are nearly equal</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="480" height="420" fill="#ffffff"/>
<path d="M 390 360 A 300 300 0 0 0 198.71 80.39" fill="none" stroke="#868e96" stroke-width="1"/>
<line x1="90" y1="360" x2="410" y2="360" stroke="#868e96" stroke-width="1"/>
<line x1="90" y1="360" x2="360.13" y2="229.51" stroke="#222222" stroke-width="1.5"/>
<path d="M 390 360 A 300 300 0 0 0 360.13 229.51" fill="none" stroke="#d9480f" stroke-width="4"/>
<line x1="360.13" y1="229.51" x2="360.13" y2="360" stroke="#222222" stroke-width="3"/>
<text x="398" y="294.76" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">arc = x</text>
<text x="352.13" y="294.76" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">sin x</text>
<text x="130" y="352" text-anchor="start" font-size="14" fill="#222222" font-style="italic">x</text>
<text x="240" y="382" text-anchor="middle" font-size="12" fill="#868e96">radius 1</text>
<text x="20" y="30" text-anchor="start" font-size="13" fill="#222222">x = 0.45 rad: sin x = 0.4350, ratio = 0.9666</text>
<text x="20" y="52" text-anchor="start" font-size="12" fill="#868e96">As the angle shrinks, the straight height and the arc</text>
<text x="20" y="70" text-anchor="start" font-size="12" fill="#868e96">become the same length: sin x / x → 1.</text>
</svg>
