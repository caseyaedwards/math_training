<text x="345" y="192" text-anchor="start" font-size="14" fill="#222222">y: 6 turns</text>
<text x="440" y="70" text-anchor="start" font-size="14" fill="#d9480f">du/dx = 3</text>
<text x="440" y="95" text-anchor="start" font-size="14" fill="#222222">dy/du = 2</text>
