<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Chain rule as a pipeline of rate multipliers</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="220" fill="#ffffff"/>
<rect x="20" y="60" width="190" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="115" y="92" text-anchor="middle" font-size="16" fill="#222222" font-style="italic">x</text>
<text x="115" y="114" text-anchor="middle" font-size="12" fill="#868e96">input</text>
<rect x="250" y="60" width="190" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="345" y="92" text-anchor="middle" font-size="16" fill="#222222" font-style="italic">u = g(x)</text>
<text x="345" y="114" text-anchor="middle" font-size="12" fill="#868e96">middle</text>
<rect x="480" y="60" width="190" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="575" y="92" text-anchor="middle" font-size="16" fill="#222222" font-style="italic">y = f(u)</text>
<text x="575" y="114" text-anchor="middle" font-size="12" fill="#868e96">output</text>
<line x1="210" y1="95" x2="248" y2="95" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="440" y1="95" x2="478" y2="95" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<text x="229" y="50" text-anchor="middle" font-size="14" fill="#d9480f">du/dx = 3</text>
<text x="459" y="50" text-anchor="middle" font-size="14" fill="#d9480f">dy/du = 2</text>
<line x1="115" y1="160" x2="575" y2="160" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arra)"/>
<text x="345" y="186" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">dy/dx = (dy/du)·(du/dx) = 2 · 3 = 6</text>
<text x="345" y="208" text-anchor="middle" font-size="12" fill="#868e96">Like gears: input turns once, middle turns 3 times, output turns 6 times.</text>
</svg>
