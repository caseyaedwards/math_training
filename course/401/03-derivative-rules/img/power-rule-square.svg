<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A square of side x grows by dx</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
<rect x="80" y="60" width="240" height="240" rx="0" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<rect x="320" y="60" width="60" height="240" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5"/>
<rect x="80" y="300" width="240" height="60" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5"/>
<rect x="320" y="300" width="60" height="60" rx="0" fill="#222222" fill-opacity="0.25" stroke="#222222" stroke-width="1.5"/>
<text x="200" y="185" text-anchor="middle" font-size="22" fill="#222222">x²</text>
<text x="350" y="185" text-anchor="middle" font-size="14" fill="#d9480f">x·dx</text>
<text x="200" y="335" text-anchor="middle" font-size="14" fill="#d9480f">x·dx</text>
<text x="350" y="335" text-anchor="middle" font-size="12" fill="#222222">dx²</text>
<line x1="80" y1="46" x2="320" y2="46" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="200" y="40" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">x</text>
<line x1="320" y1="46" x2="380" y2="46" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="350" y="40" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">dx</text>
<line x1="66" y1="60" x2="66" y2="300" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="58" y="185" text-anchor="end" font-size="14" fill="#222222" font-style="italic">x</text>
<text x="260" y="395" text-anchor="middle" font-size="12" fill="#868e96">New area − old area = 2x·dx + dx². The tiny corner vanishes, leaving 2x.</text>
</svg>
