<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Product rule as a growing rectangle</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
<rect x="90" y="60" width="300" height="200" rx="0" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<rect x="390" y="60" width="60" height="200" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5"/>
<rect x="90" y="260" width="300" height="50" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5"/>
<rect x="390" y="260" width="60" height="50" rx="0" fill="#222222" fill-opacity="0.25" stroke="#222222" stroke-width="1.5"/>
<text x="240" y="165" text-anchor="middle" font-size="20" fill="#222222">f · g</text>
<text x="420" y="165" text-anchor="middle" font-size="14" fill="#d9480f">g·df</text>
<text x="240" y="290" text-anchor="middle" font-size="14" fill="#d9480f">f·dg</text>
<text x="420" y="290" text-anchor="middle" font-size="11" fill="#222222">df·dg</text>
<line x1="90" y1="46" x2="390" y2="46" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="240" y="40" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">f</text>
<line x1="390" y1="46" x2="450" y2="46" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="420" y="40" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">df</text>
<line x1="76" y1="60" x2="76" y2="260" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="68" y="165" text-anchor="end" font-size="14" fill="#222222" font-style="italic">g</text>
<line x1="76" y1="260" x2="76" y2="310" stroke="#222222" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="68" y="290" text-anchor="end" font-size="14" fill="#222222" font-style="italic">dg</text>
<text x="280" y="370" text-anchor="middle" font-size="12" fill="#868e96">d(fg) = f·dg + g·df + (df·dg, too small to matter)</text>
</svg>
