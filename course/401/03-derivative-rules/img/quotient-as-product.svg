<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Quotient rule built from the product rule and the chain rule</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="260" fill="#ffffff"/>
<rect x="20" y="70" width="150" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="95" y="102" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">f / g</text>
<text x="95" y="124" text-anchor="middle" font-size="11" fill="#868e96">the quotient</text>
<rect x="200" y="70" width="150" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="275" y="102" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">f · g⁻¹</text>
<text x="275" y="124" text-anchor="middle" font-size="11" fill="#868e96">rewrite as a product</text>
<rect x="380" y="70" width="170" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="465" y="102" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">f′·g⁻¹ + f·(−g⁻²·g′)</text>
<text x="465" y="124" text-anchor="middle" font-size="11" fill="#868e96">product rule + chain rule</text>
<rect x="570" y="70" width="120" height="70" rx="8" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<text x="630" y="102" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">(f′g − fg′) / g²</text>
<text x="630" y="124" text-anchor="middle" font-size="11" fill="#868e96">common denominator</text>
<line x1="170" y1="105" x2="198" y2="105" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="350" y1="105" x2="378" y2="105" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="550" y1="105" x2="568" y2="105" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="350" y="190" text-anchor="middle" font-size="14" fill="#d9480f">Memory aid: low d-high minus high d-low, over low squared.</text>
<text x="350" y="215" text-anchor="middle" font-size="12" fill="#868e96">The minus sign comes from the derivative of g⁻¹, which is −g⁻²·g′.</text>
</svg>
