<rect x="150" y="336" width="14" height="14" rx="0" fill="none" stroke="#222222" stroke-width="1"/>
<text x="252" y="224" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">10 m</text>
<text x="240" y="378" text-anchor="middle" font-size="14" fill="#222222">x = 6 m</text>
<text x="136" y="230" text-anchor="end" font-size="14" fill="#222222">y = 8 m</text>
<line x1="336" y1="334" x2="396" y2="334" stroke="#d9480f" stroke-width="2" marker-end="url(#arra)"/>
<text x="400" y="320" text-anchor="start" font-size="14" fill="#d9480f">dx/dt = 1 m/s</text>
<line x1="128" y1="114" x2="128" y2="174" stroke="#d9480f" stroke-width="2" marker-end="url(#arra)"/>
<text x="120" y="150" text-anchor="end" font-size="14" fill="#d9480f">dy/dt = ?</text>
<text x="360" y="60" text-anchor="middle" font-size="14" fill="#222222">x² + y² = 10²  at every instant</text>
