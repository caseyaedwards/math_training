<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A 10 m ladder sliding down a wall</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="580" height="400" fill="#ffffff"/>
<line x1="150" y1="350" x2="150" y2="20" stroke="#222222" stroke-width="3"/>
<line x1="150" y1="350" x2="540" y2="350" stroke="#222222" stroke-width="3"/>
