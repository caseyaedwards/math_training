<line x1="420" y1="350" x2="412" y2="358" stroke="#868e96" stroke-width="1"/>
<line x1="450" y1="350" x2="442" y2="358" stroke="#868e96" stroke-width="1"/>
<line x1="480" y1="350" x2="472" y2="358" stroke="#868e96" stroke-width="1"/>
<line x1="510" y1="350" x2="502" y2="358" stroke="#868e96" stroke-width="1"/>
<line x1="150" y1="320" x2="142" y2="328" stroke="#868e96" stroke-width="1"/>
