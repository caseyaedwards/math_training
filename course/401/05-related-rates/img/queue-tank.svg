<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A queue as a tank with an inflow and an outflow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
<rect x="200" y="60" width="160" height="180" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<rect x="200" y="150" width="160" height="90" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="none" stroke-width="1.5"/>
<line x1="200" y1="150" x2="360" y2="150" stroke="#d9480f" stroke-width="1.5"/>
<rect x="215" y="205" width="16" height="16" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<rect x="238" y="205" width="16" height="16" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<rect x="261" y="205" width="16" height="16" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<rect x="284" y="205" width="16" height="16" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<rect x="307" y="205" width="16" height="16" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<rect x="330" y="205" width="16" height="16" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="280" y="140" text-anchor="middle" font-size="14" fill="#222222">queue Q(t)</text>
<line x1="60" y1="100" x2="196" y2="100" stroke="#d9480f" stroke-width="3" marker-end="url(#arra)"/>
<text x="60" y="88" text-anchor="start" font-size="12" fill="#d9480f">arrivals λ = 120 req/s</text>
<line x1="364" y1="225" x2="500" y2="225" stroke="#222222" stroke-width="3" marker-end="url(#arr)"/>
<text x="370" y="213" text-anchor="start" font-size="12" fill="#222222">served μ = 100 req/s</text>
<text x="280" y="280" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">dQ/dt = λ − μ = 20 requests per second, piling up</text>
</svg>
