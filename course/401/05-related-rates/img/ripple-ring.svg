<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" width="460" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Ring added when a circle of radius r grows by dr</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="460" height="400" fill="#ffffff"/>
<circle cx="230" cy="200" r="152" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="230" cy="200" r="130" fill="#e9ecef" stroke="#222222" stroke-width="1.5"/>
<line x1="230" y1="200" x2="360" y2="200" stroke="#222222" stroke-width="1.5"/>
<text x="295" y="192" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">r</text>
<line x1="360" y1="200" x2="382" y2="200" stroke="#d9480f" stroke-width="1.5"/>
<text x="371" y="192" text-anchor="middle" font-size="14" fill="#d9480f" font-style="italic">dr</text>
<circle cx="230" cy="200" r="3" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="230" y="240" text-anchor="middle" font-size="14" fill="#222222">area πr²</text>
<text x="230" y="30" text-anchor="middle" font-size="14" fill="#d9480f">ring ≈ circumference × thickness = 2πr · dr</text>
<text x="230" y="390" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">dA/dt = 2πr · dr/dt</text>
</svg>
