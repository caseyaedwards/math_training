<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Water filling an upside-down cone</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="520" height="420" fill="#ffffff"/>
<polygon points="70,50 370,50 220,350" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="120,150 320,150 220,350" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round"/>
<ellipse cx="220" cy="150" rx="100" ry="10" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="1.5"/>
<ellipse cx="220" cy="50" rx="150" ry="14" fill="none" stroke="#222222" stroke-width="1.5"/>
<line x1="220" y1="150" x2="320" y2="150" stroke="#222222" stroke-width="1.5"/>
<text x="270" y="144" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">r</text>
<line x1="400" y1="350" x2="400" y2="150" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arra)" marker-start="url(#arra)"/>
<text x="408" y="250" text-anchor="start" font-size="14" fill="#d9480f">h = 4 m</text>
<line x1="440" y1="350" x2="440" y2="50" stroke="#868e96" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="448" y="110" text-anchor="start" font-size="14" fill="#868e96">6 m</text>
<text x="370" y="28" text-anchor="end" font-size="12" fill="#868e96">top radius 3 m</text>
<line x1="220" y1="0" x2="220" y2="48" stroke="#d9480f" stroke-width="2" marker-end="url(#arra)"/>
<text x="230" y="16" text-anchor="start" font-size="12" fill="#d9480f">2 m³/min in</text>
<text x="260" y="405" text-anchor="middle" font-size="12" fill="#868e96">Similar triangles: r/h = 3/6, so r = h/2 and V = πh³/12.</text>
</svg>
