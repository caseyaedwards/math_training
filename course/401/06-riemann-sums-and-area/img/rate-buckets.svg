<text x="300" y="330" text-anchor="middle" font-size="12" fill="#868e96">Each bar: rate (req/s) × 60 s = requests in that minute (number inside).</text>
<text x="300" y="350" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold">Total = sum of bar areas = 73,200 requests.</text>
