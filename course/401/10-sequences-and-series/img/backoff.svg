<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Exponential backoff waits on a timeline</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="660" height="250" fill="#ffffff"/>
<rect x="30" y="76" width="9" height="28" rx="0" fill="#d9480f" fill-opacity="0.12" stroke="#d9480f" stroke-width="1"/>
<line x1="39" y1="68" x2="39" y2="112" stroke="#222222" stroke-width="1.5"/>
<rect x="39" y="76" width="18" height="28" rx="0" fill="#d9480f" fill-opacity="0.24" stroke="#d9480f" stroke-width="1"/>
<line x1="57" y1="68" x2="57" y2="112" stroke="#222222" stroke-width="1.5"/>
<rect x="57" y="76" width="36" height="28" rx="0" fill="#d9480f" fill-opacity="0.36" stroke="#d9480f" stroke-width="1"/>
<text x="75" y="95" text-anchor="middle" font-size="12" fill="#222222">4 s</text>
<line x1="93" y1="68" x2="93" y2="112" stroke="#222222" stroke-width="1.5"/>
<rect x="93" y="76" width="72" height="28" rx="0" fill="#d9480f" fill-opacity="0.48" stroke="#d9480f" stroke-width="1"/>
<text x="129" y="95" text-anchor="middle" font-size="12" fill="#222222">8 s</text>
<line x1="165" y1="68" x2="165" y2="112" stroke="#222222" stroke-width="1.5"/>
<rect x="165" y="76" width="144" height="28" rx="0" fill="#d9480f" fill-opacity="0.6" stroke="#d9480f" stroke-width="1"/>
<text x="237" y="95" text-anchor="middle" font-size="12" fill="#222222">16 s</text>
<line x1="309" y1="68" x2="309" y2="112" stroke="#222222" stroke-width="1.5"/>
<rect x="309" y="76" width="288" height="28" rx="0" fill="#d9480f" fill-opacity="0.72" stroke="#d9480f" stroke-width="1"/>
<text x="453" y="95" text-anchor="middle" font-size="12" fill="#222222">32 s</text>
<line x1="597" y1="68" x2="597" y2="112" stroke="#222222" stroke-width="1.5"/>
<line x1="30" y1="130" x2="606" y2="130" stroke="#222222" stroke-width="1" marker-end="url(#arr)"/>
<text x="30" y="148" text-anchor="middle" font-size="11" fill="#868e96">0</text>
<text x="93" y="148" text-anchor="middle" font-size="11" fill="#868e96">7</text>
<text x="165" y="148" text-anchor="middle" font-size="11" fill="#868e96">15</text>
<text x="309" y="148" text-anchor="middle" font-size="11" fill="#868e96">31</text>
<text x="597" y="148" text-anchor="middle" font-size="11" fill="#868e96">63</text>
<text x="30" y="40" text-anchor="start" font-size="13" fill="#222222">Retry waits 1, 2, 4, 8, 16, 32 s. Dark ticks are retries.</text>
<text x="30" y="200" text-anchor="start" font-size="12" fill="#868e96">Total after n retries: 1 + 2 + 4 + ... + 2ⁿ⁻¹ = 2ⁿ − 1 seconds. Six retries: 63 s.</text>
<text x="30" y="222" text-anchor="start" font-size="12" fill="#868e96">A ratio of 2 diverges, so production backoff always has a cap and a retry limit.</text>
</svg>
