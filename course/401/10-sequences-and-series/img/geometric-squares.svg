<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>One half plus one quarter plus one eighth and so on fills the unit square</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="440" height="440" fill="#ffffff"/>
<rect x="60" y="40" width="160" height="320" rx="0" fill="#d9480f" fill-opacity="0.08" stroke="#222222" stroke-width="1.2"/>
<text x="140" y="205" text-anchor="middle" font-size="18" fill="#222222">1/2</text>
<rect x="220" y="40" width="160" height="160" rx="0" fill="#d9480f" fill-opacity="0.16" stroke="#222222" stroke-width="1.2"/>
<text x="300" y="125" text-anchor="middle" font-size="16" fill="#222222">1/4</text>
<rect x="220" y="200" width="80" height="160" rx="0" fill="#d9480f" fill-opacity="0.24" stroke="#222222" stroke-width="1.2"/>
<text x="260" y="285" text-anchor="middle" font-size="14" fill="#222222">1/8</text>
<rect x="300" y="200" width="80" height="80" rx="0" fill="#d9480f" fill-opacity="0.32" stroke="#222222" stroke-width="1.2"/>
<text x="340" y="245" text-anchor="middle" font-size="12" fill="#222222">1/16</text>
<rect x="300" y="280" width="40" height="80" rx="0" fill="#d9480f" fill-opacity="0.4" stroke="#222222" stroke-width="1.2"/>
<text x="320" y="325" text-anchor="middle" font-size="10" fill="#222222">1/32</text>
<rect x="340" y="280" width="40" height="40" rx="0" fill="#d9480f" fill-opacity="0.48000000000000004" stroke="#222222" stroke-width="1.2"/>
<text x="360" y="305" text-anchor="middle" font-size="9" fill="#222222">1/64</text>
<rect x="340" y="320" width="20" height="40" rx="0" fill="#d9480f" fill-opacity="0.5599999999999999" stroke="#222222" stroke-width="1.2"/>
<rect x="360" y="320" width="20" height="20" rx="0" fill="#d9480f" fill-opacity="0.64" stroke="#222222" stroke-width="1.2"/>
<rect x="360" y="340" width="10" height="20" rx="0" fill="#d9480f" fill-opacity="0.72" stroke="#222222" stroke-width="1.2"/>
<rect x="60" y="40" width="320" height="320" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="220" y="395" text-anchor="middle" font-size="12" fill="#868e96">Each piece is half of what is left.</text>
<text x="220" y="420" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">1/2 + 1/4 + 1/8 + ... = 1</text>
</svg>
