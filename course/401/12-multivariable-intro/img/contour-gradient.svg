<text x="20" y="24" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">f(x, y) = x² + 2y²</text>
<text x="20" y="44" text-anchor="start" font-size="12" fill="#d9480f">Arrows: ∇f = (2x, 4y) at points on the level-4 curve. Each points uphill,</text>
<text x="20" y="62" text-anchor="start" font-size="12" fill="#d9480f">perpendicular to the contour.</text>
<text x="280" y="490" text-anchor="middle" font-size="12" fill="#868e96">Numbers mark each contour level. Crowded contours mean a steep slope.</text>
