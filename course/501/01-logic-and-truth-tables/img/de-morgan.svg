<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" font-family="sans-serif" font-size="14" role="img" aria-label="Four Venn panels: NOT P, NOT Q, their union, and NOT (P AND Q); the last two shade the same region, everything except the overlap">
<title>Four Venn panels: NOT P, NOT Q, their union, and NOT (P AND Q); the last two shade the same region, everything except the overlap</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="780" height="200" fill="white"/>
<text x="390" y="20" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">De Morgan: NOT (P AND Q) is the same region as (NOT P) OR (NOT Q)</text>
