<text x="325" y="100" text-anchor="middle" fill="#222222" font-weight="bold">Q</text>
<text x="285" y="180" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">NOT Q</text>
<clipPath id="dm2P"><circle cx="462" cy="95" r="38"/></clipPath>
