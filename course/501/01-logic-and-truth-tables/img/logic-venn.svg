<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" font-family="sans-serif" font-size="14" role="img" aria-label="Four Venn panels shading where P AND Q, P OR Q, NOT P, and P implies Q are true">
