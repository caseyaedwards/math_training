<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 265" width="520" height="265" font-family="sans-serif" font-size="14" role="img" aria-label="Grid with rows web1, web2, db1 and columns port 80 and 443; each of the 6 cells holds an ordered pair">
<title>Grid with rows web1, web2, db1 and columns port 80 and 443; each of the 6 cells holds an ordered pair</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="520" height="265" fill="white"/>
<text x="260" y="24" text-anchor="middle" fill="#222222" font-weight="bold">Hosts × Ports: 3 × 2 = 6 ordered pairs</text>
<text x="190" y="50" text-anchor="middle" fill="#222222" font-weight="bold">port 80</text>
<text x="310" y="50" text-anchor="middle" fill="#222222" font-weight="bold">port 443</text>
<text x="118" y="90" text-anchor="end" fill="#222222" font-weight="bold">web1</text>
<rect x="130" y="60" width="120" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="190" y="90" text-anchor="middle" fill="#222222" font-size="13">(web1, 80)</text>
<rect x="250" y="60" width="120" height="50" fill="white" stroke="#222222" stroke-width="1.2"/>
<text x="310" y="90" text-anchor="middle" fill="#222222" font-size="13">(web1, 443)</text>
<text x="118" y="140" text-anchor="end" fill="#222222" font-weight="bold">web2</text>
<rect x="130" y="110" width="120" height="50" fill="white" stroke="#222222" stroke-width="1.2"/>
<text x="190" y="140" text-anchor="middle" fill="#222222" font-size="13">(web2, 80)</text>
<rect x="250" y="110" width="120" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="310" y="140" text-anchor="middle" fill="#222222" font-size="13">(web2, 443)</text>
<text x="118" y="190" text-anchor="end" fill="#222222" font-weight="bold">db1</text>
<rect x="130" y="160" width="120" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="190" y="190" text-anchor="middle" fill="#222222" font-size="13">(db1, 80)</text>
<rect x="250" y="160" width="120" height="50" fill="white" stroke="#222222" stroke-width="1.2"/>
<text x="310" y="190" text-anchor="middle" fill="#222222" font-size="13">(db1, 443)</text>
<text x="260" y="240" text-anchor="middle" fill="#888888" font-size="12">Every row meets every column once: the product rule in a grid.</text>
</svg>
