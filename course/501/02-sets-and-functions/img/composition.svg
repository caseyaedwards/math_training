<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" font-family="sans-serif" font-size="14" role="img" aria-label="Two pipelines: 1 through f (add 2) then g (times 5) gives 15; 1 through g then f gives 7">
<title>Two pipelines: 1 through f (add 2) then g (times 5) gives 15; 1 through g then f gives 7</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="720" height="210" fill="white"/>
<text x="360" y="22" text-anchor="middle" fill="#222222" font-weight="bold">Composition is a pipeline. Order matters.</text>
<text x="20" y="45" text-anchor="start" fill="#888888" font-weight="bold" font-size="13">(g ∘ f)(1): f first</text>
<circle cx="60" cy="75" r="20" fill="white" stroke="#222222" stroke-width="2"/>
<text x="60" y="80" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<line x1="83" y1="75" x2="122" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="125" y="55" width="100" height="40" fill="#f6d5c6" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="175" y="80" text-anchor="middle" fill="#222222">f: +2</text>
<line x1="228" y1="75" x2="267" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="290" cy="75" r="20" fill="white" stroke="#222222" stroke-width="2"/>
<text x="290" y="80" text-anchor="middle" fill="#222222" font-weight="bold">3</text>
<line x1="313" y1="75" x2="352" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="355" y="55" width="100" height="40" fill="#f6d5c6" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="405" y="80" text-anchor="middle" fill="#222222">g: ×5</text>
<line x1="458" y1="75" x2="497" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="520" cy="75" r="20" fill="white" stroke="#d9480f" stroke-width="2.5"/>
<text x="520" y="80" text-anchor="middle" fill="#d9480f" font-weight="bold">15</text>
<text x="20" y="130" text-anchor="start" fill="#888888" font-weight="bold" font-size="13">(f ∘ g)(1): g first</text>
<circle cx="60" cy="160" r="20" fill="white" stroke="#222222" stroke-width="2"/>
<text x="60" y="165" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<line x1="83" y1="160" x2="122" y2="160" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="125" y="140" width="100" height="40" fill="#f6d5c6" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="175" y="165" text-anchor="middle" fill="#222222">g: ×5</text>
<line x1="228" y1="160" x2="267" y2="160" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="290" cy="160" r="20" fill="white" stroke="#222222" stroke-width="2"/>
<text x="290" y="165" text-anchor="middle" fill="#222222" font-weight="bold">5</text>
<line x1="313" y1="160" x2="352" y2="160" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="355" y="140" width="100" height="40" fill="#f6d5c6" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="405" y="165" text-anchor="middle" fill="#222222">f: +2</text>
<line x1="458" y1="160" x2="497" y2="160" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="520" cy="160" r="20" fill="white" stroke="#d9480f" stroke-width="2.5"/>
<text x="520" y="165" text-anchor="middle" fill="#d9480f" font-weight="bold">7</text>
</svg>
