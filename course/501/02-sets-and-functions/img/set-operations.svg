<text x="723.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="681.5" y="185" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">Aᶜ (complement)</text>
</svg>
