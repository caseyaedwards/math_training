<circle cx="512.5" cy="95" r="40" fill="none" stroke="#222222" stroke-width="2"/>
<text x="446.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="530.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="488.5" y="185" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">A \ B (difference)</text>
<clipPath id="so3"><circle cx="657.5" cy="95" r="40"/></clipPath>
