<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" font-family="sans-serif" font-size="14" role="img" aria-label="Four Venn panels shading union, intersection, A minus B, and the complement of A">
<title>Four Venn panels shading union, intersection, A minus B, and the complement of A</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="780" height="200" fill="white"/>
<text x="390" y="18" text-anchor="middle" fill="#888888" font-size="13">Each operation picks regions. Shaded = in the result.</text>
<clipPath id="so0"><circle cx="78.5" cy="95" r="40"/></clipPath>
<circle cx="78.5" cy="95" r="40" fill="#d9480f" stroke="none" stroke-width="0" fill-opacity="0.45"/>
<circle cx="126.5" cy="95" r="40" fill="#d9480f" stroke="none" stroke-width="0" fill-opacity="0.45"/>
