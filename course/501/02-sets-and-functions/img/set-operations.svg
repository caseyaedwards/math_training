<circle cx="319.5" cy="95" r="40" fill="none" stroke="#222222" stroke-width="2"/>
<text x="253.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="337.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="295.5" y="185" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">A ∩ B (intersection)</text>
<clipPath id="so2"><circle cx="464.5" cy="95" r="40"/></clipPath>
