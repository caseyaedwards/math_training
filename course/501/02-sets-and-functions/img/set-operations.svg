<circle cx="126.5" cy="95" r="40" fill="none" stroke="#222222" stroke-width="2"/>
<text x="60.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="144.5" y="100" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="102.5" y="185" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">A ∪ B (union)</text>
<clipPath id="so1"><circle cx="271.5" cy="95" r="40"/></clipPath>
<circle cx="319.5" cy="95" r="40" fill="#d9480f" fill-opacity="0.45" clip-path="url(#so1)"/>
