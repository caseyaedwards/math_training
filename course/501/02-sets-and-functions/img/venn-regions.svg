<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="sans-serif" font-size="14" role="img" aria-label="Venn diagram: A = {1,2,3,4}, B = {3,4,5,6}, the overlap {3,4} shaded, 7 and 8 outside both">
<title>Venn diagram: A = {1,2,3,4}, B = {3,4,5,6}, the overlap {3,4} shaded, 7 and 8 outside both</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="520" height="300" fill="white"/>
<rect x="20" y="30" width="480" height="250" fill="none" stroke="#222222" stroke-width="1.5"/>
<text x="35" y="52" text-anchor="start" fill="#222222" font-size="13">U = {1, 2, 3, 4, 5, 6, 7, 8}</text>
<clipPath id="ca"><circle cx="200" cy="160" r="95"/></clipPath>
<circle cx="320" cy="160" r="95" fill="#d9480f" fill-opacity="0.35" clip-path="url(#ca)"/>
<circle cx="200" cy="160" r="95" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="320" cy="160" r="95" fill="none" stroke="#222222" stroke-width="2"/>
<text x="140" y="88" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">A</text>
<text x="380" y="88" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">B</text>
<text x="140" y="150" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">1</text>
<text x="150" y="190" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">2</text>
<text x="260" y="130" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">3</text>
<text x="260" y="165" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">4</text>
<text x="370" y="150" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">5</text>
<text x="360" y="195" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">6</text>
<text x="60" y="250" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">7</text>
<text x="460" y="250" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">8</text>
<text x="260" y="200" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="12">A ∩ B</text>
<text x="150" y="228" text-anchor="middle" fill="#888888" font-size="12">A only</text>
<text x="370" y="228" text-anchor="middle" fill="#888888" font-size="12">B only</text>
<text x="260" y="272" text-anchor="middle" fill="#888888" font-size="12">outside both: 7, 8</text>
</svg>
