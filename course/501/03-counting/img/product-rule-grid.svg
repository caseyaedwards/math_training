<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 275" width="520" height="275" font-family="sans-serif" font-size="14" role="img" aria-label="Grid of three regions by two instance sizes giving six cells, illustrating the product rule">
<title>Grid of three regions by two instance sizes giving six cells, illustrating the product rule</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="520" height="275" fill="white"/>
<text x="260" y="24" text-anchor="middle" fill="#222222" font-weight="bold">Product rule: 3 regions × 2 sizes = 6 choices</text>
<text x="215" y="58" text-anchor="middle" fill="#222222" font-weight="bold">small</text>
<text x="345" y="58" text-anchor="middle" fill="#222222" font-weight="bold">large</text>
<text x="138" y="100" text-anchor="end" fill="#222222" font-weight="bold">us-east</text>
<rect x="150" y="70" width="130" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="215" y="100" text-anchor="middle" fill="#222222" font-size="12">us-east/small</text>
<rect x="280" y="70" width="130" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="345" y="100" text-anchor="middle" fill="#222222" font-size="12">us-east/large</text>
<text x="138" y="150" text-anchor="end" fill="#222222" font-weight="bold">eu-west</text>
<rect x="150" y="120" width="130" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="215" y="150" text-anchor="middle" fill="#222222" font-size="12">eu-west/small</text>
<rect x="280" y="120" width="130" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="345" y="150" text-anchor="middle" fill="#222222" font-size="12">eu-west/large</text>
<text x="138" y="200" text-anchor="end" fill="#222222" font-weight="bold">ap-south</text>
<rect x="150" y="170" width="130" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="215" y="200" text-anchor="middle" fill="#222222" font-size="12">ap-south/small</text>
<rect x="280" y="170" width="130" height="50" fill="#f6d5c6" stroke="#222222" stroke-width="1.2"/>
<text x="345" y="200" text-anchor="middle" fill="#222222" font-size="12">ap-south/large</text>
<text x="260" y="250" text-anchor="middle" fill="#888888" font-size="12">Step one has 3 options, step two has 2: count the cells, 3 × 2.</text>
</svg>
