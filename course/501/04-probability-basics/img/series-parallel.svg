<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif" font-size="14" role="img" aria-label="Top: client calls X then Y in series, availability 0.999 times 0.999 = 0.998001. Bottom: three replicas of 0.99 in parallel, availability 0.999999">
<title>Top: client calls X then Y in series, availability 0.999 times 0.999 = 0.998001. Bottom: three replicas of 0.99 in parallel, availability 0.999999</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="720" height="330" fill="white"/>
<text x="360" y="22" text-anchor="middle" fill="#222222" font-weight="bold">Series: all must work. Parallel: one is enough.</text>
<rect x="20" y="57" width="80" height="36" fill="#eeeeee" stroke="#222222" stroke-width="2" rx="6"/>
<text x="60" y="80" text-anchor="middle" fill="#222222">client</text>
<line x1="100" y1="75" x2="178" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="180" y="57" width="120" height="36" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="240" y="80" text-anchor="middle" fill="#222222">X: 0.999</text>
<line x1="300" y1="75" x2="378" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="380" y="57" width="120" height="36" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="440" y="80" text-anchor="middle" fill="#222222">Y: 0.999</text>
<line x1="500" y1="75" x2="560" y2="75" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="570" y="80" text-anchor="start" fill="#222222" font-size="13">0.999 × 0.999</text>
<text x="570" y="100" text-anchor="start" fill="#d9480f" font-weight="bold" font-size="13">= 0.998001</text>
<rect x="20" y="207" width="80" height="36" fill="#eeeeee" stroke="#222222" stroke-width="2" rx="6"/>
<text x="60" y="230" text-anchor="middle" fill="#222222">client</text>
<line x1="100" y1="225" x2="160" y2="225" stroke="#222222" stroke-width="2"/>
<line x1="420" y1="225" x2="470" y2="225" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="160" y1="225" x2="160" y2="160" stroke="#222222" stroke-width="2"/>
<line x1="160" y1="160" x2="228" y2="160" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="230" y="142" width="120" height="36" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="290" y="165" text-anchor="middle" fill="#222222">replica 1: 0.99</text>
<line x1="350" y1="160" x2="420" y2="160" stroke="#222222" stroke-width="2"/>
<line x1="420" y1="160" x2="420" y2="225" stroke="#222222" stroke-width="2"/>
<line x1="160" y1="225" x2="160" y2="225" stroke="#222222" stroke-width="2"/>
<line x1="160" y1="225" x2="228" y2="225" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="230" y="207" width="120" height="36" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="290" y="230" text-anchor="middle" fill="#222222">replica 2: 0.99</text>
<line x1="350" y1="225" x2="420" y2="225" stroke="#222222" stroke-width="2"/>
<line x1="420" y1="225" x2="420" y2="225" stroke="#222222" stroke-width="2"/>
<line x1="160" y1="225" x2="160" y2="290" stroke="#222222" stroke-width="2"/>
<line x1="160" y1="290" x2="228" y2="290" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="230" y="272" width="120" height="36" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="290" y="295" text-anchor="middle" fill="#222222">replica 3: 0.99</text>
<line x1="350" y1="290" x2="420" y2="290" stroke="#222222" stroke-width="2"/>
<line x1="420" y1="290" x2="420" y2="225" stroke="#222222" stroke-width="2"/>
<text x="480" y="215" text-anchor="start" fill="#222222" font-size="13">all down: 0.01³ = 0.000001</text>
<text x="480" y="237" text-anchor="start" fill="#222222" font-size="13">up: 1 − 0.000001</text>
<text x="480" y="257" text-anchor="start" fill="#d9480f" font-weight="bold" font-size="13">= 0.999999</text>
</svg>
