<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="sans-serif" font-size="14" role="img" aria-label="Unit square split 10 percent bad and 90 percent good; alert region shaded; bad-and-alert strip is one third of the shaded area">
<title>Unit square split 10 percent bad and 90 percent good; alert region shaded; bad-and-alert strip is one third of the shaded area</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="640" height="400" fill="white"/>
<rect x="60" y="60" width="50" height="252" fill="#d9480f" stroke="none" stroke-width="0" fill-opacity="0.85"/>
<rect x="110" y="60" width="450" height="56" fill="#d9480f" stroke="none" stroke-width="0" fill-opacity="0.3"/>
<rect x="60" y="60" width="500" height="280" fill="none" stroke="#222222" stroke-width="2"/>
<line x1="110" y1="60" x2="110" y2="340" stroke="#222222" stroke-width="2"/>
<line x1="60" y1="312" x2="110" y2="312" stroke="#222222" stroke-width="1.2"/>
<line x1="110" y1="116" x2="560" y2="116" stroke="#222222" stroke-width="1.2"/>
<text x="85" y="50" text-anchor="middle" fill="#222222" font-size="12">bad 0.1</text>
<text x="335" y="50" text-anchor="middle" fill="#222222" font-size="12">good 0.9</text>
<text x="335" y="93" text-anchor="middle" fill="#222222">alert, good: 0.9 × 0.2 = 0.18</text>
<text x="335" y="228" text-anchor="middle" fill="#888888">no alert, good: 0.72</text>
<line x1="85" y1="186" x2="575" y2="186" stroke="#d9480f" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="578" y="182" text-anchor="start" fill="#d9480f" font-size="12">alert, bad:</text>
<text x="578" y="198" text-anchor="start" fill="#d9480f" font-size="12">0.1 × 0.9</text>
<text x="578" y="214" text-anchor="start" fill="#d9480f" font-size="12">= 0.09</text>
<text x="310" y="370" text-anchor="middle" fill="#222222" font-size="13">Whole square = probability 1. Alert = all shaded area = 0.27.</text>
<text x="310" y="392" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="13">Of the shaded area, the dark strip is 0.09 / 0.27 = 1/3.</text>
<text x="320" y="24" text-anchor="middle" fill="#222222" font-weight="bold">Area diagram: widths are priors, heights are alert rates</text>
</svg>
