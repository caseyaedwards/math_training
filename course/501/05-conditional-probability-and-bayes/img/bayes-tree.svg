<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="14" role="img" aria-label="Probability tree: bad deploy 0.1 then alert 0.9, good deploy 0.9 then alert 0.2; alert leaves 0.09 and 0.18 highlighted">
<title>Probability tree: bad deploy 0.1 then alert 0.9, good deploy 0.9 then alert 0.2; alert leaves 0.09 and 0.18 highlighted</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="760" height="330" fill="white"/>
<line x1="70" y1="165" x2="245" y2="90" stroke="#222222" stroke-width="1.8"/>
<text x="157.5" y="119.5" text-anchor="middle" fill="#888888" font-size="13">0.1</text>
<rect x="245" y="74" width="110" height="32" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="300" y="95" text-anchor="middle" fill="#222222">Bad deploy</text>
<line x1="355" y1="90" x2="475" y2="50" stroke="#222222" stroke-width="1.8"/>
<text x="415" y="62" text-anchor="middle" fill="#888888" font-size="13">0.9</text>
<rect x="475" y="35" width="90" height="30" fill="#f6d5c6" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="520" y="55" text-anchor="middle" fill="#222222">Alert</text>
<text x="575" y="55" text-anchor="start" fill="#d9480f" font-weight="bold">0.1 × 0.9 = 0.09</text>
<line x1="355" y1="90" x2="475" y2="130" stroke="#222222" stroke-width="1.8"/>
<text x="415" y="102" text-anchor="middle" fill="#888888" font-size="13">0.1</text>
<rect x="475" y="115" width="90" height="30" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="520" y="135" text-anchor="middle" fill="#222222">No alert</text>
<text x="575" y="135" text-anchor="start" fill="#222222">0.1 × 0.1 = 0.01</text>
<line x1="70" y1="165" x2="245" y2="240" stroke="#222222" stroke-width="1.8"/>
<text x="157.5" y="194.5" text-anchor="middle" fill="#888888" font-size="13">0.9</text>
<rect x="245" y="224" width="110" height="32" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="300" y="245" text-anchor="middle" fill="#222222">Good deploy</text>
<line x1="355" y1="240" x2="475" y2="200" stroke="#222222" stroke-width="1.8"/>
<text x="415" y="212" text-anchor="middle" fill="#888888" font-size="13">0.2</text>
<rect x="475" y="185" width="90" height="30" fill="#f6d5c6" stroke="#222222" stroke-width="2" rx="6"/>
<text x="520" y="205" text-anchor="middle" fill="#222222">Alert</text>
<text x="575" y="205" text-anchor="start" fill="#d9480f" font-weight="bold">0.9 × 0.2 = 0.18</text>
<line x1="355" y1="240" x2="475" y2="280" stroke="#222222" stroke-width="1.8"/>
<text x="415" y="252" text-anchor="middle" fill="#888888" font-size="13">0.8</text>
<rect x="475" y="265" width="90" height="30" fill="white" stroke="#222222" stroke-width="2" rx="6"/>
<text x="520" y="285" text-anchor="middle" fill="#222222">No alert</text>
<text x="575" y="285" text-anchor="start" fill="#222222">0.9 × 0.8 = 0.72</text>
<circle cx="70" cy="165" r="7" fill="#222222" stroke="#222222" stroke-width="1"/>
<text x="70" y="191" text-anchor="middle" fill="#888888" font-size="12">deploy</text>
<text x="380" y="22" text-anchor="middle" fill="#d9480f" font-weight="bold">P(bad | alert) = 0.09 / (0.09 + 0.18) = 1/3</text>
</svg>
