<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="sans-serif" font-size="14" role="img" aria-label="Two stacked bars: prior odds bad to good 1 to 9; after multiplying the bad part by 4.5 the odds are 4.5 to 9, that is 1 to 2">
<title>Two stacked bars: prior odds bad to good 1 to 9; after multiplying the bad part by 4.5 the odds are 4.5 to 9, that is 1 to 2</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="640" height="260" fill="white"/>
<text x="320" y="22" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">Odds form: multiply the bad side by the likelihood ratio</text>
<text x="20" y="52" text-anchor="start" fill="#888888" font-weight="bold" font-size="13">prior</text>
<rect x="20" y="60" width="40" height="36" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.8"/>
<rect x="60" y="60" width="180" height="36" fill="#f6d5c6" stroke="#222222" stroke-width="1.5"/>
<text x="40" y="83" text-anchor="middle" fill="#222222" font-weight="bold" font-size="12">bad</text>
<text x="150" y="83" text-anchor="middle" fill="#222222" font-size="12">good</text>
<text x="252" y="83" text-anchor="start" fill="#d9480f" font-weight="bold">1 : 9</text>
<text x="20" y="142" text-anchor="start" fill="#888888" font-weight="bold" font-size="13">× 4.5 on bad side</text>
<rect x="20" y="150" width="180" height="36" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.8"/>
<rect x="200" y="150" width="180" height="36" fill="#f6d5c6" stroke="#222222" stroke-width="1.5"/>
<text x="110" y="173" text-anchor="middle" fill="#222222" font-weight="bold" font-size="12">bad</text>
<text x="290" y="173" text-anchor="middle" fill="#222222" font-size="12">good</text>
<text x="392" y="173" text-anchor="start" fill="#d9480f" font-weight="bold">4.5 : 9 = 1 : 2</text>
<text x="320" y="225" text-anchor="middle" fill="#222222" font-size="13">Likelihood ratio = P(alert | bad) / P(alert | good) = 0.9 / 0.2 = 4.5</text>
<text x="320" y="247" text-anchor="middle" fill="#d9480f" font-size="13">Bad share of the bar: 1/10 before, 1/3 after.</text>
</svg>
