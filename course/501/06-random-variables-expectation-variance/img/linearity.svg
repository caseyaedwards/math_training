<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="sans-serif" font-size="14" role="img" aria-label="Three boxes: expected value of die 1 is 3.5, plus die 2 is 3.5, equals expected sum 7">
<title>Three boxes: expected value of die 1 is 3.5, plus die 2 is 3.5, equals expected sum 7</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="640" height="200" fill="white"/>
<text x="320" y="22" text-anchor="middle" fill="#222222" font-weight="bold">Linearity: expected values just add</text>
<rect x="30" y="60" width="140" height="70" fill="white" stroke="#222222" stroke-width="2" rx="8"/>
<text x="100" y="88" text-anchor="middle" fill="#222222" font-weight="bold">E[die 1]</text>
<text x="100" y="115" text-anchor="middle" fill="#222222" font-weight="bold" font-size="20">3.5</text>
<rect x="230" y="60" width="140" height="70" fill="white" stroke="#222222" stroke-width="2" rx="8"/>
<text x="300" y="88" text-anchor="middle" fill="#222222" font-weight="bold">E[die 2]</text>
<text x="300" y="115" text-anchor="middle" fill="#222222" font-weight="bold" font-size="20">3.5</text>
<rect x="450" y="60" width="140" height="70" fill="#f6d5c6" stroke="#d9480f" stroke-width="2" rx="8"/>
<text x="520" y="88" text-anchor="middle" fill="#222222" font-weight="bold">E[sum]</text>
<text x="520" y="115" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="20">7</text>
<text x="200" y="102" text-anchor="middle" fill="#222222" font-weight="bold" font-size="26">+</text>
<text x="410" y="102" text-anchor="middle" fill="#222222" font-weight="bold" font-size="26">=</text>
<text x="320" y="170" text-anchor="middle" fill="#888888" font-size="13">No table of 36 cells needed. Works even when the parts are dependent.</text>
</svg>
