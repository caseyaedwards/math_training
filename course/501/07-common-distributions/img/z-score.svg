<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="680" height="210" font-family="sans-serif" font-size="14" role="img" aria-label="Two aligned number lines: latency from 140 to 260 ms and z from -3 to +3; 240 ms lines up with z = 2">
<title>Two aligned number lines: latency from 140 to 260 ms and z from -3 to +3; 240 ms lines up with z = 2</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="680" height="210" fill="white"/>
<text x="340" y="22" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">z-score: how many standard deviations from the mean</text>
<line x1="140" y1="80" x2="640" y2="80" stroke="#222222" stroke-width="2"/>
<text x="125" y="85" text-anchor="end" fill="#888888" font-size="12">latency (ms)</text>
<line x1="140" y1="74" x2="140" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="68" text-anchor="middle" fill="#222222" font-size="13">140</text>
<line x1="223.33" y1="74" x2="223.33" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="223.33" y="68" text-anchor="middle" fill="#222222" font-size="13">160</text>
<line x1="306.67" y1="74" x2="306.67" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="306.67" y="68" text-anchor="middle" fill="#222222" font-size="13">180</text>
<line x1="390" y1="74" x2="390" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="390" y="68" text-anchor="middle" fill="#222222" font-size="13">200</text>
<line x1="473.33" y1="74" x2="473.33" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="473.33" y="68" text-anchor="middle" fill="#222222" font-size="13">220</text>
<line x1="556.67" y1="74" x2="556.67" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="556.67" y="68" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="13">240</text>
<line x1="640" y1="74" x2="640" y2="86" stroke="#222222" stroke-width="1.5"/>
<text x="640" y="68" text-anchor="middle" fill="#222222" font-size="13">260</text>
<line x1="140" y1="150" x2="640" y2="150" stroke="#222222" stroke-width="2"/>
<text x="125" y="155" text-anchor="end" fill="#888888" font-size="12">z</text>
<line x1="140" y1="144" x2="140" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="174" text-anchor="middle" fill="#222222" font-size="13">-3</text>
<line x1="223.33" y1="144" x2="223.33" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="223.33" y="174" text-anchor="middle" fill="#222222" font-size="13">-2</text>
<line x1="306.67" y1="144" x2="306.67" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="306.67" y="174" text-anchor="middle" fill="#222222" font-size="13">-1</text>
<line x1="390" y1="144" x2="390" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="390" y="174" text-anchor="middle" fill="#222222" font-size="13">0</text>
<line x1="473.33" y1="144" x2="473.33" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="473.33" y="174" text-anchor="middle" fill="#222222" font-size="13">+1</text>
<line x1="556.67" y1="144" x2="556.67" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="556.67" y="174" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="13">+2</text>
<line x1="640" y1="144" x2="640" y2="156" stroke="#222222" stroke-width="1.5"/>
<text x="640" y="174" text-anchor="middle" fill="#222222" font-size="13">+3</text>
<line x1="140" y1="88" x2="140" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="223.33" y1="88" x2="223.33" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="306.67" y1="88" x2="306.67" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="390" y1="88" x2="390" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="473.33" y1="88" x2="473.33" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="556.67" y1="88" x2="556.67" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="640" y1="88" x2="640" y2="142" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="556.67" y1="86" x2="556.67" y2="144" stroke="#d9480f" stroke-width="2.5"/>
<text x="340" y="195" text-anchor="middle" fill="#d9480f" font-size="13">mean 200 ms, σ = 20 ms: 240 ms → z = (240 − 200) / 20 = 2</text>
</svg>
