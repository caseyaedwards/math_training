<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif" font-size="14" role="img" aria-label="Directed graph: config points to db and cache, both point to api, api points to web; below, a valid start order config, db, cache, api, web">
