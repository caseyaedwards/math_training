<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="sans-serif" font-size="14" role="img" aria-label="Six-node graph A to F laid out in BFS levels 0 to 3 from A; BFS tree edges solid, other edges dashed">
