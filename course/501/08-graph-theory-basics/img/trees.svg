<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" font-family="sans-serif" font-size="14" role="img" aria-label="Left: a tree with vertices r, a, b, c, d and 4 edges. Right: the same tree plus a dashed edge d to b, which closes the cycle r, a, d, b">
<title>Left: a tree with vertices r, a, b, c, d and 4 edges. Right: the same tree plus a dashed edge d to b, which closes the cycle r, a, d, b</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="700" height="260" fill="white"/>
<text x="175" y="30" text-anchor="middle" fill="#222222" font-weight="bold">Tree: 5 vertices, 4 edges</text>
<line x1="175" y1="60" x2="105" y2="130" stroke="#222222" stroke-width="2"/>
<line x1="175" y1="60" x2="245" y2="130" stroke="#222222" stroke-width="2"/>
<line x1="105" y1="130" x2="63" y2="200" stroke="#222222" stroke-width="2"/>
<line x1="105" y1="130" x2="147" y2="200" stroke="#222222" stroke-width="2"/>
<circle cx="175" cy="60" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="175" y="65" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">r</text>
<circle cx="105" cy="130" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="105" y="135" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">a</text>
<circle cx="245" cy="130" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="245" y="135" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">b</text>
<circle cx="63" cy="200" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="63" y="205" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">c</text>
<circle cx="147" cy="200" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="147" y="205" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">d</text>
<text x="525" y="30" text-anchor="middle" fill="#222222" font-weight="bold">Add one edge: a cycle appears</text>
<line x1="525" y1="60" x2="455" y2="130" stroke="#d9480f" stroke-width="3.5"/>
<line x1="525" y1="60" x2="595" y2="130" stroke="#d9480f" stroke-width="3.5"/>
<line x1="455" y1="130" x2="413" y2="200" stroke="#222222" stroke-width="2"/>
<line x1="455" y1="130" x2="497" y2="200" stroke="#d9480f" stroke-width="3.5"/>
<line x1="497" y1="200" x2="595" y2="130" stroke="#d9480f" stroke-width="3.5" stroke-dasharray="7 4"/>
<text x="565" y="255" text-anchor="middle" fill="#d9480f" font-size="12">cycle r, a, d, b, r</text>
<circle cx="525" cy="60" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="525" y="65" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">r</text>
<circle cx="455" cy="130" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="455" y="135" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">a</text>
<circle cx="595" cy="130" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="595" y="135" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">b</text>
<circle cx="413" cy="200" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="413" y="205" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">c</text>
<circle cx="497" cy="200" r="13" fill="white" stroke="#222222" stroke-width="2"/>
<text x="497" y="205" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">d</text>
<text x="175" y="230" text-anchor="middle" fill="#888888" font-size="12">exactly one path between any two vertices</text>
</svg>
