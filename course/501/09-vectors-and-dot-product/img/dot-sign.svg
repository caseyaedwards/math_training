<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="sans-serif" font-size="14" role="img" aria-label="Three panels: acute angle gives positive dot product, right angle gives zero, obtuse angle gives negative">
<title>Three panels: acute angle gives positive dot product, right angle gives zero, obtuse angle gives negative</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="720" height="220" fill="white"/>
<line x1="105" y1="160" x2="205" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="105" y1="160" x2="175" y2="100" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="201" y="180" text-anchor="end" fill="#222222" font-weight="bold">a</text>
<text x="183" y="104" text-anchor="start" fill="#d9480f" font-weight="bold">b</text>
<text x="120" y="32" text-anchor="middle" fill="#222222" font-weight="bold">a · b &gt; 0</text>
<text x="120" y="200" text-anchor="middle" fill="#888888" font-size="13">angle &lt; 90°</text>
<line x1="345" y1="160" x2="445" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="345" y1="160" x2="345" y2="80" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="441" y="180" text-anchor="end" fill="#222222" font-weight="bold">a</text>
<text x="353" y="84" text-anchor="start" fill="#d9480f" font-weight="bold">b</text>
<text x="360" y="32" text-anchor="middle" fill="#222222" font-weight="bold">a · b = 0</text>
<text x="360" y="200" text-anchor="middle" fill="#888888" font-size="13">angle = 90°</text>
<line x1="585" y1="160" x2="685" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="585" y1="160" x2="520" y2="100" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="681" y="180" text-anchor="end" fill="#222222" font-weight="bold">a</text>
<text x="528" y="104" text-anchor="start" fill="#d9480f" font-weight="bold">b</text>
<text x="600" y="32" text-anchor="middle" fill="#222222" font-weight="bold">a · b &lt; 0</text>
<text x="600" y="200" text-anchor="middle" fill="#888888" font-size="13">angle &gt; 90°</text>
</svg>
