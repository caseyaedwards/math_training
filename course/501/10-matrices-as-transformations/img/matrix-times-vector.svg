<line x1="287.5" y1="208.75" x2="287.5" y2="40" stroke="#e2e2e2" stroke-width="1"/>
<line x1="332.5" y1="208.75" x2="332.5" y2="40" stroke="#e2e2e2" stroke-width="1"/>
<line x1="377.5" y1="208.75" x2="377.5" y2="40" stroke="#e2e2e2" stroke-width="1"/>
<line x1="422.5" y1="208.75" x2="422.5" y2="40" stroke="#e2e2e2" stroke-width="1"/>
<line x1="467.5" y1="208.75" x2="467.5" y2="40" stroke="#e2e2e2" stroke-width="1"/>
