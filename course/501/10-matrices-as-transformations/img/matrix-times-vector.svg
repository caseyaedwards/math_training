<line x1="40" y1="175" x2="490" y2="175" stroke="#222222" stroke-width="1.5"/>
<line x1="62.5" y1="208.75" x2="62.5" y2="40" stroke="#222222" stroke-width="1.5"/>
<text x="107.5" y="192" text-anchor="middle" fill="#888888" font-size="12">1</text>
<text x="152.5" y="192" text-anchor="middle" fill="#888888" font-size="12">2</text>
<text x="197.5" y="192" text-anchor="middle" fill="#888888" font-size="12">3</text>
<text x="242.5" y="192" text-anchor="middle" fill="#888888" font-size="12">4</text>
<text x="287.5" y="192" text-anchor="middle" fill="#888888" font-size="12">5</text>
<text x="332.5" y="192" text-anchor="middle" fill="#888888" font-size="12">6</text>
<text x="377.5" y="192" text-anchor="middle" fill="#888888" font-size="12">7</text>
<text x="422.5" y="192" text-anchor="middle" fill="#888888" font-size="12">8</text>
<text x="467.5" y="192" text-anchor="middle" fill="#888888" font-size="12">9</text>
<text x="55.5" y="134" text-anchor="end" fill="#888888" font-size="12">1</text>
<text x="55.5" y="89" text-anchor="end" fill="#888888" font-size="12">2</text>
<text x="55.5" y="44" text-anchor="end" fill="#888888" font-size="12">3</text>
<line x1="62.5" y1="175" x2="332.5" y2="175" stroke="#222222" stroke-width="3" marker-end="url(#ah)"/>
