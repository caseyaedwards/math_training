<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="sans-serif" font-size="14" role="img" aria-label="Grid showing 3 times column (2,0) reaching (6,0), then 2 times column (1,1) reaching (8,2), the product of the matrix with (3,2)">
<title>Grid showing 3 times column (2,0) reaching (6,0), then 2 times column (1,1) reaching (8,2), the product of the matrix with (3,2)</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="520" height="300" fill="white"/>
<line x1="62.5" y1="208.75" x2="62.5" y2="40" stroke="#e2e2e2" stroke-width="1"/>
