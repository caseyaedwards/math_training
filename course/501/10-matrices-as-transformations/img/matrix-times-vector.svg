<text x="197.5" y="209" text-anchor="middle" fill="#222222" font-weight="bold" font-size="12">3 × column 1 = 3·(2, 0) = (6, 0)</text>
<text x="382" y="134" text-anchor="end" fill="#888888" font-weight="bold" font-size="12">+ 2·(1, 1)</text>
<text x="424.75" y="71.5" text-anchor="start" fill="#d9480f" font-weight="bold" font-size="13">(8, 2)</text>
<text x="260" y="22" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">[[2, 1], [0, 1]] · (3, 2) = 3·(column 1) + 2·(column 2)</text>
<text x="260" y="285" text-anchor="middle" fill="#888888" font-size="12">The input numbers say how much of each column to use.</text>
