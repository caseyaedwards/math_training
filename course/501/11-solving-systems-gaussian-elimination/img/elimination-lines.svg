<circle cx="564" cy="135.13" r="6" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="574" y="125.13" text-anchor="start" fill="#222222" font-weight="bold">(2, 1)</text>
<text x="535" y="46" text-anchor="middle" fill="#888888" font-weight="bold" font-size="13">after R2 ← R2 − R1</text>
