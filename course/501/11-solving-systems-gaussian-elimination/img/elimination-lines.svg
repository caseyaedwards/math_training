<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif" font-size="14" role="img" aria-label="Left: lines x + y = 3 and x - y = 1 cross at (2,1). Right: after subtracting row 1 from row 2 the second line becomes horizontal y = 1, still crossing at (2,1)">
<title>Left: lines x + y = 3 and x - y = 1 cross at (2,1). Right: after subtracting row 1 from row 2 the second line becomes horizontal y = 1, still crossing at (2,1)</title>
