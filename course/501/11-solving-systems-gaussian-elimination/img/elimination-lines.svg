<line x1="40" y1="308.87" x2="330" y2="19.31" stroke="#d9480f" stroke-width="2.5" clip-path="url(#el0)"/>
<circle cx="214" cy="135.13" r="6" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="224" y="125.13" text-anchor="start" fill="#222222" font-weight="bold">(2, 1)</text>
<text x="185" y="46" text-anchor="middle" fill="#888888" font-weight="bold" font-size="13">before</text>
<text x="185" y="250" text-anchor="middle" fill="#222222" font-size="13">R1: x + y = 3</text>
<text x="185" y="270" text-anchor="middle" fill="#d9480f" font-size="13">R2: x − y = 1</text>
