<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="sans-serif" font-size="14" role="img" aria-label="Three determinant cases: stretch with det 2 doubles area, swap with det -1 flips orientation, collapse with det 0 flattens the square to a line">
