<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14" role="img" aria-label="State diagram: UP stays up with 0.9 and goes down with 0.1; DOWN recovers with 0.5 and stays down with 0.5; the steady state is 5/6 up, 1/6 down">
<title>State diagram: UP stays up with 0.9 and goes down with 0.1; DOWN recovers with 0.5 and stays down with 0.5; the steady state is 5/6 up, 1/6 down</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker>
</defs>
<rect x="0" y="0" width="640" height="300" fill="white"/>
<text x="320" y="22" text-anchor="middle" fill="#222222" font-weight="bold" font-size="13">Two-state service: the long-run split is an eigenvector with λ = 1</text>
<circle cx="190" cy="150" r="48" fill="#f6d5c6" stroke="#222222" stroke-width="2"/>
<circle cx="450" cy="150" r="48" fill="white" stroke="#d9480f" stroke-width="2.5"/>
<text x="190" y="156" text-anchor="middle" fill="#222222" font-weight="bold" font-size="16">UP</text>
<text x="450" y="156" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="16">DOWN</text>
<path d="M232,130 Q320.0,70 406,128" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<path d="M408,170 Q320.0,230 234,172" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="320" y="92" text-anchor="middle" fill="#222222" font-weight="bold">0.1</text>
<text x="320" y="222" text-anchor="middle" fill="#222222" font-weight="bold">0.5</text>
<path d="M160,110 C80,30 200,20 186,100" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="110" y="55" text-anchor="middle" fill="#222222" font-weight="bold">0.9</text>
<path d="M480,110 C560,30 440,20 454,100" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="530" y="55" text-anchor="middle" fill="#222222" font-weight="bold">0.5</text>
<text x="320" y="255" text-anchor="middle" fill="#222222" font-size="13">P = [[0.9, 0.5], [0.1, 0.5]] (columns: from UP, from DOWN)</text>
<text x="320" y="280" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="13">P·(5/6, 1/6) = (5/6, 1/6): up 5/6 ≈ 83.3% of the time</text>
</svg>
