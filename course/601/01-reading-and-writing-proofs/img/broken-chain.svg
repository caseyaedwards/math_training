<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="940" height="210" font-family="sans-serif" font-size="14">
<title>A proof chain with one broken link</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="940" height="210" fill="#fff"/>
<rect x="14.0" y="60.0" width="122.0" height="50.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="8"/>
<text x="75.0" y="90.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">a = b</text>
<line x1="136.0" y1="85.0" x2="148.0" y2="85.0" stroke="#222" stroke-width="3"/>
<rect x="148.0" y="60.0" width="122.0" height="50.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="8"/>
<text x="209.0" y="90.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">a² = ab</text>
<line x1="270.0" y1="85.0" x2="282.0" y2="85.0" stroke="#222" stroke-width="3"/>
<rect x="282.0" y="60.0" width="122.0" height="50.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="8"/>
<text x="343.0" y="90.0" text-anchor="middle" font-size="11" fill="#222" font-weight="normal">a² − b² = ab − b²</text>
<line x1="404.0" y1="85.0" x2="416.0" y2="85.0" stroke="#222" stroke-width="3"/>
<rect x="416.0" y="60.0" width="122.0" height="50.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="8"/>
<text x="477.0" y="90.0" text-anchor="middle" font-size="11" fill="#222" font-weight="normal">(a+b)(a−b) = b(a−b)</text>
<line x1="539.0" y1="85.0" x2="545.0" y2="79.0" stroke="#d9480f" stroke-width="3"/>
<line x1="543.0" y1="91.0" x2="549.0" y2="85.0" stroke="#d9480f" stroke-width="3"/>
<rect x="550.0" y="60.0" width="122.0" height="50.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="8"/>
<text x="611.0" y="90.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">a + b = b</text>
<line x1="672.0" y1="85.0" x2="684.0" y2="85.0" stroke="#222" stroke-width="3"/>
<rect x="684.0" y="60.0" width="122.0" height="50.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="8"/>
<text x="745.0" y="90.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">2b = b</text>
<line x1="806.0" y1="85.0" x2="818.0" y2="85.0" stroke="#222" stroke-width="3"/>
<rect x="818.0" y="60.0" width="122.0" height="50.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="8"/>
<text x="879.0" y="90.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">2 = 1</text>
<text x="544.0" y="145.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">broken link: divide by a − b, which is 0</text>
<line x1="544.0" y1="128.0" x2="544.0" y2="100.0" stroke="#d9480f" stroke-width="2" marker-end="url(#arra)"/>
<text x="470.0" y="35.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">A fake proof that 2 = 1. Every link holds except one.</text>
<text x="470.0" y="190.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Everything after a broken link is unsupported, however tidy it looks.</text>
</svg>
