<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="sans-serif" font-size="14">
<title>The four cases of an implication</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="300" fill="#fff"/>
<text x="340.0" y="40.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Q (the conclusion)</text>
<text x="255.0" y="62.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Q true</text>
<text x="425.0" y="62.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">Q false</text>
<text x="60.0" y="165.0" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">P</text>
<text x="158.0" y="120.0" text-anchor="end" font-size="13" fill="#222" font-weight="normal">P true</text>
<text x="158.0" y="210.0" text-anchor="end" font-size="13" fill="#222" font-weight="normal">P false</text>
<rect x="170.0" y="70.0" width="170.0" height="90.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="0"/>
<text x="255.0" y="110.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">T</text>
<text x="255.0" y="136.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">promise kept</text>
<rect x="340.0" y="70.0" width="170.0" height="90.0" fill="#d9480f" stroke="#222" stroke-width="2" rx="0"/>
<text x="425.0" y="110.0" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">F</text>
<text x="425.0" y="136.0" text-anchor="middle" font-size="13" fill="#fff" font-weight="normal">promise broken</text>
<rect x="170.0" y="160.0" width="170.0" height="90.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="0"/>
<text x="255.0" y="200.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">T</text>
<text x="255.0" y="226.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">nothing promised</text>
<rect x="340.0" y="160.0" width="170.0" height="90.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="0"/>
<text x="425.0" y="200.0" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">T</text>
<text x="425.0" y="226.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">nothing promised</text>
<text x="280.0" y="280.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">P ⇒ Q is false in exactly one cell: P true and Q false.</text>
</svg>
