<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="sans-serif" font-size="14">
<title>Negating quantified statements</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="230" fill="#fff"/>
<rect x="20.0" y="40.0" width="280.0" height="60.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="160.0" y="74.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">for every x, claim(x)</text>
<rect x="420.0" y="40.0" width="280.0" height="60.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="560.0" y="74.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">there exists x with NOT claim(x)</text>
<line x1="302.0" y1="70.0" x2="416.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="359.0" y="60.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">negate</text>
<rect x="20.0" y="140.0" width="280.0" height="60.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="160.0" y="174.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">there exists x, claim(x)</text>
<rect x="420.0" y="140.0" width="280.0" height="60.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="560.0" y="174.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">for every x, NOT claim(x)</text>
<line x1="302.0" y1="170.0" x2="416.0" y2="170.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="359.0" y="160.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">negate</text>
<text x="360.0" y="222.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Swap the quantifier, push NOT inside. One counterexample kills a for-every claim.</text>
</svg>
