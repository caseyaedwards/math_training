<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="sans-serif" font-size="14">
<title>Quantifiers as a game</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="760" height="220" fill="#fff"/>
<rect x="20.0" y="60.0" width="220.0" height="90.0" fill="#f1f3f5" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="130.0" y="100.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">For every ε &gt; 0</text>
<text x="130.0" y="118.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">(the challenger picks)</text>
<rect x="270.0" y="60.0" width="220.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
<text x="380.0" y="100.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">there exists δ &gt; 0</text>
<text x="380.0" y="118.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">(you answer)</text>
<rect x="520.0" y="60.0" width="220.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
<text x="630.0" y="100.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">such that the claim</text>
<text x="630.0" y="118.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">holds for that pair</text>
<line x1="242.0" y1="105.0" x2="266.0" y2="105.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="492.0" y1="105.0" x2="516.0" y2="105.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="380.0" y="35.0" text-anchor="middle" font-size="15" fill="#222" font-weight="normal">Read a quantified statement as a game, left to right</text>
<text x="380.0" y="190.0" text-anchor="middle" font-size="14" fill="#555" font-weight="normal">Order matters: your answer can depend on every choice made to its left.</text>
</svg>
