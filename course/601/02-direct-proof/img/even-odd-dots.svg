<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="sans-serif" font-size="14">
<title>Even and odd numbers as rows of dots</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="820" height="250" fill="#fff"/>
<text x="110.0" y="40.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">even: 2k</text>
<circle cx="40.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="40.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="66.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="66.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="92.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="92.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="118.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="118.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="144.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="144.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<text x="110.0" y="150.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">k = 5 pairs, n = 10</text>
<text x="380.0" y="40.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">odd: 2k + 1</text>
<circle cx="300.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="300.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="326.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="326.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="352.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="352.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="378.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="378.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="404.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="404.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="430.0" cy="80.0" r="9.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="380.0" y="150.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">one dot left over</text>
<text x="660.0" y="40.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">odd + odd</text>
<circle cx="560.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="560.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="586.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="586.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="612.0" cy="80.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="612.0" cy="106.0" r="9.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="664.0" cy="80.0" r="9.0" fill="#888" stroke="#888" stroke-width="1"/>
<circle cx="664.0" cy="106.0" r="9.0" fill="#888" stroke="#888" stroke-width="1"/>
<circle cx="690.0" cy="80.0" r="9.0" fill="#888" stroke="#888" stroke-width="1"/>
<circle cx="690.0" cy="106.0" r="9.0" fill="#888" stroke="#888" stroke-width="1"/>
<circle cx="716.0" cy="80.0" r="9.0" fill="#888" stroke="#888" stroke-width="1"/>
<circle cx="716.0" cy="106.0" r="9.0" fill="#888" stroke="#888" stroke-width="1"/>
<circle cx="638.0" cy="80.0" r="9.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="638.0" cy="106.0" r="9.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<rect x="623" y="64" width="30" height="58" rx="8" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="4,3"/>
<text x="660.0" y="150.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">the two leftovers pair up</text>
<text x="660.0" y="170.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">(2a+1) + (2b+1) = 2(a+b+1)</text>
<text x="410.0" y="225.0" text-anchor="middle" font-size="14" fill="#555" font-weight="normal">A number is even when its dots split into two equal rows.</text>
