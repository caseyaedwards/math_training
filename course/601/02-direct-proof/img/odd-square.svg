<text x="128.0" y="133.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">2k × 2k</text>
<text x="150.0" y="284.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">side 2k + 1 = 5 (k = 2)</text>
<text x="290.0" y="70.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">gray block: 4k², even</text>
<text x="290.0" y="100.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">two strips: 2k each, even</text>
<text x="290.0" y="130.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">one corner square: 1</text>
<text x="290.0" y="175.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">(2k+1)² = 4k² + 4k + 1</text>
<text x="290.0" y="200.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">= 2(2k² + 2k) + 1</text>
<text x="290.0" y="225.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">even + 1 = odd</text>
