<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="sans-serif" font-size="14">
<title>Shape of a proof by contradiction</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="860" height="200" fill="#fff"/>
<rect x="20.0" y="60.0" width="190.0" height="70.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="115.0" y="90.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">Assume the</text>
<text x="115.0" y="108.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">claim is false</text>
<line x1="212.0" y1="95.0" x2="226.0" y2="95.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="230.0" y="60.0" width="190.0" height="70.0" fill="#fff" stroke="#222" stroke-width="2" rx="6"/>
<text x="325.0" y="90.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">Valid steps</text>
<text x="325.0" y="108.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">(each justified)</text>
<line x1="422.0" y1="95.0" x2="436.0" y2="95.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="440.0" y="60.0" width="190.0" height="70.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="6"/>
<text x="535.0" y="90.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">Something impossible:</text>
<text x="535.0" y="108.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">R and not R</text>
<line x1="632.0" y1="95.0" x2="646.0" y2="95.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="650.0" y="60.0" width="190.0" height="70.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="745.0" y="90.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">The assumption fails.</text>
<text x="745.0" y="108.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">The claim is true.</text>
<text x="430.0" y="35.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">Proof by contradiction: follow the false lead until the logs say something impossible</text>
<text x="430.0" y="170.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Example: lowest terms, yet both a and b are even.</text>
</svg>
