<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 130" width="620" height="130" font-family="sans-serif" font-size="14">
<title>No largest integer</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="130" fill="#fff"/>
<line x1="20.0" y1="70.0" x2="600.0" y2="70.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="200.0" y1="62.0" x2="200.0" y2="78.0" stroke="#222" stroke-width="2"/>
<text x="200.0" y="100.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">0</text>
<line x1="430.0" y1="62.0" x2="430.0" y2="78.0" stroke="#222" stroke-width="2"/>
<text x="430.0" y="100.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">M</text>
<line x1="520.0" y1="62.0" x2="520.0" y2="78.0" stroke="#d9480f" stroke-width="2"/>
<text x="520.0" y="100.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">M + 1</text>
<text x="430.0" y="48.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">claimed largest</text>
<path d="M 430.0 64 Q 475.0 40 517.0 63" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arra)"/>
<text x="310.0" y="124.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Whatever M you claim, M + 1 is bigger. The claim collapses.</text>
</svg>
