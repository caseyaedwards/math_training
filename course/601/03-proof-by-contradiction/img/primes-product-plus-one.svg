<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="sans-serif" font-size="14">
<title>Euclid product plus one argument</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="820" height="250" fill="#fff"/>
<text x="410.0" y="32.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">Assume the list of primes is finite: 2, 3, 5, 7, 11, 13 (say). Build N = product + 1.</text>
<rect x="40.0" y="60.0" width="70.0" height="44.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="75.0" y="86.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">2</text>
<rect x="120.0" y="60.0" width="70.0" height="44.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="155.0" y="86.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">3</text>
<rect x="200.0" y="60.0" width="70.0" height="44.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="235.0" y="86.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">5</text>
<rect x="280.0" y="60.0" width="70.0" height="44.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="315.0" y="86.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">7</text>
<rect x="360.0" y="60.0" width="70.0" height="44.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="395.0" y="86.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">11</text>
<rect x="440.0" y="60.0" width="70.0" height="44.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="475.0" y="86.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">13</text>
<text x="530.0" y="88.0" text-anchor="start" font-size="15" fill="#222" font-weight="bold">→  N = 30030 + 1 = 30031</text>
<line x1="75.0" y1="106.0" x2="75.0" y2="140.0" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="75.0" y="160.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">rem 1</text>
<line x1="155.0" y1="106.0" x2="155.0" y2="140.0" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="155.0" y="160.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">rem 1</text>
<line x1="235.0" y1="106.0" x2="235.0" y2="140.0" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="235.0" y="160.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">rem 1</text>
<line x1="315.0" y1="106.0" x2="315.0" y2="140.0" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="315.0" y="160.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">rem 1</text>
<line x1="395.0" y1="106.0" x2="395.0" y2="140.0" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="395.0" y="160.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">rem 1</text>
<line x1="475.0" y1="106.0" x2="475.0" y2="140.0" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="475.0" y="160.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">rem 1</text>
<text x="40.0" y="200.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">Every listed prime leaves remainder 1 when it divides N. None of them divides N.</text>
<text x="40.0" y="225.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">But N = 59 × 509 has a prime factor. That factor is missing from the list.</text>
</svg>
