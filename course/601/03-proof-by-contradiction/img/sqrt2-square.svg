<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" font-family="sans-serif" font-size="14">
<title>The diagonal of a unit square has length root 2</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="580" height="300" fill="#fff"/>
<rect x="60.0" y="50.0" width="200.0" height="200.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<line x1="60.0" y1="250.0" x2="260.0" y2="50.0" stroke="#d9480f" stroke-width="3"/>
<text x="160.0" y="274.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">1</text>
<text x="44.0" y="155.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">1</text>
<text x="138.0" y="136.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">√2</text>
<text x="300.0" y="80.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">Pythagoras: d² = 1² + 1² = 2</text>
<text x="300.0" y="110.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">Suppose d = a/b in lowest terms.</text>
<text x="300.0" y="140.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">Then a² = 2b², hence a is even,</text>
<text x="300.0" y="165.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">then b is even too.</text>
<text x="300.0" y="195.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">Both even contradicts</text>
<text x="300.0" y="220.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">lowest terms.</text>
</svg>
