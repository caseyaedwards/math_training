<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" font-family="sans-serif" font-size="14">
<title>If and only if is two arrows</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="170" fill="#fff"/>
<rect x="40.0" y="50.0" width="170.0" height="70.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="125.0" y="89.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">n is odd</text>
<rect x="350.0" y="50.0" width="170.0" height="70.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="6"/>
<text x="435.0" y="89.9" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">n² is odd</text>
<path d="M 212 70 Q 280 40 346 70" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 348 100 Q 280 130 214 100" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arra)"/>
<text x="280.0" y="40.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">(⇒) direct</text>
<text x="280.0" y="145.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">(⇐) contrapositive</text>
</svg>
