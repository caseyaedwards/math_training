<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" font-family="sans-serif" font-size="14">
<title>Induction as falling dominoes</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="860" height="240" fill="#fff"/>
<g transform="rotate(55 78 180)"><rect x="60" y="90" width="18" height="90" fill="#d9480f" stroke="#222" stroke-width="2"/></g>
<text x="69.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(1)</text>
<g transform="rotate(55 163 180)"><rect x="145" y="90" width="18" height="90" fill="#f1f3f5" stroke="#222" stroke-width="2"/></g>
<text x="154.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(2)</text>
<g transform="rotate(25 248 180)"><rect x="230" y="90" width="18" height="90" fill="#f1f3f5" stroke="#222" stroke-width="2"/></g>
<text x="239.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(3)</text>
<rect x="315.0" y="90.0" width="18.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="324.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(4)</text>
<rect x="400.0" y="90.0" width="18.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="409.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(5)</text>
<rect x="485.0" y="90.0" width="18.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="494.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(6)</text>
<rect x="570.0" y="90.0" width="18.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="579.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">…</text>
<rect x="655.0" y="90.0" width="18.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="664.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(k)</text>
<rect x="740.0" y="90.0" width="18.0" height="90.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="749.0" y="202.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">P(k+1)</text>
<line x1="20.0" y1="180.0" x2="840.0" y2="180.0" stroke="#222" stroke-width="2"/>
<text x="120.0" y="40.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">Base case: push P(1)</text>
<text x="650.0" y="40.0" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Step: if P(k) falls, P(k+1) falls</text>
<path d="M 680 70 C 700 50, 740 50, 755 75" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="430.0" y="228.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Both pieces together knock over every domino.</text>
</svg>
