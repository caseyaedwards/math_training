<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" font-family="sans-serif" font-size="14">
<title>A factor tree for 60 used in strong induction</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="260" fill="#fff"/>
<line x1="280.0" y1="40.0" x2="180.0" y2="120.0" stroke="#888" stroke-width="2"/>
<line x1="280.0" y1="40.0" x2="380.0" y2="120.0" stroke="#888" stroke-width="2"/>
<line x1="180.0" y1="120.0" x2="130.0" y2="200.0" stroke="#888" stroke-width="2"/>
<line x1="180.0" y1="120.0" x2="230.0" y2="200.0" stroke="#888" stroke-width="2"/>
<line x1="380.0" y1="120.0" x2="330.0" y2="200.0" stroke="#888" stroke-width="2"/>
<line x1="380.0" y1="120.0" x2="430.0" y2="200.0" stroke="#888" stroke-width="2"/>
<circle cx="280.0" cy="40.0" r="22.0" fill="#f1f3f5" stroke="#222" stroke-width="2"/>
<text x="280.0" y="45.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">60</text>
<circle cx="180.0" cy="120.0" r="22.0" fill="#f1f3f5" stroke="#222" stroke-width="2"/>
<text x="180.0" y="125.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">6</text>
<circle cx="380.0" cy="120.0" r="22.0" fill="#f1f3f5" stroke="#222" stroke-width="2"/>
<text x="380.0" y="125.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">10</text>
<circle cx="130.0" cy="200.0" r="22.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2"/>
<text x="130.0" y="205.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">2</text>
<circle cx="230.0" cy="200.0" r="22.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2"/>
<text x="230.0" y="205.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">3</text>
<circle cx="330.0" cy="200.0" r="22.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2"/>
<text x="330.0" y="205.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">2</text>
<circle cx="430.0" cy="200.0" r="22.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2"/>
<text x="430.0" y="205.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">5</text>
<text x="280.0" y="245.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">60 = 6 × 10. Both pieces are smaller. Strong induction already covers them.</text>
</svg>
