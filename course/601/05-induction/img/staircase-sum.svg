<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="14">
<title>Two staircases make a rectangle</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="300" fill="#fff"/>
<rect x="60.0" y="50.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="60.0" y="90.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="100.0" y="90.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="60.0" y="130.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="100.0" y="130.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="140.0" y="130.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="60.0" y="170.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="100.0" y="170.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="140.0" y="170.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="180.0" y="170.0" width="40.0" height="40.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<rect x="100.0" y="50.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="140.0" y="50.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="180.0" y="50.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="220.0" y="50.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="140.0" y="90.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="180.0" y="90.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="220.0" y="90.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="180.0" y="130.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="220.0" y="130.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<rect x="220.0" y="170.0" width="40.0" height="40.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<text x="160.0" y="236.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">n + 1 = 5 columns</text>
<text x="48.0" y="130.0" text-anchor="end" font-size="14" fill="#222" font-weight="normal">n = 4</text>
<text x="300.0" y="80.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">Gray staircase: 1 + 2 + 3 + 4</text>
<text x="300.0" y="108.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">Orange copy, turned around: same count</text>
<text x="300.0" y="136.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">Together: a 4 × 5 rectangle = 20</text>
<text x="300.0" y="164.0" text-anchor="start" font-size="14" fill="#222" font-weight="normal">One staircase: 20 / 2 = 10</text>
<text x="300.0" y="204.0" text-anchor="start" font-size="14" fill="#222" font-weight="bold">In general: 1 + 2 + … + n = n(n+1)/2</text>
</svg>
