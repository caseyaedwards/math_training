<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif" font-size="14">
<title>Euclidean algorithm remainders as shrinking bars</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="760" height="250" fill="#fff"/>
<rect x="40.0" y="30.0" width="480.0" height="26.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="530.0" y="48.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">1071 = 2 · 462 + 147</text>
<rect x="40.0" y="82.0" width="207.1" height="26.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="257.1" y="100.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">462 = 3 · 147 + 21</text>
<rect x="40.0" y="134.0" width="65.9" height="26.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5" rx="0"/>
<text x="115.9" y="152.0" text-anchor="start" font-size="13" fill="#222" font-weight="normal">147 = 7 · 21 + 0</text>
<rect x="40.0" y="186.0" width="9.4" height="26.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5" rx="0"/>
<text x="59.4" y="204.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="normal">gcd = 21</text>
<text x="380.0" y="238.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Each bar is the remainder of the two above it. The bars shrink fast.</text>
</svg>
