<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="sans-serif" font-size="14">
<title>Euclid algorithm as tiling a rectangle with squares</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="300" fill="#fff"/>
<rect x="50.0" y="50.0" width="180.0" height="180.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="0"/>
<text x="140.0" y="145.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">9×9</text>
<rect x="230.0" y="50.0" width="180.0" height="180.0" fill="#f1f3f5" stroke="#222" stroke-width="2" rx="0"/>
<text x="320.0" y="145.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">9×9</text>
<rect x="410.0" y="50.0" width="120.0" height="120.0" fill="#fff" stroke="#222" stroke-width="2" rx="0"/>
<text x="470.0" y="115.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">6×6</text>
<rect x="410.0" y="170.0" width="60.0" height="60.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="0"/>
<text x="440.0" y="205.0" text-anchor="middle" font-size="11" fill="#d9480f" font-weight="normal">3×3</text>
<rect x="470.0" y="170.0" width="60.0" height="60.0" fill="#ffe8dc" stroke="#d9480f" stroke-width="2" rx="0"/>
<text x="500.0" y="205.0" text-anchor="middle" font-size="11" fill="#d9480f" font-weight="normal">3×3</text>
<text x="290.0" y="36.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">24</text>
<text x="36.0" y="145.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">9</text>
<text x="50.0" y="264.0" text-anchor="start" font-size="15" fill="#222" font-weight="normal">24 = 2·9 + 6</text>
<text x="220.0" y="264.0" text-anchor="start" font-size="15" fill="#222" font-weight="normal">9 = 1·6 + 3</text>
<text x="390.0" y="264.0" text-anchor="start" font-size="15" fill="#222" font-weight="normal">6 = 2·3 + 0</text>
<text x="50.0" y="292.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="normal">The smallest square that tiles everything is 3 × 3. Therefore gcd(24, 9) = 3.</text>
</svg>
