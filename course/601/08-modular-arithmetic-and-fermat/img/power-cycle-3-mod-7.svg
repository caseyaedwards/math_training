<text x="180.0" y="60.0" text-anchor="middle" font-size="14" fill="#888" font-weight="normal">0</text>
<circle cx="273.8" cy="100.2" r="17.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
