<text x="300.0" y="240.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Multiplying by 3 only shuffles 1, …, 6. Hence 3·6·9·12·15·18 ≡ 1·2·3·4·5·6.</text>
