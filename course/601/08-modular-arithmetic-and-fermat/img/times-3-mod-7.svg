<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="sans-serif" font-size="14">
<title>Multiplication by 3 permutes the nonzero residues mod 7</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="600" height="260" fill="#fff"/>
<text x="30.0" y="65.0" text-anchor="start" font-size="16" fill="#222" font-weight="bold">a</text>
<text x="30.0" y="195.0" text-anchor="start" font-size="16" fill="#222" font-weight="bold">3a</text>
<circle cx="100.0" cy="60.0" r="18.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
<text x="100.0" y="65.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">1</text>
<circle cx="100.0" cy="190.0" r="18.0" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="100.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">1</text>
<circle cx="180.0" cy="60.0" r="18.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="65.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">2</text>
<circle cx="180.0" cy="190.0" r="18.0" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">2</text>
<circle cx="260.0" cy="60.0" r="18.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
<text x="260.0" y="65.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">3</text>
<circle cx="260.0" cy="190.0" r="18.0" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="260.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">3</text>
<circle cx="340.0" cy="60.0" r="18.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
<text x="340.0" y="65.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">4</text>
<circle cx="340.0" cy="190.0" r="18.0" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="340.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">4</text>
<circle cx="420.0" cy="60.0" r="18.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
<text x="420.0" y="65.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">5</text>
<circle cx="420.0" cy="190.0" r="18.0" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="420.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">5</text>
<circle cx="500.0" cy="60.0" r="18.0" fill="#f1f3f5" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="65.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">6</text>
