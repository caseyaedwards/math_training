<text x="500.0" y="195.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">6</text>
<line x1="100.0" y1="80.0" x2="260.0" y2="170.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arra)"/>
<line x1="180.0" y1="80.0" x2="500.0" y2="170.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arra)"/>
<line x1="260.0" y1="80.0" x2="180.0" y2="170.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arra)"/>
