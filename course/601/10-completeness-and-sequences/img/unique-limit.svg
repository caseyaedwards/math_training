<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" font-family="sans-serif" font-size="14">
<title>Two separate tubes around two candidate limits</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="260" fill="#fff"/>
<rect x="60" y="110.0" width="520" height="80.0" fill="#ffe8dc"/>
<line x1="60.0" y1="150.0" x2="580.0" y2="150.0" stroke="#888" stroke-width="1" stroke-dasharray="2,3"/>
<text x="50.0" y="155.0" text-anchor="end" font-size="14" fill="#222" font-weight="bold">L</text>
<text x="575.0" y="142.0" text-anchor="end" font-size="13" fill="#d9480f" font-weight="normal">tube around L</text>
<rect x="60" y="30.0" width="520" height="80.0" fill="#f1f3f5"/>
<line x1="60.0" y1="70.0" x2="580.0" y2="70.0" stroke="#888" stroke-width="1" stroke-dasharray="2,3"/>
<text x="50.0" y="75.0" text-anchor="end" font-size="14" fill="#222" font-weight="bold">M</text>
<text x="575.0" y="62.0" text-anchor="end" font-size="13" fill="#222" font-weight="normal">tube around M</text>
<line x1="60.0" y1="110.0" x2="580.0" y2="110.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="6,4"/>
<line x1="60.0" y1="230.0" x2="600.0" y2="230.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="60.0" y1="230.0" x2="60.0" y2="20.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="600.0" y="250.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">n</text>
<text x="48.0" y="24.0" text-anchor="end" font-size="14" fill="#222" font-weight="normal"></text>
<text x="310.0" y="252.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">half-width ε = |L − M| / 2: the open tubes do not overlap, no dot sits in both</text>
</svg>
