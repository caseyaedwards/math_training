<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="sans-serif" font-size="14">
<title>Letters sorted by number of holes</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="760" height="220" fill="#fff"/>
<text x="140.0" y="140.0" text-anchor="middle" font-size="60" fill="#222" font-weight="bold">C I L S Z</text>
<text x="140.0" y="185.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">no holes: bend into a segment</text>
<text x="400.0" y="140.0" text-anchor="middle" font-size="60" fill="#222" font-weight="bold">D O</text>
<text x="400.0" y="185.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">one hole: bend into a circle</text>
<text x="640.0" y="140.0" text-anchor="middle" font-size="60" fill="#222" font-weight="bold">B</text>
<text x="640.0" y="185.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">two holes</text>
<line x1="280.0" y1="50.0" x2="280.0" y2="190.0" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="530.0" y1="50.0" x2="530.0" y2="190.0" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
<text x="380.0" y="30.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Read each letter as a thin wire. Stretch and bend, never cut or glue.</text>
</svg>
