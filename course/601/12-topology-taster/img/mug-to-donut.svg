<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" font-family="sans-serif" font-size="14">
<title>A coffee mug deforms into a donut</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="860" height="240" fill="#fff"/>
<rect x="40.0" y="60.0" width="90.0" height="110.0" fill="#f1f3f5" stroke="#222" stroke-width="2.5" rx="8"/>
<path d="M 130 85 C 175 85, 175 145, 130 145" fill="none" stroke="#d9480f" stroke-width="12"/>
<text x="105.0" y="205.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">coffee mug</text>
<ellipse cx="290" cy="120" rx="45" ry="55" fill="#f1f3f5" stroke="#222" stroke-width="2.5"/>
<path d="M 330 90 C 385 85, 385 155, 330 150" fill="none" stroke="#d9480f" stroke-width="16"/>
<text x="310.0" y="205.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">squash the cup</text>
<ellipse cx="500" cy="120" rx="40" ry="40" fill="#f1f3f5" stroke="#222" stroke-width="2.5"/>
<path d="M 530 92 C 600 80, 600 160, 530 148" fill="none" stroke="#d9480f" stroke-width="26"/>
<text x="530.0" y="205.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">grow the handle</text>
<ellipse cx="740" cy="120" rx="95" ry="55" fill="#f1f3f5" stroke="#d9480f" stroke-width="3"/>
<path d="M 700 118 Q 740 140 780 118" fill="none" stroke="#222" stroke-width="2.5"/>
<path d="M 708 124 Q 740 108 772 124" fill="#fff" stroke="#222" stroke-width="2.5"/>
<text x="740.0" y="205.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">donut (torus)</text>
<line x1="180.0" y1="40.0" x2="225.0" y2="40.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="395.0" y1="40.0" x2="440.0" y2="40.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="610.0" y1="40.0" x2="640.0" y2="40.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="430.0" y="228.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">Stretch and bend, never cut or glue. The single hole survives every step.</text>
</svg>
