<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="sans-serif" font-size="14">
<title>An open interval versus a closed interval</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="220" fill="#fff"/>
<line x1="40.0" y1="70.0" x2="680.0" y2="70.0" stroke="#222" stroke-width="2"/>
<line x1="120.0" y1="70.0" x2="600.0" y2="70.0" stroke="#d9480f" stroke-width="6"/>
<circle cx="120.0" cy="70.0" r="7.0" fill="#fff" stroke="#d9480f" stroke-width="2.5"/>
<circle cx="600.0" cy="70.0" r="7.0" fill="#fff" stroke="#d9480f" stroke-width="2.5"/>
<text x="120.0" y="100.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">a</text>
<text x="600.0" y="100.0" text-anchor="middle" font-size="14" fill="#222" font-weight="normal">b</text>
<circle cx="520.0" cy="70.0" r="5.0" fill="#222" stroke="#222" stroke-width="1"/>
<text x="520.0" y="50.0" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">x</text>
<path d="M 465 82 L 465 90 L 575 90 L 575 82" fill="none" stroke="#222" stroke-width="2"/>
<text x="520.0" y="112.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">(x − r, x + r) fits inside</text>
<text x="360.0" y="40.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">(a, b) is open</text>
<line x1="40.0" y1="160.0" x2="680.0" y2="160.0" stroke="#222" stroke-width="2"/>
<line x1="120.0" y1="160.0" x2="600.0" y2="160.0" stroke="#222" stroke-width="6"/>
<circle cx="120.0" cy="160.0" r="7.0" fill="#222" stroke="#222" stroke-width="1"/>
<circle cx="600.0" cy="160.0" r="7.0" fill="#222" stroke="#222" stroke-width="1"/>
<path d="M 570 172 L 570 180 L 630 180 L 630 172" fill="none" stroke="#d9480f" stroke-width="2"/>
<text x="600.0" y="202.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">spills past b</text>
<text x="360.0" y="146.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">[a, b] is not open: no interval around b fits</text>
</svg>
