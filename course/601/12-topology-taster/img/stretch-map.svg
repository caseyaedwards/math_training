<text x="74.0" y="195.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">-9</text>
<circle cx="305.0" cy="60.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="346.0" cy="170.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<line x1="305.0" y1="66.0" x2="346.0" y2="164.0" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="346.0" y="195.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">-1</text>
<circle cx="380.0" cy="60.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="380.0" cy="170.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<line x1="380.0" y1="66.0" x2="380.0" y2="164.0" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="380.0" y="195.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">0</text>
<circle cx="455.0" cy="60.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="414.0" cy="170.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
