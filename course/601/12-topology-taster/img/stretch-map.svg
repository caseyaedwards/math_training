<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="sans-serif" font-size="14">
<title>A homeomorphism from an open interval onto the real line</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="760" height="230" fill="#fff"/>
<line x1="230.0" y1="60.0" x2="530.0" y2="60.0" stroke="#222" stroke-width="3"/>
<circle cx="230.0" cy="60.0" r="6.0" fill="#fff" stroke="#222" stroke-width="2"/>
<circle cx="530.0" cy="60.0" r="6.0" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="230.0" y="40.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">−1</text>
<text x="530.0" y="40.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">1</text>
