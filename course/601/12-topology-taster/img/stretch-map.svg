<text x="414.0" y="195.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">1</text>
<circle cx="515.0" cy="60.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="686.0" cy="170.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
