<line x1="740.0" y1="170.0" x2="20.0" y2="170.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="245.0" cy="60.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="74.0" cy="170.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
