<text x="686.0" y="195.0" text-anchor="middle" font-size="13" fill="#222" font-weight="normal">9</text>
<text x="380.0" y="222.0" text-anchor="middle" font-size="13" fill="#555" font-weight="normal">f(x) = x / (1 − |x|): the ends of (−1, 1) get pulled out to infinity</text>
<text x="210.0" y="64.0" text-anchor="end" font-size="13" fill="#222" font-weight="normal">(−1, 1)</text>
<text x="30.0" y="160.0" text-anchor="start" font-size="16" fill="#222" font-weight="bold">ℝ</text>
