<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Counting to 60 on two hands: 12 finger segments times 5 fingers</title>
<rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="380.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">A Theory of Base 60: Count Knuckles, Then Fingers</text>
<text x="170.0" y="62.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">Right hand: thumb touches each</text>
<text x="170.0" y="80.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">finger segment (4 x 3 = 12)</text>
<rect x="70.0" y="100.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="92.0" y="128.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">1</text>
<rect x="70.0" y="152.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="92.0" y="180.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">2</text>
<rect x="70.0" y="204.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="92.0" y="232.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">3</text>
<rect x="122.0" y="100.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="144.0" y="128.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">4</text>
<rect x="122.0" y="152.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="144.0" y="180.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">5</text>
<rect x="122.0" y="204.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="144.0" y="232.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">6</text>
<rect x="174.0" y="100.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="196.0" y="128.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">7</text>
<rect x="174.0" y="152.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="196.0" y="180.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">8</text>
<rect x="174.0" y="204.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="196.0" y="232.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">9</text>
<rect x="226.0" y="100.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="248.0" y="128.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">10</text>
<rect x="226.0" y="152.0" width="44.0" height="44.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="248.0" y="180.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">11</text>
<rect x="226.0" y="204.0" width="44.0" height="44.0" rx="10" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<text x="248.0" y="232.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">12</text>
<text x="170.0" y="282.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">12 counted: raise one finger</text>
<text x="170.0" y="300.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">on the other hand</text>
<line x1="300.0" y1="190.0" x2="380.0" y2="190.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="580.0" y="62.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">Left hand: each raised finger</text>
<text x="580.0" y="80.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">holds one dozen</text>
<rect x="445.0" y="130.0" width="40.0" height="120.0" rx="18" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="465.0" y="272.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">12</text>
<rect x="501.0" y="110.0" width="40.0" height="140.0" rx="18" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="521.0" y="272.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">24</text>
<rect x="557.0" y="110.0" width="40.0" height="140.0" rx="18" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="577.0" y="272.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">36</text>
<rect x="613.0" y="130.0" width="40.0" height="120.0" rx="18" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="633.0" y="272.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">48</text>
<rect x="669.0" y="160.0" width="40.0" height="90.0" rx="18" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="689.0" y="272.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">60</text>
<text x="580.0" y="300.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">5 fingers x 12 = 60</text>
<text x="380.0" y="330.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">A plausible guess, not a proven origin. 60 also divides evenly by 2, 3, 4, 5, 6, 10, 12, 15, 20, 30.</text>
</svg>
