<line x1="233.0" y1="233.0" x2="233.0" y2="247.0" stroke="#222222" stroke-width="2"/>
<polygon points="240.0,225.0 250.0,225.0 245.0,233.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
<line x1="245.0" y1="233.0" x2="245.0" y2="247.0" stroke="#222222" stroke-width="2"/>
<polygon points="216.0,251.0 226.0,251.0 221.0,259.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
<line x1="221.0" y1="259.0" x2="221.0" y2="273.0" stroke="#222222" stroke-width="2"/>
