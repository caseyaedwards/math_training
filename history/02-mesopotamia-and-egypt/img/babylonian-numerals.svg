<line x1="382.0" y1="233.0" x2="382.0" y2="247.0" stroke="#222222" stroke-width="2"/>
<text x="359.5" y="300.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">51</text>
<text x="359.5" y="318.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">1/3,600</text>
<polyline points="475.0,227.0 463.0,236.0 475.0,245.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="463.0,236.0 469.0,232.0 469.0,240.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
<text x="473.5" y="300.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">10</text>
<text x="473.5" y="318.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">1/216,000</text>
<text x="560.0" y="250.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">= 1 + 24/60 + 51/60² + 10/60³</text>
<text x="560.0" y="272.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">≈ 1.414213</text>
<line x1="40.0" y1="340.0" x2="760.0" y2="340.0" stroke="#868e96" stroke-width="1"/>
<text x="40.0" y="365.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">No zero and no decimal point (in the Old Babylonian period): the reader works out the scale from context.</text>
<text x="40.0" y="387.0" text-anchor="start" font-size="13" fill="#868e96" font-weight="normal">The same marks for 1 and 30 can mean 1 x 60 + 30 = 90, or 1 + 30/60 = 1.5. Later scribes add a gap sign.</text>
</svg>
