<text x="78.0" y="318.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">ones</text>
<polyline points="192.0,227.0 180.0,236.0 192.0,245.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="180.0,236.0 186.0,232.0 186.0,240.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
