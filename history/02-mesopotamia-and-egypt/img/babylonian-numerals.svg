<polygon points="536.0,118.0 546.0,118.0 541.0,126.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
<line x1="541.0" y1="126.0" x2="541.0" y2="140.0" stroke="#222222" stroke-width="2"/>
<text x="530.0" y="160.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">24</text>
<polyline points="652.0,94.0 640.0,103.0 652.0,112.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="640.0,103.0 646.0,99.0 646.0,107.0" fill="#222222" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
