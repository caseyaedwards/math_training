<text x="670.0" y="160.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">51</text>
<line x1="40.0" y1="180.0" x2="760.0" y2="180.0" stroke="#868e96" stroke-width="1"/>
<text x="40.0" y="205.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">The YBC 7289 diagonal number, written place by place (the places are 60 times apart):</text>
