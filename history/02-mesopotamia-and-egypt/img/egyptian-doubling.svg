<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Egyptian doubling multiplication of 13 by 24</title>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<text x="320.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Egyptian Multiplication: 13 x 24 by Doubling</text>
<text x="170.0" y="70.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">count</text>
<text x="330.0" y="70.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">value</text>
<line x1="110.0" y1="80.0" x2="390.0" y2="80.0" stroke="#868e96" stroke-width="1"/>
<rect x="110.0" y="88.0" width="280.0" height="32.0" rx="0" fill="#fff4e6" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="110.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">\</text>
<text x="170.0" y="110.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">1</text>
<text x="330.0" y="110.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">24</text>
<text x="170.0" y="148.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">2</text>
<text x="330.0" y="148.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">48</text>
<rect x="110.0" y="164.0" width="280.0" height="32.0" rx="0" fill="#fff4e6" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="186.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">\</text>
<text x="170.0" y="186.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">4</text>
<text x="330.0" y="186.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">96</text>
<rect x="110.0" y="202.0" width="280.0" height="32.0" rx="0" fill="#fff4e6" stroke="none" stroke-width="1.5"/>
<text x="120.0" y="224.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">\</text>
<text x="170.0" y="224.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">8</text>
<text x="330.0" y="224.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">192</text>
<line x1="110.0" y1="252.0" x2="390.0" y2="252.0" stroke="#222222" stroke-width="1.5"/>
<text x="170.0" y="278.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">1 + 4 + 8 = 13</text>
<text x="330.0" y="278.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">24 + 96 + 192 = 312</text>
<text x="420.0" y="115.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Each row doubles</text>
<text x="420.0" y="135.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">the row above.</text>
<text x="420.0" y="175.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Mark (\) the rows</text>
<text x="420.0" y="195.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">whose counts add</text>
<text x="420.0" y="215.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">up to 13.</text>
<text x="320.0" y="315.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">13 = 8 + 4 + 1 is 1101 in binary: the scribe writes 13 in base 2 without a name for it.</text>
</svg>
