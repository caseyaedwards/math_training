<text x="60.0" y="70.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold">2/5 = 6/15 = 5/15 + 1/15 = 1/3 + 1/15</text>
<text x="173.3" y="140.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">1/3</text>
<text x="309.3" y="140.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">1/15</text>
