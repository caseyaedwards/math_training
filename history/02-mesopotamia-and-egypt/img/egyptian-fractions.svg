<text x="60.0" y="190.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold">2/7 = 8/28 = 7/28 + 1/28 = 1/4 + 1/28</text>
<text x="145.0" y="260.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">1/4</text>
<text x="242.1" y="260.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">1/28</text>
<text x="400.0" y="305.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Why bother? Sharing 2 loaves among 5 people: give each 1/3 of a loaf, then cut the last 1/3 into five 1/15 pieces.</text>
