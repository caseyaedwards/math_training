<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Tablet YBC 7289: a square of side 30 with the diagonal computed in base 60</title>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">YBC 7289: The Square Root of 2 in Base 60 (about 1800 to 1600 BCE)</text>
<circle cx="210.0" cy="225.0" r="165.0" fill="#f8f1e7" stroke="#868e96" stroke-width="2"/>
<polygon points="210.0,120.0 315.0,225.0 210.0,330.0 105.0,225.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<line x1="105.0" y1="225.0" x2="315.0" y2="225.0" stroke="#d9480f" stroke-width="2.5"/>
<line x1="210.0" y1="120.0" x2="210.0" y2="330.0" stroke="#222222" stroke-width="1.5"/>
<text x="145.0" y="163.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">30</text>
<text x="210.0" y="217.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">1;24,51,10</text>
<text x="210.0" y="249.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">42;25,35</text>
<text x="210.0" y="405.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Side 30. Along the diagonal: two numbers.</text>
<text x="420.0" y="80.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Read 1;24,51,10 place by place:</text>
<rect x="420.0" y="95.0" width="84.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="462.0" y="121.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">1</text>
<text x="462.0" y="153.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">x 1</text>
<rect x="512.0" y="95.0" width="84.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="554.0" y="121.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">24</text>
<text x="554.0" y="153.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">x 1/60</text>
<rect x="604.0" y="95.0" width="84.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="646.0" y="121.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">51</text>
<text x="646.0" y="153.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">x 1/3,600</text>
<rect x="696.0" y="95.0" width="84.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="738.0" y="121.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">10</text>
<text x="738.0" y="153.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">x 1/216,000</text>
<text x="420.0" y="190.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">= 1 + 0.4 + 0.0141667 + 0.0000463</text>
<text x="420.0" y="212.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">= 1.41421296</text>
<text x="420.0" y="234.0" text-anchor="start" font-size="14" fill="#868e96" font-weight="normal">true root 2 = 1.41421356</text>
<text x="420.0" y="256.0" text-anchor="start" font-size="14" fill="#868e96" font-weight="normal">error: about 6.0e-07 (6 parts in 10 million)</text>
<text x="420.0" y="300.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Diagonal of the side-30 square:</text>
<text x="420.0" y="322.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">30 x 1;24,51,10 = 42;25,35</text>
<text x="420.0" y="344.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">= 42 + 25/60 + 35/3,600 = 42.42639</text>
<text x="420.0" y="366.0" text-anchor="start" font-size="14" fill="#868e96" font-weight="normal">check: 30 x 1.414213 = 42.42639</text>
</svg>
