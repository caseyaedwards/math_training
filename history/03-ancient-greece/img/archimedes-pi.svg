<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Archimedes squeezes pi between inscribed and circumscribed polygons</title>
<rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Archimedes: Trap the Circle Between Two Polygons</text>
<polygon points="310.0,284.3 190.0,353.6 70.0,284.3 70.0,145.7 190.0,76.4 310.0,145.7" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<circle cx="190.0" cy="215.0" r="120.0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="293.9,275.0 190.0,335.0 86.1,275.0 86.1,155.0 190.0,95.0 293.9,155.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="310.0,215.0 293.9,275.0 250.0,318.9 190.0,335.0 130.0,318.9 86.1,275.0 70.0,215.0 86.1,155.0 130.0,111.1 190.0,95.0 250.0,111.1 293.9,155.0" fill="none" stroke="#868e96" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 3"/>
<line x1="190.0" y1="215.0" x2="310.0" y2="215.0" stroke="#868e96" stroke-width="1"/>
<text x="250.0" y="209.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">r = 1</text>
<text x="190.0" y="375.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">outer hexagon, circle, inner hexagon, inner 12-gon (dashed)</text>
<text x="400.0" y="80.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Half-perimeter for a circle of radius 1</text>
<text x="420.0" y="110.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">sides</text>
<text x="540.0" y="110.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">inside</text>
<text x="680.0" y="110.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">outside</text>
<line x1="390.0" y1="118.0" x2="760.0" y2="118.0" stroke="#868e96" stroke-width="1"/>
<text x="420.0" y="142.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">6</text>
<text x="540.0" y="142.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.00000</text>
<text x="680.0" y="142.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.46410</text>
<text x="420.0" y="168.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">12</text>
<text x="540.0" y="168.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.10583</text>
<text x="680.0" y="168.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.21539</text>
<text x="420.0" y="194.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">24</text>
<text x="540.0" y="194.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.13263</text>
<text x="680.0" y="194.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.15966</text>
<text x="420.0" y="220.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">48</text>
<text x="540.0" y="220.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.13935</text>
<text x="680.0" y="220.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3.14609</text>
<text x="420.0" y="246.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">96</text>
<text x="540.0" y="246.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">3.14103</text>
<text x="680.0" y="246.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">3.14271</text>
<text x="400.0" y="290.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Archimedes, with 96 sides and fractions only:</text>
<text x="400.0" y="316.0" text-anchor="start" font-size="16" fill="#d9480f" font-weight="bold">3 10/71 &lt; pi &lt; 3 1/7</text>
<text x="400.0" y="342.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">3.14085 &lt; 3.14159 &lt; 3.14286</text>
</svg>
