<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Brahmagupta's rules for fortunes, debts and zero on a number line</title>
<rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="390.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Brahmagupta (628 CE): Fortunes, Debts, and Zero</text>
<line x1="60.0" y1="120.0" x2="720.0" y2="120.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line x1="90.0" y1="114.0" x2="90.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="90.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">−5</text>
<line x1="150.0" y1="114.0" x2="150.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="150.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">−4</text>
<line x1="210.0" y1="114.0" x2="210.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="210.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">−3</text>
<line x1="270.0" y1="114.0" x2="270.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="270.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">−2</text>
<line x1="330.0" y1="114.0" x2="330.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="330.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">−1</text>
<line x1="390.0" y1="114.0" x2="390.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="146.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">0</text>
<line x1="450.0" y1="114.0" x2="450.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="450.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">1</text>
<line x1="510.0" y1="114.0" x2="510.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="510.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">2</text>
<line x1="570.0" y1="114.0" x2="570.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="570.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">3</text>
<line x1="630.0" y1="114.0" x2="630.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="630.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">4</text>
<line x1="690.0" y1="114.0" x2="690.0" y2="126.0" stroke="#222222" stroke-width="1.5"/>
<text x="690.0" y="146.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">5</text>
<text x="210.0" y="80.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">debts (negative)</text>
<text x="570.0" y="80.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">fortunes (positive)</text>
<circle cx="390.0" cy="120.0" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<path d="M 210 134 Q 390 190 570 134" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
<text x="390.0" y="212.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">zero minus a debt is a fortune: 0 − (−3) = 3</text>
<text x="80.0" y="250.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">A debt minus zero is a debt.</text>
<text x="420.0" y="250.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">−3 − 0 = −3</text>
<text x="80.0" y="272.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">A fortune minus zero is a fortune.</text>
<text x="420.0" y="272.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">3 − 0 = 3</text>
<text x="80.0" y="294.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Zero times anything is zero.</text>
<text x="420.0" y="294.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">0 × 5 = 0</text>
<text x="80.0" y="316.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">A debt times a debt is a fortune.</text>
<text x="420.0" y="316.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">(−2) × (−3) = 6</text>
<text x="80.0" y="338.0" text-anchor="start" font-size="14" fill="#868e96" font-weight="normal">Zero divided by zero is zero.</text>
<text x="420.0" y="338.0" text-anchor="start" font-size="14" fill="#868e96" font-weight="normal">his one slip: 0/0 has no value</text>
</svg>
