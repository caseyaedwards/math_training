<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Place value with zero: 2,075 versus 275</title>
<rect x="0" y="0" width="780" height="330" fill="#ffffff"/>
<text x="390.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Zero Holds a Place: 2,075 Is Not 275</text>
<text x="125.0" y="60.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">thousands</text>
<rect x="80.0" y="80.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="125.0" y="120.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">2</text>
<text x="235.0" y="60.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">hundreds</text>
<rect x="190.0" y="80.0" width="90.0" height="60.0" rx="0" fill="#fff4e6" stroke="#d9480f" stroke-width="2.5"/>
<text x="235.0" y="120.0" text-anchor="middle" font-size="26" fill="#d9480f" font-weight="bold">0</text>
<text x="345.0" y="60.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">tens</text>
<rect x="300.0" y="80.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="345.0" y="120.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">7</text>
<text x="455.0" y="60.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">ones</text>
<rect x="410.0" y="80.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="455.0" y="120.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">5</text>
<text x="560.0" y="106.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold">= 2,075</text>
<text x="560.0" y="130.0" text-anchor="start" font-size="12" fill="#868e96" font-weight="normal">2 x 1,000 + 0 x 100 + 7 x 10 + 5 x 1</text>
<rect x="80.0" y="200.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="190.0" y="200.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="235.0" y="240.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">2</text>
<rect x="300.0" y="200.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="345.0" y="240.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">7</text>
<rect x="410.0" y="200.0" width="90.0" height="60.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="455.0" y="240.0" text-anchor="middle" font-size="26" fill="#222222" font-weight="bold">5</text>
<text x="560.0" y="226.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold">= 275</text>
<text x="560.0" y="250.0" text-anchor="start" font-size="12" fill="#868e96" font-weight="normal">2 x 100 + 7 x 10 + 5 x 1</text>
<text x="390.0" y="300.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">Without a symbol for an empty place, 2_75 and 275 look alike. India's zero (by the 600s) ends the guessing.</text>
</svg>
