<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Al-Khwarizmi completes the square for x squared plus 10x equals 39</title>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Al-Khwarizmi: Solve x² + 10x = 39 by Completing a Square</text>
<rect x="70.0" y="70.0" width="102.0" height="102.0" rx="0" fill="#fff4e6" stroke="#222222" stroke-width="2"/>
<text x="121.0" y="126.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">x²</text>
<rect x="172.0" y="70.0" width="170.0" height="102.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="257.0" y="126.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">5x</text>
<rect x="70.0" y="172.0" width="102.0" height="170.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="121.0" y="262.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">5x</text>
<rect x="172.0" y="172.0" width="170.0" height="170.0" rx="0" fill="none" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="257.0" y="262.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">missing</text>
<text x="121.0" y="62.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal" font-style="italic">x</text>
<text x="257.0" y="62.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">5</text>
<text x="60.0" y="126.0" text-anchor="end" font-size="14" fill="#222222" font-weight="normal" font-style="italic">x</text>
<text x="60.0" y="262.0" text-anchor="end" font-size="14" fill="#222222" font-weight="normal">5</text>
<rect x="470.0" y="70.0" width="102.0" height="102.0" rx="0" fill="#fff4e6" stroke="#222222" stroke-width="2"/>
<text x="521.0" y="126.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">x²</text>
<rect x="572.0" y="70.0" width="170.0" height="102.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="657.0" y="126.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">5x</text>
<rect x="470.0" y="172.0" width="102.0" height="170.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="521.0" y="262.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">5x</text>
<rect x="572.0" y="172.0" width="170.0" height="170.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="2" fill-opacity="0.25"/>
<text x="657.0" y="262.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">5 x 5 = 25</text>
<text x="521.0" y="62.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal" font-style="italic">x</text>
<text x="657.0" y="62.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">5</text>
<text x="460.0" y="126.0" text-anchor="end" font-size="14" fill="#222222" font-weight="normal" font-style="italic">x</text>
<text x="460.0" y="262.0" text-anchor="end" font-size="14" fill="#222222" font-weight="normal">5</text>
<text x="206.0" y="370.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">x² + 10x = 39: an L-shape of area 39</text>
<text x="606.0" y="370.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">add 25: a full square of area 64</text>
<text x="410.0" y="400.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">39 + 25 = 64, so the side is 8. The side is x + 5, so x = 3.</text>
</svg>
