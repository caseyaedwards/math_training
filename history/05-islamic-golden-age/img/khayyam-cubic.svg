<text x="210.0" y="230.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">(2, 2)</text>
<text x="269.0" y="66.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">parabola y = x²/2</text>
<text x="272.0" y="264.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="normal">circle: center (2, 0), radius 2</text>
<text x="480.0" y="90.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">Solve x³ + 4x = 16.</text>
<text x="480.0" y="118.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Khayyam: 4 = a², so a = 2.</text>
<text x="480.0" y="146.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Parabola x² = a y, that is y = x²/2.</text>
<text x="480.0" y="174.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Circle on diameter 16/4 = 4.</text>
<text x="480.0" y="202.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">They cross at x = 2.</text>
<text x="480.0" y="230.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">Check: 8 + 8 = 16.</text>
