<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Al-Khwarizmi's first figure: square x squared with four strips of 2.5 by x and four corner squares</title>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Al-Khwarizmi, First Figure: Split 10x Into Four Strips</text>
<rect x="80.0" y="70.0" width="85.0" height="85.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="122.5" y="117.5" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">6.25</text>
<rect x="267.0" y="70.0" width="85.0" height="85.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="309.5" y="117.5" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">6.25</text>
<rect x="80.0" y="257.0" width="85.0" height="85.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="122.5" y="304.5" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">6.25</text>
<rect x="267.0" y="257.0" width="85.0" height="85.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.5" fill-opacity="0.25"/>
<text x="309.5" y="304.5" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">6.25</text>
<rect x="165.0" y="70.0" width="102.0" height="85.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="216.0" y="117.5" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">2.5x</text>
<rect x="165.0" y="257.0" width="102.0" height="85.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="216.0" y="304.5" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">2.5x</text>
<rect x="80.0" y="155.0" width="85.0" height="102.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="122.5" y="211.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">2.5x</text>
<rect x="267.0" y="155.0" width="85.0" height="102.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="309.5" y="211.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">2.5x</text>
<rect x="165.0" y="155.0" width="102.0" height="102.0" rx="0" fill="#fff4e6" stroke="#222222" stroke-width="2"/>
<text x="216.0" y="212.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">x²</text>
<rect x="80.0" y="70.0" width="272.0" height="272.0" rx="0" fill="none" stroke="#222222" stroke-width="2.5"/>
<text x="122.5" y="62.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">2.5</text>
<text x="216.0" y="62.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal" font-style="italic">x</text>
<text x="309.5" y="62.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">2.5</text>
<text x="420.0" y="110.0" text-anchor="start" font-size="15" fill="#d9480f" font-weight="bold">x² + 10x = 39</text>
<text x="420.0" y="144.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal">cross shape: x² + 4 strips of 2.5x = 39</text>
<text x="420.0" y="178.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal">corners: 4 x 2.5 x 2.5 = 25</text>
<text x="420.0" y="212.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal">whole square: 39 + 25 = 64</text>
<text x="420.0" y="246.0" text-anchor="start" font-size="15" fill="#222222" font-weight="normal">side: 8 = 2.5 + x + 2.5</text>
<text x="420.0" y="280.0" text-anchor="start" font-size="15" fill="#d9480f" font-weight="bold">x = 8 − 5 = 3</text>
<text x="410.0" y="400.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Same answer as the second figure (two strips of 5x). Two pictures, one idea: complete the square.</text>
</svg>
