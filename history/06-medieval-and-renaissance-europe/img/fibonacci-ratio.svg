<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Ratios of consecutive Fibonacci numbers approach the golden ratio 1.618</title>
<rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
<text x="400.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Fibonacci Ratios Settle on the Golden Ratio</text>
<rect x="80.0" y="60.0" width="660.0" height="240.0" rx="0" fill="none" stroke="#868e96" stroke-width="1"/>
<line x1="80.0" y1="280.0" x2="740.0" y2="280.0" stroke="#e9ecef" stroke-width="1"/>
<text x="72.0" y="285.0" text-anchor="end" font-size="12" fill="#868e96" font-weight="normal">1.0</text>
<line x1="80.0" y1="180.0" x2="740.0" y2="180.0" stroke="#e9ecef" stroke-width="1"/>
<text x="72.0" y="185.0" text-anchor="end" font-size="12" fill="#868e96" font-weight="normal">1.5</text>
<line x1="80.0" y1="80.0" x2="740.0" y2="80.0" stroke="#e9ecef" stroke-width="1"/>
<text x="72.0" y="85.0" text-anchor="end" font-size="12" fill="#868e96" font-weight="normal">2.0</text>
<line x1="80.0" y1="156.4" x2="740.0" y2="156.4" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="736.0" y="148.4" text-anchor="end" font-size="13" fill="#d9480f" font-weight="bold">φ = 1.6180...</text>
<polyline points="80.0,280.0 130.8,80.0 181.5,180.0 232.3,146.7 283.1,160.0 333.8,155.0 384.6,156.9 435.4,156.2 486.2,156.5 536.9,156.4 587.7,156.4 638.5,156.4 689.2,156.4 740.0,156.4" fill="none" stroke="#868e96" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="80.0" cy="280.0" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="80.0" y="298.0" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">1/1</text>
<circle cx="130.8" cy="80.0" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="130.8" y="70.0" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">2/1</text>
<circle cx="181.5" cy="180.0" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="181.5" y="198.0" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">3/2</text>
<circle cx="232.3" cy="146.7" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="232.3" y="136.7" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">5/3</text>
<circle cx="283.1" cy="160.0" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="283.1" y="178.0" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">8/5</text>
<circle cx="333.8" cy="155.0" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="333.8" y="145.0" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">13/8</text>
<circle cx="384.6" cy="156.9" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="384.6" y="174.9" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">21/13</text>
<circle cx="435.4" cy="156.2" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="435.4" y="146.2" text-anchor="middle" font-size="11" fill="#222222" font-weight="normal">34/21</text>
<circle cx="486.2" cy="156.5" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="536.9" cy="156.4" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="587.7" cy="156.4" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="638.5" cy="156.4" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="689.2" cy="156.4" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="740.0" cy="156.4" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="400.0" y="330.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">1/1, 2/1, 3/2, 5/3, 8/5, 13/8 ... = 1, 2, 1.5, 1.667, 1.6, 1.625 ...: each step overshoots, then undershoots, less each time.</text>
<text x="400.0" y="350.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Fibonacci never mentions this. Kepler notices it about 400 years later.</text>
</svg>
