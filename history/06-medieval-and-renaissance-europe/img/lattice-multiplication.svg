<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Lattice multiplication of 47 by 36</title>
<rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
<text x="300.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Lattice (Gelosia) Multiplication: 47 x 36 = 1,692</text>
<line x1="180.0" y1="80.0" x2="180.0" y2="260.0" stroke="#222222" stroke-width="2"/>
<line x1="180.0" y1="80.0" x2="360.0" y2="80.0" stroke="#222222" stroke-width="2"/>
<line x1="270.0" y1="80.0" x2="270.0" y2="260.0" stroke="#222222" stroke-width="2"/>
<line x1="180.0" y1="170.0" x2="360.0" y2="170.0" stroke="#222222" stroke-width="2"/>
<line x1="360.0" y1="80.0" x2="360.0" y2="260.0" stroke="#222222" stroke-width="2"/>
<line x1="180.0" y1="260.0" x2="360.0" y2="260.0" stroke="#222222" stroke-width="2"/>
<text x="225.0" y="68.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">4</text>
<text x="315.0" y="68.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">7</text>
<text x="376.0" y="131.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold">3</text>
<text x="376.0" y="221.0" text-anchor="start" font-size="18" fill="#222222" font-weight="bold">6</text>
<line x1="270.0" y1="80.0" x2="180.0" y2="170.0" stroke="#868e96" stroke-width="1.2"/>
<text x="207.0" y="117.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">1</text>
<text x="243.0" y="153.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">2</text>
<line x1="360.0" y1="80.0" x2="270.0" y2="170.0" stroke="#868e96" stroke-width="1.2"/>
<text x="297.0" y="117.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">2</text>
<text x="333.0" y="153.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">1</text>
<line x1="270.0" y1="170.0" x2="180.0" y2="260.0" stroke="#868e96" stroke-width="1.2"/>
<text x="207.0" y="207.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">2</text>
<text x="243.0" y="243.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">4</text>
<line x1="360.0" y1="170.0" x2="270.0" y2="260.0" stroke="#868e96" stroke-width="1.2"/>
<text x="297.0" y="207.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">4</text>
<text x="333.0" y="243.8" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">2</text>
<text x="158.0" y="129.5" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">1</text>
<text x="158.0" y="219.5" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">6</text>
<text x="220.5" y="288.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">9</text>
<text x="310.5" y="288.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">2</text>
<text x="300.0" y="330.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">Add along each diagonal from the bottom right, carrying left:</text>
<text x="300.0" y="352.0" text-anchor="middle" font-size="14" fill="#868e96" font-weight="normal">2  |  4 + 1 + 4 = 9  |  2 + 2 + 2 = 6  |  1   gives 1,692</text>
</svg>
