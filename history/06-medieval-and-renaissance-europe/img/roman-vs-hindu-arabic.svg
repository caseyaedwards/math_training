<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Adding 1,202 and 349 in Hindu-Arabic columns versus Roman numerals</title>
<rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
<text x="400.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Why Merchants Switch: Columns Versus Roman Numerals</text>
<text x="200.0" y="65.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Hindu-Arabic: line up the columns</text>
<text x="132.0" y="120.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">1</text>
<text x="176.0" y="120.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">2</text>
<text x="220.0" y="120.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">0</text>
<text x="264.0" y="120.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">2</text>
<text x="176.0" y="160.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">3</text>
<text x="220.0" y="160.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">4</text>
<text x="264.0" y="160.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">9</text>
<text x="90.0" y="160.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">+</text>
<text x="220.0" y="92.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">1</text>
<line x1="80.0" y1="175.0" x2="292.0" y2="175.0" stroke="#222222" stroke-width="2"/>
<text x="132.0" y="210.0" text-anchor="middle" font-size="24" fill="#d9480f" font-weight="bold">1</text>
<text x="176.0" y="210.0" text-anchor="middle" font-size="24" fill="#d9480f" font-weight="bold">5</text>
<text x="220.0" y="210.0" text-anchor="middle" font-size="24" fill="#d9480f" font-weight="bold">5</text>
<text x="264.0" y="210.0" text-anchor="middle" font-size="24" fill="#d9480f" font-weight="bold">1</text>
<text x="200.0" y="250.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">2 + 9 = 11: write 1, carry 1 (small orange 1)</text>
<text x="600.0" y="65.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Roman: no columns to line up</text>
<text x="600.0" y="120.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">MCCII</text>
<text x="600.0" y="160.0" text-anchor="middle" font-size="24" fill="#222222" font-weight="normal">+ CCCXLIX</text>
<line x1="490.0" y1="175.0" x2="710.0" y2="175.0" stroke="#222222" stroke-width="2"/>
<text x="600.0" y="210.0" text-anchor="middle" font-size="24" fill="#d9480f" font-weight="bold">MDLI</text>
<text x="600.0" y="250.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">regroup symbols by hand (or use a counting board)</text>
<text x="400.0" y="300.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">Fibonacci's Liber Abaci (1202) teaches merchants the column method. Many still use counting boards for</text>
<text x="400.0" y="320.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">centuries. A 1299 Florence money-changers rule even bans the new digits in account books (too easy to forge).</text>
</svg>
