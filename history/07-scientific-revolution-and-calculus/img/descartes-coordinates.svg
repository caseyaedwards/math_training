<text x="409.0" y="258.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal" font-style="italic">x</text>
<text x="220.0" y="51.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal" font-style="italic">y</text>
<text x="366.0" y="258.0" text-anchor="start" font-size="12" fill="#868e96" font-weight="normal">5</text>
<text x="54.0" y="258.0" text-anchor="end" font-size="12" fill="#868e96" font-weight="normal">−5</text>
<text x="204.0" y="84.0" text-anchor="end" font-size="12" fill="#868e96" font-weight="normal">5</text>
<text x="204.0" y="408.0" text-anchor="end" font-size="12" fill="#868e96" font-weight="normal">−5</text>
<circle cx="210.0" cy="240.0" r="150.0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<line x1="210.0" y1="240.0" x2="300.0" y2="120.0" stroke="#222222" stroke-width="1.5"/>
<line x1="300.0" y1="120.0" x2="300.0" y2="240.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="255.0" y="258.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">3</text>
<text x="308.0" y="180.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">4</text>
<text x="246.0" y="168.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">5</text>
<circle cx="300.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="308.0" y="112.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">(3, 4)</text>
<text x="448.0" y="90.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Every point is a</text>
<text x="448.0" y="110.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">pair of numbers.</text>
<text x="448.0" y="150.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">The circle is every</text>
<text x="448.0" y="170.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">pair that satisfies</text>
<text x="448.0" y="196.0" text-anchor="start" font-size="16" fill="#d9480f" font-weight="bold">x² + y² = 25</text>
<text x="448.0" y="236.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Check (3, 4):</text>
<text x="448.0" y="256.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">9 + 16 = 25</text>
<text x="330.0" y="460.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Modern perpendicular axes came after Descartes, but the idea is his and Fermat's.</text>
</svg>
