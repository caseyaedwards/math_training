<line x1="30.0" y1="270.0" x2="390.0" y2="270.0" stroke="#e9ecef" stroke-width="1"/>
<line x1="270.0" y1="60.0" x2="270.0" y2="420.0" stroke="#e9ecef" stroke-width="1"/>
<line x1="30.0" y1="300.0" x2="390.0" y2="300.0" stroke="#e9ecef" stroke-width="1"/>
<line x1="300.0" y1="60.0" x2="300.0" y2="420.0" stroke="#e9ecef" stroke-width="1"/>
