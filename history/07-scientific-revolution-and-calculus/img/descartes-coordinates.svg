<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Coordinates turn the circle into the equation x squared plus y squared equals 25</title>
<rect x="0" y="0" width="660" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="330.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Descartes (1637): A Curve Becomes an Equation</text>
