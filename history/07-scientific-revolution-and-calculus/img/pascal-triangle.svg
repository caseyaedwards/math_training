<text x="560.0" y="120.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">Flip 4 coins: 16 outcomes</text>
<text x="560.0" y="146.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">0 heads: 1 way</text>
<text x="560.0" y="172.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">1 head: 4 ways</text>
<text x="560.0" y="198.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">2 heads: 6 ways</text>
<text x="560.0" y="224.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">3 heads: 4 ways</text>
<text x="560.0" y="250.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">4 heads: 1 way</text>
<text x="560.0" y="276.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">1 + 4 + 6 + 4 + 1 = 16</text>
<text x="560.0" y="302.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">P(exactly 2 heads) = 6/16</text>
<text x="390.0" y="405.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">Known centuries earlier in India (Pingala), Persia (al-Karaji), and China (Yang Hui, 1261). Pascal works out its theory.</text>
