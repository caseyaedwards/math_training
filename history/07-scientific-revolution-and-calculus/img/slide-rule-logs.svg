<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Two logarithmic scales slid against each other multiply 2 by 3 to get 6</title>
<rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Logarithms Turn Multiplication Into Addition (Slide Rule, 1620s)</text>
<rect x="228.6" y="80.0" width="560.0" height="40.0" rx="0" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<line x1="228.6" y1="120.0" x2="228.6" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="228.6" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">1</text>
<line x1="397.2" y1="120.0" x2="397.2" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="397.2" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">2</text>
<line x1="495.8" y1="120.0" x2="495.8" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="495.8" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">3</text>
<line x1="565.7" y1="120.0" x2="565.7" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="565.7" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">4</text>
<line x1="620.0" y1="120.0" x2="620.0" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="620.0" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">5</text>
<line x1="664.3" y1="120.0" x2="664.3" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="664.3" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">6</text>
<line x1="701.8" y1="120.0" x2="701.8" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="701.8" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">7</text>
<line x1="734.3" y1="120.0" x2="734.3" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="734.3" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">8</text>
<line x1="763.0" y1="120.0" x2="763.0" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="763.0" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">9</text>
<line x1="788.6" y1="120.0" x2="788.6" y2="106.0" stroke="#222222" stroke-width="1.5"/>
<text x="788.6" y="100.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">10</text>
<text x="40.0" y="106.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">C</text>
<rect x="60.0" y="120.0" width="560.0" height="40.0" rx="0" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<line x1="60.0" y1="120.0" x2="60.0" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">1</text>
<line x1="228.6" y1="120.0" x2="228.6" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="228.6" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">2</text>
<line x1="327.2" y1="120.0" x2="327.2" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="327.2" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">3</text>
<line x1="397.2" y1="120.0" x2="397.2" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="397.2" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">4</text>
<line x1="451.4" y1="120.0" x2="451.4" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="451.4" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">5</text>
<line x1="495.8" y1="120.0" x2="495.8" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="495.8" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">6</text>
<line x1="533.3" y1="120.0" x2="533.3" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="533.3" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">7</text>
<line x1="565.7" y1="120.0" x2="565.7" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="565.7" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">8</text>
<line x1="594.4" y1="120.0" x2="594.4" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="594.4" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">9</text>
<line x1="620.0" y1="120.0" x2="620.0" y2="134.0" stroke="#222222" stroke-width="1.5"/>
<text x="620.0" y="152.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="normal">10</text>
<text x="40.0" y="146.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">D</text>
<line x1="228.6" y1="70.0" x2="228.6" y2="175.0" stroke="#d9480f" stroke-width="2"/>
<line x1="495.8" y1="70.0" x2="495.8" y2="175.0" stroke="#d9480f" stroke-width="2"/>
<text x="228.6" y="195.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">C's 1 over D's 2</text>
<text x="495.8" y="195.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">read under C's 3: D says 6</text>
<text x="410.0" y="235.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">Distance from 1 to n is log(n). Adding lengths log 2 + log 3 = log 6 multiplies 2 x 3 = 6.</text>
<text x="410.0" y="258.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Napier (1614) publishes log tables; Gunter, Oughtred and others turn them into scales and slide rules.</text>
</svg>
