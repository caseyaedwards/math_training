<text x="460.0" y="100.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Follow the dashed path.</text>
<text x="460.0" y="124.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Skip gray repeats (2/2 = 1/1).</text>
<text x="460.0" y="148.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Orange numbers: place in the list.</text>
<text x="460.0" y="172.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal"></text>
<text x="460.0" y="196.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">1/1, 1/2, 2/1, 3/1, 1/3, 1/4,</text>
<text x="460.0" y="220.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">2/3, 3/2, 4/1, 5/1, 1/5, ...</text>
<text x="460.0" y="244.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal"></text>
<text x="460.0" y="268.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Every fraction gets a place:</text>
<text x="460.0" y="292.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">the fractions are countable.</text>
<text x="460.0" y="316.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">The real numbers are not</text>
<text x="460.0" y="340.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">(see the diagonal argument).</text>
