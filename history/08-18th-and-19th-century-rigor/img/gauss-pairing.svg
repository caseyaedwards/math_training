<text x="380.0" y="290.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">orange staircase = gray staircase = 1 + 2 + 3 + 4 + 5 + 6</text>
<text x="380.0" y="314.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">both together = 6 x 7 = 42, one staircase = 21</text>
<text x="380.0" y="338.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">in general: 1 + 2 + ... + n = n(n + 1)/2</text>
<text x="410.0" y="412.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">The classroom story comes from a later biography; the math is solid even if the details drifted.</text>
