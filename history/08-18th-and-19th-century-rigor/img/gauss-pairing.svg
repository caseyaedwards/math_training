<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Adding 1 to 100 by pairing: 50 pairs of 101; and the staircase picture for 1 to 6</title>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Young Gauss (Story, c. 1786): 1 + 2 + ... + 100 by Pairing</text>
