<text x="220.0" y="168.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">101</text>
<text x="290.0" y="80.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">...</text>
<text x="290.0" y="140.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">...</text>
<text x="360.0" y="80.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">49</text>
<text x="360.0" y="140.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">52</text>
<line x1="360.0" y1="88.0" x2="360.0" y2="122.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="360.0" y="168.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">101</text>
<text x="430.0" y="80.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">50</text>
<text x="430.0" y="140.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="normal">51</text>
<line x1="430.0" y1="88.0" x2="430.0" y2="122.0" stroke="#d9480f" stroke-width="1.5"/>
<text x="430.0" y="168.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">101</text>
<text x="560.0" y="100.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">50 pairs, each worth 101:</text>
<text x="560.0" y="124.0" text-anchor="start" font-size="16" fill="#d9480f" font-weight="bold">50 x 101 = 5,050</text>
<line x1="40.0" y1="195.0" x2="780.0" y2="195.0" stroke="#868e96" stroke-width="1"/>
<text x="40.0" y="220.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Same idea as a picture: two staircases of 1 + 2 + ... + 6 fill a 6 by 7 rectangle.</text>
