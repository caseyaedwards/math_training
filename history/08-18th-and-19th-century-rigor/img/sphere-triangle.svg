<text x="230.0" y="63.1" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">North Pole</text>
<circle cx="230.0" cy="258.8" r="4.5" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="230.0" y="280.8" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">on the equator</text>
<circle cx="80.0" cy="220.0" r="4.5" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="80.0" y="246.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">on the equator</text>
<text x="450.0" y="90.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Walk from the North Pole</text>
<text x="450.0" y="112.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">down to the equator,</text>
<text x="450.0" y="134.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">turn 90°, walk a quarter</text>
<text x="450.0" y="156.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">of the way round, turn 90°,</text>
<text x="450.0" y="178.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">walk back up to the pole.</text>
<text x="450.0" y="200.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal"></text>
<text x="450.0" y="222.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">Angles: 90° + 90° + 90° = 270°</text>
<text x="450.0" y="244.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal"></text>
<text x="450.0" y="266.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Euclid's parallel postulate</text>
<text x="450.0" y="288.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">fails on a sphere (Riemann,</text>
<text x="450.0" y="310.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">1854). Gauss, Bolyai and</text>
<text x="450.0" y="332.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Lobachevsky (1820s) find a</text>
<text x="450.0" y="354.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">geometry where angles add to less.</text>
</svg>
