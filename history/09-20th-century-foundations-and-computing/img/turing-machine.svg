<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>A Turing machine that adds 1 to a binary number on its tape</title>
<rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Turing (1936): A Machine That Adds 1 to Binary 1011</text>
<rect x="60.0" y="110.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="139.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">_</text>
<rect x="106.0" y="110.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="129.0" y="139.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">1</text>
<rect x="152.0" y="110.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="175.0" y="139.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">0</text>
<rect x="198.0" y="110.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="221.0" y="139.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">1</text>
<rect x="244.0" y="110.0" width="46.0" height="46.0" rx="0" fill="#fff4e6" stroke="#d9480f" stroke-width="2.5"/>
<text x="267.0" y="139.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">1</text>
<rect x="290.0" y="110.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="313.0" y="139.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">_</text>
<text x="50.0" y="139.0" text-anchor="end" font-size="16" fill="#222222" font-weight="normal">...</text>
<text x="346.0" y="139.0" text-anchor="start" font-size="16" fill="#222222" font-weight="normal">...</text>
<polygon points="267.0,106.0 257.0,88.0 277.0,88.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="223.0" y="58.0" width="88.0" height="28.0" rx="4" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="267.0" y="77.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">state: carry</text>
<text x="60.0" y="178.0" text-anchor="start" font-size="13" fill="#868e96" font-weight="normal">Start: head on the last digit, state carry</text>
<rect x="60.0" y="260.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="289.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">_</text>
<rect x="106.0" y="260.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="129.0" y="289.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">1</text>
<rect x="152.0" y="260.0" width="46.0" height="46.0" rx="0" fill="#fff4e6" stroke="#d9480f" stroke-width="2.5"/>
<text x="175.0" y="289.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">1</text>
<rect x="198.0" y="260.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="221.0" y="289.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">0</text>
<rect x="244.0" y="260.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="267.0" y="289.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">0</text>
<rect x="290.0" y="260.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="313.0" y="289.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">_</text>
<text x="50.0" y="289.0" text-anchor="end" font-size="16" fill="#222222" font-weight="normal">...</text>
<text x="346.0" y="289.0" text-anchor="start" font-size="16" fill="#222222" font-weight="normal">...</text>
<polygon points="175.0,256.0 165.0,238.0 185.0,238.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="131.0" y="208.0" width="88.0" height="28.0" rx="4" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="175.0" y="227.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">state: halt</text>
<text x="60.0" y="328.0" text-anchor="start" font-size="13" fill="#868e96" font-weight="normal">End: 1011 + 1 = 1100 (11 + 1 = 12)</text>
<text x="430.0" y="80.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Rule table</text>
<text x="465.0" y="108.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">state</text>
<text x="535.0" y="108.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">read</text>
<text x="605.0" y="108.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">write</text>
<text x="675.0" y="108.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">move</text>
<text x="745.0" y="108.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">next</text>
<line x1="430.0" y1="116.0" x2="780.0" y2="116.0" stroke="#868e96" stroke-width="1"/>
<text x="465.0" y="140.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">carry</text>
<text x="535.0" y="140.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">1</text>
<text x="605.0" y="140.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">0</text>
<text x="675.0" y="140.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">left</text>
<text x="745.0" y="140.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">carry</text>
<text x="465.0" y="164.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">carry</text>
<text x="535.0" y="164.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">0</text>
<text x="605.0" y="164.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">1</text>
<text x="675.0" y="164.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">-</text>
<text x="745.0" y="164.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">halt</text>
<text x="465.0" y="188.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">carry</text>
<text x="535.0" y="188.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">_</text>
<text x="605.0" y="188.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">1</text>
<text x="675.0" y="188.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">-</text>
<text x="745.0" y="188.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">halt</text>
<text x="60.0" y="405.0" text-anchor="start" font-size="14" fill="#222222" font-weight="normal">Steps: read 1, write 0, move left; read 1, write 0, move left; read 0, write 1, halt.</text>
<text x="60.0" y="427.0" text-anchor="start" font-size="13" fill="#868e96" font-weight="normal">A finite rule table plus an unbounded tape: Turing's model of any mechanical computation.</text>
</svg>
