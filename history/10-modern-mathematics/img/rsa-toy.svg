<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Toy RSA: public key 3233 and 17 encrypts 65 to 2790</title>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="380.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">RSA (1977): Easy to Lock, Hard to Unlock Without the Factors</text>
<rect x="40.0" y="110.0" width="160.0" height="70.0" rx="8" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="120.0" y="136.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">message</text>
<text x="120.0" y="164.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold">65</text>
<rect x="300.0" y="110.0" width="160.0" height="70.0" rx="8" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="380.0" y="136.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">ciphertext</text>
<text x="380.0" y="164.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold">2790</text>
<rect x="560.0" y="110.0" width="160.0" height="70.0" rx="8" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="640.0" y="136.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">message</text>
<text x="640.0" y="164.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold">65</text>
<line x1="205.0" y1="145.0" x2="295.0" y2="145.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="465.0" y1="145.0" x2="555.0" y2="145.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
<text x="250.0" y="100.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">m^17 mod 3233</text>
<text x="250.0" y="210.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">public key</text>
<text x="250.0" y="228.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">(n = 3,233, e = 17)</text>
<text x="510.0" y="100.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">c^2753 mod 3233</text>
<text x="510.0" y="210.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">private key d</text>
<text x="510.0" y="228.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="normal">needs 3,233 = 61 x 53</text>
<text x="380.0" y="272.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="normal">Real keys use n with about 600 digits. No known method factors that fast on ordinary computers.</text>
</svg>
