<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Leonhard Euler</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Leonhard Euler: 1707 to 1783</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Basel, St Petersburg, Berlin. Life span about 76 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="108.3" y="113.0" width="603.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="108.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1707</text>
<text x="711.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1783</text>
<line x1="330.6" y1="127.0" x2="330.6" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="330.6" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="326.6" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1735: Basel problem: pi^2/6</text>
<line x1="338.5" y1="127.0" x2="338.5" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="338.5" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="334.5" y="190.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1736: Königsberg bridges</text>
<line x1="433.8" y1="127.0" x2="433.8" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="433.8" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="437.8" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1748: Introductio: e, sin, cos</text>
<line x1="576.7" y1="127.0" x2="576.7" y2="238.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="576.7" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="580.7" y="250.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1766: back to St Petersburg, nearly blind</text>
</svg>
