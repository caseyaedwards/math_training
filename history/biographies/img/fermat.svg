<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Pierre de Fermat</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Pierre de Fermat: c. 1607 to 1665</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Toulouse, France. Life span about 58 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="108.3" y="113.0" width="603.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="108.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born c. 1607</text>
<text x="711.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1665</text>
<line x1="410.0" y1="127.0" x2="410.0" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="410.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="414.0" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">c. 1636: coordinate geometry (circulated)</text>
<line x1="420.4" y1="127.0" x2="420.4" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="420.4" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="424.4" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">c. 1637: margin note: Last Theorem</text>
<line x1="451.6" y1="127.0" x2="451.6" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="451.6" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="455.6" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1640: little theorem (letter)</text>
<line x1="597.3" y1="127.0" x2="597.3" y2="238.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="597.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="601.3" y="250.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1654: letters with Pascal: probability</text>
<text x="410.0" y="284.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">c. = circa (about): this date is uncertain.</text>
</svg>
