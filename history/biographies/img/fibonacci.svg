<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Leonardo of Pisa (Fibonacci)</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Leonardo of Pisa (Fibonacci): c. 1170 to c. 1250</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Pisa, Italy. Life span about 80 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="108.3" y="113.0" width="603.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="108.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born c. 1170</text>
<text x="711.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died c. 1250</text>
<line x1="349.7" y1="127.0" x2="349.7" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="349.7" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="345.7" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1202: Liber Abaci</text>
<line x1="523.1" y1="127.0" x2="523.1" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="523.1" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="527.1" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1225: Liber Quadratorum</text>
<line x1="545.8" y1="127.0" x2="545.8" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="545.8" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="549.8" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1228: revised Liber Abaci</text>
<text x="410.0" y="284.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">c. = circa (about): this date is uncertain.</text>
</svg>
