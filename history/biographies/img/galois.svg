<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Évariste Galois</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Évariste Galois: 1811 to 1832</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Paris, France. Life span about 21 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="156.6" y="113.0" width="506.9" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="156.6" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1811</text>
<text x="663.4" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1832</text>
<line x1="591.0" y1="127.0" x2="591.0" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="591.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="595.0" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1829: fails entry exam a second time</text>
<line x1="639.3" y1="127.0" x2="639.3" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="639.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="643.3" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1831: arrested, then jailed for months</text>
<line x1="663.4" y1="127.0" x2="663.4" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="663.4" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="667.4" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1832: dies after a duel, age 20</text>
</svg>
