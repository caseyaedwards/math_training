<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Carl Friedrich Gauss</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Carl Friedrich Gauss: 1777 to 1855</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Brunswick and Göttingen, Germany. Life span about 78 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="108.3" y="113.0" width="603.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="108.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1777</text>
<text x="711.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1855</text>
<line x1="255.3" y1="127.0" x2="255.3" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="255.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="251.3" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1796: regular 17-gon by ruler and compass</text>
<line x1="278.5" y1="127.0" x2="278.5" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="278.5" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="274.5" y="190.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1799: fundamental theorem of algebra</text>
<line x1="294.0" y1="127.0" x2="294.0" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="294.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="290.0" y="220.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1801: Disquisitiones Arithmeticae</text>
<line x1="495.1" y1="127.0" x2="495.1" y2="238.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="495.1" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="499.1" y="250.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1827: geometry of curved surfaces</text>
</svg>
