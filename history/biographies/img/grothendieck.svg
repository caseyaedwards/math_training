<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Alexander Grothendieck</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Alexander Grothendieck: 1928 to 2014</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Paris area, France. Life span about 86 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="108.3" y="113.0" width="603.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="108.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1928</text>
<text x="711.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 2014</text>
<line x1="332.8" y1="127.0" x2="332.8" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="332.8" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="328.8" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1960: EGA: schemes</text>
<line x1="374.9" y1="127.0" x2="374.9" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="374.9" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="370.9" y="190.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1966: Fields Medal</text>
<line x1="403.0" y1="127.0" x2="403.0" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="403.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="407.0" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1970: leaves IHÉS</text>
<line x1="550.3" y1="127.0" x2="550.3" y2="238.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="550.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="554.3" y="250.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1991: withdraws to the Pyrenees</text>
</svg>
