<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Hypatia of Alexandria</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Hypatia of Alexandria: c. 370 to 415</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Alexandria, Egypt. Life span about 45 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="112.8" y="113.0" width="594.3" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="112.8" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born c. 370</text>
<text x="707.2" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 415</text>
<line x1="509.1" y1="127.0" x2="509.1" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="509.1" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="513.1" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">c. 400: leads a school of philosophy</text>
<line x1="707.2" y1="127.0" x2="707.2" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="707.2" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="711.2" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">415: killed by a mob</text>
<text x="410.0" y="284.0" text-anchor="middle" font-size="12" fill="#868e96" font-weight="normal">c. = circa (about): this date is uncertain.</text>
</svg>
