<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Ada Lovelace</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Ada Lovelace: 1815 to 1852</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: London, England. Life span about 37 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="122.2" y="113.0" width="575.6" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="122.2" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1815</text>
<text x="697.8" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1852</text>
<line x1="402.2" y1="127.0" x2="402.2" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="402.2" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="406.2" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1833: meets Charles Babbage</text>
<line x1="557.8" y1="127.0" x2="557.8" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="557.8" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="561.8" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1843: Notes on the Analytical Engine</text>
</svg>
