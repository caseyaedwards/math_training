<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Maryam Mirzakhani</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Maryam Mirzakhani: 1977 to 2017</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Tehran; Harvard and Stanford, USA. Life span about 40 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="118.3" y="113.0" width="583.3" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="118.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1977</text>
<text x="701.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 2017</text>
<line x1="380.8" y1="127.0" x2="380.8" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="380.8" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="376.8" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1995: IMO gold, perfect score</text>
<line x1="512.1" y1="127.0" x2="512.1" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="512.1" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="516.1" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">2004: PhD: counting closed geodesics</text>
<line x1="657.9" y1="127.0" x2="657.9" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="657.9" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="661.9" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">2014: first woman to win the Fields Medal</text>
</svg>
