<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Blaise Pascal</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Blaise Pascal: 1623 to 1662</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Clermont and Paris, France. Life span about 39 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="119.6" y="113.0" width="580.9" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="119.6" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1623</text>
<text x="700.4" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1662</text>
<line x1="372.8" y1="127.0" x2="372.8" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="372.8" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="368.8" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1640: essay on conics, age 16</text>
<line x1="402.6" y1="127.0" x2="402.6" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="402.6" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="406.6" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1642: builds the Pascaline</text>
<line x1="581.3" y1="127.0" x2="581.3" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="581.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="585.3" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1654: arithmetic triangle; probability</text>
</svg>
