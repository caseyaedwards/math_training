<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Srinivasa Ramanujan</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Srinivasa Ramanujan: 1887 to 1920</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Madras, India; Cambridge, England. Life span about 33 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="128.3" y="113.0" width="563.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="128.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1887</text>
<text x="691.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1920</text>
<line x1="572.2" y1="127.0" x2="572.2" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="572.2" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="576.2" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1913: letter to G. H. Hardy</text>
<line x1="589.3" y1="127.0" x2="589.3" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="589.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="593.3" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1914: arrives in Cambridge</text>
<line x1="657.6" y1="127.0" x2="657.6" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="657.6" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="661.6" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1918: Fellow of the Royal Society</text>
<line x1="691.7" y1="127.0" x2="691.7" y2="238.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="691.7" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="695.7" y="250.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1920: dies in India, age 32</text>
</svg>
