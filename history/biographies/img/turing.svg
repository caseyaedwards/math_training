<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of Alan Turing</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Alan Turing: 1912 to 1954</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: London, Cambridge, Bletchley, Manchester. Life span about 42 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="116.0" y="113.0" width="588.0" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="116.0" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1912</text>
<text x="704.0" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1954</text>
<line x1="452.0" y1="127.0" x2="452.0" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="452.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="456.0" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1936: On Computable Numbers</text>
<line x1="508.0" y1="127.0" x2="508.0" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="508.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="512.0" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1940: Bletchley Park: breaking Enigma</text>
<line x1="648.0" y1="127.0" x2="648.0" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="648.0" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="652.0" y="160.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1950: the imitation game</text>
</svg>
