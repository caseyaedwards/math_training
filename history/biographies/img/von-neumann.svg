<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img">
<title>Life timeline of John von Neumann</title>
<rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
<text x="410.0" y="28.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">John von Neumann: 1903 to 1957</text>
<text x="410.0" y="50.0" text-anchor="middle" font-size="13" fill="#868e96" font-weight="normal">Lived in: Budapest; Princeton, USA. Life span about 54 years.</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#868e96" stroke-width="1.5"/>
<rect x="108.3" y="113.0" width="603.4" height="14.0" rx="7" fill="#d9480f" stroke="#222222" stroke-width="1" fill-opacity="0.35"/>
<text x="108.3" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">born 1903</text>
<text x="711.7" y="104.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">died 1957</text>
<line x1="387.7" y1="127.0" x2="387.7" y2="148.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="387.7" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="383.7" y="160.0" text-anchor="start" font-size="13" fill="#222222" font-weight="normal">1928: minimax theorem (game theory)</text>
<line x1="432.3" y1="127.0" x2="432.3" y2="178.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="432.3" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="436.3" y="190.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1932: math of quantum mechanics</text>
<line x1="577.6" y1="127.0" x2="577.6" y2="208.0" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="577.6" cy="120.0" r="5.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="581.6" y="220.0" text-anchor="end" font-size="13" fill="#222222" font-weight="normal">1945: EDVAC report: stored program</text>
</svg>
