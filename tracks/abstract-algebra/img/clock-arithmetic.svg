<text x="85.0" y="189.5" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">9</text>
<circle cx="100.4" cy="127.5" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="100.4" y="132.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">10</text>
<circle cx="142.5" cy="85.4" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="142.5" y="89.9" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">11</text>
<path d="M118.0,185.0 L118.2,179.6 L118.7,174.3 L119.6,169.0 L120.8,163.8 L122.4,158.6 L124.2,153.6 L126.5,148.7 L129.0,144.0 L131.8,139.4 L134.9,135.1 L138.3,130.9 L142.0,127.0 L145.9,123.3 L150.1,119.9 L154.4,116.8 L159.0,114.0 L163.7,111.5 L168.6,109.2 L173.6,107.4 L178.8,105.8 L184.0,104.6 L189.3,103.7 L194.6,103.2 L200.0,103.0 L205.4,103.2 L210.7,103.7 L216.0,104.6 L221.2,105.8 L226.4,107.4 L231.4,109.2 L236.3,111.5 L241.0,114.0 L245.6,116.8 L249.9,119.9 L254.1,123.3 L258.0,127.0 L261.7,130.9 L265.1,135.1 L268.2,139.4 L271.0,144.0" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="200.0" y="190.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">+5</text>
<text x="350.0" y="120.0" text-anchor="start" fill="#222222" font-size="13">Start at 9.</text>
<text x="350.0" y="142.0" text-anchor="start" fill="#222222" font-size="13">Move 5 hours forward.</text>
<text x="350.0" y="164.0" text-anchor="start" fill="#222222" font-size="13">Land on 2.</text>
<text x="350.0" y="200.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">9 + 5 = 14 = 12 + 2</text>
<text x="350.0" y="222.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">14 mod 12 = 2</text>
<text x="280.0" y="330.0" text-anchor="middle" fill="#666666" font-size="12">Same idea: hash(key) mod n picks a bucket. Ring buffers wrap the same way.</text>
</svg>
