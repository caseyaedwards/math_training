<text x="257.5" y="89.9" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">1</text>
<circle cx="299.6" cy="127.5" r="13.0" fill="#d9480f" fill-opacity="0.3" stroke="#222222" stroke-width="1.5"/>
<text x="299.6" y="132.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">2</text>
<circle cx="315.0" cy="185.0" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="315.0" y="189.5" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">3</text>
<circle cx="299.6" cy="242.5" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="299.6" y="247.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">4</text>
<circle cx="257.5" cy="284.6" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="257.5" y="289.1" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">5</text>
<circle cx="200.0" cy="300.0" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="304.5" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">6</text>
<circle cx="142.5" cy="284.6" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="142.5" y="289.1" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">7</text>
<circle cx="100.4" cy="242.5" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="100.4" y="247.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">8</text>
