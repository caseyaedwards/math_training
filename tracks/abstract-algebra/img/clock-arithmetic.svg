<rect x="0" y="0" width="560" height="340" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Clock Arithmetic: 9 + 5 = 2 (mod 12)</text>
