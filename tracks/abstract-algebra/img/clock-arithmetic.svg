<circle cx="200.0" cy="70.0" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="74.5" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">12</text>
