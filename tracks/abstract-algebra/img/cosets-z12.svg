<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="620" height="280" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The subgroup 0, 4, 8 and its cosets split Z/12 into four equal blocks</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="620" height="280" fill="#ffffff"/>
<text x="310.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Lagrange: Cosets Tile the Group</text>
<rect x="30.0" y="70.0" width="130.0" height="120.0" rx="8" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2"/>
<text x="95.0" y="60.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">H = {0, 4, 8}</text>
<circle cx="60.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="60.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0</text>
<circle cx="95.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="95.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<circle cx="130.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="130.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">8</text>
<rect x="175.0" y="70.0" width="130.0" height="120.0" rx="8" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="240.0" y="60.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1 + H</text>
<circle cx="205.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="205.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<circle cx="240.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="240.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">5</text>
<circle cx="275.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="275.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">9</text>
<rect x="320.0" y="70.0" width="130.0" height="120.0" rx="8" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="385.0" y="60.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2 + H</text>
<circle cx="350.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="350.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<circle cx="385.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="385.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">6</text>
<circle cx="420.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="420.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">10</text>
<rect x="465.0" y="70.0" width="130.0" height="120.0" rx="8" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="530.0" y="60.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3 + H</text>
<circle cx="495.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="495.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
<circle cx="530.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="530.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">7</text>
<circle cx="565.0" cy="130.0" r="15.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="565.0" y="135.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">11</text>
<text x="310.0" y="225.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">12 elements = 4 cosets x 3 elements each.  |H| divides |G|.</text>
<text x="310.0" y="248.0" text-anchor="middle" fill="#666666" font-size="12">That is why a group of 12 elements has no subgroup of 5.</text>
</svg>
