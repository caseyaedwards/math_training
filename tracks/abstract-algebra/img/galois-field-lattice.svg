<text x="187.0" y="108.5" text-anchor="middle" fill="#666666" font-size="12">2</text>
<line x1="280.0" y1="78.0" x2="280.0" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<line x1="280.0" y1="183.0" x2="280.0" y2="252.0" stroke="#222222" stroke-width="1.5"/>
<text x="292.0" y="217.5" text-anchor="middle" fill="#666666" font-size="12">2</text>
<text x="292.0" y="112.5" text-anchor="middle" fill="#666666" font-size="12">2</text>
<line x1="280.0" y1="78.0" x2="430.0" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<line x1="430.0" y1="183.0" x2="280.0" y2="252.0" stroke="#222222" stroke-width="1.5"/>
