<text x="280.0" y="65.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">Q(√2, √3)</text>
<rect x="85.0" y="148.0" width="90.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="130.0" y="170.0" text-anchor="middle" fill="#222222" font-size="14">Q(√2)</text>
<rect x="235.0" y="148.0" width="90.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="170.0" text-anchor="middle" fill="#222222" font-size="14">Q(√6)</text>
<rect x="385.0" y="148.0" width="90.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="430.0" y="170.0" text-anchor="middle" fill="#222222" font-size="14">Q(√3)</text>
<rect x="250.0" y="253.0" width="60.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="275.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">Q</text>
<text x="480.0" y="60.0" text-anchor="start" fill="#666666" font-size="12">degree 4</text>
<text x="280.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">Symmetries: flip √2 ↔ -√2, flip √3 ↔ -√3, or both. 4 symmetries, 3 middle fields.</text>
