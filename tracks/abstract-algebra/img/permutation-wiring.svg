<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A permutation drawn as wires from top row to bottom row</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="290" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A Permutation Is a Rewiring</text>
<line x1="80.0" y1="82.0" x2="300.0" y2="198.0" stroke="#d9480f" stroke-width="2.2" marker-end="url(#aha)"/>
<circle cx="80.0" cy="65.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="80.0" y="70.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<circle cx="80.0" cy="215.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="80.0" y="220.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<line x1="190.0" y1="82.0" x2="80.0" y2="198.0" stroke="#d9480f" stroke-width="2.2" marker-end="url(#aha)"/>
<circle cx="190.0" cy="65.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="190.0" y="70.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<circle cx="190.0" cy="215.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="190.0" y="220.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<line x1="300.0" y1="82.0" x2="190.0" y2="198.0" stroke="#d9480f" stroke-width="2.2" marker-end="url(#aha)"/>
<circle cx="300.0" cy="65.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="300.0" y="70.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
<circle cx="300.0" cy="215.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="300.0" y="220.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
<line x1="410.0" y1="82.0" x2="410.0" y2="198.0" stroke="#868e96" stroke-width="2.2" marker-end="url(#ahg)"/>
<circle cx="410.0" cy="65.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="410.0" y="70.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<circle cx="410.0" cy="215.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="410.0" y="220.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<text x="500.0" y="70.0" text-anchor="start" fill="#666666" font-size="12">before</text>
<text x="500.0" y="220.0" text-anchor="start" fill="#666666" font-size="12">after</text>
<text x="280.0" y="262.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">two-line form: 1→3, 2→1, 3→2, 4→4.   cycle form: (1 3 2)(4)</text>
<text x="280.0" y="282.0" text-anchor="middle" fill="#666666" font-size="12">There are 4! = 24 permutations of 4 things: the symmetric group S4.</text>
</svg>
