<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="560" height="350" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Powers of 3 modulo 7 cycle through all nonzero residues</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="350" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Finite Field GF(7): Powers of 3 Visit Everything</text>
<circle cx="200.0" cy="190.0" r="110.0" fill="none" stroke="#cccccc" stroke-width="2"/>
<line x1="217.3" y1="90.0" x2="276.2" y2="124.0" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<line x1="295.3" y1="155.0" x2="295.3" y2="223.0" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<line x1="277.9" y1="255.0" x2="219.1" y2="289.0" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<line x1="182.7" y1="290.0" x2="123.8" y2="256.0" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<line x1="104.7" y1="225.0" x2="104.7" y2="157.0" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<line x1="122.1" y1="125.0" x2="180.9" y2="91.0" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<circle cx="200.0" cy="80.0" r="19.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="200.0" y="85.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
<text x="200.0" y="46.0" text-anchor="middle" fill="#666666" font-size="11">3^1</text>
<circle cx="295.3" cy="135.0" r="19.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="295.3" y="140.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<text x="328.2" y="120.0" text-anchor="middle" fill="#666666" font-size="11">3^2</text>
<circle cx="295.3" cy="245.0" r="19.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="295.3" y="250.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">6</text>
<text x="328.2" y="268.0" text-anchor="middle" fill="#666666" font-size="11">3^3</text>
<circle cx="200.0" cy="300.0" r="19.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="200.0" y="305.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<text x="200.0" y="342.0" text-anchor="middle" fill="#666666" font-size="11">3^4</text>
<circle cx="104.7" cy="245.0" r="19.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="104.7" y="250.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">5</text>
<text x="71.8" y="268.0" text-anchor="middle" fill="#666666" font-size="11">3^5</text>
<circle cx="104.7" cy="135.0" r="19.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="104.7" y="140.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<text x="71.8" y="120.0" text-anchor="middle" fill="#666666" font-size="11">3^6</text>
<text x="200.0" y="195.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">× 3</text>
<text x="360.0" y="120.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">3, 2, 6, 4, 5, 1, then repeat.</text>
<text x="360.0" y="145.0" text-anchor="start" fill="#222222" font-size="13">3 is a generator of the</text>
<text x="360.0" y="165.0" text-anchor="start" fill="#222222" font-size="13">6 nonzero elements.</text>
<text x="360.0" y="200.0" text-anchor="start" fill="#666666" font-size="12">Diffie-Hellman uses this</text>
<text x="360.0" y="218.0" text-anchor="start" fill="#666666" font-size="12">with a prime of 2,048 bits:</text>
<text x="360.0" y="236.0" text-anchor="start" fill="#666666" font-size="12">easy to compute 3^k,</text>
<text x="360.0" y="254.0" text-anchor="start" fill="#666666" font-size="12">hard to recover k.</text>
</svg>
