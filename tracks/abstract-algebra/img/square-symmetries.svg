<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The eight symmetries of a square: four rotations and four reflections</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A Square Has 8 Symmetries</text>
<polygon points="85.0,90.0 255.0,90.0 255.0,260.0 85.0,260.0" fill="#f1f3f5" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<text x="71.0" y="82.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">A</text>
<text x="269.0" y="82.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">B</text>
<text x="269.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">C</text>
<text x="71.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">D</text>
<line x1="170.0" y1="50.0" x2="170.0" y2="300.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="45.0" y1="175.0" x2="295.0" y2="175.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="55.0" y1="60.0" x2="285.0" y2="290.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="55.0" y1="290.0" x2="285.0" y2="60.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
<path d="M209.4,181.9 L209.8,179.2 L210.0,176.4 L210.0,173.6 L209.8,170.8 L209.4,168.1 L208.8,165.3 L208.0,162.6 L207.1,160.0 L206.0,157.5 L204.6,155.0 L203.2,152.6 L201.5,150.4 L199.7,148.2 L197.8,146.2 L195.7,144.4 L193.5,142.6 L191.2,141.1 L188.8,139.7 L186.3,138.5 L183.7,137.4 L181.0,136.5" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="200.0" y="197.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">90°</text>
<text x="330.0" y="110.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">4 rotations: 0°, 90°, 180°, 270°</text>
<text x="330.0" y="135.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">4 flips: across the dashed lines</text>
<text x="330.0" y="175.0" text-anchor="start" fill="#222222" font-size="13">Do two symmetries in a row:</text>
<text x="330.0" y="195.0" text-anchor="start" fill="#222222" font-size="13">the result is again a symmetry.</text>
<text x="330.0" y="215.0" text-anchor="start" fill="#222222" font-size="13">That closure is the first</text>
<text x="330.0" y="235.0" text-anchor="start" fill="#222222" font-size="13">hint of a group.</text>
</svg>
