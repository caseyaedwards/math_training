<text x="300.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Closure:</text>
<text x="300.0" y="108.0" text-anchor="start" fill="#666666" font-size="12">every entry is in {0,1,2,3}</text>
<text x="300.0" y="128.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Identity:</text>
<text x="300.0" y="146.0" text-anchor="start" fill="#666666" font-size="12">0 changes nothing (first row)</text>
<text x="300.0" y="166.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Inverses:</text>
<text x="300.0" y="184.0" text-anchor="start" fill="#666666" font-size="12">every row has a 0 (orange)</text>
<text x="300.0" y="204.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Associative:</text>
<text x="300.0" y="222.0" text-anchor="start" fill="#666666" font-size="12">(a+b)+c = a+(b+c)</text>
<text x="300.0" y="242.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Bonus:</text>
<text x="300.0" y="260.0" text-anchor="start" fill="#666666" font-size="12">symmetric table = commutative</text>
