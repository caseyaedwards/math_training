<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A variable as a box and an expression as a recipe</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="230" fill="#ffffff"/>
<text x="360.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">x is a named box; 3x + 5 is a recipe</text>
<text x="85.0" y="66.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold" font-style="italic">x</text>
<rect x="45.0" y="76.0" width="80.0" height="64.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2.5" rx="6"/>
<text x="85.0" y="119.0" text-anchor="middle" font-size="28" fill="#222222" font-weight="bold">4</text>
<text x="85.0" y="164.0" text-anchor="middle" font-size="13" fill="#555555">box named x</text>
<text x="85.0" y="182.0" text-anchor="middle" font-size="13" fill="#555555">holds 4</text>
<line x1="130.0" y1="108.0" x2="186.0" y2="108.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<rect x="190.0" y="86.0" width="90.0" height="44.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="10"/>
<text x="235.0" y="114.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">× 3</text>
<line x1="284.0" y1="108.0" x2="330.0" y2="108.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<text x="357.0" y="115.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold">12</text>
<line x1="384.0" y1="108.0" x2="430.0" y2="108.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<rect x="434.0" y="86.0" width="90.0" height="44.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="10"/>
<text x="479.0" y="114.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">+ 5</text>
<line x1="528.0" y1="108.0" x2="574.0" y2="108.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
<text x="607.0" y="116.0" text-anchor="middle" font-size="24" fill="#d9480f" font-weight="bold">17</text>
<text x="380.0" y="200.0" text-anchor="middle" font-size="15" fill="#222222">3x + 5 with x = 4:   3 · 4 + 5 = 12 + 5 = 17</text>
</svg>
