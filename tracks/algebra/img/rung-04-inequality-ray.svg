<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Solution of -2x &lt; 6 as a ray</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
<text x="320.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">−2x &lt; 6 means x &gt; −3</text>
<line x1="36.0" y1="120.0" x2="604.0" y2="120.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)" marker-start="url(#ad)"/>
<line x1="50.0" y1="115.0" x2="50.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="50.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">−6</text>
<line x1="95.0" y1="115.0" x2="95.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="95.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">−5</text>
<line x1="140.0" y1="115.0" x2="140.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="140.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">−4</text>
<line x1="185.0" y1="115.0" x2="185.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="185.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">−3</text>
<line x1="230.0" y1="115.0" x2="230.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="230.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">−2</text>
<line x1="275.0" y1="115.0" x2="275.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="275.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">−1</text>
<line x1="320.0" y1="115.0" x2="320.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="320.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">0</text>
<line x1="365.0" y1="115.0" x2="365.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="365.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">1</text>
<line x1="410.0" y1="115.0" x2="410.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="410.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">2</text>
<line x1="455.0" y1="115.0" x2="455.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="455.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">3</text>
<line x1="500.0" y1="115.0" x2="500.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="500.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">4</text>
<line x1="545.0" y1="115.0" x2="545.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="545.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">5</text>
<line x1="590.0" y1="115.0" x2="590.0" y2="125.0" stroke="#555555" stroke-width="1.2"/>
<text x="590.0" y="140.0" text-anchor="middle" font-size="12" fill="#222222">6</text>
<line x1="192.0" y1="120.0" x2="576.5" y2="120.0" stroke="#d9480f" stroke-width="5"/>
<polygon points="572.0,110.0 606.0,120.0 572.0,130.0" fill="#d9480f"/>
<circle cx="185.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<text x="185.0" y="98.0" text-anchor="middle" font-size="13" fill="#d9480f">open circle: −3 itself fails</text>
<text x="410.0" y="92.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">every x to the right works</text>
<text x="40.0" y="182.0" text-anchor="start" font-size="14" fill="#222222">Test x = 0:   −2 · 0 = 0, and 0 &lt; 6 is true.</text>
<text x="40.0" y="206.0" text-anchor="start" font-size="14" fill="#222222">Test x = −4:  −2 · (−4) = 8, and 8 &lt; 6 is false.</text>
<text x="40.0" y="230.0" text-anchor="start" font-size="14" fill="#222222">Test x = −3:  −2 · (−3) = 6, and 6 &lt; 6 is false.</text>
</svg>
