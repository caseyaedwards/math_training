<line x1="108.0" y1="192.0" x2="252.0" y2="192.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
<line x1="108.0" y1="238.0" x2="252.0" y2="238.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
<text x="90.0" y="300.0" text-anchor="middle" font-size="13" fill="#555555">inputs</text>
<text x="270.0" y="300.0" text-anchor="middle" font-size="13" fill="#555555">outputs</text>
<ellipse cx="450.0" cy="151.0" rx="44.0" ry="62.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5"/>
<text x="450.0" y="130.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">2</text>
<text x="450.0" y="176.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">3</text>
<ellipse cx="620.0" cy="151.0" rx="44.0" ry="85.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5"/>
<text x="620.0" y="107.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">5</text>
<text x="620.0" y="153.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">6</text>
