<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A function maps each input to one output</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="320" fill="#ffffff"/>
<text x="180.0" y="30.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">Function: f(x) = 2x + 1</text>
<text x="520.0" y="30.0" text-anchor="middle" font-size="15" fill="#555555" font-weight="bold">Not a function</text>
