<text x="90.0" y="243.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">4</text>
<ellipse cx="270.0" cy="172.0" rx="44.0" ry="108.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5"/>
<text x="270.0" y="105.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">3</text>
<text x="270.0" y="151.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">5</text>
<text x="270.0" y="197.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">7</text>
<text x="270.0" y="243.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">9</text>
<line x1="108.0" y1="100.0" x2="252.0" y2="100.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
