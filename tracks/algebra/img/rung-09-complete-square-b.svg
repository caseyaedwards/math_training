<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Completing the square for x^2 + 6x</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="380" fill="#ffffff"/>
<text x="310.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>Completing the square: x</tspan><tspan dy="-6.1" font-size="11.5">2</tspan><tspan dy="6.1"> + 6x + 9 = (x + 3)</tspan><tspan dy="-6.1" font-size="11.5">2</tspan></text>
<rect x="110.0" y="80.0" width="170.0" height="170.0" fill="#f6d5c4" stroke="#222222" stroke-width="2"/>
<text x="195.0" y="172.0" text-anchor="middle" font-size="20" fill="#222222" font-weight="bold"><tspan>x</tspan><tspan dy="-7.6" font-size="14.4">2</tspan></text>
<rect x="280.0" y="80.0" width="66.0" height="170.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="313.0" y="170.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">3x</text>
<rect x="110.0" y="250.0" width="170.0" height="66.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="195.0" y="288.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">3x</text>
<rect x="280.0" y="250.0" width="66.0" height="66.0" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="313.0" y="288.0" text-anchor="middle" font-size="18" fill="#d9480f" font-weight="bold">9</text>
<text x="195.0" y="68.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold" font-style="italic">x</text>
<text x="313.0" y="68.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">3</text>
<text x="98.0" y="170.0" text-anchor="end" font-size="16" fill="#222222" font-weight="bold" font-style="italic">x</text>
<text x="98.0" y="288.0" text-anchor="end" font-size="16" fill="#222222" font-weight="bold">3</text>
<text x="400.0" y="110.0" text-anchor="start" font-size="14" fill="#222222">Split 6x into two</text>
<text x="400.0" y="130.0" text-anchor="start" font-size="14" fill="#222222">strips of 3x.</text>
<text x="400.0" y="170.0" text-anchor="start" font-size="14" fill="#d9480f">The corner is missing</text>
<text x="400.0" y="190.0" text-anchor="start" font-size="14" fill="#d9480f">a 3 by 3 square = 9.</text>
<text x="400.0" y="230.0" text-anchor="start" font-size="14" fill="#222222">Add 9 and the shape</text>
<text x="400.0" y="250.0" text-anchor="start" font-size="14" fill="#222222">is a full square with</text>
<text x="400.0" y="270.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">side x + 3.</text>
</svg>
