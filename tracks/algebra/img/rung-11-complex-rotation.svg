<text x="345.0" y="162.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">2 + i</text>
<text x="160.0" y="107.0" text-anchor="end" font-size="14" fill="#d9480f" font-weight="bold">−1 + 2i</text>
<text x="105.0" y="300.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">−2 − i</text>
<text x="290.0" y="355.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">1 − 2i</text>
<text x="440.0" y="130.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold">i(2 + i)</text>
<text x="440.0" y="156.0" text-anchor="start" font-size="15" fill="#222222"><tspan>= 2i + i</tspan><tspan dy="-5.7" font-size="10.8">2</tspan></text>
<text x="440.0" y="182.0" text-anchor="start" font-size="15" fill="#222222">= 2i − 1</text>
<text x="440.0" y="208.0" text-anchor="start" font-size="15" fill="#d9480f" font-weight="bold">= −1 + 2i</text>
<text x="440.0" y="260.0" text-anchor="start" font-size="15" fill="#555555">Four quarter turns</text>
<text x="440.0" y="286.0" text-anchor="start" font-size="15" fill="#555555">bring the point home:</text>
<text x="440.0" y="312.0" text-anchor="start" font-size="15" fill="#555555"><tspan>i</tspan><tspan dy="-5.7" font-size="10.8">4</tspan><tspan dy="5.7"> = 1.</tspan></text>
</svg>
