<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Powers of i on the unit circle</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
<text x="280.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>i</tspan><tspan dy="-6.1" font-size="11.5">2</tspan><tspan dy="6.1"> = −1: two quarter turns make a half turn</tspan></text>
<line x1="40.0" y1="210.0" x2="360.0" y2="210.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="200.0" y1="360.0" x2="200.0" y2="50.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<circle cx="200.0" cy="210.0" r="120.0" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
<path d="M265.6,203.1 A66.0,66.0 0 0 0 206.9,144.4" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aa)"/>
<path d="M193.1,144.4 A66.0,66.0 0 0 0 134.4,203.1" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aa)"/>
<circle cx="320.0" cy="210.0" r="7.0" fill="#222222"/>
<text x="330.0" y="200.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold"><tspan>1 = i</tspan><tspan dy="-5.7" font-size="10.8">0</tspan></text>
<circle cx="200.0" cy="90.0" r="7.0" fill="#222222"/>
<text x="212.0" y="84.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold"><tspan>i = i</tspan><tspan dy="-5.7" font-size="10.8">1</tspan></text>
<circle cx="80.0" cy="210.0" r="7.0" fill="#d9480f"/>
<text x="70.0" y="200.0" text-anchor="end" font-size="15" fill="#d9480f" font-weight="bold"><tspan>−1 = i</tspan><tspan dy="-5.7" font-size="10.8">2</tspan></text>
<circle cx="200.0" cy="330.0" r="7.0" fill="#222222"/>
<text x="212.0" y="350.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold"><tspan>−i = i</tspan><tspan dy="-5.7" font-size="10.8">3</tspan></text>
<text x="252.0" y="158.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">× i</text>
<text x="148.0" y="158.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">× i</text>
<text x="440.0" y="160.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">1 × i × i</text>
<text x="440.0" y="186.0" text-anchor="middle" font-size="14" fill="#222222">= quarter + quarter</text>
<text x="440.0" y="212.0" text-anchor="middle" font-size="14" fill="#222222">= half turn</text>
<text x="440.0" y="238.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">= −1</text>
</svg>
