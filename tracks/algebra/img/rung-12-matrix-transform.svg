<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A matrix transforms the unit square</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">The matrix sends (1, 0) to (1, 1) and (0, 1) to (1, −1)</text>
<line x1="60.0" y1="350.0" x2="60.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="116.0" y1="350.0" x2="116.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="172.0" y1="350.0" x2="172.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="228.0" y1="350.0" x2="228.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="284.0" y1="350.0" x2="284.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="340.0" y1="350.0" x2="340.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="396.0" y1="350.0" x2="396.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="452.0" y1="350.0" x2="452.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="60.0" y1="350.0" x2="452.0" y2="350.0" stroke="#dddddd" stroke-width="1"/>
<line x1="60.0" y1="294.0" x2="452.0" y2="294.0" stroke="#dddddd" stroke-width="1"/>
<line x1="60.0" y1="238.0" x2="452.0" y2="238.0" stroke="#dddddd" stroke-width="1"/>
<line x1="60.0" y1="182.0" x2="452.0" y2="182.0" stroke="#dddddd" stroke-width="1"/>
<line x1="60.0" y1="126.0" x2="452.0" y2="126.0" stroke="#dddddd" stroke-width="1"/>
<line x1="60.0" y1="70.0" x2="452.0" y2="70.0" stroke="#dddddd" stroke-width="1"/>
<line x1="54.0" y1="238.0" x2="462.0" y2="238.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="116.0" y1="356.0" x2="116.0" y2="60.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="468.0" y="243.0" text-anchor="start" font-size="14" fill="#222222" font-style="italic">x</text>
<text x="116.0" y="54.0" text-anchor="middle" font-size="14" fill="#222222" font-style="italic">y</text>
<line x1="60.0" y1="235.0" x2="60.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="60.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">−1</text>
<line x1="172.0" y1="235.0" x2="172.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="172.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">1</text>
<line x1="228.0" y1="235.0" x2="228.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="228.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">2</text>
<line x1="284.0" y1="235.0" x2="284.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="284.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">3</text>
<line x1="340.0" y1="235.0" x2="340.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="340.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">4</text>
<line x1="396.0" y1="235.0" x2="396.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="396.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">5</text>
<line x1="452.0" y1="235.0" x2="452.0" y2="241.0" stroke="#555555" stroke-width="1"/>
<text x="452.0" y="255.0" text-anchor="middle" font-size="12" fill="#222222">6</text>
<line x1="113.0" y1="350.0" x2="119.0" y2="350.0" stroke="#555555" stroke-width="1"/>
<text x="109.0" y="354.0" text-anchor="end" font-size="12" fill="#222222">−2</text>
<line x1="113.0" y1="294.0" x2="119.0" y2="294.0" stroke="#555555" stroke-width="1"/>
<text x="109.0" y="298.0" text-anchor="end" font-size="12" fill="#222222">−1</text>
<line x1="113.0" y1="182.0" x2="119.0" y2="182.0" stroke="#555555" stroke-width="1"/>
<text x="109.0" y="186.0" text-anchor="end" font-size="12" fill="#222222">1</text>
<line x1="113.0" y1="126.0" x2="119.0" y2="126.0" stroke="#555555" stroke-width="1"/>
<text x="109.0" y="130.0" text-anchor="end" font-size="12" fill="#222222">2</text>
<line x1="113.0" y1="70.0" x2="119.0" y2="70.0" stroke="#555555" stroke-width="1"/>
<text x="109.0" y="74.0" text-anchor="end" font-size="12" fill="#222222">3</text>
<text x="109.0" y="255.0" text-anchor="end" font-size="12" fill="#222222">0</text>
<polygon points="116.0,238.0 172.0,238.0 172.0,182.0 116.0,182.0" fill="#f1f1f1" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="116.0,238.0 172.0,182.0 228.0,238.0 172.0,294.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="116.0,238.0 172.0,238.0 172.0,182.0 116.0,182.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<line x1="116.0" y1="238.0" x2="172.0" y2="182.0" stroke="#d9480f" stroke-width="3" marker-end="url(#aa)"/>
<line x1="116.0" y1="238.0" x2="172.0" y2="294.0" stroke="#d9480f" stroke-width="3" marker-end="url(#aa)"/>
<text x="180.0" y="174.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="bold">(1, 1)</text>
<text x="180.0" y="312.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="bold">(1, −1)</text>
<circle cx="284.0" cy="126.0" r="6.0" fill="#222222"/>
<circle cx="396.0" cy="182.0" r="7.0" fill="#d9480f"/>
<line x1="292.0" y1="129.0" x2="387.0" y2="178.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ad)"/>
<text x="284.0" y="114.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">(3, 2)</text>
<text x="396.0" y="206.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">(5, 1)</text>
<text x="500.0" y="110.0" text-anchor="start" font-size="14" fill="#555555">gray: unit square</text>
<text x="500.0" y="132.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">orange: its image</text>
<text x="500.0" y="180.0" text-anchor="start" font-size="14" fill="#222222">(x, y) → (x + y, x − y)</text>
<text x="500.0" y="220.0" text-anchor="start" font-size="14" fill="#222222">(3, 2) → (5, 1), so</text>
<text x="500.0" y="242.0" text-anchor="start" font-size="14" fill="#222222">x = 3, y = 2 solves</text>
<text x="500.0" y="264.0" text-anchor="start" font-size="14" fill="#222222">x + y = 5, x − y = 1.</text>
</svg>
