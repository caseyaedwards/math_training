<text x="410.0" y="110.0" text-anchor="start" font-size="13" fill="#222222">Every row</text>
<text x="410.0" y="128.0" text-anchor="start" font-size="13" fill="#222222">has one r0:</text>
<text x="410.0" y="146.0" text-anchor="start" font-size="13" fill="#222222">every move</text>
<text x="410.0" y="164.0" text-anchor="start" font-size="13" fill="#222222">has an</text>
<text x="410.0" y="182.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="bold">inverse.</text>
<text x="410.0" y="226.0" text-anchor="start" font-size="13" fill="#222222">r0 changes</text>
<text x="410.0" y="244.0" text-anchor="start" font-size="13" fill="#222222">nothing: it is</text>
<text x="410.0" y="262.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">the identity.</text>
<text x="260.0" y="350.0" text-anchor="middle" font-size="14" fill="#222222">Example: r90 then r270 = 360° = r0.</text>
