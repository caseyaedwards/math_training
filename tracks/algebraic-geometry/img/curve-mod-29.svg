<text x="68.0" y="391.5" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">1G</text>
<circle cx="335.0" cy="285.0" r="6" fill="#d9480f"/>
<text x="343.0" y="279.0" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">2G</text>
<circle cx="397.5" cy="247.5" r="6" fill="#d9480f"/>
<text x="405.5" y="241.5" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">3G</text>
<circle cx="172.5" cy="110.0" r="6" fill="#d9480f"/>
<text x="164.5" y="104.0" text-anchor="end" fill="#d9480f" font-size="12" font-weight="bold">4G</text>
<circle cx="235.0" cy="185.0" r="6" fill="#d9480f"/>
<text x="243.0" y="179.0" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">5G</text>
<circle cx="197.5" cy="97.5" r="6" fill="#d9480f"/>
<text x="205.5" y="91.5" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">6G</text>
<text x="460.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">36 dots + 1 point at infinity</text>
<text x="460.0" y="108.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">= 37 points in all</text>
<text x="460.0" y="140.0" text-anchor="start" fill="#222222" font-size="13">Hasse: |37 − (29 + 1)| = 7</text>
<text x="460.0" y="158.0" text-anchor="start" fill="#222222" font-size="13">is at most 2√29 = 10.77</text>
<text x="460.0" y="198.0" text-anchor="start" fill="#d9480f" font-size="13">Orange: G = (0, 1) and its</text>
<text x="460.0" y="216.0" text-anchor="start" fill="#d9480f" font-size="13">multiples 2G, 3G, ..., 6G.</text>
<text x="460.0" y="234.0" text-anchor="start" fill="#555555" font-size="13">They jump around with no pattern.</text>
<text x="460.0" y="274.0" text-anchor="start" fill="#222222" font-size="13">Computing kG from k: fast</text>
<text x="460.0" y="292.0" text-anchor="start" fill="#555555" font-size="13">(double and add).</text>
<text x="460.0" y="316.0" text-anchor="start" fill="#222222" font-size="13">Recovering k from kG: slow</text>
<text x="460.0" y="334.0" text-anchor="start" fill="#555555" font-size="13">(no shortcut known).</text>
<text x="460.0" y="374.0" text-anchor="start" fill="#555555" font-size="13">That gap protects every</text>
<text x="460.0" y="392.0" text-anchor="start" fill="#555555" font-size="13">ECDHE handshake in TLS.</text>
<text x="235.0" y="454.0" text-anchor="middle" fill="#555555" font-size="13" font-style="italic">x</text>
</svg>
