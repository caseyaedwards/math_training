<text x="379.0" y="194.0" text-anchor="end" fill="#d9480f" font-size="12">y = 0.5</text>
<text x="379.0" y="144.0" text-anchor="end" fill="#222222" font-size="12">y = 1</text>
<text x="379.0" y="94.0" text-anchor="end" fill="#868e96" font-size="12">y = 1.5</text>
<text x="410.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">x² + y² = 1 and a horizontal line y = c:</text>
<text x="410.0" y="125.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">c = 0.5: x = ±0.866</text>
<text x="410.0" y="143.0" text-anchor="start" fill="#555555" font-size="13">two points</text>
<text x="410.0" y="178.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">c = 1: x² = 0, so x = 0 twice</text>
<text x="410.0" y="196.0" text-anchor="start" fill="#555555" font-size="13">one tangent point, counted 2 times</text>
<text x="410.0" y="231.0" text-anchor="start" fill="#868e96" font-size="13" font-weight="bold">c = 1.5: x² = −1.25</text>
<text x="410.0" y="249.0" text-anchor="start" fill="#555555" font-size="13">no real points, two complex ones:</text>
<text x="410.0" y="267.0" text-anchor="start" fill="#555555" font-size="13">x = ±1.118i</text>
<text x="410.0" y="307.0" text-anchor="start" fill="#555555" font-size="13">Count complex points and</text>
<text x="410.0" y="325.0" text-anchor="start" fill="#555555" font-size="13">multiplicity: always 2 = 2 × 1.</text>
</svg>
