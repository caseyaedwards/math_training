<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The Projective Plane Adds Points at Infinity</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<text x="400.0" y="28.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">The Projective Plane Adds Points at Infinity</text>
<line x1="30.0" y1="110.0" x2="370.0" y2="110.0" stroke="#868e96" stroke-width="1.4"/>
<text x="40.0" y="102.0" text-anchor="start" fill="#555555" font-size="12">horizon</text>
<line x1="90.0" y1="340.0" x2="200.0" y2="110.0" stroke="#222222" stroke-width="2.4"/>
<line x1="310.0" y1="340.0" x2="200.0" y2="110.0" stroke="#222222" stroke-width="2.4"/>
<line x1="62.5" y1="340.0" x2="337.5" y2="340.0" stroke="#868e96" stroke-width="2"/>
<line x1="94.2" y1="286.9" x2="305.8" y2="286.9" stroke="#868e96" stroke-width="2"/>
<line x1="121.4" y1="241.4" x2="278.6" y2="241.4" stroke="#868e96" stroke-width="2"/>
<line x1="142.7" y1="205.8" x2="257.3" y2="205.8" stroke="#868e96" stroke-width="2"/>
<line x1="159.6" y1="177.6" x2="240.4" y2="177.6" stroke="#868e96" stroke-width="2"/>
<line x1="172.5" y1="156.0" x2="227.5" y2="156.0" stroke="#868e96" stroke-width="2"/>
<line x1="182.8" y1="138.8" x2="217.2" y2="138.8" stroke="#868e96" stroke-width="2"/>
<circle cx="200.0" cy="110.0" r="6" fill="#d9480f"/>
<text x="200.0" y="96.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">rails meet here</text>
<text x="200.0" y="372.0" text-anchor="middle" fill="#555555" font-size="13">parallel lines meet at a point at infinity</text>
<path d="M389.2,166.8 L643.8,212.2 L790.8,133.5 L536.2,88.1 Z" fill="#f1f3f5" stroke="#868e96" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="590.0" cy="250.0" r="5" fill="#222222"/>
<text x="580.0" y="266.0" text-anchor="end" fill="#555555" font-size="12">origin</text>
<line x1="590.0" y1="250.0" x2="649.8" y2="148.5" stroke="#222222" stroke-width="1.8"/>
<circle cx="631.2" cy="180.0" r="5" fill="#d9480f"/>
<line x1="590.0" y1="250.0" x2="535.8" y2="68.4" stroke="#222222" stroke-width="1.8"/>
<circle cx="552.6" cy="124.7" r="5" fill="#d9480f"/>
<line x1="491.8" y1="198.8" x2="688.2" y2="301.2" stroke="#d9480f" stroke-width="2.2" stroke-dasharray="7,4"/>
<text x="694.2" y="305.2" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">a point at infinity</text>
<text x="393.2" y="184.8" text-anchor="start" fill="#555555" font-size="12">plane z = 1</text>
<text x="600.0" y="340.0" text-anchor="middle" fill="#555555" font-size="13">A point is a line through the origin.</text>
<text x="600.0" y="358.0" text-anchor="middle" fill="#555555" font-size="13">[x : y : 1] are ordinary points (x, y).</text>
<text x="600.0" y="376.0" text-anchor="middle" fill="#d9480f" font-size="13">[x : y : 0] are the points at infinity.</text>
</svg>
