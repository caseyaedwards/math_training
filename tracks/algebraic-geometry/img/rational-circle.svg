<text x="257.6" y="116.7" text-anchor="end" fill="#d9480f" font-size="12" font-weight="bold">(5/13, 12/13)</text>
<circle cx="106.7" cy="231.3" r="6" fill="#222222"/>
<text x="98.7" y="249.3" text-anchor="end" fill="#222222" font-size="12" font-weight="bold">(−1, 0)</text>
<text x="420.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Line of slope t through (−1, 0)</text>
<text x="420.0" y="110.0" text-anchor="start" fill="#222222" font-size="13">meets x² + y² = 1 again at</text>
<text x="420.0" y="140.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">x = (1 − t²) / (1 + t²)</text>
<text x="420.0" y="160.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">y = 2t / (1 + t²)</text>
<text x="420.0" y="200.0" text-anchor="start" fill="#222222" font-size="13">t = 1/2 gives (3/5, 4/5).</text>
<text x="420.0" y="218.0" text-anchor="start" fill="#222222" font-size="13">Clear denominators: 3² + 4² = 5².</text>
<text x="420.0" y="248.0" text-anchor="start" fill="#222222" font-size="13">t = 2/3 gives (5/13, 12/13):</text>
<text x="420.0" y="266.0" text-anchor="start" fill="#222222" font-size="13">5² + 12² = 13².</text>
<text x="420.0" y="306.0" text-anchor="start" fill="#555555" font-size="13">Every fraction t gives a</text>
<text x="420.0" y="324.0" text-anchor="start" fill="#555555" font-size="13">Pythagorean triple, and every</text>
<text x="420.0" y="342.0" text-anchor="start" fill="#555555" font-size="13">triple comes from some t.</text>
</svg>
