<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Simplices: The Building Blocks</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
<text x="400.0" y="28.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Simplices: The Building Blocks</text>
<circle cx="90.0" cy="150.0" r="6" fill="#222222"/>
<text x="90.0" y="225.0" text-anchor="middle" fill="#222222" font-weight="bold">0-simplex</text>
<text x="90.0" y="245.0" text-anchor="middle" fill="#555555" font-size="13">a point</text>
<line x1="190.0" y1="190.0" x2="290.0" y2="110.0" stroke="#222222" stroke-width="2.4"/>
<circle cx="190.0" cy="190.0" r="5" fill="#222222"/>
<circle cx="290.0" cy="110.0" r="5" fill="#222222"/>
<text x="240.0" y="225.0" text-anchor="middle" fill="#222222" font-weight="bold">1-simplex</text>
<text x="240.0" y="245.0" text-anchor="middle" fill="#555555" font-size="13">an edge</text>
<path d="M350.0,195.0 L470.0,195.0 L410.0,100.0 Z" fill="#fde4d6" stroke="#222222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350.0" cy="195.0" r="5" fill="#222222"/>
<circle cx="470.0" cy="195.0" r="5" fill="#222222"/>
<circle cx="410.0" cy="100.0" r="5" fill="#222222"/>
<text x="410.0" y="225.0" text-anchor="middle" fill="#222222" font-weight="bold">2-simplex</text>
<text x="410.0" y="245.0" text-anchor="middle" fill="#555555" font-size="13">a filled triangle</text>
<path d="M540.0,195.0 L660.0,195.0 L610.0,95.0 Z" fill="#fbe9df" stroke="#222222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="540.0" y1="195.0" x2="590.0" y2="165.0" stroke="#868e96" stroke-width="1.4" stroke-dasharray="4,3"/>
<line x1="660.0" y1="195.0" x2="590.0" y2="165.0" stroke="#868e96" stroke-width="1.4" stroke-dasharray="4,3"/>
<line x1="610.0" y1="95.0" x2="590.0" y2="165.0" stroke="#868e96" stroke-width="1.4" stroke-dasharray="4,3"/>
<circle cx="540.0" cy="195.0" r="5" fill="#222222"/>
<circle cx="660.0" cy="195.0" r="5" fill="#222222"/>
<circle cx="610.0" cy="95.0" r="5" fill="#222222"/>
<circle cx="590.0" cy="165.0" r="5" fill="#222222"/>
<text x="600.0" y="225.0" text-anchor="middle" fill="#222222" font-weight="bold">3-simplex</text>
<text x="600.0" y="245.0" text-anchor="middle" fill="#555555" font-size="13">a solid tetrahedron</text>
<text x="400.0" y="295.0" text-anchor="middle" fill="#555555" font-size="13">Glue simplices along shared faces to build any shape: a simplicial complex.</text>
<text x="400.0" y="317.0" text-anchor="middle" fill="#555555" font-size="13">A computer stores the shape as plain lists: vertices, edges, triangles.</text>
</svg>
