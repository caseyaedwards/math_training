<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Loops on a Sphere Shrink, Loops on a Torus Get Stuck</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
<text x="400.0" y="28.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Loops on a Sphere Shrink, Loops on a Torus Get Stuck</text>
<circle cx="170.0" cy="175.0" r="105.0" fill="none" stroke="#222222" stroke-width="2.2"/>
<ellipse cx="170.0" cy="175.0" rx="105.0" ry="24.0" fill="none" stroke="#cccccc" stroke-width="1.2"/>
<ellipse cx="188.0" cy="145.0" rx="70.0" ry="29.4" fill="none" stroke="#d9480f" stroke-width="2.4"/>
<ellipse cx="188.0" cy="145.0" rx="45.0" ry="18.9" fill="none" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5,4"/>
<ellipse cx="188.0" cy="145.0" rx="22.0" ry="9.2" fill="none" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5,4"/>
<circle cx="188.0" cy="145.0" r="4" fill="#d9480f"/>
<line x1="254.0" y1="145.0" x2="218.0" y2="145.0" stroke="#d9480f" stroke-width="1.6" marker-end="url(#aha)"/>
<text x="170.0" y="310.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">sphere: every loop slides to a point</text>
<text x="170.0" y="330.0" text-anchor="middle" fill="#555555" font-size="13">π₁ = 0 (only the trivial loop)</text>
<ellipse cx="560.0" cy="175.0" rx="200.0" ry="100.0" fill="none" stroke="#222222" stroke-width="2.4"/>
<path d="M476.0,170.0 Q560,220.0 644.0,170.0" fill="none" stroke="#222222" stroke-width="2.4"/>
<path d="M497.0,184.0 Q560,154.0 623.0,184.0" fill="none" stroke="#222222" stroke-width="2.4"/>
<ellipse cx="560.0" cy="177.0" rx="140.0" ry="62.0" fill="none" stroke="#d9480f" stroke-width="3"/>
<text x="560.0" y="107.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">b</text>
<path d="M720,135 Q698,175 720,215" fill="none" stroke="#222222" stroke-width="3"/>
<path d="M720,135 Q742,175 720,215" fill="none" stroke="#222222" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="694.0" y="181.0" text-anchor="end" fill="#222222" font-size="16" font-weight="bold">a</text>
<text x="560.0" y="310.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">torus: loop a and loop b never shrink</text>
<text x="560.0" y="330.0" text-anchor="middle" fill="#555555" font-size="13">π₁ = ℤ × ℤ (count laps of a and laps of b)</text>
</svg>
