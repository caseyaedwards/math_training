<text x="590.0" y="128.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">b</text>
<text x="400.0" y="345.0" text-anchor="middle" fill="#555555" font-size="13">Going around a then b ends where going around b then a ends: ab = ba.</text>
<text x="400.0" y="365.0" text-anchor="middle" fill="#555555" font-size="13">Each loop on the torus is a pair of whole numbers (laps of a, laps of b).</text>
