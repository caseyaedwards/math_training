<line x1="70.0" y1="212.0" x2="290.0" y2="212.0" stroke="#d9480f" stroke-width="3"/>
<line x1="147.0" y1="80.0" x2="147.0" y2="300.0" stroke="#222222" stroke-width="3"/>
<text x="300.0" y="217.0" text-anchor="start" fill="#d9480f" font-size="16" font-weight="bold">b</text>
