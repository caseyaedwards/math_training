<text x="328.0" y="70.0" text-anchor="middle" fill="#222222">3</text>
<text x="58.0" y="145.0" text-anchor="end" fill="#222222">10</text>
<text x="58.0" y="229.0" text-anchor="end" fill="#222222">4</text>
<text x="190.0" y="145.0" text-anchor="middle" fill="#222222" font-weight="bold">20 × 10 = 200</text>
<text x="328.0" y="145.0" text-anchor="middle" fill="#222222" font-weight="bold">30</text>
<text x="190.0" y="229.0" text-anchor="middle" fill="#222222" font-weight="bold">20 × 4 = 80</text>
<text x="328.0" y="229.0" text-anchor="middle" fill="#222222" font-weight="bold" font-size="12">12</text>
<text x="208.0" y="276.0" text-anchor="middle" fill="#555555" font-size="13">23 wide, 14 tall, drawn to scale: 1 small square = 1</text>
<text x="430.0" y="110.0" text-anchor="start" fill="#222222">Split each factor by place value:</text>
<text x="430.0" y="136.0" text-anchor="start" fill="#222222">23 = 20 + 3,   14 = 10 + 4</text>
<text x="430.0" y="162.0" text-anchor="start" fill="#222222"></text>
<text x="430.0" y="188.0" text-anchor="start" fill="#222222">Add the four rectangles:</text>
<text x="430.0" y="214.0" text-anchor="start" fill="#222222" font-weight="bold">200 + 30 + 80 + 12</text>
<text x="430.0" y="240.0" text-anchor="start" fill="#222222" font-weight="bold">= 322</text>
<text x="430.0" y="290.0" text-anchor="start" fill="#555555" font-size="13">Same idea as long multiplication,</text>
<text x="430.0" y="308.0" text-anchor="start" fill="#555555" font-size="13">and as (a + b)(c + d) in algebra.</text>
