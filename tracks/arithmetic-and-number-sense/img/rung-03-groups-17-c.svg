<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>17 mod 5 as a clock and as hash buckets</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
<text x="350.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">17 mod 5 = 2: clock view and bucket view</text>
<circle cx="170.0" cy="190.0" r="100.0" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="170.0" cy="90.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="170.0" y="95.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">0</text>
<circle cx="265.1" cy="159.1" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="265.1" y="164.1" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">1</text>
<circle cx="228.8" cy="270.9" r="17.0" fill="#d9480f" stroke="#d9480f" stroke-width="2"/>
<text x="228.8" y="275.9" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">2</text>
<circle cx="111.2" cy="270.9" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="111.2" y="275.9" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">3</text>
<circle cx="74.9" cy="159.1" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="74.9" y="164.1" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">4</text>
<text x="170.0" y="184.0" text-anchor="middle" font-size="13" fill="#222222">17 steps =</text>
<text x="170.0" y="202.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">3 laps + 2</text>
<text x="170.0" y="330.0" text-anchor="middle" font-size="13" fill="#555555">Start at 0 and step around 17 times.</text>
<rect x="330.0" y="90.0" width="58.0" height="190.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="359.0" y="80.0" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold">bucket 0</text>
<text x="359.0" y="118.0" text-anchor="middle" font-size="15" fill="#222222">0</text>
<text x="359.0" y="154.0" text-anchor="middle" font-size="15" fill="#222222">5</text>
<text x="359.0" y="190.0" text-anchor="middle" font-size="15" fill="#222222">10</text>
<text x="359.0" y="226.0" text-anchor="middle" font-size="15" fill="#222222">15</text>
<rect x="400.0" y="90.0" width="58.0" height="190.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="429.0" y="80.0" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold">bucket 1</text>
<text x="429.0" y="118.0" text-anchor="middle" font-size="15" fill="#222222">1</text>
<text x="429.0" y="154.0" text-anchor="middle" font-size="15" fill="#222222">6</text>
<text x="429.0" y="190.0" text-anchor="middle" font-size="15" fill="#222222">11</text>
<text x="429.0" y="226.0" text-anchor="middle" font-size="15" fill="#222222">16</text>
<rect x="470.0" y="90.0" width="58.0" height="190.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="499.0" y="80.0" text-anchor="middle" font-size="12" fill="#d9480f" font-weight="bold">bucket 2</text>
<text x="499.0" y="118.0" text-anchor="middle" font-size="15" fill="#222222">2</text>
<text x="499.0" y="154.0" text-anchor="middle" font-size="15" fill="#222222">7</text>
<text x="499.0" y="190.0" text-anchor="middle" font-size="15" fill="#222222">12</text>
<text x="499.0" y="226.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">17</text>
<rect x="540.0" y="90.0" width="58.0" height="190.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="569.0" y="80.0" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold">bucket 3</text>
<text x="569.0" y="118.0" text-anchor="middle" font-size="15" fill="#222222">3</text>
<text x="569.0" y="154.0" text-anchor="middle" font-size="15" fill="#222222">8</text>
<text x="569.0" y="190.0" text-anchor="middle" font-size="15" fill="#222222">13</text>
<rect x="610.0" y="90.0" width="58.0" height="190.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="639.0" y="80.0" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold">bucket 4</text>
<text x="639.0" y="118.0" text-anchor="middle" font-size="15" fill="#222222">4</text>
<text x="639.0" y="154.0" text-anchor="middle" font-size="15" fill="#222222">9</text>
<text x="639.0" y="190.0" text-anchor="middle" font-size="15" fill="#222222">14</text>
<text x="500.0" y="306.0" text-anchor="middle" font-size="13" fill="#555555">Number n goes to bucket n mod 5.</text>
<text x="500.0" y="330.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">17 lands in bucket 2.</text>
</svg>
