<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Expression tree for 2 + 3 × 4</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="660" height="360" fill="#ffffff"/>
<text x="170.0" y="30.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2 + 3 × 4 (agreed order)</text>
<text x="500.0" y="30.0" text-anchor="middle" font-size="15" fill="#555555" font-weight="bold">(2 + 3) × 4 (different tree)</text>
<line x1="157.7" y1="95.8" x2="112.3" y2="154.2" stroke="#222222" stroke-width="2"/>
<line x1="182.3" y1="95.8" x2="227.7" y2="154.2" stroke="#222222" stroke-width="2"/>
<line x1="231.1" y1="187.9" x2="203.9" y2="242.1" stroke="#222222" stroke-width="2"/>
<line x1="248.9" y1="187.9" x2="276.1" y2="242.1" stroke="#222222" stroke-width="2"/>
<circle cx="170.0" cy="80.0" r="20.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="170.0" y="86.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">+</text>
<circle cx="100.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="100.0" y="176.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">2</text>
<circle cx="240.0" cy="170.0" r="20.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="240.0" y="176.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">×</text>
<circle cx="195.0" cy="260.0" r="20.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="195.0" y="266.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">3</text>
<circle cx="285.0" cy="260.0" r="20.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="285.0" y="266.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">4</text>
<text x="270.0" y="175.0" text-anchor="start" font-size="15" fill="#d9480f" font-weight="bold">= 12</text>
<text x="200.0" y="85.0" text-anchor="start" font-size="15" fill="#d9480f" font-weight="bold">= 14</text>
<text x="170.0" y="320.0" text-anchor="middle" font-size="14" fill="#222222">× sits lower, so it runs first.</text>
<text x="170.0" y="342.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Result: 14</text>
<line x1="487.7" y1="95.8" x2="442.3" y2="154.2" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="512.3" y1="95.8" x2="557.7" y2="154.2" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="421.1" y1="187.9" x2="393.9" y2="242.1" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="438.9" y1="187.9" x2="466.1" y2="242.1" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="500.0" cy="80.0" r="20.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<text x="500.0" y="86.0" text-anchor="middle" font-size="17" fill="#555555" font-weight="bold">×</text>
<circle cx="430.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<text x="430.0" y="176.0" text-anchor="middle" font-size="17" fill="#555555" font-weight="bold">+</text>
<circle cx="570.0" cy="170.0" r="20.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<text x="570.0" y="176.0" text-anchor="middle" font-size="17" fill="#555555" font-weight="bold">4</text>
<circle cx="385.0" cy="260.0" r="20.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<text x="385.0" y="266.0" text-anchor="middle" font-size="17" fill="#555555" font-weight="bold">2</text>
<circle cx="475.0" cy="260.0" r="20.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="4 3"/>
<text x="475.0" y="266.0" text-anchor="middle" font-size="17" fill="#555555" font-weight="bold">3</text>
<text x="530.0" y="85.0" text-anchor="start" font-size="15" fill="#555555">= 20</text>
<text x="400.0" y="175.0" text-anchor="end" font-size="15" fill="#555555">= 5</text>
<text x="500.0" y="320.0" text-anchor="middle" font-size="14" fill="#555555">Only parentheses build this tree.</text>
<text x="500.0" y="342.0" text-anchor="middle" font-size="14" fill="#555555">Result: 20</text>
<line x1="335.0" y1="50.0" x2="335.0" y2="345.0" stroke="#bbbbbb" stroke-width="1"/>
</svg>
