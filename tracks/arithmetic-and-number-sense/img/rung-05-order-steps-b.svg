<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Order of operations steps</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="280" fill="#ffffff"/>
<text x="140.0" y="30.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">The agreed order</text>
<rect x="20.0" y="50.0" width="240.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<text x="34.0" y="76.0" text-anchor="start" font-size="14" fill="#222222">1. Parentheses ( )</text>
<rect x="20.0" y="102.0" width="240.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<text x="34.0" y="128.0" text-anchor="start" font-size="14" fill="#222222">2. Exponents</text>
<rect x="20.0" y="154.0" width="240.0" height="40.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5" rx="6"/>
<text x="34.0" y="180.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">3. × and ÷, left to right</text>
<rect x="20.0" y="206.0" width="240.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<text x="34.0" y="232.0" text-anchor="start" font-size="14" fill="#222222">4. + and −, left to right</text>
<text x="480.0" y="30.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">Evaluate 2 + 3 × 4</text>
<text x="462.8" y="92.0" text-anchor="end" font-size="26" fill="#222222">2 +</text>
<text x="502.0" y="92.0" text-anchor="middle" font-size="26" fill="#222222">3 × 4</text>
<rect x="466.8" y="64.0" width="70.6" height="38.0" fill="none" stroke="#d9480f" stroke-width="2" rx="5"/>
<line x1="480.0" y1="110.0" x2="480.0" y2="138.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="540.0" y="128.0" text-anchor="start" font-size="13" fill="#d9480f">step 3 first</text>
<text x="480.0" y="172.0" text-anchor="middle" font-size="26" fill="#222222">2 + 12</text>
<rect x="437.5" y="144.0" width="85.0" height="38.0" fill="none" stroke="#222222" stroke-width="1.5" rx="5"/>
<line x1="480.0" y1="190.0" x2="480.0" y2="218.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="540.0" y="208.0" text-anchor="start" font-size="13" fill="#555555">then step 4</text>
<text x="480.0" y="252.0" text-anchor="middle" font-size="26" fill="#d9480f" font-weight="bold">14</text>
</svg>
