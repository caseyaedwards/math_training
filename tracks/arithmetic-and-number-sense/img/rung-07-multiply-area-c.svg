<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>2/3 times 3/4 as an area</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="600" height="420" fill="#ffffff"/>
<text x="300.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">2/3 × 3/4 = 6/12 = 1/2</text>
<rect x="120.0" y="80.0" width="100.0" height="75.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.2"/>
<rect x="120.0" y="155.0" width="100.0" height="75.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="120.0" y="230.0" width="100.0" height="75.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="120.0" y="305.0" width="100.0" height="75.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="220.0" y="80.0" width="100.0" height="75.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.2"/>
<rect x="220.0" y="155.0" width="100.0" height="75.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="220.0" y="230.0" width="100.0" height="75.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="220.0" y="305.0" width="100.0" height="75.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="320.0" y="80.0" width="100.0" height="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<rect x="320.0" y="155.0" width="100.0" height="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<rect x="320.0" y="230.0" width="100.0" height="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<rect x="320.0" y="305.0" width="100.0" height="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<rect x="120.0" y="155.0" width="200.0" height="225.0" fill="none" stroke="#d9480f" stroke-width="3"/>
<rect x="120.0" y="80.0" width="300.0" height="300.0" fill="none" stroke="#222222" stroke-width="2.5"/>
<line x1="120.0" y1="66.0" x2="320.0" y2="66.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ad)" marker-start="url(#ad)"/>
<text x="220.0" y="58.0" text-anchor="middle" font-size="13" fill="#222222">2/3 of the width</text>
<line x1="106.0" y1="155.0" x2="106.0" y2="380.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ad)" marker-start="url(#ad)"/>
<text x="98.0" y="261.5" text-anchor="end" font-size="13" fill="#222222">3/4 of</text>
<text x="98.0" y="277.5" text-anchor="end" font-size="13" fill="#222222">the height</text>
<text x="436.0" y="230.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">orange box:</text>
<text x="436.0" y="250.0" text-anchor="start" font-size="14" fill="#222222">6 of 12 cells</text>
<text x="300.0" y="404.0" text-anchor="middle" font-size="14" fill="#555555">Multiply tops: 2 × 3 = 6. Multiply bottoms: 3 × 4 = 12.</text>
