<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Remainders cycle in 1/7</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<text x="340.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Why 1/7 repeats: the remainders cycle</text>
<path d="M222.9,97.2 A120.0,120.0 0 0 1 290.6,136.3" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="273.0" y="93.6" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">digit 1</text>
<path d="M313.5,175.9 A120.0,120.0 0 0 1 313.5,254.1" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="346.0" y="220.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">digit 4</text>
<path d="M290.6,293.7 A120.0,120.0 0 0 1 222.9,332.8" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="273.0" y="346.4" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">digit 2</text>
<path d="M177.1,332.8 A120.0,120.0 0 0 1 109.4,293.7" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="127.0" y="346.4" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">digit 8</text>
<path d="M86.5,254.1 A120.0,120.0 0 0 1 86.5,175.9" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="54.0" y="220.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">digit 5</text>
<path d="M109.4,136.3 A120.0,120.0 0 0 1 177.1,97.2" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aa)"/>
<text x="127.0" y="93.6" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">digit 7</text>
<circle cx="200.0" cy="95.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="200.0" y="100.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">1</text>
<circle cx="303.9" cy="155.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="303.9" y="160.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">3</text>
<circle cx="303.9" cy="275.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="303.9" y="280.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<circle cx="200.0" cy="335.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="200.0" y="340.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">6</text>
<circle cx="96.1" cy="275.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="96.1" y="280.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">4</text>
<circle cx="96.1" cy="155.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="96.1" y="160.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">5</text>
<text x="200.0" y="211.0" text-anchor="middle" font-size="13" fill="#555555">remainder</text>
<text x="200.0" y="229.0" text-anchor="middle" font-size="13" fill="#555555">after each step</text>
<text x="400.0" y="90.0" text-anchor="start" font-size="14" fill="#222222">Divide 1 by 7 the long way.</text>
<text x="400.0" y="112.0" text-anchor="start" font-size="14" fill="#222222">Circles show each remainder.</text>
<text x="400.0" y="134.0" text-anchor="start" font-size="14" fill="#222222">Arrows show the digit written.</text>
<text x="400.0" y="178.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">1/7 = 0.142857 142857 …</text>
<text x="400.0" y="222.0" text-anchor="start" font-size="14" fill="#222222">Only remainders 1 to 6 exist,</text>
<text x="400.0" y="244.0" text-anchor="start" font-size="14" fill="#222222">so one must come back,</text>
<text x="400.0" y="266.0" text-anchor="start" font-size="14" fill="#222222">and then the digits repeat.</text>
<text x="400.0" y="310.0" text-anchor="start" font-size="14" fill="#222222">1/3: remainder 1 every time,</text>
<text x="400.0" y="332.0" text-anchor="start" font-size="14" fill="#222222">so 1/3 = 0.333 …</text>
</svg>
