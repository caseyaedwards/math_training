<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Powers of two from 1 to 1024</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold"><tspan>Doubling: 2</tspan><tspan dy="-6.1" font-size="11.5">0</tspan><tspan dy="6.1"> to 2</tspan><tspan dy="-6.1" font-size="11.5">10</tspan></text>
<line x1="40.0" y1="340.0" x2="620.0" y2="340.0" stroke="#222222" stroke-width="1.5"/>
<rect x="60.0" y="339.7" width="36.0" height="0.3" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="78.0" y="333.7" text-anchor="middle" font-size="12" fill="#222222">1</text>
<text x="78.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">0</tspan></text>
<rect x="110.0" y="339.5" width="36.0" height="0.5" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="128.0" y="333.5" text-anchor="middle" font-size="12" fill="#222222">2</text>
<text x="128.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">1</tspan></text>
<rect x="160.0" y="338.9" width="36.0" height="1.1" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="178.0" y="332.9" text-anchor="middle" font-size="12" fill="#222222">4</text>
<text x="178.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">2</tspan></text>
<rect x="210.0" y="337.8" width="36.0" height="2.2" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="228.0" y="331.8" text-anchor="middle" font-size="12" fill="#222222">8</text>
<text x="228.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">3</tspan></text>
<rect x="260.0" y="335.6" width="36.0" height="4.4" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="278.0" y="329.6" text-anchor="middle" font-size="12" fill="#222222">16</text>
<text x="278.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">4</tspan></text>
<rect x="310.0" y="331.2" width="36.0" height="8.8" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="328.0" y="325.2" text-anchor="middle" font-size="12" fill="#222222">32</text>
<text x="328.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">5</tspan></text>
<rect x="360.0" y="322.5" width="36.0" height="17.5" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="378.0" y="316.5" text-anchor="middle" font-size="12" fill="#222222">64</text>
<text x="378.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">6</tspan></text>
<rect x="410.0" y="305.0" width="36.0" height="35.0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="428.0" y="299.0" text-anchor="middle" font-size="12" fill="#222222">128</text>
<text x="428.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">7</tspan></text>
<rect x="460.0" y="270.0" width="36.0" height="70.0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="478.0" y="264.0" text-anchor="middle" font-size="12" fill="#222222">256</text>
<text x="478.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">8</tspan></text>
<rect x="510.0" y="200.0" width="36.0" height="140.0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="528.0" y="194.0" text-anchor="middle" font-size="12" fill="#222222">512</text>
<text x="528.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">9</tspan></text>
<rect x="560.0" y="60.0" width="36.0" height="280.0" fill="#d9480f" stroke="#222222" stroke-width="1"/>
<text x="578.0" y="54.0" text-anchor="middle" font-size="12" fill="#222222" font-weight="bold">1024</text>
<text x="578.0" y="360.0" text-anchor="middle" font-size="13" fill="#222222"><tspan>2</tspan><tspan dy="-4.9" font-size="9.4">10</tspan></text>
<line x1="40.0" y1="66.6" x2="610.0" y2="66.6" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="616.0" y="71.6" text-anchor="start" font-size="13" fill="#555555"><tspan>1000 = 10</tspan><tspan dy="-4.9" font-size="9.4">3</tspan></text>
<text x="330.0" y="120.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">10</tspan><tspan dy="5.3"> = 1024 ≈ 10</tspan><tspan dy="-5.3" font-size="10.1">3</tspan><tspan dy="5.3">, so 1 KiB ≈ 1 KB</tspan></text>
<text x="330.0" y="144.0" text-anchor="middle" font-size="14" fill="#222222">Each bar is twice the bar before it.</text>
</svg>
