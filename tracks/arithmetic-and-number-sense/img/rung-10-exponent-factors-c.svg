<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Adding exponents by counting factors</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="260" fill="#ffffff"/>
<text x="350.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Multiplying powers: count the factors</text>
<rect x="40.0" y="70.0" width="30.0" height="30.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="55.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="74.0" y="70.0" width="30.0" height="30.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="89.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="108.0" y="70.0" width="30.0" height="30.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="123.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<text x="89.0" y="122.0" text-anchor="middle" font-size="14" fill="#222222"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">3</tspan><tspan dy="5.3"> = 8</tspan></text>
<text x="154.0" y="92.0" text-anchor="middle" font-size="18" fill="#222222">×</text>
<rect x="170.0" y="70.0" width="30.0" height="30.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="185.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="204.0" y="70.0" width="30.0" height="30.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="219.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<text x="202.0" y="122.0" text-anchor="middle" font-size="14" fill="#222222"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3"> = 4</tspan></text>
<text x="250.0" y="92.0" text-anchor="middle" font-size="18" fill="#222222">=</text>
<rect x="266.0" y="70.0" width="30.0" height="30.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="281.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="300.0" y="70.0" width="30.0" height="30.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="315.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="334.0" y="70.0" width="30.0" height="30.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="349.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="368.0" y="70.0" width="30.0" height="30.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="383.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="402.0" y="70.0" width="30.0" height="30.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="417.0" y="91.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<text x="349.0" y="122.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">5</tspan><tspan dy="5.3"> = 32</tspan></text>
<text x="350.0" y="160.0" text-anchor="middle" font-size="15" fill="#222222"><tspan>3 factors + 2 factors = 5 factors, so a</tspan><tspan dy="-5.7" font-size="10.8">m</tspan><tspan dy="5.7"> · a</tspan><tspan dy="-5.7" font-size="10.8">n</tspan><tspan dy="5.7"> = a</tspan><tspan dy="-5.7" font-size="10.8">m+n</tspan></text>
<text x="350.0" y="196.0" text-anchor="middle" font-size="15" fill="#222222"><tspan>Roots run it backward: 49</tspan><tspan dy="-5.7" font-size="10.8">1/2</tspan><tspan dy="5.7"> = 7 because 7 × 7 = 49,</tspan></text>
<text x="350.0" y="220.0" text-anchor="middle" font-size="15" fill="#222222"><tspan>and 8</tspan><tspan dy="-5.7" font-size="10.8">1/3</tspan><tspan dy="5.7"> = 2 because 2 × 2 × 2 = 8.</tspan></text>
</svg>
