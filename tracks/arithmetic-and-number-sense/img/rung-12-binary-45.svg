<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="580" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>45 in binary</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="580" height="270" fill="#ffffff"/>
<text x="290.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">101101 in base 2 = 45</text>
<text x="115.0" y="62.0" text-anchor="middle" font-size="14" fill="#555555"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">5</tspan></text>
<text x="115.0" y="84.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">32</text>
<rect x="80.0" y="96.0" width="70.0" height="70.0" fill="#d9480f" stroke="#222222" stroke-width="2"/>
<text x="115.0" y="144.0" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">1</text>
<text x="115.0" y="190.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">32</text>
<text x="185.0" y="62.0" text-anchor="middle" font-size="14" fill="#555555"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">4</tspan></text>
<text x="185.0" y="84.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">16</text>
<rect x="150.0" y="96.0" width="70.0" height="70.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="185.0" y="144.0" text-anchor="middle" font-size="34" fill="#555555" font-weight="bold">0</text>
<text x="185.0" y="190.0" text-anchor="middle" font-size="15" fill="#555555" font-weight="bold">–</text>
<text x="255.0" y="62.0" text-anchor="middle" font-size="14" fill="#555555"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">3</tspan></text>
<text x="255.0" y="84.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">8</text>
<rect x="220.0" y="96.0" width="70.0" height="70.0" fill="#d9480f" stroke="#222222" stroke-width="2"/>
<text x="255.0" y="144.0" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">1</text>
<text x="255.0" y="190.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">8</text>
<text x="325.0" y="62.0" text-anchor="middle" font-size="14" fill="#555555"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">2</tspan></text>
<text x="325.0" y="84.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">4</text>
<rect x="290.0" y="96.0" width="70.0" height="70.0" fill="#d9480f" stroke="#222222" stroke-width="2"/>
<text x="325.0" y="144.0" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">1</text>
<text x="325.0" y="190.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">4</text>
<text x="395.0" y="62.0" text-anchor="middle" font-size="14" fill="#555555"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">1</tspan></text>
<text x="395.0" y="84.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">2</text>
<rect x="360.0" y="96.0" width="70.0" height="70.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="395.0" y="144.0" text-anchor="middle" font-size="34" fill="#555555" font-weight="bold">0</text>
<text x="395.0" y="190.0" text-anchor="middle" font-size="15" fill="#555555" font-weight="bold">–</text>
<text x="465.0" y="62.0" text-anchor="middle" font-size="14" fill="#555555"><tspan>2</tspan><tspan dy="-5.3" font-size="10.1">0</tspan></text>
<text x="465.0" y="84.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">1</text>
<rect x="430.0" y="96.0" width="70.0" height="70.0" fill="#d9480f" stroke="#222222" stroke-width="2"/>
<text x="465.0" y="144.0" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">1</text>
<text x="465.0" y="190.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">1</text>
<text x="290.0" y="232.0" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">32 + 8 + 4 + 1 = 45</text>
<text x="290.0" y="256.0" text-anchor="middle" font-size="13" fill="#555555">Each place is worth twice the place to its right.</text>
