<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Hex digits as groups of four bits</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="320" fill="#ffffff"/>
<text x="350.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">One hex digit = four bits</text>
<text x="60.0" y="95.0" text-anchor="end" font-size="20" fill="#222222" font-weight="bold">45</text>
<rect x="80.0" y="70.0" width="28.0" height="36.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="94.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">0</text>
<rect x="110.0" y="70.0" width="28.0" height="36.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="124.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">0</text>
<rect x="140.0" y="70.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="154.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="170.0" y="70.0" width="28.0" height="36.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="184.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">0</text>
<rect x="220.0" y="70.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="234.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="250.0" y="70.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="264.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="280.0" y="70.0" width="28.0" height="36.0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="294.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">0</text>
<rect x="310.0" y="70.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="324.0" y="94.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<text x="138.0" y="134.0" text-anchor="middle" font-size="22" fill="#d9480f" font-weight="bold">2</text>
<text x="138.0" y="154.0" text-anchor="middle" font-size="13" fill="#555555">= 2</text>
<text x="278.0" y="134.0" text-anchor="middle" font-size="22" fill="#d9480f" font-weight="bold">D</text>
<text x="278.0" y="154.0" text-anchor="middle" font-size="13" fill="#555555">= 13</text>
<text x="372.0" y="95.0" text-anchor="middle" font-size="20" fill="#222222">→</text>
<text x="400.0" y="95.0" text-anchor="start" font-size="20" fill="#d9480f" font-weight="bold">0x2D</text>
<text x="490.0" y="95.0" text-anchor="start" font-size="15" fill="#222222">2 × 16 + 13 = 45</text>
<text x="60.0" y="210.0" text-anchor="end" font-size="20" fill="#222222" font-weight="bold">255</text>
<rect x="80.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="94.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="110.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="124.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="140.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="154.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="170.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="184.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="220.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="234.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="250.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="264.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="280.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="294.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<rect x="310.0" y="185.0" width="28.0" height="36.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="324.0" y="209.0" text-anchor="middle" font-size="16" fill="#222222">1</text>
<text x="138.0" y="249.0" text-anchor="middle" font-size="22" fill="#d9480f" font-weight="bold">F</text>
<text x="138.0" y="269.0" text-anchor="middle" font-size="13" fill="#555555">= 15</text>
<text x="278.0" y="249.0" text-anchor="middle" font-size="22" fill="#d9480f" font-weight="bold">F</text>
<text x="278.0" y="269.0" text-anchor="middle" font-size="13" fill="#555555">= 15</text>
<text x="372.0" y="210.0" text-anchor="middle" font-size="20" fill="#222222">→</text>
<text x="400.0" y="210.0" text-anchor="start" font-size="20" fill="#d9480f" font-weight="bold">0xFF</text>
<text x="490.0" y="210.0" text-anchor="start" font-size="15" fill="#222222">15 × 16 + 15 = 255</text>
<text x="350.0" y="304.0" text-anchor="middle" font-size="14" fill="#555555">A byte is 8 bits, so a byte is always exactly 2 hex digits.</text>
</svg>
