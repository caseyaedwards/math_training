<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Nested number sets</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="370" fill="#ffffff"/>
<text x="350.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ: each set lives inside the next</text>
<rect x="20.0" y="50.0" width="660.0" height="300.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="14"/>
<text x="34.0" y="74.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">ℝ real numbers</text>
<rect x="40.0" y="90.0" width="490.0" height="240.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="14"/>
<text x="54.0" y="114.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">ℚ rational numbers</text>
<rect x="60.0" y="130.0" width="330.0" height="180.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="14"/>
<text x="74.0" y="154.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">ℤ integers</text>
<rect x="80.0" y="170.0" width="170.0" height="120.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" rx="14"/>
<text x="94.0" y="194.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">ℕ natural numbers</text>
<text x="165.0" y="233.0" text-anchor="middle" font-size="15" fill="#222222">1, 2, 3</text>
<text x="165.0" y="257.0" text-anchor="middle" font-size="15" fill="#222222">47</text>
<text x="320.0" y="216.0" text-anchor="middle" font-size="15" fill="#222222">0</text>
<text x="320.0" y="240.0" text-anchor="middle" font-size="15" fill="#222222">−1</text>
<text x="320.0" y="264.0" text-anchor="middle" font-size="15" fill="#222222">−7</text>
<text x="460.0" y="194.0" text-anchor="middle" font-size="15" fill="#222222">1/2</text>
<text x="460.0" y="218.0" text-anchor="middle" font-size="15" fill="#222222">−3/4</text>
<text x="460.0" y="242.0" text-anchor="middle" font-size="15" fill="#222222">0.125</text>
<text x="460.0" y="266.0" text-anchor="middle" font-size="15" fill="#222222">0.333…</text>
<text x="605.0" y="206.0" text-anchor="middle" font-size="15" fill="#222222">√2</text>
<text x="605.0" y="230.0" text-anchor="middle" font-size="15" fill="#222222">π</text>
<text x="605.0" y="254.0" text-anchor="middle" font-size="15" fill="#222222">−√5</text>
</svg>
