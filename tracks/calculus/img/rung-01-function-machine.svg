<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A function as an input-output machine</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="640" height="290" fill="#ffffff"/>
<rect x="250.0" y="50.0" width="150.0" height="90.0" fill="#f6d5c4" stroke="#222222" stroke-width="2" rx="8"/>
<text x="325.0" y="88.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">f</text>
<text x="325.0" y="112.0" text-anchor="middle" fill="#222222" font-size="13">square the input</text>
<line x1="110.0" y1="95.0" x2="246.0" y2="95.0" stroke="#222222" stroke-width="2" marker-end="url(#arrowD)"/>
<text x="175.0" y="84.0" text-anchor="middle" fill="#222222">input 3</text>
<line x1="402.0" y1="95.0" x2="540.0" y2="95.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowA)"/>
<text x="470.0" y="84.0" text-anchor="middle" fill="#d9480f" font-weight="bold">output 9</text>
<text x="325.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">f(x) = x², so f(3) = 9</text>
<rect x="490.0" y="183.0" width="60.0" height="80.0" fill="#f6d5c4"/>
<text x="160.0" y="209.0" text-anchor="middle" fill="#222222" font-weight="bold" font-style="italic">x</text>
<text x="160.0" y="249.0" text-anchor="middle" fill="#222222" font-weight="bold" font-style="italic">f(x)</text>
<line x1="130.0" y1="221.0" x2="550.0" y2="221.0" stroke="#555555" stroke-width="1"/>
<line x1="190.0" y1="183.0" x2="190.0" y2="263.0" stroke="#555555" stroke-width="1"/>
<text x="220.0" y="209.0" text-anchor="middle" fill="#222222">−2</text>
<text x="220.0" y="249.0" text-anchor="middle" fill="#222222">4</text>
<text x="280.0" y="209.0" text-anchor="middle" fill="#222222">−1</text>
<text x="280.0" y="249.0" text-anchor="middle" fill="#222222">1</text>
<text x="340.0" y="209.0" text-anchor="middle" fill="#222222">0</text>
<text x="340.0" y="249.0" text-anchor="middle" fill="#222222">0</text>
<text x="400.0" y="209.0" text-anchor="middle" fill="#222222">1</text>
<text x="400.0" y="249.0" text-anchor="middle" fill="#222222">1</text>
<text x="460.0" y="209.0" text-anchor="middle" fill="#222222">2</text>
<text x="460.0" y="249.0" text-anchor="middle" fill="#222222">4</text>
<text x="520.0" y="209.0" text-anchor="middle" fill="#222222">3</text>
<text x="520.0" y="249.0" text-anchor="middle" fill="#d9480f" font-weight="bold">9</text>
<text x="320.0" y="282.0" text-anchor="middle" fill="#555555" font-size="13">Every input gets exactly one output.</text>
</svg>
