<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Chain rule as two machines in a row</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="740" height="260" fill="#ffffff"/>
<rect x="95.0" y="60.0" width="150.0" height="60.0" fill="#f6d5c4" stroke="#222222" stroke-width="2" rx="8"/>
<text x="170.0" y="96.0" text-anchor="middle" fill="#222222" font-weight="bold">u = 3x + 1</text>
<rect x="375.0" y="60.0" width="150.0" height="60.0" fill="#f6d5c4" stroke="#222222" stroke-width="2" rx="8"/>
<text x="450.0" y="96.0" text-anchor="middle" fill="#222222" font-weight="bold">y = u²</text>
<text x="40.0" y="95.0" text-anchor="middle" fill="#222222">x = 1</text>
<line x1="68.0" y1="90.0" x2="92.0" y2="90.0" stroke="#222222" stroke-width="2" marker-end="url(#arrowD)"/>
<line x1="248.0" y1="90.0" x2="372.0" y2="90.0" stroke="#222222" stroke-width="2" marker-end="url(#arrowD)"/>
<text x="310.0" y="80.0" text-anchor="middle" fill="#222222" font-size="13">u = 4</text>
<line x1="528.0" y1="90.0" x2="600.0" y2="90.0" stroke="#222222" stroke-width="2" marker-end="url(#arrowD)"/>
<text x="650.0" y="95.0" text-anchor="middle" fill="#222222">y = 16</text>
<text x="170.0" y="148.0" text-anchor="middle" fill="#d9480f" font-weight="bold">du/dx = 3</text>
<text x="170.0" y="168.0" text-anchor="middle" fill="#555555" font-size="12">u moves 3 per unit of x</text>
<text x="450.0" y="148.0" text-anchor="middle" fill="#d9480f" font-weight="bold">dy/du = 2u = 8</text>
<text x="450.0" y="168.0" text-anchor="middle" fill="#555555" font-size="12">y moves 8 per unit of u</text>
<text x="370.0" y="212.0" text-anchor="middle" fill="#222222" font-weight="bold">dy/dx = dy/du × du/dx = 8 × 3 = 24</text>
<text x="370.0" y="236.0" text-anchor="middle" fill="#555555" font-size="13">Check: y = (3x + 1)², y′ = 2(3x + 1) × 3 = 24 at x = 1.</text>
<text x="370.0" y="30.0" text-anchor="middle" fill="#555555" font-size="13">Rates multiply along the chain, like gears.</text>
</svg>
