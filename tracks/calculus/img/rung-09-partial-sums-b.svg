<line x1="554.9" y1="40.0" x2="554.9" y2="240.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="554.9" y="258.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">e ≈ 2.7183</text>
