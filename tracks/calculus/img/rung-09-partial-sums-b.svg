<text x="110.0" y="138.0" text-anchor="end" fill="#222222" font-size="13">+ 1/2</text>
<text x="512.0" y="138.0" text-anchor="end" fill="#222222" font-size="13">2.5000</text>
<rect x="120.0" y="158.0" width="426.7" height="22.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.2"/>
<text x="110.0" y="174.0" text-anchor="end" fill="#222222" font-size="13">+ 1/6</text>
<text x="538.7" y="174.0" text-anchor="end" fill="#222222" font-size="13">2.6667</text>
