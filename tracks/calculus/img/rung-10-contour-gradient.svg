<text x="344.0" y="51.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">∇f = (2, 4)</text>
<text x="500.0" y="90.0" text-anchor="start" fill="#222222" font-weight="bold">f(x, y) = x² + 2y²</text>
<text x="500.0" y="120.0" text-anchor="start" fill="#222222" font-size="13">∂f/∂x = 2x, ∂f/∂y = 4y</text>
<text x="500.0" y="146.0" text-anchor="start" fill="#222222" font-size="13">at (1, 1): ∇f = (2, 4)</text>
<text x="500.0" y="180.0" text-anchor="start" fill="#d9480f" font-size="13">Orange: the contour f = 3</text>
<text x="500.0" y="200.0" text-anchor="start" fill="#d9480f" font-size="13">through (1, 1).</text>
<text x="500.0" y="234.0" text-anchor="start" fill="#555555" font-size="13">The arrow points uphill</text>
<text x="500.0" y="252.0" text-anchor="start" fill="#555555" font-size="13">and crosses the contour</text>
<text x="500.0" y="270.0" text-anchor="start" fill="#555555" font-size="13">at a right angle.</text>
<text x="500.0" y="304.0" text-anchor="start" fill="#555555" font-size="12">Numbers at the left ends</text>
<text x="500.0" y="320.0" text-anchor="start" fill="#555555" font-size="12">of the ovals are values of f.</text>
<text x="500.0" y="336.0" text-anchor="start" fill="#555555" font-size="12">Tick marks are 1 unit apart.</text>
