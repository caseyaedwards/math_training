<text x="165.2" y="176.3" text-anchor="middle" fill="#222222" font-weight="bold">∫ u dv</text>
<text x="165.2" y="196.3" text-anchor="middle" fill="#222222" font-size="13">= 14/3</text>
<text x="302.8" y="316.2" text-anchor="middle" fill="#222222" font-weight="bold">∫ v du</text>
<text x="302.8" y="336.2" text-anchor="middle" fill="#222222" font-size="13">= 7/3</text>
<text x="137.8" y="339.1" text-anchor="middle" fill="#222222" font-size="12">u<tspan dy="4" font-size="10">1</tspan><tspan dy="-4">v</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = 1</tspan></text>
<text x="302.8" y="205.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">v = u²</text>
<text x="450.0" y="90.0" text-anchor="start" fill="#222222">Big rectangle minus</text>
<text x="450.0" y="110.0" text-anchor="start" fill="#222222">small rectangle:</text>
<text x="450.0" y="140.0" text-anchor="start" fill="#222222" font-weight="bold">u<tspan dy="4" font-size="10">2</tspan><tspan dy="-4">v</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> − u</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4">v</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = 8 − 1 = 7</tspan></text>
<text x="450.0" y="180.0" text-anchor="start" fill="#222222">The curve splits that</text>
<text x="450.0" y="200.0" text-anchor="start" fill="#222222">L-shape into two parts:</text>
<text x="450.0" y="230.0" text-anchor="start" fill="#222222" font-weight="bold">∫ u dv + ∫ v du = 7</text>
<text x="450.0" y="254.0" text-anchor="start" fill="#d9480f">14/3 + 7/3 = 7</text>
<text x="450.0" y="294.0" text-anchor="start" fill="#555555" font-size="13">Rearranged:</text>
<text x="450.0" y="314.0" text-anchor="start" fill="#555555" font-size="13">∫ u dv = uv − ∫ v du</text>
