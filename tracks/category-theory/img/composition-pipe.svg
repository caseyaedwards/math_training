<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Composition: g after f, and a Unix pipe</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
<text x="390.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Composition: g after f, and a Unix pipe</text>
<rect x="78.0" y="143.0" width="64.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="110.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">int</text>
<rect x="268.0" y="58.0" width="64.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="80.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">int</text>
<rect x="452.0" y="143.0" width="76.0" height="34.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="490.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">string</text>
<line x1="144.7" y1="144.5" x2="265.3" y2="90.5" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="200.1" y="111.5" text-anchor="end" fill="#222222" font-size="13" xml:space="preserve">f = inc</text>
<line x1="334.7" y1="90.5" x2="449.3" y2="141.8" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="396.9" y="110.2" text-anchor="start" fill="#222222" font-size="13" xml:space="preserve">g = strconv.Itoa</text>
<line x1="145.0" y1="160.0" x2="449.0" y2="160.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="297.0" y="149.0" text-anchor="middle" fill="#d9480f" font-size="14" xml:space="preserve">g ∘ f</text>
<text x="300.0" y="210.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">3  →  4  →  "4"</text>
<text x="650.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">(g ∘ f)(x) = g(f(x))</text>
<text x="650.0" y="130.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">read g ∘ f as</text>
<text x="650.0" y="148.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">g after f</text>
<text x="650.0" y="172.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">f must end where</text>
<text x="650.0" y="190.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">g starts</text>
<line x1="20" y1="232" x2="760" y2="232" stroke="#dee2e6" stroke-width="1.5"/>
<rect x="51.9" y="258.0" width="116.2" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="110.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">cat app.log</text>
<rect x="245.8" y="258.0" width="108.4" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">grep ERROR</text>
<rect x="439.3" y="258.0" width="61.4" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="470.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">sort</text>
<rect x="609.3" y="258.0" width="61.4" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="640.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">uniq</text>
<line x1="171.1" y1="275.0" x2="242.8" y2="275.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="207.0" y="270.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">|</text>
<line x1="357.2" y1="275.0" x2="436.3" y2="275.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="396.8" y="270.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">|</text>
<line x1="503.7" y1="275.0" x2="606.3" y2="275.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="555.0" y="270.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">|</text>
<line x1="51.9" y1="310.0" x2="670.7" y2="310.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="361.3" y="334.0" text-anchor="middle" fill="#d9480f" font-size="13" xml:space="preserve">the whole pipe is one arrow: uniq ∘ sort ∘ grep ∘ cat</text>
</svg>
