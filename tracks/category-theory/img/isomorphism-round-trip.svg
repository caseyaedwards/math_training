<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>An isomorphism and a non-isomorphism</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="780" height="320" fill="#ffffff"/>
<text x="390.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">An isomorphism and a non-isomorphism</text>
<text x="240.0" y="56.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">Isomorphism: a perfect round trip</text>
<text x="640.0" y="56.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">Not one: 3 into 2</text>
<line x1="500" y1="44" x2="500" y2="300" stroke="#dee2e6" stroke-width="1.5"/>
<ellipse cx="110.0" cy="165.0" rx="60.0" ry="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<ellipse cx="370.0" cy="165.0" rx="50.0" ry="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="110.0" y="262.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">bool</text>
<text x="370.0" y="262.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">{0, 1}</text>
<circle cx="110.0" cy="130.0" r="4.5" fill="#222222"/>
<text x="110.0" y="118.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">false</text>
<circle cx="110.0" cy="200.0" r="4.5" fill="#222222"/>
<text x="110.0" y="188.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">true</text>
<circle cx="370.0" cy="130.0" r="4.5" fill="#222222"/>
<text x="384.0" y="135.0" text-anchor="start" fill="#222222" font-size="14" xml:space="preserve">0</text>
<circle cx="370.0" cy="200.0" r="4.5" fill="#222222"/>
<text x="384.0" y="205.0" text-anchor="start" fill="#222222" font-size="14" xml:space="preserve">1</text>
<line x1="120.0" y1="125.0" x2="358.0" y2="125.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="360.0" y1="136.0" x2="122.0" y2="136.0" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<line x1="120.0" y1="195.0" x2="358.0" y2="195.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="360.0" y1="206.0" x2="122.0" y2="206.0" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<text x="240.0" y="100.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">f</text>
<text x="240.0" y="236.0" text-anchor="middle" fill="#d9480f" font-size="14" xml:space="preserve">g = inverse of f (dashed)</text>
<text x="240.0" y="288.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">g ∘ f = id_bool   and   f ∘ g = id_{0,1}</text>
<ellipse cx="580.0" cy="165.0" rx="40.0" ry="75.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<ellipse cx="710.0" cy="165.0" rx="40.0" ry="60.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="580.0" cy="115.0" r="4.5" fill="#222222"/>
<text x="566.0" y="120.0" text-anchor="end" fill="#222222" font-size="14" xml:space="preserve">1</text>
<circle cx="580.0" cy="165.0" r="4.5" fill="#222222"/>
<text x="566.0" y="170.0" text-anchor="end" fill="#222222" font-size="14" xml:space="preserve">2</text>
<circle cx="580.0" cy="215.0" r="4.5" fill="#222222"/>
<text x="566.0" y="220.0" text-anchor="end" fill="#222222" font-size="14" xml:space="preserve">3</text>
<circle cx="710.0" cy="140.0" r="4.5" fill="#d9480f"/>
<text x="724.0" y="145.0" text-anchor="start" fill="#222222" font-size="14" xml:space="preserve">a</text>
<circle cx="710.0" cy="195.0" r="4.5" fill="#222222"/>
<text x="724.0" y="200.0" text-anchor="start" fill="#222222" font-size="14" xml:space="preserve">b</text>
<line x1="588.0" y1="117.0" x2="701.0" y2="138.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="588.0" y1="163.0" x2="701.0" y2="142.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="588.0" y1="212.0" x2="701.0" y2="197.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="645.0" y="262.0" text-anchor="middle" fill="#d9480f" font-size="13" xml:space="preserve">1 and 2 both land on a,</text>
<text x="645.0" y="280.0" text-anchor="middle" fill="#d9480f" font-size="13" xml:space="preserve">so no inverse can undo it</text>
</svg>
