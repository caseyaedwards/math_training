<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Monad taster: chaining steps that can fail</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="780" height="340" fill="#ffffff"/>
<text x="390.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Monad taster: chaining steps that can fail</text>
<rect x="39.3" y="83.0" width="61.4" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="70.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">"42"</text>
<rect x="175.4" y="83.0" width="69.2" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="210.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">parse</text>
<rect x="313.6" y="83.0" width="92.7" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="360.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">positive</text>
<rect x="479.3" y="83.0" width="61.4" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="510.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">half</text>
<rect x="630.0" y="83.0" width="60.0" height="34.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="660.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">21</text>
<line x1="103.7" y1="100.0" x2="172.4" y2="100.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="247.6" y1="100.0" x2="310.6" y2="100.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="409.4" y1="100.0" x2="476.3" y2="100.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<line x1="543.7" y1="100.0" x2="627.0" y2="100.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="140.0" y="80.0" text-anchor="middle" fill="#555555" font-size="12" xml:space="preserve">string</text>
<text x="285.0" y="80.0" text-anchor="middle" fill="#555555" font-size="12" xml:space="preserve">42</text>
<text x="435.0" y="80.0" text-anchor="middle" fill="#555555" font-size="12" xml:space="preserve">42</text>
<text x="585.0" y="80.0" text-anchor="middle" fill="#555555" font-size="12" xml:space="preserve">21</text>
<line x1="150.0" y1="215.0" x2="690.0" y2="215.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="705.0" y="220.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold" xml:space="preserve">err</text>
<line x1="210.0" y1="118.0" x2="210.0" y2="210.0" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<line x1="360.0" y1="118.0" x2="360.0" y2="210.0" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<line x1="510.0" y1="118.0" x2="510.0" y2="210.0" stroke="#d9480f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<text x="210.0" y="240.0" text-anchor="middle" fill="#d9480f" font-size="12" xml:space="preserve">"abc" exits here</text>
<text x="360.0" y="240.0" text-anchor="middle" fill="#d9480f" font-size="12" xml:space="preserve">"-4" exits here</text>
<text x="510.0" y="240.0" text-anchor="middle" fill="#d9480f" font-size="12" xml:space="preserve">"7" exits here</text>
<text x="390.0" y="280.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">Then(f, g): run g only when f returned err == nil</text>
<text x="390.0" y="306.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">the if err != nil { return } you write daily is the bind of a monad</text>
