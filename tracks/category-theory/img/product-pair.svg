<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Product: the pair type and its projections</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
<text x="390.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Product: the pair type and its projections</text>
<rect x="300.0" y="53.0" width="60.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="330.0" y="75.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">X</text>
<rect x="285.0" y="178.0" width="90.0" height="34.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="330.0" y="200.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">A × B</text>
<rect x="50.0" y="283.0" width="60.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="80.0" y="305.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">A</text>
<rect x="550.0" y="283.0" width="60.0" height="34.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="580.0" y="305.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">B</text>
<line x1="309.3" y1="89.0" x2="100.7" y2="281.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="196.9" y="181.2" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">f</text>
<line x1="350.7" y1="89.0" x2="559.3" y2="281.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="463.1" y="181.2" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">g</text>
<line x1="286.8" y1="213.2" x2="112.8" y2="286.2" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="205.2" y="267.6" text-anchor="start" fill="#222222" font-size="14" xml:space="preserve">π1 (.Fst)</text>
<line x1="373.2" y1="213.2" x2="547.2" y2="286.2" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="454.8" y="267.6" text-anchor="end" fill="#222222" font-size="14" xml:space="preserve">π2 (.Snd)</text>
<line x1="330.0" y1="90.0" x2="330.0" y2="175.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<text x="340.0" y="137.5" text-anchor="start" fill="#d9480f" font-size="14" xml:space="preserve">⟨f, g⟩</text>
<text x="340.0" y="157.0" text-anchor="start" fill="#d9480f" font-size="13" xml:space="preserve">exactly one</text>
<text x="680.0" y="90.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">Go</text>
<text x="680.0" y="114.0" text-anchor="middle" fill="#222222" font-size="13" xml:space="preserve">type Pair struct {</text>
<text x="680.0" y="132.0" text-anchor="middle" fill="#222222" font-size="13" xml:space="preserve">  Fst A; Snd B }</text>
<text x="680.0" y="168.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">X = int, f = itoa,</text>
<text x="680.0" y="186.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">g = isEven</text>
<text x="680.0" y="210.0" text-anchor="middle" fill="#d9480f" font-size="13" xml:space="preserve">6 ↦ {"6", true}</text>
<text x="330.0" y="345.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold" xml:space="preserve">π1 ∘ ⟨f, g⟩ = f     π2 ∘ ⟨f, g⟩ = g</text>
</svg>
