<line x1="138.0" y1="105.8" x2="380.0" y2="129.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="137.9" y1="163.9" x2="380.1" y2="131.3" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="138.0" y1="224.2" x2="380.0" y2="201.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="397.7" y1="132.1" x2="640.3" y2="197.4" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="397.7" y1="197.9" x2="640.3" y2="132.6" stroke="#222222" stroke-width="1.8" marker-end="url(#ah)"/>
