<rect x="654.5" y="150.0" width="71.0" height="30.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="690.0" y="170.0" text-anchor="middle" fill="#222222" font-size="14" xml:space="preserve">{p, q}</text>
