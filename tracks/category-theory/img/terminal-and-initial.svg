<line x1="122.9" y1="224.5" x2="277.1" y2="175.5" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="195.0" y="285.0" text-anchor="middle" fill="#555555" font-size="13" xml:space="preserve">Go: struct{}  (every func into it is the same)</text>
