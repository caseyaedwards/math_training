<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Codewords far apart with non-overlapping decoding balls</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="720" height="480" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Codes Spread Codewords Apart, Then Snap to the Nearest</text>
<circle cx="150.0" cy="150.0" r="62.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="330.0" cy="120.0" r="62.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="510.0" cy="170.0" r="62.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="230.0" cy="310.0" r="62.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="430.0" cy="320.0" r="62.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="610.0" cy="330.0" r="62.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="150.0" cy="150.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="150.0" y="137.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c1</text>
<circle cx="330.0" cy="120.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="330.0" y="107.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c2</text>
<circle cx="510.0" cy="170.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="510.0" y="157.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c3</text>
<circle cx="230.0" cy="310.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="230.0" y="297.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c4</text>
<circle cx="430.0" cy="320.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="307.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c5</text>
<circle cx="610.0" cy="330.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="610.0" y="317.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">c6</text>
<line x1="158.0" y1="149.0" x2="322.0" y2="121.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="240.0" y="157.0" text-anchor="middle" fill="#222222" font-size="12">distance d</text>
<line x1="230.0" y1="310.0" x2="168.0" y2="310.0" stroke="#222222" stroke-width="1.5"/>
<text x="199.0" y="327.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">t</text>
<circle cx="466.0" cy="290.0" r="6.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="476.0" y="282.0" text-anchor="start" fill="#222222" font-size="12">received r</text>
<line x1="462.0" y1="294.0" x2="439.0" y2="313.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="430.0" y="348.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">decode r as c5</text>
<circle cx="40.0" cy="458.0" r="6.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="52.0" y="462.0" text-anchor="start" fill="#666666" font-size="12">codeword: a legal message</text>
<circle cx="250.0" cy="458.0" r="6.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="262.0" y="462.0" text-anchor="start" fill="#666666" font-size="12">received word with errors</text>
<circle cx="460.0" cy="458.0" r="8.0" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="474.0" y="462.0" text-anchor="start" fill="#666666" font-size="12">ball: all words within t flips</text>
<text x="360.0" y="428.0" text-anchor="middle" fill="#222222" font-size="13">Balls do not overlap when d ≥ 2t + 1. Up to t errors always decode to the right codeword.</text>
</svg>
