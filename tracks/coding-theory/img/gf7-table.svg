<text x="222.0" y="412.0" text-anchor="middle" fill="#d9480f" font-size="12">Every nonzero row holds exactly one 1: every number has an inverse.</text>
<text x="420.0" y="92.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Inverse pairs mod 7:</text>
<text x="420.0" y="114.0" text-anchor="start" fill="#222222" font-size="13">1·1, 2·4, 3·5, 6·6 all = 1</text>
<text x="420.0" y="136.0" text-anchor="start" fill="#222222" font-size="13">Division works: a / b = a · b⁻¹.</text>
<text x="420.0" y="158.0" text-anchor="start" fill="#222222" font-size="13"></text>
<text x="420.0" y="180.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Mod 8 fails: 2·4 = 0, and 2 has</text>
<text x="420.0" y="202.0" text-anchor="start" fill="#222222" font-size="13">no inverse. Not a field.</text>
<text x="420.0" y="224.0" text-anchor="start" fill="#222222" font-size="13"></text>
<text x="420.0" y="246.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Bytes need 256 elements. Use GF(2⁸):</text>
<text x="420.0" y="268.0" text-anchor="start" fill="#222222" font-size="13">a byte is a polynomial with bit</text>
<text x="420.0" y="290.0" text-anchor="start" fill="#222222" font-size="13">coefficients, multiplied mod</text>
<text x="420.0" y="312.0" text-anchor="start" fill="#222222" font-size="13">x⁸ + x⁴ + x³ + x + 1 (AES).</text>
<text x="420.0" y="334.0" text-anchor="start" fill="#222222" font-size="13">Example: 0x53 · 0xCA = 0x01.</text>
</svg>
