<text x="244.0" y="112.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<text x="148.0" y="142.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">≠</text>
<text x="212.0" y="142.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">≠</text>
<text x="180.0" y="168.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">differ in 2 places: d(a, b) = 2</text>
