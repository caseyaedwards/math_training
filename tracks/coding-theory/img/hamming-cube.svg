<text x="180.0" y="266.0" text-anchor="middle" fill="#222222" font-size="13">correct up to ⌊(d − 1)/2⌋ errors</text>
<text x="180.0" y="288.0" text-anchor="middle" fill="#222222" font-size="13"></text>
<text x="180.0" y="310.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">Repetition code {000, 111}: d = 3</text>
<text x="180.0" y="332.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">detects 2, corrects 1</text>
