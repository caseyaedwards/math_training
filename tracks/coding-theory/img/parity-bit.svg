<text x="166.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<rect x="183.0" y="136.0" width="34.0" height="30.0" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="2"/>
<text x="200.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<rect x="217.0" y="136.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="234.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<rect x="251.0" y="136.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="268.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<rect x="285.0" y="136.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="302.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<rect x="319.0" y="136.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="336.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<rect x="353.0" y="136.0" width="34.0" height="30.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="370.0" y="156.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<text x="415.0" y="156.0" text-anchor="start" fill="#2b8a3e" font-size="14" font-weight="bold">three 1s: odd, caught</text>
<text x="100.0" y="221.0" text-anchor="end" fill="#666666" font-size="13">2 flips</text>
<rect x="115.0" y="202.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="132.0" y="222.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<rect x="149.0" y="202.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="166.0" y="222.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<rect x="183.0" y="202.0" width="34.0" height="30.0" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="2"/>
