<text x="268.0" y="222.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<rect x="285.0" y="202.0" width="34.0" height="30.0" rx="0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="2"/>
<text x="302.0" y="222.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<rect x="319.0" y="202.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="336.0" y="222.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<rect x="353.0" y="202.0" width="34.0" height="30.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="370.0" y="222.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<text x="415.0" y="222.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">four 1s: even, missed</text>
<text x="360.0" y="280.0" text-anchor="middle" fill="#222222" font-size="12">Rule: p = d1 XOR d2 XOR ... XOR d7. The receiver XORs all 8 bits and expects 0.</text>
<text x="360.0" y="302.0" text-anchor="middle" fill="#666666" font-size="12">Any odd number of flips is caught. Any even number slips through.</text>
</svg>
