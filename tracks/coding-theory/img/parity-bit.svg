<text x="336.0" y="62.0" text-anchor="middle" fill="#666666" font-size="11">d7</text>
<rect x="353.0" y="70.0" width="34.0" height="30.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="370.0" y="90.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<text x="370.0" y="62.0" text-anchor="middle" fill="#666666" font-size="11">p</text>
<text x="415.0" y="90.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">four 1s: even, OK</text>
<text x="100.0" y="155.0" text-anchor="end" fill="#666666" font-size="13">1 flip</text>
