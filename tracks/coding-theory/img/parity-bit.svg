<text x="234.0" y="62.0" text-anchor="middle" fill="#666666" font-size="11">d4</text>
<rect x="251.0" y="70.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="268.0" y="90.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<text x="268.0" y="62.0" text-anchor="middle" fill="#666666" font-size="11">d5</text>
<rect x="285.0" y="70.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="302.0" y="90.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<text x="302.0" y="62.0" text-anchor="middle" fill="#666666" font-size="11">d6</text>
<rect x="319.0" y="70.0" width="34.0" height="30.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
