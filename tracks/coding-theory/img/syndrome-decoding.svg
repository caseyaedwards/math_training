<text x="464.0" y="273.0" text-anchor="start" fill="#d9480f" font-size="12">bit 6 flipped in transit</text>
<text x="160.0" y="318.0" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">syndrome H r</text>
<text x="170.0" y="318.0" text-anchor="start" fill="#222222" font-size="13">XOR of the columns where r has a 1: 1 ⊕ 3 ⊕ 5 ⊕ 6 ⊕ 7 = 6 = 110 in binary</text>
<text x="170.0" y="344.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">Column 6 of H reads 0,1,1 top to bottom, which is 6 with the low bit first. Flip bit 6.</text>
<text x="360.0" y="385.0" text-anchor="middle" fill="#666666" font-size="12">Syndrome 000 means no error. Any other value is the position of the single error.</text>
