<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Tanner graph of a small erasure code decoded by peeling</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Peeling: Solve the Check With One Unknown, Repeat</text>
<line x1="150.0" y1="272.0" x2="190.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="270.0" y1="272.0" x2="190.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="270.0" y1="272.0" x2="330.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="390.0" y1="272.0" x2="330.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="390.0" y1="272.0" x2="470.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="390.0" y1="272.0" x2="610.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="510.0" y1="272.0" x2="470.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="510.0" y1="272.0" x2="610.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="630.0" y1="272.0" x2="330.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<line x1="630.0" y1="272.0" x2="610.0" y2="118.0" stroke="#868e96" stroke-width="1.5"/>
<circle cx="190.0" cy="100.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="190.0" y="105.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">s1</text>
<text x="190.0" y="72.0" text-anchor="middle" fill="#666666" font-size="12">1010</text>
<circle cx="210.0" cy="80.0" r="10.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="210.0" y="84.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">1</text>
<circle cx="330.0" cy="100.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="330.0" y="105.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">s2</text>
<text x="330.0" y="72.0" text-anchor="middle" fill="#666666" font-size="12">0111</text>
<circle cx="350.0" cy="80.0" r="10.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="84.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">2</text>
<circle cx="470.0" cy="100.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="470.0" y="105.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">s3</text>
<text x="470.0" y="72.0" text-anchor="middle" fill="#666666" font-size="12">1100</text>
<circle cx="490.0" cy="80.0" r="10.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="490.0" y="84.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">4</text>
<circle cx="610.0" cy="100.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="610.0" y="105.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">s4</text>
<text x="610.0" y="72.0" text-anchor="middle" fill="#666666" font-size="12">0001</text>
<circle cx="630.0" cy="80.0" r="10.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="630.0" y="84.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">3</text>
<rect x="132.0" y="272.0" width="36.0" height="36.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="150.0" y="295.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">e1</text>
<text x="150.0" y="326.0" text-anchor="middle" fill="#222222" font-size="12">s1</text>
<text x="150.0" y="344.0" text-anchor="middle" fill="#666666" font-size="12">1010</text>
<rect x="252.0" y="272.0" width="36.0" height="36.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="270.0" y="295.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">e2</text>
<text x="270.0" y="326.0" text-anchor="middle" fill="#222222" font-size="12">s1⊕s2</text>
<text x="270.0" y="344.0" text-anchor="middle" fill="#666666" font-size="12">1101</text>
<rect x="372.0" y="272.0" width="36.0" height="36.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="390.0" y="295.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">e3</text>
<text x="390.0" y="326.0" text-anchor="middle" fill="#222222" font-size="12">s2⊕s3⊕s4</text>
<text x="390.0" y="344.0" text-anchor="middle" fill="#666666" font-size="12">1010</text>
<rect x="492.0" y="272.0" width="36.0" height="36.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="510.0" y="295.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">e4</text>
<text x="510.0" y="326.0" text-anchor="middle" fill="#222222" font-size="12">s3⊕s4</text>
<text x="510.0" y="344.0" text-anchor="middle" fill="#666666" font-size="12">1101</text>
<rect x="612.0" y="272.0" width="36.0" height="36.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="2"/>
<text x="630.0" y="295.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">e5</text>
<text x="630.0" y="326.0" text-anchor="middle" fill="#222222" font-size="12">s2⊕s4</text>
<text x="630.0" y="344.0" text-anchor="middle" fill="#666666" font-size="12">0110</text>
<text x="30.0" y="105.0" text-anchor="start" fill="#666666" font-size="12">source</text>
<text x="30.0" y="295.0" text-anchor="start" fill="#666666" font-size="12">received</text>
<text x="360.0" y="380.0" text-anchor="middle" fill="#d9480f" font-size="12">Order (orange): e1 gives s1. e2 ⊕ s1 gives s2. e5 ⊕ s2 gives s4. e3 ⊕ s2 ⊕ s4 gives s3.</text>
<text x="360.0" y="400.0" text-anchor="middle" fill="#666666" font-size="12">Sparse checks keep each step cheap. LDPC and fountain decoders run this same loop.</text>
</svg>
