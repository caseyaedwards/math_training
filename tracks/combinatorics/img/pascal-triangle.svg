<text x="60.0" y="110.0" text-anchor="middle" fill="#555555" font-size="13">0</text>
<text x="640.0" y="110.0" text-anchor="start" fill="#555555" font-size="13">1 = 2⁰</text>
<text x="60.0" y="158.0" text-anchor="middle" fill="#555555" font-size="13">1</text>
<text x="640.0" y="158.0" text-anchor="start" fill="#555555" font-size="13">2 = 2¹</text>
<text x="60.0" y="206.0" text-anchor="middle" fill="#555555" font-size="13">2</text>
<text x="640.0" y="206.0" text-anchor="start" fill="#555555" font-size="13">4 = 2²</text>
