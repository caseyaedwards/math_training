<text x="640.0" y="350.0" text-anchor="start" fill="#555555" font-size="13">32 = 2⁵</text>
<text x="60.0" y="398.0" text-anchor="middle" fill="#555555" font-size="13">6</text>
<text x="640.0" y="398.0" text-anchor="start" fill="#555555" font-size="13">64 = 2⁶</text>
