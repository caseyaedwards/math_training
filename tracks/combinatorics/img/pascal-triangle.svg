<text x="640.0" y="446.0" text-anchor="start" fill="#555555" font-size="13">128 = 2⁷</text>
<text x="360.0" y="503.0" text-anchor="middle" fill="#222222" font-size="13">Rule: each number is the sum of the two above it. Example: 4 + 6 = 10, so C(4,1) + C(4,2) = C(5,2).</text>
<text x="360.0" y="527.0" text-anchor="middle" fill="#555555" font-size="13">Row 5 gives (a + b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵.</text>
