<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 315" width="640" height="315" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Permutation Slots for 5 Items</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="315" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Filling Slots: 5! and P(5, 3)</text>
<text x="40.0" y="66.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">line up all 5 items: 5!</text>
<rect x="40.0" y="80.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="75.0" y="111.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">5</text>
<text x="75.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">slot 1</text>
<text x="123.0" y="110.0" text-anchor="middle" fill="#222222">×</text>
<rect x="136.0" y="80.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="171.0" y="111.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">4</text>
<text x="171.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">slot 2</text>
<text x="219.0" y="110.0" text-anchor="middle" fill="#222222">×</text>
<rect x="232.0" y="80.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="267.0" y="111.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">3</text>
<text x="267.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">slot 3</text>
<text x="315.0" y="110.0" text-anchor="middle" fill="#222222">×</text>
<rect x="328.0" y="80.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="363.0" y="111.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">2</text>
<text x="363.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">slot 4</text>
<text x="411.0" y="110.0" text-anchor="middle" fill="#222222">×</text>
<rect x="424.0" y="80.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="459.0" y="111.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">1</text>
<text x="459.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">slot 5</text>
<text x="526.0" y="111.0" text-anchor="start" fill="#d9480f" font-weight="bold">= 120</text>
<text x="40.0" y="186.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">order only 3 of the 5: P(5, 3)</text>
<rect x="40.0" y="200.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="75.0" y="231.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">5</text>
<text x="75.0" y="268.0" text-anchor="middle" fill="#555555" font-size="12">slot 1</text>
<text x="123.0" y="230.0" text-anchor="middle" fill="#222222">×</text>
<rect x="136.0" y="200.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="171.0" y="231.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">4</text>
<text x="171.0" y="268.0" text-anchor="middle" fill="#555555" font-size="12">slot 2</text>
<text x="219.0" y="230.0" text-anchor="middle" fill="#222222">×</text>
<rect x="232.0" y="200.0" width="70.0" height="50.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="267.0" y="231.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">3</text>
<text x="267.0" y="268.0" text-anchor="middle" fill="#555555" font-size="12">slot 3</text>
<text x="315.0" y="230.0" text-anchor="middle" fill="#222222"></text>
<rect x="328.0" y="200.0" width="70.0" height="50.0" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="363.0" y="231.0" text-anchor="middle" fill="#555555">—</text>
<text x="363.0" y="268.0" text-anchor="middle" fill="#555555" font-size="12">slot 4</text>
<text x="411.0" y="230.0" text-anchor="middle" fill="#222222"></text>
<rect x="424.0" y="200.0" width="70.0" height="50.0" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="459.0" y="231.0" text-anchor="middle" fill="#555555">—</text>
<text x="459.0" y="268.0" text-anchor="middle" fill="#555555" font-size="12">slot 5</text>
<text x="526.0" y="231.0" text-anchor="start" fill="#d9480f" font-weight="bold">= 60</text>
<text x="320.0" y="302.0" text-anchor="middle" fill="#555555" font-size="13">P(5, 3) = 5!/(5 − 3)! = 120/2 = 60: the product stops early</text>
</svg>
