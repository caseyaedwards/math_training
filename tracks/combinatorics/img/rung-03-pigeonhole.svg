<text x="110.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">k1</text>
<rect x="185.0" y="192.0" width="90.0" height="60.0" rx="4" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="230.0" y="272.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">bucket 1</text>
<text x="230.0" y="228.0" text-anchor="middle" fill="#d9480f" font-size="13">k2, k5</text>
<rect x="305.0" y="192.0" width="90.0" height="60.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
