<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>5 Keys in 4 Hash Buckets</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
<text x="310.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">5 Keys, 4 Buckets: A Collision Is Forced</text>
