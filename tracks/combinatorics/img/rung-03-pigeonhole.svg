<text x="350.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">k3</text>
<rect x="425.0" y="192.0" width="90.0" height="60.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
