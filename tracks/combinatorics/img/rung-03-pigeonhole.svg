<text x="470.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">k4</text>
<text x="310.0" y="305.0" text-anchor="middle" fill="#555555" font-size="13">n + 1 = 5 keys into n = 4 buckets: some bucket holds two keys</text>
