<rect x="349.0" y="60.0" width="52.0" height="32.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="375.0" y="81.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">k4</text>
<rect x="444.0" y="60.0" width="52.0" height="32.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="470.0" y="81.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">k5</text>
<line x1="90.4" y1="94.0" x2="109.2" y2="186.1" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="185.6" y1="93.9" x2="216.7" y2="186.2" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowA)"/>
<line x1="281.2" y1="93.6" x2="347.7" y2="186.7" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="376.4" y1="93.4" x2="467.2" y2="187.1" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="468.2" y1="92.8" x2="245.7" y2="188.4" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowA)"/>
<rect x="65.0" y="192.0" width="90.0" height="60.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
