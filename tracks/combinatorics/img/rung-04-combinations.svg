<text x="110.0" y="290.0" text-anchor="middle" fill="#555555" font-size="13">6 = 3! ordered picks</text>
<ellipse cx="320" cy="160" rx="62" ry="40" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="320.0" y="166.0" text-anchor="middle" fill="#d9480f" font-weight="bold">{A, B, C}</text>
