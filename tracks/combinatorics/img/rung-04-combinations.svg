<text x="420.0" y="90.0" text-anchor="start" fill="#222222" font-size="13">choose 3 of 10 in order:</text>
<text x="420.0" y="115.0" text-anchor="start" fill="#222222" font-weight="bold">10 × 9 × 8 = 720</text>
<text x="420.0" y="160.0" text-anchor="start" fill="#222222" font-size="13">each group of 3 shows up</text>
<text x="420.0" y="180.0" text-anchor="start" fill="#222222" font-size="13">3! = 6 times in that list</text>
<text x="420.0" y="225.0" text-anchor="start" fill="#d9480f" font-weight="bold">groups: 720 / 6 = 120</text>
<text x="420.0" y="255.0" text-anchor="start" fill="#d9480f">C(10, 3) = 120</text>
<text x="350.0" y="336.0" text-anchor="middle" fill="#555555" font-size="13">order matters: count all 720. Order does not matter: divide by 6.</text>
