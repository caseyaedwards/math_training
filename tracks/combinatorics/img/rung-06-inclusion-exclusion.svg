<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Inclusion-Exclusion for Multiples of 2 or 5 up to 100</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">1 to 100: Divisible by 2 or by 5</text>
<rect x="30.0" y="50.0" width="400.0" height="250.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="44.0" y="288.0" text-anchor="start" fill="#555555" font-size="13">1 to 100</text>
<clipPath id="ca"><circle cx="180" cy="180" r="100"/></clipPath>
<circle cx="180.0" cy="180.0" r="100.0" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="290.0" cy="180.0" r="80.0" fill="#f6d5c4" stroke="none" stroke-width="0" clip-path="url(#ca)"/>
<circle cx="180.0" cy="180.0" r="100.0" fill="none" stroke="#222222" stroke-width="1.8"/>
<circle cx="290.0" cy="180.0" r="80.0" fill="none" stroke="#d9480f" stroke-width="1.8"/>
<text x="140.0" y="170.0" text-anchor="middle" fill="#555555" font-size="13">only 2</text>
<text x="140.0" y="194.0" text-anchor="middle" fill="#222222" font-weight="bold">40</text>
<text x="245.0" y="170.0" text-anchor="middle" fill="#555555" font-size="13">both</text>
<text x="245.0" y="194.0" text-anchor="middle" fill="#d9480f" font-weight="bold">10</text>
<text x="335.0" y="170.0" text-anchor="middle" fill="#555555" font-size="13">only 5</text>
<text x="335.0" y="194.0" text-anchor="middle" fill="#222222" font-weight="bold">10</text>
<text x="180.0" y="72.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">A: ÷ 2 (50)</text>
<text x="330.0" y="90.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">B: ÷ 5 (20)</text>
<text x="370.0" y="288.0" text-anchor="middle" fill="#555555" font-size="13">neither: 40</text>
<text x="455.0" y="110.0" text-anchor="start" fill="#222222">|A| = 50</text>
<text x="455.0" y="135.0" text-anchor="start" fill="#222222">|B| = 20</text>
<text x="455.0" y="160.0" text-anchor="start" fill="#222222">|A ∩ B| = 10 (÷ 10)</text>
<text x="455.0" y="200.0" text-anchor="start" fill="#222222" font-weight="bold">|A ∪ B| = 50 + 20 − 10</text>
<text x="455.0" y="225.0" text-anchor="start" fill="#d9480f" font-weight="bold">= 60</text>
<text x="455.0" y="265.0" text-anchor="start" fill="#555555" font-size="13">the 10 in the middle</text>
<text x="455.0" y="285.0" text-anchor="start" fill="#555555" font-size="13">was counted twice</text>
</svg>
