<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Row 6 of Pascal's Triangle Is Symmetric</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="260" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Row 6 Reads the Same Both Ways</text>
<path d="M80,138 C80,48 560,48 560,138" fill="none" stroke="#555555" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M160,138 C160,68 480,68 480,138" fill="none" stroke="#555555" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M240,138 C240,88 400,88 400,138" fill="none" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="80.0" cy="160.0" r="21.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="80.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<text x="80.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 0</text>
<circle cx="160.0" cy="160.0" r="21.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="160.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<text x="160.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 1</text>
<circle cx="240.0" cy="160.0" r="21.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="240.0" y="165.0" text-anchor="middle" fill="#d9480f" font-weight="bold">15</text>
<text x="240.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 2</text>
<circle cx="320.0" cy="160.0" r="21.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="320.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">20</text>
<text x="320.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 3</text>
<circle cx="400.0" cy="160.0" r="21.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="400.0" y="165.0" text-anchor="middle" fill="#d9480f" font-weight="bold">15</text>
<text x="400.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 4</text>
<circle cx="480.0" cy="160.0" r="21.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="480.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<text x="480.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 5</text>
<circle cx="560.0" cy="160.0" r="21.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="560.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<text x="560.0" y="204.0" text-anchor="middle" fill="#555555" font-size="12">k = 6</text>
<text x="320.0" y="238.0" text-anchor="middle" fill="#222222" font-size="13">C(6, 2) = C(6, 4) = 15: keep 2 of 6 is the same as leaving out 4</text>
</svg>
