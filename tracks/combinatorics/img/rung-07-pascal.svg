<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Pascal Rule as Two Kinds of Pairs</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">C(5, 2) = C(4, 1) + C(4, 2): 10 = 4 + 6</text>
<text x="360.0" y="56.0" text-anchor="middle" fill="#555555" font-size="13">all 2-item teams from {1, 2, 3, 4, 5}, split by whether item 5 is on the team</text>
<rect x="30.0" y="80.0" width="230.0" height="220.0" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="145.0" y="104.0" text-anchor="middle" fill="#d9480f" font-weight="bold">contains 5</text>
<rect x="40.0" y="124.0" width="78.0" height="32.0" rx="14" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="79.0" y="145.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">{1, 5}</text>
<rect x="150.0" y="124.0" width="78.0" height="32.0" rx="14" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="189.0" y="145.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">{2, 5}</text>
<rect x="40.0" y="174.0" width="78.0" height="32.0" rx="14" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="79.0" y="195.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">{3, 5}</text>
<rect x="150.0" y="174.0" width="78.0" height="32.0" rx="14" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="189.0" y="195.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">{4, 5}</text>
<text x="145.0" y="252.0" text-anchor="middle" fill="#222222" font-size="13">pick 1 partner from 1-4</text>
<text x="145.0" y="276.0" text-anchor="middle" fill="#d9480f" font-weight="bold">C(4, 1) = 4</text>
<rect x="290.0" y="80.0" width="340.0" height="220.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="460.0" y="104.0" text-anchor="middle" fill="#222222" font-weight="bold">no 5</text>
<rect x="304.0" y="124.0" width="78.0" height="32.0" rx="14" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="343.0" y="145.0" text-anchor="middle" fill="#222222" font-size="13">{1, 2}</text>
<rect x="410.0" y="124.0" width="78.0" height="32.0" rx="14" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="449.0" y="145.0" text-anchor="middle" fill="#222222" font-size="13">{1, 3}</text>
<rect x="516.0" y="124.0" width="78.0" height="32.0" rx="14" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="555.0" y="145.0" text-anchor="middle" fill="#222222" font-size="13">{1, 4}</text>
<rect x="304.0" y="174.0" width="78.0" height="32.0" rx="14" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="343.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13">{2, 3}</text>
<rect x="410.0" y="174.0" width="78.0" height="32.0" rx="14" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="449.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13">{2, 4}</text>
<rect x="516.0" y="174.0" width="78.0" height="32.0" rx="14" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="555.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13">{3, 4}</text>
<text x="460.0" y="252.0" text-anchor="middle" fill="#222222" font-size="13">pick both from 1-4</text>
<text x="460.0" y="276.0" text-anchor="middle" fill="#222222" font-weight="bold">C(4, 2) = 6</text>
<text x="675.0" y="190.0" text-anchor="middle" fill="#d9480f" font-weight="bold">= 10</text>
<text x="360.0" y="335.0" text-anchor="middle" fill="#555555" font-size="13">every team lands in exactly one box, so the counts add</text>
</svg>
