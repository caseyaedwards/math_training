<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Expanding (a + b) Cubed by Choices</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">(a + b)<tspan dy="-7" font-size="12">3</tspan><tspan dy="7">: Pick a or b from Each of 3 Factors</tspan></text>
<text x="100.0" y="64.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0 copies of b</text>
<rect x="66.0" y="80.0" width="68.0" height="32.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="100.0" y="101.0" text-anchor="middle" fill="#222222">aaa</text>
<text x="100.0" y="232.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">C(3, 0) = 1</text>
<text x="100.0" y="258.0" text-anchor="middle" fill="#222222">a<tspan dy="-6" font-size="10">3</tspan></text>
<text x="270.0" y="64.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1 copy of b</text>
<rect x="236.0" y="80.0" width="68.0" height="32.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="270.0" y="101.0" text-anchor="middle" fill="#222222">aab</text>
<rect x="236.0" y="122.0" width="68.0" height="32.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="270.0" y="143.0" text-anchor="middle" fill="#222222">aba</text>
<rect x="236.0" y="164.0" width="68.0" height="32.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="270.0" y="185.0" text-anchor="middle" fill="#222222">baa</text>
<text x="270.0" y="232.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">C(3, 1) = 3</text>
<text x="270.0" y="258.0" text-anchor="middle" fill="#222222">3a<tspan dy="-6" font-size="10">2</tspan><tspan dy="6">b</tspan></text>
<text x="440.0" y="64.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2 copies of b</text>
<rect x="406.0" y="80.0" width="68.0" height="32.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="440.0" y="101.0" text-anchor="middle" fill="#222222">abb</text>
<rect x="406.0" y="122.0" width="68.0" height="32.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="440.0" y="143.0" text-anchor="middle" fill="#222222">bab</text>
<rect x="406.0" y="164.0" width="68.0" height="32.0" rx="4" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="440.0" y="185.0" text-anchor="middle" fill="#222222">bba</text>
<text x="440.0" y="232.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">C(3, 2) = 3</text>
<text x="440.0" y="258.0" text-anchor="middle" fill="#222222">3ab<tspan dy="-6" font-size="10">2</tspan></text>
<text x="600.0" y="64.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3 copies of b</text>
<rect x="566.0" y="80.0" width="68.0" height="32.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="600.0" y="101.0" text-anchor="middle" fill="#222222">bbb</text>
<text x="600.0" y="232.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">C(3, 3) = 1</text>
<text x="600.0" y="258.0" text-anchor="middle" fill="#222222">b<tspan dy="-6" font-size="10">3</tspan></text>
<text x="350.0" y="298.0" text-anchor="middle" fill="#222222" font-weight="bold">a<tspan dy="-6" font-size="10">3</tspan><tspan dy="6"> + 3a</tspan><tspan dy="-6" font-size="10">2</tspan><tspan dy="6">b + 3ab</tspan><tspan dy="-6" font-size="10">2</tspan><tspan dy="6"> + b</tspan><tspan dy="-6" font-size="10">3</tspan><tspan dy="6">:  1 + 3 + 3 + 1 = 8 = 2</tspan><tspan dy="-6" font-size="10">3</tspan><tspan dy="6"> words</tspan></text>
</svg>
