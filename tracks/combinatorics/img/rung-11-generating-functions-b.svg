<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Building (1 + x) Cubed from a Table</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">(1 + x)(1 + 2x + x<tspan dy="-7" font-size="12">2</tspan><tspan dy="7">) = (1 + x)</tspan><tspan dy="-7" font-size="12">3</tspan></text>
<text x="135.0" y="78.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<text x="205.0" y="78.0" text-anchor="middle" fill="#222222" font-weight="bold">2x</text>
<text x="275.0" y="78.0" text-anchor="middle" fill="#222222" font-weight="bold">x<tspan dy="-6" font-size="10">2</tspan></text>
<text x="86.0" y="130.0" text-anchor="end" fill="#222222" font-weight="bold">1</text>
<rect x="100.0" y="90.0" width="70.0" height="70.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="135.0" y="130.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<rect x="170.0" y="90.0" width="70.0" height="70.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="205.0" y="130.0" text-anchor="middle" fill="#222222" font-weight="bold">2x</text>
<rect x="240.0" y="90.0" width="70.0" height="70.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<text x="275.0" y="130.0" text-anchor="middle" fill="#ffffff" font-weight="bold">x<tspan dy="-6" font-size="10">2</tspan></text>
<text x="86.0" y="200.0" text-anchor="end" fill="#222222" font-weight="bold">x</text>
<rect x="100.0" y="160.0" width="70.0" height="70.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="135.0" y="200.0" text-anchor="middle" fill="#222222" font-weight="bold">x</text>
<rect x="170.0" y="160.0" width="70.0" height="70.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<text x="205.0" y="200.0" text-anchor="middle" fill="#ffffff" font-weight="bold">2x<tspan dy="-6" font-size="10">2</tspan></text>
<rect x="240.0" y="160.0" width="70.0" height="70.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="275.0" y="200.0" text-anchor="middle" fill="#222222" font-weight="bold">x<tspan dy="-6" font-size="10">3</tspan></text>
<text x="360.0" y="110.0" text-anchor="start" fill="#222222" font-size="13">collect equal powers:</text>
<text x="360.0" y="140.0" text-anchor="start" fill="#222222" font-size="13">x: 2x + x = 3x  (tint)</text>
<text x="360.0" y="165.0" text-anchor="start" fill="#222222" font-size="13">x<tspan dy="-5" font-size="9">2</tspan><tspan dy="5">: x</tspan><tspan dy="-5" font-size="9">2</tspan><tspan dy="5"> + 2x</tspan><tspan dy="-5" font-size="9">2</tspan><tspan dy="5"> = 3x</tspan><tspan dy="-5" font-size="9">2</tspan><tspan dy="5">  (orange)</tspan></text>
<text x="360.0" y="205.0" text-anchor="start" fill="#d9480f" font-weight="bold">1 + 3x + 3x<tspan dy="-6" font-size="10">2</tspan><tspan dy="6"> + x</tspan><tspan dy="-6" font-size="10">3</tspan></text>
<text x="360.0" y="230.0" text-anchor="start" fill="#555555" font-size="13">coefficients C(3, k): 1, 3, 3, 1</text>
<text x="320.0" y="278.0" text-anchor="middle" fill="#555555" font-size="13">each cell is one way to pick a term from each factor</text>
</svg>
