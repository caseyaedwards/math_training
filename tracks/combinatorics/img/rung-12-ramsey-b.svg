<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Why 6 People Always Work: R(3, 3) = 6</text>
