<path d="M316,80 C370,80 370,190 316,190" fill="none" stroke="#555555" stroke-width="1.4" stroke-dasharray="2,4"/>
<path d="M316,84 C340,90 340,125 316,131" fill="none" stroke="#555555" stroke-width="1.4" stroke-dasharray="2,4"/>
