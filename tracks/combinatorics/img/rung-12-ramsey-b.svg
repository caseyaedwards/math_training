<text x="110.0" y="195.0" text-anchor="middle" fill="#222222" font-weight="bold">v</text>
<circle cx="300.0" cy="80.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="85.0" text-anchor="middle" fill="#222222" font-weight="bold">a</text>
<circle cx="300.0" cy="135.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="140.0" text-anchor="middle" fill="#222222" font-weight="bold">b</text>
<circle cx="300.0" cy="190.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="195.0" text-anchor="middle" fill="#222222" font-weight="bold">c</text>
<circle cx="300.0" cy="245.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="250.0" text-anchor="middle" fill="#222222" font-weight="bold">d</text>
<circle cx="300.0" cy="300.0" r="16.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="305.0" text-anchor="middle" fill="#222222" font-weight="bold">e</text>
<text x="420.0" y="90.0" text-anchor="start" fill="#222222" font-size="13">v has 5 edges in 2 colors,</text>
<text x="420.0" y="110.0" text-anchor="start" fill="#222222" font-size="13">so at least ⌈5/2⌉ = 3 share</text>
<text x="420.0" y="130.0" text-anchor="start" fill="#222222" font-size="13">a color (here a, b, c)</text>
<text x="420.0" y="170.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">look at edges ab, bc, ac:</text>
<text x="420.0" y="195.0" text-anchor="start" fill="#d9480f" font-size="13">one solid → solid triangle with v</text>
<text x="420.0" y="220.0" text-anchor="start" fill="#222222" font-size="13">none solid → abc is all dashed</text>
<text x="420.0" y="260.0" text-anchor="start" fill="#222222" font-size="13">either way a one-color</text>
<text x="420.0" y="280.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">triangle appears</text>
