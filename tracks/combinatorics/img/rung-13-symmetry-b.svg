<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Burnside Count for 4-Bead Necklaces</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Burnside: Average the Fixed Colorings</text>
<rect x="70.0" y="84.0" width="70.0" height="176.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<text x="105.0" y="76.0" text-anchor="middle" fill="#222222" font-weight="bold">16</text>
<text x="105.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13">turn 0°</text>
<rect x="170.0" y="238.0" width="70.0" height="22.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="205.0" y="230.0" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<text x="205.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13">turn 90°</text>
<rect x="270.0" y="216.0" width="70.0" height="44.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="305.0" y="208.0" text-anchor="middle" fill="#222222" font-weight="bold">4</text>
<text x="305.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13">turn 180°</text>
<rect x="370.0" y="238.0" width="70.0" height="22.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="405.0" y="230.0" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<text x="405.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13">turn 270°</text>
<line x1="64.0" y1="260.0" x2="446.0" y2="260.0" stroke="#222222" stroke-width="1.5"/>
<text x="470.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">fixed colorings:</text>
<text x="470.0" y="115.0" text-anchor="start" fill="#222222" font-size="13">0°: all 2<tspan dy="-5" font-size="9">4</tspan><tspan dy="5"> = 16</tspan></text>
<text x="470.0" y="137.0" text-anchor="start" fill="#222222" font-size="13">90°, 270°: all one color, 2</text>
<text x="470.0" y="159.0" text-anchor="start" fill="#222222" font-size="13">180°: opposite beads</text>
<text x="470.0" y="179.0" text-anchor="start" fill="#222222" font-size="13">match, 2<tspan dy="-5" font-size="9">2</tspan><tspan dy="5"> = 4</tspan></text>
<text x="470.0" y="220.0" text-anchor="start" fill="#222222" font-weight="bold">(16 + 2 + 4 + 2) / 4</text>
<text x="470.0" y="245.0" text-anchor="start" fill="#d9480f" font-weight="bold">= 24 / 4 = 6</text>
</svg>
