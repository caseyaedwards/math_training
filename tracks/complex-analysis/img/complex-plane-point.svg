<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The point 3 + 2i, its conjugate and its modulus</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="520" height="440" fill="#ffffff"/>
<text x="260.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">The Complex Plane: z = 3 + 2i</text>
<line x1="100.0" y1="420.0" x2="100.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="160.0" y1="420.0" x2="160.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="220.0" y1="420.0" x2="220.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="280.0" y1="420.0" x2="280.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="340.0" y1="420.0" x2="340.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="400.0" y1="420.0" x2="400.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="420.0" x2="400.0" y2="420.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="360.0" x2="400.0" y2="360.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="300.0" x2="400.0" y2="300.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="240.0" x2="400.0" y2="240.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="180.0" x2="400.0" y2="180.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="120.0" x2="400.0" y2="120.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="60.0" x2="400.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="100.0" y1="240.0" x2="400.0" y2="240.0" stroke="#666666" stroke-width="1.3"/>
<line x1="160.0" y1="420.0" x2="160.0" y2="60.0" stroke="#666666" stroke-width="1.3"/>
<line x1="160.0" y1="240.0" x2="340.0" y2="120.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<line x1="340.0" y1="240.0" x2="340.0" y2="120.0" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="160.0" y1="240.0" x2="340.0" y2="360.0" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahg)"/>
<text x="348.0" y="120.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">z = 3 + 2i</text>
<text x="348.0" y="365.0" text-anchor="start" fill="#666666" font-size="13" font-weight="bold">conjugate 3 - 2i</text>
<text x="244.0" y="172.0" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">|z| = √13 ≈ 3.61</text>
<text x="250.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">real part 3</text>
<text x="346.0" y="184.0" text-anchor="start" fill="#666666" font-size="12">imag 2</text>
<text x="394.0" y="234.0" text-anchor="end" fill="#666666" font-size="12">Re</text>
<text x="166.0" y="72.0" text-anchor="start" fill="#666666" font-size="12">Im</text>
</svg>
