<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Unit circle showing e to the i theta equals cos theta plus i sin theta</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="520" height="440" fill="#ffffff"/>
<text x="260.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Euler Formula: e^(iθ) = cos θ + i sin θ</text>
<line x1="80.0" y1="240.0" x2="440.0" y2="240.0" stroke="#666666" stroke-width="1.5"/>
<line x1="260.0" y1="420.0" x2="260.0" y2="60.0" stroke="#666666" stroke-width="1.5"/>
<circle cx="260.0" cy="240.0" r="120.0" fill="none" stroke="#222222" stroke-width="2"/>
<line x1="260.0" y1="240.0" x2="337.1" y2="148.1" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<line x1="260.0" y1="240.0" x2="337.1" y2="240.0" stroke="#d9480f" stroke-width="4"/>
<line x1="337.1" y1="240.0" x2="337.1" y2="148.1" stroke="#d9480f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="298.6" y="260.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">cos θ</text>
<text x="345.1" y="194.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">sin θ</text>
<text x="345.1" y="142.1" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">e^(iθ)</text>
<path d="M296.0,240.0 L296.0,239.2 L296.0,238.4 L295.9,237.6 L295.9,236.9 L295.8,236.1 L295.7,235.3 L295.6,234.5 L295.5,233.7 L295.3,233.0 L295.1,232.2 L295.0,231.4 L294.8,230.7 L294.6,229.9 L294.3,229.2 L294.1,228.4 L293.8,227.7 L293.6,227.0 L293.3,226.2 L293.0,225.5 L292.6,224.8 L292.3,224.1 L291.9,223.4 L291.6,222.7 L291.2,222.0 L290.8,221.3 L290.4,220.7 L289.9,220.0 L289.5,219.4 L289.0,218.7 L288.6,218.1 L288.1,217.5 L287.6,216.9 L287.1,216.3 L286.5,215.7 L286.0,215.1 L285.5,214.5 L284.9,214.0 L284.3,213.5 L283.7,212.9 L283.1,212.4" fill="none" stroke="#222222" stroke-width="2"/>
<text x="305.6" y="224.4" text-anchor="middle" fill="#222222" font-size="13">θ</text>
<circle cx="140.0" cy="240.0" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="132.0" y="230.0" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">e^(iπ) = -1</text>
<circle cx="260.0" cy="120.0" r="5.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="252.0" y="112.0" text-anchor="end" fill="#222222" font-size="12">e^(iπ/2) = i</text>
<text x="260.0" y="432.0" text-anchor="middle" fill="#666666" font-size="12">θ in radians: walking θ units around the unit circle.</text>
</svg>
