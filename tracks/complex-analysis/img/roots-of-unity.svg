<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The six sixth roots of unity on the unit circle</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="480" height="470" fill="#ffffff"/>
<text x="240.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Roots of Unity: z⁶ = 1</text>
<line x1="60.0" y1="240.0" x2="420.0" y2="240.0" stroke="#666666" stroke-width="1.5"/>
<line x1="240.0" y1="420.0" x2="240.0" y2="60.0" stroke="#666666" stroke-width="1.5"/>
<circle cx="240.0" cy="240.0" r="120.0" fill="none" stroke="#cccccc" stroke-width="1.5"/>
<polygon points="360.0,240.0 300.0,136.1 180.0,136.1 120.0,240.0 180.0,343.9 300.0,343.9" fill="#d9480f" fill-opacity="0.12" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<circle cx="360.0" cy="240.0" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="393.6" y="245.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<circle cx="300.0" cy="136.1" r="6.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="316.8" y="112.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">ω</text>
<circle cx="180.0" cy="136.1" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="163.2" y="112.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">ω²</text>
<circle cx="120.0" cy="240.0" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="86.4" y="245.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">-1</text>
<circle cx="180.0" cy="343.9" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="163.2" y="378.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">ω⁴</text>
<circle cx="300.0" cy="343.9" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="316.8" y="378.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">ω⁵</text>
<text x="240.0" y="455.0" text-anchor="middle" fill="#666666" font-size="12">ω = e^(2πi/6): each root is the last one turned 60°. They add to 0.</text>
</svg>
