<line x1="382.0" y1="390.0" x2="382.0" y2="50.0" stroke="#666666" stroke-width="1.5"/>
<line x1="405.0" y1="390.0" x2="405.0" y2="50.0" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="428.0" y1="390.0" x2="428.0" y2="50.0" stroke="#cccccc" stroke-width="1.5"/>
<circle cx="405.0" cy="245.6" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="417.0" y="250.6" text-anchor="start" fill="#222222" font-size="12">1/2 + 14.135 i</text>
<circle cx="405.0" cy="184.0" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="417.0" y="189.0" text-anchor="start" fill="#222222" font-size="12">1/2 + 21.022 i</text>
<circle cx="405.0" cy="148.3" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="417.0" y="153.3" text-anchor="start" fill="#222222" font-size="12">1/2 + 25.011 i</text>
<circle cx="405.0" cy="99.9" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="417.0" y="104.9" text-anchor="start" fill="#222222" font-size="12">1/2 + 30.425 i</text>
<circle cx="405.0" cy="77.4" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="417.0" y="82.4" text-anchor="start" fill="#222222" font-size="12">1/2 + 32.935 i</text>
<circle cx="290.0" cy="372.1" r="5.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="290.0" y="392.1" text-anchor="middle" fill="#222222" font-size="12">-2</text>
<circle cx="198.0" cy="372.1" r="5.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="198.0" y="392.1" text-anchor="middle" fill="#222222" font-size="12">-4</text>
<circle cx="106.0" cy="372.1" r="5.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="106.0" y="392.1" text-anchor="middle" fill="#222222" font-size="12">-6</text>
<text x="198.0" y="360.1" text-anchor="middle" fill="#666666" font-size="12">trivial zeros</text>
<text x="405.0" y="50.0" text-anchor="middle" fill="#222222" font-size="1"></text>
<text x="376.0" y="286.6" text-anchor="end" fill="#666666" font-size="11">10i</text>
<text x="376.0" y="197.2" text-anchor="end" fill="#666666" font-size="11">20i</text>
<text x="376.0" y="107.7" text-anchor="end" fill="#666666" font-size="11">30i</text>
<text x="221.0" y="148.4" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Riemann Hypothesis:</text>
<text x="221.0" y="166.4" text-anchor="middle" fill="#222222" font-size="12">every nontrivial zero sits</text>
<text x="221.0" y="182.4" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">on the line Re(s) = 1/2</text>
