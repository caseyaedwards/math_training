<text x="380.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">r1</text>
<circle cx="570.0" cy="160.0" r="24.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="570.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">r2</text>
