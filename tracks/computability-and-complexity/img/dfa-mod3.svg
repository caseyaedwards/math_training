<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>DFA that reads binary and tracks the remainder mod 3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">DFA: Is a Binary Number Divisible by 3?</text>
<circle cx="190.0" cy="160.0" r="24.0" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<circle cx="190.0" cy="160.0" r="19.0" fill="none" stroke="#d9480f" stroke-width="1.5"/>
<text x="190.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">r0</text>
