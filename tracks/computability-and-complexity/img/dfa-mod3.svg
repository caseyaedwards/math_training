<text x="285.0" y="207.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<path d="M400.7,147.8 Q475.0,104.0 547.6,146.8" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="475.0" y="123.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0</text>
<path d="M549.3,172.2 Q475.0,216.0 402.4,173.2" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="475.0" y="207.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0</text>
<path d="M178.0,180.0 C150.0,230.0 230.0,230.0 202.0,182.0" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="190.0" y="240.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0</text>
<path d="M558.0,180.0 C530.0,230.0 610.0,230.0 582.0,182.0" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="570.0" y="240.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<text x="380.0" y="66.0" text-anchor="middle" fill="#666666" font-size="13">state r = value read so far, mod 3.  Read bit b: r becomes (2r + b) mod 3</text>
<text x="190.0" y="120.0" text-anchor="middle" fill="#d9480f" font-size="12">accept</text>
<text x="60.0" y="312.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Trace on 1101 (=13):</text>
