<text x="525.0" y="350.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">0</text>
<circle cx="580.0" cy="360.0" r="20.0" fill="#fde4d6" stroke="#222222" stroke-width="2"/>
<text x="580.0" y="365.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">r0</text>
<line x1="602.0" y1="360.0" x2="666.0" y2="360.0" stroke="#222222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="635.0" y="350.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">1</text>
<circle cx="690.0" cy="360.0" r="20.0" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="690.0" y="365.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">r1</text>
<text x="690.0" y="400.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">ends in r1: reject</text>
<text x="250.0" y="400.0" text-anchor="middle" fill="#666666" font-size="12">start</text>
<text x="380.0" y="422.0" text-anchor="middle" fill="#666666" font-size="12">13 = 3 x 4 + 1, remainder 1. Three states remember everything the machine needs.</text>
