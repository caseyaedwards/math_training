<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Three machines with more and more memory</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="840" height="400" fill="#ffffff"/>
<text x="420.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">More Memory, More Power</text>
<rect x="30.0" y="55.0" width="240.0" height="320.0" rx="10" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="150.0" y="82.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">Finite automaton</text>
<text x="150.0" y="102.0" text-anchor="middle" fill="#666666" font-size="13">finite control only</text>
<rect x="120.0" y="120.0" width="60.0" height="40.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="150.0" y="145.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">rules</text>
<text x="150.0" y="260.0" text-anchor="middle" fill="#666666" font-size="13">can decide:</text>
<text x="150.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">divisible by 3, a+b</text>
<text x="150.0" y="310.0" text-anchor="middle" fill="#666666" font-size="13">cannot:</text>
<text x="150.0" y="330.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">a^n b^n</text>
<text x="150.0" y="360.0" text-anchor="middle" fill="#222222" font-size="13">class: regular</text>
<line x1="272.0" y1="215.0" x2="296.0" y2="215.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="300.0" y="55.0" width="240.0" height="320.0" rx="10" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="420.0" y="82.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">Pushdown automaton</text>
<text x="420.0" y="102.0" text-anchor="middle" fill="#666666" font-size="13">control + one stack</text>
<rect x="390.0" y="120.0" width="60.0" height="40.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="420.0" y="145.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">rules</text>
<rect x="470.0" y="160.0" width="34.0" height="24.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="470.0" y="134.0" width="34.0" height="24.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="470.0" y="108.0" width="34.0" height="24.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<line x1="450.0" y1="140.0" x2="468.0" y2="110.0" stroke="#868e96" stroke-width="1.5"/>
<text x="487.0" y="205.0" text-anchor="middle" fill="#666666" font-size="12">stack</text>
<text x="420.0" y="260.0" text-anchor="middle" fill="#666666" font-size="13">can decide:</text>
<text x="420.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">balanced (), a^n b^n</text>
<text x="420.0" y="310.0" text-anchor="middle" fill="#666666" font-size="13">cannot:</text>
<text x="420.0" y="330.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">a^n b^n c^n</text>
<text x="420.0" y="360.0" text-anchor="middle" fill="#222222" font-size="13">class: context-free</text>
<line x1="542.0" y1="215.0" x2="566.0" y2="215.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="570.0" y="55.0" width="240.0" height="320.0" rx="10" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="690.0" y="82.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">Turing machine</text>
<text x="690.0" y="102.0" text-anchor="middle" fill="#666666" font-size="13">control + endless tape</text>
<rect x="660.0" y="120.0" width="60.0" height="40.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="690.0" y="145.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">rules</text>
<rect x="585.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="600.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">1</text>
<rect x="615.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="630.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">0</text>
<rect x="645.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="660.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">_</text>
<rect x="675.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="690.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">1</text>
<rect x="705.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="720.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">_</text>
<rect x="735.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="750.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">0</text>
<rect x="765.0" y="180.0" width="30.0" height="28.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="780.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">1</text>
<line x1="690.0" y1="160.0" x2="690.0" y2="178.0" stroke="#d9480f" stroke-width="2"/>
<text x="800.0" y="222.0" text-anchor="end" fill="#666666" font-size="12">... endless</text>
<text x="690.0" y="260.0" text-anchor="middle" fill="#666666" font-size="13">can decide:</text>
<text x="690.0" y="280.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">anything an algorithm does</text>
<text x="690.0" y="310.0" text-anchor="middle" fill="#666666" font-size="13">cannot:</text>
<text x="690.0" y="330.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">the halting problem</text>
<text x="690.0" y="360.0" text-anchor="middle" fill="#222222" font-size="13">class: decidable</text>
<text x="420.0" y="392.0" text-anchor="middle" fill="#666666" font-size="12">Church-Turing thesis: every step-by-step method a person or computer follows, a Turing machine also follows.</text>
</svg>
