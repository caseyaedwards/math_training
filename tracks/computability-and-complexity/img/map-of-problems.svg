<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Nested classes of problems from regular to undecidable</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
<text x="450.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">The Map of Problems</text>
<rect x="20.0" y="50.0" width="860.0" height="550.0" rx="18" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="36.0" y="72.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">All yes/no problems</text>
<text x="36.0" y="92.0" text-anchor="start" fill="#666666" font-size="13">example: never halts on input x (not even recognizable)</text>
<rect x="50.0" y="120.0" width="800.0" height="470.0" rx="18" fill="#f8f9fa" stroke="#222222" stroke-width="1.6"/>
<text x="66.0" y="142.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Recognizable: a machine says yes when the answer is yes</text>
<text x="66.0" y="162.0" text-anchor="start" fill="#666666" font-size="13">example: HALT: does program P stop on x?</text>
<rect x="80.0" y="190.0" width="740.0" height="390.0" rx="18" fill="#f1f3f5" stroke="#222222" stroke-width="1.6"/>
<text x="96.0" y="212.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Decidable: a machine always answers, yes or no</text>
<text x="96.0" y="232.0" text-anchor="start" fill="#666666" font-size="13">example: truth of + statements about integers (needs 2^2^n time)</text>
<rect x="110.0" y="260.0" width="680.0" height="310.0" rx="18" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="126.0" y="282.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">NP: a yes answer has a short, checkable proof</text>
<rect x="140.0" y="330.0" width="450.0" height="230.0" rx="18" fill="#f1f3f5" stroke="#222222" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="156.0" y="352.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">P: solvable in polynomial time</text>
<text x="156.0" y="372.0" text-anchor="start" fill="#666666" font-size="13">example: sorting, shortest path, 2-SAT, primality</text>
<rect x="160.0" y="400.0" width="330.0" height="150.0" rx="18" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="176.0" y="422.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Context-free: one stack</text>
<text x="176.0" y="442.0" text-anchor="start" fill="#666666" font-size="13">example: balanced parentheses, a^n b^n</text>
<rect x="180.0" y="465.0" width="290.0" height="75.0" rx="18" fill="#f8f9fa" stroke="#222222" stroke-width="1.6"/>
<text x="196.0" y="487.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Regular: finite memory</text>
<text x="196.0" y="507.0" text-anchor="start" fill="#666666" font-size="13">example: a+b, divisible by 3, (a|b)*abb</text>
<rect x="610.0" y="300.0" width="160.0" height="240.0" rx="14" fill="#fde4d6" stroke="#d9480f" stroke-width="2"/>
<text x="690.0" y="324.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">NP-complete</text>
<text x="690.0" y="350.0" text-anchor="middle" fill="#222222" font-size="13">SAT, 3-SAT</text>
<text x="690.0" y="372.0" text-anchor="middle" fill="#222222" font-size="13">subset sum</text>
<text x="690.0" y="394.0" text-anchor="middle" fill="#222222" font-size="13">scheduling</text>
<text x="690.0" y="416.0" text-anchor="middle" fill="#222222" font-size="13">vertex cover</text>
<text x="690.0" y="438.0" text-anchor="middle" fill="#222222" font-size="13">traveling</text>
<text x="690.0" y="460.0" text-anchor="middle" fill="#222222" font-size="13">salesman</text>
<text x="690.0" y="482.0" text-anchor="middle" fill="#222222" font-size="13">(decision forms)</text>
<text x="530.0" y="352.0" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">P = NP?</text>
<text x="530.0" y="372.0" text-anchor="middle" fill="#d9480f" font-size="13">unknown</text>
<text x="530.0" y="390.0" text-anchor="middle" fill="#666666" font-size="12">(dashed edge)</text>
<text x="450.0" y="625.0" text-anchor="middle" fill="#666666" font-size="12">Each box sits inside the next. Moving outward, problems get harder. The halting problem lives outside the decidable box.</text>
</svg>
