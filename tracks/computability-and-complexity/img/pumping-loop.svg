<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Pumping argument: a DFA with 4 states repeats a state while reading aaaa</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="410.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Why a Finite Machine Cannot Count: a^n b^n</text>
<rect x="170.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">a</text>
<rect x="230.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="260.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">a</text>
<rect x="290.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="320.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">a</text>
<rect x="350.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="380.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">a</text>
<rect x="410.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="440.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">b</text>
<rect x="470.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="500.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">b</text>
<rect x="530.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="560.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">b</text>
<rect x="590.0" y="150.0" width="60.0" height="44.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="620.0" y="178.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">b</text>
<text x="158.0" y="178.0" text-anchor="end" fill="#666666" font-size="13">input</text>
<circle cx="170.0" cy="240.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="170.0" y="245.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">q0</text>
<line x1="170.0" y1="196.0" x2="170.0" y2="220.0" stroke="#cccccc" stroke-width="1"/>
<circle cx="230.0" cy="240.0" r="18.0" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<text x="230.0" y="245.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">q1</text>
<line x1="230.0" y1="196.0" x2="230.0" y2="220.0" stroke="#cccccc" stroke-width="1"/>
<circle cx="290.0" cy="240.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="290.0" y="245.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">q2</text>
<line x1="290.0" y1="196.0" x2="290.0" y2="220.0" stroke="#cccccc" stroke-width="1"/>
<circle cx="350.0" cy="240.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="350.0" y="245.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">q3</text>
<line x1="350.0" y1="196.0" x2="350.0" y2="220.0" stroke="#cccccc" stroke-width="1"/>
<circle cx="410.0" cy="240.0" r="18.0" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<text x="410.0" y="245.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">q1</text>
<line x1="410.0" y1="196.0" x2="410.0" y2="220.0" stroke="#cccccc" stroke-width="1"/>
<text x="140.0" y="245.0" text-anchor="end" fill="#666666" font-size="13">state</text>
<path d="M230,148 C230,88 410,88 410,148" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="320.0" y="96.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">loop y = aaa: returns to q1</text>
<text x="410.0" y="62.0" text-anchor="middle" fill="#666666" font-size="13">Machine has p = 4 states. Reading 4 letters visits 5 states, so one repeats (pigeonhole).</text>
<text x="60.0" y="300.0" text-anchor="start" fill="#222222" font-size="13">x y z  (as given)</text>
<text x="260.0" y="300.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">a aaa bbbb</text>
<text x="470.0" y="300.0" text-anchor="start" fill="#222222" font-size="13">a^4 b^4</text>
<text x="570.0" y="300.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">accept, correct</text>
<text x="60.0" y="332.0" text-anchor="start" fill="#222222" font-size="13">x y y z  (pump up)</text>
<text x="260.0" y="332.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">a aaa aaa bbbb</text>
<text x="470.0" y="332.0" text-anchor="start" fill="#222222" font-size="13">a^7 b^4</text>
<text x="570.0" y="332.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">accept, WRONG</text>
<text x="60.0" y="364.0" text-anchor="start" fill="#222222" font-size="13">x z  (pump down)</text>
<text x="260.0" y="364.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">a bbbb</text>
<text x="470.0" y="364.0" text-anchor="start" fill="#222222" font-size="13">a^1 b^4</text>
<text x="570.0" y="364.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">accept, WRONG</text>
<text x="410.0" y="404.0" text-anchor="middle" fill="#666666" font-size="12">Same states, same ending: the machine cannot tell these apart. No DFA decides a^n b^n.</text>
</svg>
