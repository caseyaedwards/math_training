<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Reduction from the halting problem to a config safety question</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Reduction: Halting Hides Inside Config Checks</text>
<rect x="30.0" y="80.0" width="210.0" height="110.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="135.0" y="108.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">HALT question</text>
<text x="135.0" y="132.0" text-anchor="middle" fill="#222222" font-size="13">does program P</text>
<text x="135.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13">halt on input x?</text>
<line x1="242.0" y1="135.0" x2="312.0" y2="135.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="277.0" y="125.0" text-anchor="middle" fill="#666666" font-size="12">build</text>
<rect x="315.0" y="70.0" width="250.0" height="130.0" rx="8" fill="#fde4d6" stroke="#d9480f" stroke-width="2"/>
<text x="440.0" y="98.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">config template C</text>
<text x="440.0" y="122.0" text-anchor="middle" fill="#222222" font-size="13">1. run P on x</text>
<text x="440.0" y="144.0" text-anchor="middle" fill="#222222" font-size="13">2. then set target = prod</text>
<text x="440.0" y="168.0" text-anchor="middle" fill="#666666" font-size="12">(ordinary code, easy to write)</text>
<line x1="567.0" y1="135.0" x2="627.0" y2="135.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<rect x="630.0" y="80.0" width="210.0" height="110.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="735.0" y="108.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">dream validator V</text>
<text x="735.0" y="132.0" text-anchor="middle" fill="#222222" font-size="13">does C ever deploy</text>
<text x="735.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13">to prod?</text>
<text x="430.0" y="240.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">C deploys to prod exactly when P halts on x.</text>
<text x="430.0" y="264.0" text-anchor="middle" fill="#222222" font-size="13">So a perfect V answers HALT. HALT has no decider, so no perfect V exists.</text>
<text x="430.0" y="300.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">Rice: every question about what a program DOES (not how it looks) is undecidable in general.</text>
<text x="430.0" y="340.0" text-anchor="middle" fill="#666666" font-size="12">Way out: restrict the language (no loops, no recursion) or add a step budget and accept 'unknown'.</text>
</svg>
