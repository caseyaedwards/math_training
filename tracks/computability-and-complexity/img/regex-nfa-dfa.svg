<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>NFA and DFA for the regular expression (a|b)*abb</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="820" height="560" fill="#ffffff"/>
<text x="410.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">One Regex, Two Machines: (a|b)*abb</text>
<text x="40.0" y="62.0" text-anchor="start" fill="#666666" font-size="13">NFA: guesses where the final abb starts (a state can have two moves on the same letter)</text>
<circle cx="150.0" cy="160.0" r="24.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="150.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">0</text>
<line x1="86.0" y1="160.0" x2="124.0" y2="160.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="82.0" y="152.0" text-anchor="end" fill="#666666" font-size="12">start</text>
<circle cx="330.0" cy="160.0" r="24.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="330.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<circle cx="510.0" cy="160.0" r="24.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="510.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<circle cx="690.0" cy="160.0" r="24.0" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<circle cx="690.0" cy="160.0" r="19.0" fill="none" stroke="#d9480f" stroke-width="1.5"/>
<text x="690.0" y="165.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<path d="M138.0,140.0 C110.0,90.0 190.0,90.0 162.0,138.0" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="150.0" y="92.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">a, b</text>
<line x1="174.0" y1="160.0" x2="304.0" y2="160.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="240.0" y="153.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">a</text>
<line x1="354.0" y1="160.0" x2="484.0" y2="160.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="420.0" y="153.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">b</text>
<line x1="534.0" y1="160.0" x2="664.0" y2="160.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="600.0" y="153.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">b</text>
<line x1="30.0" y1="245.0" x2="790.0" y2="245.0" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,4"/>
<text x="40.0" y="272.0" text-anchor="start" fill="#666666" font-size="13">DFA from the subset construction: each state is a SET of NFA states</text>
<circle cx="150.0" cy="410.0" r="30.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="150.0" y="415.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">{0}</text>
<line x1="80.0" y1="410.0" x2="118.0" y2="410.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="76.0" y="402.0" text-anchor="end" fill="#666666" font-size="12">start</text>
<circle cx="330.0" cy="410.0" r="30.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="330.0" y="415.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">{0,1}</text>
<circle cx="510.0" cy="410.0" r="30.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="510.0" y="415.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">{0,2}</text>
<circle cx="690.0" cy="410.0" r="30.0" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<circle cx="690.0" cy="410.0" r="25.0" fill="none" stroke="#d9480f" stroke-width="1.5"/>
<text x="690.0" y="415.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">{0,3}</text>
<path d="M138.0,384.0 C110.0,334.0 190.0,334.0 162.0,382.0" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
