<path d="M318.0,384.0 C290.0,334.0 370.0,334.0 342.0,382.0" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="330.0" y="336.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">a</text>
<line x1="180.0" y1="410.0" x2="298.0" y2="410.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="240.0" y="403.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">a</text>
<line x1="360.0" y1="410.0" x2="478.0" y2="410.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="420.0" y="403.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">b</text>
<line x1="540.0" y1="410.0" x2="658.0" y2="410.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="600.0" y="403.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">b</text>
<path d="M485.0,426.6 Q420.0,470.0 356.6,427.8" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="420.0" y="459.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">a</text>
<path d="M663.3,423.7 Q510.0,502.0 358.5,424.6" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="510.0" y="475.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">a</text>
<path d="M665.5,427.3 Q420.0,600.0 176.2,428.4" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="420.0" y="524.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">b</text>
<text x="410.0" y="548.0" text-anchor="middle" fill="#666666" font-size="12">Kleene: regular expressions, NFAs and DFAs describe exactly the same languages.</text>
</svg>
