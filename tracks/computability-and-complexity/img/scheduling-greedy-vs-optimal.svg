<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Greedy longest-first schedule versus optimal for jobs 3,3,2,2,2 on two machines</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
<text x="400.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Scheduling Jobs 3, 3, 2, 2, 2 on Two Machines</text>
<text x="60.0" y="70.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">greedy longest-first: makespan 7</text>
<text x="90.0" y="106.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold">M1</text>
<rect x="100.0" y="82.0" width="180.0" height="34.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="190.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<rect x="280.0" y="82.0" width="120.0" height="34.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="340.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<rect x="400.0" y="82.0" width="120.0" height="34.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="460.0" y="105.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<text x="90.0" y="148.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold">M2</text>
<rect x="100.0" y="124.0" width="180.0" height="34.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="190.0" y="147.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<rect x="280.0" y="124.0" width="120.0" height="34.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="340.0" y="147.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<line x1="520.0" y1="74.0" x2="520.0" y2="170.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="5,4"/>
<text x="526.0" y="84.0" text-anchor="start" fill="#d9480f" font-size="13">done at 7</text>
<text x="60.0" y="190.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">optimal: makespan 6</text>
<text x="90.0" y="226.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold">M1</text>
<rect x="100.0" y="202.0" width="180.0" height="34.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="190.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<rect x="280.0" y="202.0" width="180.0" height="34.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<text x="370.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<text x="90.0" y="268.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold">M2</text>
<rect x="100.0" y="244.0" width="120.0" height="34.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="160.0" y="267.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<rect x="220.0" y="244.0" width="120.0" height="34.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="267.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<rect x="340.0" y="244.0" width="120.0" height="34.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="400.0" y="267.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<line x1="460.0" y1="194.0" x2="460.0" y2="290.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="5,4"/>
<text x="466.0" y="204.0" text-anchor="start" fill="#d9480f" font-size="13">done at 6</text>
<line x1="100.0" y1="300.0" x2="100.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="100.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">0</text>
<line x1="160.0" y1="300.0" x2="160.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="160.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<line x1="220.0" y1="300.0" x2="220.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="220.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">2</text>
<line x1="280.0" y1="300.0" x2="280.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">3</text>
<line x1="340.0" y1="300.0" x2="340.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="340.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">4</text>
<line x1="400.0" y1="300.0" x2="400.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="400.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">5</text>
<line x1="460.0" y1="300.0" x2="460.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="460.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">6</text>
<line x1="520.0" y1="300.0" x2="520.0" y2="305.0" stroke="#222222" stroke-width="1.5"/>
<text x="520.0" y="320.0" text-anchor="middle" fill="#666666" font-size="12">7</text>
<line x1="100.0" y1="300.0" x2="520.0" y2="300.0" stroke="#222222" stroke-width="1.5"/>
<text x="560.0" y="268.0" text-anchor="start" fill="#222222" font-size="13">Greedy is off by 7/6. Graham proved</text>
<text x="560.0" y="288.0" text-anchor="start" fill="#222222" font-size="13">longest-first is always within 4/3.</text>
<text x="560.0" y="308.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">Exact optimum is NP-hard.</text>
</svg>
