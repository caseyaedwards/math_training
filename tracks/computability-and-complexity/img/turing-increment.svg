<text x="540.0" y="180.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Rules (state carry):</text>
<text x="540.0" y="202.0" text-anchor="start" fill="#222222" font-size="13">read 1: write 0, move left, stay carry</text>
<text x="540.0" y="224.0" text-anchor="start" fill="#222222" font-size="13">read 0 or _: write 1, go to halt</text>
<text x="430.0" y="404.0" text-anchor="middle" fill="#666666" font-size="12">A tape that never runs out, a head that reads and writes, a small rule table. That is the whole machine.</text>
