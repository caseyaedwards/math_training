<circle cx="830.0" cy="270.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="830.0" y="275.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">G</text>
<text x="250.0" y="310.0" text-anchor="middle" fill="#222222" font-size="13">take any edge with both ends free, keep both ends, repeat</text>
<text x="660.0" y="310.0" text-anchor="middle" fill="#222222" font-size="13">every edge touches B, C or E</text>
<text x="430.0" y="344.0" text-anchor="middle" fill="#666666" font-size="12">The 3 matching edges share no vertex, so any cover needs 3 vertices. The method takes 6: never more than 2 x optimum.</text>
