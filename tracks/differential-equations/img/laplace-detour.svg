<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Laplace transform turns a differential equation into algebra</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="660" height="250" fill="#ffffff"/>
<text x="330.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Laplace Transform: Detour Through Algebra</text>
<rect x="25.0" y="53.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="110.0" y="76.0" text-anchor="middle" fill="#222222" font-size="13">y' + y = 0</text>
<text x="110.0" y="94.0" text-anchor="middle" fill="#222222" font-size="13">y(0) = 1</text>
<rect x="465.0" y="53.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="550.0" y="85.0" text-anchor="middle" fill="#222222" font-size="13">sY - 1 + Y = 0</text>
<rect x="465.0" y="163.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="550.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13">Y = 1 / (s + 1)</text>
<rect x="25.0" y="163.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="110.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13">y(t) = e^(-t)</text>
<line x1="197.0" y1="80.0" x2="463.0" y2="80.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="330.0" y="70.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">transform L</text>
<line x1="550.0" y1="108.0" x2="550.0" y2="162.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="560.0" y="140.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">solve: algebra</text>
<line x1="463.0" y1="190.0" x2="197.0" y2="190.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="330.0" y="180.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">inverse transform</text>
<line x1="110.0" y1="108.0" x2="110.0" y2="162.0" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<text x="120.0" y="140.0" text-anchor="start" fill="#666666" font-size="12">hard direct route</text>
</svg>
