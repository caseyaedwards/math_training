<text x="445.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">−160°</text>
<text x="735.0" y="148.0" text-anchor="middle" fill="#555555" font-size="12">160°</text>
<text x="435.0" y="195.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Chart V (black) unrolls to another:</text>
