<text x="445.0" y="253.0" text-anchor="middle" fill="#555555" font-size="12">20°</text>
<text x="735.0" y="253.0" text-anchor="middle" fill="#555555" font-size="12">340°</text>
<text x="435.0" y="295.0" text-anchor="start" fill="#555555" font-size="13">Each chart is a flat piece of map.</text>
<text x="435.0" y="313.0" text-anchor="start" fill="#555555" font-size="13">Together they cover every point.</text>
<text x="435.0" y="331.0" text-anchor="start" fill="#555555" font-size="13">Where they overlap, they must agree.</text>
