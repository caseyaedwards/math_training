<text x="389.7" y="102.1" text-anchor="start" fill="#222222" font-size="13">t = π/3</text>
<text x="505.0" y="120.0" text-anchor="start" fill="#555555" font-size="13">position</text>
<text x="505.0" y="138.0" text-anchor="start" fill="#222222" font-size="13">r(t) = (2 cos t, 2 sin t)</text>
