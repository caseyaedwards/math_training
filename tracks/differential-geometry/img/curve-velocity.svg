<text x="505.0" y="240.0" text-anchor="start" fill="#222222" font-size="13">speed = |r′(t)| = 2</text>
<text x="505.0" y="280.0" text-anchor="start" fill="#555555" font-size="13">Velocity is always</text>
<text x="505.0" y="298.0" text-anchor="start" fill="#555555" font-size="13">tangent to the path.</text>
<text x="320.0" y="372.0" text-anchor="middle" fill="#555555" font-size="12">Arrows drawn at half length. The dashed lines are position vectors.</text>
