<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>GPS Clocks Need General Relativity</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
<text x="350.0" y="28.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">GPS Clocks Need General Relativity</text>
<line x1="330.0" y1="60.0" x2="330.0" y2="260.0" stroke="#222222" stroke-width="1.2"/>
<text x="330.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">0</text>
<line x1="278.0" y1="255.0" x2="278.0" y2="262.0" stroke="#222222" stroke-width="1"/>
<text x="278.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">−10</text>
<line x1="278.0" y1="60.0" x2="278.0" y2="255.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="382.0" y1="255.0" x2="382.0" y2="262.0" stroke="#222222" stroke-width="1"/>
<text x="382.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">+10</text>
<line x1="382.0" y1="60.0" x2="382.0" y2="255.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="434.0" y1="255.0" x2="434.0" y2="262.0" stroke="#222222" stroke-width="1"/>
<text x="434.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">+20</text>
<line x1="434.0" y1="60.0" x2="434.0" y2="255.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="486.0" y1="255.0" x2="486.0" y2="262.0" stroke="#222222" stroke-width="1"/>
<text x="486.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">+30</text>
<line x1="486.0" y1="60.0" x2="486.0" y2="255.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="538.0" y1="255.0" x2="538.0" y2="262.0" stroke="#222222" stroke-width="1"/>
<text x="538.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">+40</text>
<line x1="538.0" y1="60.0" x2="538.0" y2="255.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="590.0" y1="255.0" x2="590.0" y2="262.0" stroke="#222222" stroke-width="1"/>
<text x="590.0" y="278.0" text-anchor="middle" fill="#555555" font-size="12">+50</text>
<line x1="590.0" y1="60.0" x2="590.0" y2="255.0" stroke="#eeeeee" stroke-width="1"/>
<rect x="330.0" y="67.0" width="237.6" height="36.0" rx="0" fill="#fde4d6" stroke="#d9480f" stroke-width="1.5"/>
<text x="320.0" y="90.0" text-anchor="end" fill="#222222" font-size="13">gravity (general relativity)</text>
<text x="575.6" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">+45.7 µs/day</text>
<rect x="292.6" y="129.0" width="37.4" height="36.0" rx="0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<text x="284.6" y="152.0" text-anchor="end" fill="#222222" font-size="13">speed (special relativity)</text>
<text x="338.0" y="152.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">−7.2 µs/day</text>
<rect x="330.0" y="191.0" width="200.2" height="36.0" rx="0" fill="#fde4d6" stroke="#d9480f" stroke-width="1.5"/>
<text x="320.0" y="214.0" text-anchor="end" fill="#222222" font-size="13">net drift</text>
<text x="538.2" y="214.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">+38.5 µs/day</text>
<text x="390.0" y="300.0" text-anchor="middle" fill="#555555" font-size="13">microseconds per day, satellite clock versus ground clock</text>
<text x="350.0" y="335.0" text-anchor="middle" fill="#555555" font-size="13">Uncorrected, 38.5 µs/day of clock error is about 11.5 km of position error per day.</text>
</svg>
