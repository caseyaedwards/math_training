<text x="344.2" y="223.1" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">T (tangent)</text>
<line x1="281.3" y1="269.7" x2="213.9" y2="252.2" stroke="#222222" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="205.9" y="256.2" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">N (normal)</text>
<line x1="281.3" y1="269.7" x2="267.6" y2="193.5" stroke="#868e96" stroke-width="2.6" marker-end="url(#ahg)"/>
<text x="275.6" y="187.5" text-anchor="start" fill="#868e96" font-size="13" font-weight="bold">B (binormal)</text>
<circle cx="281.3" cy="269.7" r="5" fill="#d9480f"/>
<text x="420.0" y="90.0" text-anchor="start" fill="#222222" font-weight="bold">(cos t, sin t, 0.25 t)</text>
<text x="420.0" y="130.0" text-anchor="start" fill="#555555" font-size="13">curvature: how fast T turns</text>
<text x="420.0" y="148.0" text-anchor="start" fill="#222222" font-size="13">κ = a / (a² + b²) = 0.941</text>
<text x="420.0" y="188.0" text-anchor="start" fill="#555555" font-size="13">torsion: how fast the curve</text>
<text x="420.0" y="206.0" text-anchor="start" fill="#555555" font-size="13">twists out of its plane</text>
<text x="420.0" y="224.0" text-anchor="start" fill="#222222" font-size="13">τ = b / (a² + b²) = 0.235</text>
<text x="420.0" y="270.0" text-anchor="start" fill="#555555" font-size="13">Flat curve: τ = 0.</text>
<text x="420.0" y="288.0" text-anchor="start" fill="#555555" font-size="13">Same κ and τ everywhere:</text>
<text x="420.0" y="306.0" text-anchor="start" fill="#555555" font-size="13">a helix is the only answer.</text>
</svg>
