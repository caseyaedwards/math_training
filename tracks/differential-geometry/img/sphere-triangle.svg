<text x="420.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Angles: 90° + 90° + 90° = 270°</text>
<text x="420.0" y="120.0" text-anchor="start" fill="#555555" font-size="13">Excess over a flat triangle:</text>
<text x="420.0" y="138.0" text-anchor="start" fill="#222222" font-size="13">270° − 180° = 90° = π/2</text>
<text x="420.0" y="178.0" text-anchor="start" fill="#555555" font-size="13">Area: one eighth of the sphere</text>
<text x="420.0" y="196.0" text-anchor="start" fill="#222222" font-size="13">4πR² / 8 = πR²/2</text>
<text x="420.0" y="236.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">K × area = (1/R²)(πR²/2) = π/2</text>
<text x="420.0" y="276.0" text-anchor="start" fill="#555555" font-size="13">Gauss-Bonnet for a triangle:</text>
<text x="420.0" y="294.0" text-anchor="start" fill="#222222" font-size="13">angle sum − π = total curvature inside</text>
<text x="420.0" y="334.0" text-anchor="start" fill="#555555" font-size="13">Walk south, turn left, walk east,</text>
<text x="420.0" y="352.0" text-anchor="start" fill="#555555" font-size="13">turn left, walk north: you are home.</text>
</svg>
