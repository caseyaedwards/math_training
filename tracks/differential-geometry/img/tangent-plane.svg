<circle cx="319.6" cy="188.9" r="5" fill="#d9480f"/>
<text x="373.4" y="191.2" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">normal n</text>
<text x="450.0" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Grid lines = coordinates</text>
<text x="450.0" y="110.0" text-anchor="start" fill="#555555" font-size="13">u = longitude, v = latitude</text>
<text x="450.0" y="150.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Tangent plane (orange)</text>
<text x="450.0" y="170.0" text-anchor="start" fill="#555555" font-size="13">the flat plane that best</text>
<text x="450.0" y="188.0" text-anchor="start" fill="#555555" font-size="13">matches the surface at P</text>
<text x="450.0" y="228.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Normal n</text>
<text x="450.0" y="248.0" text-anchor="start" fill="#555555" font-size="13">points straight out,</text>
<text x="450.0" y="266.0" text-anchor="start" fill="#555555" font-size="13">at right angles to the plane</text>
<text x="450.0" y="306.0" text-anchor="start" fill="#555555" font-size="13">Zoom in far enough and</text>
<text x="450.0" y="324.0" text-anchor="start" fill="#555555" font-size="13">every smooth surface</text>
<text x="450.0" y="342.0" text-anchor="start" fill="#555555" font-size="13">looks like its tangent plane.</text>
</svg>
