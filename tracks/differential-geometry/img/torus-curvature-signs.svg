<text x="535.0" y="250.0" text-anchor="middle" fill="#555555" font-size="13">slice through the axis</text>
<text x="370.0" y="335.0" text-anchor="middle" fill="#555555" font-size="13">Outside, the surface bends like a ball. Around the hole it bends like a saddle.</text>
<text x="370.0" y="357.0" text-anchor="middle" fill="#555555" font-size="13">Add K over the whole torus and the plus and minus cancel exactly: total 0.</text>
<text x="370.0" y="379.0" text-anchor="middle" fill="#555555" font-size="12">K = cos v / (r (R + r cos v)), v = angle around the tube</text>
