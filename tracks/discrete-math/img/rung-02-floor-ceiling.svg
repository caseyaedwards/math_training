<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Floor Rounds Down, Ceiling Rounds Up</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="250" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Floor Rounds Down, Ceiling Rounds Up</text>
<line x1="35.0" y1="140.0" x2="685.0" y2="140.0" stroke="#222222" stroke-width="1.5"/>
<line x1="50.0" y1="133.0" x2="50.0" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="50.0" y="166.0" text-anchor="middle" fill="#222222">−4</text>
<line x1="118.9" y1="133.0" x2="118.9" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="118.9" y="166.0" text-anchor="middle" fill="#222222">−3</text>
<line x1="187.8" y1="133.0" x2="187.8" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="187.8" y="166.0" text-anchor="middle" fill="#222222">−2</text>
<line x1="256.7" y1="133.0" x2="256.7" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="256.7" y="166.0" text-anchor="middle" fill="#222222">−1</text>
<line x1="325.6" y1="133.0" x2="325.6" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="325.6" y="166.0" text-anchor="middle" fill="#222222">0</text>
<line x1="394.4" y1="133.0" x2="394.4" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="394.4" y="166.0" text-anchor="middle" fill="#222222">1</text>
<line x1="463.3" y1="133.0" x2="463.3" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="463.3" y="166.0" text-anchor="middle" fill="#222222">2</text>
<line x1="532.2" y1="133.0" x2="532.2" y2="147.0" stroke="#222222" stroke-width="1.5"/>
