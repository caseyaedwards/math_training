<line x1="601.1" y1="133.0" x2="601.1" y2="147.0" stroke="#222222" stroke-width="1.5"/>
<text x="601.1" y="166.0" text-anchor="middle" fill="#222222">4</text>
<line x1="670.0" y1="133.0" x2="670.0" y2="147.0" stroke="#222222" stroke-width="1.5"/>
