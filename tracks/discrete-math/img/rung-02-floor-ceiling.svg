<text x="605.1" y="214.0" text-anchor="middle" fill="#222222">⌈10/3⌉ = 4</text>
<circle cx="153.3" cy="140.0" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="153.3" y="78.0" text-anchor="middle" fill="#d9480f" font-weight="bold">−2.5</text>
