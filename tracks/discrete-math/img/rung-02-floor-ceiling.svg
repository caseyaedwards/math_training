<circle cx="555.2" cy="140.0" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="555.2" y="78.0" text-anchor="middle" fill="#d9480f" font-weight="bold">10/3 ≈ 3.33</text>
<path d="M555.2,128 Q543.7,100 536.2,128" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M555.2,128 Q578.1,100 597.1,128" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
