<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Backoff Waits 1 + 2 + 4 + 8 = 16 − 1</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Backoff Waits 1 + 2 + 4 + 8 = 16 − 1</text>
<rect x="64.0" y="70.0" width="32.0" height="40.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="80.0" y="95.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<rect x="96.0" y="70.0" width="64.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="128.0" y="95.0" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<rect x="160.0" y="70.0" width="128.0" height="40.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="224.0" y="95.0" text-anchor="middle" fill="#222222" font-weight="bold">4</text>
<rect x="288.0" y="70.0" width="256.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="416.0" y="95.0" text-anchor="middle" fill="#222222" font-weight="bold">8</text>
<text x="54.0" y="95.0" text-anchor="end" fill="#555555" font-size="13">sum</text>
<rect x="64.0" y="140.0" width="480.0" height="40.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="544.0" y="140.0" width="32.0" height="40.0" rx="0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" stroke-dasharray="4,3"/>
<text x="304.0" y="165.0" text-anchor="middle" fill="#222222">2<tspan dy="-6" font-size="10">4</tspan><tspan dy="6"> = 16 units, minus the last one</tspan></text>
<text x="560.0" y="165.0" text-anchor="middle" fill="#d9480f" font-weight="bold">−1</text>
<line x1="64.0" y1="180.0" x2="64.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="96.0" y1="180.0" x2="96.0" y2="186.0" stroke="#555555" stroke-width="1"/>
