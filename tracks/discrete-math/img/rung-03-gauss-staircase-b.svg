<line x1="160.0" y1="180.0" x2="160.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="192.0" y1="180.0" x2="192.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="224.0" y1="180.0" x2="224.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="256.0" y1="180.0" x2="256.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="288.0" y1="180.0" x2="288.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="320.0" y1="180.0" x2="320.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="352.0" y1="180.0" x2="352.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="384.0" y1="180.0" x2="384.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="416.0" y1="180.0" x2="416.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="448.0" y1="180.0" x2="448.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="480.0" y1="180.0" x2="480.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="512.0" y1="180.0" x2="512.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="544.0" y1="180.0" x2="544.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<line x1="576.0" y1="180.0" x2="576.0" y2="186.0" stroke="#555555" stroke-width="1"/>
<text x="320.0" y="218.0" text-anchor="middle" fill="#222222">Σ r<tspan dy="-6" font-size="10">i</tspan><tspan dy="6"> for i = 0..n−1 equals (r</tspan><tspan dy="-6" font-size="10">n</tspan><tspan dy="6"> − 1)/(r − 1);  with r = 2, n = 4:  (16 − 1)/1 = 15</tspan></text>
</svg>
