<text x="340.0" y="170.0" text-anchor="start" fill="#222222">each column holds n + 1 = 6</text>
<text x="340.0" y="210.0" text-anchor="start" fill="#222222" font-weight="bold">2S = 5 × 6 = 30</text>
<text x="340.0" y="240.0" text-anchor="start" fill="#d9480f" font-weight="bold">S = 30 / 2 = 15</text>
