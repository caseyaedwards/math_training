<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Deploy Order as a Hasse Diagram</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Deploy Order as a Hasse Diagram</text>
<path d="M152,334 C30,300 30,120 72,78" fill="none" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowA)"/>
<text x="98.0" y="205.0" text-anchor="middle" fill="#d9480f" font-size="13">implied</text>
<line x1="186.7" y1="325.1" x2="134.6" y2="266.4" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="213.3" y1="325.1" x2="265.4" y2="266.4" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="133.3" y1="235.1" x2="185.4" y2="176.4" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="266.7" y1="235.1" x2="214.6" y2="176.4" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="186.7" y1="145.1" x2="134.6" y2="86.4" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="213.3" y1="145.1" x2="265.4" y2="86.4" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="156.0" y="324.0" width="88.0" height="32.0" rx="6" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="345.0" text-anchor="middle" fill="#222222" font-weight="bold">db</text>
<rect x="76.0" y="234.0" width="88.0" height="32.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="120.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">auth</text>
<rect x="236.0" y="234.0" width="88.0" height="32.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">cache</text>
<rect x="156.0" y="144.0" width="88.0" height="32.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">api</text>
<rect x="76.0" y="54.0" width="88.0" height="32.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="120.0" y="75.0" text-anchor="middle" fill="#222222" font-weight="bold">web</text>
<rect x="236.0" y="54.0" width="88.0" height="32.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="75.0" text-anchor="middle" fill="#222222" font-weight="bold">worker</text>
<text x="390.0" y="80.0" text-anchor="start" fill="#222222" font-weight="bold">arrow up = must deploy before</text>
<text x="390.0" y="120.0" text-anchor="start" fill="#222222">reflexive: every service ≤ itself</text>
<text x="390.0" y="145.0" text-anchor="start" fill="#555555" font-size="13">(self-loops are left out of the picture)</text>
<text x="390.0" y="180.0" text-anchor="start" fill="#222222">antisymmetric: never both a ≤ b and b ≤ a</text>
<text x="390.0" y="205.0" text-anchor="start" fill="#555555" font-size="13">for different a, b (no cycles)</text>
<text x="390.0" y="240.0" text-anchor="start" fill="#222222">transitive: db ≤ api and api ≤ web</text>
<text x="390.0" y="265.0" text-anchor="start" fill="#d9480f" font-size="13">give db ≤ web (the dashed arrow)</text>
<text x="390.0" y="305.0" text-anchor="start" fill="#222222">auth and cache are incomparable:</text>
<text x="390.0" y="330.0" text-anchor="start" fill="#555555" font-size="13">either one can go first</text>
</svg>
