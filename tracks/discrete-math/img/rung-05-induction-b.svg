<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The Inductive Step Adds One Column</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">The Inductive Step Adds One Column</text>
<rect x="70.0" y="214.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="88.0" y="272.0" text-anchor="middle" fill="#222222">1</text>
<rect x="106.0" y="214.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="106.0" y="178.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="124.0" y="272.0" text-anchor="middle" fill="#222222">2</text>
<rect x="142.0" y="214.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="142.0" y="178.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="142.0" y="142.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="160.0" y="272.0" text-anchor="middle" fill="#222222">3</text>
<rect x="178.0" y="214.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="178.0" y="178.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="178.0" y="142.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<rect x="178.0" y="106.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="196.0" y="272.0" text-anchor="middle" fill="#222222">4</text>
<rect x="214.0" y="214.0" width="36.0" height="36.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<rect x="214.0" y="178.0" width="36.0" height="36.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<rect x="214.0" y="142.0" width="36.0" height="36.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<rect x="214.0" y="106.0" width="36.0" height="36.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<rect x="214.0" y="70.0" width="36.0" height="36.0" rx="0" fill="#d9480f" stroke="#222222" stroke-width="1.2"/>
<text x="232.0" y="272.0" text-anchor="middle" fill="#d9480f" font-weight="bold">5</text>
<text x="160.0" y="296.0" text-anchor="middle" fill="#555555" font-size="13">column heights 1 to 5</text>
<text x="300.0" y="110.0" text-anchor="start" fill="#222222">P(4): 1 + 2 + 3 + 4 = 4 · 5 / 2 = 10</text>
<text x="300.0" y="145.0" text-anchor="start" fill="#d9480f" font-weight="bold">add column k + 1 = 5:</text>
<text x="300.0" y="175.0" text-anchor="start" fill="#d9480f">10 + 5 = 15</text>
<text x="300.0" y="210.0" text-anchor="start" fill="#222222">P(5): 5 · 6 / 2 = 15</text>
<text x="300.0" y="250.0" text-anchor="start" fill="#555555">in general: k(k+1)/2 + (k+1)</text>
<text x="300.0" y="275.0" text-anchor="start" fill="#555555">= (k+1)(k+2)/2</text>
</svg>
