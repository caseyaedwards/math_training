<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Induction as Climbing a Ladder</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Induction as Climbing a Ladder</text>
<line x1="120.0" y1="60.0" x2="120.0" y2="360.0" stroke="#222222" stroke-width="3"/>
<line x1="220.0" y1="60.0" x2="220.0" y2="360.0" stroke="#222222" stroke-width="3"/>
<line x1="120.0" y1="340.0" x2="220.0" y2="340.0" stroke="#d9480f" stroke-width="4"/>
<text x="108.0" y="345.0" text-anchor="end" fill="#d9480f" font-weight="bold">P(1)</text>
<path d="M228,336.0 Q258,316.6666666666667 228,297.3333333333333" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120.0" y1="293.3" x2="220.0" y2="293.3" stroke="#222222" stroke-width="2.5"/>
<text x="108.0" y="298.3" text-anchor="end" fill="#222222">P(2)</text>
<path d="M228,289.3333333333333 Q258,270.0 228,250.66666666666666" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120.0" y1="246.7" x2="220.0" y2="246.7" stroke="#222222" stroke-width="2.5"/>
<text x="108.0" y="251.7" text-anchor="end" fill="#222222">P(3)</text>
<path d="M228,242.66666666666669 Q258,223.33333333333334 228,204.00000000000003" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120.0" y1="200.0" x2="220.0" y2="200.0" stroke="#222222" stroke-width="2.5"/>
<text x="108.0" y="205.0" text-anchor="end" fill="#222222">P(4)</text>
<path d="M228,196.0 Q258,176.66666666666666 228,157.33333333333334" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120.0" y1="153.3" x2="220.0" y2="153.3" stroke="#222222" stroke-width="2.5"/>
<text x="108.0" y="158.3" text-anchor="end" fill="#222222">P(5)</text>
<path d="M228,149.33333333333334 Q258,130.0 228,110.66666666666669" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="120.0" y1="106.7" x2="220.0" y2="106.7" stroke="#222222" stroke-width="2.5"/>
<text x="108.0" y="111.7" text-anchor="end" fill="#222222">P(6)</text>
<text x="90.0" y="74.0" text-anchor="middle" fill="#222222">⋮</text>
<text x="300.0" y="320.0" text-anchor="start" fill="#d9480f" font-weight="bold">base case: you can reach rung 1</text>
<text x="300.0" y="200.0" text-anchor="start" fill="#222222" font-weight="bold">inductive step: from any rung k</text>
<text x="300.0" y="225.0" text-anchor="start" fill="#222222">you can climb to rung k + 1</text>
<text x="300.0" y="110.0" text-anchor="start" fill="#222222">together: you reach every rung</text>
<text x="300.0" y="135.0" text-anchor="start" fill="#555555" font-size="13">P(1) ∧ ∀k (P(k) → P(k+1)) ⇒ ∀n P(n)</text>
</svg>
