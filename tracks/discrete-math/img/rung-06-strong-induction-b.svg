<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Factor Tree for 60</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Factor Tree for 60</text>
<line x1="164.1" y1="97.9" x2="115.9" y2="152.1" stroke="#555555" stroke-width="1.5"/>
<line x1="195.9" y1="97.9" x2="244.1" y2="152.1" stroke="#555555" stroke-width="1.5"/>
<line x1="90.3" y1="191.9" x2="69.7" y2="238.1" stroke="#555555" stroke-width="1.5"/>
<line x1="109.7" y1="191.9" x2="130.3" y2="238.1" stroke="#555555" stroke-width="1.5"/>
<line x1="250.3" y1="191.9" x2="229.7" y2="238.1" stroke="#555555" stroke-width="1.5"/>
<line x1="269.7" y1="191.9" x2="290.3" y2="238.1" stroke="#555555" stroke-width="1.5"/>
<circle cx="180.0" cy="80.0" r="22.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="180.0" y="85.0" text-anchor="middle" fill="#222222" font-weight="bold">60</text>
<circle cx="100.0" cy="170.0" r="22.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="100.0" y="175.0" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<circle cx="260.0" cy="170.0" r="22.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="260.0" y="175.0" text-anchor="middle" fill="#222222" font-weight="bold">10</text>
<circle cx="60.0" cy="260.0" r="22.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="60.0" y="265.0" text-anchor="middle" fill="#d9480f" font-weight="bold">2</text>
<circle cx="140.0" cy="260.0" r="22.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="140.0" y="265.0" text-anchor="middle" fill="#d9480f" font-weight="bold">3</text>
<circle cx="220.0" cy="260.0" r="22.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="220.0" y="265.0" text-anchor="middle" fill="#d9480f" font-weight="bold">2</text>
<circle cx="300.0" cy="260.0" r="22.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="300.0" y="265.0" text-anchor="middle" fill="#d9480f" font-weight="bold">5</text>
<text x="370.0" y="85.0" text-anchor="start" fill="#222222" font-weight="bold">60 = 6 × 10</text>
<text x="370.0" y="120.0" text-anchor="start" fill="#222222">6 and 10 are smaller than 60,</text>
<text x="370.0" y="145.0" text-anchor="start" fill="#222222">but neither one is 59</text>
<text x="370.0" y="180.0" text-anchor="start" fill="#222222">strong induction assumes every</text>
<text x="370.0" y="205.0" text-anchor="start" fill="#222222">smaller case, so both are covered</text>
<text x="370.0" y="250.0" text-anchor="start" fill="#d9480f" font-weight="bold">60 = 2 × 2 × 3 × 5</text>
<text x="370.0" y="275.0" text-anchor="start" fill="#555555" font-size="13">orange circles are primes</text>
</svg>
