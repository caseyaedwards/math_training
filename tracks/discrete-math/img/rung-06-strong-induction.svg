<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Ordinary Induction Versus Strong Induction</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Ordinary Induction Versus Strong Induction</text>
<text x="40.0" y="70.0" text-anchor="start" fill="#222222" font-weight="bold">ordinary: P(k) alone proves P(k+1)</text>
<rect x="40.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="75.0" y="126.0" text-anchor="middle" fill="#222222">P(1)</text>
<rect x="128.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="163.0" y="126.0" text-anchor="middle" fill="#222222">P(2)</text>
<rect x="216.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="251.0" y="126.0" text-anchor="middle" fill="#222222">P(3)</text>
<rect x="304.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="339.0" y="126.0" text-anchor="middle" fill="#222222">...</text>
<rect x="392.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="427.0" y="126.0" text-anchor="middle" fill="#222222">P(k−1)</text>
<rect x="480.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="515.0" y="126.0" text-anchor="middle" fill="#222222">P(k)</text>
<rect x="568.0" y="100.0" width="70.0" height="40.0" rx="4" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="603.0" y="126.0" text-anchor="middle" fill="#d9480f" font-weight="bold">P(k+1)</text>
<path d="M515.0,100 C515.0,78 603.0,78 603.0,98" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40.0" y="188.0" text-anchor="start" fill="#222222" font-weight="bold">strong: P(1), P(2), ..., P(k) together prove P(k+1)</text>
<rect x="40.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="75.0" y="266.0" text-anchor="middle" fill="#222222">P(1)</text>
<rect x="128.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="163.0" y="266.0" text-anchor="middle" fill="#222222">P(2)</text>
<rect x="216.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="251.0" y="266.0" text-anchor="middle" fill="#222222">P(3)</text>
<rect x="304.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="339.0" y="266.0" text-anchor="middle" fill="#222222">...</text>
<rect x="392.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="427.0" y="266.0" text-anchor="middle" fill="#222222">P(k−1)</text>
<rect x="480.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="515.0" y="266.0" text-anchor="middle" fill="#222222">P(k)</text>
<rect x="568.0" y="240.0" width="70.0" height="40.0" rx="4" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="603.0" y="266.0" text-anchor="middle" fill="#d9480f" font-weight="bold">P(k+1)</text>
<path d="M75.0,240 C75.0,198 573.0,198 573.0,238" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrowA)"/>
<path d="M163.0,240 C163.0,203 585.0,203 585.0,238" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrowA)"/>
<path d="M251.0,240 C251.0,208 597.0,208 597.0,238" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrowA)"/>
<path d="M339.0,240 C339.0,213 609.0,213 609.0,238" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrowA)"/>
<path d="M427.0,240 C427.0,218 621.0,218 621.0,238" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrowA)"/>
<path d="M515.0,240 C515.0,223 633.0,223 633.0,238" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrowA)"/>
<text x="360.0" y="312.0" text-anchor="middle" fill="#555555" font-size="13">the step can lean on any earlier case, not only the one just before</text>
</svg>
