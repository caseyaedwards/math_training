<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A Counter Wraps Around</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="345" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">A 3-Bit Counter Wraps Around</text>
<circle cx="170.0" cy="175.0" r="100.0" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="170.0" cy="75.0" r="17.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="170.0" y="80.0" text-anchor="middle" fill="#d9480f" font-weight="bold">0</text>
<text x="170.0" y="41.0" text-anchor="middle" fill="#555555" font-size="12">000</text>
<circle cx="240.7" cy="104.3" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="240.7" y="109.3" text-anchor="middle" fill="#222222">1</text>
<text x="267.6" y="81.4" text-anchor="middle" fill="#555555" font-size="12">001</text>
<circle cx="270.0" cy="175.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="270.0" y="180.0" text-anchor="middle" fill="#222222">2</text>
<text x="308.0" y="179.0" text-anchor="middle" fill="#555555" font-size="12">010</text>
<circle cx="240.7" cy="245.7" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="240.7" y="250.7" text-anchor="middle" fill="#222222">3</text>
<text x="267.6" y="276.6" text-anchor="middle" fill="#555555" font-size="12">011</text>
<circle cx="170.0" cy="275.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="170.0" y="280.0" text-anchor="middle" fill="#222222">4</text>
<text x="170.0" y="317.0" text-anchor="middle" fill="#555555" font-size="12">100</text>
<circle cx="99.3" cy="245.7" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="99.3" y="250.7" text-anchor="middle" fill="#222222">5</text>
<text x="72.4" y="276.6" text-anchor="middle" fill="#555555" font-size="12">101</text>
<circle cx="70.0" cy="175.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="70.0" y="180.0" text-anchor="middle" fill="#222222">6</text>
<text x="32.0" y="179.0" text-anchor="middle" fill="#555555" font-size="12">110</text>
<circle cx="99.3" cy="104.3" r="17.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="99.3" y="109.3" text-anchor="middle" fill="#d9480f" font-weight="bold">7</text>
<text x="72.4" y="81.4" text-anchor="middle" fill="#555555" font-size="12">111</text>
<path d="M131.9,116.3 L133.0,115.6 L134.1,114.9 L135.2,114.3 L136.3,113.7 L137.4,113.1 L138.5,112.5 L139.7,111.9 L140.9,111.4 L142.0,110.8 L143.2,110.3 L144.4,109.8 L145.6,109.4 L146.8,109.0 L148.0,108.5 L149.2,108.1 L150.5,107.8 L151.7,107.4 L152.9,107.1 L154.2,106.8 L155.4,106.5" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrowA)"/>
<text x="170.0" y="180.0" text-anchor="middle" fill="#d9480f" font-weight="bold">7 + 1 = 0</text>
<text x="360.0" y="90.0" text-anchor="start" fill="#222222">3 bits hold 0 to 7: arithmetic mod 2<tspan dy="-6" font-size="10">3</tspan><tspan dy="6"> = 8</tspan></text>
<text x="360.0" y="118.0" text-anchor="start" fill="#555555" font-size="13">111 + 1 = 1000, the top bit falls off</text>
<text x="360.0" y="160.0" text-anchor="start" fill="#222222" font-weight="bold">a 32-bit counter is the same ring</text>
<text x="360.0" y="185.0" text-anchor="start" fill="#222222">with 2<tspan dy="-6" font-size="10">32</tspan><tspan dy="6"> = 4,294,967,296 positions:</tspan></text>
<text x="360.0" y="220.0" text-anchor="start" fill="#d9480f">4,294,967,295 + 1 ≡ 0 (mod 2<tspan dy="-6" font-size="10">32</tspan><tspan dy="6">)</tspan></text>
<text x="360.0" y="260.0" text-anchor="start" fill="#555555" font-size="13">a rate graph that drops to zero</text>
<text x="360.0" y="280.0" text-anchor="start" fill="#555555" font-size="13">often means a counter wrapped</text>
</svg>
