<text x="74.7" y="245.0" text-anchor="middle" fill="#222222" font-size="13">8</text>
<circle cx="60.0" cy="185.0" r="13.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5"/>
<text x="60.0" y="190.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">9</text>
<circle cx="74.7" cy="130.0" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="74.7" y="135.0" text-anchor="middle" fill="#222222" font-size="13">10</text>
<circle cx="115.0" cy="89.7" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="115.0" y="94.7" text-anchor="middle" fill="#222222" font-size="13">11</text>
<text x="170.0" y="181.0" text-anchor="middle" fill="#d9480f" font-weight="bold">+5</text>
<text x="170.0" y="203.0" text-anchor="middle" fill="#555555" font-size="13">from 9</text>
<text x="340.0" y="90.0" text-anchor="start" fill="#222222">9 + 5 = 14</text>
<text x="340.0" y="115.0" text-anchor="start" fill="#d9480f">14 = 1 × 12 + 2, so 14 ≡ 2 (mod 12)</text>
<text x="340.0" y="160.0" text-anchor="start" fill="#222222" font-weight="bold">reduce first, same answer:</text>
<text x="340.0" y="185.0" text-anchor="start" fill="#222222">(9 mod 12) + (5 mod 12) = 14 → 2</text>
<text x="340.0" y="230.0" text-anchor="start" fill="#222222" font-weight="bold">multiplication works the same way:</text>
<text x="340.0" y="255.0" text-anchor="start" fill="#222222">7 × 5 = 35 = 2 × 12 + 11</text>
<text x="340.0" y="280.0" text-anchor="start" fill="#222222">so 7 × 5 ≡ 11 (mod 12)</text>
