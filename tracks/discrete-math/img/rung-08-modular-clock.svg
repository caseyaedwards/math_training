<text x="265.3" y="245.0" text-anchor="middle" fill="#222222" font-size="13">4</text>
<circle cx="225.0" cy="280.3" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="225.0" y="285.3" text-anchor="middle" fill="#222222" font-size="13">5</text>
<circle cx="170.0" cy="295.0" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="170.0" y="300.0" text-anchor="middle" fill="#222222" font-size="13">6</text>
<circle cx="115.0" cy="280.3" r="13.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="115.0" y="285.3" text-anchor="middle" fill="#222222" font-size="13">7</text>
