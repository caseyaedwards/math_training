<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Ordered Pairs Versus Unordered Pairs from 4 Items</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="680" height="330" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Ordered Pairs Versus Unordered Pairs</text>
<text x="64.0" y="110.0" text-anchor="end" fill="#222222" font-weight="bold">A</text>
<text x="105.0" y="70.0" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<rect x="80.0" y="80.0" width="50.0" height="50.0" rx="0" fill="#eeeeee" stroke="#555555" stroke-width="1"/>
<text x="105.0" y="110.0" text-anchor="middle" fill="#555555">—</text>
<rect x="130.0" y="80.0" width="50.0" height="50.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="155.0" y="110.0" text-anchor="middle" fill="#d9480f" font-weight="bold">AB</text>
<rect x="180.0" y="80.0" width="50.0" height="50.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="205.0" y="110.0" text-anchor="middle" fill="#d9480f" font-weight="bold">AC</text>
<rect x="230.0" y="80.0" width="50.0" height="50.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="255.0" y="110.0" text-anchor="middle" fill="#d9480f" font-weight="bold">AD</text>
<text x="64.0" y="160.0" text-anchor="end" fill="#222222" font-weight="bold">B</text>
<text x="155.0" y="70.0" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<rect x="80.0" y="130.0" width="50.0" height="50.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="105.0" y="160.0" text-anchor="middle" fill="#222222">BA</text>
<rect x="130.0" y="130.0" width="50.0" height="50.0" rx="0" fill="#eeeeee" stroke="#555555" stroke-width="1"/>
<text x="155.0" y="160.0" text-anchor="middle" fill="#555555">—</text>
<rect x="180.0" y="130.0" width="50.0" height="50.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="205.0" y="160.0" text-anchor="middle" fill="#d9480f" font-weight="bold">BC</text>
<rect x="230.0" y="130.0" width="50.0" height="50.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="255.0" y="160.0" text-anchor="middle" fill="#d9480f" font-weight="bold">BD</text>
<text x="64.0" y="210.0" text-anchor="end" fill="#222222" font-weight="bold">C</text>
<text x="205.0" y="70.0" text-anchor="middle" fill="#222222" font-weight="bold">C</text>
<rect x="80.0" y="180.0" width="50.0" height="50.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="105.0" y="210.0" text-anchor="middle" fill="#222222">CA</text>
<rect x="130.0" y="180.0" width="50.0" height="50.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="155.0" y="210.0" text-anchor="middle" fill="#222222">CB</text>
<rect x="180.0" y="180.0" width="50.0" height="50.0" rx="0" fill="#eeeeee" stroke="#555555" stroke-width="1"/>
<text x="205.0" y="210.0" text-anchor="middle" fill="#555555">—</text>
<rect x="230.0" y="180.0" width="50.0" height="50.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1"/>
<text x="255.0" y="210.0" text-anchor="middle" fill="#d9480f" font-weight="bold">CD</text>
<text x="64.0" y="260.0" text-anchor="end" fill="#222222" font-weight="bold">D</text>
<text x="255.0" y="70.0" text-anchor="middle" fill="#222222" font-weight="bold">D</text>
<rect x="80.0" y="230.0" width="50.0" height="50.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="105.0" y="260.0" text-anchor="middle" fill="#222222">DA</text>
<rect x="130.0" y="230.0" width="50.0" height="50.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="155.0" y="260.0" text-anchor="middle" fill="#222222">DB</text>
<rect x="180.0" y="230.0" width="50.0" height="50.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="205.0" y="260.0" text-anchor="middle" fill="#222222">DC</text>
<rect x="230.0" y="230.0" width="50.0" height="50.0" rx="0" fill="#eeeeee" stroke="#555555" stroke-width="1"/>
<text x="255.0" y="260.0" text-anchor="middle" fill="#555555">—</text>
<text x="180.0" y="306.0" text-anchor="middle" fill="#555555" font-size="13">row = first pick, column = second pick</text>
<text x="330.0" y="100.0" text-anchor="start" fill="#222222" font-weight="bold">ordered pairs: 4 × 3 = 12</text>
<text x="330.0" y="125.0" text-anchor="start" fill="#555555" font-size="13">(the gray diagonal repeats an item)</text>
<text x="330.0" y="165.0" text-anchor="start" fill="#222222">AB and BA are the same team,</text>
<text x="330.0" y="190.0" text-anchor="start" fill="#222222">so each unordered pair shows up 2! = 2 times</text>
<text x="330.0" y="235.0" text-anchor="start" fill="#d9480f" font-weight="bold">unordered: 12 / 2 = 6 = C(4, 2)</text>
<text x="330.0" y="260.0" text-anchor="start" fill="#555555" font-size="13">the 6 orange cells above the diagonal</text>
<text x="330.0" y="280.0" text-anchor="start" fill="#555555" font-size="13">list them: AB AC AD BC BD CD</text>
</svg>
