<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A Tree with 7 Vertices Has 6 Edges</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">A Tree with 7 Vertices Has 6 Edges</text>
<line x1="200.0" y1="70.0" x2="110.0" y2="160.0" stroke="#555555" stroke-width="2"/>
<text x="141.0" y="117.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">e1</text>
<line x1="200.0" y1="70.0" x2="290.0" y2="160.0" stroke="#555555" stroke-width="2"/>
<text x="259.0" y="117.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">e2</text>
<line x1="110.0" y1="160.0" x2="60.0" y2="250.0" stroke="#555555" stroke-width="2"/>
<text x="71.0" y="207.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">e3</text>
<line x1="110.0" y1="160.0" x2="160.0" y2="250.0" stroke="#555555" stroke-width="2"/>
<text x="149.0" y="207.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">e4</text>
<line x1="290.0" y1="160.0" x2="240.0" y2="250.0" stroke="#555555" stroke-width="2"/>
<text x="251.0" y="207.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">e5</text>
<line x1="290.0" y1="160.0" x2="340.0" y2="250.0" stroke="#555555" stroke-width="2"/>
<text x="329.0" y="207.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">e6</text>
<line x1="178.0" y1="250.0" x2="222.0" y2="250.0" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="5,4"/>
<circle cx="200.0" cy="70.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="75.0" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<circle cx="110.0" cy="160.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="110.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<circle cx="290.0" cy="160.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="290.0" y="165.0" text-anchor="middle" fill="#222222" font-weight="bold">3</text>
<circle cx="60.0" cy="250.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">4</text>
<circle cx="160.0" cy="250.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="160.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">5</text>
<circle cx="240.0" cy="250.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="240.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<circle cx="340.0" cy="250.0" r="17.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="340.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">7</text>
<text x="400.0" y="90.0" text-anchor="start" fill="#222222" font-weight="bold">n = 7 vertices</text>
<text x="400.0" y="115.0" text-anchor="start" fill="#d9480f">n − 1 = 6 edges (e1 to e6)</text>
<text x="400.0" y="160.0" text-anchor="start" fill="#222222">connected, no cycles</text>
<text x="400.0" y="205.0" text-anchor="start" fill="#555555" font-size="13">the dashed edge 5–6 adds</text>
<text x="400.0" y="225.0" text-anchor="start" fill="#555555" font-size="13">a 7th edge and creates the</text>
<text x="400.0" y="245.0" text-anchor="start" fill="#555555" font-size="13">cycle 5–2–1–3–6–5</text>
</svg>
