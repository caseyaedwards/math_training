<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Degrees Add Up to Twice the Edges</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Degrees Add Up to Twice the Edges</text>
<line x1="90.0" y1="120.0" x2="240.0" y2="80.0" stroke="#555555" stroke-width="2"/>
<line x1="90.0" y1="120.0" x2="170.0" y2="250.0" stroke="#555555" stroke-width="2"/>
<line x1="240.0" y1="80.0" x2="170.0" y2="250.0" stroke="#555555" stroke-width="2"/>
<line x1="240.0" y1="80.0" x2="330.0" y2="220.0" stroke="#555555" stroke-width="2"/>
<line x1="170.0" y1="250.0" x2="330.0" y2="220.0" stroke="#555555" stroke-width="2"/>
<line x1="330.0" y1="220.0" x2="430.0" y2="290.0" stroke="#555555" stroke-width="2"/>
<circle cx="90.0" cy="120.0" r="18.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="90.0" y="125.0" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="82.0" y="90.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">deg 2</text>
<circle cx="240.0" cy="80.0" r="18.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="240.0" y="85.0" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="240.0" y="50.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">deg 3</text>
<circle cx="170.0" cy="250.0" r="18.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="170.0" y="255.0" text-anchor="middle" fill="#222222" font-weight="bold">C</text>
<text x="132.0" y="274.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">deg 3</text>
<circle cx="330.0" cy="220.0" r="18.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="330.0" y="225.0" text-anchor="middle" fill="#222222" font-weight="bold">D</text>
<text x="330.0" y="190.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">deg 3</text>
<circle cx="430.0" cy="290.0" r="18.0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="430.0" y="295.0" text-anchor="middle" fill="#222222" font-weight="bold">E</text>
<text x="470.0" y="276.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">deg 1</text>
<text x="480.0" y="90.0" text-anchor="start" fill="#222222" font-weight="bold">6 edges:</text>
<text x="480.0" y="115.0" text-anchor="start" fill="#222222" font-size="13">AB AC BC BD CD DE</text>
<text x="480.0" y="160.0" text-anchor="start" fill="#222222" font-weight="bold">degrees:</text>
<text x="480.0" y="185.0" text-anchor="start" fill="#222222">2 + 3 + 3 + 3 + 1 = 12</text>
<text x="480.0" y="225.0" text-anchor="start" fill="#d9480f" font-weight="bold">12 = 2 × 6</text>
<text x="480.0" y="250.0" text-anchor="start" fill="#555555" font-size="13">each edge has two ends</text>
</svg>
