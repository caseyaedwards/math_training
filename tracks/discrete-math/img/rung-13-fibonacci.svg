<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 398" width="728" height="398" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Fibonacci Squares Tile an 8 by 13 Rectangle</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="728" height="398" fill="#ffffff"/>
<text x="364.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Fibonacci Squares Tile an 8 by 13 Rectangle</text>
<rect x="138.0" y="235.0" width="36.0" height="36.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<rect x="174.0" y="235.0" width="36.0" height="36.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="138.0" y="271.0" width="72.0" height="72.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<rect x="30.0" y="235.0" width="108.0" height="108.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="30.0" y="55.0" width="180.0" height="180.0" rx="0" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<rect x="210.0" y="55.0" width="288.0" height="288.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<path d="M138.0,271.0 A36,36 0 0 1 174.0,235.0 A36,36 0 0 1 210.0,271.0 A72,72 0 0 1 138.0,343.0 A108,108 0 0 1 30.0,235.0 A180,180 0 0 1 210.0,55.0 A288,288 0 0 1 498.0,343.0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<text x="156.0" y="258.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<text x="192.0" y="258.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<text x="174.0" y="312.0" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<text x="84.0" y="294.0" text-anchor="middle" fill="#222222" font-weight="bold">3 × 3</text>
<text x="120.0" y="150.0" text-anchor="middle" fill="#222222" font-weight="bold">5 × 5</text>
<text x="354.0" y="204.0" text-anchor="middle" fill="#222222" font-weight="bold">8 × 8</text>
<text x="518.0" y="95.0" text-anchor="start" fill="#222222" font-size="13">squares: 1, 1, 2, 3, 5, 8</text>
<text x="518.0" y="125.0" text-anchor="start" fill="#222222" font-size="13">each side is the sum</text>
<text x="518.0" y="145.0" text-anchor="start" fill="#222222" font-size="13">of the two before it</text>
<text x="518.0" y="185.0" text-anchor="start" fill="#222222" font-weight="bold">rectangle: 8 × 13</text>
<text x="518.0" y="215.0" text-anchor="start" fill="#d9480f">13 / 8 = 1.625</text>
<text x="518.0" y="240.0" text-anchor="start" fill="#d9480f" font-weight="bold">φ ≈ 1.618</text>
<text x="518.0" y="280.0" text-anchor="start" fill="#555555" font-size="13">orange: quarter circles</text>
<text x="518.0" y="300.0" text-anchor="start" fill="#555555" font-size="13">form a golden spiral</text>
<text x="364.0" y="384.0" text-anchor="middle" fill="#555555" font-size="13">1 + 1 + 4 + 9 + 25 + 64 = 104 = 8 × 13 (the areas add up)</text>
</svg>
