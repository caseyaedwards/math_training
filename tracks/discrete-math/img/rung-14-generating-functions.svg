<text x="620.0" y="158.6" text-anchor="middle" fill="#555555" font-size="13">x<tspan dy="-5" font-size="9">6</tspan></text>
<text x="20.0" y="255.0" text-anchor="start" fill="#222222" font-weight="bold">x/(1 − x − x<tspan dy="-6" font-size="10">2</tspan><tspan dy="6">)</tspan></text>
<text x="20.0" y="277.0" text-anchor="start" fill="#555555" font-size="13">Fibonacci numbers</text>
