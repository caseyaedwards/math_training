<line x1="550.0" y1="215.6" x2="550.0" y2="229.6" stroke="#222222" stroke-width="2"/>
<rect x="528.0" y="229.6" width="44.0" height="40.0" rx="3" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="550.0" y="256.6" text-anchor="middle" fill="#d9480f" font-weight="bold">5</text>
<text x="550.0" y="291.6" text-anchor="middle" fill="#555555" font-size="13">x<tspan dy="-5" font-size="9">5</tspan></text>
<line x1="620.0" y1="212.6" x2="620.0" y2="226.6" stroke="#222222" stroke-width="2"/>
<rect x="598.0" y="226.6" width="44.0" height="40.0" rx="3" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
<text x="620.0" y="253.6" text-anchor="middle" fill="#d9480f" font-weight="bold">8</text>
<text x="620.0" y="288.6" text-anchor="middle" fill="#555555" font-size="13">x<tspan dy="-5" font-size="9">6</tspan></text>
<text x="360.0" y="322.0" text-anchor="middle" fill="#222222" font-size="13">the card on peg x<tspan dy="-5" font-size="9">n</tspan><tspan dy="5"> holds the n-th term of the sequence</tspan></text>
</svg>
