<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Generating Functions as Clotheslines</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">A Generating Function Is a Clothesline</text>
<text x="20.0" y="125.0" text-anchor="start" fill="#222222" font-weight="bold">1/(1 − x)</text>
<text x="20.0" y="147.0" text-anchor="start" fill="#555555" font-size="13">all ones</text>
