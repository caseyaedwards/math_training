<text x="550.0" y="161.6" text-anchor="middle" fill="#555555" font-size="13">x<tspan dy="-5" font-size="9">5</tspan></text>
<line x1="620.0" y1="82.6" x2="620.0" y2="96.6" stroke="#222222" stroke-width="2"/>
<rect x="598.0" y="96.6" width="44.0" height="40.0" rx="3" fill="#f6d5c4" stroke="#222222" stroke-width="1.2"/>
