<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Circuit Breaker State Machine</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<text x="360.0" y="26.0" text-anchor="middle" fill="#222222" font-size="17" font-weight="bold">Circuit Breaker as a State Machine</text>
<line x1="240.0" y1="130.0" x2="505.0" y2="130.0" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowA)"/>
<text x="372.5" y="120.0" text-anchor="middle" fill="#d9480f" font-size="13">failures ≥ threshold</text>
<path d="M570,165.0 C570,240 520,300 437.0,300" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="576.0" y="262.0" text-anchor="start" fill="#222222" font-size="13">timeout expires</text>
<path d="M305.0,300 C235,300 175,250 175,167.0" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="169.0" y="262.0" text-anchor="end" fill="#222222" font-size="13">trial call succeeds</text>
<path d="M390,275.0 C410,200 480,180 509.0,154" fill="none" stroke="#d9480f" stroke-width="1.6" marker-end="url(#arrowA)"/>
<text x="385.0" y="222.0" text-anchor="end" fill="#d9480f" font-size="13">trial call fails</text>
<path d="M145,115.0 C125,55 225,55 205,113.0" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="175.0" y="58.0" text-anchor="middle" fill="#222222" font-size="13">success: stay</text>
<path d="M540,115.0 C520,55 620,55 600,113.0" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="570.0" y="58.0" text-anchor="middle" fill="#222222" font-size="13">requests fail fast</text>
<rect x="110.0" y="115.0" width="130.0" height="50.0" rx="22" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="175.0" y="145.0" text-anchor="middle" fill="#222222" font-weight="bold">Closed</text>
<rect x="505.0" y="115.0" width="130.0" height="50.0" rx="22" fill="#f6d5c4" stroke="#222222" stroke-width="1.8"/>
<text x="570.0" y="145.0" text-anchor="middle" fill="#222222" font-weight="bold">Open</text>
<rect x="305.0" y="275.0" width="130.0" height="50.0" rx="22" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="370.0" y="305.0" text-anchor="middle" fill="#222222" font-weight="bold">Half-Open</text>
<text x="102.0" y="145.0" text-anchor="end" fill="#555555" font-size="12">start state</text>
<text x="360.0" y="362.0" text-anchor="middle" fill="#555555" font-size="13">the state alone decides what happens to the next request</text>
</svg>
