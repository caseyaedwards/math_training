<rect x="304.0" y="331.0" width="46.0" height="46.0" rx="0" fill="#ffffff" stroke="#d9480f" stroke-width="1.8"/>
<text x="327.0" y="359.0" text-anchor="middle" fill="#d9480f" font-weight="bold">L</text>
<text x="390.0" y="110.0" text-anchor="start" fill="#555555" font-size="13">H = halts, L = loops forever</text>
<text x="390.0" y="150.0" text-anchor="start" fill="#222222" font-size="13">suppose a halting decider exists</text>
<text x="390.0" y="172.0" text-anchor="start" fill="#222222" font-size="13">then build D: on input Pi, D does</text>
<text x="390.0" y="194.0" text-anchor="start" fill="#222222" font-size="13">the opposite of the diagonal entry</text>
<text x="390.0" y="236.0" text-anchor="start" fill="#d9480f" font-size="13">D differs from row Pi at column Pi,</text>
<text x="390.0" y="258.0" text-anchor="start" fill="#d9480f" font-size="13">so D is not any row in the table</text>
<text x="390.0" y="300.0" text-anchor="start" fill="#222222" font-size="13">but D is a program, so it must be</text>
<text x="390.0" y="322.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">a row: contradiction</text>
</svg>
