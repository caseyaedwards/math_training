<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The convolution theorem: convolution in time equals multiplication in frequency</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="820" height="340" fill="#ffffff"/>
<text x="410.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Convolution Theorem: Slow Slide = Fast Multiply</text>
<rect x="50.0" y="62.0" width="200.0" height="56.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="150.0" y="86.0" text-anchor="middle" fill="#222222" font-size="14">x and h</text>
<text x="150.0" y="104.0" text-anchor="middle" fill="#222222" font-size="14">(time)</text>
<rect x="570.0" y="62.0" width="200.0" height="56.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="670.0" y="86.0" text-anchor="middle" fill="#222222" font-size="14">x * h</text>
<text x="670.0" y="104.0" text-anchor="middle" fill="#222222" font-size="14">(time)</text>
<rect x="50.0" y="232.0" width="200.0" height="56.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="150.0" y="256.0" text-anchor="middle" fill="#222222" font-size="14">X and H</text>
<text x="150.0" y="274.0" text-anchor="middle" fill="#222222" font-size="14">(frequency)</text>
<rect x="570.0" y="232.0" width="200.0" height="56.0" rx="6" fill="#f1f3f5" stroke="#d9480f" stroke-width="1.5"/>
<text x="670.0" y="256.0" text-anchor="middle" fill="#222222" font-size="14">X · H</text>
<text x="670.0" y="274.0" text-anchor="middle" fill="#222222" font-size="14">(frequency)</text>
<line x1="255.0" y1="90.0" x2="565.0" y2="90.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="410.0" y="78.0" text-anchor="middle" fill="#222222" font-size="13">convolve: N² steps</text>
<line x1="150.0" y1="122.0" x2="150.0" y2="228.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="160.0" y="180.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">FFT</text>
<line x1="255.0" y1="260.0" x2="565.0" y2="260.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="410.0" y="248.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">multiply bin by bin: N steps</text>
<line x1="670.0" y1="228.0" x2="670.0" y2="122.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="680.0" y="180.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">inverse FFT</text>
<text x="410.0" y="320.0" text-anchor="middle" fill="#666666" font-size="13">Orange route: N log N. For long signals and long kernels it wins by a mile.</text>
</svg>
