<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The eight eighth roots of unity used by an 8-point DFT</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="860" height="380" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">DFT Building Blocks: Points Evenly Spaced on a Circle</text>
<line x1="40.0" y1="200.0" x2="360.0" y2="200.0" stroke="#cccccc" stroke-width="1.5"/>
<line x1="200.0" y1="40.0" x2="200.0" y2="360.0" stroke="#cccccc" stroke-width="1.5"/>
<circle cx="200.0" cy="200.0" r="130.0" fill="none" stroke="#222222" stroke-width="1.5"/>
<circle cx="330.0" cy="200.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="360.0" y="205.0" text-anchor="middle" fill="#222222" font-size="13">ω^0</text>
<circle cx="291.9" cy="291.9" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="313.1" y="318.1" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">ω^1</text>
<circle cx="200.0" cy="330.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="200.0" y="365.0" text-anchor="middle" fill="#222222" font-size="13">ω^2</text>
<circle cx="108.1" cy="291.9" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="86.9" y="318.1" text-anchor="middle" fill="#222222" font-size="13">ω^3</text>
<circle cx="70.0" cy="200.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="205.0" text-anchor="middle" fill="#222222" font-size="13">ω^4</text>
<circle cx="108.1" cy="108.1" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="86.9" y="91.9" text-anchor="middle" fill="#222222" font-size="13">ω^5</text>
<circle cx="200.0" cy="70.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="200.0" y="45.0" text-anchor="middle" fill="#222222" font-size="13">ω^6</text>
<circle cx="291.9" cy="108.1" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="313.1" y="91.9" text-anchor="middle" fill="#222222" font-size="13">ω^7</text>
<line x1="200.0" y1="200.0" x2="285.5" y2="285.5" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<rect x="400.0" y="70.0" width="440.0" height="250.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="420.0" y="100.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">ω = e^(−2πi/8): one eighth turn clockwise</text>
<text x="420.0" y="127.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">X[k] = Σ x[t] ω^(kt), t = 0..7</text>
<text x="420.0" y="154.0" text-anchor="start" fill="#222222" font-size="13">for each frequency k, spin the samples</text>
<text x="420.0" y="181.0" text-anchor="start" fill="#222222" font-size="13">by k steps per sample and add them up</text>
<text x="420.0" y="208.0" text-anchor="start" fill="#222222" font-size="13"></text>
<text x="420.0" y="235.0" text-anchor="start" fill="#222222" font-size="13">example: x = [1, 0, −1, 0], N = 4</text>
<text x="420.0" y="262.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">X = [0, 2, 0, 2]</text>
<text x="420.0" y="289.0" text-anchor="start" fill="#222222" font-size="13">bins 1 and 3 light up: one cycle per window</text>
</svg>
