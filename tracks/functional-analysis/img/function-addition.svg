<text x="320.0" y="72.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">f + g</text>
<rect x="600.0" y="90.0" width="240.0" height="170.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="720.0" y="118.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">vector rules hold:</text>
<text x="720.0" y="148.0" text-anchor="middle" fill="#222222" font-size="13">(f + g)(x) = f(x) + g(x)</text>
<text x="720.0" y="174.0" text-anchor="middle" fill="#222222" font-size="13">(2f)(x) = 2 f(x)</text>
<text x="720.0" y="200.0" text-anchor="middle" fill="#222222" font-size="13">zero function: 0 everywhere</text>
<text x="720.0" y="226.0" text-anchor="middle" fill="#222222" font-size="13">f + g = g + f</text>
<text x="430.0" y="345.0" text-anchor="middle" fill="#666666" font-size="13">At x = 0.5: g = 0.75 and f = 0.5 stack to f + g = 1.25. Same at every x.</text>
</svg>
