<text x="645.0" y="118.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">S = [[1, 1], [0, 1]], a shear</text>
<text x="645.0" y="150.0" text-anchor="middle" fill="#222222" font-size="13">S(x, y) = (x + y, y)</text>
<text x="645.0" y="182.0" text-anchor="middle" fill="#222222" font-size="13">‖S‖ = max ‖Sv‖ over ‖v‖ = 1</text>
<text x="645.0" y="206.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">= (1 + √5)/2 ≈ 1.618</text>
<text x="645.0" y="240.0" text-anchor="middle" fill="#666666" font-size="12">bounded operator: a finite worst-case stretch</text>
