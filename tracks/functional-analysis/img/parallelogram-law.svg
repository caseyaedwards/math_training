<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The parallelogram law holds for the L2 norm and fails for the sup norm</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="860" height="340" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Parallelogram Law: the Test for an Inner Product</text>
<polygon points="90.0,270.0 330.0,270.0 420.0,110.0 180.0,110.0" fill="#d9480f" fill-opacity="0.08" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="90.0" y1="270.0" x2="330.0" y2="270.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="90.0" y1="270.0" x2="180.0" y2="110.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="90.0" y1="270.0" x2="420.0" y2="110.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<line x1="180.0" y1="110.0" x2="330.0" y2="270.0" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aha)"/>
<text x="210.0" y="292.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">f</text>
<text x="123.0" y="190.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">g</text>
<text x="360.0" y="170.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">f + g</text>
<text x="275.0" y="220.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">f − g</text>
<text x="260.0" y="62.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">‖f+g‖² + ‖f−g‖² = 2‖f‖² + 2‖g‖² ?</text>
<rect x="470.0" y="90.0" width="370.0" height="180.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="655.0" y="118.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">f = 1, g = x on [0, 1]</text>
<text x="655.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13">L2 norm: 2.6667 = 2.6667</text>
<text x="655.0" y="174.0" text-anchor="middle" fill="#666666" font-size="13">holds: an inner product is behind it</text>
<text x="655.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">sup norm: 5 ≠ 4</text>
<text x="655.0" y="234.0" text-anchor="middle" fill="#666666" font-size="13">fails: no inner product, no angles</text>
<text x="430.0" y="320.0" text-anchor="middle" fill="#666666" font-size="13">Every Hilbert space is a Banach space. Banach spaces such as sup and L1 have length but no angles.</text>
</svg>
