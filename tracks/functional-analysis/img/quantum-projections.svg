<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A quantum state as a unit vector; squared coordinates give measurement probabilities</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="860" height="360" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Quantum State: Squared Coordinates Are Probabilities</text>
<line x1="80.0" y1="287.1" x2="380.0" y2="287.1" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="122.9" y1="330.0" x2="122.9" y2="30.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="337.1" y1="287.1" x2="337.1" y2="291.1" stroke="#222222" stroke-width="1.5"/>
<text x="337.1" y="305.1" text-anchor="middle" fill="#666666" font-size="12">1</text>
<line x1="118.9" y1="72.9" x2="122.9" y2="72.9" stroke="#222222" stroke-width="1.5"/>
<text x="115.9" y="76.9" text-anchor="end" fill="#666666" font-size="12">1</text>
<polyline points="337.1,287.1 337.1,281.5 336.8,275.9 336.5,270.3 336.0,264.7 335.3,259.2 334.5,253.6 333.6,248.1 332.5,242.6 331.2,237.1 329.8,231.7 328.3,226.3 326.7,220.9 324.9,215.6 322.9,210.3 320.8,205.1 318.6,200.0 316.3,194.9 313.8,189.9 311.2,184.9 308.4,180.0 305.6,175.2 302.6,170.4 299.5,165.8 296.2,161.2 292.9,156.7 289.4,152.3 285.8,148.0 282.1,143.8 278.3,139.6 274.4,135.6 270.4,131.7 266.2,127.9 262.0,124.2 257.7,120.6 253.3,117.1 248.8,113.8 244.2,110.5 239.6,107.4 234.8,104.4 230.0,101.6 225.1,98.8 220.1,96.2 215.1,93.7 210.0,91.4 204.9,89.2 199.7,87.1 194.4,85.1 189.1,83.3 183.7,81.7 178.3,80.2 172.9,78.8 167.4,77.5 161.9,76.4 156.4,75.5 150.8,74.7 145.3,74.0 139.7,73.5 134.1,73.2 128.5,72.9 122.9,72.9" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/>
<line x1="122.9" y1="287.1" x2="251.4" y2="115.7" stroke="#d9480f" stroke-width="3" marker-end="url(#aha)"/>
<line x1="251.4" y1="115.7" x2="251.4" y2="287.1" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="251.4" y1="115.7" x2="122.9" y2="115.7" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="259.4" y="109.7" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">ψ = 0.6 e1 + 0.8 e2</text>
<text x="251.4" y="321.1" text-anchor="middle" fill="#222222" font-size="13">0.6</text>
<text x="98.9" y="119.7" text-anchor="middle" fill="#222222" font-size="13">0.8</text>
<text x="347.9" y="321.1" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">e1</text>
<text x="98.9" y="62.1" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">e2</text>
<rect x="440.0" y="70.0" width="400.0" height="230.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="640.0" y="98.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">state: a unit vector in a Hilbert space</text>
<text x="640.0" y="124.0" text-anchor="middle" fill="#222222" font-size="13">‖ψ‖² = 0.36 + 0.64 = 1</text>
<text x="640.0" y="150.0" text-anchor="middle" fill="#222222" font-size="13">measure in basis e1, e2:</text>
<text x="640.0" y="176.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">P(e1) = |&lt;e1, ψ&gt;|² = 0.36</text>
<text x="640.0" y="202.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">P(e2) = |&lt;e2, ψ&gt;|² = 0.64</text>
<text x="640.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">observables: self-adjoint operators</text>
<text x="640.0" y="254.0" text-anchor="middle" fill="#222222" font-size="13">possible results: their eigenvalues</text>
<text x="640.0" y="280.0" text-anchor="middle" fill="#666666" font-size="13">the spectral theorem does the bookkeeping</text>
</svg>
