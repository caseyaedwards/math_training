<line x1="470.0" y1="320.0" x2="580.0" y2="129.5" stroke="#222222" stroke-width="2"/>
<line x1="470.0" y1="320.0" x2="676.7" y2="244.8" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="6 4"/>
<line x1="470.0" y1="320.0" x2="638.5" y2="178.6" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M540.0,320.0 A70,70 0 0 0 505.0,259.4" fill="none" stroke="#222222" stroke-width="1.2"/>
<text x="568.5" y="307.6" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">20°</text>
<text x="505.0" y="241.4" text-anchor="end" fill="#222222" font-size="13">60°</text>
<text x="684.7" y="244.8" text-anchor="start" fill="#d9480f" font-size="13">needs cos 20°</text>
<text x="640.0" y="375.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Trisecting 60° needs cos 20°</text>
