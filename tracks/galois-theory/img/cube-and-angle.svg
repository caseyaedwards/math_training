<text x="100.0" y="345.0" text-anchor="middle" fill="#222222" font-size="13">side 1, volume 1</text>
<polygon points="220.0,320.0 346.0,320.0 346.0,194.0 220.0,194.0" fill="#fff4e6" stroke="#d9480f" stroke-width="1.8"/>
<polygon points="220.0,194.0 276.7,137.3 402.7,137.3 346.0,194.0" fill="#fff4e6" stroke="#d9480f" stroke-width="1.8"/>
<polygon points="346.0,320.0 402.7,263.3 402.7,137.3 346.0,194.0" fill="#fff4e6" stroke="#d9480f" stroke-width="1.8"/>
<text x="283.0" y="345.0" text-anchor="middle" fill="#d9480f" font-size="13">side ∛2 ≈ 1.26, volume 2</text>
<text x="200.0" y="375.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Doubling the cube needs ∛2</text>
