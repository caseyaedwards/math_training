<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Doubling the cube and trisecting 60 degrees</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect x="0" y="0" width="820" height="400" fill="#ffffff"/>
<text x="410.0" y="30.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">Two Greek Problems That Have No Ruler-and-Compass Solution</text>
<polygon points="50.0,320.0 150.0,320.0 150.0,220.0 50.0,220.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
