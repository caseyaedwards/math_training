<text x="90.0" y="86.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Cardano formula for x³ = 15x + 4:</text>
<text x="90.0" y="108.0" text-anchor="start" fill="#222222" font-size="13">x = ∛(2 + 11i) + ∛(2 - 11i)</text>
<text x="90.0" y="128.0" text-anchor="start" fill="#222222" font-size="13">  = (2 + i) + (2 - i)</text>
<text x="90.0" y="148.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">  = 4</text>
<text x="90.0" y="164.0" text-anchor="start" fill="#555555" font-size="12">a detour through √-121</text>
