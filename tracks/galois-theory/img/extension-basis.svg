<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Q(sqrt2) as a two-coordinate space</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect x="0" y="0" width="780" height="420" fill="#ffffff"/>
<text x="390.0" y="30.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">ℚ(√2) Is a Plane: Two Rational Coordinates per Number</text>
<line x1="70.0" y1="256.0" x2="400.0" y2="256.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="152.5" y1="340.0" x2="152.5" y2="60.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="400.0" y="276.0" text-anchor="end" fill="#222222" font-size="13">a (times 1)</text>
<text x="160.5" y="64.0" text-anchor="start" fill="#222222" font-size="13">b (times √2)</text>
<circle cx="97.5" cy="312.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="97.5" cy="256.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="97.5" cy="200.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="97.5" cy="144.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="97.5" cy="88.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<text x="97.5" y="276.0" text-anchor="middle" fill="#222222" font-size="12">-1</text>
<circle cx="152.5" cy="312.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="152.5" cy="256.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="152.5" cy="200.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="152.5" cy="144.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="152.5" cy="88.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="207.5" cy="312.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="207.5" cy="256.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="207.5" cy="200.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="207.5" cy="144.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="207.5" cy="88.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<text x="207.5" y="276.0" text-anchor="middle" fill="#222222" font-size="12">1</text>
<circle cx="262.5" cy="312.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="262.5" cy="256.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="262.5" cy="200.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="262.5" cy="144.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="262.5" cy="88.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<text x="262.5" y="276.0" text-anchor="middle" fill="#222222" font-size="12">2</text>
<circle cx="317.5" cy="312.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="317.5" cy="256.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="317.5" cy="200.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="317.5" cy="144.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<circle cx="317.5" cy="88.0" r="2.5" fill="#868e96" stroke="#868e96" stroke-width="1"/>
<text x="317.5" y="276.0" text-anchor="middle" fill="#222222" font-size="12">3</text>
<text x="144.5" y="316.0" text-anchor="end" fill="#222222" font-size="12">-1</text>
<text x="144.5" y="204.0" text-anchor="end" fill="#222222" font-size="12">1</text>
<text x="144.5" y="148.0" text-anchor="end" fill="#222222" font-size="12">2</text>
<text x="144.5" y="92.0" text-anchor="end" fill="#222222" font-size="12">3</text>
<circle cx="207.5" cy="200.0" r="6.0" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="217.5" y="222.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">1 + √2</text>
<circle cx="317.5" cy="144.0" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="327.5" y="134.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">3 + 2√2</text>
<path d="M215.5,196.0 Q262.5,132.0 308.5,144.0" fill="none" stroke="#d9480f" stroke-width="1.5" marker-end="url(#aha)"/>
<text x="262.5" y="122.0" text-anchor="middle" fill="#d9480f" font-size="13">square it</text>
<text x="235.0" y="380.0" text-anchor="middle" fill="#222222" font-size="13">(1 + √2)² = 1 + 2√2 + 2 = 3 + 2√2</text>
<text x="235.0" y="400.0" text-anchor="middle" fill="#555555" font-size="13">products stay on the grid</text>
<text x="450.0" y="90.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Degree = number of coordinates</text>
<text x="450.0" y="124.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">field</text>
<text x="550.0" y="124.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">basis</text>
<text x="710.0" y="124.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">degree</text>
<line x1="450.0" y1="132.0" x2="760.0" y2="132.0" stroke="#868e96" stroke-width="1"/>
<text x="450.0" y="156.0" text-anchor="start" fill="#222222" font-size="14">ℚ(√2)</text>
<text x="550.0" y="156.0" text-anchor="start" fill="#222222" font-size="14">1, √2</text>
<text x="735.0" y="156.0" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">2</text>
<text x="450.0" y="184.0" text-anchor="start" fill="#222222" font-size="14">ℚ(i)</text>
<text x="550.0" y="184.0" text-anchor="start" fill="#222222" font-size="14">1, i</text>
<text x="735.0" y="184.0" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">2</text>
<text x="450.0" y="212.0" text-anchor="start" fill="#222222" font-size="14">ℚ(∛2)</text>
<text x="550.0" y="212.0" text-anchor="start" fill="#222222" font-size="14">1, ∛2, ∛4</text>
<text x="735.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">3</text>
<text x="450.0" y="240.0" text-anchor="start" fill="#222222" font-size="14">ℚ(√2, √3)</text>
<text x="550.0" y="240.0" text-anchor="start" fill="#222222" font-size="14">1, √2, √3, √6</text>
<text x="735.0" y="240.0" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">4</text>
<text x="450.0" y="290.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Why not just 1, ∛2 for ℚ(∛2)?</text>
<text x="450.0" y="310.0" text-anchor="start" fill="#222222" font-size="13">(∛2)² = ∛4 is in the field, and no</text>
<text x="450.0" y="330.0" text-anchor="start" fill="#222222" font-size="13">rational a, b give a + b·∛2 = ∛4.</text>
</svg>
