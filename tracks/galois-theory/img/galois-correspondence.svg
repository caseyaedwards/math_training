<text x="450.0" y="462.0" text-anchor="middle" fill="#555555" font-size="13">Each field sits in the same spot as the subgroup that fixes it. Big field, small group.</text>
<text x="450.0" y="482.0" text-anchor="middle" fill="#555555" font-size="13">σ flips √2, τ flips √3. Every edge has degree 2 on the left and index 2 on the right.</text>
<text x="220.0" y="60.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">intermediate fields</text>
<text x="680.0" y="60.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">subgroups that fix them</text>
<text x="98.0" y="292.0" text-anchor="end" fill="#d9480f" font-size="13" font-weight="bold">fixed by τ</text>
<text x="560.0" y="292.0" text-anchor="end" fill="#d9480f" font-size="13" font-weight="bold">fixes ℚ(√2)</text>
