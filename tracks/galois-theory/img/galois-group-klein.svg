<text x="702.0" y="255.0" text-anchor="middle" fill="#222222" font-size="14">τ</text>
<rect x="506.0" y="278.0" width="56.0" height="56.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
