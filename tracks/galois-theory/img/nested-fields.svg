<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Nested number fields Q inside Q(sqrt2) inside R inside C</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<text x="380.0" y="30.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">Fields Nest Like Directories</text>
<rect x="20.0" y="60.0" width="540.0" height="360.0" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="30.0" y="82.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">ℂ  complex numbers</text>
<rect x="40.0" y="100.0" width="400.0" height="300.0" rx="10" fill="#f8f9fa" stroke="#222222" stroke-width="1.5"/>
<text x="50.0" y="122.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">ℝ  real numbers</text>
<rect x="60.0" y="140.0" width="270.0" height="240.0" rx="10" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="70.0" y="162.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">ℚ(√2)  a + b√2</text>
<rect x="80.0" y="180.0" width="140.0" height="180.0" rx="10" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
<text x="90.0" y="202.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">ℚ  fractions</text>
<text x="150.0" y="240.0" text-anchor="middle" fill="#222222" font-size="15">1/2</text>
<text x="150.0" y="274.0" text-anchor="middle" fill="#222222" font-size="15">-3</text>
<text x="150.0" y="308.0" text-anchor="middle" fill="#222222" font-size="15">7</text>
<text x="150.0" y="342.0" text-anchor="middle" fill="#222222" font-size="15">0.75</text>
<text x="275.0" y="240.0" text-anchor="middle" fill="#222222" font-size="15">√2</text>
<text x="275.0" y="274.0" text-anchor="middle" fill="#222222" font-size="15">1 + 3√2</text>
<text x="275.0" y="308.0" text-anchor="middle" fill="#222222" font-size="15">1/(1+√2)</text>
<text x="385.0" y="240.0" text-anchor="middle" fill="#222222" font-size="15">π</text>
<text x="385.0" y="274.0" text-anchor="middle" fill="#222222" font-size="15">∛2</text>
<text x="385.0" y="308.0" text-anchor="middle" fill="#222222" font-size="15">e</text>
<text x="500.0" y="240.0" text-anchor="middle" fill="#222222" font-size="15">i</text>
<text x="500.0" y="274.0" text-anchor="middle" fill="#222222" font-size="15">2 - 3i</text>
<text x="500.0" y="308.0" text-anchor="middle" fill="#222222" font-size="15">√-5</text>
<text x="575.0" y="80.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">A field is a set where</text>
<text x="575.0" y="102.0" text-anchor="start" fill="#222222" font-size="13">+  -  ×  ÷ (not by 0)</text>
<text x="575.0" y="122.0" text-anchor="start" fill="#222222" font-size="13">always land back</text>
<text x="575.0" y="142.0" text-anchor="start" fill="#222222" font-size="13">inside the set.</text>
<text x="575.0" y="180.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">Not a field:</text>
<text x="575.0" y="202.0" text-anchor="start" fill="#222222" font-size="13">integers ℤ, since</text>
<text x="575.0" y="222.0" text-anchor="start" fill="#222222" font-size="13">1 ÷ 2 leaves ℤ.</text>
<text x="575.0" y="270.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Also a field:</text>
<text x="575.0" y="292.0" text-anchor="start" fill="#222222" font-size="13">ℚ(i) = {a + bi},</text>
<text x="575.0" y="312.0" text-anchor="start" fill="#222222" font-size="13">inside ℂ but not</text>
<text x="575.0" y="332.0" text-anchor="start" fill="#222222" font-size="13">inside ℝ.</text>
</svg>
