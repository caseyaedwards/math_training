<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Fifth roots of unity on the unit circle</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
<text x="360.0" y="30.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">Fifth Roots of Unity: z Goes to z²</text>
<line x1="50.0" y1="250.0" x2="450.0" y2="250.0" stroke="#868e96" stroke-width="1" marker-end="url(#ah)"/>
<line x1="250.0" y1="440.0" x2="250.0" y2="50.0" stroke="#868e96" stroke-width="1" marker-end="url(#ah)"/>
<circle cx="250.0" cy="250.0" r="160.0" fill="none" stroke="#222222" stroke-width="1.5"/>
<polygon points="410.0,250.0 299.4,97.8 120.6,156.0 120.6,344.0 299.4,402.2" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M292.2,104.7 Q224.0,170.0 132.4,157.6" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<path d="M127.3,163.3 Q224.0,268.9 293.5,391.7" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<path d="M292.2,395.3 Q224.0,330.0 132.4,342.4" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<path d="M127.3,336.7 Q224.0,231.1 293.5,108.3" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#aha)"/>
<circle cx="410.0" cy="250.0" r="6.0" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="424.0" y="240.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<circle cx="299.4" cy="97.8" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="306.9" y="80.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">z</text>
<circle cx="120.6" cy="156.0" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="101.1" y="146.8" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">z²</text>
<circle cx="120.6" cy="344.0" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="101.1" y="363.2" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">z³</text>
<circle cx="299.4" cy="402.2" r="6.0" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="306.9" y="430.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">z⁴</text>
<text x="420.0" y="274.0" text-anchor="start" fill="#555555" font-size="12">1 stays fixed</text>
<text x="470.0" y="100.0" text-anchor="start" fill="#222222" font-size="13">z = cos 72° + i sin 72°</text>
<text x="470.0" y="122.0" text-anchor="start" fill="#222222" font-size="13">z⁵ = 1, and z ≠ 1</text>
<text x="470.0" y="160.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">σ: z → z²</text>
<text x="470.0" y="184.0" text-anchor="start" fill="#222222" font-size="13">z → z² → z⁴ → z³ → z</text>
<text x="470.0" y="206.0" text-anchor="start" fill="#222222" font-size="13">four steps to return home</text>
<text x="470.0" y="244.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Galois group:</text>
<text x="470.0" y="266.0" text-anchor="start" fill="#222222" font-size="13">cyclic of order 4</text>
<text x="470.0" y="288.0" text-anchor="start" fill="#222222" font-size="13">= units mod 5 under ×</text>
<text x="470.0" y="326.0" text-anchor="start" fill="#555555" font-size="13">Abelian (order of moves</text>
<text x="470.0" y="346.0" text-anchor="start" fill="#555555" font-size="13">never matters), the kind</text>
<text x="470.0" y="366.0" text-anchor="start" fill="#555555" font-size="13">radicals produce.</text>
</svg>
