<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<text x="480.0" y="30.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">Splitting Field of x³ - 2: Six Symmetries</text>
