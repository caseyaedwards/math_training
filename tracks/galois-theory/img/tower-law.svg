<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Tower law: degrees multiply up a tower of fields</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="380.0" y="30.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">Tower Law: Degrees Multiply</text>
<rect x="115.0" y="353.0" width="170.0" height="34.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="375.0" text-anchor="middle" fill="#222222" font-size="14">ℚ</text>
<text x="300.0" y="375.0" text-anchor="start" fill="#555555" font-size="12">basis 1</text>
<rect x="115.0" y="223.0" width="170.0" height="34.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200.0" y="245.0" text-anchor="middle" fill="#222222" font-size="14">ℚ(√2)</text>
<text x="300.0" y="245.0" text-anchor="start" fill="#555555" font-size="12">basis 1, √2</text>
<rect x="115.0" y="93.0" width="170.0" height="34.0" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="200.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14">ℚ(√2, √3)</text>
<text x="300.0" y="115.0" text-anchor="start" fill="#555555" font-size="12">1, √2, √3, √6</text>
<line x1="200.0" y1="353.0" x2="200.0" y2="257.0" stroke="#222222" stroke-width="2"/>
<text x="188.0" y="310.0" text-anchor="end" fill="#222222" font-size="16" font-weight="bold">2</text>
<line x1="200.0" y1="223.0" x2="200.0" y2="127.0" stroke="#222222" stroke-width="2"/>
<text x="188.0" y="180.0" text-anchor="end" fill="#222222" font-size="16" font-weight="bold">2</text>
<path d="M90.0,370.0 L80.0,370.0 L80.0,110.0 L90.0,110.0" fill="none" stroke="#d9480f" stroke-width="2"/>
<text x="72.0" y="245.0" text-anchor="end" fill="#d9480f" font-size="16" font-weight="bold">2 × 2 = 4</text>
<rect x="475.0" y="353.0" width="170.0" height="34.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="560.0" y="375.0" text-anchor="middle" fill="#222222" font-size="14">ℚ</text>
<text x="660.0" y="375.0" text-anchor="start" fill="#555555" font-size="12">basis 1</text>
<rect x="475.0" y="223.0" width="170.0" height="34.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="560.0" y="245.0" text-anchor="middle" fill="#222222" font-size="14">ℚ(∛2)</text>
<text x="660.0" y="245.0" text-anchor="start" fill="#555555" font-size="12">1, ∛2, ∛4</text>
<rect x="475.0" y="93.0" width="170.0" height="34.0" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="560.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14">ℚ(∛2, ω)</text>
<text x="660.0" y="115.0" text-anchor="start" fill="#555555" font-size="12">6 basis numbers</text>
<line x1="560.0" y1="353.0" x2="560.0" y2="257.0" stroke="#222222" stroke-width="2"/>
<text x="548.0" y="310.0" text-anchor="end" fill="#222222" font-size="16" font-weight="bold">3</text>
<line x1="560.0" y1="223.0" x2="560.0" y2="127.0" stroke="#222222" stroke-width="2"/>
<text x="548.0" y="180.0" text-anchor="end" fill="#222222" font-size="16" font-weight="bold">2</text>
<path d="M450.0,370.0 L440.0,370.0 L440.0,110.0 L450.0,110.0" fill="none" stroke="#d9480f" stroke-width="2"/>
<text x="432.0" y="245.0" text-anchor="end" fill="#d9480f" font-size="16" font-weight="bold">3 × 2 = 6</text>
<text x="380.0" y="420.0" text-anchor="middle" fill="#555555" font-size="13">ω = (-1 + √-3)/2, a cube root of 1. Each step multiplies the count of coordinates.</text>
</svg>
