<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Braess paradox: adding a free road slows every driver</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
<text x="400.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Braess Paradox: A New Road Makes Every Trip Slower</text>
<line x1="86.3" y1="178.4" x2="192.1" y2="102.8" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="112.0" y="132.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">T/100</text>
<line x1="226.3" y1="101.6" x2="332.1" y2="177.2" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="302.0" y="132.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">45</text>
<line x1="86.3" y1="201.6" x2="192.1" y2="277.2" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="118.0" y="260.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">45</text>
<line x1="226.3" y1="278.4" x2="332.1" y2="202.8" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="310.0" y="260.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">T/100</text>
<circle cx="70.0" cy="190.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="70.0" y="195.0" text-anchor="middle" fill="#222222" font-weight="bold">S</text>
<circle cx="210.0" cy="90.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="210.0" y="95.0" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<circle cx="210.0" cy="290.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="210.0" y="295.0" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<circle cx="350.0" cy="190.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="350.0" y="195.0" text-anchor="middle" fill="#222222" font-weight="bold">E</text>
<line x1="486.3" y1="178.4" x2="592.1" y2="102.8" stroke="#d9480f" stroke-width="3" marker-end="url(#aha)"/>
<text x="512.0" y="132.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">T/100</text>
<line x1="626.3" y1="101.6" x2="732.1" y2="177.2" stroke="#868e96" stroke-width="2" marker-end="url(#ahg)"/>
<text x="702.0" y="132.0" text-anchor="middle" fill="#868e96" font-size="13" font-weight="bold">45</text>
<line x1="486.3" y1="201.6" x2="592.1" y2="277.2" stroke="#868e96" stroke-width="2" marker-end="url(#ahg)"/>
<text x="518.0" y="260.0" text-anchor="middle" fill="#868e96" font-size="13" font-weight="bold">45</text>
<line x1="626.3" y1="278.4" x2="732.1" y2="202.8" stroke="#d9480f" stroke-width="3" marker-end="url(#aha)"/>
<text x="710.0" y="260.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">T/100</text>
<line x1="610.0" y1="110.0" x2="610.0" y2="268.0" stroke="#d9480f" stroke-width="3" marker-end="url(#aha)"/>
<text x="624.0" y="195.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">0</text>
<circle cx="470.0" cy="190.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="470.0" y="195.0" text-anchor="middle" fill="#222222" font-weight="bold">S</text>
<circle cx="610.0" cy="90.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="610.0" y="95.0" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<circle cx="610.0" cy="290.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="610.0" y="295.0" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<circle cx="750.0" cy="190.0" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="750.0" y="195.0" text-anchor="middle" fill="#222222" font-weight="bold">E</text>
<text x="210.0" y="60.0" text-anchor="middle" fill="#222222" font-weight="bold">Before: two routes</text>
<text x="610.0" y="60.0" text-anchor="middle" fill="#d9480f" font-weight="bold">After: free shortcut A to B</text>
<text x="210.0" y="338.0" text-anchor="middle" fill="#222222" font-size="13">2,000 cars per route</text>
<text x="210.0" y="358.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">20 + 45 = 65 minutes each</text>
<text x="610.0" y="338.0" text-anchor="middle" fill="#222222" font-size="13">all 4,000 take S, A, B, E</text>
<text x="610.0" y="358.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">40 + 0 + 40 = 80 minutes each</text>
<line x1="400.0" y1="70.0" x2="400.0" y2="360.0" stroke="#dee2e6" stroke-width="1"/>
<text x="400.0" y="376.0" text-anchor="middle" fill="#666666" font-size="12">T = number of cars on that road. Time on a T/100 road grows with traffic.</text>
</svg>
