<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Retry or back off: a game of chicken between two clients</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Two Clients, One Recovering Server</text>
<text x="310.0" y="66.0" text-anchor="middle" fill="#222222" font-weight="bold">Client 2</text>
<text x="78.0" y="205.0" text-anchor="middle" fill="#222222" font-weight="bold" transform="rotate(-90 78.0 205.0)">Client 1</text>
<text x="240.0" y="90.0" text-anchor="middle" fill="#666666">Retry now</text>
<text x="380.0" y="90.0" text-anchor="middle" fill="#666666">Back off</text>
<text x="160.0" y="155.0" text-anchor="end" fill="#666666">Retry now</text>
<text x="160.0" y="255.0" text-anchor="end" fill="#666666">Back off</text>
<rect x="170.0" y="100.0" width="140.0" height="100.0" rx="0" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<rect x="310.0" y="100.0" width="140.0" height="100.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<rect x="170.0" y="200.0" width="140.0" height="100.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
<rect x="310.0" y="200.0" width="140.0" height="100.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="240.0" y="156.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">0</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">0</tspan></text>
<text x="380.0" y="156.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">3</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">1</tspan></text>
<rect x="313.0" y="103.0" width="134.0" height="94.0" rx="0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="434.0,107.0 436.4,112.7 442.6,113.2 437.9,117.3 439.3,123.3 434.0,120.0 428.7,123.3 430.1,117.3 425.4,113.2 431.6,112.7" fill="#d9480f" stroke="none"/>
<text x="240.0" y="256.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">1</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">3</tspan></text>
<rect x="173.0" y="203.0" width="134.0" height="94.0" rx="0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="294.0,207.0 296.4,212.7 302.6,213.2 297.9,217.3 299.3,223.3 294.0,220.1 288.7,223.3 290.1,217.3 285.4,213.2 291.6,212.7" fill="#d9480f" stroke="none"/>
<text x="380.0" y="256.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">2</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">2</tspan></text>
<line x1="198.0" y1="170.0" x2="198.0" y2="230.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<line x1="338.0" y1="230.0" x2="338.0" y2="170.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<line x1="268.0" y1="120.0" x2="352.0" y2="120.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<line x1="352.0" y1="280.0" x2="268.0" y2="280.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<text x="480.0" y="120.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Both retry now:</text>
<text x="480.0" y="138.0" text-anchor="start" fill="#222222" font-size="13">thundering herd, 0 each</text>
<text x="480.0" y="168.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">One retries, one waits:</text>
<text x="480.0" y="186.0" text-anchor="start" fill="#222222" font-size="13">the first wins 3, the</text>
<text x="480.0" y="204.0" text-anchor="start" fill="#222222" font-size="13">patient one gets 1</text>
<text x="480.0" y="234.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Both back off:</text>
<text x="480.0" y="252.0" text-anchor="start" fill="#222222" font-size="13">slow but safe, 2 each</text>
<polygon points="488.0,273.0 490.4,278.7 496.6,279.2 491.9,283.3 493.3,289.3 488.0,286.1 482.7,289.3 484.1,283.3 479.4,279.2 485.6,278.7" fill="#d9480f" stroke="none"/>
<text x="502.0" y="287.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">two equilibria</text>
<text x="350.0" y="350.0" text-anchor="middle" fill="#222222" font-size="13">Each equilibrium needs one client to yield. Neither knows which one.</text>
<text x="350.0" y="370.0" text-anchor="middle" fill="#666666" font-size="13">Clients that cannot talk need another way to break the tie: randomness.</text>
</svg>
