<circle cx="195.0" cy="137.1" r="4.5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="300.0" cy="175.7" r="4.5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="405.0" cy="214.3" r="4.5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="510.0" cy="252.9" r="4.5" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<circle cx="90.0" cy="175.7" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="195.0" cy="214.3" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="300.0" cy="252.9" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="405.0" cy="291.4" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="510.0" cy="330.0" r="4.5" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="203.0" y="127.1" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">I hoard: 2 - k</text>
<text x="105.8" y="249.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">I hold back: -k</text>
<line x1="352.5" y1="197.0" x2="352.5" y2="270.1" stroke="#666666" stroke-width="1.2" marker-end="url(#ahg)"/>
<line x1="352.5" y1="270.1" x2="352.5" y2="197.0" stroke="#666666" stroke-width="1.2" marker-end="url(#ahg)"/>
<text x="358.5" y="237.6" text-anchor="start" fill="#666666" font-size="12">gap 2</text>
<circle cx="90.0" cy="175.7" r="9" fill="none" stroke="#222222" stroke-width="1.5"/>
<circle cx="510.0" cy="252.9" r="9" fill="none" stroke="#d9480f" stroke-width="2"/>
<text x="530.0" y="80.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Each team that hoards:</text>
<text x="530.0" y="98.0" text-anchor="start" fill="#222222" font-size="13">gains 3 for itself</text>
<text x="530.0" y="116.0" text-anchor="start" fill="#222222" font-size="13">costs every team 1</text>
<text x="530.0" y="150.0" text-anchor="start" fill="#222222" font-size="13">Hoard is always 2</text>
<text x="530.0" y="168.0" text-anchor="start" fill="#222222" font-size="13">higher: dominant.</text>
<text x="530.0" y="202.0" text-anchor="start" fill="#222222" font-size="13">All hold back:</text>
<text x="530.0" y="220.0" text-anchor="start" fill="#222222" font-size="13">0 each (circled black)</text>
<text x="530.0" y="254.0" text-anchor="start" fill="#d9480f" font-size="13">All hoard:</text>
<text x="530.0" y="272.0" text-anchor="start" fill="#d9480f" font-size="13">-2 each (circled orange)</text>
<text x="340.0" y="390.0" text-anchor="middle" fill="#666666" font-size="13">Every team follows the better line, and every team ends up worse off.</text>
</svg>
