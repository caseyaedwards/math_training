<text x="405.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">3</text>
<line x1="510.0" y1="330.0" x2="510.0" y2="334.0" stroke="#222222" stroke-width="1.5"/>
<text x="510.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">4</text>
<line x1="86.0" y1="330.0" x2="90.0" y2="330.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="334.0" text-anchor="end" fill="#666666" font-size="12">-4</text>
