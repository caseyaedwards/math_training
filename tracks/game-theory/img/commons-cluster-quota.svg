<text x="83.0" y="256.9" text-anchor="end" fill="#666666" font-size="12">-2</text>
<line x1="86.0" y1="214.3" x2="90.0" y2="214.3" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="218.3" text-anchor="end" fill="#666666" font-size="12">-1</text>
<line x1="86.0" y1="175.7" x2="90.0" y2="175.7" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="179.7" text-anchor="end" fill="#666666" font-size="12">0</text>
<line x1="86.0" y1="137.1" x2="90.0" y2="137.1" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="141.1" text-anchor="end" fill="#666666" font-size="12">1</text>
<line x1="86.0" y1="98.6" x2="90.0" y2="98.6" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="102.6" text-anchor="end" fill="#666666" font-size="12">2</text>
<line x1="86.0" y1="60.0" x2="90.0" y2="60.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="64.0" text-anchor="end" fill="#666666" font-size="12">3</text>
<text x="300.0" y="368.0" text-anchor="middle" fill="#222222" font-size="13">number of OTHER teams that hoard</text>
<text x="48.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13" transform="rotate(-90 48.0 195.0)">payoff to my team</text>
<polyline points="90.0,98.6 195.0,137.1 300.0,175.7 405.0,214.3 510.0,252.9" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<polyline points="90.0,175.7 195.0,214.3 300.0,252.9 405.0,291.4 510.0,330.0" fill="none" stroke="#222222" stroke-width="2.5"/>
