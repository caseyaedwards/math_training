<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Five Teams, One Cluster: The Tragedy of the Commons</text>
