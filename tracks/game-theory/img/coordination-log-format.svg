<text x="492.0" y="133.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">equilibrium</text>
<text x="470.0" y="166.0" text-anchor="start" fill="#222222" font-size="13">Same format: logs join</text>
<text x="470.0" y="184.0" text-anchor="start" fill="#222222" font-size="13">up and both teams win.</text>
<text x="470.0" y="214.0" text-anchor="start" fill="#222222" font-size="13">Mismatch: the pipeline</text>
<text x="470.0" y="232.0" text-anchor="start" fill="#222222" font-size="13">breaks and both get 0.</text>
<text x="470.0" y="262.0" text-anchor="start" fill="#666666" font-size="13">Arrows point toward</text>
<text x="470.0" y="280.0" text-anchor="start" fill="#666666" font-size="13">the better reply.</text>
<text x="340.0" y="345.0" text-anchor="middle" fill="#222222" font-size="13">Two equilibria. (Plain, Plain) is worse for both, but still stable:</text>
<text x="340.0" y="365.0" text-anchor="middle" fill="#666666" font-size="13">a lone team that switches to JSON drops from 2 to 0.</text>
