<rect x="300.0" y="100.0" width="140.0" height="100.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="160.0" y="200.0" width="140.0" height="100.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<rect x="300.0" y="200.0" width="140.0" height="100.0" rx="0" fill="#fde4d6" stroke="#222222" stroke-width="1.5"/>
