<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Coordination game: two teams pick a log format</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Nash Equilibrium: No One Gains by Switching Alone</text>
<text x="300.0" y="66.0" text-anchor="middle" fill="#222222" font-weight="bold">Team B</text>
<text x="68.0" y="205.0" text-anchor="middle" fill="#222222" font-weight="bold" transform="rotate(-90 68.0 205.0)">Team A</text>
<text x="230.0" y="90.0" text-anchor="middle" fill="#666666">JSON</text>
<text x="370.0" y="90.0" text-anchor="middle" fill="#666666">Plain</text>
<text x="150.0" y="155.0" text-anchor="end" fill="#666666">JSON</text>
<text x="150.0" y="255.0" text-anchor="end" fill="#666666">Plain</text>
