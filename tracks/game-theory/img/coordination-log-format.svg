<text x="370.0" y="156.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">0</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">0</tspan></text>
<text x="230.0" y="256.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">0</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">0</tspan></text>
<text x="370.0" y="256.0" text-anchor="middle" font-size="18"><tspan fill="#222222" font-weight="bold">2</tspan><tspan fill="#666666">,  </tspan><tspan fill="#222222">2</tspan></text>
<rect x="303.0" y="203.0" width="134.0" height="94.0" rx="0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="424.0,207.0 426.4,212.7 432.6,213.2 427.9,217.3 429.3,223.3 424.0,220.1 418.7,223.3 420.1,217.3 415.4,213.2 421.6,212.7" fill="#d9480f" stroke="none"/>
<line x1="188.0" y1="230.0" x2="188.0" y2="170.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<line x1="328.0" y1="170.0" x2="328.0" y2="230.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
<line x1="342.0" y1="120.0" x2="258.0" y2="120.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aha)"/>
