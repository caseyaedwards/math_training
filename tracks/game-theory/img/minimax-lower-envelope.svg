<text x="631.0" y="105.0" text-anchor="middle" fill="#666666" font-size="12">Login</text>
<text x="677.0" y="105.0" text-anchor="middle" fill="#666666" font-size="12">API</text>
<text x="530.0" y="131.0" text-anchor="start" fill="#666666" font-size="12">Watch login</text>
<rect x="608.0" y="114.0" width="46.0" height="26.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="631.0" y="131.0" text-anchor="middle" fill="#222222" font-size="12">3</text>
<rect x="654.0" y="114.0" width="46.0" height="26.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="677.0" y="131.0" text-anchor="middle" fill="#222222" font-size="12">-2</text>
<text x="530.0" y="157.0" text-anchor="start" fill="#666666" font-size="12">Watch API</text>
<rect x="608.0" y="140.0" width="46.0" height="26.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="631.0" y="157.0" text-anchor="middle" fill="#222222" font-size="12">-1</text>
<rect x="654.0" y="140.0" width="46.0" height="26.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="677.0" y="157.0" text-anchor="middle" fill="#222222" font-size="12">2</text>
<text x="530.0" y="200.0" text-anchor="start" fill="#222222" font-size="13">Attacker gains what</text>
<text x="530.0" y="218.0" text-anchor="start" fill="#222222" font-size="13">the defender loses.</text>
<text x="530.0" y="252.0" text-anchor="start" fill="#d9480f" font-size="13">Orange: the worst</text>
<text x="530.0" y="270.0" text-anchor="start" fill="#d9480f" font-size="13">case for each p.</text>
<text x="530.0" y="304.0" text-anchor="start" fill="#222222" font-size="13">Its peak is the</text>
<text x="530.0" y="322.0" text-anchor="start" fill="#222222" font-size="13">minimax value.</text>
<text x="350.0" y="410.0" text-anchor="middle" fill="#666666" font-size="13">Randomizing lifts the guaranteed payoff from -1 to 0.5.</text>
