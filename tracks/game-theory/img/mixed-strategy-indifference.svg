<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Mixed strategy: retry and back off pay the same at q = 1/2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
<text x="340.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Mixed Strategy: Make the Other Side Indifferent</text>
<line x1="90.0" y1="60.0" x2="90.0" y2="330.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="195.0" y1="60.0" x2="195.0" y2="330.0" stroke="#eeeeee" stroke-width="1"/>
