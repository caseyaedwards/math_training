<line x1="90.0" y1="60.0" x2="90.0" y2="330.0" stroke="#222222" stroke-width="1.5"/>
<line x1="90.0" y1="330.0" x2="90.0" y2="334.0" stroke="#222222" stroke-width="1.5"/>
<text x="90.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">0</text>
<line x1="195.0" y1="330.0" x2="195.0" y2="334.0" stroke="#222222" stroke-width="1.5"/>
<text x="195.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">0.25</text>
<line x1="300.0" y1="330.0" x2="300.0" y2="334.0" stroke="#222222" stroke-width="1.5"/>
<text x="300.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">0.5</text>
<line x1="405.0" y1="330.0" x2="405.0" y2="334.0" stroke="#222222" stroke-width="1.5"/>
<text x="405.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">0.75</text>
<line x1="510.0" y1="330.0" x2="510.0" y2="334.0" stroke="#222222" stroke-width="1.5"/>
<text x="510.0" y="348.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<line x1="86.0" y1="330.0" x2="90.0" y2="330.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="334.0" text-anchor="end" fill="#666666" font-size="12">0</text>
<line x1="86.0" y1="285.0" x2="90.0" y2="285.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="289.0" text-anchor="end" fill="#666666" font-size="12">0.5</text>
<line x1="86.0" y1="240.0" x2="90.0" y2="240.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="244.0" text-anchor="end" fill="#666666" font-size="12">1</text>
<line x1="86.0" y1="195.0" x2="90.0" y2="195.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="199.0" text-anchor="end" fill="#666666" font-size="12">1.5</text>
<line x1="86.0" y1="150.0" x2="90.0" y2="150.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="154.0" text-anchor="end" fill="#666666" font-size="12">2</text>
<line x1="86.0" y1="105.0" x2="90.0" y2="105.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="109.0" text-anchor="end" fill="#666666" font-size="12">2.5</text>
<line x1="86.0" y1="60.0" x2="90.0" y2="60.0" stroke="#222222" stroke-width="1.5"/>
<text x="83.0" y="64.0" text-anchor="end" fill="#666666" font-size="12">3</text>
<text x="300.0" y="368.0" text-anchor="middle" fill="#222222" font-size="13">q = chance the OTHER client retries now</text>
<text x="48.0" y="195.0" text-anchor="middle" fill="#222222" font-size="13" transform="rotate(-90 48.0 195.0)">my expected payoff</text>
<rect x="90.0" y="60.0" width="210.0" height="270.0" rx="0" fill="#fde4d6" fill-opacity="0.45" stroke="none" stroke-width="0"/>
<rect x="300.0" y="60.0" width="210.0" height="270.0" rx="0" fill="#f1f3f5" fill-opacity="0.8" stroke="none" stroke-width="0"/>
<line x1="90.0" y1="60.0" x2="510.0" y2="330.0" stroke="#d9480f" stroke-width="2.5"/>
<line x1="90.0" y1="150.0" x2="510.0" y2="240.0" stroke="#222222" stroke-width="2.5"/>
<line x1="300.0" y1="330.0" x2="300.0" y2="195.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4"/>
<circle cx="300.0" cy="195.0" r="6" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="310.0" y="183.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">q = 1/2, both pay 1.5</text>
<text x="174.0" y="82.5" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">retry: 3 - 3q</text>
<text x="501.6" y="208.5" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">back off: 2 - q</text>
<text x="195.0" y="303.0" text-anchor="middle" fill="#d9480f" font-size="12">retry is better</text>
<text x="405.0" y="303.0" text-anchor="middle" fill="#666666" font-size="12">back off is better</text>
<text x="530.0" y="90.0" text-anchor="start" fill="#222222" font-size="13">If the other client</text>
<text x="530.0" y="108.0" text-anchor="start" fill="#222222" font-size="13">retries half the time,</text>
<text x="530.0" y="126.0" text-anchor="start" fill="#222222" font-size="13">I have no reason to</text>
<text x="530.0" y="144.0" text-anchor="start" fill="#222222" font-size="13">prefer either move.</text>
<text x="530.0" y="178.0" text-anchor="start" fill="#222222" font-size="13">Both clients flip a</text>
<text x="530.0" y="196.0" text-anchor="start" fill="#222222" font-size="13">fair coin: that is the</text>
<text x="530.0" y="214.0" text-anchor="start" fill="#222222" font-size="13">mixed equilibrium.</text>
<text x="530.0" y="248.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Collision chance:</text>
<text x="530.0" y="266.0" text-anchor="start" fill="#222222" font-size="13">1/2 x 1/2 = 1/4</text>
<text x="340.0" y="390.0" text-anchor="middle" fill="#666666" font-size="13">Jitter in retry backoff is a mixed strategy written in code.</text>
</svg>
