<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Nim with heaps 3, 4, 5: nim-sum 2, take 2 from the first heap</title>
