<text x="90.0" y="205.0" text-anchor="end" fill="#222222" font-weight="bold">heap 3</text>
<circle cx="110.0" cy="200.0" r="13" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="146.0" cy="200.0" r="13" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="182.0" cy="200.0" r="13" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="218.0" cy="200.0" r="13" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<circle cx="254.0" cy="200.0" r="13" fill="#222222" stroke="#222222" stroke-width="1.5"/>
<text x="208.0" y="85.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">take 2</text>
<text x="460.0" y="80.0" text-anchor="end" fill="#666666" font-size="12">place</text>
<text x="492.0" y="80.0" text-anchor="middle" fill="#666666" font-size="12">4</text>
<text x="536.0" y="80.0" text-anchor="middle" fill="#666666" font-size="12">2</text>
<text x="580.0" y="80.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<text x="460.0" y="112.0" text-anchor="end" fill="#222222" font-weight="bold">3</text>
<rect x="470.0" y="90.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="492.0" y="112.0" text-anchor="middle" fill="#222222">0</text>
<rect x="514.0" y="90.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="536.0" y="112.0" text-anchor="middle" fill="#222222">1</text>
<rect x="558.0" y="90.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="580.0" y="112.0" text-anchor="middle" fill="#222222">1</text>
<text x="460.0" y="146.0" text-anchor="end" fill="#222222" font-weight="bold">4</text>
<rect x="470.0" y="124.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="492.0" y="146.0" text-anchor="middle" fill="#222222">1</text>
<rect x="514.0" y="124.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="536.0" y="146.0" text-anchor="middle" fill="#222222">0</text>
<rect x="558.0" y="124.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="580.0" y="146.0" text-anchor="middle" fill="#222222">0</text>
<text x="460.0" y="180.0" text-anchor="end" fill="#222222" font-weight="bold">5</text>
<rect x="470.0" y="158.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="492.0" y="180.0" text-anchor="middle" fill="#222222">1</text>
<rect x="514.0" y="158.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="536.0" y="180.0" text-anchor="middle" fill="#222222">0</text>
<rect x="558.0" y="158.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#222222" stroke-width="1"/>
<text x="580.0" y="180.0" text-anchor="middle" fill="#222222">1</text>
<line x1="440.0" y1="196.0" x2="602.0" y2="196.0" stroke="#222222" stroke-width="2"/>
<text x="460.0" y="222.0" text-anchor="end" fill="#d9480f" font-weight="bold">XOR</text>
<rect x="470.0" y="200.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="492.0" y="222.0" text-anchor="middle" fill="#d9480f" font-weight="bold">0</text>
<rect x="514.0" y="200.0" width="44.0" height="34.0" rx="0" fill="#fde4d6" stroke="#d9480f" stroke-width="1.5"/>
<text x="536.0" y="222.0" text-anchor="middle" fill="#d9480f" font-weight="bold">1</text>
<rect x="558.0" y="200.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="580.0" y="222.0" text-anchor="middle" fill="#d9480f" font-weight="bold">0</text>
<text x="614.0" y="222.0" text-anchor="start" fill="#d9480f" font-weight="bold">= 2</text>
<text x="614.0" y="112.0" text-anchor="start" fill="#666666" font-size="12">011</text>
<text x="614.0" y="146.0" text-anchor="start" fill="#666666" font-size="12">100</text>
<text x="614.0" y="180.0" text-anchor="start" fill="#666666" font-size="12">101</text>
<text x="50.0" y="290.0" text-anchor="start" fill="#222222" font-size="13">Each column counts 1 bits. An odd count gives a 1 in the XOR row.</text>
<text x="50.0" y="314.0" text-anchor="start" fill="#222222" font-size="13">Nim-sum 3 ^ 4 ^ 5 = 2 is not 0, so the player to move wins.</text>
<text x="50.0" y="338.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">Winning move: heap 1 becomes 3 ^ 2 = 1. Now 1 ^ 4 ^ 5 = 0.</text>
<text x="50.0" y="362.0" text-anchor="start" fill="#666666" font-size="13">From nim-sum 0, every move breaks the balance. The opponent restores it.</text>
</svg>
