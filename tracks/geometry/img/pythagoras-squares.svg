<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Pythagorean Theorem: 3² + 4² = 5²</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="470" fill="#ffffff"/>
<text x="350.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Pythagorean Theorem: 3² + 4² = 5²</text>
<polygon points="150.0,290.0 270.0,290.0 270.0,410.0 150.0,410.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<line x1="180.0" y1="290.0" x2="180.0" y2="410.0" stroke="#cccccc"/>
<line x1="150.0" y1="320.0" x2="270.0" y2="320.0" stroke="#cccccc"/>
<line x1="210.0" y1="290.0" x2="210.0" y2="410.0" stroke="#cccccc"/>
<line x1="150.0" y1="350.0" x2="270.0" y2="350.0" stroke="#cccccc"/>
<line x1="240.0" y1="290.0" x2="240.0" y2="410.0" stroke="#cccccc"/>
<line x1="150.0" y1="380.0" x2="270.0" y2="380.0" stroke="#cccccc"/>
<polygon points="150.0,290.0 150.0,200.0 60.0,200.0 60.0,290.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<line x1="150.0" y1="260.0" x2="60.0" y2="260.0" stroke="#cccccc"/>
<line x1="120.0" y1="290.0" x2="120.0" y2="200.0" stroke="#cccccc"/>
<line x1="150.0" y1="230.0" x2="60.0" y2="230.0" stroke="#cccccc"/>
<line x1="90.0" y1="290.0" x2="90.0" y2="200.0" stroke="#cccccc"/>
<polygon points="270.0,290.0 150.0,200.0 240.0,80.0 360.0,170.0" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<line x1="246.0" y1="272.0" x2="336.0" y2="152.0" stroke="#cccccc"/>
<line x1="288.0" y1="266.0" x2="168.0" y2="176.0" stroke="#cccccc"/>
<line x1="222.0" y1="254.0" x2="312.0" y2="134.0" stroke="#cccccc"/>
<line x1="306.0" y1="242.0" x2="186.0" y2="152.0" stroke="#cccccc"/>
<line x1="198.0" y1="236.0" x2="288.0" y2="116.0" stroke="#cccccc"/>
<line x1="324.0" y1="218.0" x2="204.0" y2="128.0" stroke="#cccccc"/>
<line x1="174.0" y1="218.0" x2="264.0" y2="98.0" stroke="#cccccc"/>
<line x1="342.0" y1="194.0" x2="222.0" y2="104.0" stroke="#cccccc"/>
<polygon points="150.0,290.0 270.0,290.0 270.0,410.0 150.0,410.0" fill="none" stroke="#222222" stroke-width="2"/>
<polygon points="150.0,290.0 150.0,200.0 60.0,200.0 60.0,290.0" fill="none" stroke="#222222" stroke-width="2"/>
<polygon points="270.0,290.0 150.0,200.0 240.0,80.0 360.0,170.0" fill="none" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="150.0,290.0 270.0,290.0 150.0,200.0" fill="#f3f3f3" stroke="#222222" stroke-width="2.5"/>
<polyline points="162.0,290 162.0,278.0 150,278.0" fill="none" stroke="#222222"/>
<text x="210.0" y="350.0" text-anchor="middle" fill="#222222" font-weight="bold" font-size="20">16</text>
<text x="210.0" y="370.0" text-anchor="middle" fill="#555555" font-size="13">4 × 4</text>
<text x="105.0" y="245.0" text-anchor="middle" fill="#222222" font-weight="bold" font-size="20">9</text>
<text x="105.0" y="265.0" text-anchor="middle" fill="#555555" font-size="13">3 × 3</text>
<text x="255.0" y="185.0" text-anchor="middle" fill="#d9480f" font-weight="bold" font-size="20">25</text>
<text x="255.0" y="205.0" text-anchor="middle" fill="#d9480f" font-size="13">5 × 5</text>
<text x="210.0" y="284.0" text-anchor="middle" fill="#222222" font-size="13">b = 4</text>
<text x="156.0" y="249.0" text-anchor="start" fill="#222222" font-size="13">a = 3</text>
<text x="192.0" y="265.0" text-anchor="middle" fill="#d9480f" font-size="13">c = 5</text>
<text x="440.0" y="150.0" text-anchor="start" fill="#222222">Legs a = 3 and b = 4</text>
<text x="440.0" y="176.0" text-anchor="start" fill="#222222">Hypotenuse c = 5</text>
<text x="440.0" y="202.0" text-anchor="start" fill="#222222"></text>
<text x="440.0" y="228.0" text-anchor="start" fill="#222222">Count the unit squares:</text>
<text x="440.0" y="254.0" text-anchor="start" fill="#d9480f" font-weight="bold">9 + 16 = 25</text>
<text x="440.0" y="280.0" text-anchor="start" fill="#222222"></text>
<text x="440.0" y="306.0" text-anchor="start" fill="#222222">For every right triangle:</text>
<text x="440.0" y="332.0" text-anchor="start" fill="#222222" font-weight="bold">a² + b² = c²</text>
</svg>
