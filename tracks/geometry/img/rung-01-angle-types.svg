<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Angle types</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="740" height="240" fill="#ffffff"/>
<text x="370.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Angles measure turn: acute, right, obtuse, straight</text>
<line x1="70.0" y1="150.0" x2="150.0" y2="150.0" stroke="#222222" stroke-width="2.5"/>
<line x1="70.0" y1="150.0" x2="131.3" y2="98.6" stroke="#222222" stroke-width="2.5"/>
<circle cx="70.0" cy="150.0" r="4.0" fill="#222222"/>
<path d="M100.0,150.0 A30.0,30.0 0 0 0 93.0,130.7" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<text x="115.1" y="138.6" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">40°</text>
<text x="115.0" y="194.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">acute</text>
<text x="115.0" y="214.0" text-anchor="middle" font-size="12" fill="#555555">less than 90°</text>
<line x1="255.0" y1="150.0" x2="335.0" y2="150.0" stroke="#222222" stroke-width="2.5"/>
<line x1="255.0" y1="150.0" x2="255.0" y2="70.0" stroke="#222222" stroke-width="2.5"/>
<circle cx="255.0" cy="150.0" r="4.0" fill="#222222"/>
<polyline points="273.0,150.0 273.0,132.0 255.0,132.0" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="283.3" y="126.7" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">90°</text>
<text x="300.0" y="194.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">right</text>
<text x="300.0" y="214.0" text-anchor="middle" font-size="12" fill="#555555">exactly 90°</text>
<line x1="485.0" y1="150.0" x2="565.0" y2="150.0" stroke="#222222" stroke-width="2.5"/>
<line x1="485.0" y1="150.0" x2="433.6" y2="88.7" stroke="#222222" stroke-width="2.5"/>
<circle cx="485.0" cy="150.0" r="4.0" fill="#222222"/>
<path d="M515.0,150.0 A30.0,30.0 0 0 0 465.7,127.0" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<text x="505.3" y="111.5" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">130°</text>
<text x="485.0" y="194.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">obtuse</text>
<text x="485.0" y="214.0" text-anchor="middle" font-size="12" fill="#555555">between 90° and 180°</text>
<line x1="670.0" y1="150.0" x2="750.0" y2="150.0" stroke="#222222" stroke-width="2.5"/>
<line x1="670.0" y1="150.0" x2="590.0" y2="150.0" stroke="#222222" stroke-width="2.5"/>
<circle cx="670.0" cy="150.0" r="4.0" fill="#222222"/>
<path d="M700.0,150.0 A30.0,30.0 0 0 0 640.0,150.0" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<text x="670.0" y="107.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">180°</text>
<text x="670.0" y="194.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">straight</text>
<text x="670.0" y="214.0" text-anchor="middle" font-size="12" fill="#555555">exactly 180°</text>
</svg>
