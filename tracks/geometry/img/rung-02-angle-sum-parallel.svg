<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Triangle angle sum with a parallel line</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="420" fill="#ffffff"/>
<text x="310.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Why the angles of a triangle add to 180°</text>
<polygon points="110.0,370.0 490.0,370.0 335.1,101.7" fill="#ffffff" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="105.1" y1="101.7" x2="535.1" y2="101.7" stroke="#555555" stroke-width="2" stroke-dasharray="7 5"/>
<text x="99.1" y="106.7" text-anchor="end" font-size="12" fill="#555555">parallel to AB</text>
<path d="M110.0,370.0 L150.0,370.0 A40.0,40.0 0 0 0 135.7,339.4 Z" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<path d="M490.0,370.0 L470.0,335.4 A40.0,40.0 0 0 0 450.0,370.0 Z" fill="#f1f1f1" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<path d="M313.3,127.8 A34.0,34.0 0 0 0 352.1,131.2" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<path d="M335.1,101.7 L295.1,101.7 A40.0,40.0 0 0 0 309.4,132.4 Z" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<path d="M335.1,101.7 L355.1,136.4 A40.0,40.0 0 0 0 375.1,101.7 Z" fill="#f1f1f1" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<text x="162.6" y="350.5" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">50°</text>
<text x="439.8" y="346.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">60°</text>
<text x="330.4" y="160.5" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">70°</text>
<text x="280.7" y="132.1" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">50°</text>
<text x="387.1" y="136.7" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">60°</text>
<text x="100.0" y="388.0" text-anchor="end" font-size="15" fill="#222222" font-weight="bold">A</text>
<text x="500.0" y="388.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold">B</text>
<text x="335.1" y="89.7" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">C</text>
<text x="310.0" y="404.0" text-anchor="middle" font-size="14" fill="#222222">Along the dashed line at C: 50° + 70° + 60° = 180°, a straight angle.</text>
</svg>
