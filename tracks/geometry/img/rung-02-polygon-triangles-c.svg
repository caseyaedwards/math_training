<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Polygons split into triangles</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<text x="350.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">From one corner, an n-gon splits into n − 2 triangles</text>
<polygon points="180.0,55.0 80.1,127.6 118.3,244.9" fill="#f6d5c4" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="180.0,55.0 118.3,244.9 241.7,244.9" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="180.0,55.0 241.7,244.9 279.9,127.6" fill="#f6d5c4" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="180.0,55.0 80.1,127.6 118.3,244.9 241.7,244.9 279.9,127.6" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="180.0" cy="55.0" r="6.0" fill="#d9480f"/>
<text x="126.1" y="147.5" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">1</text>
<text x="180.0" y="186.6" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">2</text>
<text x="233.9" y="147.5" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">3</text>
<text x="180.0" y="290.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">5 sides → 3 triangles</text>
<text x="180.0" y="314.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">3 × 180° = 540°</text>
<polygon points="520.0,55.0 429.1,107.5 429.1,212.5" fill="#f6d5c4" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="520.0,55.0 429.1,212.5 520.0,265.0" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="520.0,55.0 520.0,265.0 610.9,212.5" fill="#f6d5c4" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="520.0,55.0 610.9,212.5 610.9,107.5" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="520.0,55.0 429.1,107.5 429.1,212.5 520.0,265.0 610.9,212.5 610.9,107.5" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="520.0" cy="55.0" r="6.0" fill="#d9480f"/>
<text x="459.4" y="130.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">1</text>
<text x="489.7" y="182.5" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">2</text>
<text x="550.3" y="182.5" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">3</text>
<text x="580.6" y="130.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">4</text>
<text x="520.0" y="290.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">6 sides → 4 triangles</text>
<text x="520.0" y="314.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">4 × 180° = 720°</text>
</svg>
