<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Tear off the corners of a triangle</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<text x="360.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Tear off the three corners and line them up</text>
<polygon points="40.0,230.0 250.0,230.0 164.4,81.7" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<path d="M40.0,230.0 L76.0,230.0 A36.0,36.0 0 0 0 63.1,202.4 Z" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M250.0,230.0 L232.0,198.8 A36.0,36.0 0 0 0 214.0,230.0 Z" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M164.4,81.7 L141.3,109.3 A36.0,36.0 0 0 0 182.4,112.9 Z" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M145.1,104.7 A30.0,30.0 0 0 0 179.4,107.7" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="80.0" y="250.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">50°</text>
<text x="210.0" y="250.0" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">60°</text>
<text x="164.4" y="71.7" text-anchor="middle" font-size="13" fill="#222222" font-weight="bold">70°</text>
<line x1="290.0" y1="160.0" x2="350.0" y2="160.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<line x1="360.0" y1="230.0" x2="700.0" y2="230.0" stroke="#222222" stroke-width="2"/>
<path d="M530.0,230.0 L452.9,138.1 A120.0,120.0 0 0 0 410.0,230.0 Z" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<path d="M530.0,230.0 L590.0,126.1 A120.0,120.0 0 0 0 452.9,138.1 Z" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<path d="M530.0,230.0 L650.0,230.0 A120.0,120.0 0 0 0 590.0,126.1 Z" fill="#f1f1f1" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<text x="457.5" y="201.2" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold">50°</text>
<text x="523.0" y="155.3" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">70°</text>
<text x="599.3" y="195.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">60°</text>
<text x="530.0" y="260.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">50° + 70° + 60° = 180°: a straight line</text>
</svg>
