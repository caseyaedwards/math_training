<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A circle unrolled is pi diameters long</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="260" fill="#ffffff"/>
<text x="320.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Roll a circle one full turn: it travels π diameters</text>
<circle cx="60.0" cy="140.0" r="50.0" fill="#f6d5c4" stroke="#222222" stroke-width="2"/>
<line x1="60.0" y1="90.0" x2="60.0" y2="190.0" stroke="#222222" stroke-width="1.5"/>
<text x="68.0" y="145.0" text-anchor="start" font-size="15" fill="#222222" font-weight="bold" font-style="italic">d</text>
<circle cx="60.0" cy="190.0" r="5.0" fill="#d9480f"/>
<line x1="60.0" y1="190.0" x2="374.2" y2="190.0" stroke="#d9480f" stroke-width="4"/>
<line x1="30.0" y1="190.0" x2="60.0" y2="190.0" stroke="#555555" stroke-width="1.5"/>
<line x1="374.2" y1="190.0" x2="414.2" y2="190.0" stroke="#555555" stroke-width="1.5"/>
<line x1="60.0" y1="182.0" x2="60.0" y2="198.0" stroke="#222222" stroke-width="2"/>
<line x1="160.0" y1="182.0" x2="160.0" y2="198.0" stroke="#222222" stroke-width="2"/>
<line x1="260.0" y1="182.0" x2="260.0" y2="198.0" stroke="#222222" stroke-width="2"/>
<line x1="360.0" y1="182.0" x2="360.0" y2="198.0" stroke="#222222" stroke-width="2"/>
<line x1="374.2" y1="178.0" x2="374.2" y2="202.0" stroke="#d9480f" stroke-width="2.5"/>
<text x="110.0" y="216.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">1 d</text>
<text x="210.0" y="216.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">2 d</text>
<text x="310.0" y="216.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">3 d</text>
<text x="367.0" y="236.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold">+ 0.14 d</text>
<line x1="367.0" y1="222.0" x2="367.0" y2="202.0" stroke="#d9480f" stroke-width="1"/>
<text x="470.0" y="100.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">C = π × d ≈ 3.14 × d</text>
<path d="M120.0,120.0 Q190.0,92.0 260.0,120.0" fill="none" stroke="#555555" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad)"/>
<text x="190.0" y="86.0" text-anchor="middle" font-size="13" fill="#555555">roll one turn</text>
</svg>
