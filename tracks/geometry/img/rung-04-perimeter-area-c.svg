<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Perimeter versus area of a rectangle</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="600" height="270" fill="#ffffff"/>
<text x="300.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Perimeter walks the edge; area counts the squares</text>
