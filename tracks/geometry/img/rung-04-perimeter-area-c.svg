<text x="50.0" y="135.0" text-anchor="end" font-size="15" fill="#222222" font-weight="bold">3</text>
<text x="320.0" y="110.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">Perimeter (orange edge):</text>
<text x="320.0" y="132.0" text-anchor="start" font-size="14" fill="#222222">5 + 3 + 5 + 3 = 16 units</text>
<text x="320.0" y="172.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">Area (numbered squares):</text>
<text x="320.0" y="194.0" text-anchor="start" font-size="14" fill="#222222">5 × 3 = 15 square units</text>
<text x="300.0" y="252.0" text-anchor="middle" font-size="14" fill="#555555">A rectangle has A = l × w.</text>
