<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Pythagorean theorem by rearrangement</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
<text x="320.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Same square, same four triangles, two arrangements</text>
<polygon points="50.0,60.0 152.0,60.0 50.0,196.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="152.0,60.0 288.0,60.0 288.0,162.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="288.0,162.0 288.0,298.0 186.0,298.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="186.0,298.0 50.0,298.0 50.0,196.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="152.0,60.0 288.0,162.0 186.0,298.0 50.0,196.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="50.0" y="60.0" width="238.0" height="238.0" fill="none" stroke="#222222" stroke-width="2.5"/>
<text x="169.0" y="185.0" text-anchor="middle" font-size="17" fill="#d9480f" font-weight="bold"><tspan>c</tspan><tspan dy="-6.5" font-size="12.2">2</tspan><tspan dy="6.5"> = 25</tspan></text>
<rect x="360.0" y="60.0" width="102.0" height="102.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2.5"/>
<rect x="462.0" y="162.0" width="136.0" height="136.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="462.0,60.0 598.0,60.0 598.0,162.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="462.0,60.0 462.0,162.0 598.0,162.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="360.0,162.0 462.0,162.0 360.0,298.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="462.0,162.0 462.0,298.0 360.0,298.0" fill="#f1f1f1" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="360.0" y="60.0" width="238.0" height="238.0" fill="none" stroke="#222222" stroke-width="2.5"/>
<text x="411.0" y="117.0" text-anchor="middle" font-size="15" fill="#d9480f" font-weight="bold"><tspan>a</tspan><tspan dy="-5.7" font-size="10.8">2</tspan><tspan dy="5.7"> = 9</tspan></text>
<text x="530.0" y="236.0" text-anchor="middle" font-size="17" fill="#d9480f" font-weight="bold"><tspan>b</tspan><tspan dy="-6.5" font-size="12.2">2</tspan><tspan dy="6.5"> = 16</tspan></text>
<text x="101.0" y="52.0" text-anchor="middle" font-size="13" fill="#222222">a = 3</text>
<text x="220.0" y="52.0" text-anchor="middle" font-size="13" fill="#222222">b = 4</text>
<text x="411.0" y="52.0" text-anchor="middle" font-size="13" fill="#222222">a = 3</text>
<text x="530.0" y="52.0" text-anchor="middle" font-size="13" fill="#222222">b = 4</text>
<text x="320.0" y="330.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold"><tspan>Remove the 4 gray triangles from each: c</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3"> = a</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3"> + b</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3">, so 25 = 9 + 16.</tspan></text>
</svg>
