<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A 3-4-5 rope triangle</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="540" height="330" fill="#ffffff"/>
<text x="270.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">A rope with 12 equal spaces makes a square corner</text>
<polygon points="100.0,270.0 324.0,270.0 100.0,102.0" fill="#f6d5c4" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="116.0,270.0 116.0,254.0 100.0,254.0" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="100.0" cy="270.0" r="5.0" fill="#222222"/>
<circle cx="156.0" cy="270.0" r="5.0" fill="#222222"/>
<circle cx="212.0" cy="270.0" r="5.0" fill="#222222"/>
<circle cx="268.0" cy="270.0" r="5.0" fill="#222222"/>
<circle cx="324.0" cy="270.0" r="5.0" fill="#222222"/>
<circle cx="279.2" cy="236.4" r="5.0" fill="#222222"/>
<circle cx="234.4" cy="202.8" r="5.0" fill="#222222"/>
<circle cx="189.6" cy="169.2" r="5.0" fill="#222222"/>
<circle cx="144.8" cy="135.6" r="5.0" fill="#222222"/>
<circle cx="100.0" cy="102.0" r="5.0" fill="#222222"/>
<circle cx="100.0" cy="158.0" r="5.0" fill="#222222"/>
<circle cx="100.0" cy="214.0" r="5.0" fill="#222222"/>
<text x="212.0" y="296.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">4 spaces</text>
<text x="86.0" y="191.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">3 spaces</text>
<text x="230.0" y="176.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">5 spaces</text>
<text x="122.0" y="248.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="bold">90°</text>
<text x="270.0" y="316.0" text-anchor="middle" font-size="14" fill="#222222"><tspan>3</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3"> + 4</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3"> = 9 + 16 = 25 = 5</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3">, so the corner is a right angle.</tspan></text>
</svg>
