<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Sphere inside a cylinder</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
<text x="320.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Archimedes: a sphere fills 2/3 of the cylinder around it</text>
<rect x="70.0" y="70.0" width="200.0" height="200.0" fill="#ffffff"/>
<ellipse cx="170.0" cy="270.0" rx="100.0" ry="22.0" fill="#ffffff" stroke="#222222" stroke-width="0"/>
<path d="M70.0,270.0 A100.0,22.0 0 0 0 270.0,270.0" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<path d="M70.0,270.0 A100.0,22.0 0 0 1 270.0,270.0" fill="none" stroke="#222222" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 3"/>
<line x1="70.0" y1="70.0" x2="70.0" y2="270.0" stroke="#222222" stroke-width="2"/>
<line x1="270.0" y1="70.0" x2="270.0" y2="270.0" stroke="#222222" stroke-width="2"/>
<ellipse cx="170.0" cy="70.0" rx="100.0" ry="22.0" fill="#fbe9df" stroke="#222222" stroke-width="2"/>
<circle cx="170.0" cy="170.0" r="100.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2.5"/>
<ellipse cx="170.0" cy="170.0" rx="100.0" ry="22.0" fill="none" stroke="#d9480f" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="170.0" y1="170.0" x2="270.0" y2="170.0" stroke="#222222" stroke-width="1.5"/>
<text x="220.0" y="164.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold" font-style="italic">r</text>
<line x1="286.0" y1="70.0" x2="286.0" y2="270.0" stroke="#555555" stroke-width="1.2" marker-end="url(#ad)" marker-start="url(#ad)"/>
<text x="294.0" y="175.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">2r</text>
<text x="340.0" y="110.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold"><tspan>sphere: V = (4/3)πr</tspan><tspan dy="-5.3" font-size="10.1">3</tspan></text>
<text x="340.0" y="138.0" text-anchor="start" font-size="14" fill="#222222"><tspan>cylinder: V = πr</tspan><tspan dy="-5.3" font-size="10.1">2</tspan><tspan dy="5.3"> · 2r = 2πr</tspan><tspan dy="-5.3" font-size="10.1">3</tspan></text>
<text x="340.0" y="166.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">ratio: (4/3) ÷ 2 = 2/3</text>
<text x="340.0" y="222.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold"><tspan>sphere skin: S = 4πr</tspan><tspan dy="-5.3" font-size="10.1">2</tspan></text>
<text x="340.0" y="250.0" text-anchor="start" font-size="14" fill="#222222"><tspan>cylinder side: 2πr · 2r = 4πr</tspan><tspan dy="-5.3" font-size="10.1">2</tspan></text>
<text x="340.0" y="278.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">the same area</text>
</svg>
