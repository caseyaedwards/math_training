<text x="420.0" y="230.0" text-anchor="start" font-size="14" fill="#222222">Check (3, 4):</text>
<text x="420.0" y="254.0" text-anchor="start" font-size="14" fill="#222222">9 + 16 = 25.</text>
<text x="420.0" y="278.0" text-anchor="start" font-size="14" fill="#222222">Check (−4, 3):</text>
<text x="420.0" y="302.0" text-anchor="start" font-size="14" fill="#222222">16 + 9 = 25.</text>
