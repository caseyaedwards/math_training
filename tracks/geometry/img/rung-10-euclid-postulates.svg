<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Euclid's five postulates</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="740" height="330" fill="#ffffff"/>
<text x="370.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Euclid's five postulates</text>
<rect x="8.0" y="50.0" width="136.0" height="160.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="8"/>
<text x="76.0" y="236.0" text-anchor="middle" font-size="12" fill="#d9480f" font-weight="bold">1. A straight line</text>
<text x="76.0" y="254.0" text-anchor="middle" font-size="12" fill="#222222">joins any two</text>
<text x="76.0" y="272.0" text-anchor="middle" font-size="12" fill="#222222">points.</text>
<rect x="155.0" y="50.0" width="136.0" height="160.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="8"/>
<text x="223.0" y="236.0" text-anchor="middle" font-size="12" fill="#d9480f" font-weight="bold">2. A segment</text>
<text x="223.0" y="254.0" text-anchor="middle" font-size="12" fill="#222222">extends as far</text>
<text x="223.0" y="272.0" text-anchor="middle" font-size="12" fill="#222222">as you like.</text>
<rect x="302.0" y="50.0" width="136.0" height="160.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="8"/>
<text x="370.0" y="236.0" text-anchor="middle" font-size="12" fill="#d9480f" font-weight="bold">3. Any center and</text>
<text x="370.0" y="254.0" text-anchor="middle" font-size="12" fill="#222222">any radius make</text>
<text x="370.0" y="272.0" text-anchor="middle" font-size="12" fill="#222222">a circle.</text>
<rect x="449.0" y="50.0" width="136.0" height="160.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="8"/>
<text x="517.0" y="236.0" text-anchor="middle" font-size="12" fill="#d9480f" font-weight="bold">4. All right angles</text>
<text x="517.0" y="254.0" text-anchor="middle" font-size="12" fill="#222222">are equal.</text>
<rect x="596.0" y="50.0" width="136.0" height="160.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="8"/>
<text x="664.0" y="236.0" text-anchor="middle" font-size="12" fill="#d9480f" font-weight="bold">5. Lines meet on</text>
<text x="664.0" y="254.0" text-anchor="middle" font-size="12" fill="#222222">the side where the</text>
<text x="664.0" y="272.0" text-anchor="middle" font-size="12" fill="#222222">angles sum &lt; 180°.</text>
<line x1="31.0" y1="160.0" x2="116.0" y2="90.0" stroke="#222222" stroke-width="2.5"/>
<circle cx="31.0" cy="160.0" r="6.0" fill="#d9480f"/>
<circle cx="116.0" cy="90.0" r="6.0" fill="#d9480f"/>
<line x1="163.0" y1="150.0" x2="283.0" y2="110.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="198.0" y1="138.0" x2="248.0" y2="122.0" stroke="#222222" stroke-width="3"/>
<circle cx="198.0" cy="138.0" r="4.0" fill="#222222"/>
<circle cx="248.0" cy="122.0" r="4.0" fill="#222222"/>
<circle cx="370.0" cy="130.0" r="50.0" fill="none" stroke="#222222" stroke-width="2"/>
<line x1="370.0" y1="130.0" x2="420.0" y2="130.0" stroke="#d9480f" stroke-width="2"/>
<circle cx="370.0" cy="130.0" r="4.0" fill="#d9480f"/>
<text x="395.0" y="124.0" text-anchor="middle" font-size="13" fill="#d9480f" font-weight="bold" font-style="italic">r</text>
<line x1="467.0" y1="170.0" x2="517.0" y2="170.0" stroke="#222222" stroke-width="2"/>
<line x1="467.0" y1="170.0" x2="467.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<polyline points="479.0,170.0 479.0,158.0 467.0,158.0" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="527.0" y1="120.0" x2="568.0" y2="91.3" stroke="#222222" stroke-width="2"/>
<line x1="527.0" y1="120.0" x2="498.3" y2="79.0" stroke="#222222" stroke-width="2"/>
<polyline points="536.8,113.1 529.9,103.3 520.1,110.2" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="527.0" y="188.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">=</text>
<line x1="644.0" y1="60.0" x2="659.0" y2="200.0" stroke="#222222" stroke-width="2"/>
<line x1="602.0" y1="100.0" x2="724.0" y2="112.0" stroke="#222222" stroke-width="2"/>
<line x1="602.0" y1="170.0" x2="724.0" y2="140.0" stroke="#222222" stroke-width="2"/>
<line x1="724.0" y1="112.0" x2="744.0" y2="114.0" stroke="#555555" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="704.0" y="132.0" text-anchor="middle" font-size="11" fill="#d9480f" font-weight="bold">meet</text>
</svg>
