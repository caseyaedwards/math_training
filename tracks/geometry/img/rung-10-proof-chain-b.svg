<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="740" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A chain of proof from the postulates</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="740" height="270" fill="#ffffff"/>
<text x="370.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Each result rests on the ones before it</text>
<rect x="20.0" y="60.0" width="200.0" height="70.0" fill="#f1f1f1" stroke="#222222" stroke-width="2" rx="8"/>
<text x="120.0" y="80.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Postulates 1 to 4</text>
<text x="120.0" y="98.0" text-anchor="middle" font-size="13" fill="#222222">lines, circles,</text>
<text x="120.0" y="116.0" text-anchor="middle" font-size="13" fill="#222222">right angles</text>
<rect x="20.0" y="170.0" width="200.0" height="70.0" fill="#f1f1f1" stroke="#222222" stroke-width="2" rx="8"/>
<text x="120.0" y="196.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Postulate 5</text>
<text x="120.0" y="214.0" text-anchor="middle" font-size="13" fill="#222222">parallel lines</text>
<rect x="280.0" y="115.0" width="200.0" height="70.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="8"/>
<text x="380.0" y="141.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Alternate angles</text>
<text x="380.0" y="159.0" text-anchor="middle" font-size="13" fill="#222222">are equal</text>
<rect x="520.0" y="60.0" width="200.0" height="70.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" rx="8"/>
<text x="620.0" y="86.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">Triangle angles</text>
<text x="620.0" y="104.0" text-anchor="middle" font-size="13" fill="#222222">add to 180°</text>
<rect x="520.0" y="170.0" width="200.0" height="70.0" fill="#ffffff" stroke="#222222" stroke-width="2" rx="8"/>
<text x="620.0" y="196.0" text-anchor="middle" font-size="14" fill="#222222" font-weight="bold">n-gon angles add</text>
<text x="620.0" y="214.0" text-anchor="middle" font-size="13" fill="#222222">to (n − 2) · 180°</text>
<line x1="222.0" y1="100.0" x2="278.0" y2="140.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<line x1="222.0" y1="200.0" x2="278.0" y2="162.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<line x1="482.0" y1="140.0" x2="518.0" y2="104.0" stroke="#555555" stroke-width="2" marker-end="url(#ad)"/>
<line x1="620.0" y1="132.0" x2="620.0" y2="168.0" stroke="#d9480f" stroke-width="2" marker-end="url(#aa)"/>
<text x="370.0" y="262.0" text-anchor="middle" font-size="13" fill="#555555">If a step fails, everything below it falls. If every step holds, the theorem holds.</text>
</svg>
