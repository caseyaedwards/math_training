<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Similar right triangles share side ratios</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="400" fill="#ffffff"/>
<text x="310.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Same angle θ, same ratios, any size</text>
<polygon points="60.0,300.0 372.0,300.0 372.0,66.0" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="362.0,300.0 362.0,290.0 372.0,290.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="60.0,300.0 268.0,300.0 268.0,144.0" fill="#fbe9df" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="258.0,300.0 258.0,290.0 268.0,290.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="60.0,300.0 164.0,300.0 164.0,222.0" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<polyline points="154.0,300.0 154.0,290.0 164.0,290.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M106.0,300.0 A46.0,46.0 0 0 0 96.8,272.4" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<text x="116.0" y="290.0" text-anchor="middle" font-size="16" fill="#d9480f" font-weight="bold">θ</text>
<text x="172.0" y="266.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">3</text>
<text x="102.0" y="255.0" text-anchor="end" font-size="14" fill="#d9480f" font-weight="bold">5</text>
<line x1="60.0" y1="318.0" x2="164.0" y2="318.0" stroke="#555555" stroke-width="1" marker-end="url(#ad)" marker-start="url(#ad)"/>
<text x="172.0" y="323.0" text-anchor="start" font-size="13" fill="#d9480f" font-weight="bold">4</text>
<text x="276.0" y="227.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">6</text>
<text x="154.0" y="216.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">10</text>
<line x1="60.0" y1="336.0" x2="268.0" y2="336.0" stroke="#555555" stroke-width="1" marker-end="url(#ad)" marker-start="url(#ad)"/>
<text x="276.0" y="341.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">8</text>
<text x="380.0" y="188.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">9</text>
<text x="206.0" y="177.0" text-anchor="end" font-size="14" fill="#222222" font-weight="bold">15</text>
<line x1="60.0" y1="354.0" x2="372.0" y2="354.0" stroke="#555555" stroke-width="1" marker-end="url(#ad)" marker-start="url(#ad)"/>
<text x="380.0" y="359.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">12</text>
<text x="440.0" y="80.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">sin θ = opp / hyp</text>
<text x="440.0" y="102.0" text-anchor="start" font-size="13" fill="#d9480f">3/5 = 6/10 = 9/15 = 0.6</text>
<text x="440.0" y="146.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">cos θ = adj / hyp</text>
<text x="440.0" y="168.0" text-anchor="start" font-size="13" fill="#222222">4/5 = 8/10 = 12/15 = 0.8</text>
<text x="440.0" y="212.0" text-anchor="start" font-size="13" fill="#222222" font-weight="bold">tan θ = opp / adj</text>
<text x="440.0" y="234.0" text-anchor="start" font-size="13" fill="#222222">3/4 = 6/8 = 9/12 = 0.75</text>
<text x="440.0" y="278.0" text-anchor="start" font-size="13" fill="#555555">θ ≈ 36.87°</text>
</svg>
