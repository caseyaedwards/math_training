<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Sine and cosine on the unit circle</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="400" fill="#ffffff"/>
<text x="280.0" y="28.0" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">On a circle of radius 1, cos θ and sin θ are the coordinates</text>
<line x1="30.0" y1="220.0" x2="380.0" y2="220.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="200.0" y1="390.0" x2="200.0" y2="40.0" stroke="#555555" stroke-width="1.5" marker-end="url(#ad)"/>
<circle cx="200.0" cy="220.0" r="150.0" fill="none" stroke="#222222" stroke-width="2"/>
<polygon points="200.0,220.0 320.0,220.0 320.0,130.0" fill="#f6d5c4"/>
<line x1="200.0" y1="220.0" x2="320.0" y2="130.0" stroke="#222222" stroke-width="2.5"/>
<line x1="200.0" y1="220.0" x2="320.0" y2="220.0" stroke="#d9480f" stroke-width="3.5"/>
<line x1="320.0" y1="220.0" x2="320.0" y2="130.0" stroke="#d9480f" stroke-width="3.5"/>
<polyline points="310.0,220.0 310.0,210.0 320.0,210.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M234.0,220.0 A34.0,34.0 0 0 0 227.2,199.6" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="244.0" y="210.0" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">θ</text>
<circle cx="320.0" cy="130.0" r="6.0" fill="#d9480f"/>
<text x="330.0" y="120.0" text-anchor="start" font-size="14" fill="#222222" font-weight="bold">(0.8, 0.6)</text>
<text x="260.0" y="242.0" text-anchor="middle" font-size="14" fill="#d9480f" font-weight="bold">cos θ = 0.8</text>
<text x="362.0" y="180.0" text-anchor="start" font-size="14" fill="#d9480f" font-weight="bold">sin θ = 0.6</text>
<line x1="358.0" y1="175.0" x2="324.0" y2="175.0" stroke="#d9480f" stroke-width="1"/>
<text x="252.0" y="167.0" text-anchor="end" font-size="15" fill="#222222" font-weight="bold">1</text>
</svg>
