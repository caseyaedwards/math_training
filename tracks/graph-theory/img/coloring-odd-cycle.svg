<circle cx="109.6" cy="125.6" r="18.0" fill="#f4a37c" stroke="#222222" stroke-width="1.8"/>
<text x="109.6" y="130.6" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
