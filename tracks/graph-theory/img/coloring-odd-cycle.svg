<line x1="124.2" y1="115.1" x2="185.4" y2="70.6" stroke="#222222" stroke-width="1.8"/>
<circle cx="200.0" cy="60.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="200.0" y="65.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<circle cx="290.4" cy="125.6" r="18.0" fill="#adb5bd" stroke="#222222" stroke-width="1.8"/>
<text x="290.4" y="130.6" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
