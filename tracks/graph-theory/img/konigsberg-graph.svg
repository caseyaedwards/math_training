<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Seven bridges of Konigsberg as a graph</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="640" height="490" fill="#ffffff"/>
<text x="320.0" y="32.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">The Seven Bridges of Konigsberg as a Graph</text>
<path d="M320,90 Q204.1,116.1 170,230" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M320,90 Q285.9,203.9 170,230" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M320,350 Q282.5,243.1 170,230" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M320,350 Q207.5,336.9 170,230" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M320,90 Q400.0,160.0 480,230" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M320,350 Q400.0,290.0 480,230" fill="none" stroke="#222222" stroke-width="2"/>
<path d="M170,230 Q325.0,230.0 480,230" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="320.0" cy="90.0" r="16" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="320.0" y="95.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">A</text>
<text x="320.0" y="58.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">deg 3</text>
<circle cx="320.0" cy="350.0" r="16" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="320.0" y="355.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">B</text>
<text x="320.0" y="394.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">deg 3</text>
<circle cx="170.0" cy="230.0" r="16" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="170.0" y="235.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">C</text>
<text x="108.0" y="235.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">deg 5</text>
<circle cx="480.0" cy="230.0" r="16" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="480.0" y="235.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">D</text>
<text x="544.0" y="235.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">deg 3</text>
<text x="320.0" y="440.0" text-anchor="middle" fill="#222222" font-size="14">Seven edges = seven bridges. Every vertex has odd degree (5, 3, 3, 3).</text>
<text x="320.0" y="465.0" text-anchor="middle" fill="#666666" font-size="14">An Euler walk allows at most two odd vertices, so no such walk exists.</text>
</svg>
