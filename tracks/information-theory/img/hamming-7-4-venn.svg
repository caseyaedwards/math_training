<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Hamming 7,4 code drawn as three overlapping circles</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Hamming (7,4): Three Parity Circles</text>
<circle cx="220.0" cy="150.0" r="95.0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="110.0" y="75.0" text-anchor="middle" fill="#666666" font-size="12">circle 1</text>
<circle cx="340.0" cy="150.0" r="95.0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="450.0" y="75.0" text-anchor="middle" fill="#666666" font-size="12">circle 2</text>
<circle cx="280.0" cy="245.0" r="95.0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="400.0" y="330.0" text-anchor="middle" fill="#666666" font-size="12">circle 3</text>
<circle cx="280.0" cy="180.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="185.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">d4</text>
<circle cx="225.0" cy="210.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="225.0" y="215.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">d2</text>
<circle cx="335.0" cy="210.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="335.0" y="215.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">d3</text>
<circle cx="280.0" cy="115.0" r="17.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="120.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">d1</text>
<circle cx="170.0" cy="125.0" r="17.0" fill="#d9480f" fill-opacity="0.3" stroke="#222222" stroke-width="1.5"/>
<text x="170.0" y="130.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">p1</text>
<circle cx="390.0" cy="125.0" r="17.0" fill="#d9480f" fill-opacity="0.3" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="130.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">p2</text>
<circle cx="280.0" cy="285.0" r="17.0" fill="#d9480f" fill-opacity="0.3" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="290.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">p3</text>
<text x="470.0" y="200.0" text-anchor="middle" fill="#666666" font-size="12">Rule: each circle</text>
<text x="470.0" y="216.0" text-anchor="middle" fill="#666666" font-size="12">holds an even</text>
<text x="470.0" y="232.0" text-anchor="middle" fill="#666666" font-size="12">number of 1s.</text>
<text x="90.0" y="250.0" text-anchor="middle" fill="#666666" font-size="12">4 data bits d</text>
<text x="90.0" y="266.0" text-anchor="middle" fill="#d9480f" font-size="12">3 parity bits p</text>
</svg>
