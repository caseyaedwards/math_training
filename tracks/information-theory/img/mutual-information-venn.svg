<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Venn diagram of entropies and mutual information</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="600" height="320" fill="#ffffff"/>
<text x="300.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Mutual Information: The Shared Part</text>
<circle cx="240.0" cy="175.0" r="110.0" fill="#868e96" fill-opacity="0.25" stroke="#222222" stroke-width="2"/>
<circle cx="360.0" cy="175.0" r="110.0" fill="#d9480f" fill-opacity="0.2" stroke="#222222" stroke-width="2"/>
<text x="185.0" y="180.0" text-anchor="middle" fill="#222222" font-size="14">H(X | Y)</text>
<text x="415.0" y="180.0" text-anchor="middle" fill="#222222" font-size="14">H(Y | X)</text>
<text x="300.0" y="180.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">I(X; Y)</text>
<text x="105.0" y="85.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">H(X)</text>
<text x="495.0" y="85.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">H(Y)</text>
<text x="300.0" y="310.0" text-anchor="middle" fill="#666666" font-size="13">I(X; Y) = H(X) - H(X | Y): what knowing Y tells you about X</text>
</svg>
