<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Password entropy in bits for four password styles</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="660" height="300" fill="#ffffff"/>
<text x="330.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Password Entropy = Length x log2(Choices)</text>
<line x1="200.0" y1="50.0" x2="200.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/>
<text x="200.0" y="288.0" text-anchor="middle" fill="#666666" font-size="12">0</text>
<line x1="305.0" y1="50.0" x2="305.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/>
<text x="305.0" y="288.0" text-anchor="middle" fill="#666666" font-size="12">20</text>
<line x1="410.0" y1="50.0" x2="410.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/>
<text x="410.0" y="288.0" text-anchor="middle" fill="#666666" font-size="12">40</text>
<line x1="515.0" y1="50.0" x2="515.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/>
<text x="515.0" y="288.0" text-anchor="middle" fill="#666666" font-size="12">60</text>
<line x1="620.0" y1="50.0" x2="620.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/>
<text x="620.0" y="288.0" text-anchor="middle" fill="#666666" font-size="12">80</text>
<rect x="200.0" y="70.0" width="197.4" height="30.0" rx="0" fill="#868e96" fill-opacity="0.85" stroke="#222222" stroke-width="1"/>
<text x="190.0" y="90.0" text-anchor="end" fill="#222222" font-size="13">8 lowercase letters</text>
<text x="403.4" y="90.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">37.6 bits</text>
<rect x="200.0" y="122.0" width="250.1" height="30.0" rx="0" fill="#868e96" fill-opacity="0.85" stroke="#222222" stroke-width="1"/>
<text x="190.0" y="142.0" text-anchor="end" fill="#222222" font-size="13">8 chars, 62 symbols</text>
<text x="456.1" y="142.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">47.6 bits</text>
<rect x="200.0" y="174.0" width="271.4" height="30.0" rx="0" fill="#d9480f" fill-opacity="0.85" stroke="#222222" stroke-width="1"/>
<text x="190.0" y="194.0" text-anchor="end" fill="#222222" font-size="13">4 words, 7,776 list</text>
<text x="477.4" y="194.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">51.7 bits</text>
<rect x="200.0" y="226.0" width="375.1" height="30.0" rx="0" fill="#868e96" fill-opacity="0.85" stroke="#222222" stroke-width="1"/>
<text x="190.0" y="246.0" text-anchor="end" fill="#222222" font-size="13">12 chars, 62 symbols</text>
<text x="581.1" y="246.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">71.5 bits</text>
</svg>
