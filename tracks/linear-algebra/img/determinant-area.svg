<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" width="520" height="410" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Parallelogram spanned by the columns of a matrix with area equal to the determinant</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="520" height="410" fill="#ffffff"/>
<text x="260.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Determinant = Area of the Image of the Unit Square</text>
<line x1="75.0" y1="340.0" x2="75.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="145.0" y1="340.0" x2="145.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="215.0" y1="340.0" x2="215.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="285.0" y1="340.0" x2="285.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="355.0" y1="340.0" x2="355.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="425.0" y1="340.0" x2="425.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="340.0" x2="425.0" y2="340.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="270.0" x2="425.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="200.0" x2="425.0" y2="200.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="130.0" x2="425.0" y2="130.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="60.0" x2="425.0" y2="60.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="340.0" x2="425.0" y2="340.0" stroke="#666666" stroke-width="1.2"/>
<line x1="75.0" y1="340.0" x2="75.0" y2="60.0" stroke="#666666" stroke-width="1.2"/>
<polygon points="75.0,340.0 285.0,270.0 355.0,130.0 145.0,200.0" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<polygon points="75.0,340.0 145.0,340.0 145.0,270.0 75.0,270.0" fill="#868e96" fill-opacity="0.4" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="75.0" y1="340.0" x2="285.0" y2="270.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="75.0" y1="340.0" x2="145.0" y2="200.0" stroke="#222222" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="291.0" y="284.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">column 1 = (3, 1)</text>
<text x="139.0" y="194.0" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">column 2 = (1, 2)</text>
<text x="229.0" y="228.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">area 5</text>
<text x="110.0" y="310.0" text-anchor="middle" fill="#222222" font-size="12">1</text>
<text x="260.0" y="400.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">det [[3, 1], [1, 2]] = 3·2 - 1·1 = 5</text>
</svg>
