<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Sorting Sentences into Statements and Non-Statements</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="660" height="300" fill="#ffffff"/>
<text x="330" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Which sentences are statements?</text>
<rect x="30" y="50" width="290" height="230" fill="#f6d5c4" stroke="#d9480f" stroke-width="2" rx="8"/>
<text x="175" y="76" text-anchor="middle" fill="#d9480f" font-weight="bold">Statements (have a truth value)</text>
<rect x="340" y="50" width="290" height="230" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="8" stroke-dasharray="6,4"/>
<text x="485" y="76" text-anchor="middle" fill="#222222" font-weight="bold">Not statements</text>
<rect x="46" y="92" width="258" height="44" fill="#ffffff" stroke="#222222" stroke-width="1" rx="4"/>
<text x="58" y="111" text-anchor="start" fill="#222222">The disk is full.</text>
<text x="58" y="129" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">T or F</text>
<rect x="46" y="148" width="258" height="44" fill="#ffffff" stroke="#222222" stroke-width="1" rx="4"/>
<text x="58" y="167" text-anchor="start" fill="#222222">2 + 2 = 5</text>
<text x="58" y="185" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">F</text>
<rect x="46" y="204" width="258" height="44" fill="#ffffff" stroke="#222222" stroke-width="1" rx="4"/>
<text x="58" y="223" text-anchor="start" fill="#222222">Every prime above 2 is odd.</text>
<text x="58" y="241" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">T</text>
<rect x="356" y="92" width="258" height="44" fill="#ffffff" stroke="#555555" stroke-width="1" rx="4"/>
<text x="368" y="111" text-anchor="start" fill="#222222">Fix the disk.</text>
<text x="368" y="129" text-anchor="start" fill="#555555" font-size="12">an order</text>
<rect x="356" y="148" width="258" height="44" fill="#ffffff" stroke="#555555" stroke-width="1" rx="4"/>
<text x="368" y="167" text-anchor="start" fill="#222222">Is the disk full?</text>
<text x="368" y="185" text-anchor="start" fill="#555555" font-size="12">a question</text>
<rect x="356" y="204" width="258" height="44" fill="#ffffff" stroke="#555555" stroke-width="1" rx="4"/>
<text x="368" y="223" text-anchor="start" fill="#222222">x &gt; 3</text>
<text x="368" y="241" text-anchor="start" fill="#555555" font-size="12">open: depends on x</text>
</svg>
