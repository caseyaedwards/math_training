<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A Set as a Bag: Membership and the Empty Set</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="660" height="300" fill="#ffffff"/>
<text x="330" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A set is a bag of distinct things</text>
<ellipse cx="200" cy="160" rx="140" ry="95" fill="#f6d5c4" stroke="#222222" stroke-width="2"/>
<text x="50" y="100" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">A</text>
<circle cx="150" cy="140" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="150" y="145" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">1</text>
<circle cx="220" cy="185" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="220" y="190" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">2</text>
<circle cx="260" cy="125" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="260" y="130" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">3</text>
<circle cx="400" cy="120" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="400" y="125" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">5</text>
<text x="220" y="228" text-anchor="middle" fill="#d9480f" font-weight="bold">2 ∈ A</text>
<text x="400" y="160" text-anchor="middle" fill="#222222" font-weight="bold">5 ∉ A</text>
<text x="200" y="285" text-anchor="middle" fill="#222222" font-weight="bold">A = {1, 2, 3}</text>
<ellipse cx="545" cy="160" rx="80" ry="55" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="545" y="166" text-anchor="middle" fill="#555555" font-size="12">nothing inside</text>
<text x="545" y="245" text-anchor="middle" fill="#222222" font-weight="bold">∅ = { }</text>
<text x="545" y="265" text-anchor="middle" fill="#555555" font-size="13">the empty set</text>
</svg>
