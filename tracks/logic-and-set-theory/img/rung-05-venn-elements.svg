<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Venn Diagram with A = {1, 2, 3, 4} and B = {3, 4, 5}</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><clipPath id="clip1"><circle cx="250" cy="170" r="110"/></clipPath></defs>
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
<text x="320" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A = {1, 2, 3, 4} and B = {3, 4, 5}, element by element</text>
<rect x="60" y="50" width="520" height="240" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="390" cy="170" r="110" fill="#f6d5c4" stroke="none" stroke-width="0" clip-path="url(#clip1)"/>
<circle cx="250" cy="170" r="110" fill="none" stroke="#222222" stroke-width="1.8"/>
<circle cx="390" cy="170" r="110" fill="none" stroke="#222222" stroke-width="1.8"/>
<text x="122" y="110" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">A</text>
<text x="518" y="110" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">B</text>
<circle cx="195" cy="150" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="195" y="155" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<circle cx="195" cy="200" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="195" y="205" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<circle cx="320" cy="150" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="320" y="155" text-anchor="middle" fill="#222222" font-weight="bold">3</text>
<circle cx="320" cy="200" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="320" y="205" text-anchor="middle" fill="#222222" font-weight="bold">4</text>
<circle cx="445" cy="175" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="445" y="180" text-anchor="middle" fill="#222222" font-weight="bold">5</text>
<text x="170" y="314" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">A ∖ B = {1, 2}</text>
<text x="320" y="314" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">A ∩ B = {3, 4}</text>
<text x="470" y="314" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">B ∖ A = {5}</text>
<text x="320" y="344" text-anchor="middle" fill="#222222" font-size="13">A ∪ B = {1, 2, 3, 4, 5}: count 4 + 3 − 2 = 5, because 3 and 4 sit in both circles</text>
</svg>
