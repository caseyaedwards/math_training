<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="740" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Venn Diagrams for Union, Intersection, Difference and Complement</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><clipPath id="clip1"><circle cx="76.0" cy="125" r="42"/></clipPath><clipPath id="clip2"><circle cx="120.0" cy="125" r="42"/></clipPath><clipPath id="clip3"><circle cx="258.0" cy="125" r="42"/></clipPath><clipPath id="clip4"><circle cx="302.0" cy="125" r="42"/></clipPath><clipPath id="clip5"><circle cx="440.0" cy="125" r="42"/></clipPath><clipPath id="clip6"><circle cx="484.0" cy="125" r="42"/></clipPath><clipPath id="clip7"><circle cx="622.0" cy="125" r="42"/></clipPath><clipPath id="clip8"><circle cx="666.0" cy="125" r="42"/></clipPath></defs>
<rect x="0" y="0" width="740" height="250" fill="#ffffff"/>
<text x="370" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Four set operations, four shadings</text>
