<circle cx="484" cy="125" r="42" fill="none" stroke="#222222" stroke-width="1.5"/>
<text x="421.1" y="130" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="502.9" y="130" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="462" y="201" text-anchor="middle" fill="#222222" font-weight="bold">A ∖ B</text>
