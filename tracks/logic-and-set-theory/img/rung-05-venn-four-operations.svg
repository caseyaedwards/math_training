<circle cx="302" cy="125" r="42" fill="none" stroke="#222222" stroke-width="1.5"/>
<text x="239.1" y="130" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="320.9" y="130" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="280" y="201" text-anchor="middle" fill="#222222" font-weight="bold">A ∩ B</text>
<text x="280" y="220" text-anchor="middle" fill="#555555" font-size="12">in A AND in B</text>
<rect x="386" y="71" width="152" height="108" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<circle cx="440" cy="125" r="42" fill="#f6d5c4" stroke="none" stroke-width="0"/>
