<text x="603.1" y="130" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="684.9" y="130" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="644" y="201" text-anchor="middle" fill="#222222" font-weight="bold">Aᶜ</text>
