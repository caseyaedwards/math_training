<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Quantifiers as Dots in a Box</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<text x="360" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Six servers. Orange: responds within 200 ms. Hollow: does not.</text>
<rect x="20" y="60" width="150" height="100" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<circle cx="55" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="95" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="135" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="55" cy="130" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="95" cy="130" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="135" cy="130" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<text x="95" y="184" text-anchor="middle" fill="#222222" font-weight="bold">∀s R(s)</text>
<text x="95" y="203" text-anchor="middle" fill="#555555" font-size="12">every one</text>
<rect x="197" y="60" width="150" height="100" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<circle cx="232" cy="92" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="272" cy="92" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="312" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="232" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="272" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="312" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="272" y="184" text-anchor="middle" fill="#222222" font-weight="bold">∃s R(s)</text>
<text x="272" y="203" text-anchor="middle" fill="#555555" font-size="12">at least one</text>
<rect x="374" y="60" width="150" height="100" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<circle cx="409" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="449" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="489" cy="92" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="409" cy="130" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<circle cx="449" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="489" cy="130" r="11" fill="#d9480f" stroke="none" stroke-width="0"/>
<text x="449" y="184" text-anchor="middle" fill="#222222" font-weight="bold">¬∀s R(s) ≡ ∃s ¬R(s)</text>
<text x="449" y="203" text-anchor="middle" fill="#555555" font-size="12">at least one fails</text>
<rect x="551" y="60" width="150" height="100" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="6"/>
<circle cx="586" cy="92" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="626" cy="92" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="666" cy="92" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="586" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="626" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<circle cx="666" cy="130" r="11" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="626" y="184" text-anchor="middle" fill="#222222" font-weight="bold">¬∃s R(s) ≡ ∀s ¬R(s)</text>
<text x="626" y="203" text-anchor="middle" fill="#555555" font-size="12">none respond</text>
<text x="360" y="270" text-anchor="middle" fill="#222222" font-size="13">To deny that every server is fast, one slow server is enough. All slow is not needed.</text>
</svg>
