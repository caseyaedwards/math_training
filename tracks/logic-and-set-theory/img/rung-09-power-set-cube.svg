<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Power Set of {a, b, c} as a Cube of Subsets</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="420" fill="#ffffff"/>
<text x="310" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">The 8 subsets of {a, b, c}, linked by adding one element</text>
<line x1="310" y1="352" x2="150" y2="288" stroke="#d9480f" stroke-width="2.4"/>
<line x1="310" y1="352" x2="310" y2="288" stroke="#d9480f" stroke-width="2.4"/>
<line x1="310" y1="352" x2="470" y2="288" stroke="#555555" stroke-width="1.2"/>
<line x1="150" y1="252" x2="150" y2="178" stroke="#d9480f" stroke-width="2.4"/>
<line x1="150" y1="252" x2="310" y2="178" stroke="#555555" stroke-width="1.2"/>
<line x1="310" y1="252" x2="150" y2="178" stroke="#d9480f" stroke-width="2.4"/>
<line x1="310" y1="252" x2="470" y2="178" stroke="#555555" stroke-width="1.2"/>
<line x1="470" y1="252" x2="310" y2="178" stroke="#555555" stroke-width="1.2"/>
<line x1="470" y1="252" x2="470" y2="178" stroke="#555555" stroke-width="1.2"/>
<line x1="150" y1="142" x2="310" y2="83" stroke="#555555" stroke-width="1.2"/>
<line x1="310" y1="142" x2="310" y2="83" stroke="#555555" stroke-width="1.2"/>
<line x1="470" y1="142" x2="310" y2="83" stroke="#555555" stroke-width="1.2"/>
<rect x="290.5" y="352" width="39" height="36" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="8"/>
<text x="310" y="375" text-anchor="middle" fill="#222222" font-weight="bold">∅</text>
<rect x="121.5" y="252" width="57" height="36" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="8"/>
<text x="150" y="275" text-anchor="middle" fill="#222222" font-weight="bold">{a}</text>
<rect x="281.5" y="252" width="57" height="36" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="8"/>
<text x="310" y="275" text-anchor="middle" fill="#222222" font-weight="bold">{b}</text>
<rect x="441.5" y="252" width="57" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="8"/>
<text x="470" y="275" text-anchor="middle" fill="#222222" font-weight="bold">{c}</text>
<rect x="108" y="142" width="84" height="36" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="8"/>
<text x="150" y="165" text-anchor="middle" fill="#222222" font-weight="bold">{a, b}</text>
<rect x="268" y="142" width="84" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="8"/>
<text x="310" y="165" text-anchor="middle" fill="#222222" font-weight="bold">{a, c}</text>
<rect x="428" y="142" width="84" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="8"/>
<text x="470" y="165" text-anchor="middle" fill="#222222" font-weight="bold">{b, c}</text>
<rect x="254.5" y="47" width="111" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="8"/>
<text x="310" y="70" text-anchor="middle" fill="#222222" font-weight="bold">{a, b, c}</text>
<text x="600" y="375" text-anchor="end" fill="#555555" font-size="12">size 0: 1</text>
<text x="600" y="275" text-anchor="end" fill="#555555" font-size="12">size 1: 3</text>
<text x="600" y="165" text-anchor="end" fill="#555555" font-size="12">size 2: 3</text>
<text x="600" y="70" text-anchor="end" fill="#555555" font-size="12">size 3: 1</text>
<text x="310" y="410" text-anchor="middle" fill="#222222" font-size="13">1 + 3 + 3 + 1 = 8 = 2³. Orange: the 4 = 2² subsets of {a, b}.</text>
</svg>
