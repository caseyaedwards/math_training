<text x="179" y="199" text-anchor="middle" fill="#222222" font-weight="bold">0</text>
<rect x="202" y="174" width="80" height="38" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="242" y="199" text-anchor="middle" fill="#222222">10</text>
