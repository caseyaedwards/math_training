<rect x="110" y="136" width="46" height="38" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="133" y="161" text-anchor="middle" fill="#222222" font-weight="bold">0</text>
<rect x="156" y="136" width="46" height="38" fill="#d9480f" stroke="#555555" stroke-width="0.8"/>
<text x="179" y="161" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
