<text x="242" y="85" text-anchor="middle" fill="#222222" font-weight="bold">mask</text>
<rect x="282" y="60" width="120" height="38" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<text x="342" y="85" text-anchor="middle" fill="#222222" font-weight="bold">subset</text>
