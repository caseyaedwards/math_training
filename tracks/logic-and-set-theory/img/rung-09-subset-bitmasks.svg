<text x="242" y="237" text-anchor="middle" fill="#222222">11</text>
<rect x="282" y="212" width="120" height="38" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="342" y="237" text-anchor="middle" fill="#222222" font-weight="bold">{a, b}</text>
<text x="280" y="270" text-anchor="middle" fill="#222222" font-size="13">2 elements, 2 choices each: 2 × 2 = 2² = 4 subsets</text>
