<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Induction as Falling Dominoes</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="720" height="270" fill="#ffffff"/>
<text x="360" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Induction: knock over the first domino, and each one knocks the next</text>
<polygon points="62.89,180.82 114.52,107.1 127.62,116.28 76,190" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="68" y="220" text-anchor="middle" fill="#222222" font-size="13">P(1)</text>
<polygon points="128.89,180.82 180.52,107.1 193.62,116.28 142,190" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="134" y="220" text-anchor="middle" fill="#222222" font-size="13">P(2)</text>
<polygon points="194.89,180.82 246.52,107.1 259.62,116.28 208,190" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="200" y="220" text-anchor="middle" fill="#222222" font-size="13">P(3)</text>
<polygon points="258.55,185.86 281.84,98.93 297.29,103.07 274,190" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="266" y="220" text-anchor="middle" fill="#222222" font-size="13">P(4)</text>
<polygon points="324,190 324,100 340,100 340,190" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="332" y="220" text-anchor="middle" fill="#222222" font-size="13">P(5)</text>
<polygon points="390,190 390,100 406,100 406,190" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="398" y="220" text-anchor="middle" fill="#222222" font-size="13">P(6)</text>
<polygon points="456,190 456,100 472,100 472,190" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="464" y="220" text-anchor="middle" fill="#222222" font-size="13">P(7)</text>
<polygon points="522,190 522,100 538,100 538,190" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="530" y="220" text-anchor="middle" fill="#222222" font-size="13">P(8)</text>
<polygon points="588,190 588,100 604,100 604,190" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="596" y="220" text-anchor="middle" fill="#222222" font-size="13">…</text>
<line x1="30" y1="190" x2="690" y2="190" stroke="#222222" stroke-width="1.5"/>
<line x1="36" y1="105" x2="62" y2="115" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<text x="40" y="95" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">base case: push P(1)</text>
<text x="470" y="80" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">step: if P(n) falls, P(n + 1) falls</text>
<text x="360" y="255" text-anchor="middle" fill="#222222" font-size="13">Both parts together topple every domino: P(n) is true for every n ≥ 1.</text>
</svg>
