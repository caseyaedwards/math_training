<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Four Proof Techniques as Flowcharts</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="380" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Four routes to a proof</text>
<text x="20" y="82" text-anchor="start" fill="#222222" font-weight="bold">Direct</text>
<rect x="150" y="55" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="235" y="80" text-anchor="middle" fill="#222222" font-size="13">assume p</text>
<line x1="322" y1="75" x2="346" y2="75" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="350" y="55" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="435" y="80" text-anchor="middle" fill="#222222" font-size="13">valid steps</text>
<line x1="522" y1="75" x2="546" y2="75" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="550" y="55" width="170" height="40" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="6"/>
<text x="635" y="80" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">conclude q</text>
<text x="20" y="148" text-anchor="start" fill="#222222" font-weight="bold">Contrapositive</text>
<rect x="150" y="121" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="235" y="146" text-anchor="middle" fill="#222222" font-size="13">assume ¬q</text>
<line x1="322" y1="141" x2="346" y2="141" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="350" y="121" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="435" y="146" text-anchor="middle" fill="#222222" font-size="13">valid steps</text>
<line x1="522" y1="141" x2="546" y2="141" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="550" y="121" width="170" height="40" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="6"/>
<text x="635" y="146" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">conclude ¬p</text>
<text x="20" y="214" text-anchor="start" fill="#222222" font-weight="bold">Contradiction</text>
<rect x="150" y="187" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="235" y="212" text-anchor="middle" fill="#222222" font-size="13">assume ¬(claim)</text>
<line x1="322" y1="207" x2="346" y2="207" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="350" y="187" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="435" y="212" text-anchor="middle" fill="#222222" font-size="13">valid steps</text>
<line x1="522" y1="207" x2="546" y2="207" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="550" y="187" width="170" height="40" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="6"/>
<text x="635" y="212" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">reach nonsense</text>
<text x="20" y="280" text-anchor="start" fill="#222222" font-weight="bold">Induction</text>
<rect x="150" y="253" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="235" y="278" text-anchor="middle" fill="#222222" font-size="13">prove P(1)</text>
<line x1="322" y1="273" x2="346" y2="273" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="350" y="253" width="170" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="435" y="278" text-anchor="middle" fill="#222222" font-size="13">P(n) gives P(n + 1)</text>
<line x1="522" y1="273" x2="546" y2="273" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="550" y="253" width="170" height="40" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="6"/>
<text x="635" y="278" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">all n</text>
<text x="380" y="322" text-anchor="middle" fill="#555555" font-size="13">Contradiction ends by rejecting the assumption. Induction chains the step forever.</text>
</svg>
