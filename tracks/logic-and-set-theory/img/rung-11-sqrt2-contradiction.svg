<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Proof by Contradiction That the Square Root of 2 Is Irrational</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
<text x="350" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Proof by contradiction: √2 = a/b in lowest terms leads to nonsense</text>
<rect x="60" y="52" width="300" height="40" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.6" rx="6"/>
<text x="210" y="77" text-anchor="middle" fill="#222222" font-weight="bold">Suppose √2 = a/b, lowest terms</text>
<line x1="210" y1="93" x2="210" y2="106" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="60" y="106" width="300" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="210" y="131" text-anchor="middle" fill="#222222">a² = 2b²: a² is even</text>
<line x1="210" y1="147" x2="210" y2="160" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="60" y="160" width="300" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="210" y="185" text-anchor="middle" fill="#222222">a is even: a = 2k</text>
<line x1="210" y1="201" x2="210" y2="214" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="60" y="214" width="300" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="210" y="239" text-anchor="middle" fill="#222222">4k² = 2b² gives b² = 2k²</text>
<line x1="210" y1="255" x2="210" y2="268" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="60" y="268" width="300" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="210" y="293" text-anchor="middle" fill="#222222">b² is even: b is even</text>
<line x1="210" y1="309" x2="210" y2="322" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<rect x="60" y="322" width="300" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="210" y="347" text-anchor="middle" fill="#222222">a and b both even</text>
<rect x="430" y="322" width="220" height="40" fill="#d9480f" stroke="#d9480f" stroke-width="1.6" rx="6"/>
<text x="540" y="347" text-anchor="middle" fill="#ffffff" font-weight="bold">contradicts lowest terms</text>
<line x1="362" y1="342" x2="426" y2="342" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<path d="M540,320 L540,72 L366,72" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<text x="548" y="160" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">the assumption</text>
<text x="548" y="178" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">is false</text>
<line x1="380" y1="62" x2="398" y2="82" stroke="#d9480f" stroke-width="3"/>
<line x1="380" y1="82" x2="398" y2="62" stroke="#d9480f" stroke-width="3"/>
<text x="350" y="388" text-anchor="middle" fill="#222222" font-weight="bold">Therefore √2 is not a fraction.</text>
</svg>
