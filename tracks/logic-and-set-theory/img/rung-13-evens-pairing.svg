<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Pairing Each Whole Number n with the Even Number 2n</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="210" fill="#ffffff"/>
<text x="350" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">The evens are as many as the whole numbers: pair n with 2n</text>
<circle cx="60" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="60" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<circle cx="60" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="60" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<line x1="60" y1="87" x2="60" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="130" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="130" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<circle cx="130" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="130" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<line x1="130" y1="87" x2="130" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="200" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="200" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
<circle cx="200" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="200" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">6</text>
<line x1="200" y1="87" x2="200" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="270" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="270" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<circle cx="270" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="270" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">8</text>
<line x1="270" y1="87" x2="270" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="340" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="340" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">5</text>
<circle cx="340" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="340" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">10</text>
<line x1="340" y1="87" x2="340" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="410" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="410" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">6</text>
<circle cx="410" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="410" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">12</text>
<line x1="410" y1="87" x2="410" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="480" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="480" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">7</text>
<circle cx="480" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="480" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">14</text>
<line x1="480" y1="87" x2="480" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<circle cx="550" cy="70" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="550" y="75" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">8</text>
<circle cx="550" cy="150" r="16" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.4"/>
<text x="550" y="155" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">16</text>
<line x1="550" y1="87" x2="550" y2="133" stroke="#d9480f" stroke-width="1.6"/>
<text x="600" y="75" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="600" y="155" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="630" y="75" text-anchor="start" fill="#222222" font-weight="bold" font-style="italic">n</text>
<text x="630" y="155" text-anchor="start" fill="#222222" font-weight="bold" font-style="italic">2n</text>
<text x="350" y="198" text-anchor="middle" fill="#222222" font-size="13">Every n has one partner and every even number is used once: a bijection.</text>
</svg>
