<rect x="320" y="240" width="62" height="40" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="351" y="265" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">5</text>
<rect x="390" y="240" width="62" height="40" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="421" y="265" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">6</text>
<rect x="460" y="240" width="62" height="40" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="491" y="265" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">7</text>
<rect x="530" y="240" width="62" height="40" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="561" y="265" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">8</text>
<rect x="600" y="240" width="62" height="40" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="631" y="265" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">9</text>
<path d="M71.0,240 Q106.0,210 141.0,240" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M141.0,240 Q211.0,198 281.0,240" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M211.0,240 Q316.0,186 421.0,240" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M281.0,240 Q421.0,174 561.0,240" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<text x="674" y="265" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="370" y="310" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">Odd rooms 1, 3, 5, 7, 9, … open up for the new guests.</text>
