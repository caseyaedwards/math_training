<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Hilbert's Hotel: Shifting Guests to Free Rooms</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="740" height="340" fill="#ffffff"/>
<text x="370" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Hilbert's Hotel: every room is full, and there is still space</text>
<text x="40" y="58" text-anchor="start" fill="#222222" font-weight="bold">One new guest: move room n to room n + 1</text>
