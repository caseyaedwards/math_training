<path d="M147.0,100 Q176.0,76 205.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M217.0,100 Q246.0,76 275.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M287.0,100 Q316.0,76 345.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M357.0,100 Q386.0,76 415.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M427.0,100 Q456.0,76 485.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M497.0,100 Q526.0,76 555.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<path d="M567.0,100 Q596.0,76 625.0,100" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrD)"/>
<text x="71" y="160" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">new guest</text>
