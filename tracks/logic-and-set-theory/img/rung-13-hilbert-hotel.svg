<text x="491" y="125" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">7</text>
<rect x="530" y="100" width="62" height="40" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="561" y="125" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">8</text>
