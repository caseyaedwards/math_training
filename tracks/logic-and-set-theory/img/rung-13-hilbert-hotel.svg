<text x="40" y="200" text-anchor="start" fill="#222222" font-weight="bold">Infinitely many new guests: move room n to room 2n</text>
<rect x="40" y="240" width="62" height="40" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="71" y="265" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">1</text>
<rect x="110" y="240" width="62" height="40" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
