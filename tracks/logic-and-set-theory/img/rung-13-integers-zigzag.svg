<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="740" height="280" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Listing the Integers in a Zigzag: 0, 1, -1, 2, -2, ...</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="740" height="280" fill="#ffffff"/>
<text x="370" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">The integers in one list: 0, 1, −1, 2, −2, 3, −3, …</text>
<line x1="25" y1="200" x2="715" y2="200" stroke="#222222" stroke-width="1.5"/>
<circle cx="70" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="70" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">−4</text>
<circle cx="145" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="145" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">−3</text>
<circle cx="220" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="220" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">−2</text>
<circle cx="295" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="295" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">−1</text>
<circle cx="370" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="370" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0</text>
<circle cx="445" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="445" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<circle cx="520" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="520" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<circle cx="595" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="595" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">3</text>
<circle cx="670" cy="200" r="14" fill="#f6d5c4" stroke="#222222" stroke-width="1.3"/>
<text x="670" y="205" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<path d="M370.0,184 Q407.5,154 445.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M445.0,184 Q370.0,124 295.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M295.0,184 Q407.5,94 520.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M520.0,184 Q370.0,64 220.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M220.0,184 Q407.5,34 595.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M595.0,184 Q370.0,4 145.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M145.0,184 Q407.5,-26 670.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<path d="M670.0,184 Q370.0,-56 70.0,184" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#arrA)"/>
<text x="370" y="236" text-anchor="middle" fill="#555555" font-size="12">1st</text>
<text x="445" y="236" text-anchor="middle" fill="#555555" font-size="12">2nd</text>
<text x="295" y="236" text-anchor="middle" fill="#555555" font-size="12">3rd</text>
<text x="520" y="236" text-anchor="middle" fill="#555555" font-size="12">4th</text>
<text x="220" y="236" text-anchor="middle" fill="#555555" font-size="12">5th</text>
<text x="595" y="236" text-anchor="middle" fill="#555555" font-size="12">6th</text>
<text x="145" y="236" text-anchor="middle" fill="#555555" font-size="12">7th</text>
<text x="670" y="236" text-anchor="middle" fill="#555555" font-size="12">8th</text>
<text x="70" y="236" text-anchor="middle" fill="#555555" font-size="12">9th</text>
<text x="370" y="268" text-anchor="middle" fill="#222222" font-size="13">Every integer gets a finite place in the list: the integers are countable.</text>
</svg>
