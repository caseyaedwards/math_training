<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Cantor's Diagonal Argument on Four Binary Strings</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="410" fill="#ffffff"/>
<text x="280" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Flip the diagonal to build a string that is not on the list</text>
<text x="166" y="50" text-anchor="middle" fill="#555555" font-size="12">bit 1</text>
<text x="218" y="50" text-anchor="middle" fill="#555555" font-size="12">bit 2</text>
<text x="270" y="50" text-anchor="middle" fill="#555555" font-size="12">bit 3</text>
<text x="322" y="50" text-anchor="middle" fill="#555555" font-size="12">bit 4</text>
<text x="126" y="91" text-anchor="end" fill="#222222" font-weight="bold">s1</text>
<rect x="140" y="60" width="52" height="52" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="166" y="92" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">0</text>
<rect x="192" y="60" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="218" y="92" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="244" y="60" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="270" y="92" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="296" y="60" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="322" y="92" text-anchor="middle" fill="#222222" font-size="16">0</text>
<text x="362" y="91" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="126" y="143" text-anchor="end" fill="#222222" font-weight="bold">s2</text>
<rect x="140" y="112" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="166" y="144" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="192" y="112" width="52" height="52" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="218" y="144" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">0</text>
<rect x="244" y="112" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="270" y="144" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="296" y="112" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="322" y="144" text-anchor="middle" fill="#222222" font-size="16">0</text>
<text x="362" y="143" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="126" y="195" text-anchor="end" fill="#222222" font-weight="bold">s3</text>
<rect x="140" y="164" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="166" y="196" text-anchor="middle" fill="#222222" font-size="16">0</text>
<rect x="192" y="164" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="218" y="196" text-anchor="middle" fill="#222222" font-size="16">0</text>
<rect x="244" y="164" width="52" height="52" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="270" y="196" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">1</text>
<rect x="296" y="164" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="322" y="196" text-anchor="middle" fill="#222222" font-size="16">1</text>
<text x="362" y="195" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="126" y="247" text-anchor="end" fill="#222222" font-weight="bold">s4</text>
<rect x="140" y="216" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="166" y="248" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="192" y="216" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="218" y="248" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="244" y="216" width="52" height="52" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="270" y="248" text-anchor="middle" fill="#222222" font-size="16">1</text>
<rect x="296" y="216" width="52" height="52" fill="#f6d5c4" stroke="#d9480f" stroke-width="2"/>
<text x="322" y="248" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">1</text>
<text x="362" y="247" text-anchor="start" fill="#222222" font-size="16">…</text>
<text x="244" y="290" text-anchor="middle" fill="#222222" font-size="16">⋮</text>
<text x="126" y="349" text-anchor="end" fill="#d9480f" font-weight="bold">new</text>
<rect x="140" y="318" width="52" height="52" fill="#d9480f" stroke="#ffffff" stroke-width="2"/>
<text x="166" y="350" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">1</text>
<rect x="192" y="318" width="52" height="52" fill="#d9480f" stroke="#ffffff" stroke-width="2"/>
<text x="218" y="350" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">1</text>
<rect x="244" y="318" width="52" height="52" fill="#d9480f" stroke="#ffffff" stroke-width="2"/>
<text x="270" y="350" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">0</text>
<rect x="296" y="318" width="52" height="52" fill="#d9480f" stroke="#ffffff" stroke-width="2"/>
<text x="322" y="350" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">0</text>
<text x="362" y="340" text-anchor="start" fill="#555555" font-size="13">diagonal 0 0 1 1</text>
<text x="362" y="360" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">flipped 1 1 0 0</text>
<text x="280" y="400" text-anchor="middle" fill="#222222" font-size="13">The new string differs from string n at bit n, for every n.</text>
</svg>
