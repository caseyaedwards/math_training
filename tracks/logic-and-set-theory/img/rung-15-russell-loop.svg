<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Russell's Paradox as an Endless Loop</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="300" fill="#ffffff"/>
<text x="310" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">R = {x | x ∉ x}: each answer flips to the other</text>
<rect x="60" y="110" width="180" height="60" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="150" y="145" text-anchor="middle" fill="#222222" font-size="18">R ∈ R</text>
<rect x="380" y="110" width="180" height="60" fill="#ffffff" stroke="#222222" stroke-width="1.6" rx="6"/>
<text x="470" y="145" text-anchor="middle" fill="#222222" font-size="18">R ∉ R</text>
<path d="M150,108 C150,50 470,50 470,106" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<path d="M470,172 C470,232 150,232 150,174" fill="none" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<text x="310" y="58" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">then R fails its own rule</text>
<text x="310" y="236" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">then R passes the rule, and belongs</text>
<text x="310" y="280" text-anchor="middle" fill="#222222" font-size="13">Neither answer is stable: R ∈ R ⇔ R ∉ R. ZFC bans building R.</text>
</svg>
