<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Provable Statements Sit Inside True Statements, with Godel's Sentence Outside</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="330" fill="#ffffff"/>
<text x="310" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Gödel: in a consistent system, provable ⊂ true, and G slips through</text>
<rect x="30" y="50" width="560" height="240" fill="#ffffff" stroke="#222222" stroke-width="1.5" rx="8"/>
<text x="50" y="76" text-anchor="start" fill="#555555" font-size="13">all arithmetic statements</text>
<ellipse cx="300" cy="175" rx="220" ry="95" fill="#f6d5c4" stroke="#222222" stroke-width="1.8"/>
<text x="300" y="102" text-anchor="middle" fill="#222222" font-weight="bold">true statements</text>
<ellipse cx="240" cy="185" rx="120" ry="55" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="240" y="182" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">provable from</text>
<text x="240" y="200" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">the axioms</text>
<circle cx="430" cy="185" r="9" fill="#d9480f" stroke="none" stroke-width="0"/>
<text x="430" y="214" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">G: true,</text>
<text x="430" y="231" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">not provable</text>
<text x="310" y="316" text-anchor="middle" fill="#222222" font-size="13">G says, in effect, this statement has no proof. Adding G as an axiom creates a new G.</text>
</svg>
