<text x="30.0" y="185.0" text-anchor="start" fill="#666666" font-size="12">running total: ... 119 cents</text>
<text x="30.0" y="225.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">Lebesgue: sort by value, count each pile, multiply, add</text>
<circle cx="90.0" cy="330.0" r="20.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<circle cx="90.0" cy="312.0" r="20.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<circle cx="90.0" cy="294.0" r="20.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<text x="90.0" y="299.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">25</text>
<text x="90.0" y="375.0" text-anchor="middle" fill="#222222" font-size="13">25 x 3 = 75</text>
<circle cx="240.0" cy="330.0" r="14.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<circle cx="240.0" cy="312.0" r="14.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
