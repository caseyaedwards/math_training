<text x="240.0" y="375.0" text-anchor="middle" fill="#222222" font-size="13">10 x 3 = 30</text>
<circle cx="390.0" cy="330.0" r="17.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<circle cx="390.0" cy="312.0" r="17.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="317.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">5</text>
<text x="390.0" y="375.0" text-anchor="middle" fill="#222222" font-size="13">5 x 2 = 10</text>
<circle cx="540.0" cy="330.0" r="15.0" fill="#f4c7a8" stroke="#222222" stroke-width="1.5"/>
<circle cx="540.0" cy="312.0" r="15.0" fill="#f4c7a8" stroke="#222222" stroke-width="1.5"/>
<circle cx="540.0" cy="294.0" r="15.0" fill="#f4c7a8" stroke="#222222" stroke-width="1.5"/>
<circle cx="540.0" cy="276.0" r="15.0" fill="#f4c7a8" stroke="#222222" stroke-width="1.5"/>
<text x="540.0" y="281.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">1</text>
<text x="540.0" y="375.0" text-anchor="middle" fill="#222222" font-size="13">1 x 4 = 4</text>
<text x="720.0" y="300.0" text-anchor="middle" fill="#222222" font-size="14">75 + 30 + 10 + 4</text>
<text x="720.0" y="325.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">= 119 cents</text>
<text x="720.0" y="350.0" text-anchor="middle" fill="#666666" font-size="12">same total</text>
</svg>
