<text x="434.0" y="160.0" text-anchor="middle" fill="#666666" font-size="11">68</text>
<circle cx="498.0" cy="115.0" r="14.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<text x="498.0" y="120.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">10</text>
<text x="498.0" y="160.0" text-anchor="middle" fill="#666666" font-size="11">78</text>
<circle cx="562.0" cy="115.0" r="20.0" fill="#dee2e6" stroke="#222222" stroke-width="1.5"/>
<text x="562.0" y="120.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">25</text>
<text x="562.0" y="160.0" text-anchor="middle" fill="#666666" font-size="11">103</text>
