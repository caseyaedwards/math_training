<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Growing nested intervals have lengths that climb to the length of their union</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
<text x="410.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Growing Sets: Measure Climbs to the Limit</text>
<rect x="130.0" y="60.0" width="280.0" height="20.0" rx="0" fill="#868e96" fill-opacity="0.45" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="75.0" text-anchor="end" fill="#222222" font-size="12">A2 = [0, 1 - 1/2)</text>
<text x="702.0" y="75.0" text-anchor="start" fill="#222222" font-size="12">length 0.50</text>
<rect x="130.0" y="96.0" width="373.3" height="20.0" rx="0" fill="#868e96" fill-opacity="0.45" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="111.0" text-anchor="end" fill="#222222" font-size="12">A3 = [0, 1 - 1/3)</text>
<text x="702.0" y="111.0" text-anchor="start" fill="#222222" font-size="12">length 0.67</text>
<rect x="130.0" y="132.0" width="420.0" height="20.0" rx="0" fill="#868e96" fill-opacity="0.45" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="147.0" text-anchor="end" fill="#222222" font-size="12">A4 = [0, 1 - 1/4)</text>
<text x="702.0" y="147.0" text-anchor="start" fill="#222222" font-size="12">length 0.75</text>
<rect x="130.0" y="168.0" width="448.0" height="20.0" rx="0" fill="#868e96" fill-opacity="0.45" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="183.0" text-anchor="end" fill="#222222" font-size="12">A5 = [0, 1 - 1/5)</text>
<text x="702.0" y="183.0" text-anchor="start" fill="#222222" font-size="12">length 0.80</text>
<rect x="130.0" y="204.0" width="504.0" height="20.0" rx="0" fill="#868e96" fill-opacity="0.45" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="219.0" text-anchor="end" fill="#222222" font-size="12">A10 = [0, 1 - 1/10)</text>
<text x="702.0" y="219.0" text-anchor="start" fill="#222222" font-size="12">length 0.90</text>
<rect x="130.0" y="240.0" width="554.4" height="20.0" rx="0" fill="#d9480f" fill-opacity="0.45" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="255.0" text-anchor="end" fill="#222222" font-size="12">A100 = [0, 1 - 1/100)</text>
<text x="702.0" y="255.0" text-anchor="start" fill="#222222" font-size="12">length 0.99</text>
<line x1="690.0" y1="55.0" x2="690.0" y2="285.0" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="690.0" y="300.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">union [0, 1): length 1</text>
<text x="410.0" y="322.0" text-anchor="middle" fill="#666666" font-size="12">If A1 ⊂ A2 ⊂ A3 ⊂ ..., then measure(A_n) climbs to measure(union). Countable additivity gives this.</text>
</svg>
