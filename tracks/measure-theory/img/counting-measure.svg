<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Counting measure and probability weights on the faces of a die</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="820" height="300" fill="#ffffff"/>
<text x="410.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Two Measures on the Same Six Points</text>
<text x="30.0" y="65.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">counting measure: each point weighs 1</text>
<circle cx="70.0" cy="110.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="70.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<text x="70.0" y="148.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<circle cx="150.0" cy="110.0" r="18.0" fill="#d9480f" fill-opacity="0.7" stroke="#222222" stroke-width="1.5"/>
<text x="150.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<text x="150.0" y="148.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<circle cx="230.0" cy="110.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="230.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<text x="230.0" y="148.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<circle cx="310.0" cy="110.0" r="18.0" fill="#d9480f" fill-opacity="0.7" stroke="#222222" stroke-width="1.5"/>
<text x="310.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">4</text>
<text x="310.0" y="148.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<circle cx="390.0" cy="110.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">5</text>
<text x="390.0" y="148.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<circle cx="470.0" cy="110.0" r="18.0" fill="#d9480f" fill-opacity="0.7" stroke="#222222" stroke-width="1.5"/>
<text x="470.0" y="115.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">6</text>
<text x="470.0" y="148.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<text x="30.0" y="175.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">probability: each point weighs 1/6</text>
<circle cx="70.0" cy="220.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="70.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1</text>
<text x="70.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">1/6</text>
<circle cx="150.0" cy="220.0" r="18.0" fill="#d9480f" fill-opacity="0.7" stroke="#222222" stroke-width="1.5"/>
<text x="150.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">2</text>
<text x="150.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">1/6</text>
<circle cx="230.0" cy="220.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="230.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3</text>
<text x="230.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">1/6</text>
<circle cx="310.0" cy="220.0" r="18.0" fill="#d9480f" fill-opacity="0.7" stroke="#222222" stroke-width="1.5"/>
<text x="310.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">4</text>
<text x="310.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">1/6</text>
<circle cx="390.0" cy="220.0" r="18.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">5</text>
<text x="390.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">1/6</text>
<circle cx="470.0" cy="220.0" r="18.0" fill="#d9480f" fill-opacity="0.7" stroke="#222222" stroke-width="1.5"/>
<text x="470.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">6</text>
<text x="470.0" y="258.0" text-anchor="middle" fill="#666666" font-size="12">1/6</text>
<rect x="560.0" y="70.0" width="240.0" height="180.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="680.0" y="100.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">event A = {2, 4, 6}</text>
<text x="680.0" y="135.0" text-anchor="middle" fill="#222222" font-size="14">count(A) = 1 + 1 + 1 = 3</text>
<text x="680.0" y="170.0" text-anchor="middle" fill="#222222" font-size="14">P(A) = 1/6 + 1/6 + 1/6</text>
<text x="680.0" y="192.0" text-anchor="middle" fill="#222222" font-size="14">= 1/2</text>
<text x="680.0" y="230.0" text-anchor="middle" fill="#666666" font-size="12">same sets, different weights</text>
<text x="410.0" y="290.0" text-anchor="middle" fill="#666666" font-size="13">A measure is a rule that gives each allowed set a size. Weights on points are the simplest kind.</text>
</svg>
