<rect x="510.0" y="70.0" width="290.0" height="200.0" rx="6" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="655.0" y="98.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">Riemann</text>
<text x="655.0" y="120.0" text-anchor="middle" fill="#222222" font-size="12">every strip holds both kinds</text>
<text x="655.0" y="140.0" text-anchor="middle" fill="#222222" font-size="12">upper sum 1, lower sum 0</text>
<text x="655.0" y="160.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">no single answer: fails</text>
<text x="655.0" y="200.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">Lebesgue</text>
<text x="655.0" y="222.0" text-anchor="middle" fill="#222222" font-size="12">1 x length(rationals) +</text>
<text x="655.0" y="240.0" text-anchor="middle" fill="#222222" font-size="12">0 x length(irrationals) = 1 x 0 + 0 x 1</text>
<text x="655.0" y="260.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">= 0</text>
<text x="410.0" y="315.0" text-anchor="middle" fill="#666666" font-size="12">Dots are only a sketch: between any two numbers lie both rationals and irrationals.</text>
