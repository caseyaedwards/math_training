<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Length and area add over pieces that do not overlap</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A Measure Adds Up Over Separate Pieces</text>
<line x1="40.0" y1="150.0" x2="400.0" y2="150.0" stroke="#222222" stroke-width="1.5"/>
<line x1="40.0" y1="145.0" x2="40.0" y2="155.0" stroke="#222222" stroke-width="1.5"/>
<text x="40.0" y="175.0" text-anchor="middle" fill="#666666" font-size="13">0</text>
<line x1="112.0" y1="145.0" x2="112.0" y2="155.0" stroke="#222222" stroke-width="1.5"/>
<text x="112.0" y="175.0" text-anchor="middle" fill="#666666" font-size="13">1</text>
<line x1="184.0" y1="145.0" x2="184.0" y2="155.0" stroke="#222222" stroke-width="1.5"/>
<text x="184.0" y="175.0" text-anchor="middle" fill="#666666" font-size="13">2</text>
<line x1="256.0" y1="145.0" x2="256.0" y2="155.0" stroke="#222222" stroke-width="1.5"/>
<text x="256.0" y="175.0" text-anchor="middle" fill="#666666" font-size="13">3</text>
<line x1="328.0" y1="145.0" x2="328.0" y2="155.0" stroke="#222222" stroke-width="1.5"/>
<text x="328.0" y="175.0" text-anchor="middle" fill="#666666" font-size="13">4</text>
<line x1="400.0" y1="145.0" x2="400.0" y2="155.0" stroke="#222222" stroke-width="1.5"/>
<text x="400.0" y="175.0" text-anchor="middle" fill="#666666" font-size="13">5</text>
<rect x="112.0" y="132.0" width="108.0" height="14.0" rx="0" fill="#868e96" fill-opacity="0.6" stroke="#222222" stroke-width="1"/>
<rect x="220.0" y="132.0" width="108.0" height="14.0" rx="0" fill="#d9480f" fill-opacity="0.6" stroke="#222222" stroke-width="1"/>
<text x="166.0" y="122.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">1.5</text>
<text x="274.0" y="122.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">1.5</text>
<text x="220.0" y="80.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">length [1, 4] = 3</text>
<text x="220.0" y="215.0" text-anchor="middle" fill="#222222" font-size="14">1.5 + 1.5 = 3</text>
<text x="220.0" y="238.0" text-anchor="middle" fill="#666666" font-size="13">cut a segment: the pieces add back</text>
<rect x="480.0" y="160.0" width="135.0" height="90.0" rx="0" fill="#868e96" fill-opacity="0.5" stroke="#222222" stroke-width="1.5"/>
<rect x="480.0" y="70.0" width="45.0" height="90.0" rx="0" fill="#d9480f" fill-opacity="0.5" stroke="#222222" stroke-width="1.5"/>
<line x1="525.0" y1="160.0" x2="525.0" y2="250.0" stroke="#222222" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="570.0" y1="160.0" x2="570.0" y2="250.0" stroke="#222222" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="480.0" y1="205.0" x2="615.0" y2="205.0" stroke="#222222" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="480.0" y1="115.0" x2="525.0" y2="115.0" stroke="#222222" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="547.5" y="272.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">3 x 2 = 6</text>
<text x="470.0" y="120.0" text-anchor="end" fill="#d9480f" font-size="14" font-weight="bold">1 x 2 = 2</text>
<text x="645.0" y="115.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">area of the L-shape</text>
<text x="645.0" y="137.0" text-anchor="start" fill="#222222" font-size="14">= 6 + 2 = 8 unit squares</text>
<text x="645.0" y="159.0" text-anchor="start" fill="#666666" font-size="13">split into rectangles,</text>
<text x="645.0" y="177.0" text-anchor="start" fill="#666666" font-size="13">add the areas</text>
<text x="430.0" y="315.0" text-anchor="middle" fill="#666666" font-size="13">Rule: if A and B do not overlap, size(A together with B) = size(A) + size(B).</text>
</svg>
