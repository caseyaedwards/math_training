<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Outer measure as the smallest total length of a cover</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
<text x="430.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Outer Measure: Cover the Set, Then Shrink the Cover</text>
<text x="110.0" y="75.0" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">the set E</text>
<line x1="120.0" y1="70.0" x2="760.0" y2="70.0" stroke="#cccccc" stroke-width="1"/>
<line x1="184.0" y1="70.0" x2="312.0" y2="70.0" stroke="#222222" stroke-width="6"/>
<line x1="440.0" y1="70.0" x2="696.0" y2="70.0" stroke="#222222" stroke-width="6"/>
<text x="110.0" y="130.0" text-anchor="end" fill="#222222" font-size="13">loose cover</text>
<line x1="120.0" y1="125.0" x2="760.0" y2="125.0" stroke="#cccccc" stroke-width="1"/>
<rect x="152.0" y="116.0" width="576.0" height="18.0" rx="0" fill="#868e96" fill-opacity="0.3" stroke="#868e96" stroke-width="1.5"/>
<text x="772.0" y="130.0" text-anchor="start" fill="#222222" font-size="13">total 0.90</text>
<text x="110.0" y="185.0" text-anchor="end" fill="#222222" font-size="13">better cover</text>
<line x1="120.0" y1="180.0" x2="760.0" y2="180.0" stroke="#cccccc" stroke-width="1"/>
<rect x="171.2" y="171.0" width="160.0" height="18.0" rx="0" fill="#d9480f" fill-opacity="0.3" stroke="#d9480f" stroke-width="1.5"/>
<rect x="420.8" y="171.0" width="288.0" height="18.0" rx="0" fill="#d9480f" fill-opacity="0.3" stroke="#d9480f" stroke-width="1.5"/>
<text x="772.0" y="185.0" text-anchor="start" fill="#222222" font-size="13">total 0.70</text>
<text x="110.0" y="240.0" text-anchor="end" fill="#222222" font-size="13">tight cover</text>
<line x1="120.0" y1="235.0" x2="760.0" y2="235.0" stroke="#cccccc" stroke-width="1"/>
<rect x="184.0" y="226.0" width="128.0" height="18.0" rx="0" fill="#d9480f" fill-opacity="0.3" stroke="#d9480f" stroke-width="1.5"/>
<rect x="440.0" y="226.0" width="256.0" height="18.0" rx="0" fill="#d9480f" fill-opacity="0.3" stroke="#d9480f" stroke-width="1.5"/>
<text x="772.0" y="240.0" text-anchor="start" fill="#d9480f" font-size="13">total 0.60</text>
<line x1="120.0" y1="290.0" x2="760.0" y2="290.0" stroke="#222222" stroke-width="1.5"/>
<line x1="120.0" y1="285.0" x2="120.0" y2="295.0" stroke="#222222" stroke-width="1.5"/>
<text x="120.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">0</text>
<line x1="184.0" y1="285.0" x2="184.0" y2="295.0" stroke="#222222" stroke-width="1.5"/>
<text x="184.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">0.1</text>
<line x1="312.0" y1="285.0" x2="312.0" y2="295.0" stroke="#222222" stroke-width="1.5"/>
<text x="312.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">0.3</text>
<line x1="440.0" y1="285.0" x2="440.0" y2="295.0" stroke="#222222" stroke-width="1.5"/>
<text x="440.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">0.5</text>
<line x1="696.0" y1="285.0" x2="696.0" y2="295.0" stroke="#222222" stroke-width="1.5"/>
<text x="696.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">0.9</text>
<line x1="760.0" y1="285.0" x2="760.0" y2="295.0" stroke="#222222" stroke-width="1.5"/>
<text x="760.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<text x="440.0" y="262.0" text-anchor="middle" fill="#666666" font-size="13">outer measure of E = smallest total you can reach = 0.2 + 0.4 = 0.6</text>
</svg>
