<text x="170.0" y="255.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">x + y &lt; 1</text>
<text x="230.0" y="362.0" text-anchor="middle" fill="#666666" font-size="13">Ω = unit square, P = area</text>
<text x="420.0" y="80.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Ω (sample space)</text>
<text x="420.0" y="98.0" text-anchor="start" fill="#666666" font-size="13">every possible outcome: the square</text>
<text x="420.0" y="124.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">F (events)</text>
<text x="420.0" y="142.0" text-anchor="start" fill="#666666" font-size="13">the measurable subsets: a sigma-algebra</text>
<text x="420.0" y="168.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">P (measure)</text>
<text x="420.0" y="186.0" text-anchor="start" fill="#666666" font-size="13">area, with P(Ω) = 1</text>
<text x="420.0" y="212.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">random variable</text>
<text x="420.0" y="230.0" text-anchor="start" fill="#666666" font-size="13">a measurable function, such as X = x + y</text>
<text x="420.0" y="256.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">expected value</text>
<text x="420.0" y="274.0" text-anchor="start" fill="#666666" font-size="13">the integral of X against P</text>
<text x="420.0" y="300.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">P(x + y &lt; 1)</text>
<text x="420.0" y="318.0" text-anchor="start" fill="#666666" font-size="13">area of the triangle = 1/2</text>
</svg>
