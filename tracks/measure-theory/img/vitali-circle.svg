<text x="274.3" y="59.8" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">V</text>
<text x="365.2" y="150.7" text-anchor="middle" fill="#666666" font-size="12">V+1/8</text>
<text x="365.2" y="279.3" text-anchor="middle" fill="#666666" font-size="12">V+2/8</text>
<text x="274.3" y="370.2" text-anchor="middle" fill="#666666" font-size="12">V+3/8</text>
<text x="145.7" y="370.2" text-anchor="middle" fill="#666666" font-size="12">V+4/8</text>
<text x="54.8" y="279.3" text-anchor="middle" fill="#666666" font-size="12">V+5/8</text>
<text x="54.8" y="150.7" text-anchor="middle" fill="#666666" font-size="12">V+6/8</text>
<text x="145.7" y="59.8" text-anchor="middle" fill="#666666" font-size="12">V+7/8</text>
<text x="210.0" y="205.0" text-anchor="middle" fill="#666666" font-size="13">circle of</text>
<text x="210.0" y="223.0" text-anchor="middle" fill="#666666" font-size="13">length 1</text>
<text x="420.0" y="78.0" text-anchor="start" fill="#222222" font-size="13">Pick one point from each family of points that</text>
<text x="420.0" y="102.0" text-anchor="start" fill="#222222" font-size="13">differ by a rational turn. Call the pick V.</text>
<text x="420.0" y="126.0" text-anchor="start" fill="#222222" font-size="13"></text>
<text x="420.0" y="150.0" text-anchor="start" fill="#222222" font-size="13">Turn V by every rational amount r. The copies</text>
<text x="420.0" y="174.0" text-anchor="start" fill="#222222" font-size="13">V + r do not overlap and fill the whole circle.</text>
<text x="420.0" y="198.0" text-anchor="start" fill="#222222" font-size="13"></text>
<text x="420.0" y="222.0" text-anchor="start" fill="#222222" font-size="13">Turning does not change length. So every copy</text>
<text x="420.0" y="246.0" text-anchor="start" fill="#222222" font-size="13">has the same length L, and there are</text>
<text x="420.0" y="270.0" text-anchor="start" fill="#222222" font-size="13">countably many copies:</text>
<text x="420.0" y="294.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">1 = L + L + L + ...</text>
<text x="420.0" y="318.0" text-anchor="start" fill="#d9480f" font-size="13">L = 0 gives 0. L &gt; 0 gives infinity. Neither is 1.</text>
<text x="420.0" y="342.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">V has no length at all.</text>
<text x="430.0" y="392.0" text-anchor="middle" fill="#666666" font-size="12">The drawing shows 8 turns by 1/8. The real proof needs every rational turn and the axiom of choice.</text>
</svg>
