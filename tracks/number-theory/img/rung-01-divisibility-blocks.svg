<text x="360" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">If d divides a and b, it divides a + b and a − b (d = 3)</text>
<text x="136" y="82" text-anchor="end" fill="#222222" font-weight="bold">a = 12</text>
