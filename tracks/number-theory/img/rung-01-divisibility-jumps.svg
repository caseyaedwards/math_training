<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Divisibility on a Number Line: 3 Divides 12, 5 Does Not</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="330" fill="#ffffff"/>
<text x="350" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Divisibility as equal jumps: does the jump land on 12?</text>
<text x="20" y="62" text-anchor="start" fill="#222222" font-weight="bold">Jumps of 3 from 0</text>
<line x1="40" y1="130" x2="660" y2="130" stroke="#222222" stroke-width="1.5"/>
<line x1="50" y1="125" x2="50" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="50" y="151" text-anchor="middle" fill="#222222" font-size="13">0</text>
<line x1="90" y1="125" x2="90" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="90" y="151" text-anchor="middle" fill="#222222" font-size="13">1</text>
<line x1="130" y1="125" x2="130" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="130" y="151" text-anchor="middle" fill="#222222" font-size="13">2</text>
<line x1="170" y1="125" x2="170" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="170" y="151" text-anchor="middle" fill="#222222" font-size="13">3</text>
<line x1="210" y1="125" x2="210" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="210" y="151" text-anchor="middle" fill="#222222" font-size="13">4</text>
<line x1="250" y1="125" x2="250" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="250" y="151" text-anchor="middle" fill="#222222" font-size="13">5</text>
<line x1="290" y1="125" x2="290" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="290" y="151" text-anchor="middle" fill="#222222" font-size="13">6</text>
<line x1="330" y1="125" x2="330" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="330" y="151" text-anchor="middle" fill="#222222" font-size="13">7</text>
<line x1="370" y1="125" x2="370" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="370" y="151" text-anchor="middle" fill="#222222" font-size="13">8</text>
<line x1="410" y1="125" x2="410" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="410" y="151" text-anchor="middle" fill="#222222" font-size="13">9</text>
<line x1="450" y1="125" x2="450" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="151" text-anchor="middle" fill="#222222" font-size="13">10</text>
<line x1="490" y1="125" x2="490" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="490" y="151" text-anchor="middle" fill="#222222" font-size="13">11</text>
<line x1="530" y1="125" x2="530" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="530" y="151" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">12</text>
<line x1="570" y1="125" x2="570" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="570" y="151" text-anchor="middle" fill="#222222" font-size="13">13</text>
<line x1="610" y1="125" x2="610" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="610" y="151" text-anchor="middle" fill="#222222" font-size="13">14</text>
<line x1="650" y1="125" x2="650" y2="135" stroke="#222222" stroke-width="1.2"/>
<text x="650" y="151" text-anchor="middle" fill="#222222" font-size="13">15</text>
<path d="M50.0,130 Q110.0,90.0 170.0,130" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<text x="110" y="104" text-anchor="middle" fill="#d9480f" font-size="12">+3</text>
<path d="M170.0,130 Q230.0,90.0 290.0,130" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<text x="230" y="104" text-anchor="middle" fill="#d9480f" font-size="12">+3</text>
<path d="M290.0,130 Q350.0,90.0 410.0,130" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<text x="350" y="104" text-anchor="middle" fill="#d9480f" font-size="12">+3</text>
<path d="M410.0,130 Q470.0,90.0 530.0,130" fill="none" stroke="#d9480f" stroke-width="1.8" marker-end="url(#arrA)"/>
<text x="470" y="104" text-anchor="middle" fill="#d9480f" font-size="12">+3</text>
<text x="530" y="172" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">lands on 12: 12 = 3 × 4</text>
<text x="20" y="200" text-anchor="start" fill="#222222" font-weight="bold">Jumps of 5 from 0</text>
<line x1="40" y1="270" x2="660" y2="270" stroke="#222222" stroke-width="1.5"/>
<line x1="50" y1="265" x2="50" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="50" y="291" text-anchor="middle" fill="#222222" font-size="13">0</text>
<line x1="90" y1="265" x2="90" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="90" y="291" text-anchor="middle" fill="#222222" font-size="13">1</text>
<line x1="130" y1="265" x2="130" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="130" y="291" text-anchor="middle" fill="#222222" font-size="13">2</text>
<line x1="170" y1="265" x2="170" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="170" y="291" text-anchor="middle" fill="#222222" font-size="13">3</text>
<line x1="210" y1="265" x2="210" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="210" y="291" text-anchor="middle" fill="#222222" font-size="13">4</text>
<line x1="250" y1="265" x2="250" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="250" y="291" text-anchor="middle" fill="#222222" font-size="13">5</text>
<line x1="290" y1="265" x2="290" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="290" y="291" text-anchor="middle" fill="#222222" font-size="13">6</text>
<line x1="330" y1="265" x2="330" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="330" y="291" text-anchor="middle" fill="#222222" font-size="13">7</text>
<line x1="370" y1="265" x2="370" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="370" y="291" text-anchor="middle" fill="#222222" font-size="13">8</text>
<line x1="410" y1="265" x2="410" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="410" y="291" text-anchor="middle" fill="#222222" font-size="13">9</text>
<line x1="450" y1="265" x2="450" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="450" y="291" text-anchor="middle" fill="#222222" font-size="13">10</text>
<line x1="490" y1="265" x2="490" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="490" y="291" text-anchor="middle" fill="#222222" font-size="13">11</text>
<line x1="530" y1="265" x2="530" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="530" y="291" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">12</text>
<line x1="570" y1="265" x2="570" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="570" y="291" text-anchor="middle" fill="#222222" font-size="13">13</text>
<line x1="610" y1="265" x2="610" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="610" y="291" text-anchor="middle" fill="#222222" font-size="13">14</text>
<line x1="650" y1="265" x2="650" y2="275" stroke="#222222" stroke-width="1.2"/>
<text x="650" y="291" text-anchor="middle" fill="#222222" font-size="13">15</text>
<path d="M50.0,270 Q150.0,230.0 250.0,270" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#arrD)"/>
<text x="150" y="244" text-anchor="middle" fill="#555555" font-size="12">+5</text>
<path d="M250.0,270 Q350.0,230.0 450.0,270" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#arrD)"/>
<text x="350" y="244" text-anchor="middle" fill="#555555" font-size="12">+5</text>
<path d="M450.0,270 Q550.0,230.0 650.0,270" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#arrD)"/>
<text x="550" y="244" text-anchor="middle" fill="#555555" font-size="12">+5</text>
<circle cx="530" cy="270" r="7" fill="none" stroke="#d9480f" stroke-width="2"/>
<text x="470" y="312" text-anchor="middle" fill="#222222" font-size="13">10 and 15 skip over 12: 5 does not divide 12</text>
</svg>
