<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A Second Factor Tree of 360 Reaching the Same Primes</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
<text x="280" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A different first split reaches the same primes</text>
<circle cx="280" cy="70" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280" y="75" text-anchor="middle" fill="#222222" font-weight="bold">360</text>
<line x1="280" y1="92" x2="160" y2="128" stroke="#555555" stroke-width="1.5"/>
<line x1="280" y1="92" x2="400" y2="128" stroke="#555555" stroke-width="1.5"/>
<text x="312" y="76" text-anchor="start" fill="#555555" font-size="13">= 36 × 10</text>
<circle cx="160" cy="150" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="160" y="155" text-anchor="middle" fill="#222222" font-weight="bold">36</text>
<circle cx="400" cy="150" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="400" y="155" text-anchor="middle" fill="#222222" font-weight="bold">10</text>
<line x1="160" y1="172" x2="100" y2="208" stroke="#555555" stroke-width="1.5"/>
<circle cx="100" cy="230" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="100" y="235" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<line x1="100" y1="252" x2="70" y2="272" stroke="#555555" stroke-width="1.5"/>
<circle cx="70" cy="290" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="70" y="295" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<line x1="100" y1="252" x2="130" y2="272" stroke="#555555" stroke-width="1.5"/>
<circle cx="130" cy="290" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="130" y="295" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<line x1="160" y1="172" x2="220" y2="208" stroke="#555555" stroke-width="1.5"/>
<circle cx="220" cy="230" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="220" y="235" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<line x1="220" y1="252" x2="190" y2="272" stroke="#555555" stroke-width="1.5"/>
<circle cx="190" cy="290" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="190" y="295" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<line x1="220" y1="252" x2="250" y2="272" stroke="#555555" stroke-width="1.5"/>
<circle cx="250" cy="290" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="250" y="295" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<line x1="400" y1="172" x2="365" y2="212" stroke="#555555" stroke-width="1.5"/>
<circle cx="365" cy="230" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="365" y="235" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<line x1="400" y1="172" x2="435" y2="212" stroke="#555555" stroke-width="1.5"/>
<circle cx="435" cy="230" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="435" y="235" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<text x="470" y="290" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">leaves: 2, 3, 2, 3, 2, 5</text>
<text x="470" y="310" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">= 2³ × 3² × 5</text>
</svg>
