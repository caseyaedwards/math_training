<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Factor Tree of 360 Splitting Off One Prime at a Time</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="480" height="420" fill="#ffffff"/>
<text x="240" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Factor tree of 360: split off one prime per step</text>
<line x1="150" y1="92" x2="110" y2="108" stroke="#555555" stroke-width="1.5"/>
<line x1="150" y1="92" x2="200" y2="104" stroke="#555555" stroke-width="1.5"/>
<circle cx="150" cy="70" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="150" y="75" text-anchor="middle" fill="#222222" font-weight="bold">360</text>
<circle cx="110" cy="126" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="110" y="131" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<text x="180" y="75" text-anchor="start" fill="#555555" font-size="13">= 2 × 180</text>
<line x1="200" y1="148" x2="160" y2="164" stroke="#555555" stroke-width="1.5"/>
<line x1="200" y1="148" x2="250" y2="160" stroke="#555555" stroke-width="1.5"/>
<circle cx="200" cy="126" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200" y="131" text-anchor="middle" fill="#222222" font-weight="bold">180</text>
<circle cx="160" cy="182" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="160" y="187" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<text x="230" y="131" text-anchor="start" fill="#555555" font-size="13">= 2 × 90</text>
<line x1="250" y1="204" x2="210" y2="220" stroke="#555555" stroke-width="1.5"/>
<line x1="250" y1="204" x2="300" y2="216" stroke="#555555" stroke-width="1.5"/>
<circle cx="250" cy="182" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="250" y="187" text-anchor="middle" fill="#222222" font-weight="bold">90</text>
<circle cx="210" cy="238" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="210" y="243" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<text x="280" y="187" text-anchor="start" fill="#555555" font-size="13">= 2 × 45</text>
<line x1="300" y1="260" x2="260" y2="276" stroke="#555555" stroke-width="1.5"/>
<line x1="300" y1="260" x2="350" y2="272" stroke="#555555" stroke-width="1.5"/>
<circle cx="300" cy="238" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="300" y="243" text-anchor="middle" fill="#222222" font-weight="bold">45</text>
<circle cx="260" cy="294" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="260" y="299" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<text x="330" y="243" text-anchor="start" fill="#555555" font-size="13">= 3 × 15</text>
<line x1="350" y1="316" x2="310" y2="332" stroke="#555555" stroke-width="1.5"/>
<line x1="350" y1="316" x2="400" y2="332" stroke="#555555" stroke-width="1.5"/>
<circle cx="350" cy="294" r="22" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="350" y="299" text-anchor="middle" fill="#222222" font-weight="bold">15</text>
<circle cx="310" cy="350" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="310" y="355" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<text x="380" y="299" text-anchor="start" fill="#555555" font-size="13">= 3 × 5</text>
<circle cx="400" cy="350" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="400" y="355" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<text x="240" y="398" text-anchor="middle" fill="#222222" font-weight="bold">360 = 2 × 2 × 2 × 3 × 3 × 5 = 2³ × 3² × 5</text>
</svg>
