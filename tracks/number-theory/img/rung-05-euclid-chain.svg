<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Euclidean Algorithm as a Chain of Pairs</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="520" height="420" fill="#ffffff"/>
<text x="260" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">gcd(a, b) = gcd(b, a mod b): the pair shrinks each step</text>
<rect x="60" y="64" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="125" y="87" text-anchor="middle" fill="#222222" font-weight="bold">gcd(240, 46)</text>
<line x1="125" y1="100" x2="125" y2="120" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="160" y="115" text-anchor="start" fill="#555555" font-size="13">240 = 5 × 46 + 10</text>
<rect x="60" y="120" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="125" y="143" text-anchor="middle" fill="#222222" font-weight="bold">gcd(46, 10)</text>
<line x1="125" y1="156" x2="125" y2="176" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="160" y="171" text-anchor="start" fill="#555555" font-size="13">46 = 4 × 10 + 6</text>
<rect x="60" y="176" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="125" y="199" text-anchor="middle" fill="#222222" font-weight="bold">gcd(10, 6)</text>
<line x1="125" y1="212" x2="125" y2="232" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="160" y="227" text-anchor="start" fill="#555555" font-size="13">10 = 1 × 6 + 4</text>
<rect x="60" y="232" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="125" y="255" text-anchor="middle" fill="#222222" font-weight="bold">gcd(6, 4)</text>
<line x1="125" y1="268" x2="125" y2="288" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="160" y="283" text-anchor="start" fill="#555555" font-size="13">6 = 1 × 4 + 2</text>
<rect x="60" y="288" width="130" height="36" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="125" y="311" text-anchor="middle" fill="#222222" font-weight="bold">gcd(4, 2)</text>
<line x1="125" y1="324" x2="125" y2="344" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="160" y="339" text-anchor="start" fill="#555555" font-size="13">4 = 2 × 2 + 0</text>
<rect x="60" y="344" width="130" height="36" fill="#f6d5c4" stroke="#d9480f" stroke-width="1.8"/>
<text x="125" y="367" text-anchor="middle" fill="#222222" font-weight="bold">gcd(2, 0)</text>
<line x1="190" y1="362" x2="270" y2="362" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arrA)"/>
<text x="280" y="367" text-anchor="start" fill="#d9480f" font-weight="bold">gcd(a, 0) = a: the answer is 2</text>
</svg>
