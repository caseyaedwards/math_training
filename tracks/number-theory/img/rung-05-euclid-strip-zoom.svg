<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Zoom on the 10 by 46 Strip: Squares of 10, 6, 4 and 2</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="250" fill="#ffffff"/>
<text x="350" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Zoom on the leftover strip, turned on its side (46 × 10)</text>
<rect x="50" y="60" width="130" height="130" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="115" y="130" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">10</text>
<rect x="180" y="60" width="130" height="130" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="245" y="130" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">10</text>
<rect x="310" y="60" width="130" height="130" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="375" y="130" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">10</text>
<rect x="440" y="60" width="130" height="130" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="505" y="130" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">10</text>
<rect x="570" y="60" width="78" height="78" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="609" y="104" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">6</text>
<rect x="570" y="138" width="52" height="52" fill="#f6d5c4" stroke="#222222" stroke-width="1.5"/>
<text x="596" y="169" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">4</text>
<rect x="622" y="138" width="26" height="26" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="635" y="156" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">2</text>
<rect x="622" y="164" width="26" height="26" fill="#d9480f" stroke="#222222" stroke-width="1.5"/>
<text x="635" y="182" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">2</text>
<rect x="50" y="60" width="598" height="130" fill="none" stroke="#222222" stroke-width="2"/>
<text x="50" y="214" text-anchor="start" fill="#222222" font-size="13">46 = 4 × 10 + 6</text>
<text x="200" y="214" text-anchor="start" fill="#222222" font-size="13">10 = 1 × 6 + 4</text>
<text x="350" y="214" text-anchor="start" fill="#222222" font-size="13">6 = 1 × 4 + 2</text>
<text x="500" y="214" text-anchor="start" fill="#222222" font-size="13">4 = 2 × 2 + 0</text>
<text x="50" y="242" text-anchor="start" fill="#d9480f" font-weight="bold">The 2 × 2 square tiles everything exactly: gcd(240, 46) = 2.</text>
</svg>
