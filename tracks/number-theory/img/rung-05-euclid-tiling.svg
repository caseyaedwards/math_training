<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="740" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Euclid as Tiling a 240 by 46 Rectangle with Squares</title>
