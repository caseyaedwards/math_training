<text x="356.25" y="208.5" text-anchor="middle" fill="#222222" font-size="13">5 squares of 46 fill 230 of the 240</text>
<text x="696.25" y="208.5" text-anchor="end" fill="#d9480f" font-size="13">10 × 46 strip left</text>
<text x="370" y="238.5" text-anchor="middle" fill="#555555" font-size="13">240 = 5 × 46 + 10. The leftover strip goes into the next step (zoom below).</text>
