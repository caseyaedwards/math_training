<text x="220" y="230" text-anchor="middle" fill="#555555" font-size="13">mod 12</text>
<text x="410" y="120" text-anchor="start" fill="#222222" font-weight="bold">start at 8</text>
<text x="410" y="145" text-anchor="start" fill="#d9480f" font-weight="bold">take 9 steps</text>
<text x="410" y="170" text-anchor="start" fill="#222222">pass 12 once</text>
