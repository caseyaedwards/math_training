<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Powers of 7 Mod 10 Cycle Through 7, 9, 3, 1</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="380" fill="#ffffff"/>
<text x="310" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Last digit of powers of 7: a wheel mod 10</text>
<circle cx="200" cy="210" r="130" fill="none" stroke="#555555" stroke-width="1"/>
<circle cx="200" cy="80" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200" y="85" text-anchor="middle" fill="#222222" font-weight="bold">0</text>
<circle cx="276.41" cy="104.83" r="16" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="276.41" y="109.83" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<circle cx="323.64" cy="169.83" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="323.64" y="174.83" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<circle cx="323.64" cy="250.17" r="16" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="323.64" y="255.17" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<circle cx="276.41" cy="315.17" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="276.41" y="320.17" text-anchor="middle" fill="#222222" font-weight="bold">4</text>
<circle cx="200" cy="340" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="200" y="345" text-anchor="middle" fill="#222222" font-weight="bold">5</text>
<circle cx="123.59" cy="315.17" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="123.59" y="320.17" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<circle cx="76.36" cy="250.17" r="16" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="76.36" y="255.17" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text>
<circle cx="76.36" cy="169.83" r="16" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="76.36" y="174.83" text-anchor="middle" fill="#222222" font-weight="bold">8</text>
<circle cx="123.59" cy="104.83" r="16" fill="#d9480f" stroke="#d9480f" stroke-width="1.5"/>
<text x="123.59" y="109.83" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text>
<line x1="81.92" y1="233.05" x2="117.72" y2="122.9" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<line x1="138.15" y1="115.41" x2="308.27" y2="239" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<line x1="318.08" y1="233.05" x2="282.28" y2="122.9" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<line x1="261.85" y1="115.41" x2="91.73" y2="239" stroke="#d9480f" stroke-width="2" marker-end="url(#arrA)"/>
<text x="200" y="215" text-anchor="middle" fill="#d9480f" font-weight="bold">× 7</text>
<text x="400" y="90" text-anchor="start" fill="#555555" font-size="13">power</text>
<text x="560" y="90" text-anchor="middle" fill="#555555" font-size="13">mod 10</text>
<text x="400" y="120" text-anchor="start" fill="#222222">7¹ = 7</text>
<text x="560" y="120" text-anchor="middle" fill="#d9480f" font-weight="bold">7</text>
<text x="400" y="150" text-anchor="start" fill="#222222">7² = 49</text>
<text x="560" y="150" text-anchor="middle" fill="#d9480f" font-weight="bold">9</text>
<text x="400" y="180" text-anchor="start" fill="#222222">7³ = 343</text>
<text x="560" y="180" text-anchor="middle" fill="#d9480f" font-weight="bold">3</text>
<text x="400" y="210" text-anchor="start" fill="#222222">7⁴ = 2,401</text>
<text x="560" y="210" text-anchor="middle" fill="#d9480f" font-weight="bold">1</text>
<text x="400" y="240" text-anchor="start" fill="#222222">7⁵ = 16,807</text>
<text x="560" y="240" text-anchor="middle" fill="#d9480f" font-weight="bold">7</text>
<text x="400" y="290" text-anchor="start" fill="#222222" font-size="13">The cycle has length 4.</text>
<text x="400" y="310" text-anchor="start" fill="#222222" font-size="13">Only the last digit of</text>
<text x="400" y="330" text-anchor="start" fill="#222222" font-size="13">each step matters.</text>
</svg>
