<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Extended Euclidean Algorithm Table for 240 and 46</title>
