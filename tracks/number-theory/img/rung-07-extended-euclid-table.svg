<text x="270" y="199" text-anchor="middle" fill="#222222">−5</text>
<text x="445" y="199" text-anchor="middle" fill="#222222">240 − 5 × 46</text>
<rect x="20" y="214" width="560" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
