<text x="320" y="80" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">row 1: gcd(1, 6) = 1, inverse 1</text>
<text x="320" y="108" text-anchor="start" fill="#222222" font-size="13">row 2: gcd(2, 6) = 2, no 1 in row</text>
<text x="320" y="136" text-anchor="start" fill="#222222" font-size="13">row 3: gcd(3, 6) = 3, no 1 in row</text>
<text x="320" y="164" text-anchor="start" fill="#222222" font-size="13">row 4: gcd(4, 6) = 2, no 1 in row</text>
<text x="320" y="192" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">row 5: gcd(5, 6) = 1, inverse 5</text>
<text x="320" y="236" text-anchor="start" fill="#222222" font-size="13">A row reaches 1 exactly when</text>
<text x="320" y="256" text-anchor="start" fill="#222222" font-size="13">gcd(a, n) = 1.</text>
