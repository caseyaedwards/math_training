<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Power Cycles of 2 Mod 5 and 2 Mod 7</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="700" height="390" fill="#ffffff"/>
<text x="350" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Cycle lengths divide p − 1: 2 mod 5 has length 4, 2 mod 7 has length 3</text>
<path d="M191.8,107.8 A85,85 0 0 1 252.2,168.2" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<path d="M252.2,211.8 A85,85 0 0 1 191.8,272.2" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<path d="M148.2,272.2 A85,85 0 0 1 87.8,211.8" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<path d="M87.8,168.2 A85,85 0 0 1 148.2,107.8" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<circle cx="170" cy="105" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="170" y="110" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">2</text>
<text x="170" y="70" text-anchor="middle" fill="#555555" font-size="13">2¹</text>
<circle cx="255" cy="190" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="255" y="195" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">4</text>
<text x="295" y="195" text-anchor="middle" fill="#555555" font-size="13">2²</text>
<circle cx="170" cy="275" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="170" y="280" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">3</text>
<text x="170" y="320" text-anchor="middle" fill="#555555" font-size="13">2³</text>
<circle cx="85" cy="190" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.8"/>
<text x="85" y="195" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">1</text>
<text x="45" y="195" text-anchor="middle" fill="#555555" font-size="13">2⁴</text>
<text x="170" y="195" text-anchor="middle" fill="#555555">mod 5</text>
<path d="M521.8,107.8 A85,85 0 0 1 582.0,212.2" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<path d="M560.3,249.9 A85,85 0 0 1 439.7,249.9" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<path d="M418.0,212.2 A85,85 0 0 1 478.2,107.8" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrD)"/>
<circle cx="500" cy="105" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="500" y="110" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">2</text>
<text x="500" y="70" text-anchor="middle" fill="#555555" font-size="13">2¹</text>
<circle cx="573.61" cy="232.5" r="18" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="573.61" y="237.5" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">4</text>
<text x="608.25" y="257.5" text-anchor="middle" fill="#555555" font-size="13">2²</text>
<circle cx="426.39" cy="232.5" r="18" fill="#d9480f" stroke="#d9480f" stroke-width="1.8"/>
<text x="426.39" y="237.5" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">1</text>
<text x="391.75" y="257.5" text-anchor="middle" fill="#555555" font-size="13">2³</text>
<text x="500" y="195" text-anchor="middle" fill="#555555">mod 7</text>
<text x="170" y="348" text-anchor="middle" fill="#222222" font-weight="bold">length 4 = 5 − 1</text>
<text x="170" y="370" text-anchor="middle" fill="#d9480f" font-size="13">2¹⁰⁰ = (2⁴)²⁵: 25 full laps end on 1</text>
<text x="500" y="348" text-anchor="middle" fill="#222222" font-weight="bold">length 3 divides 6 = 7 − 1</text>
<text x="500" y="370" text-anchor="middle" fill="#d9480f" font-size="13">2⁶ = (2³)²: two laps end on 1</text>
</svg>
