<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="580" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Totient of 15 on the Mod 3 by Mod 5 Grid</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="580" height="340" fill="#ffffff"/>
<text x="290" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">φ(15): numbers 0 to 14 that share no factor with 15</text>
<text x="138" y="125" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">≡ 0 (mod 3)</text>
<text x="138" y="185" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">≡ 1 (mod 3)</text>
<text x="138" y="245" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">≡ 2 (mod 3)</text>
<text x="180" y="78" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">≡ 0</text>
<text x="240" y="78" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">≡ 1</text>
<text x="300" y="78" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">≡ 2</text>
<text x="360" y="78" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">≡ 3</text>
<text x="420" y="78" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">≡ 4</text>
<text x="300" y="58" text-anchor="middle" fill="#555555" font-size="13">remainder mod 5</text>
