<text x="410" y="180" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">White cells: mirror</text>
<text x="410" y="200" text-anchor="start" fill="#222222" font-size="13">cells match.</text>
<text x="410" y="238" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">Shaded cells (3, 7, 11</text>
