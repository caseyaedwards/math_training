<text x="410" y="278" text-anchor="start" fill="#d9480f" font-size="13">cells have opposite</text>
<text x="410" y="298" text-anchor="start" fill="#d9480f" font-size="13">signs.</text>
<text x="310" y="376" text-anchor="middle" fill="#222222" font-size="13">Example: 3 is not a square mod 7, but 7 ≡ 1 is a square mod 3.</text>
