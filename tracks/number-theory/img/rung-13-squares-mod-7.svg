<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Squaring Mod 7 Maps 1 to 6 onto Only 1, 2 and 4</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
<text x="280" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Square each number mod 7: only 1, 2 and 4 are hit</text>
<text x="140" y="54" text-anchor="middle" fill="#222222" font-weight="bold">x</text>
<text x="400" y="54" text-anchor="middle" fill="#222222" font-weight="bold">x² mod 7</text>
<circle cx="140" cy="92" r="15" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="97" text-anchor="middle" fill="#222222" font-weight="bold">1</text>
<circle cx="400" cy="92" r="15" fill="#d9480f" stroke="#d9480f" stroke-width="1.6"/>
<text x="400" y="97" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<circle cx="140" cy="134" r="15" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="139" text-anchor="middle" fill="#222222" font-weight="bold">2</text>
<circle cx="400" cy="134" r="15" fill="#d9480f" stroke="#d9480f" stroke-width="1.6"/>
<text x="400" y="139" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<circle cx="140" cy="176" r="15" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="181" text-anchor="middle" fill="#222222" font-weight="bold">3</text>
<circle cx="400" cy="176" r="15" fill="#ffffff" stroke="#555555" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="400" y="181" text-anchor="middle" fill="#555555" font-weight="bold">3</text>
<circle cx="140" cy="218" r="15" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="223" text-anchor="middle" fill="#222222" font-weight="bold">4</text>
<circle cx="400" cy="218" r="15" fill="#d9480f" stroke="#d9480f" stroke-width="1.6"/>
<text x="400" y="223" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<circle cx="140" cy="260" r="15" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="265" text-anchor="middle" fill="#222222" font-weight="bold">5</text>
<circle cx="400" cy="260" r="15" fill="#ffffff" stroke="#555555" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="400" y="265" text-anchor="middle" fill="#555555" font-weight="bold">5</text>
<circle cx="140" cy="302" r="15" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140" y="307" text-anchor="middle" fill="#222222" font-weight="bold">6</text>
<circle cx="400" cy="302" r="15" fill="#ffffff" stroke="#555555" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="400" y="307" text-anchor="middle" fill="#555555" font-weight="bold">6</text>
<line x1="157" y1="92" x2="381" y2="92" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="114" y="97" text-anchor="end" fill="#555555" font-size="12">1² = 1</text>
<line x1="157" y1="134" x2="381" y2="218" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="114" y="139" text-anchor="end" fill="#555555" font-size="12">2² = 4</text>
<line x1="157" y1="176" x2="381" y2="134" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="114" y="181" text-anchor="end" fill="#555555" font-size="12">3² = 9</text>
<line x1="157" y1="218" x2="381" y2="134" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="114" y="223" text-anchor="end" fill="#555555" font-size="12">4² = 16</text>
<line x1="157" y1="260" x2="381" y2="218" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="114" y="265" text-anchor="end" fill="#555555" font-size="12">5² = 25</text>
<line x1="157" y1="302" x2="381" y2="92" stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
<text x="114" y="307" text-anchor="end" fill="#555555" font-size="12">6² = 36</text>
<text x="426" y="181" text-anchor="start" fill="#555555" font-size="12">not a square</text>
<text x="426" y="265" text-anchor="start" fill="#555555" font-size="12">not a square</text>
<text x="426" y="307" text-anchor="start" fill="#555555" font-size="12">not a square</text>
<text x="426" y="97" text-anchor="start" fill="#d9480f" font-size="12">hit twice</text>
<text x="426" y="139" text-anchor="start" fill="#d9480f" font-size="12">hit twice</text>
<text x="426" y="223" text-anchor="start" fill="#d9480f" font-size="12">hit twice</text>
<text x="280" y="345" text-anchor="middle" fill="#222222" font-weight="bold">Squares mod 7: 1, 2, 4. Non-squares: 3, 5, 6.</text>
</svg>
