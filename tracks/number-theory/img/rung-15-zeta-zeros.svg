<circle cx="200" cy="430" r="6" fill="#222222" stroke="none" stroke-width="0"/>
<circle cx="120" cy="430" r="6" fill="#222222" stroke="none" stroke-width="0"/>
<text x="200" y="414" text-anchor="middle" fill="#222222" font-size="13">trivial zeros</text>
<circle cx="380" cy="260.44" r="6" fill="#d9480f" stroke="none" stroke-width="0"/>
