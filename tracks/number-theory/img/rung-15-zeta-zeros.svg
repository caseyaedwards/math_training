<text x="428" y="265.44" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">1/2 + 14.13 i</text>
<circle cx="380" cy="177.76" r="6" fill="#d9480f" stroke="none" stroke-width="0"/>
<line x1="388" y1="177.76" x2="424" y2="177.76" stroke="#d9480f" stroke-width="1"/>
