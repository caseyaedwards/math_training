<line x1="480" y1="426" x2="480" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="480" y="452" text-anchor="middle" fill="#222222" font-size="12">3</text>
<line x1="520" y1="426" x2="520" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="520" y="452" text-anchor="middle" fill="#222222" font-size="12">4</text>
<line x1="560" y1="426" x2="560" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="560" y="452" text-anchor="middle" fill="#222222" font-size="12">5</text>
<text x="354" y="452" text-anchor="end" fill="#222222" font-size="12">0</text>
<line x1="356" y1="310" x2="364" y2="310" stroke="#222222" stroke-width="1.5"/>
