<line x1="400" y1="430" x2="400" y2="82" stroke="#555555" stroke-width="1"/>
<line x1="80" y1="426" x2="80" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="80" y="452" text-anchor="middle" fill="#222222" font-size="12">-7</text>
<line x1="120" y1="426" x2="120" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="120" y="452" text-anchor="middle" fill="#222222" font-size="12">-6</text>
<line x1="160" y1="426" x2="160" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="160" y="452" text-anchor="middle" fill="#222222" font-size="12">-5</text>
<line x1="200" y1="426" x2="200" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="200" y="452" text-anchor="middle" fill="#222222" font-size="12">-4</text>
<line x1="240" y1="426" x2="240" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="240" y="452" text-anchor="middle" fill="#222222" font-size="12">-3</text>
<line x1="280" y1="426" x2="280" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="280" y="452" text-anchor="middle" fill="#222222" font-size="12">-2</text>
<line x1="320" y1="426" x2="320" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="320" y="452" text-anchor="middle" fill="#222222" font-size="12">-1</text>
<line x1="360" y1="426" x2="360" y2="434" stroke="#222222" stroke-width="1.5"/>
<line x1="400" y1="426" x2="400" y2="434" stroke="#222222" stroke-width="1.5"/>
<text x="400" y="452" text-anchor="middle" fill="#222222" font-size="12">1</text>
<line x1="440" y1="426" x2="440" y2="434" stroke="#222222" stroke-width="1.5"/>
