<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" width="620" height="490" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Riemann Zeta Zeros on the Critical Line</title>
<defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect x="0" y="0" width="620" height="490" fill="#ffffff"/>
<text x="310" y="26" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Zeros of ζ(s): trivial ones at −2, −4, −6 and the rest on the line Re(s) = 1/2</text>
<rect x="360" y="82" width="40" height="348" fill="#f6d5c4" stroke="none" stroke-width="0"/>
