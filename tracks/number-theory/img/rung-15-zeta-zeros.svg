<circle cx="380" cy="129.88" r="6" fill="#d9480f" stroke="none" stroke-width="0"/>
<line x1="388" y1="129.88" x2="424" y2="129.88" stroke="#d9480f" stroke-width="1"/>
<text x="428" y="134.88" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">1/2 + 25.01 i</text>
<text x="380" y="70" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">Re(s) = 1/2</text>
<text x="348" y="374" text-anchor="end" fill="#222222" font-size="13">critical strip 0 &lt; Re(s) &lt; 1</text>
<text x="576" y="420" text-anchor="end" fill="#555555" font-size="12">real part</text>
<text x="352" y="100" text-anchor="end" fill="#555555" font-size="12">imaginary part</text>
<text x="64" y="478" text-anchor="start" fill="#555555" font-size="12">Horizontal and vertical scales differ. Riemann hypothesis: every nontrivial zero is on the line.</text>
</svg>
