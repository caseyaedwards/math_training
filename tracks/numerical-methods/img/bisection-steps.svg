<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Bisection halves the bracket around the root of x squared minus 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Bisection: Halve the Bracket Every Step</text>
<line x1="105.0" y1="70.0" x2="555.0" y2="70.0" stroke="#222222" stroke-width="4"/>
<circle cx="105.0" cy="70.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="555.0" cy="70.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="75.0" text-anchor="start" fill="#666666" font-size="11">step 0</text>
<text x="563.0" y="75.0" text-anchor="start" fill="#222222" font-size="11">[1, 2]</text>
<line x1="105.0" y1="108.0" x2="330.0" y2="108.0" stroke="#222222" stroke-width="4"/>
<circle cx="105.0" cy="108.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="330.0" cy="108.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="113.0" text-anchor="start" fill="#666666" font-size="11">step 1</text>
<text x="338.0" y="113.0" text-anchor="start" fill="#222222" font-size="11">[1, 1.5]</text>
<line x1="217.5" y1="146.0" x2="330.0" y2="146.0" stroke="#222222" stroke-width="4"/>
<circle cx="217.5" cy="146.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="330.0" cy="146.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="151.0" text-anchor="start" fill="#666666" font-size="11">step 2</text>
<text x="338.0" y="151.0" text-anchor="start" fill="#222222" font-size="11">[1.25, 1.5]</text>
<line x1="273.8" y1="184.0" x2="330.0" y2="184.0" stroke="#222222" stroke-width="4"/>
<circle cx="273.8" cy="184.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="330.0" cy="184.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="189.0" text-anchor="start" fill="#666666" font-size="11">step 3</text>
<text x="338.0" y="189.0" text-anchor="start" fill="#222222" font-size="11">[1.375, 1.5]</text>
<line x1="273.8" y1="222.0" x2="301.9" y2="222.0" stroke="#222222" stroke-width="4"/>
<circle cx="273.8" cy="222.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="301.9" cy="222.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="227.0" text-anchor="start" fill="#666666" font-size="11">step 4</text>
<text x="309.9" y="227.0" text-anchor="start" fill="#222222" font-size="11">[1.375, 1.4375]</text>
<line x1="287.8" y1="260.0" x2="301.9" y2="260.0" stroke="#d9480f" stroke-width="4"/>
<circle cx="287.8" cy="260.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="301.9" cy="260.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="40.0" y="265.0" text-anchor="start" fill="#666666" font-size="11">step 5</text>
<text x="309.9" y="265.0" text-anchor="start" fill="#222222" font-size="11">[1.4062, 1.4375]</text>
<line x1="291.4" y1="55.0" x2="291.4" y2="270.0" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="291.4" y="290.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">√2 ≈ 1.41421</text>
<text x="330.0" y="312.0" text-anchor="middle" fill="#666666" font-size="12">Keep the half where f changes sign. One bit of accuracy per step, guaranteed.</text>
</svg>
