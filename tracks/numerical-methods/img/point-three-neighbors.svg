<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Zoomed number line near 0.3 showing neighboring doubles</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="700" height="250" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Why 0.1 + 0.2 != 0.3</text>
<line x1="60.0" y1="120.0" x2="640.0" y2="120.0" stroke="#222222" stroke-width="2"/>
<line x1="156.7" y1="100.0" x2="156.7" y2="140.0" stroke="#222222" stroke-width="2"/>
<text x="156.7" y="162.0" text-anchor="middle" fill="#222222" font-size="12">0.29999999999999993339</text>
<line x1="350.0" y1="100.0" x2="350.0" y2="140.0" stroke="#222222" stroke-width="2"/>
<text x="350.0" y="162.0" text-anchor="middle" fill="#222222" font-size="12">0.29999999999999998890</text>
<line x1="543.3" y1="100.0" x2="543.3" y2="140.0" stroke="#222222" stroke-width="2"/>
<text x="543.3" y="162.0" text-anchor="middle" fill="#222222" font-size="12">0.30000000000000004441</text>
<circle cx="350.0" cy="120.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="543.3" cy="120.0" r="7.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="350.0" y="88.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">the double for 0.3</text>
<text x="543.3" y="88.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">0.1 + 0.2</text>
<circle cx="388.7" cy="120.0" r="4.0" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<line x1="388.7" y1="126.0" x2="437.0" y2="186.0" stroke="#666666" stroke-width="1"/>
<text x="311.7" y="148.0" text-anchor="middle" fill="#222222" font-size="1"></text>
<text x="437.0" y="200.0" text-anchor="middle" fill="#666666" font-size="12">true 0.3 (not representable) sits between ticks</text>
<text x="350.0" y="228.0" text-anchor="middle" fill="#666666" font-size="12">Adjacent doubles here are 2^-54 ≈ 5.55e-17 apart. The sum rounds to the next tick up.</text>
</svg>
