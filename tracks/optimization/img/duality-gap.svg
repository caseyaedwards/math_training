<line x1="450.0" y1="140.0" x2="450.0" y2="230.0" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="5 3"/>
<circle cx="450.0" cy="200.0" r="8" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="450.0" y="132.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">both reach 25</text>
<text x="100.4" y="140.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">primal plans (x, y): value 3x + 4y</text>
<text x="100.4" y="160.0" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">each one is a lower bound on the best</text>
<text x="541.2" y="80.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">dual prices (u, v): bound 10u + 15v</text>
<text x="541.2" y="100.0" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">each one is an upper bound on the best</text>
<text x="70.0" y="345.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">Dual: minimize 10u + 15v with 2u + v &gt;= 3 and u + 3v &gt;= 4, u, v &gt;= 0.</text>
<text x="70.0" y="368.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">u = price of one CPU core, v = price of one GB. Optimum u = 1, v = 1, bound 25.</text>
<text x="70.0" y="391.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="normal">Check: 1 more core lets the best plan earn 26. The shadow price of a core is 1.</text>
</svg>
