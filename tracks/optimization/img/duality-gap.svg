<circle cx="678.0" cy="200.0" r="6" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<text x="678.0" y="174.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="normal">(4, 0)</text>
<circle cx="754.0" cy="200.0" r="6" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
