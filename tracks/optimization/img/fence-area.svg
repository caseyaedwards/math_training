<text x="40.0" y="360.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">Each rectangle uses 40 m of fence:</text>
<text x="40.0" y="381.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">2 x width + 2 x height = 40,</text>
<text x="40.0" y="402.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">so height = 20 - width and</text>
<text x="40.0" y="423.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">area = width x (20 - width).</text>
<text x="40.0" y="444.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">The square wins: 10 m by 10 m.</text>
