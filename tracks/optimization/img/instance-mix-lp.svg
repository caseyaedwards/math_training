<text x="216.2" y="386.2" text-anchor="end" fill="#d9480f" font-size="13" font-weight="bold">(6, 4): $3.04 whole</text>
<text x="540.0" y="90.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">minimize 0.34c + 0.25m</text>
<text x="540.0" y="112.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">compute: 8 CPU, 16 GB, $0.34</text>
<text x="540.0" y="134.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">memory: 4 CPU, 32 GB, $0.25</text>
<text x="540.0" y="156.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">need 64 CPU and 192 GB</text>
<text x="540.0" y="200.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">Gray: every mix that covers</text>
<text x="540.0" y="222.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">the demand. It is unbounded</text>
<text x="540.0" y="244.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">upward: overbuying is allowed,</text>
<text x="540.0" y="266.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">just expensive.</text>
<text x="540.0" y="310.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">The LP corner wants 2/3 of</text>
<text x="540.0" y="332.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">an instance. Clouds do not</text>
<text x="540.0" y="354.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">sell those. The best whole</text>
<text x="540.0" y="376.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">mix costs 11 cents more.</text>
