<text x="277.6" y="274.2" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">grad f = (20, 10)</text>
<text x="240.0" y="324.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold" stroke="#ffffff" stroke-width="4" paint-order="stroke">grad g</text>
