<text x="221.5" y="147.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">best: (10, 20), area 200</text>
<text x="101.0" y="504.5" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">both arrows are</text>
<text x="101.0" y="521.5" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">at right angles to the line</text>
<text x="450.0" y="100.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">maximize area f = xy</text>
<text x="450.0" y="122.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">fence: g = 2x + y = 40</text>
<text x="450.0" y="166.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">Gray and orange curves: plans</text>
<text x="450.0" y="188.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">with equal area.</text>
<text x="450.0" y="232.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">At the best point the curve</text>
<text x="450.0" y="254.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">xy = 200 just touches the line,</text>
<text x="450.0" y="276.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">and the two arrows line up:</text>
<text x="450.0" y="298.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">grad f = lambda grad g</text>
<text x="450.0" y="320.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">(20, 10) = 10 (2, 1)</text>
<text x="450.0" y="364.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">lambda = 10: one more meter</text>
<text x="450.0" y="386.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">of fence buys about 10 m^2.</text>
<text x="450.0" y="430.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">xy = 300 never touches the</text>
<text x="450.0" y="452.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">line: out of budget.</text>
<text x="450.0" y="474.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">xy = 100 crosses it: room</text>
<text x="450.0" y="496.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">to do better.</text>
</svg>
