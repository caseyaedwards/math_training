<circle cx="290.0" cy="210.0" r="7" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="300.0" y="196.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">(3, 4): 25 best</text>
<text x="87.0" y="482.0" text-anchor="start" fill="#222222" font-size="13" font-weight="normal">(0, 0): 0</text>
<rect x="600.0" y="90.0" width="240.0" height="250.0" rx="0" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
<text x="614.0" y="116.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">maximize</text>
<text x="614.0" y="138.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">  3x + 4y  (value)</text>
<text x="614.0" y="160.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">subject to</text>
<text x="614.0" y="182.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">  2x + y  &lt;= 10  CPU</text>
<text x="614.0" y="204.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">  x + 3y &lt;= 15  GB</text>
<text x="614.0" y="226.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">  x, y &gt;= 0</text>
<text x="614.0" y="248.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Gray area: every plan</text>
<text x="614.0" y="270.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">that fits the cluster.</text>
<text x="614.0" y="292.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">The best plan sits</text>
<text x="614.0" y="314.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="normal">at a corner: (3, 4).</text>
<text x="600.0" y="380.0" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">Dotted and orange lines: 3x + 4y = k.</text>
<text x="600.0" y="400.0" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">Push the line in the orange direction.</text>
<text x="600.0" y="420.0" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">The last point it touches wins.</text>
