<text x="234.4" y="87.5" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">2x + y = 10  (CPU)</text>
<line x1="80.0" y1="140.0" x2="535.0" y2="291.7" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="426.0" y="243.6" text-anchor="start" fill="#666666" font-size="13" font-weight="normal">x + 3y = 15  (memory)</text>
<line x1="80.0" y1="280.0" x2="360.0" y2="490.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="80.0" y1="140.0" x2="535.0" y2="481.2" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="103.3" y1="70.0" x2="535.0" y2="393.8" stroke="#d9480f" stroke-width="3"/>
<text x="366.0" y="482.0" text-anchor="start" fill="#222222" font-size="13" font-weight="normal">= 12</text>
<text x="500.0" y="439.6" text-anchor="start" fill="#222222" font-size="13" font-weight="normal">= 20</text>
<text x="437.0" y="357.4" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">= 25</text>
<line x1="150.0" y1="420.0" x2="192.0" y2="364.0" stroke="#d9480f" stroke-width="2.5" marker-end="url(#aha)"/>
<text x="196.0" y="374.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="normal">better</text>
<circle cx="80.0" cy="490.0" r="5" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="430.0" cy="490.0" r="5" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="436.0" y="480.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">(5, 0): 15</text>
<circle cx="80.0" cy="140.0" r="5" fill="#222222" stroke="none" stroke-width="1.5"/>
