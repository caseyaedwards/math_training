<line x1="80.0" y1="425.0" x2="80.0" y2="62.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="272.5" y="467.0" text-anchor="middle" fill="#666666" font-size="14" font-weight="normal">x</text>
<text x="32.0" y="247.5" text-anchor="middle" fill="#666666" font-size="14" font-weight="normal" transform="rotate(-90 32.0 247.5)">y</text>
<line x1="80.0" y1="415.0" x2="80.0" y2="112.3" stroke="#d9480f" stroke-width="4" marker-end="url(#aha)"/>
<line x1="89.6" y1="105.2" x2="280.4" y2="163.9" stroke="#d9480f" stroke-width="4" marker-end="url(#aha)"/>
<circle cx="80.0" cy="425.0" r="7" fill="#d9480f" stroke="none" stroke-width="2"/>
<circle cx="430.0" cy="425.0" r="7" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<circle cx="290.0" cy="166.8" r="7" fill="#d9480f" stroke="none" stroke-width="2"/>
<circle cx="80.0" cy="102.3" r="7" fill="#d9480f" stroke="none" stroke-width="2"/>
<text x="92.0" y="415.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">start: 0</text>
<text x="92.0" y="90.3" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">step 1: 20</text>
<text x="302.0" y="158.8" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">step 2: 25, stop</text>
<text x="426.0" y="409.0" text-anchor="middle" fill="#666666" font-size="13" font-weight="normal" stroke="#ffffff" stroke-width="4" paint-order="stroke">15 (never visited)</text>
<text x="520.0" y="92.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">Pivot log from code/main.go</text>
<text x="520.0" y="138.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">corner 0: (0, 0), value 0</text>
<text x="520.0" y="161.0" text-anchor="start" fill="#666666" font-size="14" font-weight="normal">y earns 4 per unit, the most.</text>
<text x="520.0" y="184.0" text-anchor="start" fill="#666666" font-size="14" font-weight="normal">Raise y until memory is full.</text>
<text x="520.0" y="207.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">corner 1: (0, 5), value 20</text>
<text x="520.0" y="230.0" text-anchor="start" fill="#666666" font-size="14" font-weight="normal">Trading toward x still helps.</text>
<text x="520.0" y="253.0" text-anchor="start" fill="#666666" font-size="14" font-weight="normal">Slide along the memory edge.</text>
<text x="520.0" y="276.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="normal">corner 2: (3, 4), value 25</text>
<text x="520.0" y="299.0" text-anchor="start" fill="#666666" font-size="14" font-weight="normal">Every neighbor is worse: stop.</text>
<text x="520.0" y="345.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">A corner with no better</text>
<text x="520.0" y="368.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">neighbor is the global best,</text>
<text x="520.0" y="391.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">because the region is convex.</text>
