<line x1="290.0" y1="425.0" x2="290.0" y2="430.0" stroke="#222222" stroke-width="1.5"/>
<text x="290.0" y="445.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">3</text>
<line x1="360.0" y1="70.0" x2="360.0" y2="425.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="360.0" y1="425.0" x2="360.0" y2="430.0" stroke="#222222" stroke-width="1.5"/>
