<text x="71.0" y="430.0" text-anchor="end" fill="#222222" font-size="13" font-weight="normal">0</text>
<line x1="80.0" y1="360.5" x2="465.0" y2="360.5" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="360.5" x2="80.0" y2="360.5" stroke="#222222" stroke-width="1.5"/>
<text x="71.0" y="365.5" text-anchor="end" fill="#222222" font-size="13" font-weight="normal">1</text>
<line x1="80.0" y1="295.9" x2="465.0" y2="295.9" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="295.9" x2="80.0" y2="295.9" stroke="#222222" stroke-width="1.5"/>
<text x="71.0" y="300.9" text-anchor="end" fill="#222222" font-size="13" font-weight="normal">2</text>
<line x1="80.0" y1="231.4" x2="465.0" y2="231.4" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="231.4" x2="80.0" y2="231.4" stroke="#222222" stroke-width="1.5"/>
<text x="71.0" y="236.4" text-anchor="end" fill="#222222" font-size="13" font-weight="normal">3</text>
<line x1="80.0" y1="166.8" x2="465.0" y2="166.8" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="166.8" x2="80.0" y2="166.8" stroke="#222222" stroke-width="1.5"/>
<text x="71.0" y="171.8" text-anchor="end" fill="#222222" font-size="13" font-weight="normal">4</text>
<line x1="80.0" y1="102.3" x2="465.0" y2="102.3" stroke="#eeeeee" stroke-width="1"/>
<line x1="75.0" y1="102.3" x2="80.0" y2="102.3" stroke="#222222" stroke-width="1.5"/>
