<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Natural frequency tree for an alert with Bayes theorem</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="660" height="350" fill="#ffffff"/>
<text x="330.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Bayes with Counts: 10,000 Minutes</text>
<rect x="30.0" y="165.0" width="120.0" height="40.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="90.0" y="181.0" text-anchor="middle" fill="#222222" font-size="13">10,000</text>
<text x="90.0" y="199.0" text-anchor="middle" fill="#222222" font-size="13">minutes</text>
<rect x="215.0" y="80.0" width="130.0" height="40.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="96.0" text-anchor="middle" fill="#222222" font-size="13">100</text>
<text x="280.0" y="114.0" text-anchor="middle" fill="#222222" font-size="13">incident</text>
<rect x="215.0" y="250.0" width="130.0" height="40.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="280.0" y="266.0" text-anchor="middle" fill="#222222" font-size="13">9,900</text>
<text x="280.0" y="284.0" text-anchor="middle" fill="#222222" font-size="13">healthy</text>
<rect x="410.0" y="47.0" width="140.0" height="36.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="480.0" y="70.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">99 alert</text>
<rect x="410.0" y="117.0" width="140.0" height="36.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="480.0" y="140.0" text-anchor="middle" fill="#222222" font-size="13">1 silent</text>
<rect x="410.0" y="217.0" width="140.0" height="36.0" rx="6" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="480.0" y="240.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">495 alert</text>
<rect x="410.0" y="287.0" width="140.0" height="36.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="480.0" y="310.0" text-anchor="middle" fill="#222222" font-size="13">9,405 silent</text>
<line x1="150.0" y1="185.0" x2="215.0" y2="100.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="186.5" y="136.5" text-anchor="start" fill="#666666" font-size="12">1%</text>
<line x1="150.0" y1="185.0" x2="215.0" y2="270.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="186.5" y="221.5" text-anchor="start" fill="#666666" font-size="12">99%</text>
<line x1="345.0" y1="100.0" x2="410.0" y2="65.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="381.5" y="76.5" text-anchor="start" fill="#666666" font-size="12">99%</text>
<line x1="345.0" y1="100.0" x2="410.0" y2="135.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="381.5" y="111.5" text-anchor="start" fill="#666666" font-size="12">1%</text>
<line x1="345.0" y1="270.0" x2="410.0" y2="235.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="381.5" y="246.5" text-anchor="start" fill="#666666" font-size="12">5%</text>
<line x1="345.0" y1="270.0" x2="410.0" y2="305.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="381.5" y="281.5" text-anchor="start" fill="#666666" font-size="12">95%</text>
<text x="600.0" y="170.0" text-anchor="end" fill="#222222" font-size="13">alerts: 99 + 495 = 594</text>
<text x="640.0" y="192.0" text-anchor="end" fill="#d9480f" font-size="14" font-weight="bold">real: 99 / 594 = 1/6</text>
</svg>
