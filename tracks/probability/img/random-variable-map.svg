<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A random variable maps outcomes to numbers</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A Random Variable Is a Function</text>
<rect x="100.0" y="45.0" width="60.0" height="30.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="130.0" y="65.0" text-anchor="middle" fill="#222222" font-size="13">HH</text>
<line x1="162.0" y1="60.0" x2="408.0" y2="70.0" stroke="#222222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="100.0" y="90.0" width="60.0" height="30.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="130.0" y="110.0" text-anchor="middle" fill="#222222" font-size="13">HT</text>
<line x1="162.0" y1="105.0" x2="408.0" y2="135.0" stroke="#d9480f" stroke-width="1.6" marker-end="url(#aha)"/>
<rect x="100.0" y="135.0" width="60.0" height="30.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="130.0" y="155.0" text-anchor="middle" fill="#222222" font-size="13">TH</text>
<line x1="162.0" y1="150.0" x2="408.0" y2="135.0" stroke="#d9480f" stroke-width="1.6" marker-end="url(#aha)"/>
<rect x="100.0" y="180.0" width="60.0" height="30.0" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="130.0" y="200.0" text-anchor="middle" fill="#222222" font-size="13">TT</text>
<line x1="162.0" y1="195.0" x2="408.0" y2="200.0" stroke="#222222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="430.0" cy="200.0" r="20.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="430.0" y="205.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">0</text>
<text x="460.0" y="205.0" text-anchor="start" fill="#222222" font-size="13">P(X = 0) = 1/4</text>
<circle cx="430.0" cy="135.0" r="20.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="430.0" y="140.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">1</text>
<text x="460.0" y="140.0" text-anchor="start" fill="#222222" font-size="13">P(X = 1) = 2/4</text>
<circle cx="430.0" cy="70.0" r="20.0" fill="#ffffff" stroke="#222222" stroke-width="1.8"/>
<text x="430.0" y="75.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">2</text>
<text x="460.0" y="75.0" text-anchor="start" fill="#222222" font-size="13">P(X = 2) = 1/4</text>
<text x="130.0" y="240.0" text-anchor="middle" fill="#666666" font-size="13">outcomes</text>
<text x="430.0" y="240.0" text-anchor="middle" fill="#666666" font-size="13">X = number of heads</text>
</svg>
