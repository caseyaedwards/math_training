<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Sample space of two coin flips with an event circled</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Sample Space and an Event</text>
<rect x="40.0" y="50.0" width="480.0" height="160.0" rx="10" fill="#f1f3f5" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="75.0" text-anchor="start" fill="#666666" font-size="13">S = all outcomes</text>
<circle cx="110.0" cy="135.0" r="30.0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="2"/>
<text x="110.0" y="140.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">HH</text>
<circle cx="220.0" cy="135.0" r="30.0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="2"/>
<text x="220.0" y="140.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">HT</text>
<circle cx="330.0" cy="135.0" r="30.0" fill="#d9480f" fill-opacity="0.25" stroke="#d9480f" stroke-width="2"/>
<text x="330.0" y="140.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">TH</text>
<circle cx="440.0" cy="135.0" r="30.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="440.0" y="140.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">TT</text>
<path d="M 62,135 C 62,62 408,62 408,135 C 408,208 62,208 62,135 Z" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="280.0" y="238.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">E = at least one head = {HH, HT, TH}.  P(E) = 3/4</text>
</svg>
