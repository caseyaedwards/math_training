<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Venn diagram for the addition rule</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="270" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">OR Rule: Do Not Count the Overlap Twice</text>
<rect x="40.0" y="45.0" width="480.0" height="185.0" rx="8" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="240.0" cy="137.0" r="80.0" fill="#868e96" fill-opacity="0.3" stroke="#222222" stroke-width="2"/>
<circle cx="320.0" cy="137.0" r="80.0" fill="#d9480f" fill-opacity="0.25" stroke="#222222" stroke-width="2"/>
<text x="200.0" y="142.0" text-anchor="middle" fill="#222222" font-size="13">A only</text>
<text x="360.0" y="142.0" text-anchor="middle" fill="#222222" font-size="13">B only</text>
<text x="280.0" y="142.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">A and B</text>
<text x="150.0" y="72.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">A</text>
<text x="410.0" y="72.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">B</text>
<text x="280.0" y="258.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">P(A or B) = P(A) + P(B) - P(A and B)</text>
</svg>
