<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Rational numbers 1, 1.4, 1.41, 1.414 approach the square root of 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="660" height="250" fill="#ffffff"/>
<text x="330.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Completeness: The Gap at √2 Gets Filled</text>
<line x1="40.0" y1="140.0" x2="620.0" y2="140.0" stroke="#222222" stroke-width="2"/>
<line x1="122.9" y1="135.0" x2="122.9" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="122.9" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1</text>
<line x1="205.7" y1="135.0" x2="205.7" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="205.7" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1.1</text>
<line x1="288.6" y1="135.0" x2="288.6" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="288.6" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1.2</text>
<line x1="371.4" y1="135.0" x2="371.4" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="371.4" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1.3</text>
<line x1="454.3" y1="135.0" x2="454.3" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="454.3" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1.4</text>
<line x1="537.1" y1="135.0" x2="537.1" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="537.1" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1.5</text>
<line x1="620.0" y1="135.0" x2="620.0" y2="145.0" stroke="#222222" stroke-width="1.5"/>
<text x="620.0" y="164.0" text-anchor="middle" fill="#666666" font-size="12">1.6</text>
<rect x="40.0" y="133.0" width="426.1" height="14.0" rx="0" fill="#d9480f" fill-opacity="0.2" stroke="none" stroke-width="1.5"/>
<circle cx="122.9" cy="140.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<line x1="122.9" y1="130.0" x2="122.9" y2="108.0" stroke="#cccccc" stroke-width="1"/>
<text x="119.9" y="104.0" text-anchor="end" fill="#222222" font-size="12">1</text>
<circle cx="454.3" cy="140.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<line x1="454.3" y1="130.0" x2="454.3" y2="94.0" stroke="#cccccc" stroke-width="1"/>
<text x="451.3" y="90.0" text-anchor="end" fill="#222222" font-size="12">1.4</text>
<circle cx="462.6" cy="140.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<line x1="462.6" y1="130.0" x2="462.6" y2="80.0" stroke="#cccccc" stroke-width="1"/>
<text x="459.6" y="76.0" text-anchor="end" fill="#222222" font-size="12">1.41</text>
<circle cx="465.9" cy="140.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<line x1="465.9" y1="130.0" x2="465.9" y2="66.0" stroke="#cccccc" stroke-width="1"/>
<text x="462.9" y="62.0" text-anchor="end" fill="#222222" font-size="12">1.414</text>
<circle cx="466.1" cy="140.0" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<line x1="466.1" y1="130.0" x2="466.1" y2="52.0" stroke="#cccccc" stroke-width="1"/>
<text x="463.1" y="48.0" text-anchor="end" fill="#222222" font-size="12">1.4142</text>
<circle cx="466.1" cy="140.0" r="6.0" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<text x="474.1" y="128.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">√2 = sup S</text>
<text x="330.0" y="205.0" text-anchor="middle" fill="#222222" font-size="13">S = { x : x² &lt; 2 } (shaded). In the rationals S has no least upper bound.</text>
<text x="330.0" y="225.0" text-anchor="middle" fill="#666666" font-size="13">In the reals it does: √2. Completeness says every such gap is filled.</text>
</svg>
