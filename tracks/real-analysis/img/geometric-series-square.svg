<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 345" width="560" height="345" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A unit square divided into halves, quarters, eighths showing 1/2 + 1/4 + ... = 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="345" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">1/2 + 1/4 + 1/8 + ... = 1</text>
<rect x="60.0" y="50.0" width="130.0" height="260.0" rx="0" fill="#d9480f" fill-opacity="0.85" stroke="#222222" stroke-width="1.2"/>
<text x="125.0" y="185.0" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">1/2</text>
<rect x="190.0" y="50.0" width="130.0" height="130.0" rx="0" fill="#d9480f" fill-opacity="0.76" stroke="#222222" stroke-width="1.2"/>
<text x="255.0" y="120.0" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">1/4</text>
<rect x="190.0" y="180.0" width="65.0" height="130.0" rx="0" fill="#d9480f" fill-opacity="0.6699999999999999" stroke="#222222" stroke-width="1.2"/>
<text x="222.5" y="250.0" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">1/8</text>
<rect x="255.0" y="180.0" width="65.0" height="65.0" rx="0" fill="#d9480f" fill-opacity="0.58" stroke="#222222" stroke-width="1.2"/>
<text x="287.5" y="217.5" text-anchor="middle" fill="#222222" font-size="11" font-weight="bold">1/16</text>
<rect x="255.0" y="245.0" width="32.5" height="65.0" rx="0" fill="#d9480f" fill-opacity="0.49" stroke="#222222" stroke-width="1.2"/>
<text x="271.2" y="282.5" text-anchor="middle" fill="#222222" font-size="10" font-weight="bold">1/32</text>
<rect x="287.5" y="245.0" width="32.5" height="32.5" rx="0" fill="#d9480f" fill-opacity="0.4" stroke="#222222" stroke-width="1.2"/>
<rect x="287.5" y="277.5" width="16.2" height="32.5" rx="0" fill="#d9480f" fill-opacity="0.30999999999999994" stroke="#222222" stroke-width="1.2"/>
<rect x="303.8" y="277.5" width="16.2" height="16.2" rx="0" fill="#d9480f" fill-opacity="0.21999999999999997" stroke="#222222" stroke-width="1.2"/>
<rect x="60.0" y="50.0" width="260.0" height="260.0" rx="0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="350.0" y="120.0" text-anchor="start" fill="#222222" font-size="13">Each piece is half</text>
<text x="350.0" y="140.0" text-anchor="start" fill="#222222" font-size="13">of what is left.</text>
<text x="350.0" y="180.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Partial sums:</text>
<text x="350.0" y="200.0" text-anchor="start" fill="#222222" font-size="13">S1 = 0.5</text>
<text x="350.0" y="220.0" text-anchor="start" fill="#222222" font-size="13">S2 = 0.75</text>
<text x="350.0" y="240.0" text-anchor="start" fill="#222222" font-size="13">S3 = 0.875</text>
<text x="350.0" y="260.0" text-anchor="start" fill="#222222" font-size="13">S4 = 0.9375</text>
<text x="350.0" y="280.0" text-anchor="start" fill="#222222" font-size="13">S5 = 0.96875</text>
<text x="280.0" y="337.0" text-anchor="middle" fill="#666666" font-size="12">The leftover after n pieces is 1/2ⁿ, which goes to 0. The sum is exactly 1.</text>
</svg>
