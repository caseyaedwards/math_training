<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Unit balls in the taxicab, Euclidean and max metrics</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Three Distances, Three Unit Balls</text>
<line x1="20.0" y1="160.0" x2="220.0" y2="160.0" stroke="#cccccc" stroke-width="1.5"/>
<line x1="120.0" y1="60.0" x2="120.0" y2="260.0" stroke="#cccccc" stroke-width="1.5"/>
<polygon points="200.0,160.0 120.0,80.0 40.0,160.0 120.0,240.0" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2.5" stroke-linejoin="round"/>
<text x="120.0" y="280.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">taxicab: |x| + |y| ≤ 1</text>
<line x1="250.0" y1="160.0" x2="450.0" y2="160.0" stroke="#cccccc" stroke-width="1.5"/>
<line x1="350.0" y1="60.0" x2="350.0" y2="260.0" stroke="#cccccc" stroke-width="1.5"/>
<circle cx="350.0" cy="160.0" r="80.0" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2.5"/>
<text x="350.0" y="280.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">Euclidean: √(x² + y²) ≤ 1</text>
<line x1="480.0" y1="160.0" x2="680.0" y2="160.0" stroke="#cccccc" stroke-width="1.5"/>
<line x1="580.0" y1="60.0" x2="580.0" y2="260.0" stroke="#cccccc" stroke-width="1.5"/>
<rect x="500.0" y="80.0" width="160.0" height="160.0" rx="0" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2.5"/>
<text x="580.0" y="280.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">max: max(|x|, |y|) ≤ 1</text>
<text x="350.0" y="52.0" text-anchor="middle" fill="#222222" font-size="1"></text>
</svg>
