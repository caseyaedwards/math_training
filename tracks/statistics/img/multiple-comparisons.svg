<text x="84.7" y="60.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">p = 0.031: a fluke</text>
<text x="330.0" y="175.0" text-anchor="middle" fill="#222222" font-size="13">20 metrics with no real effect. At α = 0.05, expect 20 x 0.05 = 1 false alarm.</text>
<text x="330.0" y="197.0" text-anchor="middle" fill="#666666" font-size="13">Bonferroni fix: require p &lt; 0.05 / 20 = 0.0025 for each test.</text>
