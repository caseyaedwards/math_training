<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Ruler converting latency to z-scores</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="640" height="200" fill="#ffffff"/>
<text x="320.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">z-Score: Distance from the Mean in Standard Deviations</text>
<line x1="50.0" y1="80.0" x2="590.0" y2="80.0" stroke="#222222" stroke-width="2"/>
<line x1="50.0" y1="130.0" x2="590.0" y2="130.0" stroke="#222222" stroke-width="2"/>
<line x1="88.6" y1="74.0" x2="88.6" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="88.6" y1="124.0" x2="88.6" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="88.6" y="66.0" text-anchor="middle" fill="#222222" font-size="12">140 ms</text>
<text x="88.6" y="154.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">z = -3</text>
<line x1="88.6" y1="86.0" x2="88.6" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="165.7" y1="74.0" x2="165.7" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="165.7" y1="124.0" x2="165.7" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="165.7" y="66.0" text-anchor="middle" fill="#222222" font-size="12">160 ms</text>
<text x="165.7" y="154.0" text-anchor="middle" fill="#222222" font-size="12">z = -2</text>
<line x1="165.7" y1="86.0" x2="165.7" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="242.9" y1="74.0" x2="242.9" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="242.9" y1="124.0" x2="242.9" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="242.9" y="66.0" text-anchor="middle" fill="#222222" font-size="12">180 ms</text>
<text x="242.9" y="154.0" text-anchor="middle" fill="#222222" font-size="12">z = -1</text>
<line x1="242.9" y1="86.0" x2="242.9" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="320.0" y1="74.0" x2="320.0" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="320.0" y1="124.0" x2="320.0" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="320.0" y="66.0" text-anchor="middle" fill="#222222" font-size="12">200 ms</text>
<text x="320.0" y="154.0" text-anchor="middle" fill="#222222" font-size="12">z = 0</text>
<line x1="320.0" y1="86.0" x2="320.0" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="397.1" y1="74.0" x2="397.1" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="397.1" y1="124.0" x2="397.1" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="397.1" y="66.0" text-anchor="middle" fill="#222222" font-size="12">220 ms</text>
<text x="397.1" y="154.0" text-anchor="middle" fill="#222222" font-size="12">z = +1</text>
<line x1="397.1" y1="86.0" x2="397.1" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="474.3" y1="74.0" x2="474.3" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="474.3" y1="124.0" x2="474.3" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="474.3" y="66.0" text-anchor="middle" fill="#222222" font-size="12">240 ms</text>
<text x="474.3" y="154.0" text-anchor="middle" fill="#222222" font-size="12">z = +2</text>
<line x1="474.3" y1="86.0" x2="474.3" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<line x1="551.4" y1="74.0" x2="551.4" y2="86.0" stroke="#222222" stroke-width="1.5"/>
<line x1="551.4" y1="124.0" x2="551.4" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<text x="551.4" y="66.0" text-anchor="middle" fill="#222222" font-size="12">260 ms</text>
<text x="551.4" y="154.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">z = +3</text>
<line x1="551.4" y1="86.0" x2="551.4" y2="124.0" stroke="#eeeeee" stroke-width="1"/>
<text x="30.0" y="84.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold">x</text>
<text x="30.0" y="134.0" text-anchor="end" fill="#222222" font-size="14" font-weight="bold">z</text>
<text x="320.0" y="185.0" text-anchor="middle" fill="#666666" font-size="13">mean 200 ms, standard deviation 20 ms:  z = (x - 200) / 20</text>
</svg>
