<text x="438.0" y="211.7" text-anchor="end" fill="#222222" font-size="13">r6</text>
<text x="547.2" y="211.7" text-anchor="middle" fill="#222222" font-size="12">3.5 s</text>
<text x="90.0" y="54.0" text-anchor="start" fill="#666666" font-size="13">each bar is one request, from arrival to departure</text>
