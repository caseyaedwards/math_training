<polyline points="90.0,410.0 119.5,410.0 119.5,372.5 149.0,372.5 149.0,335.0 208.0,335.0 208.0,297.5 267.0,297.5 267.0,335.0 267.0,335.0 267.0,372.5 296.5,372.5 296.5,335.0 326.0,335.0 326.0,297.5 414.5,297.5 414.5,335.0 444.0,335.0 444.0,297.5 473.5,297.5 473.5,335.0 532.5,335.0 532.5,372.5 650.5,372.5 650.5,410.0 680.0,410.0" fill="none" stroke="#d9480f" stroke-width="2" stroke-linejoin="round"/>
<text x="674.1" y="278.8" text-anchor="end" fill="#222222" font-size="13" font-weight="bold">shaded area = sum of bars = 18 request-seconds</text>
<text x="360.0" y="488.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">L = area / 10 s = 1.8   ·   λ = 6 / 10 s = 0.6 per s   ·   W = 18 / 6 = 3 s   ·   λW = 1.8</text>
<text x="360.0" y="512.0" text-anchor="middle" fill="#666666" font-size="13">Count the same area two ways: by time (L) or by request (λ times W).</text>
</svg>
