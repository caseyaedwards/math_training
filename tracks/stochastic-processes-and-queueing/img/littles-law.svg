<line x1="90.0" y1="410.0" x2="90.0" y2="260.0" stroke="#222222" stroke-width="1.5"/>
<text x="385.0" y="456.0" text-anchor="middle" fill="#666666" font-size="14">time (s)</text>
<text x="38.0" y="335.0" text-anchor="middle" fill="#666666" font-size="14" transform="rotate(-90 38.0 335.0)">in system N(t)</text>
