<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Separate queues, a shared queue, and one fast server at the same total load</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="780" height="480" fill="#ffffff"/>
<text x="390.0" y="32.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">Pooling: Share One Line Instead of Two (total load 8 per second)</text>
<text x="130.0" y="80.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">Two separate lines</text>
<text x="130.0" y="100.0" text-anchor="middle" fill="#666666" font-size="13">each server μ = 5</text>
<text x="130.0" y="420.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">W = 1.000 s</text>
<text x="390.0" y="80.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">One shared line</text>
<text x="390.0" y="100.0" text-anchor="middle" fill="#666666" font-size="13">two servers μ = 5</text>
<text x="390.0" y="420.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">W = 0.556 s</text>
<text x="650.0" y="80.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">One fast server</text>
<text x="650.0" y="100.0" text-anchor="middle" fill="#666666" font-size="13">one server μ = 10</text>
<text x="650.0" y="420.0" text-anchor="middle" fill="#d9480f" font-size="16" font-weight="bold">W = 0.500 s</text>
<text x="30.0" y="185.0" text-anchor="start" fill="#222222" font-size="13">λ=4</text>
