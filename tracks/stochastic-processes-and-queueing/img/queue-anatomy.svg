<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Anatomy of a queue with Kendall notation</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#ffffff"/>
<text x="380.0" y="32.0" text-anchor="middle" fill="#222222" font-size="18" font-weight="bold">A Queue: Arrivals, a Waiting Line and Servers</text>
<circle cx="50.0" cy="150.0" r="7" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<circle cx="68.0" cy="180.0" r="7" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<circle cx="86.0" cy="210.0" r="7" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<line x1="110.0" y1="180.0" x2="180.0" y2="180.0" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="140.0" y="160.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">rate λ</text>
<path d="M190,150 L400,150 L400,210 L190,210" fill="none" stroke="#222222" stroke-width="2"/>
<circle cx="380.0" cy="180.0" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="342.0" cy="180.0" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="304.0" cy="180.0" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="266.0" cy="180.0" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<circle cx="228.0" cy="180.0" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="295.0" y="240.0" text-anchor="middle" fill="#666666" font-size="13">waiting line (buffer)</text>
<path d="M402,180 C440,180 440,110 480,110" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="520.0" cy="110.0" r="30" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<circle cx="520.0" cy="110.0" r="12" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<line x1="552.0" y1="110.0" x2="620.0" y2="110.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M402,180 C440,180 440,180 480,180" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="520.0" cy="180.0" r="30" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<circle cx="520.0" cy="180.0" r="12" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<line x1="552.0" y1="180.0" x2="620.0" y2="180.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M402,180 C440,180 440,250 480,250" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="520.0" cy="250.0" r="30" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<circle cx="520.0" cy="250.0" r="12" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<line x1="552.0" y1="250.0" x2="620.0" y2="250.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="520.0" y="300.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">c servers, each rate μ</text>
<text x="690.0" y="185.0" text-anchor="middle" fill="#222222" font-size="14">done</text>
<rect x="40.0" y="290.0" width="330.0" height="56.0" rx="0" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<text x="55.0" y="312.0" text-anchor="start" fill="#222222" font-size="13" font-weight="bold">Kendall notation A / S / c:</text>
<text x="55.0" y="333.0" text-anchor="start" fill="#222222" font-size="13">M/M/1 = random arrivals / random service / 1 server</text>
<text x="590.0" y="345.0" text-anchor="middle" fill="#d9480f" font-size="15" font-weight="bold">utilization ρ = λ / (c μ)</text>
<text x="590.0" y="366.0" text-anchor="middle" fill="#666666" font-size="13">fraction of time servers are busy</text>
</svg>
