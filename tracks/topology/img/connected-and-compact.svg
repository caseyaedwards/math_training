<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Connected versus disconnected sets and compact versus non-compact intervals</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="660" height="300" fill="#ffffff"/>
<text x="330.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Connected and Compact</text>
<path d="M60,110 C60,50 200,40 220,90 C240,140 150,170 100,150 C70,140 60,130 60,110 Z" fill="#d9480f" fill-opacity="0.2" stroke="#d9480f" stroke-width="2"/>
<text x="140.0" y="190.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">connected: one piece</text>
<circle cx="340.0" cy="95.0" r="40.0" fill="#868e96" fill-opacity="0.25" stroke="#222222" stroke-width="2"/>
<circle cx="450.0" cy="110.0" r="35.0" fill="#868e96" fill-opacity="0.25" stroke="#222222" stroke-width="2"/>
<text x="395.0" y="190.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">disconnected: two pieces</text>
<line x1="60.0" y1="245.0" x2="300.0" y2="245.0" stroke="#d9480f" stroke-width="4"/>
<circle cx="60.0" cy="245.0" r="6.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<circle cx="300.0" cy="245.0" r="6.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<text x="180.0" y="275.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="bold">[0, 1]: closed, bounded: compact</text>
<line x1="360.0" y1="245.0" x2="600.0" y2="245.0" stroke="#222222" stroke-width="4"/>
<circle cx="360.0" cy="245.0" r="6.0" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<circle cx="600.0" cy="245.0" r="6.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="600.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="480.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="440.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="420.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="408.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="400.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="394.3" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<circle cx="390.0" cy="231.0" r="3.0" fill="#666666" stroke="none" stroke-width="1.5"/>
<text x="480.0" y="275.0" text-anchor="middle" fill="#222222" font-size="12" font-weight="bold">(0, 1]: 1/n escapes through the hole</text>
</svg>
