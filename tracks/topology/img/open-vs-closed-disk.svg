<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="620" height="280" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Open disk with dashed boundary versus closed disk with solid boundary</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="620" height="280" fill="#ffffff"/>
<text x="310.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Open Set: Every Point Has Room Around It</text>
<circle cx="160.0" cy="140.0" r="90.0" fill="#d9480f" fill-opacity="0.15" stroke="#d9480f" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="222.4" cy="97.3" r="4.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="222.4" cy="97.3" r="11.0" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="160.0" y="255.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">open disk: x² + y² &lt; 1</text>
<text x="160.0" y="270.0" text-anchor="middle" fill="#222222" font-size="1"></text>
<circle cx="450.0" cy="140.0" r="90.0" fill="#868e96" fill-opacity="0.2" stroke="#222222" stroke-width="2.5"/>
<circle cx="540.0" cy="140.0" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<circle cx="540.0" cy="140.0" r="18.0" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="450.0" y="255.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">closed disk: x² + y² ≤ 1</text>
<text x="615.0" y="52.0" text-anchor="end" fill="#666666" font-size="12">boundary point:</text>
<text x="615.0" y="68.0" text-anchor="end" fill="#666666" font-size="12">every ball sticks out</text>
<text x="160.0" y="50.0" text-anchor="middle" fill="#666666" font-size="12">near the edge, a tiny ball still fits inside</text>
</svg>
