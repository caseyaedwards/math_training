<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Circle, square and triangle are the same to a topologist; a figure eight is not</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="700" height="250" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Rubber-Sheet Geometry: Same or Different?</text>
<circle cx="80.0" cy="125.0" r="50.0" fill="none" stroke="#222222" stroke-width="2.5"/>
<rect x="200.0" y="70.0" width="110.0" height="110.0" rx="0" fill="none" stroke="#222222" stroke-width="2.5"/>
<polygon points="420.0,70.0 480.0,180.0 360.0,180.0" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<text x="165.0" y="133.0" text-anchor="middle" fill="#d9480f" font-size="26" font-weight="bold">=</text>
<text x="335.0" y="133.0" text-anchor="middle" fill="#d9480f" font-size="26" font-weight="bold">=</text>
<text x="520.0" y="133.0" text-anchor="middle" fill="#d9480f" font-size="26" font-weight="bold">≠</text>
<circle cx="590.0" cy="100.0" r="32.0" fill="none" stroke="#222222" stroke-width="2.5"/>
<circle cx="590.0" cy="164.0" r="32.0" fill="none" stroke="#222222" stroke-width="2.5"/>
<text x="270.0" y="220.0" text-anchor="middle" fill="#666666" font-size="13">one loop each: stretch one into another</text>
<text x="590.0" y="220.0" text-anchor="middle" fill="#666666" font-size="13">a crossing point</text>
<text x="590.0" y="238.0" text-anchor="middle" fill="#666666" font-size="13">cannot be stretched away</text>
</svg>
