<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Stereographic projection maps a circle minus one point onto a line</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="620" height="330" fill="#ffffff"/>
<text x="310.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A Homeomorphism: Circle Minus a Point = Line</text>
<line x1="30.0" y1="185.7" x2="590.0" y2="185.7" stroke="#222222" stroke-width="2"/>
<circle cx="310.0" cy="185.7" r="87.5" fill="none" stroke="#222222" stroke-width="2.2"/>
<circle cx="310.0" cy="97.8" r="6.0" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<text x="320.0" y="87.8" text-anchor="start" fill="#d9480f" font-size="12" font-weight="bold">N (removed)</text>
<line x1="310.0" y1="97.8" x2="364.4" y2="254.6" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="364.4" cy="254.6" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<circle cx="340.5" cy="185.7" r="5.0" fill="#d9480f" stroke="none" stroke-width="1.5"/>
<line x1="310.0" y1="97.8" x2="435.1" y2="185.7" stroke="#222222" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="392.2" cy="155.5" r="5.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<circle cx="435.1" cy="185.7" r="5.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<line x1="310.0" y1="97.8" x2="80.7" y2="185.7" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="251.7" cy="120.1" r="5.0" fill="#868e96" stroke="none" stroke-width="1.5"/>
<circle cx="80.7" cy="185.7" r="5.0" fill="#868e96" stroke="none" stroke-width="1.5"/>
<text x="310.0" y="322.0" text-anchor="middle" fill="#666666" font-size="12">Draw a line from N through P. Where it hits the axis is P's partner. Near N, partners run off to infinity.</text>
</svg>
