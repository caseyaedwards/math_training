<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Triangle inequality for a metric</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs>
<rect x="0" y="0" width="560" height="270" fill="#ffffff"/>
<text x="280.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">A Metric: The Detour Is Never Shorter</text>
<line x1="90.0" y1="210.0" x2="470.0" y2="210.0" stroke="#d9480f" stroke-width="3"/>
<line x1="90.0" y1="210.0" x2="300.0" y2="70.0" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="300.0" y1="70.0" x2="470.0" y2="210.0" stroke="#222222" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="90.0" cy="210.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="90.0" y="236.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">x</text>
<circle cx="300.0" cy="70.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="300.0" y="56.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">y</text>
<circle cx="470.0" cy="210.0" r="7.0" fill="#222222" stroke="none" stroke-width="1.5"/>
<text x="470.0" y="236.0" text-anchor="middle" fill="#222222" font-size="15" font-weight="bold">z</text>
<text x="280.0" y="232.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">d(x, z)</text>
<text x="170.0" y="125.0" text-anchor="middle" fill="#222222" font-size="13">d(x, y)</text>
<text x="400.0" y="125.0" text-anchor="middle" fill="#222222" font-size="13">d(y, z)</text>
<text x="280.0" y="262.0" text-anchor="middle" fill="#666666" font-size="12">d(x, z) ≤ d(x, y) + d(y, z). Also: d ≥ 0, d(x, y) = d(y, x), d(x, y) = 0 only if x = y.</text>
</svg>
