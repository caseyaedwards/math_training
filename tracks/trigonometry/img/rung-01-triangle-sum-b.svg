<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Angles in a triangle add to 180 degrees</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<text x="350.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Tear off the three corners: they fill a straight line</text>
<path d="M40.0,250.0 L76.0,250.0 A36.0,36.0 0 0 0 63.1,222.4 Z" stroke="#222222" stroke-width="1.2" fill="#f6d5c4" stroke-linejoin="round"/>
<path d="M300.0,250.0 L282.0,218.8 A36.0,36.0 0 0 0 264.0,250.0 Z" stroke="#222222" stroke-width="1.2" fill="#e6e6e6" stroke-linejoin="round"/>
<path d="M194.0,66.4 L170.9,94.0 A36.0,36.0 0 0 0 212.0,97.6 Z" stroke="#d9480f" stroke-width="1.5" fill="#ffffff" stroke-linejoin="round"/>
<path d="M40.0,250.0 L300.0,250.0 L194.0,66.4 Z" stroke="#222222" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="92.9" y="232.2" text-anchor="start" fill="#222222" font-size="13">50°</text>
<text x="253.0" y="229.0" text-anchor="end" fill="#222222" font-size="13">60°</text>
<text x="189.5" y="126.2" text-anchor="middle" fill="#d9480f" font-size="13">70°</text>
<path d="M520.0,220.0 L600.0,220.0 A80.0,80.0 0 0 0 571.4,158.7 Z" stroke="#222222" stroke-width="1.2" fill="#f6d5c4" stroke-linejoin="round"/>
<path d="M520.0,220.0 L571.4,158.7 A80.0,80.0 0 0 0 480.0,150.7 Z" stroke="#d9480f" stroke-width="1.5" fill="#ffffff" stroke-linejoin="round"/>
<path d="M520.0,220.0 L480.0,150.7 A80.0,80.0 0 0 0 440.0,220.0 Z" stroke="#222222" stroke-width="1.2" fill="#e6e6e6" stroke-linejoin="round"/>
<line x1="390.0" y1="220.0" x2="650.0" y2="220.0" stroke="#222222" stroke-width="2"/>
<text x="565.0" y="204.0" text-anchor="middle" fill="#222222" font-size="13">50°</text>
<text x="524.3" y="175.6" text-anchor="middle" fill="#d9480f" font-size="13">70°</text>
<text x="477.0" y="200.2" text-anchor="middle" fill="#222222" font-size="13">60°</text>
<text x="520.0" y="254.0" text-anchor="middle" fill="#222222" font-weight="bold">50° + 70° + 60° = 180°</text>
<text x="520.0" y="276.0" text-anchor="middle" fill="#555555" font-size="13">a straight line is a half turn</text>
<line x1="330.0" y1="180.0" x2="380.0" y2="180.0" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
