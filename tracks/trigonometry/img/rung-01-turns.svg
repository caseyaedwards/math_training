<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="660" height="260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Quarter, half and full turns</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="660" height="260" fill="#ffffff"/>
<text x="330.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">An angle is an amount of turn</text>
<line x1="70.0" y1="185.0" x2="170.0" y2="185.0" stroke="#222222" stroke-width="2"/>
<line x1="70.0" y1="185.0" x2="70.0" y2="85.0" stroke="#222222" stroke-width="2"/>
<path d="M86.0,185.0 L86.0,169.0 L70.0,169.0" stroke="#d9480f" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<path d="M110.0,185.0 A40.0,40.0 0 0 0 70.0,145.0" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrowA)"/>
<text x="114.0" y="141.0" text-anchor="start" fill="#d9480f" font-weight="bold">90°</text>
<text x="120.0" y="220.0" text-anchor="middle" fill="#222222">quarter turn</text>
<text x="120.0" y="240.0" text-anchor="middle" fill="#555555">90°</text>
<line x1="240.0" y1="185.0" x2="420.0" y2="185.0" stroke="#222222" stroke-width="2"/>
<circle cx="330.0" cy="185.0" r="3.5" fill="#222222"/>
<path d="M375.0,185.0 A45.0,45.0 0 0 0 285.0,185.0" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrowA)"/>
<text x="330.0" y="130.0" text-anchor="middle" fill="#d9480f" font-weight="bold">180°</text>
<text x="330.0" y="220.0" text-anchor="middle" fill="#222222">half turn</text>
<text x="330.0" y="240.0" text-anchor="middle" fill="#555555">180° = 2 × 90°</text>
<line x1="550.0" y1="140.0" x2="630.0" y2="140.0" stroke="#222222" stroke-width="2"/>
<circle cx="550.0" cy="140.0" r="3.5" fill="#222222"/>
<path d="M594.9,137.6 A45.0,45.0 0 0 0 505.0,140.0" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round"/>
<path d="M505.0,140.0 A45.0,45.0 0 0 0 594.6,146.3" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrowA)"/>
<text x="544.0" y="132.0" text-anchor="end" fill="#d9480f" font-size="13" font-weight="bold">360°</text>
<text x="550.0" y="220.0" text-anchor="middle" fill="#222222">full turn</text>
<text x="550.0" y="240.0" text-anchor="middle" fill="#555555">360° = 4 × 90°</text>
</svg>
