<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Two similar right triangles share the same ratios</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="620" height="340" fill="#ffffff"/>
<path d="M40.0,270.0 L168.0,270.0 L168.0,174.0 Z" stroke="#222222" stroke-width="2" fill="#f6d5c4" stroke-linejoin="round"/>
<path d="M156.0,270.0 L156.0,258.0 L168.0,258.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<path d="M74.0,270.0 A34.0,34.0 0 0 0 67.2,249.6" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="83.6" y="260.5" text-anchor="middle" fill="#d9480f" font-weight="bold">θ</text>
<text x="104.0" y="292.0" text-anchor="middle" fill="#222222">4</text>
<text x="176.0" y="227.0" text-anchor="start" fill="#222222">3</text>
<text x="94.0" y="212.0" text-anchor="end" fill="#222222">5</text>
<path d="M250.0,270.0 L506.0,270.0 L506.0,78.0 Z" stroke="#222222" stroke-width="2" fill="#ffffff" stroke-linejoin="round"/>
<path d="M494.0,270.0 L494.0,258.0 L506.0,258.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<path d="M284.0,270.0 A34.0,34.0 0 0 0 277.2,249.6" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="293.6" y="260.5" text-anchor="middle" fill="#d9480f" font-weight="bold">θ</text>
<text x="378.0" y="292.0" text-anchor="middle" fill="#222222">8</text>
<text x="514.0" y="179.0" text-anchor="start" fill="#222222">6</text>
<text x="368.0" y="164.0" text-anchor="end" fill="#222222">10</text>
<text x="310.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Same angle θ, different sizes, same ratios</text>
<text x="110.0" y="318.0" text-anchor="middle" fill="#222222" font-size="13">sin θ = 3/5 = 6/10 = 0.6</text>
<text x="320.0" y="318.0" text-anchor="middle" fill="#222222" font-size="13">tan θ = 3/4 = 6/8 = 0.75</text>
<text x="520.0" y="318.0" text-anchor="middle" fill="#d9480f" font-size="13" font-weight="bold">θ ≈ 36.9°</text>
</svg>
