<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The 45-45-90 and 30-60-90 triangles</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="660" height="350" fill="#ffffff"/>
<path d="M60.0,240.0 L220.0,240.0 L220.0,80.0 Z" stroke="#222222" stroke-width="1" fill="#f6d5c4" stroke-linejoin="round"/>
<path d="M60.0,80.0 L220.0,80.0 L220.0,240.0 L60.0,240.0 Z" stroke="#222222" stroke-width="2" fill="none" stroke-linejoin="round"/>
<line x1="60.0" y1="240.0" x2="220.0" y2="80.0" stroke="#d9480f" stroke-width="2.5"/>
<path d="M208.0,240.0 L208.0,228.0 L220.0,228.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="140.0" y="262.0" text-anchor="middle" fill="#222222">1</text>
<text x="230.0" y="165.0" text-anchor="start" fill="#222222">1</text>
<text x="128.0" y="152.0" text-anchor="end" fill="#d9480f" font-weight="bold">√2</text>
<path d="M94.0,240.0 A34.0,34.0 0 0 0 84.0,216.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="108.0" y="225.1" text-anchor="middle" fill="#222222" font-size="13">45°</text>
<path d="M198.8,101.2 A30.0,30.0 0 0 0 220.0,110.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="207.9" y="133.5" text-anchor="middle" fill="#222222" font-size="13">45°</text>
<text x="140.0" y="50.0" text-anchor="middle" fill="#222222" font-weight="bold">half of a square</text>
<path d="M470.0,84.1 L560.0,240.0 L470.0,240.0 Z" stroke="#222222" stroke-width="1" fill="#f6d5c4" stroke-linejoin="round"/>
<path d="M380.0,240.0 L560.0,240.0 L470.0,84.1 Z" stroke="#222222" stroke-width="2" fill="none" stroke-linejoin="round"/>
<line x1="470.0" y1="84.1" x2="470.0" y2="240.0" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6,4"/>
<path d="M482.0,240.0 L482.0,228.0 L470.0,228.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="413.0" y="162.1" text-anchor="end" fill="#222222">2</text>
<text x="527.0" y="162.1" text-anchor="start" fill="#222222">2</text>
<text x="425.0" y="262.0" text-anchor="middle" fill="#222222">1</text>
<text x="515.0" y="262.0" text-anchor="middle" fill="#222222">1</text>
<text x="462.0" y="177.1" text-anchor="end" fill="#d9480f" font-weight="bold">√3</text>
<path d="M544.0,212.3 A32.0,32.0 0 0 0 528.0,240.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="516.7" y="220.0" text-anchor="middle" fill="#222222" font-size="13">60°</text>
<path d="M470.0,118.1 A34.0,34.0 0 0 0 487.0,113.6" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="486.9" y="162.2" text-anchor="middle" fill="#222222" font-size="13">30°</text>
<text x="470.0" y="50.0" text-anchor="middle" fill="#222222" font-weight="bold">half of an equilateral triangle</text>
<text x="140.0" y="290.0" text-anchor="middle" fill="#222222" font-size="13">sin 45° = 1/√2 = √2/2 ≈ 0.707</text>
<text x="470.0" y="290.0" text-anchor="middle" fill="#222222" font-size="13">sin 30° = 1/2 = 0.5</text>
<text x="470.0" y="312.0" text-anchor="middle" fill="#222222" font-size="13">sin 60° = √3/2 ≈ 0.866</text>
<text x="140.0" y="312.0" text-anchor="middle" fill="#222222" font-size="13">cos 45° = √2/2 ≈ 0.707</text>
</svg>
