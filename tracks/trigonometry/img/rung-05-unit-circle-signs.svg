<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Unit circle point at 150 degrees and the quadrant signs</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
<line x1="60.0" y1="230.0" x2="440.0" y2="230.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="250.0" y1="420.0" x2="250.0" y2="40.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="448.0" y="235.0" text-anchor="start" fill="#555555" font-style="italic">x</text>
<text x="260.0" y="46.0" text-anchor="start" fill="#555555" font-style="italic">y</text>
<circle cx="250.0" cy="230.0" r="150.0" fill="none" stroke="#222222" stroke-width="2"/>
<text x="404.0" y="248.0" text-anchor="start" fill="#555555" font-size="13">1</text>
<text x="96.0" y="248.0" text-anchor="end" fill="#555555" font-size="13">−1</text>
<text x="256.0" y="74.0" text-anchor="start" fill="#555555" font-size="13">1</text>
<text x="256.0" y="398.0" text-anchor="start" fill="#555555" font-size="13">−1</text>
<path d="M250.0,230.0 L120.1,230.0 L120.1,155.0 Z" stroke="none" stroke-width="0" fill="#f6d5c4" stroke-linejoin="round"/>
<line x1="250.0" y1="230.0" x2="120.1" y2="155.0" stroke="#d9480f" stroke-width="2.5"/>
<line x1="120.1" y1="230.0" x2="120.1" y2="155.0" stroke="#d9480f" stroke-width="2.5"/>
<line x1="250.0" y1="230.0" x2="120.1" y2="230.0" stroke="#d9480f" stroke-width="4"/>
<circle cx="120.1" cy="155.0" r="5" fill="#d9480f"/>
<text x="108.1" y="147.0" text-anchor="end" fill="#d9480f" font-weight="bold">P</text>
<path d="M278.0,230.0 A28.0,28.0 0 0 0 225.8,216.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="258.0" y="198.0" text-anchor="start" fill="#222222" font-size="13">150°</text>
<text x="185.0" y="250.0" text-anchor="middle" fill="#222222" font-size="13">cos ≈ −0.866</text>
<text x="126.1" y="218.0" text-anchor="start" fill="#222222" font-size="13">sin = 0.5</text>
<text x="400.0" y="62.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Quadrant I</text>
<text x="400.0" y="80.0" text-anchor="middle" fill="#555555" font-size="13">cos +, sin +</text>
<text x="100.0" y="62.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Quadrant II</text>
<text x="100.0" y="80.0" text-anchor="middle" fill="#555555" font-size="13">cos −, sin +</text>
<text x="100.0" y="392.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Quadrant III</text>
<text x="100.0" y="410.0" text-anchor="middle" fill="#555555" font-size="13">cos −, sin −</text>
<text x="400.0" y="392.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="bold">Quadrant IV</text>
<text x="400.0" y="410.0" text-anchor="middle" fill="#555555" font-size="13">cos +, sin −</text>
<text x="470.0" y="130.0" text-anchor="start" fill="#d9480f" font-weight="bold">P = (cos θ, sin θ)</text>
<text x="470.0" y="160.0" text-anchor="start" fill="#222222">θ = 150° (in quadrant II)</text>
<text x="470.0" y="190.0" text-anchor="start" fill="#222222">x = cos 150° ≈ −0.866</text>
<text x="470.0" y="220.0" text-anchor="start" fill="#222222">y = sin 150° = 0.5</text>
<text x="470.0" y="250.0" text-anchor="start" fill="#222222">tan 150° = y / x ≈ −0.577</text>
<text x="470.0" y="290.0" text-anchor="start" fill="#555555" font-size="13">The sign of cos is the sign of x.</text>
<text x="470.0" y="308.0" text-anchor="start" fill="#555555" font-size="13">The sign of sin is the sign of y.</text>
</svg>
