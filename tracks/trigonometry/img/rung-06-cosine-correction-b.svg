<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The law of cosines as a corrected Pythagorean theorem</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
<text x="380.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Same sides a = 5 and b = 7, three different angles C</text>
<path d="M45.0,210.0 L199.0,210.0 L100.0,114.7 Z" stroke="#222222" stroke-width="2" fill="#ffffff" stroke-linejoin="round"/>
<line x1="199.0" y1="210.0" x2="100.0" y2="114.7" stroke="#d9480f" stroke-width="3"/>
<path d="M63.0,210.0 A18.0,18.0 0 0 0 54.0,194.4" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="39.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">C = 60°</text>
<text x="159.5" y="156.4" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">c ≈ 6.24</text>
<text x="125.0" y="254.0" text-anchor="middle" fill="#222222" font-size="13">c² = 25 + 49 − 35 = 39</text>
<text x="125.0" y="276.0" text-anchor="middle" fill="#555555" font-size="13">smaller than 90°: subtract</text>
<path d="M290.0,210.0 L444.0,210.0 L290.0,100.0 Z" stroke="#222222" stroke-width="2" fill="#f6d5c4" stroke-linejoin="round"/>
<line x1="444.0" y1="210.0" x2="290.0" y2="100.0" stroke="#d9480f" stroke-width="3"/>
<path d="M300.0,210.0 L300.0,200.0 L290.0,200.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="284.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">C = 90°</text>
<text x="377.0" y="149.0" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">c ≈ 8.60</text>
<text x="370.0" y="254.0" text-anchor="middle" fill="#222222" font-size="13">c² = 25 + 49 − 0 = 74</text>
<text x="370.0" y="276.0" text-anchor="middle" fill="#555555" font-size="13">right angle: Pythagoras</text>
<path d="M575.0,210.0 L729.0,210.0 L520.0,114.7 Z" stroke="#222222" stroke-width="2" fill="#ffffff" stroke-linejoin="round"/>
<line x1="729.0" y1="210.0" x2="520.0" y2="114.7" stroke="#d9480f" stroke-width="3"/>
<path d="M593.0,210.0 A18.0,18.0 0 0 0 566.0,194.4" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="569.0" y="228.0" text-anchor="middle" fill="#222222" font-size="13">C = 120°</text>
<text x="634.5" y="156.4" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">c ≈ 10.44</text>
<text x="615.0" y="254.0" text-anchor="middle" fill="#222222" font-size="13">c² = 25 + 49 + 35 = 109</text>
<text x="615.0" y="276.0" text-anchor="middle" fill="#555555" font-size="13">larger than 90°: add</text>
</svg>
