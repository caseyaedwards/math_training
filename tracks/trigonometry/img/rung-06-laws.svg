<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="740" height="320" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Law of sines and law of cosines on one triangle</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="740" height="320" fill="#ffffff"/>
<path d="M60.0,260.0 L326.0,260.0 L155.0,95.5 Z" stroke="#222222" stroke-width="2" fill="#f6d5c4" stroke-linejoin="round"/>
<text x="52.0" y="278.0" text-anchor="middle" fill="#222222" font-weight="bold">C</text>
<text x="334.0" y="278.0" text-anchor="middle" fill="#222222" font-weight="bold">A</text>
<text x="155.0" y="85.5" text-anchor="middle" fill="#222222" font-weight="bold">B</text>
<text x="193.0" y="282.0" text-anchor="middle" fill="#222222">b = 7</text>
<text x="95.5" y="177.7" text-anchor="end" fill="#222222">a = 5</text>
<text x="252.5" y="173.7" text-anchor="start" fill="#d9480f" font-weight="bold">c ≈ 6.24</text>
<line x1="326.0" y1="260.0" x2="155.0" y2="95.5" stroke="#d9480f" stroke-width="3"/>
<path d="M92.0,260.0 A32.0,32.0 0 0 0 76.0,232.3" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="101.8" y="242.0" text-anchor="start" fill="#222222" font-size="13">60°</text>
<path d="M301.5,236.4 A34.0,34.0 0 0 0 292.0,260.0" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="275.6" y="246.3" text-anchor="end" fill="#222222" font-size="13">43.9°</text>
<path d="M141.0,119.7 A28.0,28.0 0 0 0 175.2,114.9" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<text x="161.2" y="147.0" text-anchor="middle" fill="#222222" font-size="13">76.1°</text>
<text x="400.0" y="60.0" text-anchor="start" fill="#222222" font-weight="bold">Law of cosines:</text>
<text x="400.0" y="86.0" text-anchor="start" fill="#222222">c² = a² + b² − 2ab cos C</text>
<text x="400.0" y="110.0" text-anchor="start" fill="#222222">c² = 25 + 49 − 70 × 0.5 = 39</text>
<text x="400.0" y="134.0" text-anchor="start" fill="#d9480f">c = √39 ≈ 6.24</text>
<text x="400.0" y="176.0" text-anchor="start" fill="#222222" font-weight="bold">Law of sines:</text>
<text x="400.0" y="202.0" text-anchor="start" fill="#222222">a / sin A = 5 / sin 43.9° ≈ 7.21</text>
<text x="400.0" y="226.0" text-anchor="start" fill="#222222">b / sin B = 7 / sin 76.1° ≈ 7.21</text>
<text x="400.0" y="250.0" text-anchor="start" fill="#222222">c / sin C = 6.24 / sin 60° ≈ 7.21</text>
<text x="400.0" y="280.0" text-anchor="start" fill="#555555" font-size="13">Each side sits across from its angle.</text>
</svg>
