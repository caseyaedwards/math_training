<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Rectangle proof of the angle addition formulas</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="660" height="500" fill="#ffffff"/>
<path d="M170.0,380.0 L309.5,80.9 L404.1,244.8 Z" stroke="none" stroke-width="0" fill="#f6d5c4" stroke-linejoin="round"/>
<path d="M170.0,380.0 L404.1,380.0 L404.1,80.9 L170.0,80.9 Z" stroke="#222222" stroke-width="2" fill="none" stroke-linejoin="round"/>
<line x1="170.0" y1="380.0" x2="404.1" y2="244.8" stroke="#222222" stroke-width="2"/>
<line x1="404.1" y1="244.8" x2="309.5" y2="80.9" stroke="#222222" stroke-width="2"/>
<line x1="170.0" y1="380.0" x2="309.5" y2="80.9" stroke="#d9480f" stroke-width="3"/>
<path d="M393.7,250.8 L387.7,240.4 L398.1,234.4" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<path d="M216.0,380.0 A46.0,46.0 0 0 0 209.8,357.0" stroke="#222222" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<text x="228.0" y="369.5" text-anchor="middle" fill="#222222" font-weight="bold">a</text>
<path d="M235.8,342.0 A76.0,76.0 0 0 0 202.1,311.1" stroke="#d9480f" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
<text x="230.8" y="318.6" text-anchor="middle" fill="#d9480f" font-weight="bold">b</text>
<path d="M404.1,214.8 A30.0,30.0 0 0 0 389.1,218.9" stroke="#222222" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<text x="392.7" y="207.3" text-anchor="middle" fill="#222222" font-weight="bold">a</text>
<text x="160.0" y="235.5" text-anchor="end" fill="#222222">sin(a + b)</text>
<text x="287.1" y="402.0" text-anchor="middle" fill="#222222">cos a cos b</text>
<text x="414.1" y="317.4" text-anchor="start" fill="#222222">sin a cos b</text>
<text x="414.1" y="167.9" text-anchor="start" fill="#222222">cos a sin b</text>
<text x="239.7" y="70.9" text-anchor="middle" fill="#222222" font-size="13">cos(a + b)</text>
<text x="360.8" y="70.9" text-anchor="middle" fill="#222222" font-size="13">sin a sin b</text>
<text x="229.7" y="230.5" text-anchor="end" fill="#d9480f" font-weight="bold">1</text>
<text x="295.1" y="330.4" text-anchor="start" fill="#222222" font-size="13">cos b</text>
<text x="348.8" y="166.9" text-anchor="end" fill="#222222" font-size="13">sin b</text>
<circle cx="309.5" cy="80.9" r="4" fill="#d9480f"/>
<text x="330.0" y="430.0" text-anchor="middle" fill="#222222">left side = right side:   sin(a + b) = sin a cos b + cos a sin b</text>
<text x="330.0" y="454.0" text-anchor="middle" fill="#222222">top = bottom − piece:   cos(a + b) = cos a cos b − sin a sin b</text>
<text x="330.0" y="482.0" text-anchor="middle" fill="#555555" font-size="13">a = 30°, b = 35°:  sin 65° ≈ 0.906 = 0.410 + 0.497</text>
</svg>
