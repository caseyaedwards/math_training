<line x1="230.0" y1="225.0" x2="385.9" y2="135.0" stroke="#cccccc" stroke-width="1"/>
<text x="403.2" y="130.0" text-anchor="middle" fill="#555555" font-size="12">30°</text>
<line x1="230.0" y1="225.0" x2="320.0" y2="69.1" stroke="#cccccc" stroke-width="1"/>
<text x="330.0" y="56.8" text-anchor="middle" fill="#555555" font-size="12">60°</text>
<line x1="230.0" y1="225.0" x2="230.0" y2="45.0" stroke="#cccccc" stroke-width="1"/>
<text x="230.0" y="30.0" text-anchor="middle" fill="#555555" font-size="12">90°</text>
<line x1="230.0" y1="225.0" x2="140.0" y2="69.1" stroke="#cccccc" stroke-width="1"/>
<text x="130.0" y="56.8" text-anchor="middle" fill="#555555" font-size="12">120°</text>
<line x1="230.0" y1="225.0" x2="74.1" y2="135.0" stroke="#cccccc" stroke-width="1"/>
<text x="56.8" y="130.0" text-anchor="middle" fill="#555555" font-size="12">150°</text>
<line x1="230.0" y1="225.0" x2="50.0" y2="225.0" stroke="#cccccc" stroke-width="1"/>
<text x="30.0" y="230.0" text-anchor="middle" fill="#555555" font-size="12">180°</text>
<line x1="230.0" y1="225.0" x2="74.1" y2="315.0" stroke="#cccccc" stroke-width="1"/>
<text x="56.8" y="330.0" text-anchor="middle" fill="#555555" font-size="12">210°</text>
<line x1="230.0" y1="225.0" x2="140.0" y2="380.9" stroke="#cccccc" stroke-width="1"/>
<text x="130.0" y="403.2" text-anchor="middle" fill="#555555" font-size="12">240°</text>
<line x1="230.0" y1="225.0" x2="230.0" y2="405.0" stroke="#cccccc" stroke-width="1"/>
<text x="230.0" y="430.0" text-anchor="middle" fill="#555555" font-size="12">270°</text>
<line x1="230.0" y1="225.0" x2="320.0" y2="380.9" stroke="#cccccc" stroke-width="1"/>
<text x="330.0" y="403.2" text-anchor="middle" fill="#555555" font-size="12">300°</text>
<line x1="230.0" y1="225.0" x2="385.9" y2="315.0" stroke="#cccccc" stroke-width="1"/>
<text x="403.2" y="330.0" text-anchor="middle" fill="#555555" font-size="12">330°</text>
<line x1="50.0" y1="225.0" x2="410.0" y2="225.0" stroke="#555555" stroke-width="1.3"/>
<line x1="230.0" y1="405.0" x2="230.0" y2="45.0" stroke="#555555" stroke-width="1.3"/>
<text x="271.0" y="241.0" text-anchor="end" fill="#555555" font-size="12">1</text>
<text x="316.0" y="241.0" text-anchor="end" fill="#555555" font-size="12">2</text>
<text x="361.0" y="241.0" text-anchor="end" fill="#555555" font-size="12">3</text>
<text x="406.0" y="241.0" text-anchor="end" fill="#555555" font-size="12">4</text>
<line x1="297.5" y1="108.1" x2="297.5" y2="225.0" stroke="#222222" stroke-width="1.3" stroke-dasharray="5,4"/>
<line x1="297.5" y1="108.1" x2="230.0" y2="108.1" stroke="#222222" stroke-width="1.3" stroke-dasharray="5,4"/>
<line x1="230.0" y1="225.0" x2="297.5" y2="108.1" stroke="#d9480f" stroke-width="3"/>
<path d="M260.0,225.0 A30.0,30.0 0 0 0 245.0,199.0" stroke="#d9480f" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="266.4" y="209.0" text-anchor="start" fill="#d9480f" font-weight="bold">θ</text>
<circle cx="297.5" cy="108.1" r="5.5" fill="#d9480f"/>
<text x="307.5" y="102.1" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">(r, θ) = (3, 60°)</text>
<text x="255.8" y="164.5" text-anchor="end" fill="#d9480f" font-size="13">r = 3</text>
<text x="490.0" y="150.0" text-anchor="start" fill="#222222" font-size="13">x = r cos θ = 3 × 0.5 = 1.5</text>
<text x="490.0" y="178.0" text-anchor="start" fill="#222222" font-size="13">y = r sin θ = 3 × 0.866 ≈ 2.598</text>
<text x="490.0" y="206.0" text-anchor="start" fill="#222222" font-size="13">r = √(x² + y²) = √(2.25 + 6.75)</text>
<text x="490.0" y="226.0" text-anchor="start" fill="#222222" font-size="13">r = √9 = 3</text>
<text x="490.0" y="264.0" text-anchor="start" fill="#555555" font-size="13">Rings: distance r.</text>
<text x="490.0" y="284.0" text-anchor="start" fill="#555555" font-size="13">Rays: angle θ.</text>
</svg>
