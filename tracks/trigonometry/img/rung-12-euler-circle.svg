<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>e to the i theta on the complex plane</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
<line x1="70.0" y1="215.0" x2="470.0" y2="215.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="270.0" y1="405.0" x2="270.0" y2="25.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="476.0" y="220.0" text-anchor="start" fill="#555555" font-style="italic">Re</text>
<text x="280.0" y="33.0" text-anchor="start" fill="#555555" font-style="italic">Im</text>
<circle cx="270.0" cy="215.0" r="150.0" fill="none" stroke="#222222" stroke-width="2"/>
<line x1="366.4" y1="100.1" x2="366.4" y2="215.0" stroke="#222222" stroke-width="1.3" stroke-dasharray="5,4"/>
<line x1="366.4" y1="100.1" x2="270.0" y2="100.1" stroke="#222222" stroke-width="1.3" stroke-dasharray="5,4"/>
<line x1="270.0" y1="215.0" x2="363.4" y2="103.6" stroke="#d9480f" stroke-width="3" marker-end="url(#arrowA)"/>
<line x1="270.0" y1="215.0" x2="366.4" y2="215.0" stroke="#d9480f" stroke-width="4"/>
<line x1="270.0" y1="215.0" x2="270.0" y2="100.1" stroke="#d9480f" stroke-width="4"/>
<path d="M304.0,215.0 A34.0,34.0 0 0 0 291.9,189.0" stroke="#222222" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
<text x="313.5" y="199.7" text-anchor="start" fill="#222222" font-weight="bold">θ</text>
<text x="318.2" y="235.0" text-anchor="middle" fill="#d9480f" font-size="13">cos θ</text>
<text x="262.0" y="162.5" text-anchor="end" fill="#d9480f" font-size="13">i sin θ</text>
<text x="374.4" y="92.1" text-anchor="start" fill="#d9480f" font-weight="bold">e<tspan dy="-7" font-size="11">iθ</tspan><tspan dy="7"></tspan></text>
<circle cx="420.0" cy="215.0" r="4.5" fill="#222222"/>
<text x="426.0" y="207.0" text-anchor="start" fill="#222222" font-size="13">e<tspan dy="-7" font-size="11">i0</tspan><tspan dy="7"> = 1</tspan></text>
<circle cx="270.0" cy="65.0" r="4.5" fill="#222222"/>
<text x="278.0" y="57.0" text-anchor="start" fill="#222222" font-size="13">e<tspan dy="-7" font-size="11">iπ/2</tspan><tspan dy="7"> = i</tspan></text>
<circle cx="120.0" cy="215.0" r="4.5" fill="#222222"/>
<text x="114.0" y="207.0" text-anchor="end" fill="#222222" font-size="13">e<tspan dy="-7" font-size="11">iπ</tspan><tspan dy="7"> = −1</tspan></text>
<circle cx="270.0" cy="365.0" r="4.5" fill="#222222"/>
<text x="278.0" y="385.0" text-anchor="start" fill="#222222" font-size="13">e<tspan dy="-7" font-size="11">i3π/2</tspan><tspan dy="7"> = −i</tspan></text>
<text x="510.0" y="120.0" text-anchor="start" fill="#222222" font-weight="bold">e<tspan dy="-7" font-size="11">iθ</tspan><tspan dy="7"> = cos θ + i sin θ</tspan></text>
<text x="510.0" y="156.0" text-anchor="start" fill="#222222" font-size="13">θ = 50°:</text>
<text x="510.0" y="176.0" text-anchor="start" fill="#222222" font-size="13">0.643 + 0.766 i</text>
<text x="510.0" y="212.0" text-anchor="start" fill="#555555" font-size="13">length always 1</text>
<text x="510.0" y="256.0" text-anchor="start" fill="#d9480f" font-weight="bold">θ = π:  e<tspan dy="-7" font-size="11">iπ</tspan><tspan dy="7"> + 1 = 0</tspan></text>
</svg>
