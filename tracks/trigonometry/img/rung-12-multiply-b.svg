<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Multiplying complex numbers multiplies lengths and adds angles</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
<line x1="60.0" y1="320.0" x2="359.0" y2="320.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="70.0" y1="330.0" x2="70.0" y2="31.0" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="365.0" y="325.0" text-anchor="start" fill="#555555" font-style="italic">Re</text>
<text x="78.0" y="35.0" text-anchor="start" fill="#555555" font-style="italic">Im</text>
<path d="M155.0,320.0 A85.0,85.0 0 0 0 70.0,235.0" stroke="#d6d6d6" stroke-width="1" fill="none" stroke-linejoin="round"/>
<text x="155.0" y="338.0" text-anchor="middle" fill="#555555" font-size="12">1</text>
<path d="M240.0,320.0 A170.0,170.0 0 0 0 70.0,150.0" stroke="#d6d6d6" stroke-width="1" fill="none" stroke-linejoin="round"/>
<text x="240.0" y="338.0" text-anchor="middle" fill="#555555" font-size="12">2</text>
<path d="M325.0,320.0 A255.0,255.0 0 0 0 70.0,65.0" stroke="#d6d6d6" stroke-width="1" fill="none" stroke-linejoin="round"/>
<text x="325.0" y="338.0" text-anchor="middle" fill="#555555" font-size="12">3</text>
<line x1="70.0" y1="320.0" x2="189.8" y2="276.4" stroke="#222222" stroke-width="2" marker-end="url(#arrowD)"/>
<text x="197.8" y="280.4" text-anchor="start" fill="#222222" font-size="13">z<tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = 1.5 at 20°</tspan></text>
<line x1="70.0" y1="320.0" x2="200.2" y2="210.7" stroke="#222222" stroke-width="2" marker-end="url(#arrowD)"/>
<text x="208.2" y="214.7" text-anchor="start" fill="#222222" font-size="13">z<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> = 2 at 40°</tspan></text>
<line x1="70.0" y1="320.0" x2="197.5" y2="99.2" stroke="#d9480f" stroke-width="3" marker-end="url(#arrowA)"/>
<text x="205.5" y="99.2" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">z<tspan dy="4" font-size="10">1</tspan><tspan dy="-4">z</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> = 3 at 60°</tspan></text>
<path d="M110.0,320.0 A40.0,40.0 0 0 0 107.6,306.3" stroke="#222222" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
<path d="M122.6,300.8 A56.0,56.0 0 0 0 98.0,271.5" stroke="#d9480f" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
<text x="360.0" y="220.0" text-anchor="start" fill="#222222" font-weight="bold">lengths multiply:</text>
<text x="360.0" y="242.0" text-anchor="start" fill="#222222">1.5 × 2 = 3</text>
<text x="360.0" y="276.0" text-anchor="start" fill="#222222" font-weight="bold">angles add:</text>
<text x="360.0" y="298.0" text-anchor="start" fill="#222222">20° + 40° = 60°</text>
</svg>
