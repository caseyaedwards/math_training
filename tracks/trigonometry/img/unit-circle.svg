<text x="560.0" y="248.0" text-anchor="start" fill="#222222">90°</text>
<text x="620.0" y="248.0" text-anchor="start" fill="#222222">0</text>
<text x="690.0" y="248.0" text-anchor="start" fill="#222222">1</text>
<line x1="560" y1="122" x2="750" y2="122" stroke="#cccccc"/>
<text x="560.0" y="300.0" text-anchor="start" fill="#555555" font-size="13">Point on circle = (cos θ, sin θ)</text>
<text x="560.0" y="322.0" text-anchor="start" fill="#555555" font-size="13">Radius 1, so cos² θ + sin² θ = 1</text>
<text x="560.0" y="344.0" text-anchor="start" fill="#555555" font-size="13">Other quadrants: same numbers,</text>
<text x="560.0" y="366.0" text-anchor="start" fill="#555555" font-size="13">signs change by quadrant.</text>
