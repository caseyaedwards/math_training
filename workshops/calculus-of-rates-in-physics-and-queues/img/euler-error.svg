<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif" font-size="14">
<title>Euler error at t = 4 s is a straight line in dt</title>
<rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
<line x1="90" y1="330.0" x2="670" y2="330.0" stroke="#e6e6e6"/>
<text x="82" y="335.0" text-anchor="end" font-size="12" fill="#222222">0</text>
<line x1="90" y1="260.0" x2="670" y2="260.0" stroke="#e6e6e6"/>
<text x="82" y="265.0" text-anchor="end" font-size="12" fill="#222222">5</text>
<line x1="90" y1="190.0" x2="670" y2="190.0" stroke="#e6e6e6"/>
<text x="82" y="195.0" text-anchor="end" font-size="12" fill="#222222">10</text>
<line x1="90" y1="120.0" x2="670" y2="120.0" stroke="#e6e6e6"/>
<text x="82" y="125.0" text-anchor="end" font-size="12" fill="#222222">15</text>
<line x1="90" y1="50.0" x2="670" y2="50.0" stroke="#e6e6e6"/>
<text x="82" y="55.0" text-anchor="end" font-size="12" fill="#222222">20</text>
<line x1="90.0" y1="330" x2="90.0" y2="335" stroke="#222222"/>
<text x="90.0" y="350" text-anchor="middle" font-size="12" fill="#222222">0</text>
<line x1="206.0" y1="330" x2="206.0" y2="335" stroke="#222222"/>
<text x="206.0" y="350" text-anchor="middle" font-size="12" fill="#222222">0.2</text>
<line x1="322.0" y1="330" x2="322.0" y2="335" stroke="#222222"/>
<text x="322.0" y="350" text-anchor="middle" font-size="12" fill="#222222">0.4</text>
<line x1="438.0" y1="330" x2="438.0" y2="335" stroke="#222222"/>
<text x="438.0" y="350" text-anchor="middle" font-size="12" fill="#222222">0.6</text>
<line x1="554.0" y1="330" x2="554.0" y2="335" stroke="#222222"/>
<text x="554.0" y="350" text-anchor="middle" font-size="12" fill="#222222">0.8</text>
<line x1="670.0" y1="330" x2="670.0" y2="335" stroke="#222222"/>
<text x="670.0" y="350" text-anchor="middle" font-size="12" fill="#222222">1</text>
<line x1="90" y1="330" x2="670" y2="330" stroke="#222222" stroke-width="1.5"/>
<line x1="90" y1="50" x2="90" y2="330" stroke="#222222" stroke-width="1.5"/>
<text x="380.0" y="370" text-anchor="middle" fill="#222222">step size dt (s)</text>
<text x="40" y="190.0" text-anchor="middle" fill="#222222" transform="rotate(-90 40 190.0)">height error (m)</text>
<polyline points="90.0,330.0 670.0,55.6" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5,4"/>
<circle cx="670.0" cy="55.6" r="5" fill="#d9480f"/>
<circle cx="380.0" cy="192.8" r="5" fill="#d9480f"/>
<circle cx="148.0" cy="302.6" r="5" fill="#d9480f"/>
<circle cx="95.8" cy="327.3" r="5" fill="#d9480f"/>
<circle cx="90.6" cy="329.7" r="5" fill="#d9480f"/>
<text x="660.0" y="49.6" font-size="12" fill="#d9480f" text-anchor="end">dt = 1: 19.6 m</text>
<text x="370.0" y="182.8" font-size="12" fill="#d9480f" text-anchor="end">dt = 0.5: 9.8 m</text>
<text x="158.0" y="286.6" font-size="12" fill="#d9480f" text-anchor="start">dt = 0.1: 1.96 m</text>
<text x="101.6" y="92.0" font-size="14" fill="#222222" text-anchor="start">error = 19.6 × dt</text>
<text x="101.6" y="115.8" font-size="12" fill="#555555" text-anchor="start">half the step, half the error</text>
<text x="380.0" y="28.0" font-size="14" fill="#222222" text-anchor="middle">First-order method: error shrinks in proportion to the step</text>
</svg>
