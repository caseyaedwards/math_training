<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif" font-size="14">
<title>Little's law: the same area counted two ways</title>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<text x="380.0" y="28.0" font-size="14" fill="#222222" text-anchor="middle">Top: one bar per request. Bottom: how many are inside at each moment.</text>
<rect x="120.0" y="60" width="120.0" height="18" fill="#fde4d6" stroke="#d9480f"/>
<text x="246.0" y="74.0" font-size="12" fill="#555555" text-anchor="start">W = 2 s</text>
<text x="82.0" y="74.0" font-size="12" fill="#222222" text-anchor="end">req 1</text>
<rect x="180.0" y="86" width="90.0" height="18" fill="#fde4d6" stroke="#d9480f"/>
<text x="276.0" y="100.0" font-size="12" fill="#555555" text-anchor="start">W = 1.5 s</text>
<text x="82.0" y="100.0" font-size="12" fill="#222222" text-anchor="end">req 2</text>
<rect x="210.0" y="112" width="180.0" height="18" fill="#fde4d6" stroke="#d9480f"/>
<text x="396.0" y="126.0" font-size="12" fill="#555555" text-anchor="start">W = 3 s</text>
<text x="82.0" y="126.0" font-size="12" fill="#222222" text-anchor="end">req 3</text>
<rect x="330.0" y="138" width="60.0" height="18" fill="#fde4d6" stroke="#d9480f"/>
<text x="396.0" y="152.0" font-size="12" fill="#555555" text-anchor="start">W = 1 s</text>
<text x="82.0" y="152.0" font-size="12" fill="#222222" text-anchor="end">req 4</text>
<rect x="450.0" y="164" width="150.0" height="18" fill="#fde4d6" stroke="#d9480f"/>
<text x="606.0" y="178.0" font-size="12" fill="#555555" text-anchor="start">W = 2.5 s</text>
<text x="82.0" y="178.0" font-size="12" fill="#222222" text-anchor="end">req 5</text>
<rect x="540.0" y="190" width="60.0" height="18" fill="#fde4d6" stroke="#d9480f"/>
<text x="606.0" y="204.0" font-size="12" fill="#555555" text-anchor="start">W = 1 s</text>
<text x="82.0" y="204.0" font-size="12" fill="#222222" text-anchor="end">req 6</text>
<line x1="90" y1="380.0" x2="690" y2="380.0" stroke="#e6e6e6"/>
<text x="82" y="385.0" text-anchor="end" font-size="12" fill="#222222">0</text>
<line x1="90" y1="340.0" x2="690" y2="340.0" stroke="#e6e6e6"/>
<text x="82" y="345.0" text-anchor="end" font-size="12" fill="#222222">1</text>
<line x1="90" y1="300.0" x2="690" y2="300.0" stroke="#e6e6e6"/>
<text x="82" y="305.0" text-anchor="end" font-size="12" fill="#222222">2</text>
<line x1="90" y1="260.0" x2="690" y2="260.0" stroke="#e6e6e6"/>
<text x="82" y="265.0" text-anchor="end" font-size="12" fill="#222222">3</text>
<line x1="90.0" y1="380" x2="90.0" y2="385" stroke="#222222"/>
<text x="90.0" y="400" text-anchor="middle" font-size="12" fill="#222222">0</text>
<line x1="150.0" y1="380" x2="150.0" y2="385" stroke="#222222"/>
<text x="150.0" y="400" text-anchor="middle" font-size="12" fill="#222222">1</text>
<line x1="210.0" y1="380" x2="210.0" y2="385" stroke="#222222"/>
<text x="210.0" y="400" text-anchor="middle" font-size="12" fill="#222222">2</text>
<line x1="270.0" y1="380" x2="270.0" y2="385" stroke="#222222"/>
<text x="270.0" y="400" text-anchor="middle" font-size="12" fill="#222222">3</text>
<line x1="330.0" y1="380" x2="330.0" y2="385" stroke="#222222"/>
<text x="330.0" y="400" text-anchor="middle" font-size="12" fill="#222222">4</text>
<line x1="390.0" y1="380" x2="390.0" y2="385" stroke="#222222"/>
<text x="390.0" y="400" text-anchor="middle" font-size="12" fill="#222222">5</text>
<line x1="450.0" y1="380" x2="450.0" y2="385" stroke="#222222"/>
<text x="450.0" y="400" text-anchor="middle" font-size="12" fill="#222222">6</text>
<line x1="510.0" y1="380" x2="510.0" y2="385" stroke="#222222"/>
<text x="510.0" y="400" text-anchor="middle" font-size="12" fill="#222222">7</text>
<line x1="570.0" y1="380" x2="570.0" y2="385" stroke="#222222"/>
<text x="570.0" y="400" text-anchor="middle" font-size="12" fill="#222222">8</text>
<line x1="630.0" y1="380" x2="630.0" y2="385" stroke="#222222"/>
<text x="630.0" y="400" text-anchor="middle" font-size="12" fill="#222222">9</text>
<line x1="690.0" y1="380" x2="690.0" y2="385" stroke="#222222"/>
<text x="690.0" y="400" text-anchor="middle" font-size="12" fill="#222222">10</text>
<line x1="90" y1="380" x2="690" y2="380" stroke="#222222" stroke-width="1.5"/>
<line x1="90" y1="260" x2="90" y2="380" stroke="#222222" stroke-width="1.5"/>
<text x="390.0" y="420" text-anchor="middle" fill="#222222">time (s)</text>
<text x="40" y="320.0" text-anchor="middle" fill="#222222" transform="rotate(-90 40 320.0)">N(t)</text>
<polygon points="90.0,380.0 90.0,380.0 120.0,380.0 120.0,340.0 180.0,340.0 180.0,300.0 210.0,300.0 210.0,260.0 240.0,260.0 240.0,300.0 270.0,300.0 270.0,340.0 330.0,340.0 330.0,300.0 390.0,300.0 390.0,340.0 390.0,340.0 390.0,380.0 450.0,380.0 450.0,340.0 540.0,340.0 540.0,300.0 600.0,300.0 600.0,340.0 600.0,340.0 600.0,380.0 690.0,380.0 690.0,380.0" fill="#fde4d6" stroke="#d9480f" stroke-width="2"/>
<text x="380.0" y="455.0" font-size="12" fill="#222222" text-anchor="middle">Bar lengths add to 11 request-seconds. Area under N(t) is also 11. L = 11 / 10 = 1.1, λ = 6 / 10, W = 11 / 6, and λW = L.</text>
</svg>
