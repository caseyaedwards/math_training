<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="sans-serif" font-size="14">
<title>An M/M/1 queue: random arrivals, one line, one server</title>
<rect x="0" y="0" width="760" height="260" fill="#ffffff"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<text x="380.0" y="28.0" font-size="14" fill="#222222" text-anchor="middle">Requests arrive at rate λ, wait in line, get served at rate μ, and leave</text>
<line x1="40" y1="130" x2="200" y2="130" stroke="#222222" stroke-width="2" marker-end="url(#a1)"/>
<text x="120.0" y="115.0" font-size="14" fill="#222222" text-anchor="middle">arrivals λ</text>
<text x="120.0" y="155.0" font-size="12" fill="#555555" text-anchor="middle">random gaps</text>
<path d="M210,100 L450,100 L450,160 L210,160" fill="none" stroke="#222222" stroke-width="2"/>
<rect x="390" y="110" width="36" height="40" fill="#fde4d6" stroke="#d9480f"/>
<rect x="345" y="110" width="36" height="40" fill="#fde4d6" stroke="#d9480f"/>
<rect x="300" y="110" width="36" height="40" fill="#fde4d6" stroke="#d9480f"/>
<rect x="255" y="110" width="36" height="40" fill="#fde4d6" stroke="#d9480f"/>
<rect x="210" y="110" width="36" height="40" fill="#fde4d6" stroke="#d9480f"/>
<text x="330.0" y="185.0" font-size="12" fill="#555555" text-anchor="middle">waiting line (Wq)</text>
<circle cx="520" cy="130" r="45" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<rect x="502" y="110" width="36" height="40" fill="#d9480f"/>
<text x="520.0" y="195.0" font-size="14" fill="#222222" text-anchor="middle">server μ</text>
<line x1="570" y1="130" x2="720" y2="130" stroke="#222222" stroke-width="2" marker-end="url(#a1)"/>
<text x="645.0" y="115.0" font-size="14" fill="#222222" text-anchor="middle">departures</text>
<path d="M210,215 L565,215" stroke="#d9480f" stroke-width="2" fill="none"/>
<line x1="210" y1="208" x2="210" y2="222" stroke="#d9480f" stroke-width="2"/><line x1="565" y1="208" x2="565" y2="222" stroke="#d9480f" stroke-width="2"/>
<text x="388.0" y="240.0" font-size="13" fill="#d9480f" text-anchor="middle">time in system W = wait + service</text>
</svg>
