<text x="400.0" y="320.0" text-anchor="middle" fill="#d9480f" font-size="12">20 left rectangles (dt = 15 s) = 23,550</text>
<text x="503.3" y="80.0" text-anchor="middle" fill="#222222" font-size="12">r(t) = 50 + 0.2t</text>
<text x="380" y="28" text-anchor="middle" fill="#222222">Sum of rate × dt gives back the counter change</text>
