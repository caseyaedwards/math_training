<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="14">
<title>Telescoping: stacking every rise gives the total change</title>
<rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
<line x1="90" y1="350.0" x2="570" y2="350.0" stroke="#e6e6e6"/>
<text x="82" y="355.0" text-anchor="end" font-size="12" fill="#222222">0</text>
<line x1="90" y1="290.0" x2="570" y2="290.0" stroke="#e6e6e6"/>
<text x="82" y="295.0" text-anchor="end" font-size="12" fill="#222222">5,000</text>
<line x1="90" y1="230.0" x2="570" y2="230.0" stroke="#e6e6e6"/>
<text x="82" y="235.0" text-anchor="end" font-size="12" fill="#222222">10,000</text>
<line x1="90" y1="170.0" x2="570" y2="170.0" stroke="#e6e6e6"/>
<text x="82" y="175.0" text-anchor="end" font-size="12" fill="#222222">15,000</text>
<line x1="90" y1="110.0" x2="570" y2="110.0" stroke="#e6e6e6"/>
<text x="82" y="115.0" text-anchor="end" font-size="12" fill="#222222">20,000</text>
<line x1="90" y1="50.0" x2="570" y2="50.0" stroke="#e6e6e6"/>
<text x="82" y="55.0" text-anchor="end" font-size="12" fill="#222222">25,000</text>
<line x1="90.0" y1="350" x2="90.0" y2="355" stroke="#222222"/>
<text x="90.0" y="370" text-anchor="middle" font-size="12" fill="#222222">0</text>
<line x1="186.0" y1="350" x2="186.0" y2="355" stroke="#222222"/>
<text x="186.0" y="370" text-anchor="middle" font-size="12" fill="#222222">60</text>
<line x1="282.0" y1="350" x2="282.0" y2="355" stroke="#222222"/>
<text x="282.0" y="370" text-anchor="middle" font-size="12" fill="#222222">120</text>
<line x1="378.0" y1="350" x2="378.0" y2="355" stroke="#222222"/>
<text x="378.0" y="370" text-anchor="middle" font-size="12" fill="#222222">180</text>
<line x1="474.0" y1="350" x2="474.0" y2="355" stroke="#222222"/>
<text x="474.0" y="370" text-anchor="middle" font-size="12" fill="#222222">240</text>
<line x1="570.0" y1="350" x2="570.0" y2="355" stroke="#222222"/>
<text x="570.0" y="370" text-anchor="middle" font-size="12" fill="#222222">300</text>
<line x1="90" y1="350" x2="570" y2="350" stroke="#222222" stroke-width="1.5"/>
<line x1="90" y1="50" x2="90" y2="350" stroke="#222222" stroke-width="1.5"/>
<text x="330.0" y="390" text-anchor="middle" fill="#222222">time t (s)</text>
<text x="40" y="200.0" text-anchor="middle" fill="#222222" transform="rotate(-90 40 200.0)">counter c(t)</text>
<line x1="90.0" y1="350.0" x2="186.0" y2="350.0" stroke="#222222" stroke-width="2"/>
<rect x="180.0" y="309.7" width="12" height="40.3" fill="#d9480f" stroke="#d9480f"/>
<text x="176.0" y="333.8" font-size="12" fill="#222222" text-anchor="end">3,360</text>
<rect x="620" y="309.7" width="40" height="40.3" fill="#d9480f" stroke="#d9480f"/>
<line x1="186.0" y1="309.7" x2="282.0" y2="309.7" stroke="#222222" stroke-width="2"/>
<rect x="276.0" y="260.7" width="12" height="49.0" fill="#fde4d6" stroke="#d9480f"/>
<text x="272.0" y="289.2" font-size="12" fill="#222222" text-anchor="end">4,080</text>
<rect x="620" y="260.7" width="40" height="49.0" fill="#fde4d6" stroke="#d9480f"/>
<line x1="282.0" y1="260.7" x2="378.0" y2="260.7" stroke="#222222" stroke-width="2"/>
<rect x="372.0" y="203.1" width="12" height="57.6" fill="#d9480f" stroke="#d9480f"/>
<text x="368.0" y="235.9" font-size="12" fill="#222222" text-anchor="end">4,800</text>
<rect x="620" y="203.1" width="40" height="57.6" fill="#d9480f" stroke="#d9480f"/>
<line x1="378.0" y1="203.1" x2="474.0" y2="203.1" stroke="#222222" stroke-width="2"/>
<rect x="468.0" y="136.9" width="12" height="66.2" fill="#fde4d6" stroke="#d9480f"/>
<text x="464.0" y="174.0" font-size="12" fill="#222222" text-anchor="end">5,520</text>
<rect x="620" y="136.9" width="40" height="66.2" fill="#fde4d6" stroke="#d9480f"/>
<line x1="474.0" y1="136.9" x2="570.0" y2="136.9" stroke="#222222" stroke-width="2"/>
<rect x="564.0" y="62.0" width="12" height="74.9" fill="#d9480f" stroke="#d9480f"/>
<text x="560.0" y="103.4" font-size="12" fill="#222222" text-anchor="end">6,240</text>
<rect x="620" y="62.0" width="40" height="74.9" fill="#d9480f" stroke="#d9480f"/>
<circle cx="90.0" cy="350.0" r="4" fill="#222222"/>
<circle cx="186.0" cy="309.7" r="4" fill="#222222"/>
<circle cx="282.0" cy="260.7" r="4" fill="#222222"/>
<circle cx="378.0" cy="203.1" r="4" fill="#222222"/>
<circle cx="474.0" cy="136.9" r="4" fill="#222222"/>
<circle cx="570.0" cy="62.0" r="4" fill="#222222"/>
<text x="640.0" y="54.0" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="bold">24,000</text>
<text x="640.0" y="370.0" font-size="12" fill="#222222" text-anchor="middle">stacked</text>
<text x="640.0" y="386.0" font-size="12" fill="#222222" text-anchor="middle">rises</text>
<text x="380.0" y="28.0" font-size="14" fill="#222222" text-anchor="middle">3,360 + 4,080 + 4,800 + 5,520 + 6,240 = 24,000 = c(300) − c(0)</text>
</svg>
