<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" role="img" aria-label="SIR model as three boxes: susceptible to infected to recovered">
<title>SIR model as three boxes: susceptible to infected to recovered</title>
<rect x="0" y="0" width="680" height="200" fill="#ffffff"/>
<text x="340.0" y="26.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">SIR: people move one way, S to I to R</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="60" y="60" width="120" height="80" rx="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="120.0" y="98.0" font-family="sans-serif" font-size="22" fill="#222222" text-anchor="middle" font-weight="bold">S</text>
<text x="120.0" y="124.0" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">susceptible</text>
<rect x="280" y="60" width="120" height="80" rx="8" fill="#fde3d6" stroke="#222222" stroke-width="2"/>
<text x="340.0" y="98.0" font-family="sans-serif" font-size="22" fill="#222222" text-anchor="middle" font-weight="bold">I</text>
<text x="340.0" y="124.0" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">infected</text>
<rect x="500" y="60" width="120" height="80" rx="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="560.0" y="98.0" font-family="sans-serif" font-size="22" fill="#222222" text-anchor="middle" font-weight="bold">R</text>
<text x="560.0" y="124.0" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">recovered</text>
<line x1="184" y1="100" x2="274" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="230.0" y="88.0" font-family="sans-serif" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">beta S I / N</text>
<text x="230.0" y="168.0" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal">new infections per day</text>
<line x1="404" y1="100" x2="494" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#ah)"/>
<text x="450.0" y="88.0" font-family="sans-serif" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal">gamma I</text>
<text x="450.0" y="168.0" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal">recoveries per day</text>
</svg>
