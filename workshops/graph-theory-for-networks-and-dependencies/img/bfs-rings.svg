<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="sans-serif" font-size="14">
<title>BFS from us-east visits regions in rings of equal hop count</title>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
<circle cx="350" cy="235" r="110" fill="none" stroke="#9a9a9a" stroke-dasharray="6,5"/>
<text x="433.2" y="155.8" font-size="13" fill="#555555" text-anchor="start">1 hop</text>
<circle cx="350" cy="235" r="200" fill="none" stroke="#9a9a9a" stroke-dasharray="6,5"/>
<text x="498.0" y="91.0" font-size="13" fill="#555555" text-anchor="start">2 hops</text>
<line x1="350.0" y1="235.0" x2="254.7" y2="180.0" stroke="#d9480f" stroke-width="2.4"/>
<line x1="350.0" y1="235.0" x2="350.0" y2="125.0" stroke="#d9480f" stroke-width="2.4"/>
<line x1="350.0" y1="235.0" x2="445.3" y2="180.0" stroke="#d9480f" stroke-width="2.4"/>
<line x1="350.0" y1="235.0" x2="445.3" y2="290.0" stroke="#d9480f" stroke-width="2.4"/>
<line x1="350.0" y1="235.0" x2="350.0" y2="345.0" stroke="#d9480f" stroke-width="2.4"/>
<line x1="254.7" y1="180.0" x2="176.8" y2="335.0" stroke="#d9480f" stroke-width="2.4"/>
<line x1="350.0" y1="345.0" x2="176.8" y2="335.0" stroke="#dddddd" stroke-width="1.2"/>
<line x1="445.3" y1="180.0" x2="445.3" y2="290.0" stroke="#dddddd" stroke-width="1.2"/>
<line x1="445.3" y1="180.0" x2="350.0" y2="345.0" stroke="#dddddd" stroke-width="1.2"/>
<line x1="445.3" y1="290.0" x2="350.0" y2="345.0" stroke="#dddddd" stroke-width="1.2"/>
<line x1="254.7" y1="180.0" x2="350.0" y2="125.0" stroke="#dddddd" stroke-width="1.2"/>
<rect x="298.0" y="220.0" width="104" height="30" rx="6" fill="#fde4d6" stroke="#d9480f" stroke-width="1.6"/><text x="350" y="240" text-anchor="middle" fill="#222222">us-east</text>
<rect x="202.7" y="165.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="254.73720558371173" y="185.0" text-anchor="middle" fill="#222222">us-west</text>
<rect x="298.0" y="110.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="350.0" y="130.0" text-anchor="middle" fill="#222222">sa-east</text>
<rect x="393.3" y="165.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="445.2627944162883" y="185.0" text-anchor="middle" fill="#222222">eu-west</text>
<rect x="393.3" y="275.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="445.2627944162883" y="295.0" text-anchor="middle" fill="#222222">eu-central</text>
<rect x="298.0" y="330.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="350.0" y="350.0" text-anchor="middle" fill="#222222">ap-south</text>
<rect x="124.8" y="320.0" width="104" height="30" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="176.79491924311225" y="340.0" text-anchor="middle" fill="#222222">ap-northeast</text>
<text x="350.0" y="25.0" font-size="13" fill="#222222" text-anchor="middle">Orange edges: the BFS tree. Each ring is one more hop. Latency is ignored.</text>
</svg>
