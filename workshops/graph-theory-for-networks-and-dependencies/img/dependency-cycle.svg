<rect x="665.0" y="322.0" width="90" height="36" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.6"/><text x="710" y="345" text-anchor="middle" fill="#777777">config</text>
<text x="278" y="205" fill="#d9480f" text-anchor="end">bad edge:</text>
<text x="278" y="222" fill="#d9480f" text-anchor="end">db needs web</text>
<text x="440" y="265" fill="#d9480f" text-anchor="middle" font-weight="bold">cycle</text>
<text x="710" y="105" fill="#777777" text-anchor="middle" font-size="12">Kahn starts</text>
<text x="710" y="120" fill="#777777" text-anchor="middle" font-size="12">only these 3</text>
<text x="20" y="25" fill="#222222">api, auth, db, web wait on each other forever. lb and worker wait on them.</text>
