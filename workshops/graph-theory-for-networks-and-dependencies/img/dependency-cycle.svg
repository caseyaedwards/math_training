<line x1="555.0" y1="138.0" x2="665.0" y2="182.0" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="488.0" y1="138.0" x2="312.0" y2="282.0" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="555.0" y1="309.0" x2="665.0" y2="331.0" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="135.0" y1="300.0" x2="245.0" y2="300.0" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#ag)"/>
<path d="M90,318 Q420,470 680,218" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#ag)"/>
