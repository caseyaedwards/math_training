<rect x="45.0" y="102.0" width="90" height="36" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="90" y="125" text-anchor="middle" fill="#222222">lb</text>
<rect x="245.0" y="102.0" width="90" height="36" rx="6" fill="#fde4d6" stroke="#d9480f" stroke-width="2.2"/><text x="290" y="125" text-anchor="middle" fill="#222222">web</text>
<rect x="465.0" y="102.0" width="90" height="36" rx="6" fill="#fde4d6" stroke="#d9480f" stroke-width="2.2"/><text x="510" y="125" text-anchor="middle" fill="#222222">api</text>
<rect x="465.0" y="282.0" width="90" height="36" rx="6" fill="#fde4d6" stroke="#d9480f" stroke-width="2.2"/><text x="510" y="305" text-anchor="middle" fill="#222222">auth</text>
<rect x="245.0" y="282.0" width="90" height="36" rx="6" fill="#fde4d6" stroke="#d9480f" stroke-width="2.2"/><text x="290" y="305" text-anchor="middle" fill="#222222">db</text>
<rect x="45.0" y="282.0" width="90" height="36" rx="6" fill="#ffffff" stroke="#222222" stroke-width="1.6"/><text x="90" y="305" text-anchor="middle" fill="#222222">worker</text>
<rect x="665.0" y="42.0" width="90" height="36" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.6"/><text x="710" y="65" text-anchor="middle" fill="#777777">cache</text>
