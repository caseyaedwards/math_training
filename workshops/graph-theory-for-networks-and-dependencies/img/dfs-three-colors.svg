<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif" font-size="14">
<title>Three-color DFS at the moment it finds the back edge</title>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>
<rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
<line x1="160.0" y1="90.0" x2="300.0" y2="90.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="230.0" cy="78.0" r="10" fill="#ffffff" stroke="#222222"/>
<text x="230.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle">1</text>
<line x1="360.0" y1="90.0" x2="500.0" y2="90.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="430.0" cy="78.0" r="10" fill="#ffffff" stroke="#222222"/>
<text x="430.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle">2</text>
<line x1="330.0" y1="120.0" x2="330.0" y2="200.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="330.0" cy="148.0" r="10" fill="#ffffff" stroke="#222222"/>
<text x="330.0" y="152.0" font-size="12" fill="#222222" text-anchor="middle">3</text>
<line x1="300.0" y1="230.0" x2="160.0" y2="230.0" stroke="#222222" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="230.0" cy="218.0" r="10" fill="#ffffff" stroke="#222222"/>
<text x="230.0" y="222.0" font-size="12" fill="#222222" text-anchor="middle">4</text>
<line x1="130.0" y1="200.0" x2="130.0" y2="120.0" stroke="#d9480f" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#aa)"/>
<text x="90.0" y="165.0" font-size="13" fill="#d9480f" text-anchor="end" font-weight="bold">back edge</text>
<text x="90.0" y="182.0" font-size="13" fill="#d9480f" text-anchor="end">web to api</text>
<circle cx="130" cy="90" r="30" fill="#c8c8c8" stroke="#222222" stroke-width="1.8"/><text x="130.0" y="95.0" font-size="14" fill="#222222" text-anchor="middle">api</text>
<circle cx="330" cy="90" r="30" fill="#c8c8c8" stroke="#222222" stroke-width="1.8"/><text x="330.0" y="95.0" font-size="14" fill="#222222" text-anchor="middle">auth</text>
<circle cx="530" cy="90" r="30" fill="#222222" stroke="#222222" stroke-width="1.8"/><text x="530.0" y="95.0" font-size="14" fill="#ffffff" text-anchor="middle">config</text>
<circle cx="330" cy="230" r="30" fill="#c8c8c8" stroke="#222222" stroke-width="1.8"/><text x="330.0" y="235.0" font-size="14" fill="#222222" text-anchor="middle">db</text>
<circle cx="130" cy="230" r="30" fill="#c8c8c8" stroke="#222222" stroke-width="1.8"/><text x="130.0" y="235.0" font-size="14" fill="#222222" text-anchor="middle">web</text>
<circle cx="600" cy="190" r="12" fill="#ffffff" stroke="#222222" stroke-width="1.8"/><text x="600.0" y="195.0" font-size="14" fill="#222222" text-anchor="middle"></text>
<text x="620.0" y="195.0" font-size="13" fill="#222222" text-anchor="start">WHITE: not seen yet</text>
<circle cx="600" cy="225" r="12" fill="#c8c8c8" stroke="#222222" stroke-width="1.8"/><text x="600.0" y="230.0" font-size="14" fill="#222222" text-anchor="middle"></text>
<text x="620.0" y="230.0" font-size="13" fill="#222222" text-anchor="start">GRAY: on my path now</text>
<circle cx="600" cy="260" r="12" fill="#222222" stroke="#222222" stroke-width="1.8"/><text x="600.0" y="265.0" font-size="14" fill="#222222" text-anchor="middle"></text>
<text x="620.0" y="265.0" font-size="13" fill="#222222" text-anchor="start">BLACK: finished</text>
<text x="380.0" y="315.0" font-size="13" fill="#222222" text-anchor="middle">Numbers show the order DFS walked. An arrow into a GRAY vertex closes a loop: that is the cycle.</text>
</svg>
