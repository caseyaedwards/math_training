<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <title>King, queen, man, woman on the royalty and gender axes, with king minus man plus woman landing near queen</title>
  <defs>
    <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
  </defs>
  <rect width="520" height="420" fill="#ffffff"/>
  <line x1="34.0" y1="315.0" x2="448.0" y2="315.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="34.0" y1="200.0" x2="448.0" y2="200.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="34.0" y1="85.0" x2="448.0" y2="85.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="195.0" y1="361.0" x2="195.0" y2="39.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="310.0" y1="361.0" x2="310.0" y2="39.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="425.0" y1="361.0" x2="425.0" y2="39.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="34.0" y1="200.0" x2="448.0" y2="200.0" stroke="#868e96" stroke-width="1.5"/>
  <line x1="80.0" y1="361.0" x2="80.0" y2="39.0" stroke="#868e96" stroke-width="1.5"/>
  <line x1="80.0" y1="200.0" x2="298.5" y2="85.0" stroke="#212529" stroke-width="2" marker-end="url(#hk)"/>
  <text x="306.5" y="90.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">king</text>
  <line x1="80.0" y1="200.0" x2="298.5" y2="315.0" stroke="#212529" stroke-width="2" marker-end="url(#hk)"/>
  <text x="306.5" y="320.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">queen</text>
  <line x1="80.0" y1="200.0" x2="103.0" y2="62.0" stroke="#212529" stroke-width="2" marker-end="url(#hk)"/>
  <text x="111.0" y="67.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">man</text>
  <line x1="80.0" y1="200.0" x2="103.0" y2="338.0" stroke="#212529" stroke-width="2" marker-end="url(#hk)"/>
  <text x="111.0" y="343.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">woman</text>
  <line x1="80.0" y1="200.0" x2="298.5" y2="361.0" stroke="#d9480f" stroke-width="3" marker-end="url(#ha)" stroke-dasharray="6 4"/>
  <text x="286.5" y="379.0" font-family="sans-serif" font-size="14" text-anchor="end" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">king − man + woman = (0.95, −0.7)</text>
  <text x="425.0" y="220.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">royalty →</text>
  <text x="86.0" y="53.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">gender: + male</text>
  <text x="86.0" y="357.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">− female</text>
  <text x="260.0" y="410.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">Two of the four dimensions. The dashed arrow points almost exactly along queen.</text>
</svg>
