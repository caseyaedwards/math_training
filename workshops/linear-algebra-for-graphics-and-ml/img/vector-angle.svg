<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <title>Angle between a = (3, 1) and b = (1, 2) is 45 degrees</title>
  <defs>
    <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
  </defs>
  <rect width="460" height="320" fill="#ffffff"/>
  <line x1="60.0" y1="280.0" x2="60.0" y2="32.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="140.0" y1="280.0" x2="140.0" y2="32.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="220.0" y1="280.0" x2="220.0" y2="32.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="300.0" y1="280.0" x2="300.0" y2="32.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="380.0" y1="280.0" x2="380.0" y2="32.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="60.0" y1="280.0" x2="428.0" y2="280.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="60.0" y1="200.0" x2="428.0" y2="200.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="60.0" y1="120.0" x2="428.0" y2="120.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="60.0" y1="40.0" x2="428.0" y2="40.0" stroke="#ced4da" stroke-width="1"/>
  <line x1="60.0" y1="280.0" x2="428.0" y2="280.0" stroke="#868e96" stroke-width="1.5"/>
  <line x1="60.0" y1="280.0" x2="60.0" y2="32.0" stroke="#868e96" stroke-width="1.5"/>
  <text x="140.0" y="298.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">1</text>
  <text x="220.0" y="298.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">2</text>
  <text x="300.0" y="298.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">3</text>
  <text x="380.0" y="298.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">4</text>
  <text x="52.0" y="205.0" font-family="sans-serif" font-size="14" text-anchor="end" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">1</text>
  <text x="52.0" y="125.0" font-family="sans-serif" font-size="14" text-anchor="end" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">2</text>
  <text x="52.0" y="45.0" font-family="sans-serif" font-size="14" text-anchor="end" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">3</text>
  <line x1="60.0" y1="280.0" x2="300.0" y2="200.0" stroke="#d9480f" stroke-width="3" marker-end="url(#ha)"/>
  <line x1="60.0" y1="280.0" x2="140.0" y2="120.0" stroke="#212529" stroke-width="3" marker-end="url(#hk)"/>
  <text x="310.0" y="205.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">a = (3, 1)</text>
  <text x="150.0" y="120.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">b = (1, 2)</text>
  <path d="M128.3,257.2 A72.0,72.0 0 0 0 92.2,215.6" fill="none" stroke="#d9480f" stroke-width="2"/>
  <text x="129.5" y="224.7" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">θ</text>
  <text x="250.0" y="40.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">a · b = 3·1 + 1·2 = 5</text>
  <text x="250.0" y="62.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">|a| = √10,  |b| = √5</text>
  <text x="250.0" y="84.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">cos θ = 5 / √50 = 0.7071</text>
  <text x="250.0" y="106.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">θ = 45°</text>
</svg>
