<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350">
  <title>From latitude and longitude to x, y, z on the unit sphere</title>
  <rect width="660" height="350" fill="#ffffff"/>
  <text x="170.0" y="28.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">Side view: slice through the pole</text>
  <path d="M270,270 A200,200 0 0 0 70,70" fill="none" stroke="#ced4da" stroke-width="2"/>
  <line x1="70.0" y1="270.0" x2="290.0" y2="270.0" stroke="#868e96" stroke-width="1.5"/>
  <line x1="70.0" y1="270.0" x2="70.0" y2="50.0" stroke="#868e96" stroke-width="1.5"/>
  <line x1="70.0" y1="270.0" x2="223.2" y2="141.4" stroke="#212529" stroke-width="2.5"/>
  <line x1="223.2" y1="141.4" x2="223.2" y2="270.0" stroke="#d9480f" stroke-width="2.5"/>
  <line x1="70.0" y1="271.0" x2="223.2" y2="271.0" stroke="#d9480f" stroke-width="2.5"/>
  <rect x="213.2" y="260" width="10" height="10" fill="none" stroke="#212529"/>
  <circle cx="223.2" cy="141.4" r="5" fill="#d9480f"/>
  <path d="M120,270 A50,50 0 0 0 108.3,237.9" fill="none" stroke="#d9480f" stroke-width="2"/>
  <text x="134.0" y="258.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">φ</text>
  <text x="134.6" y="197.7" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">1</text>
  <text x="231.2" y="205.7" font-family="sans-serif" font-size="14" text-anchor="start" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">z = sin φ</text>
  <text x="146.6" y="292.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">r = cos φ</text>
  <text x="231.2" y="133.4" font-family="sans-serif" font-size="14" text-anchor="start" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">P</text>
  <text x="292.0" y="275.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">equator plane</text>
  <text x="78.0" y="62.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">z (north)</text>
  <text x="470.0" y="28.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">Top view: looking down from the North Pole</text>
  <circle cx="470" cy="190" r="120" fill="none" stroke="#ced4da" stroke-width="2"/>
  <line x1="340.0" y1="190.0" x2="610.0" y2="190.0" stroke="#868e96" stroke-width="1.5"/>
  <line x1="470.0" y1="320.0" x2="470.0" y2="50.0" stroke="#868e96" stroke-width="1.5"/>
  <circle cx="470" cy="190" r="91.9" fill="none" stroke="#212529" stroke-dasharray="4 4"/>
  <line x1="470.0" y1="190.0" x2="522.7" y2="114.7" stroke="#212529" stroke-width="2.5"/>
  <line x1="522.7" y1="114.7" x2="522.7" y2="190.0" stroke="#d9480f" stroke-width="2.5"/>
  <line x1="470.0" y1="191.0" x2="522.7" y2="191.0" stroke="#d9480f" stroke-width="2.5"/>
  <circle cx="522.7" cy="114.7" r="5" fill="#d9480f"/>
  <path d="M500,190 A30,30 0 0 0 487.2,165.4" fill="none" stroke="#d9480f" stroke-width="2"/>
  <text x="510.0" y="180.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">λ</text>
  <text x="478.4" y="152.3" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">r</text>
  <text x="530.7" y="158.3" font-family="sans-serif" font-size="14" text-anchor="start" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">y = r sin λ</text>
  <text x="496.4" y="212.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d9480f" stroke="#ffffff" stroke-width="3" paint-order="stroke">x = r cos λ</text>
  <text x="612.0" y="195.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">x (0°E)</text>
  <text x="476.0" y="48.0" font-family="sans-serif" font-size="14" text-anchor="start" fill="#868e96" stroke="#ffffff" stroke-width="3" paint-order="stroke">y (90°E)</text>
  <text x="330.0" y="340.0" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529" stroke="#ffffff" stroke-width="3" paint-order="stroke">x = cos φ cos λ,   y = cos φ sin λ,   z = sin φ</text>
</svg>
