<line x1="550.0" y1="138.0" x2="550.0" y2="162.0" stroke="#222222" stroke-width="2"/>
<text x="550.0" y="182.0" font-family="sans-serif" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal">900</text>
