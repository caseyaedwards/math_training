<text x="436.7" y="212.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">fifth: 3/2 = 702 cents vs 700, off by 1.96</text>
<text x="258.7" y="234.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">major third: 5/4 = 386 cents vs 400, off by 13.7</text>
<text x="720.0" y="212.0" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="normal">semitone</text>
<text x="720.0" y="228.0" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="normal">= 100 cents</text>
