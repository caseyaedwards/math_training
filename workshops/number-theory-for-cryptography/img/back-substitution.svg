<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315" width="760" height="315" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Extended Euclid back substitution for the inverse of 7 mod 40</title>
<rect x="0" y="0" width="760" height="315" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="380.0" y="28.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Extended Euclid by hand: run Euclid down, then substitute back up</text>
<rect x="30.0" y="60.0" width="220.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140.0" y="85.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">40 = 5 x 7 + 5</text>
<line x1="140.0" y1="100.0" x2="140.0" y2="118.0" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30.0" y="120.0" width="220.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140.0" y="145.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">7 = 1 x 5 + 2</text>
<line x1="140.0" y1="160.0" x2="140.0" y2="178.0" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30.0" y="180.0" width="220.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="140.0" y="205.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">5 = 2 x 2 + 1</text>
<text x="140.0" y="258.0" text-anchor="middle" fill="#888888" font-size="14" font-weight="normal">Euclid goes down</text>
<rect x="300.0" y="200.0" width="430.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="515.0" y="225.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">1 = 5 - 2 x 2</text>
<text x="515.0" y="258.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">solve the last line for 1</text>
<rect x="300.0" y="130.0" width="430.0" height="40.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="515.0" y="155.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">1 = 5 - 2 x (7 - 1 x 5) = 3 x 5 - 2 x 7</text>
<line x1="515.0" y1="198.0" x2="515.0" y2="172.0" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="525.0" y="189.0" text-anchor="start" fill="#888888" font-size="12" font-weight="normal">replace 2 using line two</text>
<rect x="300.0" y="60.0" width="430.0" height="40.0" fill="#fde8dd" stroke="#d9480f" stroke-width="1.5"/>
<text x="515.0" y="85.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">1 = 3 x (40 - 5 x 7) - 2 x 7 = 3 x 40 - 17 x 7</text>
<line x1="515.0" y1="128.0" x2="515.0" y2="102.0" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="525.0" y="119.0" text-anchor="start" fill="#888888" font-size="12" font-weight="normal">replace 5 using line one</text>
<line x1="252.0" y1="200.0" x2="298.0" y2="220.0" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4 3"/>
<text x="380.0" y="295.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="normal">Read the top box mod 40: 3 x 40 vanishes, so -17 x 7 = 1. Then 7^-1 = -17 + 40 = 23.</text>
</svg>
