<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Toy Diffie-Hellman exchange between Alice and Bob</title>
<rect x="0" y="0" width="760" height="390" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="380.0" y="28.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Toy Diffie-Hellman: public p = 23, g = 5</text>
<rect x="20" y="50" width="200" height="290" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="120.0" y="76.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Alice</text>
<text x="120.0" y="110.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">a = 6</text>
<text x="120.0" y="130.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">(kept secret)</text>
<text x="120.0" y="175.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">A = 5^6 mod 23 = 8</text>
<text x="120.0" y="255.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">19^6 mod 23</text>
<rect x="50" y="285" width="140" height="36" fill="#fde8dd" stroke="#d9480f" stroke-width="2"/>
<text x="120.0" y="308.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">secret = 2</text>
<rect x="540" y="50" width="200" height="290" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="640.0" y="76.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Bob</text>
<text x="640.0" y="110.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">b = 15</text>
<text x="640.0" y="130.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">(kept secret)</text>
<text x="640.0" y="175.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">B = 5^15 mod 23 = 19</text>
<text x="640.0" y="255.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">8^15 mod 23</text>
<rect x="570" y="285" width="140" height="36" fill="#fde8dd" stroke="#d9480f" stroke-width="2"/>
<text x="640.0" y="308.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">secret = 2</text>
<rect x="270" y="130" width="220" height="130" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="380.0" y="152.0" text-anchor="middle" fill="#888888" font-size="14" font-weight="normal">the wire (Eve sees this)</text>
<line x1="224" y1="185" x2="536" y2="185" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<text x="380.0" y="178.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">A = 8</text>
<line x1="536" y1="215" x2="224" y2="215" stroke="#222222" stroke-width="2" marker-end="url(#arr)"/>
<text x="380.0" y="208.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">B = 19</text>
<text x="380.0" y="245.0" text-anchor="middle" fill="#888888" font-size="13" font-weight="normal">Eve: p, g, A, B only</text>
<text x="380.0" y="372.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">Both reach g^(a·b) = 5^90 mod 23 = 2. Eve must solve 5^x mod 23 = 8 (a discrete log).</text>
</svg>
