<text x="380.0" y="270.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="normal">Both rows hit 1 at k = 8 = phi(15) (and sooner, at k = 4). That is Euler theorem: a^phi(n) = 1 mod n.</text>
<text x="380.0" y="294.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">RSA rides this lap: e times d is one more than a whole number of laps, so m^(ed) lands back on m.</text>
