<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Naive repeated multiplication versus square-and-multiply for exponent 17</title>
<rect x="0" y="0" width="760" height="318" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="380.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Two ways to build the exponent 17</text>
<text x="20.0" y="62.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">naive: multiply by 65 sixteen times</text>
<rect x="20.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="37.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">1</text>
<rect x="62.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="79.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">2</text>
<rect x="104.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="121.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">3</text>
<rect x="146.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="163.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">4</text>
<rect x="188.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="205.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">5</text>
<rect x="230.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="247.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">6</text>
<rect x="272.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="289.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">7</text>
<rect x="314.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="331.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">8</text>
<rect x="356.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="373.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">9</text>
<rect x="398.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="415.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">10</text>
<rect x="440.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="457.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">11</text>
<rect x="482.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="499.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">12</text>
<rect x="524.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="541.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">13</text>
<rect x="566.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="583.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">14</text>
<rect x="608.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="625.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">15</text>
<rect x="650.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="667.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">16</text>
<rect x="692.0" y="74.0" width="34.0" height="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="709.0" y="93.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">17</text>
<text x="20.0" y="126.0" text-anchor="start" fill="#888888" font-size="14" font-weight="normal">16 multiplications. For d = 2753: 2,752 multiplications.</text>
<text x="20.0" y="172.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">square-and-multiply: read 17 = 10001 in binary</text>
<rect x="20.0" y="186.0" width="70.0" height="40.0" fill="#fde8dd" stroke="#d9480f" stroke-width="1.5"/>
<text x="55.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">1</text>
<text x="55.0" y="246.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">start: 65^1</text>
<line x1="92.0" y1="206.0" x2="140.0" y2="206.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arrA)"/>
<rect x="142.0" y="186.0" width="70.0" height="40.0" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="177.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">2</text>
<text x="177.0" y="246.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">square</text>
<line x1="214.0" y1="206.0" x2="262.0" y2="206.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arrA)"/>
<rect x="264.0" y="186.0" width="70.0" height="40.0" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="299.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">4</text>
<text x="299.0" y="246.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">square</text>
<line x1="336.0" y1="206.0" x2="384.0" y2="206.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arrA)"/>
<rect x="386.0" y="186.0" width="70.0" height="40.0" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="421.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">8</text>
<text x="421.0" y="246.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">square</text>
<line x1="458.0" y1="206.0" x2="506.0" y2="206.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arrA)"/>
<rect x="508.0" y="186.0" width="70.0" height="40.0" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="543.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">16</text>
<text x="543.0" y="246.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">square</text>
<line x1="580.0" y1="206.0" x2="628.0" y2="206.0" stroke="#d9480f" stroke-width="1.5" marker-end="url(#arrA)"/>
<rect x="630.0" y="186.0" width="70.0" height="40.0" fill="#fde8dd" stroke="#d9480f" stroke-width="1.5"/>
<text x="665.0" y="212.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">17</text>
<text x="665.0" y="246.0" text-anchor="middle" fill="#888888" font-size="12" font-weight="normal">times 65</text>
<text x="20.0" y="280.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="normal">4 squarings + 1 multiply = 5 steps instead of 16. For d = 2753: about 17 steps instead of 2,752.</text>
<text x="20.0" y="302.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">Each bit doubles the exponent (square); a 1 bit adds one more (multiply).</text>
</svg>
