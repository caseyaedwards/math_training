<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Bar chart of keys moved by hash mod N versus consistent hashing</title>
<rect x="0" y="0" width="720" height="370" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="360.0" y="28.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Keys that move when one node is added (10,000 keys)</text>
<line x1="70.0" y1="300.0" x2="690.0" y2="300.0" stroke="#222222" stroke-width="1.5"/>
<line x1="70.0" y1="300.0" x2="70.0" y2="80.0" stroke="#222222" stroke-width="1.5"/>
