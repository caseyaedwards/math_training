<rect x="245.0" y="124.7" width="50.0" height="175.3" fill="#555555" stroke="#222222" stroke-width="1"/>
<text x="270.0" y="118.7" text-anchor="middle" fill="#222222" font-size="12" font-weight="normal">79.7%</text>
