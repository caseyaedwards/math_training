<text x="60.0" y="261.0" text-anchor="end" fill="#222222" font-size="14" font-weight="normal">20%</text>
<line x1="65.0" y1="212.0" x2="70.0" y2="212.0" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="217.0" text-anchor="end" fill="#222222" font-size="14" font-weight="normal">40%</text>
<line x1="65.0" y1="168.0" x2="70.0" y2="168.0" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="173.0" text-anchor="end" fill="#222222" font-size="14" font-weight="normal">60%</text>
<line x1="65.0" y1="124.0" x2="70.0" y2="124.0" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="129.0" text-anchor="end" fill="#222222" font-size="14" font-weight="normal">80%</text>
<line x1="65.0" y1="80.0" x2="70.0" y2="80.0" stroke="#222222" stroke-width="1.5"/>
<text x="60.0" y="85.0" text-anchor="end" fill="#222222" font-size="14" font-weight="normal">100%</text>
<rect x="95.0" y="152.8" width="50.0" height="147.2" fill="#555555" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="146.8" text-anchor="middle" fill="#222222" font-size="12" font-weight="normal">66.9%</text>
