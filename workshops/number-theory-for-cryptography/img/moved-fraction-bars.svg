<line x1="297.0" y1="256.0" x2="355.0" y2="256.0" stroke="#222222" stroke-width="2" stroke-dasharray="4 2"/>
<text x="298.0" y="322.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">4->5</text>
<rect x="395.0" y="103.5" width="50.0" height="196.5" fill="#555555" stroke="#222222" stroke-width="1"/>
<text x="420.0" y="97.5" text-anchor="middle" fill="#222222" font-size="12" font-weight="normal">89.3%</text>
