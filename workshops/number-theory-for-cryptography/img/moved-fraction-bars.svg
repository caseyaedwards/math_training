<line x1="447.0" y1="275.6" x2="505.0" y2="275.6" stroke="#222222" stroke-width="2" stroke-dasharray="4 2"/>
<text x="448.0" y="322.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">8->9</text>
<rect x="545.0" y="92.5" width="50.0" height="207.5" fill="#555555" stroke="#222222" stroke-width="1"/>
<text x="570.0" y="86.5" text-anchor="middle" fill="#222222" font-size="12" font-weight="normal">94.3%</text>
<rect x="601.0" y="287.0" width="50.0" height="13.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="626.0" y="281.0" text-anchor="middle" fill="#d9480f" font-size="12" font-weight="normal">5.9%</text>
<line x1="597.0" y1="287.0" x2="655.0" y2="287.0" stroke="#222222" stroke-width="2" stroke-dasharray="4 2"/>
<text x="598.0" y="322.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">16->17</text>
<text x="380.0" y="346.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">nodes before -> after</text>
<rect x="100.0" y="44.0" width="14.0" height="14.0" fill="#555555" stroke="#222222" stroke-width="1"/>
<text x="120.0" y="56.0" text-anchor="start" fill="#222222" font-size="12" font-weight="normal">hash % N</text>
<rect x="200.0" y="44.0" width="14.0" height="14.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="220.0" y="56.0" text-anchor="start" fill="#222222" font-size="12" font-weight="normal">ring</text>
<line x1="260.0" y1="51.0" x2="290.0" y2="51.0" stroke="#222222" stroke-width="2" stroke-dasharray="4 2"/>
<text x="296.0" y="56.0" text-anchor="start" fill="#222222" font-size="12" font-weight="normal">ideal 1/(N+1)</text>
</svg>
