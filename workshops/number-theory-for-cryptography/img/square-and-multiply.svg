<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Square-and-multiply trace for 65 to the 17 mod 3233</title>
<rect x="0" y="0" width="760" height="285" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<text x="380.0" y="30.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">65^17 mod 3233 by square-and-multiply: 17 = 10001 in binary</text>
<rect x="20.0" y="60" width="120" height="40" fill="#fde8dd" stroke="#d9480f" stroke-width="2"/>
<text x="80.0" y="86.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">bit 1</text>
<rect x="20.0" y="130" width="120" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="80.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">square, multiply</text>
<text x="80.0" y="172.0" text-anchor="middle" fill="#888888" font-size="13" font-weight="normal">1² · 65</text>
<text x="80.0" y="192.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">= 65</text>
<line x1="80.0" y1="100" x2="80.0" y2="128" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="144.0" y1="165" x2="166.0" y2="165" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="170.0" y="60" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="230.0" y="86.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">bit 0</text>
<rect x="170.0" y="130" width="120" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="230.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">square</text>
<text x="230.0" y="172.0" text-anchor="middle" fill="#888888" font-size="13" font-weight="normal">65²</text>
<text x="230.0" y="192.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">= 992</text>
<line x1="230.0" y1="100" x2="230.0" y2="128" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="294.0" y1="165" x2="316.0" y2="165" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="320.0" y="60" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="380.0" y="86.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">bit 0</text>
<rect x="320.0" y="130" width="120" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="380.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">square</text>
<text x="380.0" y="172.0" text-anchor="middle" fill="#888888" font-size="13" font-weight="normal">992²</text>
<text x="380.0" y="192.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">= 1232</text>
<line x1="380.0" y1="100" x2="380.0" y2="128" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="444.0" y1="165" x2="466.0" y2="165" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="470.0" y="60" width="120" height="40" fill="#ffffff" stroke="#222222" stroke-width="2"/>
<text x="530.0" y="86.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">bit 0</text>
<rect x="470.0" y="130" width="120" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="530.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">square</text>
<text x="530.0" y="172.0" text-anchor="middle" fill="#888888" font-size="13" font-weight="normal">1232²</text>
<text x="530.0" y="192.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">= 1547</text>
<line x1="530.0" y1="100" x2="530.0" y2="128" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="594.0" y1="165" x2="616.0" y2="165" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="620.0" y="60" width="120" height="40" fill="#fde8dd" stroke="#d9480f" stroke-width="2"/>
<text x="680.0" y="86.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">bit 1</text>
<rect x="620.0" y="130" width="120" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
<text x="680.0" y="152.0" text-anchor="middle" fill="#222222" font-size="13" font-weight="normal">square, multiply</text>
<text x="680.0" y="172.0" text-anchor="middle" fill="#888888" font-size="13" font-weight="normal">1547² · 65</text>
<text x="680.0" y="192.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="bold">= 2790</text>
<line x1="680.0" y1="100" x2="680.0" y2="128" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="380.0" y="240.0" text-anchor="middle" fill="#222222" font-size="14" font-weight="normal">All values reduced mod 3233 after every step. 5 squarings + 2 multiplies, never a number above 3233².</text>
<text x="380.0" y="265.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">Result: 2790, the same as pow(65, 17, 3233)</text>
</svg>
