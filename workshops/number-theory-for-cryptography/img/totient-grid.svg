<text x="380.0" y="26.0" text-anchor="middle" fill="#222222" font-size="16" font-weight="bold">Euler totient: count the numbers that share no factor with n</text>
<text x="20.0" y="60.0" text-anchor="start" fill="#222222" font-size="14" font-weight="bold">n = 12:</text>
