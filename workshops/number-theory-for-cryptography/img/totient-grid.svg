<line x1="352.0" y1="270.0" x2="382.0" y2="300.0" stroke="#888888" stroke-width="1"/>
<text x="420.0" y="190.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">cross out multiples of 3: 5 numbers</text>
<text x="420.0" y="216.0" text-anchor="start" fill="#222222" font-size="14" font-weight="normal">cross out multiples of 5: 3 numbers</text>
<text x="420.0" y="242.0" text-anchor="start" fill="#888888" font-size="14" font-weight="normal">15 was crossed twice: add it back</text>
<text x="420.0" y="268.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="normal">15 - 5 - 3 + 1 = 8 left</text>
<text x="420.0" y="294.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">same as (3 - 1)(5 - 1) = 2 x 4 = 8</text>
