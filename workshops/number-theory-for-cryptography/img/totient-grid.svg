<text x="321.0" y="244.0" text-anchor="middle" fill="#888888" font-size="14" font-weight="normal">9</text>
<line x1="306.0" y1="224.0" x2="336.0" y2="254.0" stroke="#888888" stroke-width="1"/>
<rect x="344.0" y="216.0" width="46.0" height="46.0" fill="#ffffff" stroke="#888888" stroke-width="1"/>
