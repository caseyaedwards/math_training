<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="sans-serif" font-size="14">
<title>Correlated failure through a shared availability zone</title>
<rect x="0" y="0" width="700" height="380" fill="#fff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20.0" y="28.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Shared zone: the redundant pair sits inside a single point of failure</text>
<rect x="150.0" y="60.0" width="360.0" height="230.0" rx="10" fill="#fff7f2" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="162.0" y="84.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">availability zone: up 99%</text>
<text x="40.0" y="193.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">in</text>
<line x1="55.0" y1="188.0" x2="210.0" y2="188.0" stroke="#222" stroke-width="2"/>
<line x1="210.0" y1="143.0" x2="210.0" y2="233.0" stroke="#222" stroke-width="2"/>
<line x1="210.0" y1="143.0" x2="300.0" y2="143.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="210.0" y1="233.0" x2="300.0" y2="233.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300.0" y="115.0" width="120.0" height="56.0" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="360.0" y="140.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">replica 1</text>
<text x="360.0" y="158.0" text-anchor="middle" fill="#444" font-size="14" font-weight="normal">own failures 5%</text>
<rect x="300.0" y="205.0" width="120.0" height="56.0" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="360.0" y="230.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">replica 2</text>
<text x="360.0" y="248.0" text-anchor="middle" fill="#444" font-size="14" font-weight="normal">own failures 5%</text>
<line x1="420.0" y1="143.0" x2="460.0" y2="143.0" stroke="#222" stroke-width="2"/>
<line x1="420.0" y1="233.0" x2="460.0" y2="233.0" stroke="#222" stroke-width="2"/>
<line x1="460.0" y1="143.0" x2="460.0" y2="233.0" stroke="#222" stroke-width="2"/>
<line x1="460.0" y1="188.0" x2="560.0" y2="188.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="568.0" y="193.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">out</text>
<text x="20.0" y="330.0" text-anchor="start" fill="#444" font-size="14" font-weight="normal">naive:  1 − (1 − 0.9405)² = 0.996460   (treats the replicas as independent)</text>
<text x="20.0" y="354.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">true:   0.99 × (1 − 0.05²) = 0.987525   (zone in series with the pair)</text>
</svg>
