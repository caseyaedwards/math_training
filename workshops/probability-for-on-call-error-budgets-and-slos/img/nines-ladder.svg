<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="sans-serif" font-size="14">
<title>Nines ladder of downtime per year</title>
<rect x="0" y="0" width="680" height="420" fill="#fff"/>
<text x="20.0" y="30.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Nines ladder: allowed downtime per 365-day year (log scale)</text>
<line x1="110.0" y1="45.0" x2="110.0" y2="375.0" stroke="#222" stroke-width="3"/>
<line x1="140.0" y1="45.0" x2="140.0" y2="375.0" stroke="#222" stroke-width="3"/>
<line x1="110.0" y1="60.0" x2="140.0" y2="60.0" stroke="#222" stroke-width="3"/>
<text x="100.0" y="65.0" text-anchor="end" fill="#222" font-size="14" font-weight="bold">99%</text>
<rect x="160" y="50.0" width="400.0" height="20" fill="#555"/>
<text x="568.0" y="65.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">3.65 days</text>
<line x1="110.0" y1="120.0" x2="140.0" y2="120.0" stroke="#222" stroke-width="3"/>
<text x="100.0" y="125.0" text-anchor="end" fill="#222" font-size="14" font-weight="bold">99.5%</text>
<rect x="160" y="110.0" width="363.1" height="20" fill="#555"/>
<text x="531.1" y="125.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">1.83 days</text>
<line x1="110.0" y1="180.0" x2="140.0" y2="180.0" stroke="#222" stroke-width="3"/>
<text x="100.0" y="185.0" text-anchor="end" fill="#222" font-size="14" font-weight="bold">99.9%</text>
<rect x="160" y="170.0" width="277.3" height="20" fill="#d9480f"/>
<text x="445.3" y="185.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">8.76 hours</text>
<line x1="110.0" y1="240.0" x2="140.0" y2="240.0" stroke="#222" stroke-width="3"/>
<text x="100.0" y="245.0" text-anchor="end" fill="#222" font-size="14" font-weight="bold">99.95%</text>
<rect x="160" y="230.0" width="240.4" height="20" fill="#555"/>
<text x="408.4" y="245.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">4.38 hours</text>
<line x1="110.0" y1="300.0" x2="140.0" y2="300.0" stroke="#222" stroke-width="3"/>
<text x="100.0" y="305.0" text-anchor="end" fill="#222" font-size="14" font-weight="bold">99.99%</text>
<rect x="160" y="290.0" width="154.7" height="20" fill="#555"/>
<text x="322.7" y="305.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">52.56 minutes</text>
<line x1="110.0" y1="360.0" x2="140.0" y2="360.0" stroke="#222" stroke-width="3"/>
<text x="100.0" y="365.0" text-anchor="end" fill="#222" font-size="14" font-weight="bold">99.999%</text>
<rect x="160" y="350.0" width="32.0" height="20" fill="#555"/>
<text x="200.0" y="365.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">5.26 minutes</text>
<text x="20.0" y="402.0" text-anchor="start" fill="#444" font-size="14" font-weight="normal">Each rung down adds a nine. Each full nine cuts the downtime by 10x.</text>
</svg>
