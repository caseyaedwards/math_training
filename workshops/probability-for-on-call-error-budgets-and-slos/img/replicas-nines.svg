<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="14">
<title>Nines gained per independent replica</title>
<rect x="0" y="0" width="640" height="360" fill="#fff"/>
<text x="20.0" y="28.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Independent 99% replicas: each one adds two nines (on paper)</text>
<line x1="70.0" y1="300.0" x2="600.0" y2="300.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="305.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">0</text>
<line x1="70.0" y1="250.0" x2="600.0" y2="250.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="255.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">2</text>
<line x1="70.0" y1="200.0" x2="600.0" y2="200.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="205.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">4</text>
<line x1="70.0" y1="150.0" x2="600.0" y2="150.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="155.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">6</text>
<line x1="70.0" y1="100.0" x2="600.0" y2="100.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="105.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">8</text>
<line x1="70.0" y1="50.0" x2="600.0" y2="50.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="55.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">10</text>
<rect x="110.0" y="250.0" width="80.0" height="50.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="150.0" y="242.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">0.99</text>
<text x="150.0" y="322.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">N = 1</text>
<rect x="235.0" y="200.0" width="80.0" height="100.0" rx="0" fill="#d9480f" stroke="none" stroke-width="0"/>
<text x="275.0" y="192.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">0.9999</text>
<text x="275.0" y="322.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">N = 2</text>
<rect x="360.0" y="150.0" width="80.0" height="150.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="400.0" y="142.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">0.999999</text>
<text x="400.0" y="322.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">N = 3</text>
<rect x="485.0" y="100.0" width="80.0" height="200.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="525.0" y="92.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">0.99999999</text>
<text x="525.0" y="322.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">N = 4</text>
<line x1="70.0" y1="300.0" x2="600.0" y2="300.0" stroke="#222" stroke-width="2"/>
<line x1="70.0" y1="50.0" x2="70.0" y2="300.0" stroke="#222" stroke-width="2"/>
<text x="22" y="175.0" text-anchor="middle" fill="#222" transform="rotate(-90 22 175.0)">number of nines</text>
<text x="20.0" y="352.0" text-anchor="start" fill="#444" font-size="14" font-weight="normal">Availability = 1 − 0.01^N. Correlated failures cap this long before N = 4.</text>
</svg>
