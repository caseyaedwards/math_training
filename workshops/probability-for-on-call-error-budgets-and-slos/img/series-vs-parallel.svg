<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="sans-serif" font-size="14">
<title>Series versus parallel availability block diagram</title>
<rect x="0" y="0" width="680" height="400" fill="#fff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20.0" y="32.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Series: every block must be up</text>
<text x="40.0" y="93.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">in</text>
<line x1="55.0" y1="88.0" x2="150.0" y2="88.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="150" y="60" width="120" height="56" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="210.0" y="85.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">A</text>
<text x="210.0" y="103.0" text-anchor="middle" fill="#444" font-size="14" font-weight="normal">0.99</text>
<line x1="270.0" y1="88.0" x2="350.0" y2="88.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="350" y="60" width="120" height="56" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="410.0" y="85.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">B</text>
<text x="410.0" y="103.0" text-anchor="middle" fill="#444" font-size="14" font-weight="normal">0.99</text>
<line x1="470.0" y1="88.0" x2="545.0" y2="88.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="560.0" y="93.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">out</text>
<text x="20.0" y="150.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">A × B = 0.99 × 0.99 = 0.9801  (worse than either block)</text>
<line x1="20.0" y1="175.0" x2="660.0" y2="175.0" stroke="#ddd" stroke-width="1"/>
<text x="20.0" y="205.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Parallel: any one block is enough</text>
<text x="40.0" y="298.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">in</text>
<line x1="55.0" y1="293.0" x2="110.0" y2="293.0" stroke="#222" stroke-width="2"/>
<line x1="110.0" y1="253.0" x2="110.0" y2="333.0" stroke="#222" stroke-width="2"/>
<line x1="110.0" y1="253.0" x2="250.0" y2="253.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<line x1="110.0" y1="333.0" x2="250.0" y2="333.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<rect x="250" y="225" width="120" height="56" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="310.0" y="250.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">A</text>
<text x="310.0" y="268.0" text-anchor="middle" fill="#444" font-size="14" font-weight="normal">0.99</text>
<rect x="250" y="305" width="120" height="56" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="310.0" y="330.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">B</text>
<text x="310.0" y="348.0" text-anchor="middle" fill="#444" font-size="14" font-weight="normal">0.99</text>
<line x1="370.0" y1="253.0" x2="450.0" y2="253.0" stroke="#222" stroke-width="2"/>
<line x1="370.0" y1="333.0" x2="450.0" y2="333.0" stroke="#222" stroke-width="2"/>
<line x1="450.0" y1="253.0" x2="450.0" y2="333.0" stroke="#222" stroke-width="2"/>
<line x1="450.0" y1="293.0" x2="520.0" y2="293.0" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
<text x="530.0" y="298.0" text-anchor="start" fill="#222" font-size="14" font-weight="normal">out</text>
<text x="470.0" y="235.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">1 − (1 − A)(1 − B)</text>
<text x="470.0" y="255.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="normal">= 1 − 0.01 × 0.01</text>
<text x="470.0" y="275.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">= 0.9999</text>
<text x="20.0" y="392.0" text-anchor="start" fill="#444" font-size="14" font-weight="normal">Series multiplies the up-chances. Parallel multiplies the down-chances.</text>
</svg>
