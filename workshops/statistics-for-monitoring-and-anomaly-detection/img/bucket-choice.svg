<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="sans-serif" font-size="14">
<title>p99 estimates under four bucket layouts</title>
<rect x="0" y="0" width="700" height="300" fill="#fff"/>
<text x="20.0" y="28.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Same 1,005 requests, four bucket layouts, four p99 answers</text>
<rect x="200.0" y="60.0" width="377.5" height="28.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="190.0" y="79.0" text-anchor="end" fill="#222" font-size="13" font-weight="normal">coarse 100/500/1000 (4)</text>
<text x="585.5" y="79.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">494.4</text>
<rect x="200.0" y="108.0" width="295.8" height="28.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="190.0" y="127.0" text-anchor="end" fill="#222" font-size="13" font-weight="normal">doubling 25..3200 (9)</text>
<text x="503.8" y="127.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">387.3</text>
<rect x="200.0" y="156.0" width="270.9" height="28.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="190.0" y="175.0" text-anchor="end" fill="#222" font-size="13" font-weight="normal">x1.25 from 10 ms (31)</text>
<text x="478.9" y="175.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">354.8</text>
<rect x="200.0" y="204.0" width="276.4" height="28.0" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="190.0" y="223.0" text-anchor="end" fill="#222" font-size="13" font-weight="normal">linear 50 ms steps (21)</text>
<text x="484.4" y="223.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">361.9</text>
<line x1="469.6" y1="48.0" x2="469.6" y2="242.0" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="469.6" y="260.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">exact p99 353.1</text>
<text x="20.0" y="288.0" text-anchor="start" fill="#444" font-size="14" font-weight="normal">Narrow buckets near the quantile you care about shrink the error.</text>
</svg>
