<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif" font-size="14">
<title>Linear interpolation inside a histogram bucket</title>
<rect x="0" y="0" width="700" height="400" fill="#fff"/>
<text x="20.0" y="28.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">histogram_quantile draws a straight line inside the bucket</text>
<line x1="70.0" y1="320.0" x2="620.0" y2="320.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="325.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">0</text>
<line x1="70.0" y1="266.0" x2="620.0" y2="266.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="271.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">20</text>
<line x1="70.0" y1="212.0" x2="620.0" y2="212.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="217.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">40</text>
<line x1="70.0" y1="158.0" x2="620.0" y2="158.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="163.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">60</text>
<line x1="70.0" y1="104.0" x2="620.0" y2="104.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="109.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">80</text>
<line x1="70.0" y1="50.0" x2="620.0" y2="50.0" stroke="#ddd" stroke-width="1"/>
<text x="62.0" y="55.0" text-anchor="end" fill="#222" font-size="14" font-weight="normal">100</text>
<line x1="70.0" y1="320.0" x2="70.0" y2="325.0" stroke="#222" stroke-width="1"/>
<text x="70.0" y="342.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">0</text>
<line x1="180.0" y1="320.0" x2="180.0" y2="325.0" stroke="#222" stroke-width="1"/>
<text x="180.0" y="342.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">100</text>
<line x1="290.0" y1="320.0" x2="290.0" y2="325.0" stroke="#222" stroke-width="1"/>
<text x="290.0" y="342.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">200</text>
<line x1="400.0" y1="320.0" x2="400.0" y2="325.0" stroke="#222" stroke-width="1"/>
<text x="400.0" y="342.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">300</text>
<line x1="510.0" y1="320.0" x2="510.0" y2="325.0" stroke="#222" stroke-width="1"/>
<text x="510.0" y="342.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">400</text>
<line x1="620.0" y1="320.0" x2="620.0" y2="325.0" stroke="#222" stroke-width="1"/>
<text x="620.0" y="342.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">500</text>
<line x1="70.0" y1="320.0" x2="620.0" y2="320.0" stroke="#222" stroke-width="2"/>
<line x1="70.0" y1="50.0" x2="70.0" y2="320.0" stroke="#222" stroke-width="2"/>
<polyline points="70.0,320.0 180.0,158.0 290.0,77.0 510.0,55.4" fill="none" stroke="#222" stroke-width="3"/>
<circle cx="180.0" cy="158.0" r="5" fill="#222" stroke="none" stroke-width="0"/>
<text x="188.0" y="176.0" text-anchor="start" fill="#222" font-size="13" font-weight="normal">le=100: 60</text>
<circle cx="290.0" cy="77.0" r="5" fill="#222" stroke="none" stroke-width="0"/>
<text x="298.0" y="95.0" text-anchor="start" fill="#222" font-size="13" font-weight="normal">le=200: 90</text>
<circle cx="510.0" cy="55.4" r="5" fill="#222" stroke="none" stroke-width="0"/>
<text x="518.0" y="73.4" text-anchor="start" fill="#222" font-size="13" font-weight="normal">le=400: 98</text>
<rect x="290.0" y="55.4" width="220.0" height="21.6" rx="0" fill="#fbe3d6" stroke="none" stroke-width="0"/>
<polyline points="290.0,77.0 510.0,55.4" fill="none" stroke="#222" stroke-width="3"/>
<line x1="70.0" y1="63.5" x2="427.5" y2="63.5" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="427.5" y1="63.5" x2="427.5" y2="320.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="427.5" cy="63.5" r="6" fill="#d9480f" stroke="none" stroke-width="0"/>
<text x="78.0" y="55.5" text-anchor="start" fill="#d9480f" font-size="13" font-weight="bold">rank 95 (p95 of 100)</text>
<text x="433.5" y="310.0" text-anchor="start" fill="#d9480f" font-size="14" font-weight="bold">325 ms</text>
<text x="345.0" y="366.0" text-anchor="middle" fill="#222" font-size="14" font-weight="normal">latency (ms)</text>
<text x="20" y="185.0" text-anchor="middle" fill="#222" transform="rotate(-90 20 185.0)">cumulative requests</text>
<text x="20.0" y="392.0" text-anchor="start" fill="#444" font-size="13" font-weight="normal">200 + 200 × (95 − 90) / 8 = 325. The real requests can all sit at 201 ms. The formula cannot tell.</text>
</svg>
