<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="sans-serif" font-size="14">
<title>Variance as the average squared distance from the mean</title>
<rect x="0" y="0" width="700" height="330" fill="#fff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20.0" y="28.0" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Variance: square each distance to the mean, then average the squares</text>
<line x1="60.0" y1="110.0" x2="660.0" y2="110.0" stroke="#222" stroke-width="1.5"/>
<line x1="60.0" y1="106.0" x2="60.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="60.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">8</text>
<line x1="110.0" y1="106.0" x2="110.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="110.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">9</text>
<line x1="160.0" y1="106.0" x2="160.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="160.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">10</text>
<line x1="210.0" y1="106.0" x2="210.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="210.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">11</text>
<line x1="260.0" y1="106.0" x2="260.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="260.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">12</text>
<line x1="310.0" y1="106.0" x2="310.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="310.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">13</text>
<line x1="360.0" y1="106.0" x2="360.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="360.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">14</text>
<line x1="410.0" y1="106.0" x2="410.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="410.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">15</text>
<line x1="460.0" y1="106.0" x2="460.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="460.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">16</text>
<line x1="510.0" y1="106.0" x2="510.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="510.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">17</text>
<line x1="560.0" y1="106.0" x2="560.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="560.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">18</text>
<line x1="610.0" y1="106.0" x2="610.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="610.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">19</text>
<line x1="660.0" y1="106.0" x2="660.0" y2="114.0" stroke="#222" stroke-width="1"/>
<text x="660.0" y="132.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">20</text>
<line x1="360.0" y1="50.0" x2="360.0" y2="110.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="360.0" y="46.0" text-anchor="middle" fill="#d9480f" font-size="14" font-weight="bold">mean 14</text>
<line x1="360.0" y1="96.0" x2="210.0" y2="96.0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="360.0" y1="89.0" x2="260.0" y2="89.0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="360.0" y1="75.0" x2="410.0" y2="75.0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="360.0" y1="68.0" x2="560.0" y2="68.0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="260.0" cy="110.0" r="6" fill="#222" stroke="none" stroke-width="0"/>
<circle cx="410.0" cy="110.0" r="6" fill="#222" stroke="none" stroke-width="0"/>
<circle cx="210.0" cy="110.0" r="6" fill="#222" stroke="none" stroke-width="0"/>
<circle cx="360.0" cy="110.0" r="6" fill="#222" stroke="none" stroke-width="0"/>
<circle cx="560.0" cy="110.0" r="6" fill="#222" stroke="none" stroke-width="0"/>
<rect x="60.0" y="212.0" width="28.0" height="28.0" rx="0" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
<text x="74.0" y="260.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">x = 12</text>
<text x="74.0" y="278.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(-2)² = 4</text>
<rect x="158.0" y="226.0" width="14.0" height="14.0" rx="0" fill="#fbe3d6" stroke="#555" stroke-width="1.2"/>
<text x="165.0" y="260.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">x = 15</text>
<text x="165.0" y="278.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(+1)² = 1</text>
<rect x="248.0" y="198.0" width="42.0" height="42.0" rx="0" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
<text x="269.0" y="260.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">x = 11</text>
<text x="269.0" y="278.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(-3)² = 9</text>
<rect x="360.0" y="240.0" width="1.0" height="1.0" rx="0" fill="#e6e6e6" stroke="#555" stroke-width="1.2"/>
<text x="360.5" y="260.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">x = 14</text>
<text x="360.5" y="278.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(+0)² = 0</text>
<rect x="450.0" y="184.0" width="56.0" height="56.0" rx="0" fill="#fbe3d6" stroke="#555" stroke-width="1.2"/>
<text x="478.0" y="260.0" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">x = 18</text>
<text x="478.0" y="278.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(+4)² = 16</text>
<text x="20.0" y="310.0" text-anchor="start" fill="#444" font-size="13" font-weight="normal">4 + 1 + 9 + 0 + 16 = 30.   30 / 5 = 6 = variance.   √6 ≈ 2.449 = standard deviation.</text>
</svg>
